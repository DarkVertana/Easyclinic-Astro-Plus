editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The report library and its plan rules come from Easy Clinic's own live pages and pricing, down to the
    Enterprise warehouse for large chains and the separate access levels a chain sets for its owned,
    franchised, mobile and associate clinics.
  readsMachineWritten: >-
    The pain-block scenes (the 10pm branch total, the accountant's first week of the month, the evening
    list) could sit on any dashboard page and need an owner's read-aloud, and the page has no dashboard
    screenshot, no owner's quote of its own and fewer than half of the spec's eight morning numbers.

