sections:
  - discriminant: painBlocks
    value:
      id: where-the-numbers-hide
      heading: Where an owner's numbers come from today
      intro: >-
        Most owners who go looking for healthcare dashboard software already have the numbers somewhere.
        The trouble is when they arrive, and who had to put them together.
      items:
        - heading: The branch total arrives at 10pm
          body: >-
            Each branch manager adds up the day after closing and sends the total on WhatsApp. One forgets
            and another sends the cash but not the card payments. You hear about Tuesday's problem on
            Wednesday afternoon.
          fix: >-
            On Premium and Enterprise every branch bills in the same Easy Clinic system, so revenue for each
            branch and for the whole group is on the dashboard as the bills are raised. Nobody sends a
            total, because nobody has to add one up.
          href: /features/multi-location/
          linkLabel: How one system runs every branch
        - heading: The accountant rebuilds the month from the receipt book
          body: >-
            The first week of every month goes on typing receipts into a spreadsheet so the books can be
            balanced, and the profit and loss for March is ready somewhere in the middle of April.
          fix: >-
            Financial reports are built for balancing the books daily, weekly, monthly and quarterly, from
            the bills the desk has already raised. They export to Excel and PDF, so the accountant starts
            from the figures instead of the receipt book.
        - heading: The evening list is a guess until the desk closes
          body: >-
            The appointment book shows who booked. At six in the evening it cannot tell you which of those
            patients have been seen and which visits have been billed, so the desk works it out at closing
            from memory and the receipt book.
          fix: >-
            The appointment dashboard shows each visit's status and its billing while the day is running,
            so the desk closes on a list everyone could already see.
          href: /features/appointment-scheduling/
          linkLabel: See how scheduling works

  - discriminant: featureRows
    value:
      id: morning-view
      heading: The numbers on the owner's morning screen
      intro: >-
        What the clinic KPI dashboard shows, row by row. The dashboards show data in real time, so the
        figures move as the desk bills and the doctors see patients. Where a number needs a particular
        plan or module, the row says so.
      items:
        - heading: Revenue for each branch and for the group
          body: >-
            Reports run across locations and across departments, so each branch's revenue reads beside the
            others and beside the group's total, updated as the bills are raised. A clinic with one location
            runs the same reports across its departments.
          bullets:
            - A day-end financial report for each clinic and for the whole organisation, covering every transaction
          plan: premium
          link:
            label: Read how multi-location clinics work
            href: /features/multi-location/
        - heading: The day's appointments, visit by visit
          body: >-
            The appointment dashboard lists the day's appointments with the status of each visit and whether
            it has been billed, updated as the day runs. At closing, the day-end report sums the day up for
            the record and for staff analysis.
          plan: professional
          link:
            label: See how scheduling and reminders work
            href: /features/appointment-scheduling/
        - heading: Staff performance and incentive plans
          body: >-
            Performance reports track staff productivity. If you pay an incentive or a commission, the plan
            is set up for each user in Easy Clinic, doctors included, so the payout rules and the reports that
            track the work sit in the same system.
        - heading: The books, from the day to the quarter
          body: >-
            Financial reports come in formats for balancing the books daily, weekly, monthly and quarterly,
            with profit and loss analysis and the cash balance. Financial accounting comes with Enterprise.
            Finding the money that never reached a bill is the job of revenue management.
          link:
            label: Find unbilled orders and cash variance
            href: /features/revenue-management/
        - heading: Stock, where the clinic runs a pharmacy
          body: >-
            The inventory dashboard shows current stock levels, stock movement, cost of goods sold and the
            items that move fast or slowly, along with seasonal trends. Expiry reports show what is close to
            expiry. It comes with pharmacy and inventory, part of Enterprise or a module added to
            Professional or Premium.
          link:
            label: See how the pharmacy counts stock
            href: /features/pharmacy-and-inventory/
        - heading: Claim status, where the clinic bills insurers
          body: >-
            The claims dashboard shows the status of every claim across all your locations, updated as each
            claim moves. It comes with insurance claims, part of Enterprise or a module added to
            Professional or Premium, and the insurance claims page covers how a claim is built and sent.
          link:
            label: Read how a claim is built and sent
            href: /features/insurance-claims/
        - heading: Clinical cases across every branch
          body: >-
            For chains, a bird's-eye dashboard follows clinical cases across locations, and chief medical
            officers can oversee how the clinical SOPs are followed. Clinical SOP tracking across branches
            comes with Enterprise.
          plan: enterprise
          link:
            label: See how a clinic chain runs on Easy Clinic
            href: /solutions/clinic-chain/

  - discriminant: dataTable
    value:
      id: report-library
      heading: The report library, by who opens it
      intro: >-
        The dashboards and reports cover clinical, administrative, inventory and financial data. This is
        the library grouped by the person who reads each report, with the plan or module it comes from.
      caption: Easy Clinic reports and dashboards by role, with the plan or module each comes from
      columns:
        - Who opens it
        - What they read
        - Where it comes from
      rows:
        - - Owner or director
          - Revenue across branches and departments, patient statistics, the day's appointments and the day-end financial report for each clinic and for the whole organisation
          - Dashboards and reports, on every plan; more than one branch from Premium
        - - Doctor
          - The patient's vitals and lab results drawn as trend charts, and the auto-generated patient summary
          - The EMR, with lab reports in the chart from Premium
        - - Front desk
          - The day's appointments with each visit's status and billing, and the day-end appointment report
          - Appointment scheduling, on every plan
        - - Pharmacist
          - Stock levels and stock movement, fast- and slow-moving items, cost of goods sold and expiry reports
          - Pharmacy and inventory, part of Enterprise or a module on Professional or Premium
        - - Accountant
          - Financial reports for book balancing from the day to the quarter, profit and loss analysis, the cash balance and exports to Excel and PDF
          - Finance and billing reports; financial accounting with Enterprise
        - - Chief medical officer of a chain
          - Clinical cases across locations, and adherence to the clinical SOPs
          - Clinical SOP tracking, on Enterprise
      note: >-
        Reports are access-controlled: each login sees only the reports its role allows. The reception
        login that comes with every plan cannot open the EMR.

  - discriminant: featureRows
    value:
      id: getting-reports-out
      heading: Getting the numbers to the people who need them
      layout: bento
      items:
        - heading: Reports that go out by themselves
          icon: send
          body: >-
            Reports can be generated and distributed automatically, so the people who read them have the
            latest figures without anyone compiling them by hand.
        - heading: Filters, and reports of your own
          icon: search
          body: >-
            Dashboards can be set to the metrics that matter most to your clinic, and reports take filters
            and search parameters of your own, so they show what you need to see. Where the library does not
            have the report you need, a custom report can be created for it.
        - heading: Excel and PDF
          icon: download
          body: >-
            Reports export to Excel and PDF, for the accountant who works in a spreadsheet and for keeping a
            copy of each month's figures after the month has closed.
        - heading: Who sees which report
          icon: lock
          body: >-
            Each login sees the reports its role allows, and access can be narrowed further by department.
            A chain can give its owned clinics, franchisees, mobile medical units and associate clinics
            different levels of access, and audit logs keep a record of what each user did.
        - heading: On your phone
          icon: smartphone
          body: >-
            The dashboards open on a phone or a tablet as well as the office computer. Easy Clinic is cloud
            software and does not run fully offline today, so the phone needs a connection to show the
            day's figures.

  - discriminant: prose
    value:
      id: data-warehouse
      heading: On Enterprise, a data warehouse for large clinic chains
      width: wide
      link:
        label: See what Enterprise includes
        href: /pricing/#compare
      body: >-
        Enterprise includes a dedicated reporting server with custom business analytics, and a data
        warehouse meant for large clinic chains. Data from Easy Clinic, and from other sources such as
        databases, files, web services or APIs, is moved into the warehouse or a data lake through ETL
        (extract, transform, load) processes. Which data moves, and how often, is set in the ETL processes
        defined for your organisation.


        Connecting Power BI to the warehouse is scoped as integration work, under the integrations and
        custom features that come with Enterprise. On Professional and Premium, the reports and dashboards
        are the ones inside Easy Clinic, and they export to Excel or PDF when you need the figures somewhere
        else.

  - discriminant: splitContent
    value:
      id: real-time-insights
      heading: 'Real-Time Data Visualization: 30 Second Insights'
      centerHeading: true
      mediaFirst: true
      featureList: true
      narrowMedia: true
      alignTop: true
      body: |-
        Access critical data instantly with real-time visualization. Our module offers quick access to patient statistics, financial reports, and operational metrics, enabling prompt and informed decisions.

        ### Customizable Dashboards
        Tailor your dashboards to focus on the metrics that matter most to your clinic. Whether it's patient care outcomes or financial performance, get a clear view at a glance.

        ### Automated Reporting
        Automate the generation and distribution of reports, ensuring that your team always has the latest data without the hassle of manual compilation.
      media:
        kind: screenshot
        src: ../../assets/images/solutions/3.png
        alt: 'An Easy Clinic diagnosis dashboard: visits by city, the top diagnoses across clinic cities, referral status, diagnoses by age group and gender, and visits by screening test and satisfaction score'
        frame: none

  - discriminant: splitContent
    value:
      id: actionable-intelligence
      heading: Transforming Data into Actionable Intelligence
      centerHeading: true
      mediaFirst: true
      featureList: true
      narrowMedia: true
      alignTop: true
      body: |-
        Easy Clinic gives the flexibility to define own ETL processes (extract, transform, load) via Azure data pipelines that can help you save time, reduce errors, and improve data quality and consistency. ETL tools can also handle complex data transformations.

        ### Enterprise-Scale End-to-End Data Integration
        Seamlessly consolidate data from multiple sources like databases, files, web services, or APIs, to a common destination, such as a data warehouse, a data lake, or a cloud platform using Azure Data Factory and SQL-based ETL/ELT processes. Our robust pipelines ensure accurate and timely data flow for real-time decision-making.

        ### Use ETL for Visual Insights with Power BI
        Leverage ETL tools to extract, transform, and load data from multiple sources like sales, marketing, or finance into a centralized data warehouse. Connect this refined data to Power BI for creating customizable dashboards and reports, enabling you to visualize insights through charts, graphs, and tables. Share and collaborate on these insights with stakeholders to drive better decision-making.

        ### Reliable Data for Better Insights
        Enhance data quality by eliminating errors, duplicates, and inconsistencies. Centralize and standardize data from multiple sources, ensuring seamless accessibility and accurate reporting.
      media:
        kind: screenshot
        src: ../../assets/images/solutions/4.png
        alt: 'An Easy Clinic advanced visit dashboard: visits by city, the top chief complaints, top ordered lab tests, top prescribed medications and the top diagnoses across age groups'
        frame: none

  - discriminant: splitContent
    value:
      id: operational-efficiency
      heading: Enhanced Operational Efficiency Streamline Your Workflow
      centerHeading: true
      featureList: true
      narrowMedia: true
      alignTop: true
      body: |-
        Reduce manual tasks and streamline operations with automated data management and reporting, allowing your staff to focus on patient care.

        ### Improve Clinic Performance
        Use our tools to continuously monitor and enhance your clinic's performance, ensuring that you meet and exceed your operational goals.

        ### Success Story: Qualitas Health
        Qualitas Health, one of Malaysia's largest clinic chains, improved their operational efficiency and patient satisfaction by implementing Easy Clinic's Reports and Dashboard module.
      media:
        kind: screenshot
        src: ../../assets/images/solutions/14_Dashboard (1).jpg
        alt: 'Easy Clinic dashboards: patients by specialisation and by week, the top four diagnoses, today''s report and invoices by status'
        frame: none

  - discriminant: splitContent
    value:
      id: existing-systems
      heading: Seamless Integration Compatible with Existing Systems
      centerHeading: true
      featureList: true
      narrowMedia: true
      alignTop: true
      body: |-
        Our Reports and Dashboard module integrates seamlessly with your existing EMR and practice management systems, ensuring a smooth transition without disrupting your operations.

        ### Multi-Platform Access
        Access reports and dashboards from any device, be it desktop, tablet, or mobile. Stay connected to your clinic's data wherever you are.
      media:
        kind: screenshot
        src: ../../assets/images/solutions/2-2.png
        alt: 'An Easy Clinic finance dashboard: revenue, outstanding amount and total visits, revenue by service, and revenue by day of the week'
        frame: none

  - discriminant: splitContent
    value:
      id: scalability
      heading: Scalability for Growth Adapt to Your Needs
      centerHeading: true
      mediaFirst: true
      featureList: true
      narrowMedia: true
      alignTop: true
      body: |-
        Whether you're a single clinic or a large network, our module scales with your growth. Add new clinics and users easily as your practice expands.

        ### Future-Ready
        Built with future growth in mind, our system supports the addition of new features and capabilities, ensuring your clinic stays ahead of the curve.
      media:
        kind: screenshot
        src: ../../assets/images/solutions/1-8.png
        alt: 'Revenue distribution across the top five clinics of a chain in Malaysia, as a pie chart and a table of total visit revenue per clinic'
        frame: none

faqHeading: Questions clinic owners ask about reports
faq:
  - question: Can I see last month's revenue for each branch?
    answer: >-
      Yes, on Premium or Enterprise, where every branch bills in the same Easy Clinic system and reports run
      across locations and departments. Filters and search parameters of your own narrow a report to the
      period you need, and a clinic with one location on Professional runs the same reports across its
      departments.
  - question: Do I need the Enterprise plan to get dashboards?
    answer: >-
      No. Dashboards and reports come with every plan, from {price:usd.professional.annual} per doctor per
      month billed annually ({price:inr.professional.annual} in India). Enterprise adds a dedicated
      reporting server with custom analytics and the data warehouse, and it is priced on a quote.
  - question: Can I use Power BI with Easy Clinic?
    answer: >-
      Only as Enterprise integration work: Enterprise includes a dedicated reporting server with custom
      analytics and a data warehouse meant for large clinic chains, and connecting Power BI to it is scoped
      per project under integrations and custom features. On Professional and Premium, export the reports
      to Excel instead.
  - question: Are the numbers on the dashboard real time?
    answer: >-
      Yes, the dashboards inside Easy Clinic show data in real time, so the figures change as the desk
      bills and the doctors record visits. On Enterprise, how often data moves into the warehouse is set
      in the ETL processes defined for your organisation.
  - question: Can I build reports of my own?
    answer: >-
      Yes, you can set dashboards to the metrics that matter to your clinic and narrow reports with
      filters and search parameters of your own. Where the library does not have the report you need, a
      custom report can be created for it, and Enterprise adds a dedicated reporting server with custom
      business analytics.
  - question: Can I export reports to Excel?
    answer: >-
      Yes, reports export to Excel and to PDF. The accountant can work on the figures in a spreadsheet
      without retyping them, and a PDF copy of each month's reports can be kept as the record.
  - question: Is there an audit trail of who did what?
    answer: >-
      Yes, Easy Clinic keeps audit logs for each user and an audit trail for all key transactions. The cash
      till and stock adjustments carry audit trails of their own, and on Enterprise the workflow manager
      records which user completed each step, with the date and time.
  - question: Can I check the dashboard on my phone?
    answer: >-
      Yes, the dashboards open on a phone or a tablet as well as a computer. Easy Clinic is cloud software
      and does not run fully offline today, so the phone needs a mobile data or Wi-Fi connection to show
      the day's figures.

