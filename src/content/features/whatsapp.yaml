editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The flows come from EasyClinic's own live pages and price list (the video-consult prescription that
    says the consult was remote, feedback the clinic keeps internal or shares, the enrolment link, the
    clinic's own branded channel, WhatsApp on Premium with SMS and email on Professional), and the
    Kenya note on English and Swahili templates is a local fact.
  readsMachineWritten: >-
    The pain-block scenes and the phone-versus-platform comparison could sit on any WhatsApp vendor's
    page and need a front-desk read-aloud, and the page has no named clinic, no clinic's own words about
    WhatsApp, no measured outcome and no screenshot of a real message thread yet.

notes:
  - 'Title 56 characters (spec 4.1 row, unchanged). Meta description reworded from the 4.1 wording to lead with the head keyword and say WhatsApp starts on Premium, without implying every flow it names is a Premium feature; 150 characters, no tokens.'
  - 'Grounding (live pages re-fetched 2026-09-26 with curl and tag stripping): /features/ "Communication - All in one with WhatsApp, SMS, Email & Push Notification" (message templates and events per module; automated appointment reminders, digital prescriptions, invoices and receipts; "custom integrations for WhatsApp, Email, and SMS, enabling clinics to send messages through their own branded channels"; "AI-Powered Two-Way Messaging ... automating standard patient communication and significantly reducing the need for phone calls"), /features/ EMR (prescriptions "via print or WhatsApp, SMS, or Email"), billing (receipts and invoices on WhatsApp, SMS and email), teleconsult (prescriptions sent on WhatsApp, SMS or email with a remote-consultation disclaimer) and portal sections (feedback through WhatsApp, SMS or the portal, shared publicly or kept internal; "communication numbers can all be custom branded"; "Automated WhatsApp Assistant"); /patient-engagement-at-easyclinic/ (enrolment links by SMS and WhatsApp, registration on the patient''s phone); /pricing/ ("WhatsApp Communication" under Premium); /kenyademo/ (WhatsApp among Kenya integrations, "Post Visit Automation"). Lab reports on WhatsApp from spec 4.1 and 5.11 (lab). Cura AI answering WhatsApp from spec 4.1 (/ai row).'
  - 'General WhatsApp statements re-checked on 2026-09-26 against Meta''s pages: Business Messaging Policy (opt-in after the person gives their number; business chooses the opt-in method within applicable law; honour opt-out requests on or off WhatsApp; separate opt-in by message category and clear opt-out instructions as best practice; blocks and reports can limit sending; "Don''t use WhatsApp for telemedicine or to send or request any health related information, if applicable regulations prohibit distribution of such information to systems that do not meet heightened requirements"); Template fundamentals (reviewed on creation and after editing, only APPROVED templates send, status can change on usage and quality feedback, Meta does not translate templates, categories authentication, marketing and utility, category factors into pricing); Pricing (per-message charging for delivered template messages since 1 July 2025, rates by category and recipient country calling code, template messages the only type outside the customer service window, Meta may update pricing only on the first day of each quarter); Messaging limits (new business portfolios limited to 250 unique users outside the service window, raised with volume and quality). WhatsApp Help Center and 2025-26 reports show the Business app now meters business broadcasts beyond a free allowance in some regions, so the page says ordinary chats carry no per-message charge rather than that the app is free, and the broadcast-list row was removed. The page makes no statement about which Business Platform messages are free.'
  - 'Left out for lack of a confirmed fact: per-message costs in any country and whether utility is cheaper than marketing in each market (rate cards load by script and were not read); how WhatsApp message charges are billed to the clinic (included in Premium or passed on); the default sender when the clinic has no own-number integration (EasyClinic''s number or another), and which plan the own-number integration needs; who writes and submits templates to Meta for the clinic; template approval time (Meta states a review window, left out on instruction); whether replies land in a front-desk inbox and when Cura AI hands a conversation to staff; which plan includes the AI reception; which plan includes the feedback request and the registration link (live /pricing/ lists "Patient Engagement, Patient Portal & App" under Enterprise, not confirmed for these two); a per-patient WhatsApp opt-out switch in the software; reminder timing; message languages beyond the Kenya English and Swahili template point; country availability (skipped per brief); a measured no-show reduction (unknown).'
  - 'Plan tags: rows tagged Premium are the ones whose underlying feature is on Professional or Premium in plans.yaml and whose WhatsApp sending is Premium. The feedback, registration and two-way rows carry no tag and a bullet saying WhatsApp needs Premium, the same pattern as /features/patient-engagement/, because the plan behind the underlying feature is not known.'
  - 'Groups FAQ links the ranking post /whatsapp-groups-for-patient-care/ (live, Akshay Chandel, 14 April 2026: guided diabetes and pregnancy groups with clinic moderation, individual clinical issues moved to private consultation). The post is not built in this site yet, so the link renders as text until it is imported.'
  - 'No testimonial: none is about WhatsApp and all are placed. Proof is the badges variant without counts (review counts unknown); add a front-desk quote or the spec 12 "WhatsApp reminder thread as the patient sees it" screenshot as the proof when either exists. No heroMedia and no media objects until then.'
  - 'Cannibalisation (4.5.3): this page owns the API, templates and message costs; the consent paragraph names India''s DPDP Act and Kenya''s Data Protection Act only in general terms and sends country-by-country consent to /features/patient-engagement/#consent-by-country (spec 5.11). Receipts get one row and link to /features/billing/, which owns invoices and GST. The AI reception is one row linking /ai/, which owns AI receptionist terms (4.5.1).'
  - 'Spec 6.5 pass: one local fact (English and Swahili templates in Kenya), admissions of limits (the scope box, the Professional plan line, WhatsApp''s own rule on health information), prices as tokens; there is no named person and no measured outcome on the page, which the editorial pass records.'
  - 'Audit 2026-09-27: the platform comparison bullet and the FAQ "What does each WhatsApp message cost?" now say that from 1 October 2026 Meta also charges for free-form replies inside the 24-hour window after the first 1,000 a month on each business number. Source: Meta''s pricing page (https://developers.facebook.com/documentation/business-messaging/whatsapp/pricing, fetched with curl on 2026-09-27: per-message charging for service messages from 1 October 2026, a free monthly tier of 1,000 service messages per business phone number, and charging for utility messages in response to users within the window). This supersedes the 2026-09-26 note that the page makes no statement about which Business Platform messages are free, and matches the glossary and /leveraging-sms-and-whatsapp-for-patient-engagement/.'
  - 'Audit 2026-09-27: added a contentCards "Further reading" section listing the published posts this page owns, with each post''s own label and summary. 3 of them (/leveraging-sms-and-whatsapp-for-patient-engagement/, /personalised-whatsapp-messages/, /whatsapp-post-surgery-care/) had no inbound link but /blog/, and links.related is full (8 of 8).'
