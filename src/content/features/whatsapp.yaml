faqHeading: Questions clinics ask about WhatsApp
faq:
  - question: Which plan includes WhatsApp messages?
    answer: >-
      WhatsApp messages come with Premium and Enterprise. Premium costs {price:usd.premium.annual} per
      doctor per month billed annually ({price:inr.premium.annual} in India) and includes everything in
      Professional, so SMS and email reminders come with it too. Professional, at
      {price:usd.professional.annual} per doctor per month billed annually, sends reminders by SMS and
      email but not on WhatsApp.
  - question: Can the messages come from my clinic's own WhatsApp number?
    answer: >-
      Yes: EasyClinic supports custom integrations that send WhatsApp messages through your clinic's own
      branded channel, so patients see them under your clinic's name. A number used this way has to be
      registered with Meta on the WhatsApp Business Platform.
  - question: Does every message need Meta's approval?
    answer: >-
      Every message the clinic starts does: a reminder or a report notice goes out on a template Meta has
      reviewed and approved, with blanks the software fills in. A reply to a patient who has written to
      the clinic in the last 24 hours can be written freely, because it falls inside WhatsApp's customer
      service window.
  - question: What does each WhatsApp message cost?
    answer: >-
      It depends on WhatsApp's own pricing: Meta charges for each template message delivered, at a rate
      set by the message's category and the country code of the patient's phone number. From 1 October
      2026 Meta also charges for free-form replies inside the 24 hours after the patient writes, beyond
      the first 1,000 a month on each business number. A reminder or a report notice is normally a utility
      message and an offer is a marketing message, and Meta sets a separate rate for each category. Meta
      can change its rates on the first day of each quarter and publishes them on its
      [WhatsApp pricing page](https://developers.facebook.com/documentation/business-messaging/whatsapp/pricing).
  - question: Can patients reply to the messages?
    answer: >-
      Yes, the messaging is two-way. When a patient writes back, Cura AI, the AI reception in EasyClinic,
      answers the standard questions, so fewer of them become phone calls to the front desk.
  - question: What if a patient asks us to stop the WhatsApp messages?
    answer: >-
      Stop sending them WhatsApp messages, whichever way they ask: WhatsApp's business policy requires a
      business to honour every request to opt out, made on WhatsApp or anywhere else. SMS and email come
      with every plan, so a patient who still wants reminders by those can have them. A patient who
      blocks or reports the number instead counts against it, and Meta can limit how many messages a
      number sends when many patients do.
  - question: Should we start a WhatsApp group for our patients?
    answer: >-
      Only for shared education and support, such as a diabetes group or a pregnancy group that the
      clinic moderates, and never for one patient's own results or medicines. In an ordinary group every
      member sees what the others write, which is why EasyClinic sends each patient's reminders and
      reports to that patient alone. Our post on
      [WhatsApp groups for patient care](/whatsapp-groups-for-patient-care/) looks at how a diabetes or
      pregnancy group can be run.

