title: 'WhatsApp Reminders and Messaging for Clinics: EasyClinic'
metaDescription: 'WhatsApp for clinics: reminders, prescriptions, reports and feedback sent from your clinic software on approved templates. WhatsApp starts on Premium.'
h1: WhatsApp reminders and messaging, built in
linkLabel: WhatsApp reminders and messages
eyebrow: WhatsApp
openingAnswer: >-
  EasyClinic sends appointment reminders, prescriptions, lab reports and feedback requests to patients
  on WhatsApp from the clinic software, on message templates approved by Meta, instead of from a phone
  on the front desk. WhatsApp messages come with the Premium plan at {price:usd.premium.annual} per
  doctor per month billed annually ({price:inr.premium.annual} in India), and the Professional plan
  sends reminders by SMS and email.
summary: >-
  Reminders, prescriptions, reports and feedback requests sent to patients on WhatsApp by the clinic
  software, on Meta-approved templates, from the Premium plan.
