sections:
  - discriminant: painBlocks
    value:
      id: whatsapp-at-the-desk
      heading: What WhatsApp at the front desk looks like today
      intro: >-
        If your clinic already talks to patients on WhatsApp, it probably runs through one phone and one
        person's spare minutes.
      items:
        - heading: The reminders go out when someone remembers
          body: >-
            At six the receptionist starts sending tomorrow's reminders from her own phone, typing each
            one between the walk-ins and the cash counter. On a busy day she gets halfway down the list,
            and some of the patients who heard nothing do not turn up.
          fix: >-
            EasyClinic sends the reminder from the appointment itself, using a message template the
            clinic sets up once. SMS and email reminders come with every plan, and WhatsApp from
            Premium.
          href: /features/appointment-scheduling/
          linkLabel: How appointment reminders work
        - heading: The clinic's patients are on one person's phone
          body: >-
            Years of patient chats and phone numbers sit on the handset the front desk uses, which is
            often somebody's own. When that person leaves the clinic, the chats leave with them.
          fix: >-
            The messages go out from the clinic software rather than from anyone's handset, and each
            patient's number stays on the patient's record in EasyClinic.
        - heading: The report goes as a photo of a printout
          body: >-
            The lab report is printed and photographed on the desk, slightly skewed, with the edge of the
            next patient's file in the shot, then sent from the desk phone.
          fix: >-
            Once the report is on the patient's record, the report itself goes to the patient on
            WhatsApp instead of a photo of it. Lab reports come with the Premium plan.
          href: /features/lab/
          linkLabel: How lab results reach the record

  - discriminant: featureRows
    value:
      id: what-goes-out
      heading: What goes out on WhatsApp, and when
      intro: >-
        Each message starts from something that happens in EasyClinic, such as a booking, a finished
        prescription, a report on the record or a settled bill. Any message on WhatsApp needs the
        Premium plan; on Professional the reminders go by SMS and email.
      items:
        - heading: The appointment reminder
          body: >-
            The reminder goes out before the visit with the details filled in from the appointment. The
            clinic sets up the wording, and the event that sends it, once in EasyClinic's message
            templates, and every booking after that gets its reminder without anyone at the desk picking
            up a phone.
          plan: premium
          link:
            label: Read how appointment reminders work
            href: /features/appointment-scheduling/
        - heading: The prescription, after the consult
          body: >-
            When the doctor finishes the prescription, it can go to the patient on WhatsApp as well as on
            paper, so the dosage instructions are on the patient's phone at the pharmacy counter. A
            prescription from a video consult goes the same way, with a line saying the consultation was
            held remotely.
          plan: premium
          link:
            label: See how the prescription is written
            href: /features/emr/
        - heading: The lab report, when it is ready
          body: >-
            Once the result is on the patient's record, the report can go to the patient on WhatsApp, so
            the patient does not come back to the desk to collect a printout. Lab reports come with
            Premium; running an in-house lab is lab management, on Enterprise or as an add-on.
          plan: premium
          link:
            label: See how lab results reach the chart
            href: /features/lab/
        - heading: The receipt, after payment
          body: >-
            The payment receipt and the invoice can go to the patient on WhatsApp once the bill is
            settled, so a patient who wants them on the phone does not wait for a printout. They can go
            by SMS or email as well.
          plan: premium
          link:
            label: See how billing works
            href: /features/billing/
        - heading: A feedback request after the visit
          body: >-
            After the visit the patient can be asked for feedback on WhatsApp, and the clinic decides
            whether each response is shared publicly or kept internal.
          bullets:
            - Sending it on WhatsApp needs the Premium plan
        - heading: A registration link before the first visit
          body: >-
            A new patient can be sent a registration link on WhatsApp and fill in their details on their
            own phone before arriving, so the front desk is not typing them in while the queue waits.
          bullets:
            - Sending the link on WhatsApp needs the Premium plan
          link:
            label: Read how enrolment links work
            href: /features/patient-engagement/
        - heading: When a patient writes back
          body: >-
            The messaging runs both ways. When a patient replies or asks a question, Cura AI, the AI
            reception in EasyClinic, answers the standard questions, so fewer of them turn into phone
            calls to the front desk.
          bullets:
            - Replies on WhatsApp need the Premium plan
          link:
            label: Read what Cura AI does
            href: /ai/

  - discriminant: splitTable
    value:
      id: api-or-phone
      heading: What is the difference between the WhatsApp Business API and a phone on the desk?
      intro: >-
        The WhatsApp app on a phone is built for a person typing messages; the WhatsApp Business
        Platform, usually called the API, is built for software sending them. Ordinary chats on the app
        need no approval and carry no per-message charge, but every reminder depends on someone
        remembering to send it. The platform sends from the clinic software on a schedule, using
        templates Meta has approved, and Meta charges for each template message it delivers.
      left:
        title: A phone on the front desk
        items:
          - Someone types or forwards each message, one patient at a time, when there is a free minute.
          - The chats and the patients' numbers sit on that handset, and on a personal phone they leave with its owner.
          - Ordinary chats need no template approval and carry no per-message charge.
      right:
        title: The WhatsApp Business Platform
        items:
          - The software sends the message from the appointment or the report, on a schedule.
          - Messages the clinic starts use templates Meta has approved; free-form replies fit inside the 24 hours after the patient last wrote.
          - Meta charges for each template message delivered, at a rate set by the kind of message and the country code of the patient's number, and from 1 October 2026 for free-form replies after the first 1,000 a month on each business number.
          - Meta limits how many different patients a new sender can message in a day, and raises the limit as it sends more messages that are received well.
      note: >-
        EasyClinic sends WhatsApp messages from the clinic software on approved templates, so the
        platform's rules on templates and Meta's per-message rates apply to the rest of this page.

  - discriminant: flowDiagram
    value:
      id: template-approval
      heading: How a WhatsApp message template gets approved
      intro: >-
        Any message a clinic starts, such as a reminder or a report notice, goes out on a template. This
        is Meta's process for every business on the WhatsApp Business Platform, and it is the same for a
        clinic on EasyClinic.
      steps:
        - label: Write the template
          body: >-
            The wording of one kind of message, with blanks the software fills in for each patient, such
            as the patient's name and the appointment time.
        - label: Give it a category
          body: >-
            Utility for messages about a visit the patient already has, such as a reminder or a report;
            marketing for offers and campaigns. Meta's price for each message depends on the category.
        - label: Meta reviews it
          body: >-
            Every template is reviewed when it is created and again when it is edited. An approved
            template can be sent; a rejected one cannot, and is reworded and submitted again.
        - label: The software sends it
          body: >-
            Once approved, the template goes out for each patient with the blanks filled in from the
            appointment or the record.
        - label: Meta keeps watching
          body: >-
            A template's status can change after approval, based on how patients receive it, so one that
            many patients block or report can be paused.
      examples:
        - country: Kenya
          body: >-
            Meta does not translate templates, so a clinic that writes to patients in English and Swahili
            needs an approved template in each language.

  - discriminant: prose
    value:
      id: consent
      heading: Consent before the first message, and a way to stop
      body: >-
        **Ask first.** WhatsApp's business messaging policy lets a business message a person only after
        the person has given it their number and agreed to receive its messages. How to ask is left to
        the business, within the law of its country. At a clinic the natural moment is registration: ask
        which messages the patient wants, keeping reminders and reports apart from offers as Meta
        suggests, and keep the answer with the patient's details.


        **Make stopping easy.** Meta asks businesses to explain how to opt out and to honour every request
        to stop, whether it arrives on WhatsApp or across the desk. A patient who cannot find the way out is
        more likely to block or report the number instead, and Meta can limit how many messages a number with many
        blocks may send.


        **The law where you practise applies as well.** India's Digital Personal Data Protection Act, 2023
        and Kenya's Data Protection Act, 2019 each set rules for consent to use a patient's personal data.
        WhatsApp's own policy also says not to send or ask for health information on WhatsApp where the
        law requires a system held to a higher standard for it. The
        [patient engagement page](/features/patient-engagement/#consent-by-country) covers consent country
        by country.
      width: measure

  - discriminant: scopeBox
    value:
      id: limits
      heading: What to know before you switch WhatsApp on
      variant: limits
      items:
        - >-
          WhatsApp messages come with Premium and Enterprise. On Professional, at
          {price:usd.professional.annual} per doctor per month billed annually, reminders go by SMS and
          email.
        - >-
          A patient without WhatsApp, or one who has asked you to stop, can still be reached by SMS or
          email if they agreed to those, and both come with every plan.
        - >-
          Each new kind of message needs a template Meta has approved before its first send, and Meta can
          reject a template or pause one that patients block.
        - Meta sets WhatsApp's per-message rates and can change them on the first day of any quarter.

