editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The capability rows follow EasyClinic's own live feature pages closely, down to counter sales that
    skip the appointment queue, separate units for buying and selling, split orders and free samples at
    goods receipt, and transfers tracked from sent to received, and the plan rules come from plans.yaml.
  readsMachineWritten: >-
    The pain-block scenes (the Saturday stockout, the expired boxes behind the new delivery, the forty
    tablets short) are invented illustrations that could sit on any pharmacy software page and need a
    pharmacist's read-aloud, and the page has no named customer or measured stock figure of its own
    because no pharmacy testimonial or stockout number has a source yet.

notes:
  - 'Title 55 characters; meta rewritten from the spec 4.1 wording ("Dispense from the prescription, track batch and expiry, and move stock between branches"), a group of three, to lead with the head keyword and name two things.'
  - 'Grounding: capability statements come from the live /features/ page (inventory, logistics and pharmacy sections, repeated word for word on /clinic-chain-software/, /hospital-opd-nursing-home-software/ and /polyclinic-software/), the /dental-emr-software/ and /dermatology-emr-software/ FAQs (dental materials; creams, skincare products and supplies), and /kenyademo/ ("Prescription reaches pharmacy instantly", "Pharmacy stock dispensed without billing"). The blog posts /integrated-pharmacy-management/ and /clinic-inventory-management-system/ were read; nothing is used from them that /features/ does not also say.'
  - 'Left out for lack of a confirmed fact: the 67% stockout reduction, the 45-day shortage prediction and "28 organisations" (no public source, facts.md section 4); "over 100 graphical dashboards"; the anonymous clinic-chain case study and its outcomes; the "Label Printing and Regulatory Compliance" and "ensuring compliance" wording, and the blog claims about CDSCO and state drug control guidelines (compliance status unknown); supplier "integration options for real-time checks" (integration status unknown); tag-only items with no description on the live page (home delivery, online payment, ADR alert, drug information, brand substitution); FIFO and FEFO wording and multilingual labels (blog only).'
  - 'Fact check 26 September 2026 (live /features/, /clinic-chain-software/, /dental-emr-software/, /dermatology-emr-software/ and /kenyademo/ re-fetched): removed batch and expiry "recorded when the goods arrive" (live says only batch prioritisation, expiry reports and warnings at sale); removed a purchase-order approval step "before it is sent" (live approval wording covers inventory movements generally and is kept in the stock-counts row); "returns to the supplier" cut to "returns"; "who can receive stock and who can adjust it" and "an audit record of who made it" cut back to the live role-based access and audit-log wording; "the creams and skincare products it sells" cut to "keeps"; "formulary set by head office" removed from the clinic-chain related link (not on the live site); "any sale" for OTC products cut to "at the time of dispensing" (live wording); summary no longer implies stock transfers come with the module.'
  - 'Narcotics register FAQ (spec 5.11) left out: the live pages state only "warnings and checks for dispensing regulated or controlled medications", not a register, so controlled medicines appear as a warning and a check in the dispensing row, the flow and one FAQ.'
  - 'Plans follow plans.yaml: Enterprise includes pharmacy, inventory and stock transfers; Professional and Premium can add pharmacy and inventory as a module. The module price is unknown and no price is stated for it. Whether Premium with the module includes stock transfers between branches is not known, so transfers are tied to Enterprise without saying other plans lack them.'
  - 'The reorder suggestion is called an "AI assistant" on the live pages. The page describes what it does and does not name it Cura AI, since the naming decision covers documentation and CuraPilot only.'
  - 'Tax: the page says items are marked taxable or non-taxable and the tax you define is applied (live "custom tax definition module"). GST, invoices and invoice formats belong to /features/billing/ (spec 4.5 rule 2), which the retail-counter row links to. No tax compliance claim.'
  - 'Price lists by payer and location (on the live inventory list) are left to /features/revenue-management/ and /features/billing/.'
  - 'No heroMedia and no media objects: screenshots do not exist yet. When the spec 12 captures exist, add "Pharmacy dispensing from a prescription with batch and expiry, one expiring batch flagged" as hero and "Stock transfer between branches and reorder alert" to the transfers row.'
  - 'Proof is the badges variant because no testimonial speaks about the pharmacy and every testimonial is placed on another page. Replace with a pharmacist or clinic-chain quote when one is collected.'
  - 'Audit 2026-09-27: added a contentCards "Further reading" section listing the published posts this page owns, with each post''s own label and summary. 1 of them (/inventory-management-for-rural-clinics/) had no inbound link but /blog/, and links.related is full (8 of 8).'
