faqHeading: Questions clinic owners ask about the pharmacy
faq:
  - question: Do I need the Enterprise plan to run a pharmacy on EasyClinic?
    answer: >-
      No. Enterprise includes pharmacy and inventory along with stock transfers between branches, and a
      clinic on Professional or Premium can add pharmacy and inventory to its plan as a module.
      Enterprise has no list price, and each clinic gets a quote for it.
  - question: Can the pharmacy sell to someone who has not seen the doctor?
    answer: >-
      Yes. The pharmacy works on its own for counter sales and refill collection, so the patient does not
      go through the EMR or the appointment queue, and over-the-counter products can be added at the
      time of dispensing. Whether a medicine may be sold without a prescription is for the pharmacist to
      decide under your country's rules, and the software adds a warning and a check before a controlled
      medicine is dispensed.
  - question: How does it warn us about medicines close to expiry?
    answer: >-
      At the counter and in reports. The pharmacist gets a warning at the time of sale when a batch is
      near its expiry date, and the batch closest to its date is put forward to dispense first. Expiry
      reports list what is due to expire, so it can be used or returned before the date passes.
  - question: Can we move stock between branches, or from a central store?
    answer: >-
      Yes, on Enterprise. Stock moves between branches, or from a central warehouse out to the clinics,
      on a transfer that is tracked until the receiving store books it in, with an audit log for each
      step.
  - question: Does it work with barcodes?
    answer: >-
      Yes. You can scan the barcode already printed on a supplier's pack, or generate your own barcode
      for items that come without one, and deliveries can be received by scanning or by importing a
      file.
  - question: Does it predict when a medicine will run out?
    answer: >-
      It warns you before a medicine runs out, by suggesting a reorder level and an order quantity for
      each item from past use and lead times, then alerting you when stock falls below that level. We do
      not quote a figure for stockouts prevented, because we have none with a published source.
  - question: Can we load our current stock without typing it in item by item?
    answer: >-
      Yes. Stock can be uploaded or adjusted in bulk from a file, so a pharmacy going live loads its
      opening stock in one go, with products grouped in categories and fields of your own.

