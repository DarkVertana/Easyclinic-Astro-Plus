sections:
  - discriminant: painBlocks
    value:
      id: where-the-stock-goes
      heading: Where a clinic pharmacy loses track
      intro: >-
        A dispensary run from a stock book and handwritten slips tends to go wrong in the same places.
        Under each one is what the pharmacy module does about it.
      items:
        - heading: The pharmacist reads the prescription twice
          body: >-
            The patient brings a handwritten slip to the counter, and the pharmacist squints at the dose
            and types the medicines into a second system, or into nothing at all. Sometimes the medicine
            the doctor wrote is the one the shelf ran out of on Tuesday.
          fix: >-
            The prescription written in the EMR appears on the pharmacy screen, so nothing is retyped.
            The doctor sees the stock on hand while prescribing and can pick an alternative before the
            patient reaches the counter.
          href: /features/emr/
          linkLabel: How the prescription is written
        - heading: The antibiotic runs out on a Saturday
          body: >-
            Nobody noticed the last strips going, because the stock book was last updated on Friday
            evening. The order goes out on Monday, and until the delivery comes, patients are sent to
            the chemist down the road.
          fix: >-
            The stock count is kept in real time as medicines are dispensed, and an alert goes out when
            an item drops below its reorder level. The purchase order for it is raised in one click.
        - heading: Expired boxes turn up at the back of the shelf
          body: >-
            The new delivery went in front of the older batch, and the stocktake finds that batch three
            months past its date. The loss is written off, and nobody can say which batch it was.
          fix: >-
            Each batch is tracked with its expiry date. The counter gets a warning at the time of sale
            when a batch is near expiry, and the batch closest to its date is put forward to dispense
            first.
        - heading: The stock book and the shelf disagree
          body: >-
            The count is forty tablets short, and there is no way to tell whether they went out without
            a bill, were given away, were damaged or were taken.
          fix: >-
            Every stock transaction goes into an audit log, and an adjustment for a shortfall or a
            damaged pack needs authorisation.

  - discriminant: flowDiagram
    value:
      id: prescription-to-shelf
      heading: From the prescription back to the shelf
      intro: >-
        One medicine's path through the clinic, and the checks the software makes on the way.
      steps:
        - label: Prescribe
          body: The doctor writes the prescription in the EMR and sees what is in stock while prescribing.
        - label: Reach the counter
          body: The prescription goes to the pharmacy screen by itself, without being printed or retyped.
        - label: Dispense
          body: The pharmacist dispenses from the prescription on screen, and the batch nearest its expiry date is put forward first.
          check: A warning and a check for controlled medicines
        - label: Bill
          body: The medicines dispensed go on the patient's bill and come off the stock count.
        - label: Reorder
          body: When an item falls below its reorder level, an alert goes out and a purchase order is raised in one click.
          check: Suggested reorder quantity
        - label: Receive
          body: The delivery is received by scanning barcodes or importing a file, and a split order or a shortfall is recorded at goods receipt.

  - discriminant: featureRows
    value:
      id: how-it-works
      heading: Pharmacy stock, dispensed from the prescription
      intro: >-
        What the pharmacy and inventory module does, row by row. It comes with Enterprise, and on
        Professional or Premium it is added as a module. Where a row needs Enterprise, the row says so.
      items:
        - heading: Dispensing from the doctor's prescription
          body: >-
            The prescription written in the EMR goes to the pharmacy automatically, so the pharmacist
            dispenses from what the doctor wrote rather than from a slip. The stock count is kept in real
            time, and the doctor, while prescribing, sees what is in stock and can search for an
            alternative.
          bullets:
            - Labels printed at the counter
            - A warning and a check before a controlled medicine is dispensed
            - Refills tracked for the next visit, with a reminder to the patient to collect them
            - Over-the-counter products added at the time of dispensing
          link:
            label: See how the prescription is written
            href: /features/emr/
        - heading: Batch expiry and reorder points
          body: >-
            Each batch is tracked with its expiry date. At the time of sale the counter is warned about
            a batch close to expiry, and the batch nearest its date is put forward first. Items carry a
            reorder level, and the software suggests the level and the quantity to order from past use
            and lead times.
          bullets:
            - Alerts when stock runs low or a batch nears its expiry date
            - Expiry reports
        - heading: Suppliers and purchase orders
          body: >-
            Your suppliers are kept in EasyClinic, and a requisition or purchase order is raised in one
            click, checked against reorder levels, preferred suppliers, purchase prices and lead times.
            When the delivery comes, it is received by scanning barcodes or importing a file, and goods
            receipt handles split orders and shortfalls. Free samples and returns are recorded too.
          bullets:
            - Separate units for buying and selling, such as a box bought and a strip sold
            - Stock uploaded or adjusted in bulk from a file
        - heading: Stock transfers between branches
          body: >-
            When one branch runs short of a medicine that another holds in quantity, a transfer takes it
            off one branch's count and puts it on the other's. Stock can also go out from a central
            warehouse to the clinics, and each transfer is tracked from the moment it leaves one store
            until the other books it in, with an audit log for each step.
          bullets:
            - Transfers recorded at the sending and the receiving branch
            - More than one warehouse, with central distribution to the branches
          plan: enterprise
          media:
            kind: screenshot
            src: ../../assets/images/screens/stock-transfer-between-branches.png
            alt: Stock transfer form between two branches
            caption: A transfer between branches.
            frame: none
            origin: old-site
            capturedOn: '2024-01'
          link:
            label: Read how EasyClinic runs a chain
            href: /solutions/clinic-chain/
        - heading: The retail counter and tax on medicines
          body: >-
            The pharmacy can serve a patient who has not seen the doctor today, and a patient collecting
            a refill does not wait in the appointment queue. The pharmacist can look up the price of any
            item and give a patient a quote before the visit. Each item is marked taxable or
            non-taxable, and the tax you define for it is applied when it is sold.
          link:
            label: See how the bill is made
            href: /features/billing/
        - heading: Materials for dental and dermatology clinics
          body: >-
            The inventory also holds what a clinic uses rather than sells. A dental clinic keeps its
            materials and supplies in it, and a dermatology clinic its creams and skincare products
            alongside its medicines. When a consumable is part of a service or a package, it
            comes off the stock count automatically with that service, so nobody enters it
            separately.
          bullets:
            - Products grouped in categories, with fields of your own
            - Consumables deducted with the service they belong to
        - heading: Stock counts and adjustments
          body: >-
            A stock count can be quick or full, and the count can be repeated before any variance is
            finalised. Adjustments for shortfalls, excess stock, expired products and damaged products
            need authorisation and leave an audit log, and staff roles, such as a pharmacist role,
            decide what each person can do in the inventory.
          bullets:
            - Reports on stock movement, stock levels, cost of goods sold and fast- and slow-moving items
            - Approval steps with more than one level, where you want them
          link:
            label: See the reports and dashboards
            href: /features/reports-and-dashboards/

  - discriminant: scopeBox
    value:
      id: limits
      heading: Two things to know before you plan around it
      variant: limits
      items:
        - >-
          **It is a module on Professional and Premium.** Neither plan includes pharmacy and inventory as
          it comes. You add the module, or move to Enterprise, which includes it along with stock
          transfers between branches and has no list price, so each clinic gets a quote.
        - >-
          **It does not run fully offline today.** EasyClinic is cloud software, so a pharmacy counter on
          an unreliable line needs a backup connection, such as a mobile hotspot, before the first day of
          dispensing.

  - discriminant: proofBlock
