secondaryKeywords:
  - clinic inventory management software
  - in-house pharmacy software
  - medical inventory software
title: 'Pharmacy and Inventory Software for Clinics: EasyClinic'
metaDescription: >-
  Pharmacy management software for clinics: dispense from the doctor's prescription and track each
  batch to its expiry, at one clinic or across branches.
h1: Run your in-house pharmacy from the same system
linkLabel: Pharmacy and inventory
eyebrow: Pharmacy and inventory
openingAnswer: >-
  EasyClinic is pharmacy management software for clinics that keep their own dispensary: the pharmacist
  dispenses from the doctor's prescription on screen, and every batch is tracked to its expiry date.
  Doctors on EasyClinic write {fact:prescriptionsDaily} prescriptions a day between them, and pharmacy
  and inventory come with the Enterprise plan or as a module added to Professional or Premium.
summary: >-
  Dispense from the doctor's prescription and track each batch to its expiry, as a module on
  Professional and Premium or with Enterprise, which also includes stock transfers between branches.
