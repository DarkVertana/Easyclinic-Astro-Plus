editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    Little beyond the sourced product facts: the reception login that bills but cannot use the EMR comes
    from EasyClinic's pricing page and M-Pesa at the Kenyan desk from its Kenya demo page, and the GST
    line on consultations and pharmacy sales is the rule an Indian clinic owner meets at the counter.
  readsMachineWritten: >-
    The desk scenes, such as the 11:40 consult and the ₹2,000 advance in a diary, are labelled
    illustrations rather than a named clinic's day, and with no named person, no measured billing figure,
    no screenshot and no customer quote about billing, the page does not meet the spec 6.5 pass until a
    front-desk read-aloud and one real customer case are added.

notes:
  - 'Title 48 characters; meta 152 characters (no tokens). Spec 4.1 title ("Clinic Billing Software with GST Invoicing"), meta ("GST invoices, OPD bills...") and H1 ("Billing and GST invoicing for your clinic") all drop "GST invoicing": src/data/regulators/in-gst.yaml has state null and the live India page calls GST "being expanded", so a GST-invoicing claim in the title would imply a status nobody has confirmed. The title leads with the head keyword instead; GST appears on the page only as a description of the rule (tax table, FAQ 1) and in the scope item that makes no claim about it. Restore "GST invoicing" to the title and H1 once in-gst has a state and a date.'
  - 'Cannibalisation (4.5 rule 2): this page owns invoices, tax on the bill, payments at the desk and the till mechanics. Leakage, unbilled visits, cash-variance tracing, price lists by branch and payer, denials and ageing stay on /features/revenue-management/ (linked from the price row, the end-of-day row and the day-close FAQ). Payer linking, co-payment rules, claim submission, TPA, HMO and SHA stay on /features/insurance-claims/ (one row and one scope item here). WhatsApp templates, API and message costs stay on /features/whatsapp/ (4.5 rule 3); here WhatsApp is only the channel a receipt goes out on. "Revenue cycle management" does not appear.'
  - 'Grounding (live pages re-fetched 2026-09-26, curl plus tag strip): /features/ billing section: one-click billing for receptionists; online and offline payments with the balance visible at once; part payments, advance payments, refunds and invoice voiding "with proper authorization"; payment amortisation for package treatments; service list with prices adjustable without regenerating billing records; custom tax definition for taxable and non-taxable items; financial reports for daily, weekly, monthly and quarterly book balancing and profit and loss; receipts and invoices sent by WhatsApp, SMS and email; discount authorisation, write-off and void control; CPOE billing; billing workflows for consultations, pharmacy, lab tests, procedures, vaccinations and teleconsultations; till management balancing payment modes with an audit trail; integration with third-party financial software; multi-payer billing in a single visit. /features/ inventory and pharmacy sections: EMR prescription to billing and pharmacy dispensing; OTC products added at the time of dispensing; custom package treatments billable in one visit or across multiple visits. /features/ lab section: tests added to the invoice on sample collection. /revenue-management/: lab and procedure work orders becoming invoice lines as they are processed; new prices reflected in billing at once; cash registers that track cash in and out for daily reconciliation, with role-based access and end-of-day reports of cash transactions; end-of-day financial reports clinic- and organisation-wide; role-based access to reports; automated generation and distribution of reports. /appointment-scheduling-at-easy-clinic/: 1-click billing and payments from the appointment screen. /pricing/ FAQ (facts.md): reception licence bills and takes payment but cannot use the EMR or issue prescriptions; a clinical assistant or nurse role can complete some EMR records. /kenyademo/ ("M-Pesa handles cash", "M-Pesa received ... Balance zero") per facts.md and the brief: M-Pesa at the desk only; no M-Pesa integration state is stated.'
  - 'Plan tags only where plans.yaml is explicit: billing and payments (Professional, so every plan), package treatments and online payments (Premium), pharmacy and insurance claims (Enterprise, and add-ons on Professional and Premium per plans.yaml addons). Lab management and financial accounting are named in body text with their plans. Receipts by SMS or email carry no plan; the receipt row has no tag because a Premium tag would say SMS and email receipts need Premium. Which plan carries cash registers, till management, billing workflows and automated reports is not stated, so those rows carry no tag.'
  - 'Editor pass 2026-09-26 removed or rephrased: "Most clinics that move their billing to software..." (unsourced); "each cash register closes the day with its own end-of-day report", "a register for each counter", "each counter closes on its own" and the two-counters FAQ (the live page says only that cash register access is set by role and that end-of-day reports snapshot the cash transactions, not that each counter has its own register or close); "the receipt prints at the desk" (printing is stated for prescriptions and labels, not receipts); "in cash or by card" (the live till list says "cash, credit, and online payments", and "credit" may not mean card); "reach the owner on a schedule" (the live page says automated generation and distribution); "the consult fee already on it" (not stated); "the payment sits against the bill" for advances (an advance can come before the bill); "Refunds and cancelled invoices go through only with approval from someone you have authorised" (the live wording is "with proper authorization"); the package mechanics (now the live wording: billable in one visit or across several, with payment amortisation); every "status is kept on the trust page" line and the eTIMS FAQ that pointed there (/trust/ is a draft with placeholder statuses and its link is hidden in production, as on /features/insurance-claims/); the "gateways with the state of each on the integrations page" sentence and link (/integrations/ has no content entry and no status exists); the Premium tag on the receipt row. The eTIMS FAQ was replaced with the reception-login question, and the counters FAQ with how the desk closes the day. Illustrations are labelled in the pain-block intro and the tax example starts "For example".'
  - 'Links: the Kenya row links to /kenyademo/ (published) instead of /emr-software-in-kenya/ (draft, hidden in production); the tax-table country cells are plain text because /clinic-management-software-india/ and /emr-software-in-kenya/ are drafts.'
  - 'Left out for lack of a confirmed fact: named payment gateways by country and their state (spec 5.11 lists Razorpay/PayU, M-Pesa Daraja, UAE gateways, Paystack/Flutterwave; every countries/*.yaml payment state is null), so the page names none and says so; UPI; card payments; M-Pesa reconciliation against a Till or Paybill statement (spec FAQ); GST e-invoicing and eTIMS status, and whether invoices carry HSN or SAC codes (in-gst and ke-etims state null); VAT rules for the UAE and Nigeria (no regulator entry in src/data and no confirmed description, so the tax table covers India and Kenya only; add rows after a tax read); shifts and separate registers per counter (not on the live site); Tally export (not stated anywhere on the live site; the accounting FAQ uses the plans.yaml integrations add-on wording and names no product); which plan carries personalised invoice and receipt templates (live "Customizable Billing Templates" vs Premium "Custom clinical forms and print layouts"), so that row was dropped; credit limits and cost of goods sold (listed on /features/ without detail).'
  - 'Left out from the live pages as unsourced marketing: "Invoices are ready in less than 10 seconds", "faster reimbursement cycles", "reducing claim rejections", "14-Day Free Trial, with an extra 30-Day Money Back Guarantee" and Cura AI bill coding (the /ai/ page claims it, but which plan carries it is not known).'
  - 'Tax table and FAQ 1: the GST exemption for healthcare services by a clinical establishment or authorised medical practitioner, and the taxable pharmacy and cosmetic items, repeat the wording already on /pricing/india/ (pricing/india.yaml "gst-and-payment"). eTIMS wording follows src/data/regulators/ke-etims.yaml. The column is "Tax authority" because GST rates are set on GST Council recommendations and CBIC administers them. Both rows need a CA read before launch. No regulatorStrip or regulatorTable (page-writing rules).'
  - 'The desk scenes use illustrative amounts and times (11:40 consult, ₹6,000 procedure, ₹2,000 advance, 20% discount, ten minutes with a receipt book); the pain-block intro labels them as illustrations. They are not plan prices and not measured figures.'
  - 'No testimonials (all placed elsewhere). Proof is the ratings badge block; review counts are unknown (facts.yaml capterraReviews and googleReviews are null), so no count is shown.'
  - 'No heroMedia and no media objects: screenshots do not exist yet. When the spec 12 captures exist, the hero is the bill opened from the appointment screen with the orders on it, and the end-of-day report goes on the end-of-day row.'
  - 'Related links: all five solution pages (spec 2.9) plus revenue management, insurance claims and pharmacy, eight in all. Solution descriptions restate only what this page and those pages source.'
  - 'Audit 2026-09-27: added a contentCards "Further reading" section listing the published posts this page owns, with each post''s own label and summary. 2 of them (/billing-fraud-detection-for-clinics/, /clinic-cash-flow/) had no inbound link but /blog/, and links.related is full (8 of 8).'
