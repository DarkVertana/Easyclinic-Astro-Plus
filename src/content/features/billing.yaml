sections:
  - discriminant: painBlocks
    value:
      id: at-the-counter
      heading: Where the billing desk loses its time
      intro: >-
        These scenes are illustrations rather than one clinic's records, and each one starts at the
        counter.
      items:
        - heading: The patient waits while the bill is written
          body: >-
            The consult ends at 11:40 and the patient comes out with a prescription and two test slips.
            The receptionist finds each test on the rate card taped to the counter and writes the bill by
            hand, while three more patients wait behind.
          fix: >-
            The desk bills and takes payment from the appointment screen in one click. The tests the
            doctor ordered arrive on the invoice as lines, each at its price on the service list.
        - heading: Half paid today, the rest next Tuesday
          body: >-
            A patient booked for a ₹6,000 procedure pays ₹2,000 as an advance. The balance goes into a
            diary at the desk, and when the patient comes back a different receptionist is on duty and
            nobody can find the page.
          fix: >-
            EasyClinic records the advance and each part payment, and whoever is at the desk sees the
            balance on screen as soon as the patient's bill is opened.
        - heading: A discount nobody approved
          body: >-
            A regular patient asks for something off, and the receptionist takes 20% off to keep them
            happy. Later a bill is cancelled because the patient changed their mind about a test. Each
            decision was small, and neither was written down anywhere the owner would see.
          fix: >-
            Discounts and voided bills go through authorisation in EasyClinic, and the till keeps an audit
            trail of every transaction, so the owner can see both decisions later.
        - heading: The patient needs last month's receipt
          body: >-
            The patient's employer wants the receipt before paying them back, and the receipt is lost.
            The receptionist spends ten minutes in a carbon-copy receipt book writing out a duplicate.
          fix: >-
            The receipt and the invoice can go to the patient by SMS or email, or on WhatsApp with
            Premium, so the patient already has a copy.
          href: /features/whatsapp/
          linkLabel: How messages reach patients on WhatsApp

  - discriminant: flowDiagram
    value:
      id: consult-to-close
      heading: From the consult to the end of the day
      intro: >-
        One visit, followed through the desk. The steps with a check are where a mistake at the counter
        gets caught.
      steps:
        - label: Order
          body: >-
            The doctor orders the tests and procedures in EasyClinic. Nothing goes to the desk on a slip
            to be copied.
        - label: Bill
          body: >-
            The bill opens from the appointment screen with the orders on it as lines, each priced from
            the service list, and the tax you defined is applied to the items marked taxable.
          check: No price typed from memory
        - label: Pay
          body: >-
            The patient pays in full or in part, and in Kenya can pay by M-Pesa at the desk. The balance
            shows on screen straight away.
          check: No balance kept in a diary
        - label: Receipt
          body: The receipt goes to the patient by SMS or email, or on WhatsApp with Premium.
        - label: Close
          body: >-
            At closing time the till is balanced across payment modes, and the end-of-day report gives a
            snapshot of the day's cash transactions to count the drawer against.
          check: Cash reconciled every day

  - discriminant: featureRows
    value:
      id: how-the-bill-is-built
      heading: How the bill gets built
      intro: >-
        Where each line on the bill comes from. Where a part needs a particular plan, the row says so.
      items:
        - heading: One click from the appointment screen
          body: >-
            When the consult ends, the bill and the payment are done from the appointment screen in one
            click, so the receptionist does not open a separate billing program. The reception login
            included in the price can bill and take payments, and it cannot use the EMR.
          plan: professional
        - heading: The doctor's orders arrive on the bill
          body: >-
            Lab orders and procedures become lines on the patient's invoice as they are processed, so
            nothing is copied from the prescription. With lab management, part of Enterprise and an
            add-on on Professional or Premium, a test can be set to go on the invoice when the sample is
            collected.
          link:
            label: Read how lab orders work
            href: /features/lab/
        - heading: Medicines from your own dispensary
          body: >-
            Where the clinic dispenses on EasyClinic, the medicines dispensed from the prescription go on
            the patient's bill and come off the stock count. The pharmacist can also add over-the-counter
            items at the time of dispensing. Pharmacy comes with Enterprise, or as an add-on on
            Professional and Premium.
          plan: enterprise
          link:
            label: Read how dispensing works
            href: /features/pharmacy-and-inventory/
        - heading: Prices from the service list
          body: >-
            Each service and item has its price on the service list, so the desk picks a line instead of
            typing an amount. A changed price shows in billing straight away, and the billing records
            already made do not have to be generated again.
          link:
            label: Read about price lists by branch and payer
            href: /features/revenue-management/
        - heading: Tax on the items you mark taxable
          body: >-
            Each service and item is marked taxable or non-taxable, and the tax you define is applied to
            the taxable ones on the bill. For example, a dermatology clinic's bill can carry a
            consultation with no tax and a tube of sunscreen from the clinic's shelf with tax.
        - heading: Every department billed the same way
          body: >-
            Consultations, procedures, vaccinations, lab tests, pharmacy sales and video consults are
            billed through workflows the clinic can set up and change. A hospital OPD can use them to
            bill several departments from one system, without a different routine at each counter.

  - discriminant: featureRows
    value:
      id: taking-payment
      heading: Taking payment at the desk
      intro: >-
        A bill paid in full at the counter is the easy case. These are the others.
      items:
        - heading: Part payments and advances
          body: >-
            A patient can pay part of a bill now and the rest at the next visit, or pay an advance before
            a procedure. EasyClinic records each payment and shows the balance at the desk straight away.
        - heading: Refunds and voided bills, with authorisation
          body: >-
            Refunds and voided invoices go through with authorisation, and discounts and write-offs are
            controlled the same way. Every transaction stays on the till's audit trail.
        - heading: Packages paid over several visits
          body: >-
            A course of treatment can be set up as a package of several items at a package price, billed
            in one visit or across several, with its payment spread over the visits. Package treatments
            come with Premium and Enterprise.
          plan: premium
        - heading: Online payments
          body: >-
            Premium adds online payments, so a patient can pay without coming to the counter, for example
            when a video consult is booked. This page does not name the payment gateway behind online
            payments in any country.
          plan: premium
        - heading: M-Pesa at the desk in Kenya
          body: >-
            In Kenya, a patient can pay at the desk by M-Pesa or in cash, and the payment is recorded on
            their bill, which shows what is still owed.
          link:
            label: See the Kenya demo
            href: /kenyademo/
        - heading: Receipts on the patient's phone
          body: >-
            The receipt and the invoice can go to the patient by SMS or email, and on WhatsApp with
            Premium. A patient claiming the money back from an employer has the copy without asking the
            desk for one.
          link:
            label: Read how WhatsApp messages are sent
            href: /features/whatsapp/
        - heading: When an insurer pays part of the bill
          body: >-
            A visit can be billed to more than one payer: the patient pays their share at the desk and the
            rest goes on the claim. Insurance claims come with Enterprise, or as an add-on on Professional
            and Premium.
          plan: enterprise
          link:
            label: Read how claims are built
            href: /features/insurance-claims/

  - discriminant: featureRows
    value:
      id: day-end-close
      heading: Cash registers and the day-end close
      intro: >-
        The cash in the drawer and the bills in the system should agree when the desk closes. These are
        the parts of EasyClinic that help them agree.
      items:
        - heading: Who can use the cash register
          body: >-
            Access to the cash register is set by role, so only the staff you allow can take money on it.
        - heading: Cash in and out, tracked through the day
          body: >-
            Cash coming in and going out is tracked as it happens, which cuts the time the daily
            reconciliation takes. The till is balanced across payment modes, such as cash and online
            payments, with an audit trail of every transaction on it.
        - heading: The end-of-day report
          body: >-
            The end-of-day report gives a snapshot of the day's cash transactions, and end-of-day
            financial reports run for the whole clinic or, with more than one location, across the
            organisation. Reports can be generated and sent out automatically, so nobody has to remember
            to run them.
          link:
            label: Read how a cash variance is traced
            href: /features/revenue-management/
        - heading: Figures your accountant can use
          body: >-
            Financial reports are ready for daily, weekly, monthly and quarterly book balancing and for
            profit and loss. Access to them is set by role, so the accountant can read them while the
            front desk cannot.

  - discriminant: dataTable
    value:
      id: tax-rules
      heading: Tax on a clinic's bills in India and Kenya
      intro: >-
        The tax authority in each country, and what its rules mean for a clinic's bills in general terms.
        Your CA or tax adviser decides how they apply to your own services.
      caption: The tax authority for a clinic's bills in India and Kenya, and what its rules mean in general
      columns:
        - Country
        - Tax authority
        - What it means for your bills
      rows:
        - - India
          - Central Board of Indirect Taxes and Customs (CBIC), for GST
          - >-
            Healthcare services by a clinical establishment or an authorised medical practitioner are
            exempt from GST, so a consultation carries none. Medicines sold over your pharmacy counter and
            cosmetic procedures are taxable, so a clinic with a pharmacy counter can end up issuing both
            kinds of bill.
        - - Kenya
          - Kenya Revenue Authority (KRA), through eTIMS
          - >-
            eTIMS is KRA's electronic tax invoice system. Each invoice is sent to KRA and the receipt
            carries the eTIMS reference, and registering for eTIMS with KRA is the clinic's own step.
      note: >-
        The table describes each country's rules. It makes no claim about EasyClinic's GST or eTIMS
        status.

  - discriminant: scopeBox
    value:
      id: limits
      heading: Before you move the billing desk onto EasyClinic
      variant: limits
      items:
        - >-
          **The books stay with your accountant on Professional and Premium.** Financial accounting comes
          with Enterprise. On the other plans EasyClinic holds the bills and the day-end close, and your
          accountant keeps the books in the software they use now.
        - >-
          **Packages and online payments start on Premium.** Professional, at
          {price:usd.professional.annual} per doctor per month billed annually, bills and takes payment at
          the desk without them.
        - >-
          **Claims to insurers need the claims module.** It comes with Enterprise, or as an add-on on
          Professional and Premium.
        - >-
          **Your CA checks the tax on your bills.** EasyClinic applies the tax you define to the items you
          mark taxable. This page makes no claim that its bills meet GST, VAT or eTIMS invoice rules, so
          have your CA or tax adviser check a sample bill before you go live.
        - >-
          **The desk needs the internet.** EasyClinic is cloud software and does not run fully offline
          today, so if the line at your clinic drops often, arrange a backup connection for the billing
          desk, such as a mobile hotspot, before you go live.

  - discriminant: proofBlock
    value:
      id: ratings
      heading: How EasyClinic is rated on Capterra and Google
      intro: >-
        The Capterra link opens the reviews themselves, so you can read what reviewers wrote about
        EasyClinic before you book a demo.
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'

  - discriminant: contentCards
    value:
      id: further-reading
      heading: Further reading
      items:
