        - href: /clinic-cash-flow/

faqHeading: Questions clinic owners ask about billing
faq:
  - question: Do I charge GST on a consultation?
    answer: >-
      No, in most cases: healthcare services by a clinical establishment or an authorised medical
      practitioner are exempt from GST, so the consultation bill carries none. Medicines sold over your
      pharmacy counter and cosmetic procedures are taxable, and in EasyClinic each service and item is
      marked taxable or non-taxable, so the tax you define applies only to the taxable lines. Ask your CA
      which of your services are taxable.
  - question: Can my receptionist bill without seeing patients' notes?
    answer: >-
      Yes: the reception login included in the price can do the front-desk work, including registration,
      appointments, billing and payments, and it cannot use the EMR or issue prescriptions. If you want a nurse or clinical
      assistant to fill in part of the record, they get a clinical role as a separate user.
  - question: Can patients pay by M-Pesa?
    answer: >-
      Yes, at the desk: a patient in Kenya can pay by M-Pesa or in cash, and the payment is recorded on
      their bill, which shows what is still owed. Online payments, for patients who pay without coming to
      the counter, come with Premium.
  - question: Can the desk give a refund or void a bill?
    answer: >-
      Yes, with authorisation: refunds and voided invoices go through with authorisation, and discounts
      and write-offs are controlled the same way. Each transaction stays on the till's audit trail, so
      you can see later what was refunded or voided.
  - question: Can a patient pay for a package of sessions in instalments?
    answer: >-
      Yes, on Premium and Enterprise, which include package treatments: a package can be billed in one
      visit or across several, with its payment spread over the visits. Professional does not include
      package treatments.
  - question: How does the desk close the day?
    answer: >-
      The till is balanced across payment modes, such as cash and online payments, and the end-of-day
      report gives a snapshot of the day's cash transactions to count the drawer against. Access to the
      cash register is set by role and every transaction stays on the till's audit trail; tracing a gap
      between the drawer and the report is covered on the
      [revenue management page](/features/revenue-management/).
  - question: What can my accountant get from EasyClinic?
    answer: >-
      Your accountant can have a login that reads the financial reports, which are ready for daily,
      weekly, monthly and quarterly book balancing and for profit and loss, and role-based access can keep
      those reports from the front desk. Financial accounting itself comes with Enterprise; on
      Professional and Premium your accountant keeps the books in the software they use now.
  - question: Can EasyClinic send our figures to our accounting software?
    answer: >-
      Yes, as integration work scoped for your clinic: a connection to your accounting system comes with
      Enterprise, under integrations and custom features, and is an add-on on Professional and Premium.
      What goes across, and how often, is set in that scoping.

