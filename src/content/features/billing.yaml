# Billing feature page (spec 5.11 "/features/billing", keyword row in 4.1, cannibalisation rule 4.5.2).
status: published
headKeyword: medical billing software for clinics
secondaryKeywords:
  - clinic billing software
  - GST billing software for doctors
  - OPD billing software
title: 'Medical Billing Software for Clinics: EasyClinic'
metaDescription: 'Medical billing software for clinics: bills built from the doctor''s orders, part payments and refunds, receipts by SMS or WhatsApp and a day-end report.'
h1: Billing and invoicing for your clinic
linkLabel: Billing
eyebrow: Billing and payments
openingAnswer: >-
  EasyClinic is medical billing software for clinics: the tests and procedures a doctor orders become
  invoice lines, the desk takes full or part payment, and the receipt goes to the patient's phone. Billing
  comes with every plan, from {price:usd.professional.annual} per doctor per month billed annually
  ({price:inr.professional.annual} in India).
summary: >-
  Bills built from the doctor's orders, part payments and refunds at the desk, receipts on the patient's
  phone and an end-of-day report when the till closes.
