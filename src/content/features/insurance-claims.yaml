sections:
  - discriminant: painBlocks
    value:
      id: why-claims-come-back
      heading: Why do insurance claims get rejected?
      intro: >-
        Claims come back for many reasons, and three of them start before billing does: the wrong plan
        picked at the desk, an order the plan does not pay for, and a pre-authorisation nobody asked
        for. Each one can be caught while the patient is still in the clinic, weeks before the payer's
        reply would show it. The cases below are typical examples, not one clinic's story.
      items:
        - heading: The plan picked at the desk was the wrong one
          body: >-
            A patient hands over an insurance card and the receptionist picks a plan from the list: the
            basic tier instead of the one the patient's employer pays for, or the right insurer with the
            wrong plan. The bill goes out at that plan's rates, and weeks later the claim comes back with
            a one-line reason.
          fix: >-
            At registration the patient is linked to the payer and the plan category on their card, and
            that plan's cover and price list come with the link. The cover shows as soon as the plan is
            linked, so the desk can check it against the card before the consult. On Enterprise, a
            workflow rule can also make a second person approve a visit before it is linked to a payer.
        - heading: The doctor ordered something the plan does not cover
          body: >-
            The doctor orders a scan the plan excludes, or a branded medicine where the plan pays only for
            the generic. Nobody finds out until the payer rejects that line, by which time the patient has
            gone home and the clinic is chasing money the patient was never told they owed.
          fix: >-
            Each plan category lists what it covers, with its exclusions and limits, and orders are
            checked against the plan's cover at the time of care. An item the plan will not pay for shows
            up while the patient is still in the clinic, when the doctor can change it or the patient can
            agree to pay for it.
        - heading: The pre-authorisation was never raised
          body: >-
            The payer wanted to approve the procedure before it was done. The doctor thought the desk had
            asked, the desk thought the doctor had, and the claim leaves without the approval. The payer
            does not pay for work it never approved.
          fix: >-
            Where a payer needs to approve a test or procedure first, pre-authorisation is a step of its
            own in the claim, between the order and the invoice, and the approval is recorded against the
            visit. A missing approval shows while the patient is still in the clinic, not when the payer
            rejects the claim.

  - discriminant: flowDiagram
    value:
      id: claim-journey
      heading: How a claim is built, from registration to the payer's payment
      intro: >-
        Every step adds to one claim, so the claim the billing desk submits is the one reception started.
        The steps with a check are where the mistakes above get caught.
      steps:
        - label: Register
          body: Reception registers the patient once, and the details typed at the desk are the ones that reach the claim.
        - label: Link the plan
          body: >-
            The patient is linked to their payer and plan category. A company's employees and their
            dependants are linked to the company in the same way.
          check: Catches the wrong plan
        - label: Check coverage
          body: Staff can see what the plan covers, with its exclusions and the patient's co-payment, from the moment the plan is linked.
        - label: Prescribe within the plan
          body: The doctor orders medicines and tests from the chart, and the orders are checked against what the plan covers.
          check: Catches items the plan does not cover
        - label: Pre-authorise
          body: Where the payer needs to approve first, the approval is recorded against the visit before the invoice is built.
          check: Catches a missing pre-authorisation
        - label: Invoice
          body: The bill is built from what was ordered, at the payer's own rates, with the patient's share split from the payer's.
        - label: Submit
          body: The claim is built from the visit and the bill, and the billing desk submits it to the payer, one at a time or in a batch.
        - label: Reconcile
          body: When the payer pays, the payment is settled against its claims, and the claims it has not paid still show as open.

  - discriminant: featureRows
    value:
      id: payer-setup
      heading: Each payer's plans and prices, set up once
      intro: >-
        This setup is what makes the checks above work. It is part of the claims module, which comes with
        Enterprise and can be added to Professional or Premium.
      items:
        - heading: A profile for each payer
          body: >-
            Each insurer, TPA, HMO or company that pays for its staff is set up once, with its rates, its
            contract terms, the services it covers and its payment terms. From then on every patient linked
            to it is billed on those terms, instead of on what the receptionist remembers.
        - heading: Plan categories inside each payer
          body: >-
            One insurer can sell several plans, so each payer holds its own plan categories, and members
            can be sorted into more than one level. Each category sets the services covered, the
            exclusions, the invoicing limits and the co-payment.
        - heading: The payer's price list on the bill
          body: >-
            Each payer can have its own price list, and Easy Clinic picks it when a linked patient is billed,
            so nobody types a TPA rate at the counter. The invoice itself, with its tax, is covered on the
            billing page.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: One visit, two payers
          body: >-
            A visit can be billed to more than one payer, and the co-payment and deductions are worked out
            on the bill. The patient pays their share at the desk and the rest goes on the claim.
        - heading: When a patient's cover changes
          body: >-
            Reception updates the patient's payer or plan when their cover changes, whether they moved
            insurer or joined a new plan, and the next bill follows the new plan.

  - discriminant: dataTable
    value:
      id: payers-by-country
      heading: Who pays a clinic's claims in each country
      intro: >-
        The payers change from market to market while the steps above stay the same. This table lists who
        pays a clinic's claims in India, Kenya, the UAE and Nigeria. It is not a list of Easy Clinic
        connections, and naming a payer here does not mean Easy Clinic sends claims to it electronically.
      caption: Who pays a clinic's claims in each country, and what each asks of the clinic
      columns:
        - Country
        - Who pays
        - What the clinic deals with
      rows:
        - - '[India](/clinic-management-software-india/)'
          - Health insurers, usually through a TPA (third-party administrator), and companies that pay for their employees
          - >-
            The TPA handles the claim for the insurer, and a cashless claim needs the TPA's or insurer's
            pre-authorisation. A company that pays for its staff is billed at the rates it agreed with
            the clinic.
        - - '[Kenya](/emr-software-in-kenya/)'
          - SHA (Social Health Authority), and private insurers such as Jubilee, AAR, CIC, Britam and Resolution
          - >-
            SHA took over from NHIF on 1 October 2024, and apart from emergency treatment only a contracted
            SHA facility with a valid facility code can claim from it. Each private insurer sets its own cover
            and rates.
        - - '[UAE](/clinic-management-software-uae/)'
          - Health insurers
          - >-
            In Dubai, claims and prior authorisations go to insurers electronically through DHA eClaimLink,
            the Dubai Health Authority's claims system. The Department of Health in Abu Dhabi sets its own
            rules.
        - - '[Nigeria](/hospital-management-software-nigeria/)'
          - HMOs (health maintenance organisations), and schemes under the NHIA (National Health Insurance Authority)
          - >-
            Each HMO sets its own claim forms and the documents that go with them. The NHIA accredits the
            facilities that treat patients under its schemes.
      note: >-
        Any of these payers can be set up in Easy Clinic as a payer profile with its plans and price list,
        as described above. That is billing setup, not an electronic connection to the payer.

  - discriminant: prose
    value:
      id: claims-sent-back
      heading: Claims sent back, read payer by payer
      body: >-
        The claims dashboard shows the status of every claim, so the billing desk can see which claims a
        payer has sent back without waiting for month end. Reading them payer by payer shows whether they
        share a cause in that payer's setup, such as a plan category missing a service or a price list that
        was not updated after the payer changed its rates. Correct the setup once and the next claims go
        out on the corrected terms.


        This page covers why claims come back and how to stop them at the desk. The clinic's denial rate
        over time, and the ageing of what each payer owes, are on the
        [revenue management page](/features/revenue-management/).

  - discriminant: proofBlock
    value:
      id: ratings
      heading: Easy Clinic's public ratings
      intro: >-
        Easy Clinic has not published a measured figure for claim rejections, so the proof on this page is
        its public ratings. The Capterra link opens the reviews themselves.
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'

  - discriminant: contentCards
    value:
      id: further-reading
      heading: Further reading
      items:
        - href: /nhif-in-kenya/

faqHeading: Questions clinics ask about insurance claims
faq:
  - question: Do we need the Enterprise plan to handle insurance claims?
    answer: >-
      No, a clinic on Professional or Premium can add the claims module, and Enterprise includes it. The
      add-on is not in the per-doctor plan price, and Enterprise is priced on a quote. A single-doctor
      clinic that sees a few corporate patients a week sets up its payers the same way a hospital OPD
      does, only fewer of them.
  - question: How does Easy Clinic reduce rejected claims?
    answer: >-
      By catching the mistakes that start before billing while the patient is still in the clinic: the
      wrong plan at registration, an order the plan does not cover and a missing pre-authorisation. The
      bill is also priced from the payer's own list, so a claim does not go out at the cash price.
      Easy Clinic publishes no percentage for the fall in rejections, because it has no measured figure it
      can source, so the number to watch is your own rejection rate by payer.
  - question: Can the patient pay their share at the desk and the insurer pay the rest?
    answer: >-
      Yes, each plan category carries its co-payment and deduction rules, so the bill splits the
      patient's share from the payer's and the patient pays their part at the desk. One visit can also be
      billed to more than one payer, such as an insurer and the patient's employer.
  - question: Can we bill a company for its employees' visits?
    answer: >-
      Yes, a company that pays for its staff is set up as a payer in the same way as an insurer, with its
      own rates and the services it covers. Its employees and their dependants are linked to it at
      registration, and their visits are billed to the company on those terms.
  - question: How does pre-authorisation work in Easy Clinic?
    answer: >-
      Where a payer needs to approve a test or procedure first, pre-authorisation is a step in the claim
      before the invoice, and the approval is recorded against the patient's visit. A claim that needs an
      approval and has none shows at the billing desk before it goes out, rather than coming back as a
      rejection. The decision itself stays with the payer.
  - question: How do we match a payer's payment to our claims?
    answer: >-
      When a payer pays, the payment is settled against the claims it covers, one payment against many
      claims if that is how the payer pays, and the claims it has not paid still show as open. How long
      each payer takes to pay is reported on the
      [revenue management page](/features/revenue-management/).
  - question: What does SHA ask of a clinic that claims from it in Kenya?
    answer: >-
      Apart from emergency treatment, SHA pays only a contracted SHA facility with a valid facility code.
      It took over from NHIF on
      1 October 2024 and is moving claims from its provider portal into certified hospital management
      systems. This page describes SHA's rules; it does not state Easy Clinic's own SHA status.
  - question: Does Easy Clinic handle claims for inpatient admissions?
    answer: >-
      No, Easy Clinic runs outpatient care, the OPD and day care, so its claims start from an outpatient
      visit. Admissions and ward stays, and the claims for them, stay on your inpatient system.

