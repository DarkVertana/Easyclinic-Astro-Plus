sections:
  - discriminant: painBlocks
    value:
      id: why-claims-come-back
      heading: Why do insurance claims get rejected?
      intro: >-
        Claims come back for many reasons, and three of them start before billing does: the wrong plan
        picked at the desk, an order the plan does not pay for, and a pre-authorisation nobody asked
        for. Each one can be caught while the patient is still in the clinic, weeks before the payer's
        reply would show it. The cases below are typical examples, not one clinic's story.
      items:
        - heading: The plan picked at the desk was the wrong one
          body: >-
            A patient hands over an insurance card and the receptionist picks a plan from the list: the
            basic tier instead of the one the patient's employer pays for, or the right insurer with the
            wrong plan. The bill goes out at that plan's rates, and weeks later the claim comes back with
            a one-line reason.
          fix: >-
            At registration the patient is linked to the payer and the plan category on their card, and
            that plan's cover and price list come with the link. The cover shows as soon as the plan is
            linked, so the desk can check it against the card before the consult. On Enterprise, a
            workflow rule can also make a second person approve a visit before it is linked to a payer.
        - heading: The doctor ordered something the plan does not cover
          body: >-
            The doctor orders a scan the plan excludes, or a branded medicine where the plan pays only for
            the generic. Nobody finds out until the payer rejects that line, by which time the patient has
            gone home and the clinic is chasing money the patient was never told they owed.
          fix: >-
            Each plan category lists what it covers, with its exclusions and limits, and orders are
            checked against the plan's cover at the time of care. An item the plan will not pay for shows
            up while the patient is still in the clinic, when the doctor can change it or the patient can
            agree to pay for it.
        - heading: The pre-authorisation was never raised
          body: >-
            The payer wanted to approve the procedure before it was done. The doctor thought the desk had
            asked, the desk thought the doctor had, and the claim leaves without the approval. The payer
            does not pay for work it never approved.
          fix: >-
            Where a payer needs to approve a test or procedure first, pre-authorisation is a step of its
            own in the claim, between the order and the invoice, and the approval is recorded against the
            visit. A missing approval shows while the patient is still in the clinic, not when the payer
            rejects the claim.

  - discriminant: featureRows
    value:
      id: payer-setup
      heading: Each payer's plans and prices, set up once
      intro: >-
        This setup is what makes the checks above work. It is part of the claims module, which comes with
        Enterprise and can be added to Professional or Premium.
      layout: bento
      items:
        - heading: A profile for each payer
          icon: building-2
          body: >-
            Each insurer, TPA, HMO or company that pays for its staff is set up once, with its rates, its
            contract terms, the services it covers and its payment terms. From then on every patient linked
            to it is billed on those terms, instead of on what the receptionist remembers.
        - heading: Plan categories inside each payer
          icon: layers
          body: >-
            One insurer can sell several plans, so each payer holds its own plan categories, and members
            can be sorted into more than one level. Each category sets the services covered, the
            exclusions, the invoicing limits and the co-payment.
        - heading: The payer's price list on the bill
          icon: tags
          body: >-
            Each payer can have its own price list, and Easy Clinic picks it when a linked patient is billed,
            so nobody types a TPA rate at the counter. The invoice itself, with its tax, is covered on the
            billing page.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: One visit, two payers
          icon: hand-coins
          body: >-
            A visit can be billed to more than one payer, and the co-payment and deductions are worked out
            on the bill. The patient pays their share at the desk and the rest goes on the claim.
        - heading: When a patient's cover changes
          icon: refresh-cw
          body: >-
            Reception updates the patient's payer or plan when their cover changes, whether they moved
            insurer or joined a new plan, and the next bill follows the new plan.

  - discriminant: dataTable
    value:
      id: payers-by-country
      heading: Who pays a clinic's claims in each country
      wideIntro: true
      variant: clean
      intro: >-
        The payers change from market to market while the steps above stay the same. This table lists who
        pays a clinic's claims in India, Kenya, the UAE and Nigeria. It is not a list of Easy Clinic
        connections, and naming a payer here does not mean Easy Clinic sends claims to it electronically.
      caption: Who pays a clinic's claims in each country, and what each asks of the clinic
      columns:
        - Country
        - Who pays
        - What the clinic deals with
      rows:
        - - '[India](/emr-software-in-india/)'
          - Health insurers, usually through a TPA (third-party administrator), and companies that pay for their employees
          - >-
            The TPA handles the claim for the insurer, and a cashless claim needs the TPA's or insurer's
            pre-authorisation. A company that pays for its staff is billed at the rates it agreed with
            the clinic.
        - - '[Kenya](/emr-software-in-kenya/)'
          - SHA (Social Health Authority), and private insurers such as Jubilee, AAR, CIC, Britam and Resolution
          - >-
            SHA took over from NHIF on 1 October 2024, and apart from emergency treatment only a contracted
            SHA facility with a valid facility code can claim from it. Each private insurer sets its own cover
            and rates.
        - - '[UAE](/emr-software-in-uae/)'
          - Health insurers
          - >-
            In Dubai, claims and prior authorisations go to insurers electronically through DHA eClaimLink,
            the Dubai Health Authority's claims system. The Department of Health in Abu Dhabi sets its own
            rules.
        - - '[Nigeria](/emr-software-in-nigeria/)'
          - HMOs (health maintenance organisations), and schemes under the NHIA (National Health Insurance Authority)
          - >-
            Each HMO sets its own claim forms and the documents that go with them. The NHIA accredits the
            facilities that treat patients under its schemes.
      note: >-
        Any of these payers can be set up in Easy Clinic as a payer profile with its plans and price list,
        as described above. That is billing setup, not an electronic connection to the payer.

