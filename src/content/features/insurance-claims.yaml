editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The payer table (SHA beside Jubilee, AAR, CIC, Britam and Resolution in Kenya, DHA eClaimLink in
    Dubai, HMOs and the NHIA in Nigeria) and the product detail taken from Easy Clinic's own live payor and
    OPD pages, such as plan categories with co-payment rules and one visit billed to two payers, come from
    Easy Clinic's markets and product.
  readsMachineWritten: >-
    The three pain scenes are composites, labelled on the page as typical examples, and the page has no
    named person and no measured rejection figure, so it does not yet meet the spec 6.5 bar and needs a
    billing manager's read-aloud.

notes:
  - 'Section claims-sent-back (Claims sent back, read payer by payer) removed 2026-10-30 at the owner''s request.'
  - 'Sections claim-journey (How a claim is built), ratings (Easy Clinic''s public ratings) and further-reading removed 2026-10-30 at the owner''s request; the page is exempt from the proof-block rule in src/lib/rules/audit.ts.'
  - 'Title 51 characters and H1 exactly as spec 4.1. The spec title does not contain the head keyword, so "insurance claims software for clinics" opens the meta description and the opening answer.'
  - 'Meta rewritten from the spec 4.1 wording ("Submit cashless claims, track TPA approvals and reconcile HMO and SHA payments from your own system"): reconciling SHA payments from your own system states an SHA capability whose status is unknown, and the three verbs are a group of three. The rewrite keeps "cashless", TPA and HMO.'
  - 'Proof: the 34% denied-claims figure (live /curapilot/) and "Rejections fell from 23% to under 4% in one quarter" have no public source (facts.md section 4), so the proof block is the badges variant and the proof intro says no rejection figure is published. Replace with a measured rejection rate by payer and a finance-manager quote when either exists (spec 5.11).'
  - 'Capability sources (re-fetched 2026-09-26): live /payor-management/ (same text at /insurance-claim-management-system/): payer profiles with billing rates, contract terms, services covered and payment terms; subscription categories with coverage levels, restrictions and limits; exclusions; coverage validated at the time of care; staff can see what a plan covers; patients linked to payer plans at registration and updated when cover changes; invoices from payer rules. Live /hospital-opd-nursing-home-software/ "Insurance and 3rd Party Payor Management": membership categories with invoicing limits, co-payment rules and inclusions and exclusions; multi-payor billing in a single visit; automated co-pay and deductions; corporate clients as payor; employee and dependant management; multi-level member classification; bulk claim submission; bulk payment settlement; claim status tracking dashboard; payer price lists without manual input; and the Workflow Manager example "creating a visit linked to a 3rd party payor" with authorisation at role or user level (workflow rules are Enterprise in plans.yaml). The eight-step journey and the three rejection causes follow spec 5.11.'
  - 'Pre-authorisation is stated only at the level spec 5.11 gives it (a step in the claim journey, and a missing approval is caught): the step sits before the invoice and the approval is recorded against the visit. The only live wording with more detail ("Pre-authorisation in the visit: raise and track approvals without opening a second system") sits on /kenyademo/ under "Kenya · In development" for SHA, so the page does not say requests are raised or sent from the visit. The company should confirm how pre-authorisation works in the product today.'
  - 'Editor pass 2026-09-26 removed: the April insurer-change scene (a stored plan link does not catch a changed insurer, so the fix did not match the problem); "before the consult starts" and "caught in the consulting room" (the Kenya In-development wording, stronger than the payor page''s "at the time of care"); "the pre-authorisation travels with the claim to the payer" in the summary; the SHA FAQ sentence on eligibility checked at registration and electronic submission (reads as an Easy Clinic capability whose status is unknown); every "status is kept on the trust page" line, because /trust/ is a draft with placeholder statuses and its link is hidden in production; "claims reported by payer" and "often trace to one line" (no per-payer report or frequency is sourced). The Enterprise workflow check moved into the wrong-plan fix instead of repeating as a feature row.'
  - 'Payer table has no status column and names no connection: every regulator state is null (ke-sha, ae-eclaims, ng-nhia, ng-hmo-claims), and integration status is unknown everywhere. SLADE and SMART are not named, because saying claims "go through SLADE" states an integration as live. /kenyademo/, /emr-software-in-kenya/ and /pricing/kenya/ do say claims to the five insurers go through SLADE; the company should confirm the SLADE state so the pages agree.'
  - 'Not stated for lack of a confirmed fact: online eligibility checks with any payer (the live /kenyademo/ SHA eligibility copy sits under "In development"); electronic submission to any named platform or payer (the live OPD page says Easy Clinic can "connect with various electronic claiming platforms" and handles "electronic and manual claiming", but which are connected is unknown); a list of Indian TPAs; the claims add-on price (usd.yaml addons.claims is null, so the FAQ says only that the add-on is not in the plan price); any rejection percentage; Easy Clinic''s SHA, DHA eClaimLink or NHIA status.'
  - 'Spec 5.11 FAQ items left out or folded in: "DHA eClaims" and "HMO claim packs" appear as descriptions in the payer table instead, because answering them as questions needs a status; "SHA today" is answered as what SHA asks of a clinic, and the answer says plainly that the page does not state Easy Clinic''s SHA status; "only for hospitals" is asked as the real prospect question "Do we need the Enterprise plan?" (spec 6.4 drops leading "only for X" questions); "corporate plans", "patient copay split", "pre-auth workflow", "reconciliation", "multiple payors" and "reduce rejections" are answered. The inpatient question is added from spec 5.8 (inpatient out of scope).'
  - 'Cannibalisation 4.5.2: invoices and tax link to /features/billing/; denial rate over time and ageing link to /features/revenue-management/; the "Claims sent back" section stays at the claims dashboard and fixing the payer setup. "Revenue cycle management" does not appear.'
  - 'Links: /solutions/ngo-clinics/, the four country pages and /trust/ do not exist yet or are drafts, so they are hidden in production until published; they stay because spec 2.9 wants all five solution pages and the country rows point to their country pages.'
  - 'No redirectFrom: /payor-management/, /insurance-claim-management-system/ and /payor-management-system/ are already in src/data/redirects.yaml.'
  - 'No heroMedia and no media objects: screenshots do not exist yet. Spec 11 wants the claims screen as the hero on this page; add it, and a screenshot of a plan category with its co-payment rule, when the spec 12 captures exist.'
  - 'Audit 2026-09-27: added a contentCards "Further reading" section listing the published posts this page owns, with each post''s own label and summary. 1 of them (/nhif-in-kenya/) had no inbound link but /blog/, and links.related is full (8 of 8).'
  - 'Audit 2026-09-27: the Kenya row of the country table and the SHA FAQ said only a contracted SHA facility can claim from SHA, with no exception. Regulation 31(4) of the Social Health Insurance Regulations, 2024, quoted in SHA''s empanelment notice (https://www.sha.go.ke/wp-content/uploads/2025/07/Public_Notice_Empanelment_of_HCPs_and_HF_-_final.pdf, fetched 2026-09-27), lets SHA pay a licensed and certified facility for emergency treatment, as /nhif-in-kenya/ and /glossary/ say. Both now start "apart from emergency treatment".'
