faqHeading: Questions clinics ask about insurance claims
faq:
  - question: Do we need the Enterprise plan to handle insurance claims?
    answer: >-
      No, a clinic on Professional or Premium can add the claims module, and Enterprise includes it. The
      add-on is not in the per-doctor plan price, and Enterprise is priced on a quote. A single-doctor
      clinic that sees a few corporate patients a week sets up its payers the same way a hospital OPD
      does, only fewer of them.
  - question: How does Easy Clinic reduce rejected claims?
    answer: >-
      By catching the mistakes that start before billing while the patient is still in the clinic: the
      wrong plan at registration, an order the plan does not cover and a missing pre-authorisation. The
      bill is also priced from the payer's own list, so a claim does not go out at the cash price.
      Easy Clinic publishes no percentage for the fall in rejections, because it has no measured figure it
      can source, so the number to watch is your own rejection rate by payer.
  - question: Can the patient pay their share at the desk and the insurer pay the rest?
    answer: >-
      Yes, each plan category carries its co-payment and deduction rules, so the bill splits the
      patient's share from the payer's and the patient pays their part at the desk. One visit can also be
      billed to more than one payer, such as an insurer and the patient's employer.
  - question: Can we bill a company for its employees' visits?
    answer: >-
      Yes, a company that pays for its staff is set up as a payer in the same way as an insurer, with its
      own rates and the services it covers. Its employees and their dependants are linked to it at
      registration, and their visits are billed to the company on those terms.
  - question: How does pre-authorisation work in Easy Clinic?
    answer: >-
      Where a payer needs to approve a test or procedure first, pre-authorisation is a step in the claim
      before the invoice, and the approval is recorded against the patient's visit. A claim that needs an
      approval and has none shows at the billing desk before it goes out, rather than coming back as a
      rejection. The decision itself stays with the payer.
  - question: How do we match a payer's payment to our claims?
    answer: >-
      When a payer pays, the payment is settled against the claims it covers, one payment against many
      claims if that is how the payer pays, and the claims it has not paid still show as open. How long
      each payer takes to pay is reported on the
      [revenue management page](/features/revenue-management/).
  - question: What does SHA ask of a clinic that claims from it in Kenya?
    answer: >-
      Apart from emergency treatment, SHA pays only a contracted SHA facility with a valid facility code.
      It took over from NHIF on
      1 October 2024 and is moving claims from its provider portal into certified hospital management
      systems. This page describes SHA's rules; it does not state Easy Clinic's own SHA status.
  - question: Does Easy Clinic handle claims for inpatient admissions?
    answer: >-
      No, Easy Clinic runs outpatient care, the OPD and day care, so its claims start from an outpatient
      visit. Admissions and ward stays, and the claims for them, stay on your inpatient system.

