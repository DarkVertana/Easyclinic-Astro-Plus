faqHeading: Questions front desks and clinic owners ask
faq:
  - question: Can walk-ins and booked patients share one list?
    answer: >-
      Yes, on every plan walk-ins join the same calendar as booked appointments, so the desk works from
      one list for the day. A patient who needs to be seen sooner can be moved up the queue by need or by
      appointment type.
  - question: Are WhatsApp reminders included in every plan?
    answer: >-
      No, WhatsApp reminders start on Premium, at {price:usd.premium.annual} per doctor per month billed
      annually ({price:inr.premium.annual} in India). The Professional plan, at
      {price:usd.professional.annual}, sends reminders by SMS and email.
  - question: Can patients book their own appointments online?
    answer: >-
      Yes, through the patient portal and app, which come with the Enterprise plan. Patients pick a slot
      online themselves, so the desk spends less of the day taking bookings by phone.
  - question: Can I see which patients have acknowledged their reminder?
    answer: >-
      Yes, EasyClinic tracks which patients have acknowledged their reminder, so the desk can call the
      ones who have not before their slot comes round. The clinic also sets when reminders go out, days
      or hours before the visit.
  - question: What about patients who do not have a smartphone?
    answer: >-
      They still get SMS reminders, which reach any mobile phone that can receive a text, and SMS and
      email reminders are part of every plan. A patient who would rather book at the counter is booked
      there, on the same calendar.
  - question: Does the calendar work if the internet goes down?
    answer: >-
      Not fully: EasyClinic is cloud software and does not run fully offline today. If the line at your
      clinic drops often, arrange a backup connection for the front desk, such as a mobile hotspot, before
      you go live.
  - question: Can my receptionist book appointments without seeing the medical notes?
    answer: >-
      Yes, the reception login included in the price of every plan is made for this: your receptionist
      books appointments but cannot open the EMR or issue prescriptions.

