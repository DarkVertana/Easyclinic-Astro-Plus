editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The plan split for reminders (SMS and email on Professional, WhatsApp from Premium) and the
    acknowledgement tracking come from EasyClinic's own pricing and live scheduling pages, and the worked
    no-show example is priced in rupees and shillings for the two markets the page is written for.
  readsMachineWritten: >-
    The pain-block scenes and the sample reminders are invented and need a front-desk manager's read-aloud,
    and beyond the ratings the page has no named customer or measured number of its own, because there is
    no no-show figure or front-desk quote yet, and no calendar screenshot.

notes:
  - 'Title 50 characters (spec 4.1 wording). Meta 147 characters, rewritten from the spec 4.1 wording ("Book, reschedule and remind patients on WhatsApp and SMS...") to avoid a group of three and to put WhatsApp on Premium, per plans.yaml.'
  - 'H1 kept from spec 4.1 ("Appointment scheduling that cuts no-shows"); the live page itself says "Automated Patient Reminders to Reduce No-Shows". No measured figure backs it: facts.yaml noShowReduction is null, so the opening answer carries the plan price as its number instead of the spec 5.11 "measured no-show reduction", and the worked-example note and the limits box say no figure is published. When a real percentage is supplied, add it to the opening answer as {fact:noShowReduction} and consider a study-style proof.'
  - 'Worked no-show example (spec 5.11): 20 slots, 15% no-show, fees of ₹500 and KES 1,500 chosen for round arithmetic, labelled as an illustration in the intro, the caption, the row labels and the note. 24 working days = six days a week for four weeks. The fees are not a survey of what clinics charge.'
  - 'Token screen left out: the live /appointment-scheduling-at-easy-clinic/ page (re-fetched 2026-09-26) does not mention tokens. Add a token row once the company says what the token screen shows.'
  - 'Grounding: live /appointment-scheduling-at-easy-clinic/ (re-fetched 2026-09-26): "Appointment & Resource Scheduling", resources on the central dashboard, schedule templates by operating hours and doctor preference, real-time updates, SMS and email reminders scheduled days or hours ahead, patient acknowledgement tracking, real-time queue status, automatic wait-time updates to patients, queue prioritisation by patient need or appointment type, online appointment booking, visit status from check-in to discharge, 1-click billing and payments from the appointment screen, day-end reports, cross-location visibility with consistent scheduling standards and shared resources, teleconsults created through the appointment module with online fee payment in a web browser. Walk-ins on all plans: plans.yaml matrix "Appointment scheduling and walk-ins". Rooms on the calendar: spec 5.11 promise ("one calendar for doctors, rooms and teleconsults") plus the live resource-scheduling lines.'
  - 'Fact-check pass 2026-09-26 removed claims not on the live scheduling page, plans.yaml, the spec or facts.md: first come, first served running beside fixed slots and multi-session booking (both only on other live solution pages; the multi-session FAQ was cut, leaving 7), equipment booked inside the slot, "the desk can only offer a time the doctor is in", "takes payments" for the reception login (facts.md only says the reception licence cannot use the EMR or prescribe), and "each clinic sets its own wording" for reminders (the live page only says the timing is customisable).'
  - 'Plans: calendar, walk-ins and SMS and email reminders on every plan; billing and day-end reports on every plan (Billing and payments, Dashboards and reports on Professional); WhatsApp, video consults, online payments and more than one location on Premium; central control of every location and the patient portal and app on Enterprise (plans.yaml). Self-booking is tied to the Enterprise portal and app (spec 4.1 patient-engagement meta: "A portal and app for booking"). The multi-location row says a second location needs Premium and central control is Enterprise, without saying which plan each cross-location capability sits on. The waiting-room row carries no plan tag because the plan for patient wait-time updates (and their channel) is not stated. Pre-visit intake forms and remote check-in are on the live page but their plan is not stated anywhere, so the fact-check pass removed them rather than tie them to Enterprise by inference. Whether patients can book online on Professional or Premium is not confirmed; the page does not say either way.'
  - 'Left out of the live page: "in-app notifications" as a reminder channel (depends on the Enterprise app; not stated), "AI-Powered Wait Time Management" (marked "Coming soon" on the live page), the "14-Day Free Trial, with an extra 30-Day Money Back Guarantee" line (conflicts with other published pages), "Reduces no-shows" without a figure, in-built chat for teleconsults (left to /features/telehealth/).'
  - 'Spec 5.11 items left out for lack of a confirmed fact: self-booking from WhatsApp and from the clinic website; two-way confirmation by reply (only acknowledgement tracking is stated, not how a patient acknowledges); consent notes per country (consent per country belongs to /features/patient-engagement/ in spec 5.11); no-show marking and follow-up handling; FAQ items on reminder cost per message (unknown, and message costs belong to /features/whatsapp/ per spec 4.5 rule 3), recurring appointments (not on the live scheduling page), doctor leave (not stated) and Google Calendar sync (unknown). Proof items left out: the no-show number, a front-desk quote (none on file; every testimonial is placed) and the reminder thread screenshot (no screenshots yet).'
  - 'Sample reminders use made-up doctors (Dr Anita Rao, Dr Otieno) and a made-up patient (Mary), with no clinic names, no neighbourhood and no phone numbers, and are labelled as samples in the intro, the note and the row labels.'
  - 'Cannibalisation (spec 4.5): billing gets one row linking /features/billing/ with no invoice or GST detail; WhatsApp templates, API and message costs are left to /features/whatsapp/; teleconsults are one paragraph linking /features/telehealth/ (spec 5.11).'
  - 'Redirect from /appointment-scheduling-at-easy-clinic/ already exists in src/data/redirects.yaml, so redirectFrom is not set here.'
  - 'No heroMedia and no media objects: screenshots do not exist yet. When the spec 12 captures exist, add the Today view (booked patients, two walk-ins, one video consult, one no-show) as hero and the WhatsApp reminder thread to the WhatsApp row.'
  - 'Audit 2026-09-27: added a contentCards "Further reading" section listing the published posts this page owns, with each post''s own label and summary. 2 of them (/online-appointment-booking-system/, /how-to-make-your-waiting-room-more-patient-friendly/) had no inbound link but /blog/, and links.related is full (8 of 8).'
