sections:
  - discriminant: painBlocks
    value:
      id: where-the-desk-loses-the-day
      heading: Where the front desk loses the day
      intro: >-
        The appointment book is the first screen a clinic opens in the morning and the last one it closes.
        These are the moments it usually goes wrong.
      items:
        - heading: The 4pm patient forgot
          body: >-
            She booked a fortnight ago for a follow-up, and at 4pm her slot sits empty. Nobody at the desk
            had a spare minute to ring round the afternoon list, and the walk-in who asked for that time at
            noon was told the book was full.
          fix: >-
            Booked patients get a reminder by SMS and email, sent days or hours before the visit as the
            clinic chooses, and on WhatsApp as well on the Premium plan. The desk can see who has
            acknowledged the reminder and ring only the rest.
          href: /features/whatsapp/
          linkLabel: How WhatsApp reminders are sent
        - heading: Booked patients and walk-ins in one corridor
          body: >-
            At ten in the morning a patient with a 10:15 booking is sitting beside four walk-ins who came
            at nine. Everyone thinks they are next, and the receptionist settles it by memory and by
            whoever complains loudest.
          fix: >-
            Walk-ins join the same calendar as the booked appointments, so the desk works from one list. A
            patient who needs to be seen sooner can be moved up the queue, and waiting patients are told
            automatically when their wait changes.
        - heading: Two doctors, two diaries
          body: >-
            The physician works mornings and the surgeon comes in on Tuesday and Friday evenings, each
            with a separate diary. A patient is booked into the surgeon's Wednesday, which does not exist,
            and finds out at the door.
          fix: >-
            Each doctor's schedule comes from a template built on the clinic's opening hours and that
            doctor's preferences. The surgeon's two evenings sit on the same calendar as the physician's
            mornings, so the desk books from one view of who is in when.
        - heading: Nobody knows who is still waiting
          body: >-
            The doctor calls out for the next patient, and reception has to check the register and then
            the waiting room to work out who arrived first. The bill for the patient who just left is
            written up later from memory.
          fix: >-
            The appointment screen shows each patient's status through the visit, from check-in until they
            leave, and the bill is raised from that same screen in one click.

  - discriminant: dataTable
    value:
      id: what-no-shows-cost
      heading: How much do no-shows cost a clinic?
      intro: >-
        Take an example clinic with 20 booked slots a day and a 15% no-show rate: three slots sit empty
        every day. With a ₹500 consult fee that is ₹1,500 of fees lost a day, or ₹36,000 over a 24-day
        month, and each of those patients who turns up instead wins back ₹500. The numbers are for
        illustration, and the table sets out the arithmetic with a Kenyan fee beside the Indian one.
      caption: 'An illustration, not a measured result: what no-shows cost at 20 booked slots a day'
      columns:
        - The arithmetic
        - In rupees
        - In shillings
      rows:
        - - Booked slots in a day
          - '20'
          - '20'
        - - No-show rate, for the example
          - 15%
          - 15%
        - - Empty slots in a day (20 × 15%)
          - '3'
          - '3'
        - - Consult fee, for the example
          - ₹500
          - KES 1,500
        - - Fees lost in a day (3 × the fee)
          - ₹1,500
          - KES 4,500
        - - Fees lost over 24 working days (six days a week for four weeks)
          - ₹36,000
          - KES 108,000
        - - Won back over the month if one of the three turns up each day (24 × the fee)
          - ₹12,000
          - KES 36,000
      note: >-
        This is an illustration with round numbers, not a measured result. The 15% rate and the two fees
        were chosen to make the arithmetic easy to follow, so put in your own numbers. EasyClinic has not
        published a measured no-show reduction from its customers, and this page does not claim one.

  - discriminant: featureRows
    value:
      id: how-it-works
      heading: How the calendar works, from the booking to the bill
      intro: >-
        What the front desk works from all day. The calendar and its walk-ins come with every plan, and a
        row tagged with a higher plan needs that plan. The full list per plan is on the
        [pricing page](/pricing/).
      items:
        - heading: Doctors and consulting rooms on one calendar
          body: >-
            Each doctor's hours come from a schedule template set to the clinic's opening hours and that
            doctor's preferences, so the full-time physician and the Tuesday-evening surgeon sit side by
            side. Consulting rooms and other resources are scheduled on the same screen as the
            appointments, and a change made at the desk shows on the calendar straight away.
          media:
            kind: screenshot
            src: ../../assets/images/screens/scheduling-two-doctor-calendar.png
            alt: Day calendar with two doctors side by side
            caption: Two doctors' days side by side on one calendar.
            frame: browser
            origin: old-site
            capturedOn: '2024-01'
        - heading: Walk-ins beside booked slots
          body: >-
            Walk-ins join the same calendar as booked appointments, so the day runs from one list. When a
            patient needs to be seen sooner, the desk can move them up the queue by need or by appointment
            type.
          plan: professional
          media:
            kind: screenshot
            src: ../../assets/images/screens/scheduling-priority-walk-in.png
            alt: Day visits list with a patient flagged as priority beside the day's calendar
            caption: A patient marked priority moves up the day's list.
            frame: browser
            origin: old-site
            capturedOn: '2024-11'
        - heading: Reminders by SMS and email on every plan
          body: >-
            Reminders go out automatically, days or hours before the visit, at the times the clinic sets.
            EasyClinic tracks which patients have acknowledged their reminder, so the desk spends its calls
            on the patients who have not.
          plan: professional
          media:
            kind: screenshot
            src: ../../assets/images/screens/message-templates-by-channel.png
            alt: Communication settings with the email templates open, including the appointment reminder
            caption: Reminder and other message templates, set up once per channel.
            frame: browser
            origin: old-site
            capturedOn: '2024-09'
          link:
            label: Read the sample reminders
            href: /features/appointment-scheduling/#reminder-samples
        - heading: Reminders on WhatsApp
          body: >-
            On Premium, reminders also reach the patient on WhatsApp, sent from the clinic software instead
            of from the receptionist's own phone.
          plan: premium
          link:
            label: Read how WhatsApp messages are sent
            href: /features/whatsapp/
        - heading: The waiting room, as it stands
          body: >-
            The appointment screen shows where each patient is in the visit, from check-in until they
            leave, so the desk knows who is still waiting. When the doctor runs late, waiting patients are
            told of the change to their wait automatically, instead of queueing at the counter to ask.
        - heading: From the appointment to the bill
          body: >-
            When the consult ends, the bill and the payment are done from the appointment screen in one
            click. Day-end reports give the owner a summary of the day.
          plan: professional
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Patients who book themselves
          body: >-
            Patients book their own appointments online through the patient portal and app, which come with
            Enterprise, so the desk no longer takes every booking by phone.
          plan: enterprise
          media:
            kind: screenshot
            src: ../../assets/images/screens/online-booking-slots.png
            alt: Online booking page with a doctor's open slots
            caption: The page a patient books from.
            frame: none
            origin: old-site
            capturedOn: '2024-09'
          link:
            label: Read what the patient portal does
            href: /features/patient-engagement/
        - heading: Every branch's calendar from one place
          body: >-
            With more than one branch, you can see and manage the appointments at every branch from one
            place and keep the same scheduling rules at each. Resources can also be shared between
            locations. A second location needs Premium, and central control of every location comes with
            Enterprise.
          plan: premium
          link:
            label: Read how multi-location works
            href: /features/multi-location/

  - discriminant: dataTable
    value:
      id: reminder-samples
      heading: What a reminder can say
      intro: >-
        Two sample reminders, written for this page with made-up names and times. The clinic chooses how
        long before the visit its reminders go out.
      caption: Sample reminder messages, one for India and one for Kenya
      columns:
        - Sample
        - When it goes
        - Message
      rows:
        - - India, by SMS (every plan)
          - The evening before
          - >-
            Reminder from Dr Anita Rao's clinic: your appointment is tomorrow, Thursday, at 4:30pm. If you
            cannot come, please call the clinic so the slot can go to another patient.
        - - Kenya, on WhatsApp (Premium)
          - Two hours before
          - >-
            Hello Mary, this is a reminder from Dr Otieno's clinic. Your appointment is today at 11:00am.
            If you are running late or cannot come, please let the front desk know.
      note: >-
        These are samples written for this page, not EasyClinic's own wording, and the doctors and the
        patient are made up. How WhatsApp messages are sent from the clinic software is on the
        [WhatsApp page](/features/whatsapp/).

  - discriminant: prose
    value:
      id: teleconsults
      heading: Teleconsults on the same calendar
      body: >-
        On Premium, a video consult is booked through the same appointment screen as a clinic visit, so it
        takes its slot on the doctor's calendar, with the option of collecting the fee online. The doctor
        and the patient both join from a web browser on a computer or a phone, with no other software to
        install. How the consult itself runs, from the call to the prescription, is on the
        [telehealth page](/features/telehealth/).

  - discriminant: scopeBox
    value:
