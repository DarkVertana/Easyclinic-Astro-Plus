sections:
  - discriminant: painBlocks
    value:
      id: where-results-go-missing
      heading: Where a clinic's lab results go missing
      intro: >-
        A clinic with a lab of its own, or a lab it sends samples to, will know these four. Each one
        costs the doctor time in the consult or the patient a second trip.
      items:
        - heading: The lab cannot read the slip
          body: >-
            The doctor writes CBC, LFT, TSH and a lipid profile on a paper slip, and the patient carries it
            down the corridor. The technician reads the handwriting as best they can, and a test that was
            asked for is missed until the doctor notices at the follow-up.
          fix: >-
            With lab management, the doctor picks the tests from the lab's test catalog on the patient's
            chart, and the lab sees the order as it was written. Nobody has to read anyone's handwriting.
        - heading: A tube swapped at the counter
          body: >-
            Tubes labelled by hand at a busy collection counter get swapped, and the first sign is a result
            that makes no sense for the patient. By then the only fix is a second needle and an apology.
          fix: >-
            With lab management, each sample is tracked with a barcode or QR code label, so the tube stays
            matched to the patient and the test from collection to result.
        - heading: The report is in the patient's bag
          body: >-
            The paper report goes home with the patient, and by the follow-up it is in a drawer
            somewhere. The doctor phones the lab for a copy while the next patient waits.
          fix: >-
            When your own lab runs the test, the result comes back into the patient's record with abnormal
            values flagged, so it is on the chart when the doctor opens it. A report from an outside lab
            can be uploaded to the same record as a file. On Premium and Enterprise the report can also go
            to the patient on WhatsApp.
        - heading: Last year's HbA1c is on another sheet
          body: >-
            To see whether a diabetic patient's HbA1c has come down, the doctor lays out paper reports
            from several visits and reads the numbers across. The trend gets worked out in the doctor's
            head, in the middle of a consult.
          fix: >-
            Lab values stay on the patient's record visit after visit, and Easy Clinic draws them as lab
            charts beside the vitals, so the trend is on one screen.

  - discriminant: flowDiagram
    value:
      id: order-to-report
      heading: From the order to the report
      intro: >-
        What happens to one test, from the consulting room to the patient's phone. Ordering from the chart
        and tracking the sample are lab management, which comes with Enterprise or as an add-on on
        Professional and Premium. Sending the report on WhatsApp needs Premium or Enterprise.
      steps:
        - label: Order from the chart
          body: The doctor picks single tests or a health check-up package from the test catalog on the patient's chart.
        - label: Bill at the desk
          body: The tests ordered go on the patient's bill, so the desk does not type them in again.
        - label: Collect and label
          body: The sample is collected and labelled with a barcode or QR code that ties it to the patient and the test.
          check: Guards against a swapped tube
        - label: Process
          body: Sample tracking follows each sample from collection to the result, so the lab can tell where a sample is.
        - label: Report
          body: The technician enters the values on the test's report template, and the report is generated from it.
        - label: Back in the chart
          body: The result lands on the patient's record with abnormal values flagged, ready for the doctor at the follow-up.
          check: Flags an abnormal value
        - label: To the patient
          body: On Premium and Enterprise, the report can go to the patient on WhatsApp.

  - discriminant: featureRows
    value:
      id: how-it-works
      heading: What the lab and the doctor each get
      intro: >-
        The lab's side and the doctor's side work on the same patient record. A row tagged with a plan
        needs that plan, or the add-on the row names.
      items:
        - heading: A test catalog with your own packages
          body: >-
            Your lab's tests sit in one catalog, from a blood count to an X-ray, whether the lab runs
            pathology tests only or imaging as well. The catalog can also hold health check-up packages
            that you put together, and the doctor orders from it on the chart. The catalog is part of lab
            management, an add-on on Professional and Premium.
          plan: enterprise
        - heading: Samples tracked by barcode or QR code
          body: >-
            Each sample gets a barcode or QR code label when it is collected, and the label ties the tube
            to the patient and the test. Tracking follows the sample from collection to the result, so it
            is not mixed up with another patient's tube on the way. Sample tracking is part of lab
            management, an add-on on Professional and Premium.
          plan: enterprise
        - heading: Results in the chart, with abnormal values flagged
          body: >-
            Lab reports come into the patient's chart, and abnormal values are flagged on the chart the
            doctor already has open. Lab values are drawn as charts beside the vitals, visit after visit,
            so a trend is one look instead of a pile of paper.
          plan: premium
        - heading: Reports built from templates
          body: >-
            Lab reports are generated from built-in templates, so the technician enters the values on a
            set layout for each test instead of typing the report. Every report from your lab then reads
            the same way, whoever was on the bench that day.
        - heading: The report on the patient's phone
          body: >-
            The report can go to the patient on WhatsApp from Easy Clinic, so the patient has it at the
            follow-up and at any other doctor they see. How the messages are set up is covered on the
            WhatsApp page.
          plan: premium
          link:
            label: Read how WhatsApp messages work
            href: /features/whatsapp/
        - heading: Tests sent to an outside lab
          body: >-
            A report from an outside lab can be scanned and uploaded to the patient's record as a file,
            where it sits beside the results from your own lab. A direct feed from an outside lab's own
            system into Easy Clinic would be integration work, scoped as a project, and this page does not
            name any outside lab as connected.
        - heading: Your lab machines, connected by project
          body: >-
            A connection between Easy Clinic and your lab analysers is integration work, scoped for your
            machines as a project. It comes with Enterprise, under integrations and custom features, or as
            an add-on on Professional and Premium. Which machines can be connected, and how long the work
            takes, is worked out in that scoping.
          plan: enterprise
        - heading: Billing the tests
          body: >-
            Tests ordered from the chart go on the patient's bill, and billing and payments come with every
            plan. Invoices and receipts are covered on the billing page.
          link:
            label: Read how billing works
            href: /features/billing/

  - discriminant: dataTable
    value:
      id: plans
      heading: Which plan includes what for the lab
      intro: >-
        The lab is split across the plans, and each row here follows the plan list on the pricing
        page.
      caption: Lab features by plan
      columns:
        - What the lab needs
        - Professional
        - Premium
        - Enterprise
      rows:
        - - Lab reports in the chart
          - Not included
          - Included
          - Included
        - - 'Lab management: orders from the chart and sample tracking'
          - Add-on
          - Add-on
          - Included
        - - Reports to patients on WhatsApp
          - Not included
          - Included
          - Included
        - - Connections to lab machines
          - Add-on, scoped per project
          - Add-on, scoped per project
          - Included, scoped per project
        - - Stock of reagents and lab supplies
          - Add-on, with pharmacy and inventory
          - Add-on, with pharmacy and inventory
          - Included
        - - Billing and payments
          - Included
          - Included
          - Included
      note: >-
        Professional costs {price:usd.professional.annual} and Premium {price:usd.premium.annual} per
        doctor per month billed annually ({price:inr.professional.annual} and {price:inr.premium.annual}
        in India). Enterprise is priced on a quote. On Professional, a lab report can still be scanned
        and attached to the patient's record as a file. [Compare every plan](/pricing/).

  - discriminant: proofBlock
    value:
      id: ratings
      heading: How clinics rate Easy Clinic
      intro: >-
        These are Easy Clinic's public ratings on Capterra and Google, for the whole product rather than
        the lab alone. We do not yet have a quote from a clinic lab's own staff to put on this page.
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'

  - discriminant: contentCards
    value:
      id: further-reading
      heading: Further reading
      items:
        - href: /lab-report-management/

faqHeading: Questions clinics ask about the lab
faq:
  - question: Can we use it for tests we run in-house and tests we send out?
    answer: >-
      Yes: tests your own lab runs go through lab management, from the order on the chart to the result,
      and a report from an outside lab can be scanned and uploaded to the patient's record beside them. A
      direct feed from an outside lab's own system would be integration work, scoped as a project, and
      this page does not name any outside lab as connected.
  - question: Can Easy Clinic connect to our lab analysers?
    answer: >-
      Connecting your analysers is integration work, scoped for your machines as a project, and it comes
      with Enterprise or as an add-on on Professional and Premium. Which analysers can be connected, and
      how long the work takes, is worked out for each project, so bring the make and model of each machine
      to the scoping.
  - question: Do lab reports come from templates, or does the technician type each one?
    answer: >-
      They come from templates: lab reports are generated from built-in templates, so each report has a
      set structure and the technician enters the values. That is what keeps every report from your lab
      in the same layout, whoever was on the bench that day.
  - question: Can we order X-rays and scans the same way as blood tests?
    answer: >-
      Yes, with lab management imaging tests can sit in the same test catalog as blood tests, so an X-ray
      or a scan is ordered from the chart like any other test. The imaging report and the images can be
      uploaded to the patient's record as files, beside the visits and the lab results.
  - question: Do I need Enterprise to use the lab features?
    answer: >-
      No: Premium, at {price:usd.premium.annual} per doctor per month billed annually
      ({price:inr.premium.annual} in India), includes lab reports in the chart and sending them on
      WhatsApp. Lab management, with orders from the chart and sample tracking, comes with Enterprise or
      as an add-on on Professional and Premium, so a clinic on Premium can add it without changing plan.
  - question: Can the lab keep stock of its reagents?
    answer: >-
      Yes, reagents and lab supplies can be kept in Easy Clinic's inventory, which comes with Enterprise
      or as part of the pharmacy and inventory add-on on Professional and Premium. How batches and
      reorders work is covered on the [pharmacy and inventory page](/features/pharmacy-and-inventory/).

