title: 'Lab Management Software for Clinics: Easy Clinic'
metaDescription: 'Lab management software for clinics: order tests from the chart and get results back into the record, with reports sent on WhatsApp.'
h1: Lab orders and results, inside the EMR
linkLabel: Lab orders and results
eyebrow: Lab
openingAnswer: >-
  Easy Clinic is lab management software for clinics: the doctor orders the test from the chart, and the
  result comes back into the same patient record with abnormal values flagged. Lab reports in the chart
  come with Premium, at {price:usd.premium.annual} per doctor per month billed annually, and lab
  management with Enterprise or as an add-on.
summary: >-
  Tests ordered from the chart come back as results on the same patient record. Lab reports come with
  Premium, and lab management with Enterprise or as an add-on.
