editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    Only the plan split for the lab (reports in the chart on Premium, lab management on Enterprise or as
    an add-on) and the barcode or QR sample labels come from Easy Clinic's own pricing and pathology
    pages, and nothing on the page is local to one country, because no outside lab connection has a
    confirmed status to name.
  readsMachineWritten: >-
    The pain-block scenes (the unreadable slip and the swapped tube) could sit on any lab software page
    and need a lab technician's read-aloud, and the page has no named person or measured number, nor a
    quote or screenshot from a clinic lab, so it does not yet meet the spec 6.5 test on either.

notes:
  - 'Title 47 characters. Meta is the spec 4.1 wording with the head keyword put in front (see length check in the lint run). H1 is the spec 4.1 H1.'
  - 'Grounding: the live /pathology-emr/ (fetched 2026-09-26) states the test catalog with health check-up packages and imaging among the tests, barcode or QR code sample tracking "to prevent mix-ups", workflow from sample collection to result generation, built-in report templates, vitals and lab charts, and multi-user access for technicians. Its marketing numbers ("100+ dashboards", "invoices in less than 10 seconds"), its comparison tables against "other EMR software", "optimised for high-volume" and "integration readiness (lab devices): supported" were left out.'
  - 'Plan statements follow src/data/plans.yaml: Premium includes "Lab reports" (matrix: lab reports in the chart) and WhatsApp; Enterprise includes lab management, integrations and custom features, and inventory; the lab, integrations and pharmacy add-ons are available on Professional and Premium. Add-on prices are null in src/data/prices, so no add-on price is stated.'
  - 'Which plan includes the report templates, the flags on abnormal values and the lab charts is not known. Flags are placed with lab reports in the chart (Premium row) as spec 5.11 and the features hub describe them; the templates row carries no plan tag.'
  - 'External lab integrations by country (spec 5.11 asks for them named with status): integration status is unknown, so no outside lab is named, the page says so, and a direct feed from an outside lab is written as "would be integration work" (plans.yaml names lab machines, accounting and an existing HIS for the integrations add-on, not outside labs). The integrations pointer (removed in the 2026-09-27 audit while /integrations/ is a draft) said only that the page covers connections by country, and never implied that any lab connection is live.'
  - 'Machine interfaces are described only as the plans.yaml integrations add-on ("connections to your lab machines, scoped per project"). No analyser makes, protocols (HL7, ASTM) or timelines are stated.'
  - 'Spec 5.11 FAQ items left out for lack of a confirmed fact: turnaround reporting (no confirmed turnaround-time report) and accreditation documents (NABL or similar status unknown). Radiology is answered only as far as the live page goes (imaging tests in the catalog, "image upload" and "document upload" in the EMR list); PACS, DICOM viewing and radiology equipment connections are not stated. Replaced with the plan question and the reagent stock question.'
  - 'Lab billing is one row linking to /features/billing/ (spec 4.5 rule 2: billing owns invoices and GST). WhatsApp is described only as report delivery; templates, costs and the API stay on /features/whatsapp/ (rule 3). Nothing about unbilled tests or leakage (revenue-management).'
  - 'Proof: badges variant (Capterra and Google). No testimonial: all are placed, and none is from a lab. No heroMedia or media: screenshots do not exist yet. When they exist, add the spec 12 capture "Lab order from the chart and result back with a flag" (one abnormal value) as hero.'
  - 'Not stated for lack of a fact: whether lab technicians need a paid login, add-on prices, lab turnaround figures, any measured error or time saving, whether the lab works offline beyond the site-wide "does not run fully offline today".'
  - 'Fact-check pass 2026-09-26: removed "the part most clinics ask about before the demo" and "from clinics of every kind" (unsourced); removed the FAQ claim that a lab''s paper report format can be kept through Premium print layouts at no charge (plans.yaml print layouts and the facts.md customisation line do not say lab reports); the analyser FAQ no longer opens with an unqualified "Yes"; the pain-block intro no longer claims every pain ends in a phone call or a wasted trip; the sample-tracking steps no longer claim a pending-samples view (the live page says tracking "to prevent mix-ups" and workflow "for sample collection, processing, and result generation", nothing more); WhatsApp delivery is written as Premium and Enterprise, not Premium alone; the catalog and sample rows say lab management is an add-on on Professional and Premium, since their plan tag reads "Included in Enterprise".'
  - 'Audit 2026-09-27: added a contentCards "Further reading" section listing the published posts this page owns, with each post''s own label and summary. 1 of them (/lab-report-management/) had no inbound link but /blog/, and links.related is full (8 of 8).'
  - 'Audit 2026-09-27: removed "The integrations page covers connections country by country" from the outside-lab row. /integrations/ is a draft, so the link rendered as plain text in production; the next row already covers lab machines. Restore the link when /integrations/ publishes.'
