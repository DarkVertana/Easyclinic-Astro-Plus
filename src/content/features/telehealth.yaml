editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The plan boundary (video consults and online payments on Premium, the patient app only on
    Enterprise), the browser-only join and the remote-consult line on the prescription come from
    Easy Clinic's own pricing and live feature pages, and the NMC table is written for an Indian doctor.
  readsMachineWritten: >-
    The four pain scenes (the call to a personal number, the unpaid fee, the photographed pad, the
    forgotten follow-up) could sit on any telehealth page and need a doctor's read-aloud, and the page
    still has no named customer or measured number about video consults, and no screenshot.

notes:
  - 'Title 45 characters (spec 4.1 wording). Meta 152 characters, rewritten from the spec 4.1 wording: "NMC guideline aware" dropped because it implies a compliance status, which is unknown, and the three-item list ("video consults, e-prescriptions and payment before the call") cut to two. The meta says the fee is "payable" online, following the live "options for online fee payment", not that the patient always pays.'
  - 'Grounding: live /patient-engagement-at-easyclinic/ and /appointment-scheduling-at-easy-clinic/ (re-fetched 2026-09-26) carry the same "Teleconsultation, Video consult & Online fees collection" block: in-built video and chat; video consults created through the appointment module "with options for online fee payment"; doctors and patients "use a web browser on a computer or phone", with no additional software; and (engagement page only) prescriptions from the teleconsult sent "instantly" via WhatsApp, SMS or email with a disclaimer that the consult was remote. The live phrase "ensuring clarity and compliance" is dropped. "Chat alongside the video" was cut to "built-in video and chat", as the live page does not say chat runs during the call.'
  - 'Plans from src/data/plans.yaml: video consultations, online payments and WhatsApp messages on Premium; the patient portal and app on Enterprise only; SMS and email reminders on every plan. Billing from the appointment screen is from the live scheduling page ("1-Click billing and payments straight from appointment screen").'
  - 'Payment wording follows the live "options for online fee payment": the page says the fee can be paid online at booking, and does not say the patient is blocked from joining until it is paid.'
  - 'Left out for lack of a confirmed fact: call recording (spec 5.11 "recordings and consent") and any consent capture inside Easy Clinic; behaviour on a low-bandwidth connection and video quality (spec FAQ skipped); how the patient receives the join link; named payment gateways (integration status unknown); whether Easy Clinic checks a prescription against the NMC medicine lists; cross-border consults (spec FAQ skipped); the telemedicine rules of Kenya, the UAE and Nigeria (no record in src/data/regulators covers them, so the table note says it covers India only rather than asserting what those countries require).'
  - 'NMC table describes the 2020 Telemedicine Practice Guidelines in general terms, from src/data/regulators/in-nmc-telemedicine.yaml (state null) and the guideline text: professional judgement on whether a teleconsult suits, patient identity and the registration number on prescriptions, implied and explicit consent, List O (any teleconsult), List A (first consult by video, refills at follow-up), List B (add-ons at follow-up after an in-person consult for the same condition) and the prohibited list (Schedule X, NDPS), records, and fees with a receipt. No status column and no Easy Clinic status anywhere on the page; the earlier "where Easy Clinic stands is kept on the trust page" lines were removed because they implied a published status that does not exist (/trust/ is a draft with placeholders). Needs a compliance read.'
  - 'Drug interaction warning removed from the prescription row and the EMR related-link description: it is an EMR claim owned by /features/emr/, its plan and database are unknown, and it is not needed to explain a video consult.'
  - 'Cannibalisation (spec 4.5): receipts and invoices link to /features/billing/, WhatsApp mechanics (templates, message costs) to /features/whatsapp/, and calendar mechanics to /features/appointment-scheduling/, whose teleconsult paragraph (spec 5.11) links here.'
  - 'No testimonial: none of the testimonials in src/data/testimonials mentions video consults, and all are placed. Proof is the badges variant; add the review count when capterraReviews is confirmed.'
  - 'No heroMedia and no media objects: screenshots do not exist yet (page-writing rules). When captured, add the video consult screen with the patient record beside it as hero, and the WhatsApp prescription message on a phone to the WhatsApp row (spec 12).'
  - 'Audit 2026-09-27: added a contentCards "Further reading" section listing the published posts this page owns, with each post''s own label and summary. 3 of them (/features-that-your-telemedicine-software-should-have/, /telemedicine-in-india/, /telemedicine-in-kenya-2025/) had no inbound link but /blog/, and links.related is full (8 of 8).'
