sections:
  - discriminant: painBlocks
    value:
      id: where-phone-consults-go-wrong
      heading: Where a video consult on your own phone goes wrong
      intro: >-
        A video call on the doctor's own phone works until the clinic needs a record of it or a fee for
        it. These are the places it breaks.
      items:
        - heading: The call leaves nothing on the record
          body: >-
            A patient video-calls your own number, and in ten minutes you advise a change of dose. None of
            it reaches the clinic's records, so at the next visit nobody can see what was said or what was
            prescribed.
          fix: >-
            The video consult is booked in Easy Clinic and runs on its built-in video, so the visit and its
            prescription sit on the patient's record beside the clinic visits.
        - heading: The fee arrives late, or never
          body: >-
            The patient said they would send the fee after the call. A week later the reminder is still
            unanswered, and chasing a patient for a consult fee is a conversation nobody at the clinic
            wants to have.
          fix: >-
            On Premium, the fee can be paid online when the consult is booked, so it can be settled before
            the call starts.
        - heading: The prescription is a photo of the pad
          body: >-
            After the call you write on the pad, photograph it and send the picture from your phone. The
            pharmacist struggles to read it, and the clinic keeps no copy.
          fix: >-
            The prescription is typed on the patient's record, the same way as in the clinic, and sent from
            Easy Clinic with a line saying the consult was held remotely.
          href: /features/emr/
          linkLabel: How the prescription screen works
        - heading: The follow-up never gets booked
          body: >-
            You ask the patient to check in again in a week. Nobody writes it down, the patient forgets,
            and the next call comes when the symptoms are back.
          fix: >-
            The follow-up goes on the same calendar as any appointment, as a clinic visit or another video
            consult, and the patient gets a reminder before it.

  - discriminant: flowDiagram
    value:
      id: booking-to-follow-up
      heading: One video consult, from booking to follow-up
      intro: >-
        What happens on each side of the call. Video consultations and online payments are both part of
        the Premium plan.
      steps:
        - label: Booked on the calendar
          body: The desk books a video consult through the appointment module, on the same calendar as clinic visits.
        - label: Online payment
          body: The fee can be paid online at booking, before the call starts.
        - label: Joined from a browser
          body: Doctor and patient each join from a web browser on a computer or a phone, with no other software.
        - label: Seen by video
          body: The consult runs on Easy Clinic's built-in video and chat.
        - label: Prescribed on the record
          body: The prescription is written on the patient's record and says the consult was held remotely.
        - label: Sent to the patient
          body: It can go to the patient on WhatsApp as soon as the consult ends, or by SMS or email.
        - label: Follow-up booked
          body: The next visit goes on the same calendar, in the clinic or by video, with a reminder before it.

  - discriminant: featureRows
    value:
      id: how-it-works
      heading: What each part of a video consult needs
      intro: >-
        The EMR and the prescription come with every plan, and seeing the patient by video starts on
        Premium. Where a part needs the Premium plan, the row says so.
      items:
        - heading: Video consults on the clinic calendar
          body: >-
            A video consult is booked through the appointment module like any other appointment, so the
            day's list shows the clinic patients and the video patients together. The call itself runs on
            Easy Clinic's built-in video and chat.
          plan: premium
          link:
            label: Read how the appointment calendar works
            href: /features/appointment-scheduling/
        - heading: The fee, payable before the call
          body: >-
            Premium includes online payments, so the clinic can offer online payment of the consult fee
            when the video consult is booked, and the fee can be settled before the call. Billing for a
            video consult starts from the appointment, as it does for a clinic visit.
          plan: premium
          link:
            label: Read how clinic billing works
            href: /features/billing/
        - heading: Nothing for the patient to install
          body: >-
            The patient opens the consult in a web browser on a phone or a computer, and so does the
            doctor, so neither needs a separate video app. Easy Clinic's patient portal and app come with the
            Enterprise plan, and a video consult does not need them.
        - heading: The prescription goes on the same record
          body: >-
            The prescription from a video consult is written on the patient's record, the same way as a
            clinic prescription. It carries a line saying the consult was held remotely, and it stays on the
            record beside every clinic visit.
          link:
            label: Read how the EMR and prescriptions work
            href: /features/emr/
        - heading: Sent on WhatsApp at the end of the call
          body: >-
            Premium includes WhatsApp messages, so the prescription can go to the patient's WhatsApp as soon
            as the consult ends, and SMS or email can carry it instead. The pharmacist reads a typed
            prescription rather than a photo of the pad.
          plan: premium
          link:
            label: Read how WhatsApp messages work
            href: /features/whatsapp/
        - heading: The follow-up on the same calendar
          body: >-
            The next visit is booked on the same calendar, as a clinic visit or another video consult. The
            reminder before it goes by SMS and email on every plan, and on WhatsApp on Premium. In India the
            follow-up also changes what can be prescribed remotely, as the next section explains.

  - discriminant: dataTable
    value:
      id: nmc-guidelines
      heading: What India's telemedicine guidelines ask of a doctor
      intro: >-
        In India, video consults are governed by the Telemedicine Practice Guidelines, issued in 2020 and
        now under the [National Medical Commission](https://www.nmc.org.in/) (NMC). This is what they ask
        of the doctor, in general terms.
      caption: What the NMC Telemedicine Practice Guidelines ask of the doctor
      columns:
        - The question
        - What the guidelines ask
      rows:
        - - Is a video consult enough?
          - >-
            The doctor judges whether the problem can be handled on a teleconsult or the patient needs to
            be seen in person.
        - - Who is the patient, and who is the doctor?
          - >-
            The doctor confirms the patient's identity from details such as name and age, and shows their
            own registration number on the prescription.
        - - Consent
          - >-
            When the patient starts the teleconsult, consent is implied. When the doctor or a health worker
            starts it, the patient's explicit consent is needed, and it can be given in a message.
        - - Which medicines
          - >-
            The guidelines sort medicines into lists. List O can be prescribed on any teleconsult, and List
            A on a first consult held by video or as a refill at follow-up. List B is only for a follow-up,
            added to medicines already prescribed in person for the same condition. Medicines in Schedule
            X, and narcotic and psychotropic substances under the NDPS Act, cannot be prescribed on a
            teleconsult.
        - - Records
          - >-
            The doctor keeps a log of the teleconsult and the reports used in it, and keeps any
            prescription on record as for a clinic visit.
        - - Fees
          - >-
            A teleconsult is treated like a clinic visit for fees: the doctor may charge an appropriate fee
            and should give a receipt or invoice for it.
      note: >-
        This table describes the guidelines only and makes no claim about Easy Clinic's status under them.
        Following the medicine lists is the doctor's responsibility. The table covers India only.

  - discriminant: scopeBox
    value:
      id: limits
      heading: Before you plan video consults on Easy Clinic
