faqHeading: Questions doctors ask about video consults
faq:
  - question: Is it legal to see patients by video in India?
    answer: >-
      Yes, registered doctors in India may consult by video under the Telemedicine Practice Guidelines,
      issued in 2020 and now under the [National Medical Commission](https://www.nmc.org.in/). The
      guidelines set how the patient gives consent and which medicines can be prescribed on a
      teleconsult. Following them is the doctor's responsibility, and the table above sets out what they
      ask.
  - question: Does the patient need to download an app?
    answer: >-
      No, the patient joins the video consult from a web browser on a phone or a computer, and the doctor
      does the same, so neither installs anything. Easy Clinic's patient portal and app come with the
      Enterprise plan, and a video consult does not need them.
  - question: Can the patient pay before the call?
    answer: >-
      Yes, on the Premium plan, which includes online payments: the fee can be paid online when the video
      consult is booked, so it can be settled before the call. In India the telemedicine guidelines treat
      a teleconsult like a clinic visit for fees, so you may charge for it and should give the patient a
      receipt.
  - question: How does the patient get the prescription?
    answer: >-
      On WhatsApp, as soon as the consult ends, because WhatsApp messages come with the Premium plan along
      with video consultations. It can go by SMS or email instead. However it is sent, it carries a line
      saying the consult was held remotely, and it stays on the patient's record.
  - question: Which plan do I need for video consults?
    answer: >-
      Premium, at {price:usd.premium.annual} per doctor per month billed annually
      ({price:inr.premium.annual} in India), or Enterprise. Premium also brings the online payments and
      WhatsApp messages a video consult uses. Professional, at {price:usd.professional.annual} per doctor
      per month billed annually, covers clinic visits with the calendar and the EMR, without video
      consultations.
  - question: Can the follow-up be another video consult?
    answer: >-
      Yes, the follow-up is booked on the same calendar as any appointment, as a clinic visit or another
      video consult, and the patient gets a reminder before it. In India the follow-up matters for
      prescribing too, because some medicines on the guidelines' lists can be prescribed remotely only at
      a follow-up for a condition already treated in person.

