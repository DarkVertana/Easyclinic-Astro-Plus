# Patient engagement feature page (spec 5.11 "/features/patient-engagement", keyword row in 4.1, cannibalisation rule 4.5.3).
status: published
headKeyword: patient engagement software
secondaryKeywords:
  - patient portal software
  - patient app for clinics
  - patient retention software
title: 'Patient Engagement and Portal Software: EasyClinic'
metaDescription: 'Patient engagement software for clinics: a portal and app where patients book and see their records, plus recall campaigns by condition.'
h1: Keep patients coming back between visits
linkLabel: Patient engagement
eyebrow: Patient engagement
openingAnswer: >-
  EasyClinic's patient engagement software keeps in touch with patients through five loops that run
  from the patient record: onboard with a registration form sent as a link, remind before the visit,
  follow up when a review is due, ask how the visit went and reward the patients who keep coming. SMS
  and email reminders come with every plan, from {price:usd.professional.annual} per doctor per month
  billed annually, and the patient portal and app come with the Enterprise plan.
summary: >-
  Five loops run from the patient record between visits: a registration form by link, reminders,
  recalls by condition, feedback and loyalty, with the portal and app on Enterprise.
