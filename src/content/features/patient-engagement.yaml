sections:
  - discriminant: painBlocks
    value:
      id: where-patients-drift
      heading: Where patients drift away
      intro: >-
        Patient retention slips between visits, quietly, and nobody at the desk notices until the
        appointment book looks thin. These are the four places it usually happens.
      items:
        - heading: The three-month review that never happens
          body: >-
            A patient with diabetes is told to come back in three months. Nobody at the desk has a list
            of who is due, so nobody calls, and the patient turns up nine months later with a sugar that
            has crept up, or goes to another clinic.
          fix: >-
            A recall campaign picks the patients whose chart records diabetes and sends each of them a
            message asking them to book a review, so the recall no longer depends on someone at the desk
            remembering.
        - heading: The clipboard in the waiting room
          body: >-
            A new patient fills in a paper form on a clipboard while the queue grows. The receptionist
            types it in again later, guessing at the handwriting, and the allergy on line nine never
            reaches the chart.
          fix: >-
            The clinic sends an enrolment link by SMS or WhatsApp before the first visit. The patient
            fills in the clinic's own form on their phone, and the answers go on the patient record, so
            nobody types them twice.
        - heading: The phone call for a repeat prescription
          body: >-
            A patient on regular medicines phones to ask for a refill, then phones again for last
            month's report. Each call means someone at the desk hunts for the file and waits for the
            doctor before calling back.
          fix: >-
            On the Enterprise plan the patient has a portal and an app, where they open their records,
            book the next visit, pay and ask for a refill without phoning.
        - heading: The complaint you hear about from someone else
          body: >-
            A patient who waited ninety minutes says nothing at the desk and tells the neighbours
            instead. The clinic finds out months later, if it finds out at all.
          fix: >-
            A feedback survey after the visit asks the patient to rate it, so a patient unhappy about the
            wait has somewhere to say so, and the clinic can call them back.

  - discriminant: flowDiagram
    value:
      id: five-loops
      heading: Five loops, each one run from the patient record
      intro: >-
        Each loop starts from the patient record, and what the patient sends back is written to the same
        record. The channel a loop uses depends on the plan, and the next section says which.
      steps:
        - label: Onboard
          body: >-
            Before the first visit, the clinic sends an enrolment link by SMS or WhatsApp, and the patient
            fills in the clinic's own registration form on their phone.
        - label: Remind
          body: >-
            Before each appointment the patient gets a reminder. SMS and email reminders come with every
            plan, and WhatsApp reminders need the Premium plan.
        - label: Follow up
          body: >-
            When reviews fall due, the clinic runs a recall campaign that messages the patients whose
            chart records the condition, diabetes or hypertension for example, and asks them to book.
        - label: Ask
          body: >-
            After the visit, a survey asks the patient to rate it, and the ratings come back to the clinic
            to act on.
        - label: Reward
          body: >-
            A loyalty programme gives reward points or discounts for regular visits and for keeping to a
            treatment plan.

  - discriminant: featureRows
    value:
      id: what-the-patient-sees
      heading: What the patient sees, and which plan it needs
      intro: >-
        The portal and the app are where a patient deals with the clinic without phoning it. Messages
        reach every patient, app or no app, on the channels your plan includes. Rows for the portal and app,
        and for each message channel, name the plan they need.
      items:
        - heading: Booking the next visit from the portal or app
          body: >-
            Patients book appointments through your clinic's patient portal or app, and the booking goes
            into the same calendar the desk works from.
          plan: enterprise
          link:
            label: See how the appointment calendar works
            href: /features/appointment-scheduling/
        - heading: Records and treatment plans on the patient's phone
          body: >-
            The patient opens their own health records and treatment plan at any hour, so the question
            about last month's report does not need a call to the desk.
          plan: enterprise
        - heading: Refill requests and payments without a phone call
          body: >-
            Patients message the clinic through the portal or app to ask for a prescription refill, and
            pay or order their medicines online.
          plan: enterprise
        - heading: A registration form the patient fills in at home
          body: >-
            You set up the registration form your clinic needs and send it as an enrolment link by SMS or
            WhatsApp. The patient fills it in on their phone before the visit, and the answers go on the
            patient record instead of being typed in again at the desk.
          bullets:
            - Sending the link on WhatsApp needs the Premium plan
        - heading: Reminders by SMS and email
          body: >-
            Every plan sends SMS and email reminders, so a patient without a smartphone still hears from
            the clinic before the visit.
          plan: professional
        - heading: Messages on WhatsApp
          body: >-
            From the Premium plan, reminders and messages also go out on WhatsApp. How message templates
            are approved, and how Meta charges for each message, are on the WhatsApp page.
          plan: premium
          link:
            label: Read how WhatsApp messaging works
            href: /features/whatsapp/

  - discriminant: stepList
    value:
      id: recall-campaigns
      heading: Recall campaigns by condition, with a sample
      intro: >-
        A recall campaign turns "come back in three months" into a list the clinic can act on. The
        sample below is an illustration, not a result: Dr Kulkarni's clinic in Pune and its 40 patients
        are invented.
      steps:
        - title: Pick the condition
          meta: 'Sample: diabetes review'
          body: >-
            The clinic picks its patients by a condition recorded on their chart. In the sample, Dr
            Kulkarni's diabetes clinic in Pune picks the patients whose chart records type 2 diabetes,
            and 40 patients make the list.
        - title: Write the message
          meta: Sample message
          body: >-
            The clinic writes the message in its own words; on WhatsApp the wording first goes through
            Meta's template approval. The sample reads: "Namaste Mr Joshi, this is Dr Kulkarni's clinic.
            Your three-monthly diabetes review is due. Please call the clinic to book a time this week."
        - title: Send it
          meta: 'Sample: 40 messages'
          body: >-
            The message goes to every patient on the list, on the message channels the clinic's plan
            includes.
        - title: Check the list against the calendar
          body: >-
            The sent list stays with the campaign. A patient who books appears in the calendar like any
            other appointment, so checking one against the other shows the desk whom to call next.
      note: >-
        Which patients to recall, and in what words, is the clinic's decision. So is asking for the
        patient's consent first; the table further down sets out what each country's law asks.

  - discriminant: proofBlock
    value:
      id: ratings
      heading: How clinics rate EasyClinic
      intro: >-
        These are EasyClinic's public ratings on Capterra and Google. They rate the whole product, not
        the patient app on its own.
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'

  - discriminant: dataTable
    value:
      id: consent-by-country
      heading: Consent and opt-out rules by country
      intro: >-
        Every message a clinic sends uses a patient's phone number, and a recall by condition uses their
        diagnosis as well, so the country's data protection law applies. This is what the law asks in
        India, Kenya, the UAE and Nigeria, in general terms.
      caption: What each country's data protection law asks of a clinic that messages its patients
      columns:
        - Country
        - The law
        - What it asks of a clinic, in general
      rows:
        - - '[India](/clinic-management-software-india/)'
          - '[Digital Personal Data Protection Act, 2023 (DPDP)](https://www.meity.gov.in/static/uploads/2024/06/2bf1f0e9f04e6fb4f8fef35e82c42aa5.pdf)'
          - >-
            A notice telling the patient which personal data the clinic will use and for what purpose, and
            consent for that purpose, which the patient can withdraw as easily as they gave it. The clinic
            must be able to prove both, and publishes a contact who answers questions about the data. The
            [DPDP Rules, 2025](https://www.meity.gov.in/static/uploads/2025/11/53450e6e5dc0bfa85ebd78686cadad39.pdf),
            notified in November 2025, bring these duties into force in May 2027.
        - - '[Kenya](/emr-software-in-kenya/)'
          - '[Data Protection Act, 2019](https://www.odpc.go.ke/data-protection-laws-kenya/)'
          - >-
            Health data is sensitive personal data. Using a patient's details for marketing needs their
            express consent, and every marketing message must tell the patient they can opt out. The
            [2021 registration regulations](https://www.odpc.go.ke/wp-content/uploads/2024/03/THE-DATA-PROTECTION-REGISTRATION-OF-DATA-CONTROLLERS-AND-DATA-PROCESSORS-REGULATIONS-2021.pdf)
            list patient care among the purposes that must register with the Office of the Data
            Protection Commissioner.
        - - '[UAE](/clinic-management-software-uae/)'
          - '[Personal Data Protection Law, 2021 (PDPL)](https://u.ae/en/about-the-uae/digital-uae/data/data-protection-laws), and [Federal Law No. 2 of 2019](https://u.ae/en/about-the-uae/digital-uae/whole-of-government-approach/digital-health/ict-in-the-health-sector) on ICT in health'
          - >-
            The PDPL lets a patient object to their personal data being used for direct marketing, but it
            does not apply to health data that has its own law. Federal Law No. 2 of 2019 requires health
            providers to keep health data confidential and to hold it inside the UAE unless an exemption
            applies.
        - - '[Nigeria](/hospital-management-software-nigeria/)'
          - '[Nigeria Data Protection Act, 2023 (NDPA)](https://ndpc.gov.ng/wp-content/uploads/2024/03/Nigeria_Data_Protection_Act_2023.pdf)'
          - >-
            Health data is sensitive personal data. Consent must be freely given for a specific purpose, and
            the patient can withdraw it as easily as they gave it, or object to direct marketing at any time.
            The Nigeria Data Protection Commission's
            [2024 registration notice](https://ndpc.gov.ng/wp-content/uploads/2025/07/Updated-Guidance-Notice-on-Registtration-2024.pdf)
            names health among the sectors whose data controllers register with it.
      note: >-
        This table describes each law in general terms and is not legal advice. Each law's name links to
        its official text or the government's page on it. WhatsApp's own opt-in rules are on the
        [WhatsApp page](/features/whatsapp/).

  - discriminant: scopeBox
    value:
      id: limits
      heading: What this page does not promise
      variant: limits
      items:
        - >-
          **No revisit figure.** We have no measured rate of patients coming back to a clinic on
          EasyClinic to publish, so this page gives none.
        - >-
          **The portal and app are Enterprise only.** On Professional and Premium, patients hear from the
          clinic by message but have no login of their own.
        - >-
          **Consent is the clinic's to collect.** EasyClinic sends the messages your clinic sets up, and
          the laws in the table above put the duty to ask the patient on the clinic, as the holder of the
          data.
        - >-
          **It does not run fully offline.** EasyClinic is cloud software, so the desk needs a connection
          to run a recall campaign or see a booking made in the app.

faqHeading: Questions clinic owners ask about patient engagement
faq:
  - question: Which plan includes the patient portal and app?
    answer: >-
      The Enterprise plan, which has a custom price for each clinic rather than a list price. SMS and
      email reminders come with every plan, from {price:usd.professional.annual} per doctor per month
      billed annually ({price:inr.professional.annual} in India). WhatsApp messages start on Premium, at
      {price:usd.premium.annual} per doctor per month billed annually ({price:inr.premium.annual} in
      India).
  - question: What can a patient do in the portal and app?
    answer: >-
      A patient can book appointments, open their health records and treatment plan, pay online, order
      medicines and message the clinic to ask for a prescription refill. Each of these would otherwise
      mean a call or a visit to your desk.
  - question: What about patients who will never install an app?
    answer: >-
      They still hear from the clinic: SMS and email reminders reach them on every plan, and WhatsApp
      messages on Premium. The registration form reaches them as a link they open on their phone.
  - question: Can new patients fill in the registration form before they arrive?
    answer: >-
      Yes: you send an enrolment link by SMS or WhatsApp, and the patient fills in your clinic's own form
      on their phone before the visit. The answers go on the patient record, so the receptionist does not
      type them in again. Sending the link on WhatsApp needs the Premium plan.
  - question: How does a loyalty programme work?
    answer: >-
      It rewards patients with reward points or discounts for regular visits and for keeping to their
      treatment plan. For a patient on a long course of care, such as physiotherapy or diabetes
      follow-up, that is a reason to book the next visit rather than let it slide.
  - question: Do we need patients' consent before sending recall messages?
    answer: >-
      In general, yes: the data protection laws of Kenya, the UAE and Nigeria expect a patient to be told
      what their contact details will be used for and let a patient stop marketing messages, and India's
      DPDP Act asks the same once its Rules bring those duties into force in May 2027. Ask at registration
      and record the answer. The duty sits with your clinic, as the holder of the data; the table above
      sets out what each law asks in general terms, and it is not legal advice.
  - question: How many more patients will come back?
    answer: >-
      We cannot give you a number, because we have no measured revisit rate from a clinic to publish.
      What changes is that reminders go out on their own and recalls go to a list drawn from the chart,
      rather than depending on someone at the desk remembering to call.

