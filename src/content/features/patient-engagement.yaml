editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The plan split for each channel and the enrolment link sent by SMS or WhatsApp come from EasyClinic's
    own price list and live engagement page, and the consent table names the four laws a clinic in India,
    Kenya, the UAE or Nigeria answers to when it messages patients.
  readsMachineWritten: >-
    The pain-block scenes (the clipboard, the ninety-minute wait) and the invented Pune recall sample
    could sit on any vendor's page and need a clinic owner's read-aloud, and with no named customer and no
    measured revisit figure the only proof is the public rating badges.

notes:
  - 'Title 50 characters (spec 4.1 wording). Meta 136 characters, rewritten from the spec 4.1 wording ("A portal and app for booking, reports and messages, plus recall campaigns that bring patients back") to lead with the head keyword, avoid a group of three and drop the unmeasured "bring patients back" outcome.'
  - 'Grounding: live /patient-engagement-at-easyclinic/ fetched 2026-09-26. Used from it: portal and app give patients 24/7 access to health records and treatment plans, booking through the portal or app, payments and medication orders online, refill requests by direct message; customisable patient forms and enrolment links sent by SMS and WhatsApp, completed on the patient''s phone; a feedback system using surveys, ratings and forms; communication by WhatsApp, email and SMS; loyalty programmes with discounts or reward points for regular visits and keeping to a treatment plan. Dropped: the "14-Day Free Trial, 30-Day Money Back Guarantee" line (spec 12 records no free trial), "minimizes no-shows" and "higher retention" as unmeasured outcomes, and the teleconsult block (owned by /features/telehealth/).'
  - 'Plan tags follow plans.yaml only: portal and app Enterprise, WhatsApp reminders and messages Premium, SMS and email reminders Professional. Which plan includes recall campaigns, enrolment forms, feedback surveys and loyalty programmes is not in plans.yaml (the live /pricing/ lists "Patient Engagement, Patient Portal & App" under Enterprise, which plans.yaml condenses to the portal and app), so those rows and steps carry no plan tag, and the copy avoids implying they come with every plan (the featureRows intro says only the portal and app rows and the channel rows name a plan; the recall send step says "on the message channels the clinic''s plan includes"). Confirm and tag them.'
  - 'Measured revisit rate (spec 5.11 opening answer) is unknown: omitted from the opening answer and the proof block, and admitted only as a limit in the scope box and the last FAQ.'
  - 'Recall campaigns by condition come from spec 5.11 and the spec 12 screenshot brief ("Diabetes review recall, 40 patients", "with the sent list"). The sample (Dr Kulkarni, Pune, Mr Joshi, 40 patients) is invented and labelled in the intro as an illustration, not a result, with "Sample" on each step. No filter beyond condition, no due-date selection, no list editing, no automatic tracking of who booked and no automatic opt-out handling is claimed, because none is confirmed; the last step describes the desk checking the sent list against the calendar.'
  - 'Google review capture (spec 5.11) left out: the live page names feedback surveys, ratings and forms but nothing about Google reviews. The spec FAQ "feedback to Google" is dropped for the same reason.'
  - 'Spec 5.11 FAQ items not answerable with public facts and left out: cost per message (also owned by /features/whatsapp/ per 4.5 rule 3), branded app, multi-branch campaigns, feedback to Google. Replaced with the plan question, patients without the app, and the revisit-rate question answered honestly.'
  - 'Directory booking channel (spec 5.11) omitted: the directory is out of scope.'
  - 'Consent table describes the laws in general terms from src/data/regulators (in-dpdp, ke-dpa, ae-pdpl, ng-ndpa) plus the text of each law (DPDP withdrawal as easy as giving; Kenya direct-marketing consent and opt-out under the Act and the 2021 General Regulations; UAE PDPL right to object to direct marketing and Federal Law No. 2 of 2019 data localisation; NDPA withdrawal and right to object). No status column and no EasyClinic compliance claim: every regulator state is null. The /trust/ pointers ("where EasyClinic stands is kept on the trust page") were removed from the table note and the consent FAQ, and the /trust/ related link replaced with /features/emr/, because /trust/ is a draft and no status exists to point to. Needs a compliance read before a lawyer-facing use.'
  - 'Consent table fact-checked 2026-09-26 against official texts, each fetched that day, and each law name now links to its source. India: DPDP Act s5(1) notice, s6(4) withdrawal as easy as giving, s6(10) the fiduciary proves notice and consent (replaces "keeps consent records"), s8(9) published contact for questions (replaces "names a contact for grievances"); G.S.R. 843(E) and Rule 1(4) of the DPDP Rules 2025 (G.S.R. 846(E), 13 November 2025, both on meity.gov.in) bring these sections into force 18 months after publication, so the row now says May 2027. Kenya (ODPC copies): Act s2 health status is sensitive data, s37(1) express consent for commercial use; General Regulations 2021 reg 15 and 17 (opt-out statement in each direct-marketing message); Registration Regulations 2021 Third Schedule item 5 (patient care must register), which replaces the unsourced "registers as a data controller". UAE: PDPL Art. 2(2)(e) excludes health data that has its own law and Art. 17(1) gives the right to object to direct marketing (Arabic text on u.ae; uaelegislation.gov.ae blocked fetching); Federal Law No. 2 of 2019 Art. 13 (DHA-hosted copy, dha.gov.ae/uploads/112021/8af22f1c-ebe4-4e20-b157-743ac93bb20b.pdf) bars storing or transferring health data outside the State except by exemption, and u.ae states the confidentiality duty; "on health data" in the law column became "on ICT in health" (its title). Nigeria (ndpc.gov.ng copy): NDPA s65 health status is sensitive data and consent is freely given and specific, s35(2) withdrawal as easy as giving, s36(3) objection to direct marketing; NDPC Guidance Notice on registration (19 December 2024) designates health-sector controllers as of major importance, who register under s44 (replaces "above the threshold").'
  - 'WhatsApp appears as one channel (4.5 rule 3). Templates, message charges and opt-in mechanics are only pointed to /features/whatsapp/, which explains how Meta charges but gives no per-message figure, so this page no longer says that page gives "what each message costs".'
  - 'No heroMedia and no media objects: screenshots do not exist yet. When the spec 12 captures exist, add the patient app (booking, reports, messages, phone frame) as hero and the diabetes recall campaign with its sent list to the recall section.'
  - 'No testimonial: none is about the patient app or engagement, and all are placed elsewhere. Proof is the ratings badge block (review counts are unknown, so no count is shown).'
