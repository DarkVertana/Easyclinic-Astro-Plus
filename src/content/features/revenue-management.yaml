editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    Every control on the page comes from EasyClinic's own live revenue page or the spec, such as lab and
    procedure orders becoming invoice lines and each cash register closing with its own end-of-day
    report, and every plan boundary comes from EasyClinic's own price list.
  readsMachineWritten: >-
    The leak scenes, such as the April fee change and the drawer short every Friday, are labelled
    illustrations rather than a named clinic's story, and with no named person and no measured leakage or
    denial figure the page falls short of the spec 6.5 bar until a clinic owner reads it aloud and one
    real customer case is added.

notes:
  - 'Title 43 characters. Meta 139 characters, rewritten from the spec 4.1 wording ("See unbilled visits, denied claims and cash variance before month end.") to lead with the head keyword, name all four leaks and avoid a group of three.'
  - '"Revenue cycle management" appears only on this page (spec 4.5 rule 2): in the title, meta and opening answer.'
  - 'Cannibalisation (4.5 rule 2): invoice formats, GST and the till mechanics stay on /features/billing/; payer linking at registration, subscription categories, coverage and claim submission (TPA, HMO, SHA) stay on /features/insurance-claims/. Each gets one paragraph here (prose "billing-and-claims") plus a link. This page keeps leakage, denials and ageing.'
  - 'Leakage audit blog link left out: spec 4.1 says an EasyClinic post already ranks but names no URL, and spec 9.3 item 7 ("Where clinics lose revenue: a leakage audit you can run in one afternoon") is a planned post, not a published one. The audit is written as a stepList instead; link the post from its intro once the spec names it.'
  - 'Capabilities taken from the live /revenue-management/ page (re-fetched 2026-09-26): lab and procedure work orders becoming invoice lines as they are processed; price lists by payer, location and customer category; discounts for patient segments; new prices reflected in billing at once; cash registers that track cash in and out for daily reconciliation, with role-based access and end-of-day reports of cash transactions; end-of-day financial reports clinic- and organisation-wide; role-based access to reports; automated generation and distribution of reports; coverage validated at the time of care. Ageing and denial reports, unbilled visits and price lists by package come from spec 4.1 and 5.11.'
  - 'Editor pass 2026-09-26 removed claims the sources do not make: that the denial report shows each claim''s reason (no source says a denial reason is captured); that the end-of-day report itself shows the cash variance (the live page says it snapshots cash transactions, so the page now says the drawer is counted against it); that head office controls every branch''s price lists on Enterprise (plans.yaml says "Central control of every location", so that wording is used); "on a schedule" for reports (the live page says automated generation and distribution); "ordered in the chart" (the live page says lab orders and procedures, not where they are ordered).'
  - 'Plan tags only where plans.yaml is explicit or the dependency is certain: payer price lists (claims add-on body in plans.yaml), package treatments (Premium), and the ageing and denial reports, tagged Enterprise because they report on payer claims, which need insurance claims (Enterprise, add-on on Professional and Premium). Which plan carries location price lists, patient-category pricing, the unbilled-visits report, cash registers and automated reports is not stated, so those rows carry no tag.'
  - 'The month-end FAQ mentions the integrations add-on only as plans.yaml words it (connections to an accounting system, scoped per project, on Professional and Premium); no named accounting integration or its status is stated.'
  - 'Left out for lack of a confirmed fact: a measured number for any of the four leaks (spec 5.11 asks for one "where measured"); the 34% denied-claims and 23% to under 4% rejection figures (no public source, facts.md section 4); the spec 5.11 FAQ on revenue per doctor (no confirmed report; also left out of clinic-chain.yaml); report columns and ageing buckets; denial reason capture; how package sessions are tracked (open question on the physiotherapy page); whether EasyClinic works denied claims on the clinic''s behalf; Tally or accounting export (integration status unknown).'
  - 'Left out from the live page as unsourced marketing: "faster reimbursement cycles", "revenue impact analysis", "significantly reducing claim rejections", and the "14-Day Free Trial" / "30-Day Money Back Guarantee" line on the live dashboards page (not in the confirmed facts).'
  - 'Orders-inventory integration (product usage reflected on the invoice) is on the live page but needs inventory, which is Enterprise or an add-on; left for /features/pharmacy-and-inventory/.'
  - 'No testimonials (all placed elsewhere). Proof is the ratings badge block; review counts are unknown (facts.yaml capterraReviews and googleReviews are null), so no count is shown.'
  - 'No heroMedia and no media objects: screenshots do not exist yet. When the spec 12 captures exist, the hero is the day-end cash close for one register, and the claim status list with denials goes on the denial report row.'
  - 'The redirect from /revenue-management/ is already in src/data/redirects.yaml, so no redirectFrom is set here.'
