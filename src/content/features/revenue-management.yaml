sections:
  - discriminant: painBlocks
    value:
      id: four-leaks
      heading: Where does a clinic's revenue leak?
      intro: >-
        In four places between the consult and the bank: orders that never reach a bill, prices taken
        from the wrong list, a cash drawer that does not match its register, and claims the payer
        denies. None of them shows on a single day's takings. They show at month end, when the total is
        lower than the waiting room suggested. The scenes below are illustrations of how each leak
        happens, not cases from a named clinic.
      items:
        - heading: Why do orders from the consult go unbilled?
          body: >-
            At the end of the consult the doctor asks for a dressing and a blood sugar test. The nurse
            does both while the patient pays for the consult at the desk. The patient goes home, and the
            dressing is on no bill. Nobody decided not to charge for it. The order was in the doctor's
            note and never reached the person writing the bill.
          fix: >-
            Lab orders and procedures become lines on the patient's invoice as they are done, without
            anyone carrying the order to the desk. The visits with no bill against them are on a report
            the owner can check on any day of the month.
          href: /features/billing/
          linkLabel: How orders become invoice lines
        - heading: How does a bill end up at the wrong price?
          body: >-
            The consultation fee went up in April, and one receptionist still types the old one. A
            patient whose employer pays is billed at the walk-in rate. Each bill looks right to the
            person who wrote it, and the difference only shows when someone compares a month of bills
            with the price list.
          fix: >-
            Each bill takes its price from the price list that applies to the patient and the branch,
            so the desk does not have to remember it. When the owner
            changes a price on the list, the next bill carries it.
        - heading: Why does the cash drawer not match the day's bills?
          body: >-
            At closing time the drawer is short by a few hundred rupees. Perhaps a refund was handed back
            without a slip, or a UPI payment went into the book as cash. By the next morning nobody
            remembers which. When the same counter is short every Friday, the owner hears about it at
            month end, if at all.
          fix: >-
            Each cash register records the cash that comes in and goes out through it, and closes the
            day with an end-of-day report of its own transactions. Count the drawer against that report
            and a gap shows the same evening, and because access to each register is set by role, the
            gap points to one counter and the staff allowed to use it.
          href: /features/billing/
          linkLabel: How the day-end close works
        - heading: What happens to a claim after the payer denies it?
          body: >-
            The denial arrives weeks after the visit with a reason code nobody at the desk recognises,
            and it goes into a tray to be dealt with later. By the time anyone looks, the window to
            resubmit may have closed, and the claim is written off without anyone deciding to write it
            off.
          fix: >-
            Denied claims are listed on the denial report, and the ageing report shows the claims still
            unpaid and how long each has waited. Both are there before month end, so the claims worth
            resubmitting are found while there is still time.
          href: /features/insurance-claims/
          linkLabel: How claims are checked before they leave

  - discriminant: featureRows
    value:
      id: price-lists
      heading: Price lists by location, payer, package and patient category
      intro: >-
        A price typed at the desk is only as right as the memory of whoever types it. In EasyClinic the
        bill takes its price from the list that applies to that patient. Where a list needs a particular
        plan, the row says so.
      items:
        - heading: A price list for each location
          body: >-
            Each branch can have its own price list, so a scan costs what that branch charges and not
            what the first clinic charged when the system was set up. Running more than one location
            needs Premium or Enterprise, and Enterprise adds central control of every location from
            head office.
          link:
            label: See how one system runs every branch
            href: /features/multi-location/
        - heading: A price list for each payer
          body: >-
            A corporate client or an insurer can have its own rates, applied once the patient's payer is
            linked to the record at registration, so the employer's patient is not billed at the walk-in
            rate. Payer price lists come with insurance claims, which is part of Enterprise and an add-on
            on Professional or Premium.
          plan: enterprise
          link:
            label: Read how payer plans are set up
            href: /features/insurance-claims/
        - heading: A price for each package
          body: >-
            A package of treatment has its own price on the list, so the patient is billed the package
            price the clinic set rather than one worked out at the desk. Package treatments come with
            Premium and Enterprise.
          plan: premium
        - heading: Prices and discounts for a category of patient
          body: >-
            Prices and discounts can be set for a category of patients, such as your own staff or the
            members of a scheme you run, so the desk applies the discount the owner decided on. A price
            changed on any list shows on the next bill.

  - discriminant: featureRows
    value:
      id: reports
      heading: The reports an owner checks before month end
      intro: >-
        Denial management starts with knowing which claims were denied. The ageing and denial reports
        work on payer claims, so they need insurance claims, which is part of Enterprise and an add-on
        on Professional or Premium.
      items:
        - heading: Visits with no bill against them
          body: >-
            A visit where the patient was seen and nothing was billed shows up before month end, so the
            desk can raise the missing bill while the patient is still easy to reach. Each line on it is
            money for work the clinic has already done.
        - heading: The day-end close for every cash register
          body: >-
            Each register closes the day with its own end-of-day report of the cash taken and paid out,
            and the end-of-day report also runs for the whole clinic or, with more than one location,
            across the organisation. A drawer that does not match its register is found the same
            evening.
        - heading: Claims the payer turned down
          body: >-
            The denial report lists the claims payers have turned down, so someone can work through them
            while a resubmission is still possible and write off the rest on purpose rather than by
            default. Counting them each month gives your own denial rate, which is the number to watch.
          plan: enterprise
        - heading: What each payer owes, and for how long
          body: >-
            The ageing report sorts unpaid claims by how long each has waited for payment, so the oldest
            money is chased first and a slow payer shows up before month end.
          plan: enterprise
        - heading: Who can see the money
          body: >-
            Access to the financial reports and to each cash register is set by role. The clinic's
            revenue can stay with the owner and the accountant while the front desk still takes payments.
        - heading: Reports that arrive without being run
          body: >-
            Reports can be generated and sent out automatically, so the day-end totals reach the owner
            without anyone running them by hand.
          link:
            label: Read about reports and dashboards
            href: /features/reports-and-dashboards/

  - discriminant: prose
    value:
      id: billing-and-claims
      heading: Where billing and claims fit
      body: >-
        Every control on this page rests on billing: the bill built from the visit, and the payment
        taken against it at the counter. Billing and payments come with every plan, and the [billing
        page](/features/billing/) covers how invoices are built and how the counter takes payment.


        Claims are where the fourth leak starts. How the patient's payer is linked at registration and
        how each claim is built and sent are on the [insurance claims page](/features/insurance-claims/).
        This page picks up once the payer answers: the denied claim, and the payment that has not
        arrived.

  - discriminant: stepList
    value:
      id: leakage-audit
      heading: A leakage audit you can run on last month's figures
      intro: >-
        You can run these four checks before you choose any software, from the registers and the receipt
        book if that is what you have. Each step says where the same check sits in EasyClinic.
      steps:
        - title: Match orders to bills
          meta: Unbilled orders
          body: >-
            Take every lab test and procedure ordered last month and find the bill it went on. Anything
            without one is revenue the clinic earned and never asked for. In EasyClinic, the visits with
            no bill against them are already on a report.
        - title: Check prices against the list
          meta: Wrong price list
          body: >-
            Pick twenty bills from different days and check each price against the list for that branch
            and that payer. In EasyClinic the check moves to the price lists themselves, because each
            bill takes its price from them.
        - title: Add up the day-end differences
          meta: Cash variance
          body: >-
            Add up the gap between cash counted and cash billed for each counter, day by day. A single
            short day is usually a mistake, and the same counter short every week is worth a
            conversation. In EasyClinic, each register has its own end-of-day report to count the drawer
            against.
        - title: List denied and unpaid claims
          meta: Denied claims
          body: >-
            List every claim denied last month, and every claim still unpaid after your payers' usual
            payment time. Each one is money for work already done. In EasyClinic, the denial and ageing
            reports hold both lists.
      note: >-
        This page gives no figure for what an audit usually finds, because EasyClinic has not published
        a measured leakage rate across the clinics that use it.

  - discriminant: proofBlock
    value:
      id: ratings
      heading: How EasyClinic is rated on Capterra and Google
      intro: >-
        The Capterra link opens the reviews themselves, so you can read what reviewers wrote about
        EasyClinic before you book a demo.
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'

faqHeading: Questions owners ask about revenue management
faq:
  - question: Can each of my clinics charge different prices?
    answer: >-
      Yes, each location can have its own price list, and running more than one location needs Premium
      or Enterprise. Enterprise adds central control of every location from head office, and a price
      changed on a list shows on the next bill.
  - question: Can I see which visits were never billed?
    answer: >-
      Yes, the visits where a patient was seen and nothing was billed show up before month end, so the
      desk can raise the missing bill while the patient is still easy to reach. Lab orders and
      procedures also become invoice lines as they are done, so fewer go missing in the first place.
  - question: How do I find out why the cash drawer is short?
    answer: >-
      Each cash register keeps its own record of the cash in and out and closes the day with its own
      end-of-day report, so a short drawer is traced to one counter on the evening it happens rather
      than at month end. Because access to each register is set by role, the staff allowed to use that
      counter are known too.
  - question: How much will EasyClinic cut our denied claims?
    answer: >-
      We do not publish a percentage for that, because we have no measured figure across our clinics
      that we can source. What changes is when the problems are found: coverage is checked against the
      patient's payer plan at the time of care, and the denial report lists the denied claims, so you
      can measure your own denial rate from the first month and see whether it falls.
  - question: Does EasyClinic do our month-end accounts?
    answer: >-
      Only on Enterprise, which includes financial accounting; Professional and Premium do not. On
      those plans EasyClinic holds the bills and payments, and your accountant keeps the books in the
      software they use now. A connection to your accounting system can be scoped as a project under
      the integrations add-on.
  - question: Which plan do I need for revenue management?
    answer: >-
      Every plan includes billing, payments, dashboards and reports, from
      {price:usd.professional.annual} per doctor per month billed annually
      ({price:inr.professional.annual} in India). Premium, at {price:usd.premium.annual} on the same
      terms, adds package treatments and more than one location. Payer price lists and the ageing and
      denial reports need insurance claims, which is part of Enterprise and an add-on on Professional or
      Premium, and Enterprise is priced on a quote.
  - question: Can I stop the front desk seeing our revenue?
    answer: >-
      Yes, access to the financial reports and to each cash register is set by role, so the front desk
      can take payments without seeing the clinic's revenue reports. The owner decides which roles see
      which reports.

