        This page picks up once the payer answers: the denied claim, and the payment that has not
        arrived.

  - discriminant: splitContent
    value:
      id: order-management
      heading: Order Management for Invoice Automation
      centerHeading: true
      featureList: true
      narrowMedia: true
      alignTop: true
      body: |-
        Efficiently track orders and automate billing workflows. Generate invoices automatically based on predefined payor rules, ensuring faster and more accurate billing. Say goodbye to manual errors and delays in payment processing.

        ### Real-Time Work Order integration and Tracking
        Whether it's lab order or procedure, monitor each work orders and integrate with invoices in real time as they're processed to generate corresponding invoice lines automatically and reduce manual data entry.

        ### Error-Free Billing With Customized Invoicing Rules
        By pre-defining payor contracts and billing rules, invoices generated are accurate, reducing the risk of rejected claims due to inconsistencies or errors.

        ### Orders-Inventory Integration:
        Sync with inventory systems to reflect product usage in real-time, ensuring accurate invoicing and inventory management.

        ### Faster Reimbursement Cycles:
        Automated invoicing means your clinic sends claims to payors faster, leading to quicker reimbursements and improved cash flow.
      media:
        kind: screenshot
        src: ../../assets/images/solutions/ORD1.png
        alt: 'An Easy Clinic patient profile with the summary of the last visit and the patient''s payors, membership number, subscription category and expiry date'
        frame: none

  - discriminant: splitContent
    value:
      id: payor-management
      heading: Payor Management and Claim Streamlining
      centerHeading: true
      mediaFirst: true
      featureList: true
      narrowMedia: true
      alignTop: true
      body: |-
        Easily add and manage multiple payors in just a few clicks. Create customized profiles to streamline the onboarding process and minimize errors.

        ### Add Payors in Minutes:
        With Easy Clinic, onboarding new insurance or corporate payors is a breeze. You can add payors to the system with just a few clicks, ensuring all details like billing rates, contract terms, and coverage information are entered once and applied automatically across all patient interactions.

        ### Customizable Plans for Different Payors:
        Easily create and manage subscription categories for various payors. Each category can include different services, coverage levels, and restrictions based on the payor's contract, giving you flexibility in handling multiple payor agreements seamlessly.

        ### Simplified Management of Benefits:
        Automatically track and apply different service limits, benefit coverage, and payment rates for various payors, reducing complexity and ensuring smooth billing.

        ### Tailored to Your Clinic's Needs:
        Customize these categories to match the specific needs of your clinic and patients, allowing for a better-managed payor ecosystem.
      media:
        kind: screenshot
        src: ../../assets/images/solutions/CR3.png
        alt: 'Setting a category rule in Easy Clinic: maximum cover, co-pay amount and percentage, and patient rules by gender, age range and patient category'
        frame: none

  - discriminant: splitContent
    value:
      id: coverage-management
      heading: Comprehensive Coverage Management
      centerHeading: true
      featureList: true
      narrowMedia: true
      alignTop: true
      body: |-
        Assign specific coverage categories to payors, reducing claim rejections by ensuring that only covered services are billed. The system validates each claim in real-time, preventing errors.

        ### Assign Specific Coverage:
        Manage different coverage levels for various payors with ease. Whether it's a corporate health plan or an insurance provider, you can assign exact coverage types, including exclusions and service limitations, to prevent billing errors.

        ### Billing Transparency:
        With clear coverage information tied to each payor, your staff can quickly determine what is covered under a patient's plan, improving transparency and reducing confusion during billing.

        ### Avoid Claim Rejections:
        By validating coverage at the time of care, the system helps avoid submitting claims for uncovered services, significantly reducing claim rejections and administrative burden.

        ### Automate Patient-to-Payor Linking:
        Automatically link patients to their respective payor plans upon registration, ensuring the correct payor rules are applied to each patient's billing cycle from the start.
      media:
        kind: screenshot
        src: ../../assets/images/solutions/Payor-5.png
        alt: 'Payor exclusions in Easy Clinic: excluded clinics, product categories, individual products such as X-rays and medicines, and clinic types'
        frame: none

