sections:
  - discriminant: painBlocks
    value:
      id: four-leaks
      heading: Where does a clinic's revenue leak?
      intro: >-
        In four places between the consult and the bank: orders that never reach a bill, prices taken
        from the wrong list, a cash drawer that does not match its register, and claims the payer
        denies. None of them shows on a single day's takings. They show at month end, when the total is
        lower than the waiting room suggested. The scenes below are illustrations of how each leak
        happens, not cases from a named clinic.
      items:
        - heading: Why do orders from the consult go unbilled?
          body: >-
            At the end of the consult the doctor asks for a dressing and a blood sugar test. The nurse
            does both while the patient pays for the consult at the desk. The patient goes home, and the
            dressing is on no bill. Nobody decided not to charge for it. The order was in the doctor's
            note and never reached the person writing the bill.
          fix: >-
            Lab orders and procedures become lines on the patient's invoice as they are done, without
            anyone carrying the order to the desk. The visits with no bill against them are on a report
            the owner can check on any day of the month.
        - heading: How does a bill end up at the wrong price?
          body: >-
            The consultation fee went up in April, and one receptionist still types the old one. A
            patient whose employer pays is billed at the walk-in rate. Each bill looks right to the
            person who wrote it, and the difference only shows when someone compares a month of bills
            with the price list.
          fix: >-
            Each bill takes its price from the price list that applies to the patient and the branch,
            so the desk does not have to remember it. When the owner
            changes a price on the list, the next bill carries it.
        - heading: Why does the cash drawer not match the day's bills?
          body: >-
            At closing time the drawer is short by a few hundred rupees. Perhaps a refund was handed back
            without a slip, or a UPI payment went into the book as cash. By the next morning nobody
            remembers which. When the same counter is short every Friday, the owner hears about it at
            month end, if at all.
          fix: >-
            Each cash register records the cash that comes in and goes out through it, and closes the
            day with an end-of-day report of its own transactions. Count the drawer against that report
            and a gap shows the same evening, and because access to each register is set by role, the
            gap points to one counter and the staff allowed to use it.
        - heading: What happens to a claim after the payer denies it?
          body: >-
            The denial arrives weeks after the visit with a reason code nobody at the desk recognises,
            and it goes into a tray to be dealt with later. By the time anyone looks, the window to
            resubmit may have closed, and the claim is written off without anyone deciding to write it
            off.
          fix: >-
            Denied claims are listed on the denial report, and the ageing report shows the claims still
            unpaid and how long each has waited. Both are there before month end, so the claims worth
            resubmitting are found while there is still time.

  - discriminant: featureRows
    value:
      id: price-lists
      heading: Price lists by location, payer, package and patient category
      layout: grid
      intro: >-
        A price typed at the desk is only as right as the memory of whoever types it. In Easy Clinic the
        bill takes its price from the list that applies to that patient. Where a list needs a particular
        plan, the row says so.
      items:
        - heading: A price list for each location
          icon: map-pin
          body: >-
            Each branch can have its own price list, so a scan costs what that branch charges and not
            what the first clinic charged when the system was set up. Running more than one location
            needs Premium or Enterprise, and Enterprise adds central control of every location from
            head office.
        - heading: A price list for each payer
          icon: shield-check
          body: >-
            A corporate client or an insurer can have its own rates, applied once the patient's payer is
            linked to the record at registration, so the employer's patient is not billed at the walk-in
            rate. Payer price lists come with insurance claims, which is part of Enterprise and an add-on
            on Professional or Premium.
        - heading: A price for each package
          icon: package
          body: >-
            A package of treatment has its own price on the list, so the patient is billed the package
            price the clinic set rather than one worked out at the desk. Package treatments come with
            Premium and Enterprise.
        - heading: Prices and discounts for a category of patient
          icon: users
          body: >-
            Prices and discounts can be set for a category of patients, such as your own staff or the
            members of a scheme you run, so the desk applies the discount the owner decided on. A price
            changed on any list shows on the next bill.

