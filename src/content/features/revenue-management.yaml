faqHeading: Questions owners ask about revenue management
faq:
  - question: Can each of my clinics charge different prices?
    answer: >-
      Yes, each location can have its own price list, and running more than one location needs Premium
      or Enterprise. Enterprise adds central control of every location from head office, and a price
      changed on a list shows on the next bill.
  - question: Can I see which visits were never billed?
    answer: >-
      Yes, the visits where a patient was seen and nothing was billed show up before month end, so the
      desk can raise the missing bill while the patient is still easy to reach. Lab orders and
      procedures also become invoice lines as they are done, so fewer go missing in the first place.
  - question: How do I find out why the cash drawer is short?
    answer: >-
      Each cash register keeps its own record of the cash in and out and closes the day with its own
      end-of-day report, so a short drawer is traced to one counter on the evening it happens rather
      than at month end. Because access to each register is set by role, the staff allowed to use that
      counter are known too.
  - question: How much will Easy Clinic cut our denied claims?
    answer: >-
      We do not publish a percentage for that, because we have no measured figure across our clinics
      that we can source. What changes is when the problems are found: coverage is checked against the
      patient's payer plan at the time of care, and the denial report lists the denied claims, so you
      can measure your own denial rate from the first month and see whether it falls.
  - question: Does Easy Clinic do our month-end accounts?
    answer: >-
      Only on Enterprise, which includes financial accounting; Professional and Premium do not. On
      those plans Easy Clinic holds the bills and payments, and your accountant keeps the books in the
      software they use now. A connection to your accounting system can be scoped as a project under
      the integrations add-on.
  - question: Which plan do I need for revenue management?
    answer: >-
      Every plan includes billing, payments, dashboards and reports, from
      {price:usd.professional.annual} per doctor per month billed annually
      ({price:inr.professional.annual} in India). Premium, at {price:usd.premium.annual} on the same
      terms, adds package treatments and more than one location. Payer price lists and the ageing and
      denial reports need insurance claims, which is part of Enterprise and an add-on on Professional or
      Premium, and Enterprise is priced on a quote.
  - question: Can I stop the front desk seeing our revenue?
    answer: >-
      Yes, access to the financial reports and to each cash register is set by role, so the front desk
      can take payments without seeing the clinic's revenue reports. The owner decides which roles see
      which reports.

