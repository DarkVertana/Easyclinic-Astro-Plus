linkLabel: Revenue management
eyebrow: Revenue management
openingAnswer: >-
  EasyClinic's revenue cycle management (RCM) puts a control on each of the four places a clinic's
  revenue leaks: lab orders and procedures become invoice lines as they are done, each bill takes its
  price from the price list that applies, every cash register closes the day with its own end-of-day
  report, and denied claims are listed on a denial report. Billing comes with every plan from
  {price:usd.professional.annual} per doctor per month billed annually, and the claim reports need
  insurance claims, which is part of Enterprise and an add-on on Professional or Premium.
summary: >-
  Four leaks found before month end, each with its own control: unbilled orders, wrong price lists,
  cash variance and denied claims.
