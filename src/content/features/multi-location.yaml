  - discriminant: dataTable
    value:
      id: plans
      heading: What more than one location costs
      intro: >-
        Easy Clinic is priced per doctor per month, and the plan decides whether you can run more than one
        location. The reception login is included on every plan, and there is no contract.
      caption: Locations and prices by plan, per doctor per month on annual billing
      columns:
        - Plan
        - Locations
        - Price per doctor per month
        - What it adds for a group of clinics
      rows:
        - - Professional
          - One
          - '{price:usd.professional.annual} billed annually, {price:inr.professional.annual} in India'
          - A single clinic. A second branch means moving to Premium.
        - - Premium
          - More than one
          - '{price:usd.premium.annual} billed annually, {price:inr.premium.annual} in India'
          - More than one location, specialty EMR templates, your own clinical forms and a named account manager
        - - Enterprise
          - More than one, under central control
          - Quoted for your group
          - Central control of every location, clinical SOP tracking across branches, stock transfers and a reporting server with custom analytics
      note: >-
        Quarterly billing costs more: {price:usd.premium.quarterly} per doctor per month on Premium, or
        {price:inr.premium.quarterly} in India. [See every plan side by side](/pricing/).

faqHeading: Questions owners ask before opening a second branch
faq:
  - question: We run one clinic today. Do we change systems when we open a second?
    answer: >-
      No: the second branch is added as a new location in the account you already use, so its doctors
      open the same patient records from the first day. Professional covers one location, so a clinic on
      Professional moves to Premium, which covers more than one, at {price:usd.premium.annual} per doctor
      per month billed annually or {price:inr.premium.annual} in India. Easy Clinic's published prices are
      per doctor, with no separate line for a branch; Enterprise has no list price and is quoted for each
      group.
  - question: When does a group of clinics need Enterprise rather than Premium?
    answer: >-
      When head office wants to control the branches as well as run them in one account. Enterprise adds
      central control of every location, clinical SOP tracking across branches, stock transfers between
      branches and workflow rules, such as approval for a discount above the limit. Premium runs more than
      one location without those.
  - question: Does a patient have to register again at the second branch?
    answer: >-
      No: a patient registered at one branch is the same patient at every branch, so the doctor at the
      second branch opens the record the first branch has been writing in, with every visit note and
      scanned report on it.
  - question: Can one call centre book appointments for every branch?
    answer: >-
      Yes, appointments can be booked centrally across locations, so one phone line books a patient into
      whichever branch suits them. Each branch keeps its own slots and walk-ins, and the patient arrives at
      a branch that already has her record.
  - question: Does each branch need its own server?
    answer: >-
      No: Easy Clinic is cloud software, so every branch works in the same account over the internet, and
      Enterprise offers private cloud hosting on request. It does not run fully offline today, so each
      branch needs a working connection, and a backup such as a mobile hotspot is worth keeping for the day
      the main line drops.
  - question: Who trains the staff at a new branch?
    answer: >-
      We do, on every plan: training and support are unlimited, so each new branch's staff take the same
      four short sessions as the first branch, about two hours in all. Premium and Enterprise also include
      a named account manager.

