secondaryKeywords:
  - multi-clinic software
  - multi-site practice management software
title: 'Multi-Location Clinic Software: Easy Clinic'
metaDescription: 'Multi-location clinic management software: one login and one patient record for every branch, and on Enterprise, price lists and SOPs set at head office.'
h1: One system for every clinic location
linkLabel: Multi-location clinic software
eyebrow: Multi-location
openingAnswer: >-
  Every branch is a location in one Easy Clinic account, from a second clinic to a chain of
  {fact:largestChain}, so each patient has one record and each doctor one login. More than one location
  comes with Premium, at {price:usd.premium.annual} per doctor per month billed annually, and Enterprise
  adds central control.
summary: >-
  Every branch as a location in one account, with one patient record and one login per person. More
  than one location comes with Premium, and central control with Enterprise.
