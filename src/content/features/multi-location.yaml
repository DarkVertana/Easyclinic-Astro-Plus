editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    How Easy Clinic's price list splits locations between plans, and the four clinic types head office can
    give their own access (owned, franchise, mobile medical unit, associate), come from Easy Clinic's own
    price list and live chain page.
  readsMachineWritten: >-
    The pain scenes are labelled illustrations rather than a named customer's story, and the page has no
    named person or measured multi-location outcome, so replace them when a group customer supplies a real
    case.

notes:
  - 'Title is the spec 4.1 wording (42 characters). Meta rewritten to lead with the head keyword and avoid the group of three in the spec wording ("One login for every branch, central price lists and SOPs, per-branch reports"); head office price lists and SOPs are scoped to Enterprise, as on the rest of the page; 153 characters, no tokens. H1 is the spec 4.1 wording.'
  - 'Architecture ("one tenant, many branches", spec 5.11) is described in plain words as "each branch is a location in one account". No technical claims (database, isolation, sync) are made; the only hosting claim is Enterprise private cloud hosting on request, from plans.yaml.'
  - 'Plans: Professional one location, Premium "More than one location", Enterprise "Central control of every location", "Clinical SOP tracking across branches", "Inventory and stock transfers", "Workflow rules", "A reporting server and custom analytics" and "Private cloud hosting on request" (plans.yaml). Head office control (price lists by branch, access by clinic type, SOPs) is attributed to Enterprise because plans.yaml puts central control there; which of these Premium also allows is not known, so the page does not claim it for Premium.'
  - 'Grounding: live /clinic-chain-software/ (read 2026-09-26) states plainly: owned clinics, franchisees, mobile medical units and associate clinics with access levels to data and features for each type; "One Patient One Record" and central access to patient records across locations; centralised multi-location scheduling and a centralised call centre; roles (Administrator, Doctor, Pharmacist) with multi-location access settings and an audit trail; price lists by payor, location, customer type, clinician and visit type with automated price selection; discount approval through the Workflow Manager; cross-location analytics, access-controlled reports and Excel and PDF export; stock transfers between locations or from a central warehouse, tracked through transit; SOP adherence overseen by chief medical officers.'
  - 'Left out from that page: "5 or 500 clinics" and "over 100 graphical dashboards" (marketing numbers); HIPAA, PCI-DSS, GDPR, ABHA, HL7, FHIR, DICOM and coding standards (compliance and integration status unknown); Power BI and Azure Data Factory (integration status unknown); data warehouse beyond the plans.yaml reporting server; roster, attendance and incentive plans (HR module, plan unknown); patient portal family accounts across branches (Enterprise, and owned by /features/patient-engagement/).'
  - 'Left out for lack of a confirmed fact: how long a new branch takes to go live (no day count; {fact:goLiveDays} is the fastest single-clinic case); how consent works when a patient record is shared across branches (spec 5.11 says "with consent"; the page describes only the shared record); whether staff at one branch can be kept from another branch''s patients (data segregation beyond "access for each type of clinic"); whether a doctor who works at two branches needs one licence or two; whether any per-location fee exists (live /pricing/ is per doctor, the live Kenya listicle says "per user and per location"; the FAQ states only what the published price list says); which plan includes central booking and location price lists; consolidated invoicing across branches (billing owns invoices and GST, rule 4.5.2); data export on leaving.'
  - 'FAQ (editor pass, 26 September 2026): six questions, as spec 5.11 asks. The franchise question and the separate "per branch or per doctor" question were dropped because /solutions/clinic-chain/ carries both (it owns "franchise clinic software", spec 4.2); the per-doctor pricing answer is folded into the first FAQ, which answers what the second branch costs (spec 2.5). "Price lists by location" is not a FAQ here because /features/revenue-management/ owns it (spec 5.11). Added "Does a patient have to register again at the second branch?", answered from the shared record only (consent handling unknown).'
  - 'Editor pass removals: "counted the same way at each" on the reports row (not stated on the live page); "usually the chief medical officer" (the live page says CMOs oversee SOP adherence, not that they usually set SOPs); the featureRows intro no longer says each row names its plan, because the plan for central booking and cross-location reports is unknown; the pain intro now says the patient and doctors are illustrations; the clinic-chain related description lost its group of three.'
  - 'Cannibalisation (4.5): no GST, invoice or claim mechanics; no leakage, denial or ageing language (the fee and discount scenes are framed as control, not revenue cycle); WhatsApp appears nowhere as infrastructure. Reports, stock transfers and appointment booking are one row each, linking to their own feature pages.'
  - 'Proof block is the badges variant with fact tokens (the registry resolves tokens in badge ratings). Review counts are unknown (capterraReviews and googleReviews null) and are left out. No testimonial: all are placed on other pages.'
  - 'No heroMedia and no media objects: screenshots do not exist yet. When spec 12 captures exist, the hero is the branch-by-branch KPI comparison (five branches), and the stock transfer screen belongs on the stock row.'
  - 'Related links: all five solution pages (spec 2.9), /pricing/ for the Enterprise plan (spec 5.11), plus /features/reports-and-dashboards/ and /features/pharmacy-and-inventory/ (8 in total).'
  - 'Audit 2026-09-27: the "Bring the records across" step no longer says a branch''s records are moved in a data migration. The patient list is the only confirmed migration fact (/switch/, /compare/healthplix-alternatives/), so the step says that and tells the clinic to agree the rest in writing.'
