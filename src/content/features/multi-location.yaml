sections:
  - discriminant: painBlocks
    value:
      id: second-branch
      heading: Where a second branch goes wrong
      intro: >-
        A second branch is often opened on whatever is quickest to set up there, a copy of the first
        clinic's software or a paper register. These are the first things to go wrong. The patient and
        the doctors below are illustrations, not a named clinic.
      items:
        - heading: The same patient is registered twice
          body: >-
            A patient who has come to the main clinic for six years walks into the new branch and is
            registered as new. Her blood pressure readings and her last prescriptions are across town, so
            the doctor starts from what she remembers.
          fix: >-
            Every branch is a location in the same Easy Clinic account, so she has one record. The doctor
            at the new branch opens the chart the main clinic has been writing in.
        - heading: The new branch charges last year's fee
          body: >-
            The fee list at the new branch is a printout from the month it opened. The main clinic raised
            its consultation fee in April and the new branch never heard. Nobody notices until someone
            compares the takings at the end of the quarter.
          fix: >-
            On Enterprise, head office keeps the price lists for every branch and the bill picks the price
            for the branch where the patient pays, so a fee change is made once.
        - heading: The doctor who covers both branches keeps two logins
          body: >-
            The paediatrician sees patients at the main clinic in the mornings and at the new branch on
            Thursday evenings. On two systems she has two passwords and two patient lists, and on Thursday
            she cannot see what she wrote on Monday.
          fix: >-
            She signs in with one login at both branches and writes on the same patient record, in the
            same templates.

  - discriminant: featureRows
    value:
      id: how-it-works
      heading: How one account holds every branch
      intro: >-
        What changes when the second clinic opens, in the order you meet it. A second location needs
        Premium or Enterprise, and moving stock between branches needs Enterprise.
      items:
        - heading: Each branch is a location in one account
          body: >-
            A new branch is added as a location in the account your first clinic already uses, with its
            own appointment book and its own takings. Every branch works from the same patient list, and
            head office can look at one branch on its own or at all of them together.
          plan: premium
          link:
            label: Compare what each plan includes
            href: /pricing/
        - heading: One patient, one record, at every branch
          body: >-
            A patient registered at one branch is the same patient at the next. Everything written at the
            main clinic, from the visit notes to the scanned reports, is on the chart the second branch's
            doctor opens, so the history is not taken twice and last month's blood test is not repeated by
            mistake.
          link:
            label: Read how the patient record works
            href: /features/emr/
        - heading: One login for each person, at whichever branch they work
          body: >-
            A doctor who works at two branches signs in with the same login at both. Each login carries a
            role, such as doctor or pharmacist, which decides what it can open, and a role's access can be
            set location by location. The reception login, included in the price, cannot open the EMR or
            issue a prescription.
        - heading: Appointments for every branch from one desk
          body: >-
            Appointments can be booked centrally across locations, so a central phone line or call centre
            books a patient into whichever branch's calendar suits them. Each branch still runs its own
            slots and its own walk-ins.
          link:
            label: See how appointments work
            href: /features/appointment-scheduling/
        - heading: Reports for one branch, or every branch side by side
          body: >-
            Dashboards and reports come with every plan. With more than one location, a report runs for a
            single branch or across all of them, and only the logins allowed to see a report can open it.
            Reports export to Excel and PDF.
          bullets:
            - A reporting server and custom analytics for large chains, on Enterprise
          link:
            label: See the reports and dashboards
            href: /features/reports-and-dashboards/
        - heading: Stock moved between branches
          body: >-
            Stock moves from one branch to another, or from a central store out to the clinics, on a
            transfer that is tracked from the day it leaves one branch until the other receives it. A
            branch that runs short of an antibiotic takes it from a branch that holds plenty, instead of
            buying it from the chemist next door.
          plan: enterprise
          link:
            label: See pharmacy and inventory
            href: /features/pharmacy-and-inventory/

  - discriminant: dataTable
    value:
      id: head-office-and-branch
      heading: What head office sets and what each branch keeps
      intro: >-
        Premium runs more than one location in one account. Central control of every location comes with
        Enterprise, and this is how it divides the work between head office and the branches.
      caption: Who sets what in a group of clinics on the Enterprise plan
      columns:
        - What
        - Who sets it
        - What happens at the branch
      rows:
        - - Clinical SOPs
          - Head office
          - Every branch works from the same SOPs, and SOP tracking lets the chief medical officer see how closely each branch follows them.
        - - Price lists
          - Head office
          - The bill picks the price for the branch, from one list for the whole group or a list of the branch's own.
        - - Note templates and clinical forms
          - Head office
          - Doctors at every branch write in the same templates, so a note from one branch reads like a note from any other.
        - - Access for each type of clinic
          - Head office
          - Owned branches, franchise clinics, mobile medical units and associate clinics are each given their own access to data and features.
        - - Discounts above the limit
          - Head office sets the limit
          - A larger discount waits for approval from the person head office names, as one of Enterprise's workflow rules.
        - - Appointment slots and doctor timings
          - The branch
          - Set around the branch's own doctors and opening hours.
        - - Staff and shifts
          - The branch
          - Each branch organises its own staff and their shifts.
      note: Specialty EMR templates and your own clinical forms are also part of Premium.

  - discriminant: stepList
    value:
      id: new-branch
      heading: Opening a new branch on Easy Clinic
      intro: >-
        The steps are the same for the second branch and the twentieth. How long each takes depends on the
        branch, so this list gives the order rather than a date.
      steps:
        - title: Tell us about the branch
          body: >-
            Who will work there, and whether its patients are on paper or on another system today. If a
            franchisee will run it, say so, because a franchise can be given different access from an
            owned branch.
        - title: Add the location
          body: >-
            The branch is added as a new location in the account your clinics already use. A clinic on
            Professional, which covers one location, moves to Premium at this step.
        - title: Put head office settings in place
          body: >-
            On Enterprise, head office's price lists and SOPs are set for the new branch before its first
            patient, and its doctors write in the same templates as everyone else. The branch sets its own
            appointment slots and doctor timings.
        - title: Give everyone a login
          body: >-
            Each member of staff gets a login with a role. A doctor who already works at another branch
            keeps the login she has, and the reception login is included in the price.
        - title: Bring the records across
          body: >-
            If the branch has patients on another system, their patient list is moved across; agree in
            writing what else comes across. Old paper notes can be scanned and attached to each patient's
            record.
        - title: Train the branch staff
          meta: Four short sessions, about two hours in all
          body: >-
            Training is unlimited on every plan, so the new branch's staff get the same path as the first
            branch: basic training (40 minutes), EMR scenarios (40 minutes), practice exercises (20
            minutes) and the road to expertise (20 minutes).
        - title: Go live beside the other branches
          body: >-
            From its first patient, the branch's visits and takings appear in the reports next to the other
            branches. Support stays unlimited, and Premium and Enterprise include a named account manager.

  - discriminant: proofBlock
    value:
      id: ratings
      heading: How clinics rate Easy Clinic
      intro: >-
        The largest chain on Easy Clinic has {fact:largestChain} locations. These are Easy Clinic's public
        ratings.
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
