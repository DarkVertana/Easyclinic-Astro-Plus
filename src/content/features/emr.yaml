notes:
  - 'Title 55 characters; meta 143 characters (no tokens). Meta rewritten from the spec 4.1 wording ("Write the note, print or WhatsApp the prescription and keep every visit on one record") to lead with the head keyword and avoid a group of three.'
  - 'Secondary keyword "ABDM ready EMR" (spec 4.1) left off on purpose: 4.5 rule 6 gives ABDM-compliant EMR terms to /trust/. ABDM appears once, in the last FAQ, describing the milestones from src/data/regulators (in-abdm-m1..m3) and pointing to /trust/ with no status.'
  - 'No heroMedia and no media objects: screenshots do not exist yet (page-writing rules). When the spec 12 captures exist, add the thirty-second prescription screen (Rx mid-entry with an interaction warning, phone too) as hero and the Cura AI note draft to the Cura AI row.'
  - 'The thirty-second prescription is referenced only through the pulmonologist quote (testimonial premanand-raya, verbatim), not as a product claim. His testimonial id is placed on /pricing/ (pricing/main.yaml), so it is quoted in body text without the name; the Premanand/Premananda spelling is unresolved (facts.md section 2).'
  - 'Testimonial nrp-chandra-balaji is placed only on this page (pricing/india.yaml mentions it in its notes but uses sanjay-teotia in its testimonialRow). Its city is null.'
  - 'Drug interaction checks are stated in spec 5.4, 5.11 and 12; which plan includes them and the database behind them are not known, so the row names no plan and no source, and the FAQ on the interaction database source (spec 5.11) is left out.'
  - 'Prescription languages: only English and Swahili (Kenya, facts.md) are confirmed. The spec 12 screenshot brief mentions a Hindi print option, but no language list is confirmed, so the page names no other language.'
  - 'Spec 5.11 FAQ items not answerable with public facts and left out: how long a custom template takes, the interaction database source, data export. Replaced with the pen-and-paper and reception-login questions, both answered from facts.md.'
  - 'Offline wording follows facts.md ("does not run fully offline today") and /kenyademo/ ("Cloud-based"); the page does not say what, if anything, works offline.'
  - 'Country table names the rule-maker per spec 5.11 and describes each in general terms from src/data/regulators (in-nmc-telemedicine, ke-kmpdc, ae-nabidh, ae-malaffi, ae-riayati, ng-ndpa). No status column: every regulator state is null. MDCN and DHA licensing descriptions are general and need a compliance read. /trust/ is not built yet; the links follow spec 2.6 (the trust page holds the master status table).'
  - 'Pen-and-paper FAQ uses the live /pricing/ promise ("give us just 2 hours / 10 patient records, we promise to make your prescription writing faster"), per facts.md.'
  - 'Secondary CTA becomes "See the product in 6 minutes" when the tour ships (spec 12).'
