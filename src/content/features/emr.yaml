openingAnswer: >-
  EasyClinic is EMR and e-prescription software for clinics: the visit note and the prescription go on
  one patient record, and the prescription is printed for the patient or, on the Premium plan, sent on
  WhatsApp. The EMR and e-prescriptions come with every plan, from {price:usd.professional.annual} per
  doctor per month billed annually, and doctors on EasyClinic write {fact:prescriptionsDaily}
  prescriptions a day between them.
