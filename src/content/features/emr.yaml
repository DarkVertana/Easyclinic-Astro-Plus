sections:
  - discriminant: painBlocks
    value:
      id: where-the-evening-goes
      heading: Where a doctor's evening goes
      intro: >-
        Most doctors who move to an EMR are trying to fix one of these. The software is judged by whether
        it fixes them in the first week.
      items:
        - heading: The notes get finished at 9pm
          body: >-
            The last patient leaves at eight. The afternoon's notes are half in your head and half on the
            back of the prescription pad, so you type them up at home, and by Thursday the notes are
            thinner than they were on Monday.
          fix: >-
            Cura AI (documentation), included in every plan, drafts the note beside the consult. You
            correct it and sign it in the consulting room, so the note is done when the visit is.
          href: /ai/
          linkLabel: How Cura AI drafts a note
        - heading: The pharmacy calls about your handwriting
          body: >-
            A handwritten prescription gets a phone call from the pharmacist asking whether that says 25 or
            250. A patient on four regular medicines gets the same list copied out by hand at every visit,
            and every copy is a fresh chance to slip.
          fix: >-
            A typed prescription reads the same at every pharmacy. The last visit's medicines are on the
            same record, and shortcuts set up for the way you prescribe cut down the typing.
        - heading: Last year's report is somewhere in a file
          body: >-
            The patient arrives with a plastic bag of old reports, and last year's visit is in a paper
            register that nobody can search. The first minutes of the consult go on rebuilding a history
            the clinic already had.
          fix: >-
            Every visit and prescription sits on one patient record, and scanned reports attach to it, so
            the history is on the screen before the patient sits down.

  - discriminant: featureRows
    value:
      id: how-it-works
      heading: How the note and the prescription get written
      intro: >-
        What happens on screen from the moment the patient sits down. Where a part needs the Premium plan,
        the row says so.
      items:
        - heading: A prescription written from your own shortcuts
          body: >-
            The prescription is written on the patient's record, using shortcuts set up for the way you
            prescribe. A pulmonologist who has used EasyClinic for years wrote: "Provision of short-cuts is
            aptly useful for my style of prescription and I am able to type the entire prescription within
            a half minute."
          bullets:
            - Printed for the patient, or sent on WhatsApp on the Premium plan
            - Bilingual prescriptions in English and Swahili for clinics in Kenya
          plan: professional
        - heading: Templates for your specialty
          body: >-
            On Premium the chart comes with specialty EMR templates. Your clinic can also have its own
            clinical forms and print layouts, and the customisation comes without charges. Professional
            includes the EMR and e-prescriptions, without the specialty templates.
          plan: premium
          link:
            label: Compare what each plan includes
            href: /pricing/
        - heading: A warning when two medicines interact
          body: >-
            When two medicines on the prescription interact, the prescription screen warns you while you
            are still writing it. The change gets made in the consulting room, before the prescription
            reaches the pharmacy.
        - heading: Cura AI drafts the note
          body: >-
            Cura AI (documentation) is included in every plan. It drafts a SOAP note beside the consult,
            and the draft stays a draft until you review it and sign. It is optional, so a doctor who would
            rather write every note writes it in the same chart without the AI.
          plan: professional
          link:
            label: Read what Cura AI does
            href: /ai/
        - heading: Scanned reports and images on the record
          body: >-
            Scanned reports and images attach to the patient's record and sit beside the visits written in
            EasyClinic, so an old discharge summary or an X-ray is on the same record as today's note. On
            Premium, lab reports come into the chart as well.
        - heading: Who can open the chart, and who wrote in it
          body: >-
            Logins for your staff come with every plan. The reception login included in the price is not
            allowed into the EMR and cannot issue prescriptions, and an audit log shows who made each entry
            on a patient's record.
        - heading: On your phone
          body: >-
            EasyClinic works on any device, so the chart and the prescription open on a phone as well as on
            the consulting-room computer. It is cloud software and does not run fully offline today.

  - discriminant: testimonialRow
    value:
      id: customer
      heading: A psychiatrist who gave up the prescription pad
      items:
        - nrp-chandra-balaji
      layout: single

  - discriminant: dataTable
    value:
      id: country-rules
      heading: E-prescription rules by country
      intro: >-
        Each country has its own body that registers doctors and sets rules for how they prescribe. This is
        who that is in India, Kenya, the UAE and Nigeria, and what each asks for in general terms. Each
        country page covers the detail.
      caption: Who sets the prescribing rules in each country, and what they ask for
      columns:
        - Country
        - Who sets the rules
        - What they ask for, in general
      rows:
        - - '[India](/clinic-management-software-india/)'
          - National Medical Commission (NMC), through its Telemedicine Practice Guidelines
          - >-
            Rules for prescriptions issued after a teleconsult: the patient is identified and gives
            consent, and remote prescribing is limited to the medicine lists set for first and follow-up
            consults.
        - - '[Kenya](/emr-software-in-kenya/)'
          - Kenya Medical Practitioners and Dentists Council (KMPDC)
          - >-
            Registers the doctors and dentists who prescribe and licenses the facilities they work in. Its
            inspections ask to see the facility's records and registers when a licence is issued or renewed.
        - - '[UAE](/clinic-management-software-uae/)'
          - Dubai Health Authority (DHA), for Dubai
          - >-
            Licenses doctors and facilities in Dubai, and DHA-licensed facilities must share patient
            encounters with NABIDH, Dubai's health information exchange. Abu Dhabi's Department of Health
            and Emirates Health Services in the Northern Emirates set their own rules.
        - - '[Nigeria](/hospital-management-software-nigeria/)'
          - Medical and Dental Council of Nigeria (MDCN)
          - >-
            Registers and licenses the doctors and dentists who prescribe. The patient data on a
            prescription also falls under the Nigeria Data Protection Act, 2023.
      note: >-
        This table describes the rules and says nothing about where EasyClinic stands on them. That is kept
        on the [trust page](/trust/), not on this page.

  - discriminant: stepList
    value:
      id: training
      heading: 'Training takes {fact:trainingDays} days, about two hours in all'
      intro: >-
        The training is set up for you and your clinic staff, and day 2 is the one spent on the EMR. After
        it, support stays unlimited on every plan.
      steps:
        - title: Basic training
          meta: Day 1, 40 minutes
          body: Finding your way around EasyClinic, for you and the staff who will use it.
        - title: EMR scenario training
          meta: Day 2, 40 minutes
          body: The chart and the prescription, worked through as clinical scenarios.
        - title: Practice exercises
          meta: Day 3, 20 minutes
          body: Exercises to practise on, so the first real patient is not your first attempt.
        - title: Road to expertise
          meta: Day 4, 20 minutes
          body: The faster ways of working, once the basics are routine.

faqHeading: Questions doctors ask about the EMR
faq:
  - question: Can I have templates for my specialty and my own print layout?
    answer: >-
      Yes, on the Premium plan, which includes specialty EMR templates and your own print layouts, and the
      customisation itself comes without charges. Premium costs {price:usd.premium.annual} per doctor per
      month billed annually ({price:inr.premium.annual} in India). The Professional plan, at
      {price:usd.professional.annual}, includes the EMR and e-prescriptions without the specialty
      templates.
  - question: Is an e-prescription valid in India?
    answer: >-
      Yes, within the rules the National Medical Commission sets in its Telemedicine Practice Guidelines.
      For a prescription issued after a teleconsult, the patient is identified and gives consent, and
      remote prescribing is limited to the medicine lists for first and follow-up consults. Following the
      medicine lists is the doctor's responsibility, and where EasyClinic stands on the guidelines is kept
      on the [trust page](/trust/).
  - question: Can patients in Kenya get the prescription in Swahili?
    answer: >-
      Yes, clinics in Kenya can issue bilingual prescriptions in English and Swahili, so the patient takes
      home instructions they can read.
  - question: I write prescriptions by hand. Will typing slow me down?
    answer: >-
      It may for the first few patients. Our promise to doctors who write on paper is that if you give
      EasyClinic about two hours, or ten patient records, your prescription writing gets faster, and day 2
      of the {fact:trainingDays}-day training is 40 minutes on the EMR.
  - question: Does the EMR work offline?
    answer: >-
      Not fully: EasyClinic is cloud software and does not run fully offline today. If the line at your
      clinic drops often, arrange a backup connection for the consulting room, such as a mobile hotspot,
      before you go live.
  - question: Can I add a patient's old paper records?
    answer: >-
      Yes, as scanned files: scan the old pages and attach them to the patient's record, where they sit
      beside the visits written in EasyClinic. If the old records are in another clinic system instead,
      moving them is the data migration step of going live.
  - question: Can my receptionist read the medical notes?
    answer: >-
      Not on the reception login that comes with every plan, which is not allowed into the EMR and cannot
      issue prescriptions. The audit log shows who made each entry on a patient's record.
  - question: What does ABDM ask of my clinic's EMR?
    answer: >-
      ABDM's first milestone asks the clinic's software to create or verify each patient's ABHA number at
      registration, once the clinic is on the Health Facility Registry and each doctor on the Healthcare
      Professionals Registry. The later milestones link each visit's records to the patient's ABHA and,
      with consent, fetch records from other ABDM-linked facilities. Where EasyClinic stands on each
      milestone is kept on the [trust page](/trust/).

