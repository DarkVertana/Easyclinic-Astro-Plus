faqHeading: Questions clinics ask before leaving Practo Ray
faq:
  - question: Is EasyClinic cheaper than Practo Ray?
    answer: >-
      No, not on published prices: Practo's [plans page](https://www.practo.com/providers/clinics/ray/plans)
      lists Ray from ₹999 a month for up to 50 doctors, while EasyClinic costs
      {price:inr.professional.annual} per doctor per month on Professional, billed annually. The gap grows
      with each doctor you add, because Ray prices the plan and EasyClinic prices the doctor. The EasyClinic
      price includes Cura AI note drafting, a reception login, unlimited support and training, and no binding
      contract, and Premium at {price:inr.premium.annual} adds WhatsApp reminders and more than one location.
      Ask Practo for a current written quote for your number of doctors before you compare.
  - question: Can I keep Practo for patient discovery and run EasyClinic for the clinic?
    answer: >-
      Yes, as Practo describes it: its [Practo Pro app page](https://www.practo.com/practo-pro-app) says
      Practo Profile, the listing patients find on Practo.com, is free, and its [Prime
      page](https://www.practo.com/providers/prime) says a clinic's profile stays on Practo, and patients can
      still search for it, without a Prime subscription. Prime, which adds 24x7 instant booking and a place in
      the Prime listing, is a subscription of its own, with a one-time platform fee the first time each
      patient connects through Practo in a rolling 180-day window. Practo says Prime bookings and calls reach
      you as notifications and on a Prime dashboard. The Practo.com features on Ray's plans page, such as
      feedback collection and record sharing, are listed as part of Ray, so ask Practo which of them stay with
      your profile once Ray ends.
  - question: What breaks when we switch from Ray?
    answer: >-
      Your notice period and your copy of the records break if you do not plan them. Practo's [Ray
      subscription
      agreement](https://help.practo.com/practo-instruction-and-policies/click-wrap-subscription-agreement-ray/)
      asks for 60 days' written notice, renews for a year at a time without it, and says copying your data
      before you terminate is your job, because Practo need not keep it beyond 30 days after termination.
      Ray's export, as Practo's [help
      centre](https://help.practo.com/practo-ray/settings/understanding-the-settings-of-your-practo-ray-account/)
      describes it, emails your contacts, treatments, expenses and appointments; prescriptions and clinical
      notes are not named, so ask Practo how to get them before you give notice. The same agreement refunds
      the unused part of your subscription pro rata.
  - question: What is the biggest adoption risk?
    answer: >-
      The biggest risk is a front desk that keeps two calendars. If reception still books in Ray, or in a
      notebook by the phone, while the doctors chart in EasyClinic, the day's appointments and collections
      stop matching and staff drift back to the system they know. Pick one date after which every new
      booking goes into EasyClinic, and bring your receptionist to the first training session; the reception
      login is part of every plan. Training runs over {fact:trainingDays} days, about two hours in all, and
      support after that has no limit.
  - question: Does EasyClinic work without internet, like the Ray app?
    answer: >-
      No, EasyClinic does not run fully offline today, and that is a real point in Ray's favour for a clinic
      with an unreliable connection. Practo's [help
      centre](https://help.practo.com/practo-ray/app/how-to-access-ray-offline/) says Ray's phone app keeps
      the schedule and patient contacts working offline and syncs when you reconnect, although new bills and
      SMS reminders wait for a connection and the iOS app is read-only offline. That app is now the Practo Pro
      app, whose [Google Play listing](https://play.google.com/store/apps/details?id=com.practo.droid) still
      offers offline access. If your connection drops every day, test both products on your own network
      before you decide.
  - question: Will I be locked into a contract again?
    answer: >-
      No, EasyClinic has no binding contract on any plan. You pay a year or a quarter at a time, so the
      shortest commitment is one quarter, at {price:inr.professional.quarterly} per doctor per month on
      Professional. Practo's [Ray subscription
      agreement](https://help.practo.com/practo-instruction-and-policies/click-wrap-subscription-agreement-ray/),
      by comparison, runs for a year, renews automatically and asks for 60 days' written notice to end it.

