sections:
  - discriminant: dataTable
    value:
      id: verdict
      heading: Which one fits, by clinic type
      intro: >-
        The short answer depends on where your clinic loses time or patients. Three of these clinic types
        are better served by Ray, and three by EasyClinic.
      caption: Better fit by clinic type, EasyClinic or Practo Ray
      columns:
        - Your clinic
        - Better fit
        - Why
      rows:
        - - One doctor, with most new patients coming from Practo.com
          - Practo Ray
          - >-
            Both Ray plans include the Practo.com integration, which Ray's [subscription
            agreement](https://help.practo.com/practo-instruction-and-policies/click-wrap-subscription-agreement-ray/)
            says brings online appointments from Practo.com into Ray, and CM Atom is ₹999 a month on a
            one-year term ([Ray plans page](https://www.practo.com/providers/clinics/ray/plans)).
        - - One doctor who finishes notes late in the evening
          - EasyClinic
          - >-
            Cura AI drafts the note on Professional, at {price:inr.professional.annual} per doctor per month
            billed annually, with no binding contract.
        - - Five to ten doctors on one budget
          - Practo Ray, on price
          - >-
            On a one-year term, CM Atom covers up to 50 doctors for ₹999 a month and Clinic Management
            unlimited doctors for ₹1,499 ([Ray plans page](https://www.practo.com/providers/clinics/ray/plans)).
            EasyClinic charges for each doctor, from {price:inr.professional.annual}.
        - - A specialist practice that follows patients up on WhatsApp
          - EasyClinic
          - >-
            Premium adds WhatsApp reminders and messages and specialty templates, at
            {price:inr.premium.annual} per doctor per month billed annually.
        - - Two or more branches run from one office
          - EasyClinic
          - >-
            Premium covers more than one location, and Enterprise adds central control and SOP tracking. The
            largest chain on EasyClinic runs {fact:largestChain} locations. Ray lets one account switch
            between practices ([Practo help](https://help.practo.com/practo-ray/navigation/)).
        - - A clinic whose internet drops during OPD hours
          - Practo Ray
          - >-
            Ray's phone app, now part of the Practo Pro app, keeps the schedule and patient contacts working
            offline and syncs later ([Practo help](https://help.practo.com/practo-ray/app/how-to-access-ray-offline/),
            [Google Play listing](https://play.google.com/store/apps/details?id=com.practo.droid)). EasyClinic
            does not run fully offline today.

  - discriminant: prose
    value:
      id: who-each-is-for
      heading: Who each one is for
      body: |-
        **Practo Ray** is the clinic management software from Practo, the company behind the Practo.com doctor search. Practo's Ray page says Ray is used by 50,000+ doctors in 5 countries, and its provider page counts 30 Cr+ patients and 1L+ verified doctors on Practo. Ray's own FAQ is plain about what it is: asked whether Ray will bring more patients, it answers no, because Ray is "a clinic management software and not an advertising product". Patients find clinics through the free Practo Profile on Practo.com, and Practo Prime, sold separately, adds a place in the Prime listing and instant booking. It suits a clinic whose new patients find it on Practo, and a group of doctors who would rather pay one plan price than a price per doctor.

        **EasyClinic** is clinic software from a company in Kolkata that has been running clinics since {fact:founded}, used today by {fact:doctors} doctors in {fact:countries} countries. It brings you no new patients. It is built for the day inside the clinic: the reception login comes with every plan, and Cura AI drafts the doctor's note from the first plan up. It suits a clinic whose patients come back and come by referral, where the hard part is keeping the desk and the doctor on one record, and a group that wants WhatsApp reminders and its branches on the same system.
      aside: >-
        Practo figures are from Practo's [Ray page](https://www.practo.com/providers/clinics/ray),
        [provider page](https://www.practo.com/providers), [Practo Pro app
        page](https://www.practo.com/practo-pro-app) and [Prime page](https://www.practo.com/providers/prime),
        read on 26 September 2026. EasyClinic publishes this comparison.
      width: measure

  - discriminant: comparisonTable
    value:
      id: side-by-side
      heading: EasyClinic and Practo Ray, side by side
      intro: >-
        EasyClinic publishes this page, so each Practo Ray cell links to the page it came from, read on 26
        September 2026. Where Practo does not publish something, the cell says so.
      columns:
        - name: EasyClinic
          us: true
        - name: Practo Ray
      rows:
        - label: Primary job
          cells:
            - value: >-
                Clinic software for the day inside the clinic: appointments, the EMR with e-prescriptions,
                billing and dashboards, on every plan.
            - value: >-
                Clinic management software. Asked whether Ray brings more patients, Practo's FAQ answers no:
                Ray is "not an advertising product".
              source: https://www.practo.com/providers/clinics/ray
              checkedOn: 2026-09-26
        - label: Who uses it
          cells:
            - value: '{fact:doctors} doctors in {fact:countries} countries, running clinics since {fact:founded}.'
            - value: 50,000+ doctors, 25M+ appointments and 5 countries, according to Practo's Ray page.
              source: https://www.practo.com/providers/clinics/ray
              checkedOn: 2026-09-26
        - label: AI documentation
          cells:
            - value: Cura AI drafts the clinical note, on every plan including Professional.
            - value: >-
                Not published (checked 2026-09-26). Practo's Ray page and plans page list no AI note
                drafting.
              source: https://www.practo.com/providers/clinics/ray/plans
              checkedOn: 2026-09-26
        - label: WhatsApp operations
          cells:
            - value: >-
                WhatsApp reminders and messages on Premium and Enterprise. Professional sends SMS and email
                reminders.
            - value: >-
                Not published (checked 2026-09-26). The Ray plans list appointment confirmation, reminder and
                follow-up SMS, with 3,000 or 8,000 free SMS, and do not mention WhatsApp.
              source: https://www.practo.com/providers/clinics/ray/plans
              checkedOn: 2026-09-26
        - label: Billing and payments
          cells:
            - value: >-
                Billing and payments on every plan. Premium adds online payments and package treatments.
            - value: >-
                Professional billing on both plans. Online payments through Ray Payment Solution cost 2% a
                transaction on CM Atom and 1.8% on Clinic Management.
              source: https://www.practo.com/providers/clinics/ray/plans
              checkedOn: 2026-09-26
        - label: Multi-branch
          cells:
            - value: >-
                More than one location from Premium. Enterprise adds central control of every location, and
                inventory with stock transfers; the largest chain runs {fact:largestChain} locations.
            - value: >-
                One Ray account can hold several practices; you switch between them, and add new ones, from
                the top-right menu.
              source: https://help.practo.com/practo-ray/navigation/
              checkedOn: 2026-09-26
        - label: Patient discovery
          cells:
            - value: >-
                Not part of any EasyClinic plan. Enterprise includes a patient portal and app for the
                patients you already see.
            - value: >-
                Patients can search for your clinic's profile on Practo.com without Prime. Practo Prime, a
                separate subscription, adds 24x7 instant booking and a place in the Prime listing, for a
                one-time platform fee the first time each patient connects in a rolling 180-day window.
              source: https://www.practo.com/providers/prime
              checkedOn: 2026-09-26
        - label: Pricing model and published price
          cells:
            - value: >-
                Per doctor per month: {price:inr.professional.annual} on Professional and
                {price:inr.premium.annual} on Premium billed annually, or {price:inr.professional.quarterly}
                and {price:inr.premium.quarterly} billed quarterly. Reception login included; Enterprise is
                priced on a quote.
            - value: >-
                Per plan per month: CM Atom ₹999 on a one-year term, up to 50 doctors. Clinic Management
                ₹1,499 on one year or ₹999 on four years, unlimited doctors.
              source: https://www.practo.com/providers/clinics/ray/plans
              checkedOn: 2026-09-26
        - label: Contract and notice
          cells:
            - value: No binding contract. You pay a year or a quarter at a time.
            - value: >-
                A one-year agreement that renews automatically unless you give 60 days' notice. Cancelling
                refunds the unused period pro rata.
              source: https://help.practo.com/practo-instruction-and-policies/click-wrap-subscription-agreement-ray/
              checkedOn: 2026-09-26
        - label: Customisation
          cells:
            - value: >-
                Hundreds of customisation options at no charge. Custom features are scoped per project, and
                part of Enterprise.
            - value: >-
                Practo says it does not sell customised software for individual doctors, and adds features
                based on popular demand.
              source: https://www.practo.com/providers/clinics/ray
              checkedOn: 2026-09-26
        - label: Working without internet
          cells:
            - value: Does not run fully offline today.
            - value: >-
                Partly. Practo's help centre says Ray's phone app, now the Practo Pro app, works offline for
                the schedule and patient contacts; new bills need a connection, and the iOS app is read-only
                offline.
              source: https://help.practo.com/practo-ray/app/how-to-access-ray-offline/
              checkedOn: 2026-09-26
        - label: Training and support
          cells:
            - value: >-
                A four-day training path, about two hours in all, and unlimited support by phone, email and
                chat, on every plan.
            - value: >-
                Help articles and training videos for you and your staff, and a support team that answers by
                email, by phone or by live chat inside the software and gives further training on request.
              source: https://www.practo.com/providers/clinics/ray
              checkedOn: 2026-09-26
        - label: Review score with count
          cells:
            - value: >-
                {fact:capterraRating} out of 5 on
                [Capterra](https://www.capterra.com/p/10026882/Easy-Clinic/reviews/), where every review
                behind the score is listed. This site does not yet quote the review count.
            - value: >-
                4.0 out of 5 from 8 reviews on Capterra. SoftwareSuggest shows 4.3 out of 5 from 3 reviews
                ([SoftwareSuggest](https://www.softwaresuggest.com/practoray)).
              source: https://www.capterra.com/p/167778/Ray/reviews/
              checkedOn: 2026-09-26
      note: >-
        Several of the Practo help articles cited here were first published between 2013 and 2017, and Practo
        may have changed Ray since; ask Practo to put anything that matters to you in writing. Ray's Capterra
        score rests on 8 reviews, so read the reviews behind any score, ours included, rather than the number.
        G2's page for Ray could not be read on 26 September 2026.

  - discriminant: stepList
    value:
      id: four-clinic-tests
      heading: The four clinic tests
      intro: >-
        Run the same four tests on both products with a real clinic day, and with your own receptionist at
        the desk. Ray offers a 7-day free trial with the features of its best plan
        ([Ray page](https://www.practo.com/providers/clinics/ray)); EasyClinic starts with a demo on your own
        patient flow.
      steps:
        - title: Front desk test
          meta: Test 1
          body: >-
            Book a new patient and fit in a walk-in while the queue moves, without three tools open.
            **EasyClinic:** appointment scheduling and walk-ins on every plan, with the reception login
            included. Reminders go by SMS and email on every plan, and by WhatsApp from Premium.
            **Practo Ray:** a calendar with a queue manager, and walk-ins added from the top of the queue
            ([Practo help](https://help.practo.com/practo-ray/navigation/)). Appointment SMS come on both
            plans, and Ray's [subscription
            agreement](https://help.practo.com/practo-instruction-and-policies/click-wrap-subscription-agreement-ray/)
            lists online appointments from Practo.com among its features.
        - title: Doctor context test
          meta: Test 2
          body: >-
            When the patient sits down, the last prescription and the lab results should already be on the
            doctor's screen. **EasyClinic:** the EMR with e-prescriptions on every plan, and lab reports in the
            chart from Premium. Cura AI drafts the note on every plan, if the doctor wants it. **Practo Ray:**
            patient charting on both plans ([plans page](https://www.practo.com/providers/clinics/ray/plans)),
            with the patient's history and templates ([Ray page](https://www.practo.com/providers/clinics/ray)).
            Practo's Ray pages list no AI note drafting. A [May 2026
            report](https://www.pharmaindustrial-india.com/news/practo-accelerates-ai-led-healthcare-transformation-amid-global-expansion)
            on Practo's AI plans describes a "Consultation Intelligence" layer that gives doctors patient
            context during consultations, but does not say whether it is part of Ray.
        - title: Follow-up test
          meta: Test 3
          body: >-
            Reminders go out and the prescription reaches the patient again, without pulling the doctor out of
            a consult. **EasyClinic:** SMS and email reminders on every plan, and WhatsApp reminders and
            messages on Premium. **Practo Ray:** confirmation, reminder and follow-up SMS on both plans. Saved
            records other than clinical notes are shared with the patient's phone number by default, and the
            patient gets an SMS or email link to the Practo app ([Practo
            help](https://help.practo.com/practo-ray/emr/prescriptions/sharing-records-with-patients/)).
        - title: Owner visibility test
          meta: Test 4
          body: >-
            The day's visits and collections in one minute, without waiting for the month-end sums.
            **EasyClinic:** dashboards and reports on every plan. Enterprise adds a reporting server with
            custom analytics, and financial accounting. **Practo Ray:** basic reports on CM Atom and advanced
            reports on Clinic Management ([Ray plans page](https://www.practo.com/providers/clinics/ray/plans)),
            and the Practo Pro app tracks the clinic's performance on the go.

  - discriminant: dataTable
    value:
      id: pricing
      heading: Pricing, line by line
      intro: >-
        On published prices Ray costs less, and the gap widens with each doctor, because Ray prices the plan
        and EasyClinic prices the doctor. What each price includes is below.
      caption: Published prices for EasyClinic and Practo Ray in India, read on 26 September 2026
      columns:
        - What you are comparing
        - EasyClinic
        - Practo Ray
      rows:
        - - How the price is set
          - Per doctor per month. The reception login and other staff logins are part of every plan.
          - >-
            Per plan per month, with a doctor limit: up to 50 on CM Atom, unlimited on Clinic Management. CM
            Atom includes 3,000 free SMS and 5 GB of storage; Clinic Management 8,000 SMS and 20 GB
            ([plans page](https://www.practo.com/providers/clinics/ray/plans)).
        - - Lowest published price
          - '{price:inr.professional.annual} per doctor per month on Professional, billed annually.'
          - >-
            ₹999 a month, for CM Atom on a one-year term or Clinic Management on a four-year term. Practo
            shows both Clinic Management prices against a struck-through ₹1,999.
        - - Terms you can buy
          - >-
            A year or a quarter at a time. Billed quarterly, Professional is {price:inr.professional.quarterly}
            per doctor per month.
          - >-
            One year, or four years on Clinic Management. The [subscription
            agreement](https://help.practo.com/practo-instruction-and-policies/click-wrap-subscription-agreement-ray/)
            renews each year unless you give 60 days' notice.
        - - Charges beyond the plan
          - >-
            Pharmacy, lab, insurance claims and integrations are add-ons on Professional and Premium, and part
            of Enterprise. There is no setup fee.
          - >-
            Online payments cost 2% or 1.8% a transaction by plan. Practo Prime charges its own platform fee
            the first time each patient connects through it in a rolling 180-day window. A 2017 help article prices Ray Connect, a call
            handling add-on, separately ([Practo help](https://help.practo.com/practo-ray/ray-connect-pricing-faqs/));
            Practo's current Ray pages do not mention it.
      note: >-
        Ask Practo for a current written quote for your number of doctors before you compare totals.

  - discriminant: decisionMatrix
    value:
      id: which-to-choose
      heading: Which one to choose
      intro: If most of one list describes your clinic, that is your answer.
      options:
        - title: Choose Practo Ray if
          us: false
          items:
            - >-
              New patients find you on Practo.com, and you want your calendar tied to that profile. Both Ray
              plans include the Practo.com integration, and Practo Prime adds 24x7 instant booking.
            - >-
              Several doctors share one budget. On a one-year term, CM Atom covers up to 50 doctors for ₹999 a
              month and Clinic Management unlimited doctors for ₹1,499, where EasyClinic charges for each doctor.
            - >-
              You want to try the software yourself before talking to anyone. Ray has a 7-day free trial with
              the features of its best plan.
            - >-
              Your internet drops often and the desk can work from an Android phone. Ray's phone app, now part
              of the Practo Pro app, keeps the schedule and patient contacts working offline and syncs when you
              reconnect.
            - >-
              You want patients to receive their prescriptions and bills in the Practo app. Ray shares saved
              records other than clinical notes with the patient's phone number by default.
            - >-
              You want patient calls recorded and reconnected when they drop. Practo Prime gives the clinic a
              virtual number that reconnects failed calls and keeps the recordings on a private Prime
              dashboard.
        - title: Choose EasyClinic if
          us: true
          items:
            - >-
              Your doctors finish notes after the last patient. Cura AI drafts the note on every plan,
              including Professional at {price:inr.professional.annual} per doctor per month.
            - >-
              Your patients answer on WhatsApp. WhatsApp reminders and messages come with Premium, at
              {price:inr.premium.annual} per doctor per month billed annually.
            - >-
              You run, or plan, more than one branch and want them run from the centre. Enterprise adds central
              control and SOP tracking, and the largest chain on EasyClinic runs {fact:largestChain} locations.
            - >-
              You need the software shaped to your clinic. EasyClinic has hundreds of customisation options at
              no charge, and Practo says it does not sell customised software for individual doctors.
            - >-
              You do not want a year-long commitment. There is no binding contract, and a quarter is the
              shortest term you can pay for.
            - >-
              You want a set training plan for the whole team. Training runs over {fact:trainingDays} days,
              about two hours in all, with unlimited support afterwards. Practo points staff to its help
              articles and videos, with its support team for more training.

  - discriminant: stepList
    value:
      id: switching-from-practo-ray
      heading: How to switch from Practo Ray to EasyClinic
      intro: >-
        On our side, going from demo to live takes as little as {fact:goLiveDays} days. The Practo side sets
        the real timetable, because of the notice period in Ray's subscription agreement.
      steps:
        - title: See EasyClinic on your own patient flow
          meta: EasyClinic
          body: >-
            Book a 20-minute demo and run the four clinic tests above against your own schedule. Bring one
            day's appointment list from Ray, so the demo follows your patients rather than ours.
        - title: Find your Ray renewal date and give notice
          meta: Practo
          body: >-
            Practo's [Ray subscription
            agreement](https://help.practo.com/practo-instruction-and-policies/click-wrap-subscription-agreement-ray/)
            runs for a year, renews automatically, and asks for 60 days' written notice to end it. If you
            cancel, the same agreement refunds the unused period pro rata.
        - title: Export your data before Ray ends
          meta: Practo
          body: >-
            Practo's [help
            centre](https://help.practo.com/practo-ray/settings/understanding-the-settings-of-your-practo-ray-account/)
            describes an Import/Export page in Ray's settings that emails four kinds of data: contacts,
            treatments, expenses and appointments. Prescriptions and clinical notes are not named there, so
            ask Practo how to get them. The agreement says Practo need not keep your data beyond 30 days after
            termination, and that taking a copy first is your responsibility.
        - title: Train the team
          meta: About two hours in all
          body: >-
            Training runs over {fact:trainingDays} days: 40 minutes of basics, 40 on EMR scenarios, then two
            20-minute sessions of practice exercises and finer points. Bring your
            receptionist to the first one.
        - title: Move your data across
          meta: EasyClinic
          body: >-
            Data migration is its own step in our onboarding, after training. What comes across depends on
            what your Ray export contains, so have the export files ready before this step.
        - title: Go live, with support
          meta: EasyClinic
          body: >-
            Support is unlimited on every plan, by phone as well as email. There is no binding contract, so
            you are not held to EasyClinic if it does not work for your clinic.
      note: >-
        Keep the overlap short: pick one date after which every new booking goes into EasyClinic, even if Ray
        is still paid up.

