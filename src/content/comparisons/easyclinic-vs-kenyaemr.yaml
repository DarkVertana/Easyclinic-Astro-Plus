faqHeading: Questions Kenyan clinic owners ask
faq:
  - question: Why pay for EasyClinic when KenyaEMR is free?
    answer: >-
      Because the licence is the smaller part of what an EMR costs a private clinic. KenyaEMR has no licence
      fee, but it runs on a server you provide and look after, and each release is an upgrade script that
      someone must run after the users are trained; what installation and support cost a private clinic is
      not published. EasyClinic's {price:usd.professional.annual} per doctor per month on the annual
      Professional plan covers hosting, monthly upgrades, a reception login and unlimited support and
      training. If your facility is in the national rollout, where partners install KenyaEMR and the
      KenyaHMIS service desk supports it free of charge, KenyaEMR is the sensible choice.
  - question: Can a private clinic use KenyaEMR?
    answer: >-
      Yes, the code is open source under the Mozilla Public License 2.0 and each release is published on
      GitHub, so any clinic can install it on its own server. The national rollout runs through Palladium
      Kenya and more than 30 implementing partners, and kenyahmis.org does not publish support terms or
      prices for a private clinic outside it (checked 26 September 2026). KenyaHMIS does publish a training instance you can log into and
      try before you decide.
  - question: Does EasyClinic work when the internet goes down?
    answer: >-
      No, EasyClinic runs in the browser over the internet and does not run fully offline today. A
      self-hosted option exists for larger clinics and groups that want their data on their own
      infrastructure. KenyaEMR can be installed on a server inside the facility, and Palladium describes it
      as optimised for low-connectivity settings; if your line is weak, that is a real point in KenyaEMR's
      favour.
  - question: Can patients pay by M-Pesa on either system?
    answer: >-
      Yes, both handle M-Pesa. TaifaCare KenyaEMR's billing guide sends an M-Pesa STK push from the bill to
      the phone that is paying, beside cash payments. In EasyClinic the M-Pesa payment is recorded against
      the patient's bill at the desk, on the same bill as any claim to Jubilee, AAR, CIC, Britam or
      Resolution through SLADE, so the balance shows what the patient still owes.
  - question: Which one suits HIV, TB and maternal health programmes?
    answer: >-
      KenyaEMR, because that is the work it was built for: it began in HIV clinics and carries the HIV,
      PrEP, TB, antenatal, delivery and child welfare forms, with programme data going to the National Data
      Warehouse and MOH reports to KHIS. EasyClinic is a general outpatient EMR for private clinics, with
      specialty templates on Premium, and a programme-supported HIV site in the national rollout is better
      off staying on KenyaEMR.
  - question: What is the biggest adoption risk with either system?
    answer: >-
      The biggest risk is the front desk working around the system, because once the receptionist keeps a
      paper register beside it, the records and the bills stop matching. With KenyaEMR the second risk is
      upkeep: someone has to look after the server, and each release asks for user training before the
      upgrade. With EasyClinic it is the internet line, since it does not run fully offline today, while
      training is short, about two hours spread over {fact:trainingDays} days.
  - question: How long does it take to go live?
    answer: >-
      EasyClinic can be live in as little as {fact:goLiveDays} days after the demo, with staff training and
      data migration in between. For KenyaEMR at a private clinic, a go-live time is not published; the
      setup guide is written for a technical person, who runs an installation script on an Ubuntu 20.04
      server before anyone logs in.

