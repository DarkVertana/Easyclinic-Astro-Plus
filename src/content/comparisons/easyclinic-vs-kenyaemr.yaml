editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The comparison of how a Kenyan clinic takes money on each system, M-Pesa STK push from a TaifaCare bill
    against M-Pesa and a SLADE claim to Jubilee on one EasyClinic bill, the MOH 705 report on both, and
    Penda Health's Nairobi clinics running on EasyClinic since 2017, come from knowing how a private clinic in
    Kenya gets paid and reports.
  readsMachineWritten: >-
    The two decision lists are the same length and rhythm and may read as templated; the page names no
    Kenyan person and no customer beyond Penda Health; and it cannot give a shilling price or compare SHA and
    eTIMS, the first two things a Kenyan clinic owner will ask about, so the table note that sets them aside
    may read as evasive.

notes:
  - >-
    Research, 2026-09-26: every KenyaEMR fact was fetched today from kenyahmis.org (home, /taifacare/,
    /kenyaemr-3-x-content/ and the billing, e-claims, bare metal and KeHMIS III evaluation PDFs), the
    Palladium-hub/kenyaemr-releases GitHub release notes (19.4.1, 19.4.2, 19.4.4), the
    palladiumkenya/openmrs-module-kenyaemr LICENSE (MPL 2.0 with the OpenMRS healthcare disclaimer), the
    OpenMRS wiki (KenyaEMR Distribution, last edited 2022-01-13, used only for I-TECH and the 2011 standards;
    Palladium Kenya, last edited 2025-08-21, for the 30+ implementing partners) and Palladium's 16 October 2025
    article (low-connectivity, began in HIV clinics). Local copies were read in full, not summarised.
  - >-
