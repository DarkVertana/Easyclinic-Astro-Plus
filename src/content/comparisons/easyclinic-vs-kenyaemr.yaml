h1: EasyClinic vs KenyaEMR
linkLabel: EasyClinic vs KenyaEMR
eyebrow: Kenya comparison
openingAnswer: >-
  If your facility is in Kenya's national rollout and reports on HIV or TB programmes, KenyaEMR is built
  for that job and has no licence fee, and it already runs at more than 2,200 sites. If you run a private
  clinic that wants its software hosted and supported for it, with M-Pesa and SLADE insurer claims on one
  bill, EasyClinic fits better, from {price:usd.professional.annual} per doctor per month.
