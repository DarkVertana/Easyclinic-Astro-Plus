sections:
  - discriminant: dataTable
    value:
      id: verdict
      heading: Which one fits your kind of clinic
      intro: >-
        The short answer depends on who works in your clinic and what it does besides the consult. On what
        each company publishes today, HealthPlix is the better fit for four of these seven clinic types and
        EasyClinic for two. For a doctor with a receptionist, it turns on what HealthPlix charges for a staff
        login. The HealthPlix facts behind each row are sourced in the side-by-side table and the sources
        list below.
      caption: The better fit by clinic type, on each company's published facts as of 26 September 2026
      columns:
        - Your clinic
        - Better fit
        - Why
      rows:
        - - One doctor writing prescriptions, with no staff on the system
          - HealthPlix
          - HealthPlix Pro is ₹12,000 a year before GST, the lowest published price on this page.
        - - One doctor with a receptionist who books and bills
          - Either, depending on staff logins
          - >-
            HealthPlix's pricing page says the doctor's staff can use its billing on both plans, and every
            EasyClinic plan includes a reception login. HealthPlix does not publish whether a staff login
            costs extra, so ask before you compare totals.
        - - A specialist consulting at two or three clinics
          - HealthPlix, on price
          - >-
            HealthPlix Elite, at ₹18,000 a year before GST, includes a multi-clinic setup. EasyClinic runs
            more than one location on Premium at {price:inr.premium.annual} per doctor per month.
        - - A clinic where the internet drops during OPD hours
          - HealthPlix
          - HealthPlix has had an offline EMR since October 2023. EasyClinic does not run fully offline today.
        - - A hospital or nursing home with beds
          - HealthPlix
          - >-
            HealthPlix sells an IPD module for admissions and bed allocation. EasyClinic runs the OPD, and
            inpatient wards are out of its scope.
        - - A polyclinic with a pharmacy counter or TPA patients
          - EasyClinic
          - >-
            Pharmacy, inventory, lab management and insurance claims come with EasyClinic Enterprise, or
            as add-ons on Professional and Premium. HealthPlix's pricing page lists none of them, and its
            SoftwareSuggest profile lists inventory and lab integration but not pharmacy or claims.
        - - A chain of clinics run from one office
          - EasyClinic
          - >-
            Enterprise adds central control and SOP tracking across branches, and the largest chain on
            EasyClinic has {fact:largestChain} locations. HealthPlix's pricing page lists a multi-clinic
            setup on Elite, with one login for all the clinics.

  - discriminant: comparisonTable
    value:
      id: side-by-side
      heading: EasyClinic and HealthPlix side by side
      intro: >-
        EasyClinic publishes this page, so each HealthPlix cell links to the page it was read from on 26
        September 2026. HealthPlix publishes its plan table as an image on its pricing page; we read a green
        tick as included in that plan and a grey tick as not included.
      columns:
        - name: EasyClinic
          us: true
        - name: HealthPlix
      rows:
        - label: What it is
          cells:
            - value: >-
                Clinic management software with appointments, the EMR, billing and reports on one record,
                used from one-doctor clinics to a chain of {fact:largestChain} locations.
            - value: >-
                An EMR for doctors, which HealthPlix calls "India's No.1 EMR platform for doctors". It also
                sells software to hospitals and to pharma companies.
              source: https://www.healthplix.com/
              checkedOn: 2026-09-26
        - label: Scale, as each company states it
          cells:
            - value: '{fact:doctors} doctors in {fact:cities} cities across {fact:countries} countries, running clinics since {fact:founded}.'
            - value: >-
                14,000+ doctors, 60 million+ patients, 370+ cities and 16 specialties, with prescriptions
                in 14 languages.
              source: https://www.healthplix.com/
              checkedOn: 2026-09-26
        - label: Published price
          cells:
            - value: >-
                Professional {price:inr.professional.annual} and Premium {price:inr.premium.annual} per
                doctor per month billed annually, or {price:inr.professional.quarterly} and
                {price:inr.premium.quarterly} billed quarterly. Enterprise is quoted. No setup fee and no
                binding contract.
            - value: >-
                Pro ₹12,000 a year and Elite ₹18,000 a year, both excluding 18% GST. The page does not say
                whether the price is per doctor or per clinic. Hospital plans with IPD are quoted.
              source: https://www.healthplix.com/pricing-1
              checkedOn: 2026-09-26
        - label: AI that writes the note
          cells:
            - value: >-
                Cura AI (documentation), on every plan from Professional: it listens to the consult and
                drafts the note and prescription for the doctor to confirm.
            - value: >-
                H.A.L.O records the consultation and generates a summary and a prescription that update the
                EMR. The H.A.L.O page gives no price or plan.
              source: https://www.healthplix.com/halo
              checkedOn: 2026-09-26
        - label: AI checks on the prescription
          cells:
            - value: >-
                CuraPilot, the clinical copilot, flags a diagnosis that may have been missed, and the doctor
                decides. Which plan includes it is not on the published price list.
            - value: >-
                Clinical decision support and drug-drug interaction checks on both plans. Elite adds Plix
                AI: DDI Advanced, contraindication alerts, precaution alerts, RX Analyzer, Quick RX and past
                visit summaries.
              source: https://www.healthplix.com/pricing-1
              checkedOn: 2026-09-26
        - label: WhatsApp
          cells:
            - value: WhatsApp reminders and messages on Premium and Enterprise. Professional sends reminders by SMS and email.
            - value: >-
                The SPOT mobile app sends digital prescriptions to patients by SMS or WhatsApp, with
                follow-up reminders.
              source: https://www.healthplix.com/spot-mobile-emr
              checkedOn: 2026-09-26
        - label: Billing
          cells:
            - value: >-
                Billing and payments on every plan. Premium adds online payments and package treatments;
                insurance and TPA claims come with Enterprise or as an add-on.
            - value: >-
                Billing management on both plans, which staff can use "for all billing needs of the clinic",
                with MIS reports for the doctor.
              source: https://www.healthplix.com/pricing-1
              checkedOn: 2026-09-26
        - label: More than one clinic
          cells:
            - value: >-
                More than one location on Premium. Enterprise adds central control and SOP tracking across
                branches.
            - value: Multi-clinic setup on Elite, to create several clinics and manage them all from one login.
              source: https://www.healthplix.com/pricing-1
              checkedOn: 2026-09-26
        - label: Online booking for patients
          cells:
            - value: Patients book through the patient portal and app, which come with Enterprise.
            - value: >-
                Elite adds a booking website for your clinic and booking from your Google Business Profile.
                A patient app comes with both plans.
              source: https://www.healthplix.com/pricing-1
              checkedOn: 2026-09-26
        - label: When the internet drops
          cells:
            - value: EasyClinic does not run fully offline today. The cloud version needs a working internet line.
            - value: >-
                An offline EMR, launched in October 2023: doctors open records and write prescriptions
                without internet, and the data syncs to the cloud when the connection returns.
              source: https://blogs.healthplix.com/product-updates/revolutionizing-healthcare-the-launch-of-offline-emr-for-doctors-in-india/
              checkedOn: 2026-09-26
        - label: Inpatient wards (IPD)
          cells:
            - value: Out of scope. EasyClinic runs the OPD, and a hospital with beds keeps a separate system for its wards.
            - value: An IPD module for hospitals that handles patient admissions and bed allocation.
              source: https://www.healthplix.com/healthplix-hospital-management-software
              checkedOn: 2026-09-26
        - label: Pharmacy, stock and lab
          cells:
            - value: >-
                Pharmacy, inventory and lab management on Enterprise, or as add-ons on Professional and
                Premium. Lab reports in the chart on Premium.
            - value: >-
                Inventory management and lab integration appear in the feature list of HealthPlix's
                SoftwareSuggest profile, which HealthPlix has claimed. Pharmacy does not.
              source: https://www.softwaresuggest.com/healthplix
              checkedOn: 2026-09-26
        - label: Support and training
          cells:
            - value: >-
                Unlimited support and training on every plan, with {fact:trainingDays} short training
                sessions. A named account manager on Premium.
            - value: A support phone line for doctors and a support email address.
              source: https://www.healthplix.com/contact-us
              checkedOn: 2026-09-26
        - label: Trying it before you pay
          cells:
            - value: No free trial. A 20-minute demo runs on a demo clinic set up like yours.
            - value: >-
                A demo sandbox on HealthPlix's site: you pick your specialty and register a phone number,
                which receives the login details, then try the EMR.
              source: https://demo.healthplix.com/sandboxRegistration.php?specialty=cardiologist
              checkedOn: 2026-09-26
      note: >-
        Review scores are not a row because EasyClinic's review counts are not shown on this page. For
        HealthPlix on 26 September 2026: 4.3 out of 5 from 6 reviews on
        [Techjockey](https://www.techjockey.com/detail/healthplix), 4.5 out of 5 from 4 reviews on
        [SoftwareSuggest](https://www.softwaresuggest.com/healthplix), and no reviews yet on its
        [Capterra listing](https://www.capterra.com/p/10005728/HealthPlix/). ABDM and security
        certificates are covered in their own section below.

  - discriminant: comparisonTable
    value:
      id: four-clinic-tests
      heading: The four clinic tests
      intro: >-
        A feature list says little about a Tuesday morning. Run these four tests on a real day's list
        rather than a demo checklist, on both systems. Each cell says what the company publishes for that
        test and the plan it needs.
      columns:
        - name: EasyClinic
          us: true
        - name: HealthPlix
      rows:
        - label: 'Front desk test: the morning queue and the walk-ins'
          cells:
            - value: >-
                Appointments and walk-ins on one calendar. The reception login in every plan books and
                bills, but cannot open the EMR or write a prescription.
            - value: >-
                Patient queue management on both plans, and billing the doctor's staff can use. On Elite,
                Smart Scan lets the front desk turn paper reports into digital records.
              source: https://www.healthplix.com/pricing-1
              checkedOn: 2026-09-26
        - label: 'Doctor context test: the history ready when the patient sits down'
          cells:
            - value: >-
                The patient record and e-prescriptions on every plan, lab reports in the chart on Premium,
                and Cura AI (documentation) drafting the note for the doctor to confirm.
            - value: >-
                A specialty-specific OPD EMR and clinical decision support on both plans. On Elite, Past
                Visit Summary writes AI summaries of the patient's previous visits.
              source: https://www.healthplix.com/pricing-1
              checkedOn: 2026-09-26
        - label: 'Follow-up test: reminders that go out without the doctor'
          cells:
            - value: SMS and email reminders on every plan. WhatsApp reminders and messages on Premium.
            - value: Follow-up reminders, and prescriptions sent by SMS or WhatsApp, from the SPOT mobile app.
              source: https://www.healthplix.com/spot-mobile-emr
              checkedOn: 2026-09-26
        - label: "Owner visibility test: the day's numbers in a minute"
          cells:
            - value: Dashboards and reports on every plan. A reporting server with custom analytics on Enterprise.
            - value: >-
                Clinic management reports on both plans. Elite adds Robin, an AI dashboard for clinic
                operations and for prescription patterns.
              source: https://www.healthplix.com/pricing-1
              checkedOn: 2026-09-26
      note: >-
        Bring the same patient day to both demos, and time each test with a watch rather than taking either
        company's word for it.

  - discriminant: prose
    value:
      id: pricing
      heading: What each costs in rupees
      body: |
        HealthPlix publishes two clinic plans on its [pricing page](https://www.healthplix.com/pricing-1): Pro at ₹12,000 a year and Elite at ₹18,000 a year, both excluding 18% GST. That works out to ₹1,000 and ₹1,500 a month, or ₹14,160 and ₹21,240 a year once GST is added. The page does not say whether the price is per doctor or per clinic, and the prices are yearly. Elite is the plan with the Plix AI prescription checks, the multi-clinic setup, the booking website, Robin analytics, 5,000 message credits and priority support. A hospital that wants IPD or PlixConnect, HealthPlix's patient engagement product, is quoted separately.

        EasyClinic Professional costs {price:inr.professional.annual} and Premium {price:inr.premium.annual} per doctor per month billed annually, or {price:inr.professional.quarterly} and {price:inr.premium.quarterly} billed quarterly. Enterprise, for chains and hospital OPDs, is quoted. Every plan includes a reception login and unlimited support and training, with no setup fee and no binding contract.

        For one doctor, HealthPlix Pro is the lowest price on this page. For a clinic with several doctors, ask HealthPlix whether its price is per doctor before you compare totals, and ask us for the GST line on an EasyClinic quote.
      width: measure

  - discriminant: prose
    value:
      id: abdm-and-security
      heading: What HealthPlix says about ABDM and data security
      body: |
        HealthPlix states on its [pricing page](https://www.healthplix.com/pricing-1) that it "is ABDM compliant EMR", and its [patient app page](https://www.healthplix.com/patientapp-healthplix) announces that HealthPlix ABHA is live. Its [home page](https://www.healthplix.com/) says it is "ISO 27001:2022 & HIPAA Certified" and lists NABH, ISO, RSSDI, HIPAA and ABDM under the line "Certified by the Highest Standards in Healthcare". These are HealthPlix's own statements as they read on 26 September 2026. We have not seen the certificates.

        ABDM comes in milestones, and a vendor can have finished one without the next: M1 is creating or verifying the patient's ABHA number, M2 links each visit's records to it, and M3 brings records in from other facilities with the patient's consent. Whichever vendor you choose, EasyClinic included, get the milestone it has finished and the date in writing before you sign.
      width: measure

  - discriminant: decisionMatrix
    value:
      id: choose
      heading: Choose HealthPlix or EasyClinic
      intro: >-
        Both lists are written the same way: the situation, then the published fact that decides it.
      options:
        - title: Choose HealthPlix if
          items:
            - >-
              Your clinic internet drops during OPD hours. HealthPlix [launched an offline
              EMR](https://blogs.healthplix.com/product-updates/revolutionizing-healthcare-the-launch-of-offline-emr-for-doctors-in-india/)
              in October 2023 that keeps records and prescriptions working and syncs when the line returns.
              EasyClinic does not run fully offline today.
            - >-
              You are one doctor and price decides it. [Pro is ₹12,000 a year and Elite ₹18,000 a
              year](https://www.healthplix.com/pricing-1) before 18% GST, which is ₹1,000 and ₹1,500 a
              month.
            - >-
              You want AI checks on each prescription, listed plan by plan. [Elite adds Plix
              AI](https://www.healthplix.com/pricing-1): contraindication alerts, precaution alerts, DDI
              Advanced and RX Analyzer, on top of the clinical decision support in both plans.
            - >-
              Patients should find and book you from Google. [Elite](https://www.healthplix.com/pricing-1)
              takes bookings from your Google Business Profile and from a booking website for your clinic.
            - >-
              Your hospital has beds. HealthPlix sells an [IPD
              module](https://www.healthplix.com/healthplix-hospital-management-software) for admissions
              and bed allocation, and EasyClinic stops at the OPD.
            - >-
              You want to try the EMR for your specialty yourself. HealthPlix runs a [demo
              sandbox](https://demo.healthplix.com/sandboxSpecialities.php) by specialty that you open with
              your phone number, and EasyClinic has no free trial.
        - title: Choose EasyClinic if
          us: true
          items:
            - >-
              You want the receptionist's login priced and limited in writing. A reception login is included
              in every EasyClinic plan, and it books and bills but cannot open the EMR or write a
              prescription. HealthPlix's [pricing page](https://www.healthplix.com/pricing-1) says the
              doctor's staff can use its billing, but not whether a staff login costs extra.
            - >-
              You would rather pay quarterly than yearly. Professional is
              {price:inr.professional.quarterly} per doctor per month billed quarterly, with no binding
              contract, while HealthPlix publishes yearly prices.
            - >-
              You dispense medicines or bill TPAs. Pharmacy, inventory, lab management and insurance claims
              come with Enterprise, or as add-ons on Professional and Premium.
            - >-
              You run a chain of branches from one office. Enterprise adds central control and SOP tracking
              across branches, and the largest chain on EasyClinic has {fact:largestChain} locations.
              HealthPlix's [Elite plan](https://www.healthplix.com/pricing-1) lists a multi-clinic setup
              with one login for all the clinics.
            - >-
              You want training and support in the price. Training is {fact:trainingDays} short sessions,
              about two hours in total, and support is unlimited on every plan.
            - >-
              You want software clinics stay on. {fact:retention} of EasyClinic customers have used it for
              more than five years, and EasyClinic has run clinics since {fact:founded}.

  - discriminant: stepList
    value:
      id: switching
      heading: Moving from HealthPlix to EasyClinic
      intro: >-
        Your records are the part of the move that needs planning, so the export from HealthPlix comes
        first. From the demo, a clinic can be live in as little as {fact:goLiveDays} days.
      steps:
        - title: Ask HealthPlix for your export
          meta: Before you cancel
          body: >-
            HealthPlix's [terms of service](https://www.healthplix.com/terms-and-conditions/termsandconditions-1)
            say that on termination it will, "at its discretion", make "reasonable efforts" to let you take
            a backup or export of your data in a suitable electronic format, and that your access ends on
            termination. Ask for the export while your plan is still running, and ask what it holds:
            patient details, visit notes, prescriptions and uploaded reports.
        - title: A demo on a clinic set up like yours
          meta: 20 minutes
          body: >-
            One patient through a demo clinic set up like yours, with your specialty and your kind of
            patient day. None of your real records are used, and they come across only after you decide to
            go ahead.
        - title: Staff training
          meta: '{fact:trainingDays} sessions, about two hours in all'
          body: >-
            Day 1 is basic training (40 minutes), day 2 is EMR scenarios (40 minutes), day 3 is practice
            exercises (20 minutes) and day 4 is the road to expertise (20 minutes). The sessions are for you
            and your clinic staff.
        - title: Data migration
          body: >-
            We move your existing data into EasyClinic, so the first morning does not start from an empty
            screen.
      note: >-
        Going live in as little as {fact:goLiveDays} days is the fastest case, and a clinic with years of
        records to move takes longer. Which parts of a HealthPlix export come across, and how long that
        takes for your clinic, is not yet published on this site, so ask us before you sign up.

