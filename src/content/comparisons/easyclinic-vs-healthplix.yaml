notes:
  - 'Research, 2026-09-26. HealthPlix pricing: /pricing-1 shows only "Contact Sales" as text; the plans are in the image "Pricing Page.png" (https://static.wixstatic.com/media/aa75ca_601b93fde5c14b808ba667fb16b8ffb8~mv2.png), read in full: Pro Plan "Rs 12,000/ yr", Elite Plan "Rs 18,000/ yr", "(Prices are excluding 18% GST)", "Custom Hospital Plans: If you need access of IPD and PlixConnect(CRM) ... product@healthplix.com". Green tick read as included, grey as not included (Priority Support row confirms the reading: grey for Pro, "Always Highest Priority" for Elite). Nothing on the image or page says per doctor or per clinic. Directories disagree with the vendor: Capterra and Techjockey say "Contact vendor for pricing" / "Price Available on Request"; the page uses the vendor image.'
  - 'Review scores: Techjockey 4.3 out of 5, "6 Ratings & 6 Reviews" (JSON-LD ratingValue 4.31, reviewCount 6); SoftwareSuggest "4.5 /5 Based on 4 Reviews"; Capterra "Based on 0 user reviews" (read with WebFetch; curl returned 403). G2 (https://www.g2.com/products/healthplix/reviews) and Software Advice returned 403 to both curl and WebFetch, so no G2 figure is used. The review row is dropped from the table (brief: EasyClinic review counts unknown) and the HealthPlix figures sit in the table note instead. Add a review row with both counts once capterraReviews and googleReviews are in facts.yaml.'
  - 'Rows dropped because EasyClinic''s answer is not confirmed: ABDM and certifications (HealthPlix claims ABDM compliance, "ISO 27001:2022 & HIPAA Certified", and lists NABH, ISO, RSSDI, HIPPA [sic] and ABDM; reported in their own section as HealthPlix statements), GST on patient invoices (neither company publishes it; HealthPlix says only "Billing Management"), prescription languages (HealthPlix: 14; EasyClinic Indian list unknown, so it is not used as a "choose HealthPlix if" reason either), mobile app (HealthPlix SPOT; EasyClinic doctor app unknown), review scores. The ABDM section advises getting milestones in writing from every vendor, EasyClinic included, and states no EasyClinic status. Restore an ABDM row when src/data/regulators/in-abdm-* has a status and date.'
  - 'Not used on purpose. (1) HealthPlix terms clause 9: the fee "is substantially subsidised" and "the Platforms may display advertisements within the product interface" on all tiers. (2) Clauses 5 and 6: HealthPlix may use and owns de-identified data "without the need for patient consent". Both are sourced, but using either would imply EasyClinic does the opposite, and EasyClinic''s own global privacy policy (src/content/legal/privacy.mdx section 2(d)) says it "may collect, analyse, use, publish, create and sell de-identified information", and section 3(c) claims a right to use e-prescriptions. The Kenya-only section of that policy says the opposite, and the live pricing FAQ says "We never misuse, sell or in any way disclose your data". Company to reconcile before any page makes a data-use claim; if EasyClinic shows no in-product ads, a sourced ads row could be added.'
  - 'HealthPlix H.A.L.O: the /halo page gives no plan or price, and it is not on the pricing image. The hospital page claims H.A.L.O "Helps hospitals offer 20% more appointments per doctor" and PlixConnect "at least a 60% increase in the revenue"; neither figure has a published method, so neither is repeated. The offline EMR blog claims doctors "see at least 10% more patients daily"; not repeated for the same reason.'
  - 'HealthPlix offline: the October 2023 blog is the only description of how it works; the home page today says "India''s Largest Online & Offline EMR". Which plan includes offline use is not published (the pricing image does not list it), so no cell ties offline to Pro or Elite. If HealthPlix withdraws offline mode, the offline row, the verdict row, one decision item and a FAQ change.'
  - 'HealthPlix pharmacy and lab: healthplix.com product and pricing pages name neither; the SoftwareSuggest listing (claimed by HealthPlix, overview provided by HealthPlix) lists Inventory Management and Lab Integration, so that is the cited source. The Techjockey review summary says users want better pharmacy management; not used (review opinion).'
  - 'HealthPlix facts not used: 45 million patients on the demo sandbox (4.5 crore) against 60 million+ on the home page (the page uses the home page); 12,000+ doctors in 300 cities in the 2023 blog (superseded); the FAQ page answers are loaded by script and were not readable; trust.healthplix.com ("Trust Vault") and ayushman-bharat.healthplix.com render client-side and returned no content. The demo sandbox was re-checked on 2026-09-26: picking a specialty opens sandboxRegistration.php, which asks for name, phone number and clinic pin code and sends login details by OTP, so the page now says you open it with your phone number.'
  - 'Adversarial fact check, 2026-09-26 (every cited URL re-fetched; pricing image re-read in full). Changed: (1) the verdict row for a doctor with a receptionist went from "EasyClinic" to "Either": HealthPlix''s pricing image says "Doctor''s staff can use this for all billing needs of the clinic" on both plans, and its EMR page (https://www.healthplix.com/healthplixemr) says the platform switches between doctor, nurse, admin and IPD staff profiles, so calling EasyClinic the better fit rested only on HealthPlix not publishing a staff-login price; the verdict intro count and the matching "Choose EasyClinic if" item were rewritten to match. (2) The opening answer no longer says EasyClinic suits "a clinic run by a team rather than a doctor alone", which implied HealthPlix does not; it now names the two verdict rows EasyClinic wins (pharmacy or TPA polyclinic, chain). (3) "Toll-free" was removed from the HealthPlix support cell: the contact page lists "Doctor Support : 18001020127" without calling it toll-free. (4) The polyclinic and chain verdict rows now state what HealthPlix does publish (SoftwareSuggest inventory and lab integration; Elite multi-clinic setup). (5) Disclosure "EasyClinic publishes this page" added to the side-by-side intro, as on the Practo page. (6) The offline FAQ adds that the home page still says "Online & Offline EMR" and that no plan is named for offline use. Confirmed unchanged: prices and GST line, every Plix AI and Grow Your Practice tick, H.A.L.O wording, SPOT wording, IPD wording, ABDM and certificate quotes, terms clause 8, Techjockey 4.3 from 6 (JSON-LD reviewCount 6), SoftwareSuggest 4.5 from 4, Capterra 0 reviews (WebFetch; curl 403). EasyClinic''s own Capterra listing read 4.9 from 11 reviews on 2026-09-26; the count is not used because capterraReviews is not a confirmed fact yet.'
