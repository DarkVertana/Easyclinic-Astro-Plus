# /trust/ (spec 5.17; keyword row in 4.1; cannibalisation rule 4.5.6 gives "ABDM compliant EMR software" to this page).
# The master compliance table (spec 2.6): country pages repeat only their own rows and link here.
status: draft
headKeyword: ABDM compliant EMR software
secondaryKeywords:
  - NABIDH approved EMR
  - EMR data security
  - SHA ready clinic software
title: 'Security and Compliance: Easy Clinic'
metaDescription: >-
  What ABDM compliant EMR software means, where patient data is hosted, who can see it, and the status
  and date for ABDM, SHA, NABIDH and NDPA.
h1: How Easy Clinic keeps patient data safe and compliant
linkLabel: Security and compliance
eyebrow: Trust and security
openingAnswer: >-
  ABDM integration for EMR software comes in three milestones, and Easy Clinic's status is [ABDM M1 status
  as of date] for M1 (ABHA numbers), [ABDM M2 status as of date] for M2 (linking records) and [ABDM M3
  status as of date] for M3 (fetching records from other facilities). The table below gives a status and
  a date for each regulator and data law that touches clinic software in India, Kenya, the UAE and
  Nigeria, and the rest of the page covers where patient data is hosted and what your clinic takes with it
  if it leaves.
summary: >-
  What ABDM compliant EMR software means, the status and date for each regulator in India, Kenya, the UAE
  and Nigeria, where patient data is hosted and what you take with you if you leave.
author: subhashish-saha
lastUpdated: 2026-09-26
ctas:
  primary:
    label: Book a 20-minute demo
    href: /contact-us/#book-a-demo
  secondary:
    label: Read the privacy policy
    href: /privacy/
  whatsapp: Hi, I was reading the Easy Clinic security and compliance page and have a question about my clinic's data.

sections:
  # The master table (spec 2.6). Status and dates render from src/data/regulators/*.yaml (all 22 are null today).
  - discriminant: regulatorTable
    value:
      id: compliance-by-country
      heading: Regulators and data laws by country, with status and date
      intro: |
        Every row carries one of four states and the date it was last checked. **Live** means it works today, with the integration or certificate named. **In certification** names the body doing the checking and the quarter a decision is expected. **Planned** gives the quarter the work is due. **Not applicable** means the rule does not apply to software like Easy Clinic.

        ABDM has a row for each milestone, because a vendor can finish one without the next. Each country page repeats its own rows from this table, and if another page on this site seems to claim more than the table, go by the table.
      countries: [in, ke, ae, ng]
      showClinicMustDo: true
      trustLink: false

  - discriminant: dataTable
    value:
      id: hosting
      heading: Where your data is hosted
      intro: >-
        Easy Clinic is cloud software. The table gives the region where each country's patient records are
        kept and where the backup copies go. If the law in your country asks for health data to stay inside
        it, as the UAE's ICT Health Law does, check your row before you sign.
      caption: Hosting and backup regions for Easy Clinic clinics, by country
      columns:
        - Clinics in
        - Patient records hosted in
        - Backup copies kept in
      rows:
        - - India
          - '[Hosting region and provider for Indian clinics]'
          - '[Backup region for Indian clinics]'
        - - Kenya
          - '[Hosting region and provider for Kenyan clinics]'
          - '[Backup region for Kenyan clinics]'
        - - UAE
          - '[Hosting region and provider for UAE clinics]'
          - '[Backup region for UAE clinics]'
        - - Nigeria
          - '[Hosting region and provider for Nigerian clinics]'
          - '[Backup region for Nigerian clinics]'
      note: >-
        On the Enterprise plan a clinic can ask for private cloud hosting. For larger clinics and groups
        that want to keep data on their own infrastructure, Easy Clinic also offers a self-hosted option.
        [Which plans the self-hosted option is on, and who is responsible for its backups].

  - discriminant: featureRows
    value:
      id: protection
      heading: How data is protected
      intro: >-
        Our pricing page says Easy Clinic protects electronic data against unauthorised access with "bank
        level security". Each row below says what that means in practice.
      items:
        - heading: How data is encrypted
          body: >-
            [How data is encrypted between your browser and Easy Clinic: protocol and version]. [How stored
            patient records are encrypted, and who holds the keys]. [Whether attachments such as scanned
            reports and X-rays are encrypted the same way].
        - heading: Backups and restores
          body: >-
            [How often Easy Clinic backs up clinic data, and how long each backup is kept]. [Where backups are
            stored, and whether apart from the main servers]. [Whether restores are tested, and the date of
            the last test]. [Whether a clinic can get a deleted record back, how it asks, and how long it
            takes].
        - heading: Staff logins, and what each one opens
          body: >-
            Logins for your staff come with every plan. The reception login included in the price handles
            the front desk, from registering a patient to taking the payment, but it is not allowed into the
            EMR and cannot issue prescriptions. A clinic can also give a clinical assistant or nurse a login
            that completes some of the EMR record. [Other roles a clinic can set, such as pharmacist or
            branch manager, and what each can see]. [Whether two-step sign-in is available, and on which
            plans].
        - heading: The audit log
          body: >-
            Easy Clinic keeps an audit log on the patient record, and Cura AI keeps its own, so there is a
            record of what it suggested. [What the log records for each entry, how long it is kept, and who
            at the clinic can read it].
        - heading: Who at Easy Clinic can open your data
          body: >-
            [Which Easy Clinic staff can open a clinic's data, for what reason, and whether the clinic is told
            each time]. Our pricing page puts the rule plainly: "We never misuse, sell or in any way disclose
            your data for any commercial gains."
        - heading: Uptime, and what to do when the internet drops
          body: >-
            Easy Clinic was available [measured uptime and period]. [How uptime is measured, and whether the
            figure is published]. [When planned maintenance runs in each country, and how clinics are told].
            Easy Clinic does not run fully offline today, so a clinic whose line drops often should keep a
            mobile hotspot beside the reception computer as a backup connection.

  - discriminant: prose
    value:
      id: your-data-your-exit
      heading: Your data, your exit
      body: |
        The patient records in Easy Clinic belong to your clinic. Under India's DPDP Act the clinic is the data fiduciary and Easy Clinic processes the data on its behalf, and [data processing agreement: whether Easy Clinic signs one with every clinic, and in which countries].

        There is no binding contract, so your clinic can leave when it chooses. [Notice period and refunds on cancelling].

        When you leave, you get [what a leaving clinic gets back: patient records, prescriptions, bills and attachments] as [export format], within [days to deliver the export]. [Export fee, if any]. [Whether and when Easy Clinic deletes its copy after the export, and when the backups that hold it expire].
      aside: >-
        **"Your data belongs only to you."** That line is on our pricing page today. [Whether the customer
        contract says the same, and in which clause].
      width: measure

  - discriminant: dataTable
    value:
      id: privacy-law
      heading: Privacy law by country
      intro: >-
        Each of the four countries has at least one data law that puts duties on your clinic, whatever
        software it uses. This is what each asks, in short. The country privacy pages go further, and
        Easy Clinic's own status against each law is in the compliance table at the top of this page.
      caption: Data protection laws that apply to clinics in India, Kenya, the UAE and Nigeria
      columns:
        - Country
        - Law
        - What it asks of your clinic
        - Read more
      rows:
        - - India
          - Digital Personal Data Protection Act, 2023 (DPDP)
          - >-
            Notice, consent, breach reporting and a grievance contact. Your clinic is the data fiduciary and
            Easy Clinic processes data on its behalf, so the privacy notice your patients read is yours to
            publish.
          - '[Privacy in India](/privacy/india/)'
        - - Kenya
          - Data Protection Act, 2019
          - >-
            Health data is sensitive personal data, with stricter rules on consent and on sending it outside
            Kenya. The clinic registers with the Office of the Data Protection Commissioner as a data
            controller.
          - '[Privacy in Kenya](/privacy/kenya/)'
        - - Kenya
          - Digital Health Act, 2023
          - >-
            Sets how health data is stored and shared, and requires digital health systems to be registered
            with the Digital Health Agency.
          - '[Privacy in Kenya](/privacy/kenya/)'
        - - UAE
          - PDPL (Federal Decree-Law No. 45 of 2021) and the ICT Health Law (Federal Law No. 2 of 2019)
          - >-
            The PDPL sets the general personal data rules. The ICT Health Law covers health data, and it keeps
            that data inside the UAE unless an exemption applies.
          - '[Privacy in the UAE](/privacy/uae/)'
        - - Nigeria
          - Nigeria Data Protection Act, 2023 (NDPA)
          - >-
            Consent, breach notification, rules for sending patient data abroad, and when a clinic needs a
            Data Protection Officer. A clinic that processes data above the threshold registers with the
            Nigeria Data Protection Commission.
          - '[Privacy in Nigeria](/privacy/nigeria/)'
      note: >-
        These are short summaries, not legal advice. [Name of the lawyer or firm who reviewed these
        summaries, and the date].

  - discriminant: prose
    value:
      id: security-contact
      heading: Security contact
      body: |
        If you find a security problem in Easy Clinic, write to [security contact email] with what you found and how to repeat it. [How soon Easy Clinic acknowledges a report, and whether it runs a disclosure programme].

        [Whether Easy Clinic tells a clinic when a breach touches its data, and within how many hours]. Your clinic needs to hear quickly, because under most of the laws in the table above, reporting a breach is the clinic's duty. For anything else about your clinic's data, call {contact:in.phone} or write to {contact:in.email} in India, and call {contact:ke.phone} in Kenya. [Contact for clinics in the UAE and Nigeria].
      width: measure

  - discriminant: proofBlock
    value:
      id: ratings
      heading: How clinics rate Easy Clinic
      intro: >-
        {fact:retention} of Easy Clinic's customers have used it for more than five years, and these are its
        public ratings.
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'

faqHeading: Questions clinic owners ask about their data
faq:
  - question: Who owns the patient data in Easy Clinic?
    answer: >-
      Your clinic owns its patient records, and Easy Clinic keeps them on your clinic's behalf. Our pricing
      page says it plainly: "Your data belongs only to you." Under India's DPDP Act the clinic is the data
      fiduciary and Easy Clinic the processor, and [data processing agreement: whether Easy Clinic signs one
      with every clinic, and in which countries].
  - question: Where is my clinic's data hosted?
    answer: >-
      Patient data for Indian clinics is hosted in [hosting region and provider for Indian clinics], for
      Kenyan clinics in [hosting region and provider for Kenyan clinics], for UAE clinics in [hosting region
      and provider for UAE clinics] and for Nigerian clinics in [hosting region and provider for Nigerian
      clinics]. On the Enterprise plan a clinic can ask for private cloud hosting, and a clinic that wants
      to keep data on its own infrastructure can ask about the self-hosted option.
  - question: Can I take my data with me if I leave?
    answer: >-
      Yes, a clinic that leaves gets [what a leaving clinic gets back: patient records, prescriptions, bills
      and attachments] as [export format], within [days to deliver the export]. There is no binding
      contract to wait out, and [notice period and refunds on cancelling]. [Whether and when Easy Clinic
      deletes its copy after the export].
  - question: Which ABDM milestones does Easy Clinic support today?
    answer: >-
      M1, creating and verifying the patient's ABHA number, is [ABDM M1 status as of date]; M2, linking each
      visit's records to the ABHA, is [ABDM M2 status as of date]; and M3, fetching a patient's records from
      other ABDM-linked facilities with consent, is [ABDM M3 status as of date]. The compliance table on this
      page carries the same status and date for each milestone. Until a milestone shows Live with a date,
      plan your clinic as if it is not available.
  - question: Is Cura AI trained on my patients' data?
    answer: >-
      No, patient data is not used to train Cura AI, whether it comes from your clinic or any other. When
      Cura AI drafts a note, [what patient data leaves Easy Clinic for the AI model, which provider processes
      it and in which country].
  - question: Which security certifications does Easy Clinic hold?
    answer: >-
      [ISO 27001, SOC 2 or other security certification Easy Clinic holds, with the certifying body and
      date, or none]. This page names a certificate only with the body that issued it and the date, the
      same rule the compliance table follows.
  - question: What is Easy Clinic's uptime?
    answer: >-
      Easy Clinic was available [measured uptime and period]. [How uptime is measured, and whether the
      figure is published]. [When planned maintenance runs in each country, and how clinics are told].
      Easy Clinic does not run fully offline today, so keep a mobile hotspot beside the reception computer
      as a backup line.
  - question: Which other companies process my clinic's data?
    answer: >-
      Easy Clinic uses [sub-processors, such as hosting, SMS, WhatsApp, email, payment and AI providers, with
      the country where each processes data]. [How clinics are told before a new sub-processor is added,
      and whether they can object].

