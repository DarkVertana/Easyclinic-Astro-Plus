editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The reception login that runs the front desk but is kept out of the EMR, and the four countries' data
    laws set side by side with the UAE rule that keeps health data in the country, come from Easy Clinic's
    own pricing page and markets, but every hosting, encryption, backup and uptime fact is still in
    brackets.
  readsMachineWritten: >-
    With hosting regions, encryption, backups, uptime, certifications and sub-processors all in brackets,
    the page reads as a template until the company fills them, and the law summaries are paraphrased from
    the regulator records rather than written by someone who has registered a clinic with the ODPC or taken
    an EMR through ABDM.

notes:
  - 'Head keyword: the spec 4.1 row gives "HIPAA compliant EMR software", but 4.5 rule 6 gives "ABDM compliant EMR software" to /trust/, so it is the head keyword here and appears in the opening answer and meta. HIPAA is also left out of secondaryKeywords: the live site says Easy Clinic "meets international privacy and data security standards such as HIPAA, PCI-DSS, and GDPR" (/clinic-chain-software/, /hospital-opd-nursing-home-software/) and the homepage says "Compliance with: ABHA, HIPAA, GDPR"; none of it is verified and none of it is repeated. Target HIPAA only once the company states its HIPAA position with evidence.'
  - 'Status: draft. All 22 rows in src/data/regulators have state and asOf null, and hosting, encryption, backups, uptime, certification, sub-processor, export and security-contact facts are unknown. The publish rules forbid regulatorTable on pages meant to publish; this page exists to hold the master table (spec 2.6), so it stays draft until the rows carry states and dates.'
  - 'Title and H1 are the spec 4.1 row. "Keeps patient data safe and compliant" implies a compliance status; if most regulator rows are not Live when the page is ready, consider "How Easy Clinic handles patient data, and where compliance stands". Meta description rewritten from the 4.1 row to lead with the head keyword; "NDPA support" became "status and date for ... NDPA", because NDPA is a law, not something a vendor supports (141 characters).'
  - 'Uptime: the live /curapilot/ "99.97% uptime over 9 years" has no public source (facts.md section 4) and is not written; it is [measured uptime and period]. Spec 5.3 moves the figure here. Before it is written it needs an internal measurement the company stands behind (study.yaml internalSource: description, period, approvedBy) or a claimsReview sign-off, because the claims rule rejects it as text.'
  - 'Proof: badges via {fact:capterraRating} (4.9) and {fact:googleRating} (4.8), with {fact:retention}; review counts are null in facts.yaml (spec 2.4 wants the count). The Korom reliability quote ("our total unplanned downtime across nine years has been measured in hours") is the natural proof for this page, but robert-korom-reliability is assigned to /kenyademo/; decide whether it moves here once the uptime figure is measured.'
  - 'Sources, re-checked against live /pricing/ on 26 Sep 2026. The security FAQ reads: "Easy Clinic has been designed on a very secure platform which protects electronic data against unauthorised access with bank level security. Your data belongs only to you. We never misuse, sell or in any way disclose your data for any commercial gains." The quote is now given in full: the earlier draft cut "for any commercial gains", which turned a promise about commercial use into a promise of no disclosure at all. The reception FAQ ("perform all activities like Patient Registration, Appointment scheduling, Billing and payment ... not allowed to use the EMR or issue prescriptions. You can choose to have a clinical assistant or nurse role as a user who can complete some of your EMR records") is the source for the reception and nurse rows. No binding contracts, same FAQ. Staff logins, plans.yaml ("Logins for your staff"). Private cloud hosting on request, plans.yaml (Enterprise, live "Custom or Private Cloud Hosting"). Self-hosted option and "does not run fully offline today", live /best-clinic-management-software-kenya/ ("For larger clinics and groups that prefer to keep data on their own infrastructure, Easy Clinic also offers a self-hosted deployment option"); "cloud software", same page ("Easy Clinic is cloud-based"). Audit log and Cura AI suggestion log, spec 5.2 and the published /ai/ wording; what the log records is a placeholder (the /ai/ adversarial pass removed the same detail). Cura AI not trained on patient data, spec 5.2 and /ai/. Clinic as DPDP data fiduciary, src/data/regulators/in-dpdp.yaml.'
  - 'Data ownership is sourced ("Your data belongs only to you", live /pricing/). Export on leaving ("Yes" in the FAQ) follows the page brief only; the company must confirm it, the format and the contract clause before publishing. The home page dropped its ownership FAQ until /trust/ or /privacy/ states the export policy (home.yaml notes).'
  - 'Adversarial pass (26 Sep) turned unsourced commitments into placeholders: deletion of a leaving clinic''s data within a set number of days, breach notice to clinics within a set number of hours, backups and restore tests as stated practice, encryption in transit and at rest as stated fact (including a heading that asserted it), the audit log recording "who changed a record and when", and the "Uptime, measured" heading. The certifications FAQ no longer says a standard missing from the answer is one Easy Clinic does not claim; that is a company position to state, not the page''s.'
  - 'Law summaries paraphrase src/data/regulators (in-dpdp, ke-dpa, ke-digital-health-act, ae-pdpl, ng-ndpa) and describe each law only, never Easy Clinic''s status. The UAE row splits the roles because the PDPL (Federal Decree-Law No. 45 of 2021) leaves out health data that has its own law, which is what the ICT Health Law is. "Under most of the laws in the table above, reporting a breach is the clinic''s duty" says "most" because the ICT Health Law''s breach duty was not checked. A lawyer should review the table before publishing (the note carries a placeholder for the reviewer).'
  - 'Spec 5.17 also asks for ISO or SOC status and a sub-processor list. Both are FAQ placeholders only. When the company supplies them, add a dataTable "Companies that process your clinic''s data" (company, what it does, country) after the protection rows, and name any certificate with its body and date.'
  - 'Security contact: src/data/site.yaml has hello@easyclinic.io only; no security address, disclosure process or breach-notice commitment is on file. UAE and Nigeria have no contact in src/data/countries, hence the placeholder. {contact:ke.email} is not used here because it renders the Kenya contact''s personal address, which carries the first name of a contact who is not cleared to publish (countries/ke.yaml publishName is null); Kenya gets {contact:ke.phone} only until a role address exists.'
  - 'Links to /privacy/ and the four /privacy/<country>/ pages, /integrations/ and /contact-us/#book-a-demo follow the spec URLs; pages that do not exist yet show as link warnings and are hidden in production.'
  - 'No heroStrip: regulator chips need states, and the ratings already sit in the proof block. No heroMedia: there are no screenshots yet.'
