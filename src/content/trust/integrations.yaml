title: EasyClinic Integrations and API
metaDescription: >-
  EMR integration with EasyClinic by category and country, from M-Pesa and SLADE in Kenya to WhatsApp and
  Power BI, with what each does and its status.
h1: Integrations and API
linkLabel: Integrations and API
eyebrow: Integrations
openingAnswer: >-
  This directory lists 15 EMR integrations: 8 for clinics in Kenya, from M-Pesa at the desk to SLADE insurer
  claims, and 7 that are not tied to one country, such as WhatsApp messages and Power BI reports. [How many
  of the 15 are live, as of date], and each card below says what the connection does for your clinic, with
  its status and the date it was checked.
summary: >-
  What each EasyClinic integration does for a clinic, from M-Pesa and SLADE in Kenya to WhatsApp and Power
  BI, with its status and date, and how to ask for a connection that is not listed.
author: subhashish-saha
lastUpdated: 2026-09-26
ctas:
  primary:
    label: Book a 20-minute demo
    href: /integrations/#request-an-integration
  secondary:
    label: Read the security and compliance page
    href: /trust/
  whatsapp: Hi, I was reading the EasyClinic integrations page and want to ask about connecting a system to EasyClinic.

sections:
  - discriminant: prose
    value:
      id: how-to-read
      heading: How to read this directory
      body: |
        Each integration sits in one category, from payments and insurance claims to messaging and other EMRs, and carries one of three statuses with the date it was last checked. **Live** means clinics use the connection today. **Beta** means [what beta means at EasyClinic, and which clinics can use a beta connection]. **Planned** means clinics cannot use it yet, and [the quarter each planned connection is due]. If another page on this site seems to promise more than the card here, go by the card.

        This page covers software connections. Regulators and data laws, including India's ABDM milestones, are on the [security and compliance page](/trust/) with a status and date for each. Some Kenyan cards, such as SHA e-claims and eTIMS, appear there too, because each is a government system and a software connection at once.
      width: measure

  # Renders every file in src/data/integrations, grouped by category. All 15 have state and asOf null today,
  # so every card shows a status placeholder. The country filter appears once two countries have their own entries.
  - discriminant: integrationDirectory
    value:
      id: directory
      heading: Integrations by category
      intro: >-
        Each card says in one sentence what the system does for your clinic and shows its status with the
        date it was checked. Cards for Kenyan clinics say Kenya, and the rest say every country.
      filters: true

  - discriminant: proofBlock
    value:
      id: penda-health
      heading: An outside tool running inside an EasyClinic record
      variant: study
      figures:
        - visits
      body: >-
        Penda Health has kept its patient records in EasyClinic since 2017. Its AI tool, AI Consult, is built
        into that record: each time a clinician finishes a field such as the diagnosis or the medicines, the
        record calls AI Consult in the background. Penda Health and OpenAI studied it during real consultations
        at 15 clinics in Nairobi. The paper studied the tool rather than the connection, and it names EasyClinic
        as the record the tool is built into.
      link:
        label: Read how the study was run
        href: /curapilot/

  - discriminant: prose
    value:
      id: api-and-fhir
      heading: The API and FHIR
      body: |
        EasyClinic names HL7 and FHIR for health records, and DICOM for medical images, among the open standards it is built on, and third-party API integration is one of its modules. A list of standards does not tell your developer what they can connect to, so this is what we can say about the API itself.

        [Whether EasyClinic offers an API that a clinic's own developer can use, and on which plans]. [FHIR version, and the resources EasyClinic can send and receive, such as Patient and Observation]. [How a developer gets credentials, and whether there is a sandbox to test against].

        If you are building a connection for a clinic or a lab, use the form below and name the system you want to connect when we call you back.
      aside: >-
        **API and FHIR documentation.** [Link to the API and FHIR documentation, or the address a developer
        writes to for it].
      width: measure

  - discriminant: demoForm
    value:
      id: request-an-integration
      heading: Ask for a connection that is not listed
      intro: >-
        If your clinic needs a system connected that is not in the directory, such as your lab analysers, an
        outside lab's software, your accounting package or a hospital system you already run, send us this
        form and name the system when we call you back.
      promise: |
        **What happens after you send this.** We call you back on the number you gave, and you tell us which system you want connected and in which country. For a lab machine, have the make and model to hand.

        Enterprise includes integrations and custom features. On Professional and Premium, a new connection comes as the integrations add-on, scoped for your clinic as a project. [How an integration project is priced, and how long scoping takes].

faqHeading: Questions clinic owners ask about integrations
faq:
  - question: Which integrations work in Kenya today?
    answer: >-
      [Which of the Kenya integrations are live, as of date]. The directory lists 8 for Kenya: M-Pesa, SLADE,
      SMART, SHA e-claims, eTIMS, DHIS2 reporting, KenyaEMR and OpenMRS. WhatsApp is on our Kenya list too and
      sits with the cards for every country. Each card gives its status and the date it was checked, so plan
      your clinic around the ones marked Live.
  - question: Does EasyClinic have an API?
    answer: >-
      [Whether EasyClinic offers an API that a clinic's own developer can use today, and on which plans].
      EasyClinic names HL7 and FHIR among the open standards it is built on and lists third-party API
      integration among its modules. Documentation: [link to the API and FHIR documentation, or the address a
      developer writes to for it].
  - question: Does EasyClinic support FHIR, and which version?
    answer: >-
      EasyClinic names FHIR among the open standards it is built on, and the version and resources it supports
      are [FHIR version, and the resources EasyClinic can send and receive]. If you are asking because of
      India's ABDM, EasyClinic's status on each ABDM milestone is on the [security and compliance
      page](/trust/).
  - question: What does it cost to connect a system that is not listed?
    answer: >-
      On Professional and Premium a new connection comes as the integrations add-on, priced at [how an
      integration project is priced, with a typical range], and Enterprise, which is priced on quote, includes
      integrations and custom features. Each add-on connection is scoped for your clinic as a project, and the
      build takes [typical time from scoping to a working connection].
  - question: Can EasyClinic take results straight from our lab analysers?
    answer: >-
      [Which lab analyser and radiology device makes and models EasyClinic has connected, as of date]. Lab
      analysers and radiology devices have a card in the directory under labs and devices, and on Professional
      and Premium a new machine is connected through the integrations add-on, so have the make and model to
      hand when we call you back.
  - question: Can we keep KenyaEMR and use EasyClinic as well?
    answer: >-
      [Whether a facility can run KenyaEMR and EasyClinic side by side today, and what data moves between
      them]. KenyaEMR is in the directory with its status, and our [comparison of EasyClinic and
      KenyaEMR](/easyclinic-vs-kenyaemr/) sets out which of the two fits a Kenyan facility.
  - question: Does EasyClinic connect to Tally?
    answer: >-
      Tally is not in this directory, because we do not name it, or any other accounting package, as a
      connection. [Whether EasyClinic has connected Tally for any clinic, and on what terms]. A connection to
      your accounting software is scoped as a project, so name Tally when we call you back.
  - question: Which payment gateways does EasyClinic work with?
    answer: >-
      [Payment gateways EasyClinic uses for online payments in each country, as of date]. In Kenya the
      directory also lists M-Pesa at the desk, and online payments come with the Premium and Enterprise plans.

