editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The Kenyan connections a clinic in Nairobi deals with, M-Pesa at the desk, claims through SLADE and SMART,
    SHA and eTIMS, sit beside the Power BI warehouse EasyClinic runs for clinic groups, and the proof is AI
    Consult running inside Penda Health's EasyClinic record; but every status is still in brackets, so the page
