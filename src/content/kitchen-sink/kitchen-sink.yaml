    value:
      heading: Pick your clinic
      items:
        - { persona: solo, title: I run my own clinic, body: One doctor and a receptionist., href: /solutions/solo-clinic/ }
        - { persona: polyclinic, title: We share one front door, body: Several specialists and one record., href: /solutions/polyclinic/ }
        - { persona: chain, title: We run many branches, body: Central records and SOPs., href: /solutions/clinic-chain/ }
        - { persona: hospital-opd, title: We run a hospital OPD, body: 'Queues, pharmacy and claims.', href: /solutions/hospital-opd/ }
        - { persona: ngo, title: We run an NGO clinic, body: Donor-ready reports., href: /solutions/ngo-clinics/ }
  - discriminant: oldWayNewWay
    value:
      heading: Old way and new way
      old:
        title: The old way
        items: [Paper appointment register, WhatsApp on a personal phone, Billing in Excel, Three separate logins]
        media:
          kind: photo
          needed: 'Old way: cluttered reception desk with a paper register (generated environment image)'
          alt: A reception desk with a paper register and a stack of patient files
