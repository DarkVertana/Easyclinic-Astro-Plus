        - { label: Consult, body: Notes written during the visit., href: /features/emr/ }
        - { label: Prescribe, body: A prescription in about thirty seconds., href: /features/emr/ }
        - { label: Pay, body: Invoice and receipt on WhatsApp., href: /features/billing/ }
        - { label: Dispense, body: Pharmacy works from the prescription., href: /features/pharmacy-and-inventory/ }
        - { label: Follow up, body: Reminders bring the patient back., href: /features/patient-engagement/ }
        - { label: Report, body: The owner's numbers in the morning., href: /features/reports-and-dashboards/ }
