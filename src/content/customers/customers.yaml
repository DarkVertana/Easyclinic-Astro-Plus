        Malaysia and CIMAS Health in Zimbabwe.
      filters: false

faqHeading: "You Have Questions, We Have Answers"
faq:
  - question: How many clinics use Easy Clinic?
    answer: >-
      We publish a count of doctors rather than clinics: {fact:doctors} doctors in {fact:cities} cities use
      Easy Clinic. They work in everything from solo clinics to a chain with {fact:largestChain} locations,
      across {fact:countries} countries.
  - question: How long do customers stay with Easy Clinic?
    answer: >-
      {fact:retention} of our customers have used Easy Clinic for more than five years. Dr Prantar
      Chakrabarti, a haematologist, has used it since 2008, and Penda Health in Nairobi since 2017. The {fact:retention} is our own count, and we have not
      published how it is measured.
  - question: Where can I read reviews of Easy Clinic?
    answer: >-
      On [Capterra](https://www.capterra.com/p/10026882/Easy-Clinic/reviews/), where Easy Clinic is rated
      {fact:capterraRating}, and on Google, where it is rated {fact:googleRating}. The Google figure comes
      from our Trustindex badge, which is based on reviews collected on Google over the past 12 months.
  - question: Which countries are these customers from?
    answer: >-
      The customers quoted on this page are in India, Kenya, Malaysia and Zimbabwe, and most of them are in
      India. Easy Clinic is used in {fact:countries} countries, but we do not have a quote from a clinic in
      the UAE or Nigeria to show you.
  - question: Are the quotes on this page edited?
    answer: >-
      No. Each quote is printed as the customer wrote it, and every customer quoted agreed to have it shown
      here. We have not corrected the spelling or the grammar, which is why most of them write our name as
      two words.

