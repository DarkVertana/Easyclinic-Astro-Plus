closing:
  heading: See the software these clinics run on
  body: >-
    In 20 minutes we follow one patient through a clinic like yours, from booking to the bill. If you would
    rather ask something first, send us a WhatsApp message from this page.
  primary:
    label: Book a 20-minute demo
    href: /contact-us/#book-a-demo
  secondary:
    label: See prices per doctor
    href: /pricing/

editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The page says who has stayed and for how long, from Dr Prantar Chakrabarti since 2008 to Penda Health
    in Nairobi since 2017, gives Dr Prabhu's six months to go paperless, and admits that no before-and-after
    case study exists and that no clinic in the UAE or Nigeria is quoted.
  readsMachineWritten: >-
    The two ratings appear in the opening, the ratings section and the reviews FAQ, and the video section is
    a bare list of names and links, so the read-aloud pass should check the page does not repeat itself or
    read as a list of links.

notes:
  - 'Spec 5.19 three written case studies (solo, chain, OPD) with before-and-after numbers are omitted: none exist. The "What customers have put a number on" section says so. When they are written, add them as a contentCards section (or featureRows) above the videos and update that paragraph and the editorial pass.'
  - 'Spec 5.19 asks each testimonial to show name, specialty, clinic, city, tenure and one measured outcome; the grid renders these from src/data/testimonials through Quote.astro. outcome is null on all 16 records. city is known on 5 (jj-thakkar and both robert-korom records Nairobi, manish-bhatia Jaipur, seetha-lakshmi-kolanakuduru Hyderabad). customerSince is set on 4 (prantar-chakrabarti 2008, seetha-lakshmi-kolanakuduru 2012, both robert-korom 2017); several quotes state tenure in words ("more than 10 years", "last 5 years") that could become customerSince once dated. Unknowns are left out in production by optional().'
  - 'Filters: TestimonialGrid.astro offers clinic type (personas) and country filters only. Spec 5.19 also asks for a specialty filter, which the component does not have; specialty is also missing on foster-akaketwa, hisham-ismail, robert-korom (both) and tarun-mishra. The grid intro therefore names only clinic type and country.'
  - 'The grid uses no "only" list, so both Dr Robert Korom records (robert-korom-partner and robert-korom-reliability) show as two cards; TestimonialGrid.astro does not merge records with the same name.'
  - 'Google badge has no href: the live site shows only the Trustindex badge ("4.8 Top Rated Service 2026 verified by Trustindex ... based on reviews collected on Google over the past 12 months") and links no Google reviews page. The ratings intro and the reviews FAQ say where the figure comes from. Add the Google Business profile URL when supplied. Review counts (facts.yaml capterraReviews, googleReviews) are null, so the badges show no count; spec 2.4 asks for a badge with its count.'
  - 'Videos: the three YouTube links are the embeds on the live /testimonials/ (facts.md section 2). The names in the link text are the video titles as published by the Easy Clinic YouTube channel (YouTube oEmbed, 26 September 2026) and the VideoObject names on the live /testimonials/: Dr Piya Ray (EhGn45zbOoU, 1:14), Dr Abhijit Bhattacharya (c2trQPH9rcM, 1:01), Dr Amit Kumar Agarwal (l4Y5DT20F6M, 1:47). The live page describes them only as "what our client''s have to say about us", so the page gives no specialty, clinic or city for them. None has a record in src/data/testimonials; add records with consent, specialty and city to show them in the grid or as proofBlock media of kind video with videoUrl.'
  - 'Schema: no Review or AggregateRating. The ratings are third-party scores, and the site does not mark them up (spec 2.10 and the page brief).'
  - 'FAQ "Can I speak to a customer?" is left out: no reference-call arrangement is confirmed anywhere. Spec 5.19 also asks to recruit a UAE and a Nigerian story before the country pages relaunch; the countries FAQ says there is none.'
  - 'Retention FAQ: facts.yaml notes that the {fact:retention} counter on the live /about-us/ has no published method or date, so the answer says so. The "for more than five years" wording follows the facts.yaml label. The retention figure is kept out of the opening so it appears once.'
  - 'Not carried over from the live /testimonials/: the Trustindex certificate wording beyond the source of the Google figure, the feature list, the "try Easy Clinic absolutely free" line (other pages say there is no free trial), and the "Ready to rethink medical software" boilerplate. Dr V Ramanathan (Australia) and Dr S. B. Bhattacharyya (Noida), quoted in abridged form on the live homepage, have no testimonial records, so they are not shown.'
  - 'Penda Health study wording follows docs/briefs/page-writing-rules.md and the /curapilot/ page: a 2025 preprint, AI Consult, independent physicians as raters, 15 clinics. The tool is not called Cura AI or CuraPilot, and the page does not say "peer reviewed". The link goes to the studyCard (id study) on /curapilot/.'
  - 'The old URL /testimonials/ already redirects here in src/data/redirects.yaml, so it is not repeated in redirectFrom. There is no customers hub, so links.hub is not set.'
