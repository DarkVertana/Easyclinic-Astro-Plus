title: 'Cura AI: AI Medical Scribe and Clinic Assistant: Easy Clinic'
metaDescription: >-
  Cura AI is Easy Clinic's AI medical scribe: it drafts the consult note and prescription while you talk,
  for you to confirm. Included in Professional.
h1: An AI scribe that writes the note as you consult
linkLabel: Cura AI
eyebrow: Cura AI, the AI inside Easy Clinic
openingAnswer: >-
  Cura AI is Easy Clinic's AI medical scribe: it listens to the consult and drafts the note and
  prescription in the chart for you to confirm. Note drafting is listed as Cura AI (documentation) in the
  Professional plan, at {price:usd.professional.annual} per doctor per month billed annually, and it also
  answers the phone and WhatsApp.
summary: >-
  What each Cura AI feature does, from the AI scribe that drafts the consult note to the owner's
  end-of-day summary, and which plan includes the note drafting.
