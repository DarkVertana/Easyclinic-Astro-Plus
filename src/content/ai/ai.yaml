sections:
  - discriminant: featureRows
    value:
      id: six-jobs
      heading: Six jobs Cura AI does in the clinic
      intro: >-
        Cura AI is the name for every AI feature inside Easy Clinic, so each job below happens in the
        system the desk and the doctor already use. Only the note drafting appears on the published
        price list, as Cura AI (documentation) in Professional.
      items:
        - heading: Writes the note while you talk
          plan: professional
          body: >-
            Cura AI listens to the consultation and drafts the note and the prescription in the
            patient's chart while you talk. You correct anything it got wrong and confirm it. The draft
            sits in the same chart you write in without the AI, so there is nothing to paste across.
          link:
            label: See the EMR it writes into
            href: /features/emr/
        - heading: Answers the phone and WhatsApp
          body: >-
            This is the AI reception. Cura AI answers when patients ring the clinic or write to it on
            WhatsApp, so a patient gets a reply while your receptionist is busy with the person standing
            at the desk.
        - heading: Flags a missed diagnosis
          body: >-
            This job belongs to CuraPilot, the clinical copilot among the Cura AI features. During the
            consult it reads the patient's chart and flags a diagnosis that may have been missed. The
            flag is advice, and the doctor decides what to do with it.
          link:
            label: See what CuraPilot does
            href: /curapilot/
        - heading: Codes the bill
          body: >-
            Cura AI reads the diagnosis and the services in the note and suggests the codes for the
            bill, so the invoice starts from what happened in the consult. The codes stay suggestions
            until you confirm them.
          link:
            label: See how billing works
            href: /features/billing/
        - heading: Predicts stockouts
          body: >-
            For a clinic that dispenses from Easy Clinic, Cura AI compares how fast each medicine is going
            out with the stock that is left, and warns you before one runs out. That leaves time to
            reorder before a patient is sent away without it.
          link:
            label: See pharmacy and inventory
            href: /features/pharmacy-and-inventory/
        - heading: Summarises the day for the owner
          body: >-
            At the end of the day, Cura AI writes the owner a short summary of the day from Easy Clinic's
            reports. You read the day in a few sentences and open a report only when something in the
            summary needs a closer look.

  - discriminant: scopeBox
    value:
      id: safety
      heading: How Cura AI stays safe
      intro: Cura AI is designed around four rules.
      variant: limits
      items:
        - >-
          **A clinician confirms every suggestion.** A drafted note or a flagged diagnosis stays a
          suggestion until the doctor accepts it, and the doctor can change it first.
        - >-
          **No training on patient data.** Patient records are not used to train Cura AI, whether they
          come from your clinic or any other.
        - >-
          **An audit log.** Cura AI keeps an audit log, so there is a record of what it suggested.
        - >-
          **Consent language for each country.** Cura AI comes with patient consent wording written per
          country.
      note: >-
        **What it does not do:** Cura AI does not work offline. It needs an internet connection, and
        Easy Clinic itself does not run fully offline today.

  - discriminant: proofBlock
    value:
      id: study
      eyebrow: The Penda Health study
      heading: What the Penda Health study measured
      variant: study
      figures:
        - visits
        - diagnostic-errors
        - treatment-errors
      body: |
        In a 2025 preprint written with OpenAI, Penda Health studied {fig:visits} patient visits at 15 of its clinics in Nairobi. The tool it measured was AI Consult, a copilot embedded in the Easy Clinic record Penda has used since 2017. Independent physicians rated a random sample of the visit records, and those where the clinician had AI Consult showed fewer errors on the measures above.

        The study measured clinical errors, not note drafting, and it is a preprint on arXiv rather than a journal article.
      link:
        label: Read how the study was run
        href: /curapilot/

  - discriminant: dataTable
    value:
      id: compare
      heading: Cura AI or a standalone AI scribe
      intro: >-
        A standalone AI scribe is a separate app that drafts the consult note. Cura AI does the same job
        inside Easy Clinic, so the difference is what happens to the note afterwards.
      caption: Cura AI compared with a standalone AI scribe app, question by question
      columns:
        - Question
        - Cura AI
        - A standalone AI scribe
      rows:
        - - Where does the draft note go?
          - Into the patient's Easy Clinic chart, beside the prescription and past visits.
          - Into the scribe's own app, and from there into your EMR if the two connect.
        - - Do I copy and paste between apps?
          - No, the draft is already in the chart when you open it.
          - Often, when the scribe does not connect to your EMR.
        - - Does it know about the bill?
          - Yes, the same note feeds the bill codes Cura AI suggests.
          - The bill is raised in separate software, so codes reach it only if the two connect.
        - - What does it cost?
          - Included in Professional, at {price:usd.professional.annual} per doctor per month billed annually, with the EMR.
          - Priced separately from your EMR.
        - - Can I keep the EMR I already have?
          - Cura AI writes into Easy Clinic's own chart, as part of the Easy Clinic subscription.
          - Yes, if the scribe connects to your EMR, or by copy and paste.
        - - What if I consult at more than one clinic?
          - It works where the clinic runs Easy Clinic.
          - It can go with you from clinic to clinic, whatever system each one runs.
      note: >-
        Standalone scribes differ from one another, so this compares the two kinds of product rather than a
        named vendor. If all you want is a faster note in the EMR you already use, a standalone scribe may
        suit you better.

faqHeading: Questions doctors ask about Cura AI
faq:
  - question: Is Cura AI optional?
    answer: >-
      Yes, the EMR works without it: you write the note and the prescription yourself, in the same chart
      Cura AI would write into.
  - question: Which plan includes the AI scribe?
    answer: >-
      Professional includes it, listed as Cura AI (documentation), at {price:usd.professional.annual} per
      doctor per month billed annually or {price:inr.professional.annual} in India. Premium and Enterprise
      include everything in Professional, so the note drafting comes with every Easy Clinic plan. It is the
      only Cura AI feature named on the published price list.
  - question: Does the doctor approve the note?
    answer: >-
      Yes, the note Cura AI drafts stays a suggestion until the doctor confirms it, and you can change
      anything in it first. The same rule covers everything else Cura AI suggests.
  - question: Is Cura AI trained on my patients' data?
    answer: >-
      No, patient data is not used to train Cura AI, whether it comes from your clinic or any other. It is
      one of the four rules Cura AI is designed around, set out above under how Cura AI stays safe.
  - question: Does Cura AI work offline?
    answer: >-
      No, Cura AI needs an internet connection, and Easy Clinic as a whole does not run fully offline
      today. If the connection at your clinic drops often, weigh that before you plan a busy clinic around
      AI-drafted notes.
  - question: Is Cura AI the same thing as CuraPilot?
    answer: >-
      No, Cura AI is the name for every AI feature in Easy Clinic, and CuraPilot is one of them: the
      clinical copilot that flags a missed diagnosis during the consult. The AI scribe on this page is
      part of Cura AI, and CuraPilot has [its own page](/curapilot/).
  - question: Was the AI scribe tested in the Penda Health study?
    answer: >-
      No, the 2025 study measured AI Consult, a copilot embedded in Penda Health's Easy Clinic record, and
      it counted clinical errors, not note drafting. Easy Clinic has not published a measured figure for
      the time Cura AI saves per note.

