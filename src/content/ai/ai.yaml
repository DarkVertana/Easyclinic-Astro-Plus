editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The Penda Health study on the Easy Clinic record Penda has used since 2017, and Cura AI (documentation)
    on the Professional price list beside the EMR, are specific to Easy Clinic, though nothing on the page
    is specific to one clinic type or one country.
  readsMachineWritten: >-
    The six job descriptions share one shape and describe screens a doctor cannot see yet, no named doctor
    speaks on the page and there is no measured minutes-per-note figure, and the comparison names no scribe
    vendor, which a doctor who has tried Heidi or DeepScribe may read as generic.

notes:
  - 'Title kept from spec 4.1 (59 characters). Meta description drops the spec''s "Peer reviewed" and the spec''s "answers WhatsApp and codes the bill": the 39,849-visit study is an arXiv preprint (korom-2025 in study.yaml), and the meta names only the job that has a plan.'
  - 'The live /ai/ URL is kept (58,947 impressions at position 5.8, spec 8). Spec 5.2 asks for a Search Console check of which queries it ranks for before the rewrite; that check has not been done here.'
  - 'Plan tag only on the note-drafting row: Cura AI (documentation) in Professional is the only plan fact (plans.yaml; Premium and Enterprise include everything in Professional). Which plan includes the AI reception, bill coding, stockout prediction, the owner summary and CuraPilot is unknown; add a plan tag to each row, and name the plan in the opening answer, once product confirms (spec 5.2 asks for a plan per job). The FAQ asks "Which plan includes the AI scribe?" rather than "Cura AI" for that reason, and says the note drafting is the only Cura AI feature on the price list.'
  - 'The four safety rules are the spec 5.2 item 3 list, written as design rules with no added detail. Product should confirm each one, what the audit log records, who can see it, and how the consent wording is supplied, before a reviewer relies on the wording.'
  - 'Job mechanisms are written in plain words from spec 1.2, 4.1 and 5.2 only. Adversarial pass (26 Sep) removed: the AI reception answering "from the same calendar your receptionist books into" (calendar access unconfirmed), "bill lines" in bill coding, "the reorder goes in" (implied automatic reordering), example contents of the owner summary (patients seen, cash collected), the audit log being something "the clinic can look back through", and "checked clinicians'' work" as a description of AI Consult (not in the allowed facts).'
  - 'Left out for lack of a confirmed fact: which languages and accents the scribe handles, Hindi and Swahili status, accuracy, minutes saved per note, whether the AI reception books, reschedules or hands over to staff, how and when the owner summary is delivered, the stockout warning lead time (the 45-day figure has no source), specialty templates for AI notes, and whether Cura AI is switched on per doctor or per clinic.'
  - 'Spec 5.2 FAQ direction also lists languages and accents, Hindi and Swahili status, accuracy and specialty templates; all four are unknown and left out. Add them when product supplies the answers.'
  - 'Whether Cura AI (documentation) can be bought for an EMR other than Easy Clinic is unknown, so the comparison row says only that it writes into Easy Clinic''s chart as part of the subscription, and never says "no". Spec 5.3 says CuraPilot sits on Easy Clinic or an existing HIS; that is not repeated here.'
  - 'Comparison rows about standalone scribes are hedged ("often", "if the two connect", "can") and name no vendor, because the dataTable has no per-row source or checked-on date (spec 7.2 comparison fields). The billing row no longer says standalone scribes "usually" do not code, since some may.'
  - 'The study body says AI Consult and never equates it with Cura AI or CuraPilot (study.yaml note: confirm whether CuraPilot is AI Consult). Figures are visits, diagnostic-errors and treatment-errors via study.yaml. The 108-physician panel is described as "independent physicians" without the number, because the lint claims rule expects research figures as study.yaml tokens.'
  - 'Left out until they exist: hero ambient-note demo video (spec 5.2 item 1), one screenshot per job (spec 12), a measured minutes-per-note figure and a doctor quote about documentation (spec 5.2 proof). No testimonial is assigned to this page.'
  - 'Spec 5.2 primary CTA "Try Cura AI on your next 10 patients" is not used: no such trial is confirmed and the 23 September decision is no free trial. The demo CTA is used instead.'
  - 'heroStrip.study is left off because its line ("AI copilot studied on ...") under a scribe H1 could read as if the scribe was studied.'
  - 'Audit 2026-09-27: study body now says independent physicians rated "a random sample of the visit records", as /about-us/ does; the paper''s panel rated 5,666 of the visits, not all of them (study.yaml scope). The "Predicts stockouts" row is unchanged: /curapilot/ now also names stock prediction as a Cura AI job (spec 1.2).'
  - 'Audit 2026-09-27: added the published posts this page owns to links.related, with each post''s own label and summary as anchor text and description. /ai-emr-software-vs-traditional-emr/ and /clinic-workflow-automation/ had no inbound link but /blog/.'
