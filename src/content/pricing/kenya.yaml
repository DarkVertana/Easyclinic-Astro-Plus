faqHeading: Questions Kenyan clinic owners ask about cost
faq:
  - question: How much does EasyClinic cost in Kenya?
    answer: >-
      EasyClinic costs {price:kes.professional.annual} per doctor per month on Professional and
      {price:kes.premium.annual} on Premium, billed annually, and Enterprise, for clinic chains and
      hospital OPDs, is priced on a quote. A reception login is included on every plan and there is no
      setup fee.
  - question: Is VAT included in the price?
    answer: >-
      [Whether KES plan prices include VAT, or VAT is added to EasyClinic's invoice, and at what rate].
      Whether your clinic can claim back any VAT on the subscription depends on how your own services are
      taxed, so ask your accountant before you budget for it.
  - question: Can I pay the subscription by M-Pesa?
    answer: >-
      [How Kenyan clinics pay the subscription, for example M-Pesa or bank transfer]. Your
      patients' M-Pesa payments at the desk are a separate matter: they are recorded against the patient's
      bill in EasyClinic, so the balance shows what is still owed.
  - question: Is it cheaper to pay annually or quarterly?
    answer: >-
      Annual is cheaper, because Premium is {price:kes.premium.annual} per doctor per month billed
      annually against {price:kes.premium.quarterly} billed quarterly, and Professional is
      {price:kes.professional.annual} against {price:kes.professional.quarterly}. Annual billing means
      paying for twelve months at once, so the quarterly plan suits a clinic that wants three months on
      real patients before committing a year's budget.
  - question: Can I send claims to Jubilee or AAR on the Professional plan?
    answer: >-
      Yes, with the insurance claims add-on, which Professional and Premium can add and Enterprise
      already includes. Claims to Jubilee, AAR, CIC, Britam and Resolution go through SLADE from the same
      bill your front desk raised, and the add-on covers payer price lists, coverage checks at
      registration, claim packs and reconciliation.
  - question: What happens to my plan if I open a second branch?
    answer: >-
      You move to Premium or Enterprise, because Professional covers one location and Premium is the
      first plan that covers more than one, at {price:kes.premium.annual} per doctor per month billed
      annually. Enterprise adds central control of every branch and stock transfers between them. There is
      no contract holding you to the plan you started on, so you can move up when the second branch opens.
  - question: Is there a free trial of EasyClinic in Kenya?
    answer: >-
      No, EasyClinic does not offer a free trial, in Kenya or anywhere else. You can book a 20-minute demo
      on a clinic set up like yours, and if you want to test it on real patients, pay for one quarter;
      there is no contract to break if you stop.
  - question: Am I locked into any contracts?
    answer: >-
      No, EasyClinic has no binding contract on any plan, and no setup fee to lose if you stop. You pay a
      year or a quarter at a time, so the shortest commitment is one quarter, at
      {price:kes.professional.quarterly} or {price:kes.premium.quarterly} per doctor per month.

