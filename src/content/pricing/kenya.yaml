  - Head keyword "clinic software cost in Kenya" is owned here (spec 4.5 rule 4, cost intent). /emr-software-in-kenya/ owns "clinic management software in Kenya"; keep KES cost questions there short and link here.
  - 'Placeholders to fill (fact sheet): whether KES prices include VAT and at what rate (costExamples intro, prose, FAQ 2; the same wording in each so the facts report groups them); how Kenyan clinics pay the subscription (prose, FAQ 3; the brief notes M-Pesa is named on /kenyademo/ only for patient payments at the desk); which company invoices Kenyan clinics (prose; this decides how VAT and eTIMS apply to the subscription); eTIMS status in EasyClinic with a date (prose; regulators/ke-etims.yaml state is null); whether a clinical officer who writes notes and prescriptions needs a doctor licence (dataTable).'
