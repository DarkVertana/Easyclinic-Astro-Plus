  - 'M-Pesa: countries/ke.yaml M-Pesa (Daraja, Till and Paybill) state is null, so the page says only that a desk payment is recorded against the bill (as /kenyademo/ does) and says nothing about Daraja, a Till or Paybill number, automatic reconciliation or any charge for the connection. Add a sentence to the dataTable M-Pesa row once confirmed.'
  - 'SLADE and M-Pesa wording checked against the live /kenyademo/ on 2026-09-26: "Integrated with Jubilee, AAR, CIC, Britam and Resolution through SLADE. M-Pesa handles cash." and the screen caption "SLADE submitted to Jubilee Health. M-Pesa received. eTIMS compliant. Balance zero." The page repeats only what those lines say a clinic does (claims through SLADE from the bill, an M-Pesa payment recorded against the bill) and follows the published /kenyademo/ rebuild; it gives no integration state, date or certification. eTIMS stays a placeholder because the live Kenya pages conflict ("eTIMS compliant" vs "Soon").'
