  - discriminant: dataTable
    value:
      id: included
      heading: What the price includes and what costs extra
      intro: >-
        You pay one licence for each doctor who uses EasyClinic. This table shows what that price covers
        and what you pay for separately.
      caption: What is included in the per-doctor price in Kenya, and what is charged separately
      columns:
        - Item
        - Included or extra
        - What to know
      rows:
        - - Reception login
          - Included on every plan
          - A licence for your reception comes with the price. Reception cannot open the EMR or write prescriptions.
        - - Clinical officers who see patients
          - '[Whether a clinical officer who writes notes and prescriptions needs a doctor licence]'
          - If a clinical officer sees patients and writes prescriptions at your clinic, this decides how many licences you count.
        - - Logins for your staff
          - Included on every plan
          - Professional includes logins for your staff, and every higher plan includes everything in Professional.
        - - Setup
          - No fee
          - No setup fee on any plan, and no contract to sign.
        - - Training and support
          - Included on every plan
          - The four-day training path further down this page, and unlimited support after it.
        - - Cash and M-Pesa payments at the desk
          - Included on every plan
          - Billing and payments are part of Professional, so a payment taken at the desk is recorded against the patient's bill and the balance shows what is still owed.
        - - Customisation options in the software
          - No extra charge
          - Hundreds of customisation options, at no charge. Your own clinical forms and print layouts are part of Premium.
        - - SMS and email reminders
          - Included on every plan
          - Part of Professional, so a one-doctor clinic has them too. WhatsApp reminders need Premium.
        - - WhatsApp reminders and messages
          - Included on Premium and Enterprise
          - How the reminders work is on the [WhatsApp page](/features/whatsapp/).
        - - Pharmacy and lab modules
          - Included on Enterprise
          - Add-ons on Professional and Premium, described in the next section.
        - - Insurer claims through SLADE
          - Included on Enterprise
          - An add-on on Professional and Premium. Claims to Jubilee, AAR, CIC, Britam and Resolution go through SLADE from the same bill.
        - - Integrations and custom development
          - Included on Enterprise
          - An add-on on Professional and Premium, scoped per project, for example a connection to your lab machines or an existing HIS.

  - discriminant: addOns
    value:
      id: add-ons
      heading: Add-ons for Professional and Premium
      intro: >-
        Enterprise already includes these modules. On Professional and Premium you add only the ones your
        clinic runs, such as insurer claims once your first corporate patients arrive with Jubilee or AAR
        cover.
      currency: kes

  - discriminant: prose
    value:
      id: vat-etims-and-payment
      heading: VAT, eTIMS invoices and how you pay
      body: |-
        **What you pay us.** You pay per doctor, once a year or once a quarter, and paying for the year costs less each month. Your subscription is invoiced by [which company invoices Kenyan clinics: Novel Medicare Solutions Pvt Ltd in Kolkata or a Kenyan company], and you pay it by [how Kenyan clinics pay the subscription, for example M-Pesa or bank transfer].

        **VAT on the subscription.** [Whether KES plan prices include VAT, or VAT is added to EasyClinic's invoice, and at what rate]. Ask your accountant whether your clinic can claim back any VAT on the subscription.

        **What your patients pay you.** Billing and payments come with every plan, so what a patient pays at the desk, in cash or by M-Pesa, goes on their bill in EasyClinic and the balance shows what is still owed. Premium adds online payments. When an insurer covers part of the visit, the claim goes to the insurer through SLADE from the same bill, on Enterprise or with the claims add-on.

        **eTIMS on your own invoices.** eTIMS is the Kenya Revenue Authority's electronic tax invoice system. With eTIMS, each invoice is sent to KRA and the receipt carries the eTIMS reference, and registering for eTIMS with KRA is the clinic's job. Whether EasyClinic sends your clinic's invoices to eTIMS: [eTIMS status in EasyClinic, as of date].
      aside: >-
        Ask your accountant which of your services and sales carry VAT, and which of your invoices must go
        through eTIMS. How billing works inside EasyClinic is on the [billing page](/features/billing/).
      width: measure

