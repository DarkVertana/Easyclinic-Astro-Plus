faqHeading: Questions UAE clinic owners ask about cost
faq:
  - question: How much does Easy Clinic cost in the UAE?
    answer: >-
      Easy Clinic costs {price:aed.professional.annual} per doctor per month on Professional and
      {price:aed.premium.annual} on Premium, billed annually, and Enterprise, for clinic chains and
      hospital OPDs, is priced on a quote. A reception login is included on every plan and there is no
      setup fee.
  - question: Is VAT included in the price?
    answer: >-
      [Whether AED plan prices include VAT, or VAT is added to Easy Clinic's invoice, and at what rate].
      Whether your clinic can recover any VAT on the subscription depends on how your own services are
      taxed and whether your clinic is registered for VAT, so ask your accountant or tax agent before
      you budget for it.
  - question: Can I pay the subscription by card or bank transfer?
    answer: >-
      [How UAE clinics pay the subscription, for example card or bank transfer]. Your patients'
      payments are a separate matter: what a patient pays at the desk is recorded against their bill in
      Easy Clinic, so the balance shows what is still owed. Premium adds online payments.
  - question: Is it cheaper to pay annually or quarterly?
    answer: >-
      Annual is cheaper, because Premium is {price:aed.premium.annual} per doctor per month billed
      annually against {price:aed.premium.quarterly} billed quarterly, and Professional is
      {price:aed.professional.annual} against {price:aed.professional.quarterly}. Annual billing means
      paying for twelve months at once, so the quarterly plan suits a clinic that wants three months on
      real patients before committing a year's budget.
  - question: Are insurance claims included on the Professional plan?
    answer: >-
      No, insurance claims are an add-on on Professional and Premium, and Enterprise includes them. The
      add-on covers payer price lists, coverage checks at registration, claim packs and reconciliation.
      In Dubai, claims and prior authorisations go to insurers electronically through DHA eClaimLink, and
      Easy Clinic's eClaimLink status is [eClaimLink status in Easy Clinic, as of date].
  - question: What happens to my plan if I open a branch in another emirate?
    answer: >-
      You move to Premium or Enterprise, because Professional covers one location and Premium is the
      first plan that covers more than one, at {price:aed.premium.annual} per doctor per month billed
      annually. Enterprise adds central control of every branch and stock transfers between them. There
      is no contract holding you to the plan you started on, so you can move up when the new branch
      opens. What a branch needs from its software in each emirate, such as NABIDH in Dubai or Malaffi
      in Abu Dhabi, is on the [UAE page](/clinic-management-software-uae/).
  - question: Does keeping patient data inside the UAE cost extra?
    answer: >-
      [Where UAE clinics' patient data is hosted today, and whether hosting inside the UAE costs extra].
      Federal Law No. 2 of 2019, the ICT Health Law, keeps health data inside the UAE unless an
      exemption applies, so ask any software vendor where your patient data will be hosted before you
      sign. How Easy Clinic protects patient data is on the [trust page](/trust/).
  - question: Am I locked into any contracts?
    answer: >-
      No, Easy Clinic has no binding contract on any plan, and no setup fee to lose if you stop. You pay a
      year or a quarter at a time, so the shortest commitment is one quarter, at
      {price:aed.professional.quarterly} or {price:aed.premium.quarterly} per doctor per month. There is
      no free trial; a 20-minute demo shows you Easy Clinic on a clinic set up like yours first.

