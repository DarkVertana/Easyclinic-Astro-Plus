  - discriminant: stepList
    value:
      id: training
      heading: How long does it take to learn Easy Clinic?
      intro: >-
        About two hours, spread over four days, and it is included in every plan. Each session is 20 to 40
        minutes, short enough to fit around the day's patients, so nobody closes the clinic for a day to
        learn it.
      steps:
        - title: 'Day 1: basic training'
          meta: 40 minutes
          body: >-
            The screens your front desk and your doctors use every day. Bring your receptionist to this one,
            since their login is part of the plan.
        - title: 'Day 2: EMR scenario training'
          meta: 40 minutes
          body: >-
            Doctors work through the kinds of consult they see most, from a new patient to a follow-up with
            lab tests ordered.
        - title: 'Day 3: practice exercises'
          meta: 20 minutes
          body: You work through exercises on your own, then bring back the questions that came up.
        - title: 'Day 4: road to expertise'
          meta: 20 minutes
          body: >-
            The shortcuts that make each prescription quicker, once the basics have become habit.
      note: >-
        If you write prescriptions by hand today, give us 2 hours or 10 patient records, and we promise to
        make your prescription writing faster.

  - discriminant: proofBlock
