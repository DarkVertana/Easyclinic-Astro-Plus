  - discriminant: costExamples
    value:
      id: what-clinics-pay
      heading: What a UAE clinic pays each month
      intro: >-
        These totals use the annual price and count doctors only, because the reception login is already
        included. Add-ons are not in these figures. [Whether AED plan prices include VAT, or VAT is added
        to Easy Clinic's invoice, and at what rate]. Paying quarterly, each doctor costs
        {price:aed.professional.quarterly} on Professional or {price:aed.premium.quarterly} on Premium.
      currency: aed
      period: annual
      examples:
        - title: A GP running their own clinic
          doctors: 1
          locations: 1
          plan: professional
          note: >-
            One doctor and one receptionist, and that is the whole subscription. It runs in the cloud, so
            there is no server in the clinic and no IT staff to hire. If most of your patients pay through
            insurance, the claims add-on goes on top of this figure. WhatsApp reminders need Premium; SMS
            and email reminders are on Professional.
        - title: A five-doctor polyclinic
          doctors: 5
          locations: 1
          plan: premium
          note: >-
            Five doctors share one patient record and one front desk. Premium adds specialty templates and
            WhatsApp reminders. A pharmacy counter and insurance claims are add-ons on Premium, and both
            are part of Enterprise.
        - title: A three-branch group across two emirates
          doctors: 9
          locations: 3
          plan: enterprise
          note: >-
            Chains standardise price lists and SOPs from the centre and move stock between branches, both
            part of Enterprise, which is priced on a quote. The largest chain on Easy Clinic runs
            {fact:largestChain} locations. What each emirate's health authority asks of your software is
            on the [UAE page](/clinic-management-software-uae/).

  - discriminant: dataTable
    value:
      id: included
      heading: What the price includes and what costs extra
      intro: >-
        You pay one licence for each doctor who uses Easy Clinic. This table shows what that price covers
        and what you pay for separately.
      caption: What is included in the per-doctor price in the UAE, and what is charged separately
      columns:
        - Item
        - Included or extra
        - What to know
      rows:
        - - Reception login
          - Included on every plan
          - A licence for your reception comes with the price. Reception cannot open the EMR or write prescriptions.
        - - Part-time and visiting doctors
          - '[How a part-time or visiting doctor who consults on some days is charged]'
          - If a specialist consults at your clinic on set days and practises elsewhere the rest of the week, this decides how many licences you count.
        - - Logins for your staff
          - Included on every plan
          - Professional includes logins for your staff, and every higher plan includes everything in Professional.
        - - Setup
          - No fee
          - No setup fee on any plan, and no contract to sign.
        - - Training and support
          - Included on every plan
          - The four-day training path further down this page, and unlimited support after it.
        - - Payments at the desk
          - Included on every plan
          - Billing and payments are part of Professional, so a payment taken at the desk is recorded against the patient's bill and the balance shows what is still owed.
        - - Online payments
          - Included on Premium and Enterprise
          - '[Which payment gateways UAE clinics can use for online payments, as of date].'
        - - Customisation options in the software
          - No extra charge
          - Hundreds of customisation options, at no charge. Your own clinical forms and print layouts are part of Premium.
        - - SMS and email reminders
          - Included on every plan
          - Part of Professional, so a one-doctor clinic has them too. WhatsApp reminders need Premium.
        - - WhatsApp reminders and messages
          - Included on Premium and Enterprise
          - How the reminders work is on the [WhatsApp page](/features/whatsapp/).
        - - Pharmacy and lab modules
          - Included on Enterprise
          - Add-ons on Professional and Premium, described in the next section.
        - - Insurance claims
          - Included on Enterprise
          - An add-on on Professional and Premium. If most of your patients pay through insurance, price it in from the start.
        - - Hosting inside the UAE
          - '[Whether hosting patient data inside the UAE is included or costs extra]'
          - Federal Law No. 2 of 2019 keeps health data inside the UAE unless an exemption applies, so ask where your clinic's data will be hosted before you sign.
        - - Integrations and custom development
          - Included on Enterprise
          - An add-on on Professional and Premium, scoped per project, for example a connection to your lab machines or an existing HIS.

  - discriminant: addOns
    value:
