  - discriminant: prose
    value:
      id: vat-invoices-and-payment
      heading: VAT and payments
      body: |-
        **What you pay us.** You pay per doctor, once a year or once a quarter, and paying for the year costs less each month. Your subscription is invoiced by [which company invoices UAE clinics: Novel Medicare Solutions Pvt Ltd in Kolkata or a UAE company], and you pay it by [how UAE clinics pay the subscription, for example card or bank transfer].

        **VAT on the subscription.** [Whether AED plan prices include VAT, or VAT is added to Easy Clinic's invoice, and at what rate]. Ask your accountant or tax agent whether your clinic can recover any VAT on the subscription.

        **What your patients pay you.** Billing and payments come with every plan, so what a patient pays at the desk goes on their bill in Easy Clinic and the balance shows what is still owed. Premium adds online payments. When an insurer covers part of the visit, the claims add-on, which Enterprise includes, handles payer price lists, coverage checks at registration, claim packs and reconciliation. In Dubai, insurance claims and prior authorisations go to insurers electronically through DHA eClaimLink. Whether Easy Clinic sends your claims through eClaimLink: [eClaimLink status in Easy Clinic, as of date].

        **VAT on your own bills.** [How UAE VAT applies to a clinic's own bills, for consultations, medicines and cosmetic procedures, from the company's UAE tax adviser]. Whether Easy Clinic prints your bills as VAT tax invoices carrying your TRN: [VAT tax invoice status in Easy Clinic, as of date].
      aside: >-
        Ask your accountant or tax agent which of your services carry VAT. How billing works inside
        Easy Clinic is on the [billing page](/features/billing/).
      width: measure

  - discriminant: planMatrix
    value:
