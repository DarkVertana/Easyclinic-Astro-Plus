notes:
  - 'Published on 2026-09-26 with confirmed facts only, without waiting for the fact sheet. Restore these when the company confirms them: support hours and time zones; refunds on unused months of annual billing; the export format for patient records on leaving and how long data is kept after cancelling; how many reception logins a clinic gets; the licence rule for nurses, pharmacists and visiting or part-time doctors; what counts as a location, whether there is a per-location fee and whether a doctor at two branches needs two licences; how long a prescription template takes to build and who builds it; what a Professional clinic can change on the printed prescription; whether INR prices include GST; KES, AED and NGN prices; NGO pricing; WhatsApp per-message charges; the data migration price; an indicative Enterprise range per doctor; add-on prices (the add-on cards show none in production).'
  - 'FAQ changes for publication: "What does a second branch cost?" became "Does Easy Clinic still work if I open a second branch?" (spec 6.4 keep list) until the per-location fee is confirmed; "Which currency will I be billed in, and are taxes included?" was replaced by the offline question; the data-on-leaving half of the contracts question and the NGO half of the discount question were cut. Spec 5.12 wants them back, with "what happens on cancelling", once the facts arrive. The free-EMR table lost its "Your data when you leave" row for the same reason.'
  - 'Meta description follows the spec 4.1 row minus "See local prices": the lint counts the raw string, and with price tokens the full spec text is 167 characters (it renders at about 98). "Per doctor per month" is carried by the title.'
  - 'Head keyword: the spec title and H1 do not contain "clinic management software pricing", so the phrase sits in the first sentence of the opening answer. Title and H1 are kept exactly as spec 4.1 sets them.'
  - 'planCta uses "Start with {plan}", which the cards render as the spec labels "Start with Professional" and "Start with Premium". There is no free trial (spec 12), so the button goes to the demo form.'
  - 'Closing secondary CTA links to /pricing/india/ for now. Switch it to "See the product in 6 minutes" when the six-minute tour has a URL (spec 12, The tour; same note as home.yaml). /tour/ is not in the spec site tree and would fail the post-build link check.'
  - 'Pricing unit conflict on the live site: /best-clinic-management-software-kenya/ says "per user and per location", /emr-software-in-india/ says "per clinic per month". This page follows live /pricing/ (per doctor). Fix the other pages.'
  - 'Live /pricing/ FAQ says a beginner becomes an expert "in less than 1 hour", while the four-day breakdown adds up to two hours. This page uses the four-day breakdown (spec 6.4 keep list).'
  - The 12-branch chain example assumes three doctors per branch (36). It is illustrative; change the numbers to a real customer shape if one can be named.
  - 'Free-EMR table: the statements about OpenMRS, OpenEMR and KenyaEMR are general (open source, self-hosted or partner-hosted, KenyaEMR is an OpenMRS distribution). The AI pass found them consistent with general knowledge; a human should still check them.'
  - 'Support channels on live /pricing/ are phone, email and chat; this page names phone and chat only, to avoid a list of three.'
  - '"Premanand" vs "Premananda" spelling is unresolved (facts.md, section 2); the name appears in the testimonial and in the training step list.'
  - 'Audit 2026-09-27: dropped the spec 4.1 secondary keyword "clinic software cost India"; /pricing/india/ owns India cost intent (spec 4.5 rule 4). The rupee prices on this page stay: spec line 28 and the CurrencySwitcher require them, and the page links to /pricing/india/.'
  - 'heroMedia was removed for publication because the screenshot does not exist yet. When it does, add it back per the spec 12 row "Currency-localised pricing cards", or use the invoice screen in INR with GST lines if the editor prefers a product screen.'
  - 'Audit 2026-09-27: pen-and-paper promise changed from "2 hours and 10 patient records" to "2 hours, or 10 patient records", the wording on /switch/, /pricing/india/, /kenyademo/ and /features/emr/. The live /pricing/ FAQ source ("give us just 2 hours / 10 patient records") is ambiguous; if the company says both are required, change every page to "and".'
  - 'Audit 2026-09-27: FAQ "Why pay when there are free EMRs?" said free EMRs are free "until you need the second doctor, the WhatsApp reminders, a server to run on", which nothing supports and several pages contradict (this page''s own free-EMR table, KenyaEMR with no licence fee, ClinikEHR''s free plan for two staff). The first sentence now reuses the free-EMR table wording: a free EMR costs nothing to license, and the cost moves to the server and to the person you call.'
  - 'Audit 2026-09-27: the /switch/ related-link description ("What we import from paper records or your current system, and how long it takes") and the training step note ("Moving your old records across from paper or another system") promised what /switch/ does not give: it lists nothing beyond the patient list, gives no migration time, and its notes say whether a paper register becomes the patient list is unknown. Both now describe what /switch/ covers (the four steps to the first day, and what changes for a clinic on paper or other software). Link href and label unchanged.'

sections:
  - discriminant: pricingCards
    value:
      id: plans
      heading: Three plans, from one doctor to a chain of branches
      intro: >-
        Pay annually for the lower price, or quarterly if you would rather not pay for a year up front.
        Every price is per doctor, and your receptionist's login costs nothing.
      currency: usd
      switcher: true
      showConditions: true
      planCta:
        label: Start with {plan}
        href: /contact-us/#book-a-demo
      enterpriseCta:
        label: Talk to sales about Enterprise
        href: /contact-us/#book-a-demo
  - discriminant: costExamples
    value:
      id: what-clinics-pay
      heading: What a 5-doctor polyclinic pays
      intro: >-
        Totals at the annual US dollar price, before any local taxes, with a one-doctor clinic and a
        12-branch chain on either side for scale. The same plans in rupees are on the
        [India pricing page](/pricing/india/).
      currency: usd
      period: annual
      examples:
        - title: Solo doctor with a receptionist
          doctors: 1
          locations: 1
          plan: professional
          note: >-
            The receptionist uses the included reception login, so this is one licence. Paying
            quarterly instead would make it {price:usd.professional.quarterly} a month.
        - title: Five-doctor polyclinic
          doctors: 5
          locations: 1
          plan: premium
          note: >-
            Five doctors sharing one front desk and one patient record, with specialty templates and
            WhatsApp reminders. The reception login is still included. If you run an in-house pharmacy
            or lab, add it from the modules below.
        - title: Twelve-branch chain
          doctors: 36
          locations: 12
          plan: enterprise
          note: >-
            Three doctors a branch, with pharmacy and claims run centrally. Enterprise is quoted because
            integrations and custom features are scoped chain by chain.
  - discriminant: planMatrix
    value:
      id: compare
      heading: Every feature, plan by plan
      intro: >-
        The bigger modules, pharmacy and lab management among them, come with Enterprise. On
        Professional and Premium you can add them one at a time, from the modules listed below.
      open: false
  - discriminant: addOns
    value:
      id: add-ons
      heading: Modules you add when you need them
      intro: >-
        Add a module when the clinic starts needing it, not before. A solo clinic that opens a
        dispensary next year adds pharmacy then, without changing plan.
      currency: usd
  - discriminant: prose
    value:
      id: licences
      heading: Who needs a licence, and which plans cover more than one location
      body: |
        You pay one licence for each doctor who uses Easy Clinic, and every plan price is per doctor per month, whether you are billed annually or quarterly.

        Your receptionist does not need one. A reception login is included in the price of every plan, and the person at the front desk books appointments and takes payments on it. It cannot open the EMR or issue a prescription.

        Professional covers one location. Premium and Enterprise cover more than one, and Enterprise adds central control of every branch.
      aside: |
        **In short**

        - Each doctor: one licence.
        - A reception login: included.
        - A second branch: Premium or Enterprise.
        - Setup: no fee.
  - discriminant: stepList
    value:
      id: training
      heading: Four days of training, about two hours in all
      intro: >-
        Training is included in every plan and is run for you and your clinic staff. The sessions are
        short so the clinic keeps seeing patients while everyone learns.
      steps:
        - title: Basic training
          meta: Day 1 · 40 minutes
          body: You and your staff find your way round the screens you will use every day, at the front desk and in the consult room.
        - title: EMR scenario training
          meta: Day 2 · 40 minutes
          body: Your common cases played through the chart, from the history to the prescription the patient takes home.
        - title: Practice exercises
          meta: Day 3 · 20 minutes
          body: Short exercises on the kinds of patients you see, so the steps stick before you use them in a real queue.
        - title: Road to expertise
          meta: Day 4 · 20 minutes
          body: The shortcuts that make the chart fast. Dr Premanand Raya, a pulmonologist, types a full prescription in half a minute with them.
      note: >-
        If you write prescriptions by hand today, give us 2 hours, or 10 of your patient records, and we
        promise to make your prescription writing faster. What changes when you move from paper or
        another system is covered on the [switching page](/switch/).
  - discriminant: dataTable
    value:
      id: free-or-paid
      heading: Free EMR or paid clinic software
      intro: >-
        Open-source EMRs such as OpenMRS and OpenEMR cost nothing to license, and for some clinics they
        are the right choice. The cost moves to the server and to the person you call when it stops
        working. This is where the money goes on each side.
      caption: A free or open-source EMR compared with Easy Clinic
      columns:
        - What you are paying for
        - Free or open-source EMR
        - Easy Clinic
      rows:
        - - The software licence
          - Nothing.
          - '{price:usd.professional.annual} per doctor per month on Professional, billed annually.'
        - - Hosting
          - Your own server, or a hosting partner you pay separately.
          - Hosted by Easy Clinic and included in the price. Enterprise can have a private cloud on request.
        - - Setup and training
          - You or a local IT partner install and configure it.
          - No setup fee, and four days of training for you and your staff.
        - - Support
          - Community forums, or a paid support contract with a partner.
          - Unlimited support by phone and chat on every plan.
        - - Appointments and billing
          - Varies by project. Check that billing works the way your clinic invoices and gets paid.
          - On every plan, with a reception login at no charge.
        - - WhatsApp reminders
          - A WhatsApp Business API provider, connected by someone technical.
          - On Premium and Enterprise. Professional sends SMS and email reminders.
        - - Who it suits
          - A programme with its own IT team, or one doctor with no staff and no plans to grow.
          - A private clinic that wants the chart and the till on one login, and someone to call.
      note: >-
        KenyaEMR, used in many Kenyan public facilities, is a distribution of OpenMRS. Hosting and
        support costs for any open-source EMR depend on who you hire to run it. The
        [Easy Clinic and KenyaEMR comparison](/easyclinic-vs-kenyaemr/) goes through the two side by side.
  - discriminant: testimonialRow
    value:
      id: customers
      heading: Doctors who have used it for years
      intro: Two doctors in India on why they stayed, in their own words.
      items:
        - manish-bhatia
        - premanand-raya
      layout: row
      usePullQuote: false
