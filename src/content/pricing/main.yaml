faqHeading: Questions clinic owners ask about price
faq:
  - question: How long does it take to learn Easy Clinic, and what support comes after?
    answer: >-
      Training takes about two hours, spread over four days: Day 1 is basic training (40 minutes),
      Day 2 is EMR scenario training (40 minutes), Day 3 is practice exercises (20 minutes) and Day 4,
      the road to expertise, is 20 minutes. It is included in every plan, for you and your staff.
      After that, support is unlimited on every plan by phone and chat, and Premium and Enterprise add
      a named account manager.
  - question: Am I locked into any contracts?
    answer: >-
      No, there is no contract on any plan and no setup fee, so you can use Easy Clinic for as long as
      it works for your clinic and stop when it does not. If you would rather not pay for a year up
      front, quarterly billing is {price:usd.professional.quarterly} per doctor per month on
      Professional and {price:usd.premium.quarterly} on Premium.
  - question: Do I pay a licence for my receptionist?
    answer: >-
      No, a reception login is included in the price of every plan, so a clinic with one doctor and
      one receptionist pays for one licence. The reception login is for the front desk and cannot open
      the EMR or write a prescription.
  - question: Does Easy Clinic still work if I open a second branch?
    answer: >-
      Yes, on Premium and Enterprise, which both cover more than one location; Professional covers
      one. A solo clinic on Professional that opens a second branch moves up to Premium, where the plan
      price is {price:usd.premium.annual} per doctor per month billed annually. A chain that wants
      central control of every branch, with clinical SOP tracking across them, moves to Enterprise,
      which is priced on a quote.
  - question: Why pay when there are free EMRs?
    answer: >-
      A free EMR costs nothing to license, and the cost moves to the server it runs on and to the person
      you call when the printer will not talk to the system. The
      {price:usd.professional.annual} Professional plan includes unlimited support and training and a
      reception login. If your clinic is one doctor with no staff and no plans to grow, a free EMR may
      be enough, and we will say so on the call.
  - question: Can I use my own prescription layout, and does it cost extra?
    answer: >-
      Yes, on Premium and Enterprise, where your own clinical forms and print layouts are part of the
      plan and cost nothing extra. The customisation options already in the product carry no charge
      on any plan, and a feature built only for your clinic is scoped and priced as custom
      development. Professional does not include your own forms or print layouts.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      No, Easy Clinic does not run fully offline today, so a clinic whose internet line often drops
      should plan for a backup connection. A mobile data connection kept for that belongs in the
      budget alongside the licences.
  - question: Is there a discount for paying annually?
    answer: >-
      Yes, annual billing is the discount: Professional is {price:usd.professional.annual} per doctor
      per month billed annually against {price:usd.professional.quarterly} billed quarterly, and
      Premium is {price:usd.premium.annual} against {price:usd.premium.quarterly}. In India the same
      pairs are {price:inr.professional.annual} against {price:inr.professional.quarterly} on
      Professional, and {price:inr.premium.annual} against {price:inr.premium.quarterly} on Premium.
