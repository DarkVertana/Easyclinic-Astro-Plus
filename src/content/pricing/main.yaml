faqHeading: Questions clinic owners ask about price
faq:
  - question: How long does it take to learn EasyClinic, and what support comes after?
    answer: >-
      Training takes about two hours, spread over four days: Day 1 is basic training (40 minutes),
      Day 2 is EMR scenario training (40 minutes), Day 3 is practice exercises (20 minutes) and Day 4,
      the road to expertise, is 20 minutes. It is included in every plan, for you and your staff.
      After that, support is unlimited on every plan by phone and chat, and Premium and Enterprise add
      a named account manager. [Support hours and the time zones covered].
  - question: Am I locked into a contract, and what happens to my data if I leave?
    answer: >-
      No. There is no contract on any plan, so you can stop at the end of any billing period you have
      paid for. If you paid for a year and leave in month five, [refund policy for unused months on
      annual billing]. When you leave, [how you get your patient records back, and in what format],
      and [how long data is kept after cancelling, and when it is deleted]. The
      [trust page](/trust/) covers where your data is stored and who can see it while you are a
      customer.
  - question: Do I pay a licence for my receptionist?
    answer: >-
      No, a reception login is included in the price of every plan, so a clinic with one doctor and
      one receptionist pays for one licence. The reception login is for the front desk and cannot open
      the EMR or write a prescription. [Number of reception logins included per clinic, and the licence
      rule for nurses and pharmacists].
  - question: What does a second branch cost?
    answer: >-
      A second branch adds a licence for each doctor who works there: on Premium that is
      {price:usd.premium.annual} per doctor per month billed annually, and [per-location fee, or
      confirmation that there is none]. [Whether a doctor who works at both branches needs a second
      licence]. Professional covers one location, so a solo clinic opening a second branch moves up
      to Premium. Chains that want central control of every branch are priced on Enterprise.
  - question: Why pay when there are free EMRs?
    answer: >-
      Free EMRs are free until you need the second doctor, the WhatsApp reminders, someone to answer
      the phone when the printer will not talk to the system, or your data back when you leave. The
      {price:usd.professional.annual} Professional plan includes unlimited support and training and a
      reception login. If your clinic is one doctor with no staff and no plans to grow, a free EMR may
      be enough, and we will say so on the call.
  - question: Can I build my own prescription template, and how long does it take?
    answer: >-
      Yes, on Premium and Enterprise, where your own clinical forms and print layouts are part of the
      plan, and a typical prescription template takes [time to build a prescription template, and who
      builds it]. The customisation options in the product carry no extra charge, and a feature built
      only for your clinic is scoped and priced as an add-on. On Professional you work with the
      standard prescription layout, and [what a Professional clinic can change on the printed
      prescription].
  - question: Which currency will I be billed in, and are taxes included?
    answer: >-
      You are billed in your own currency where EasyClinic has a local price list, and in US dollars
      everywhere else. In India, Professional is {price:inr.professional.annual} and Premium is
      {price:inr.premium.annual} per doctor per month, billed annually, and [whether INR prices include
      GST]. The local prices for Kenya, the UAE and Nigeria are [KES, AED and NGN prices per plan].
      Dollar prices have local taxes added where they apply, and you pay them by card or bank transfer.
  - question: Is there a discount for paying annually, or for NGO clinics?
    answer: >-
      Annual billing is the discount: Professional is {price:usd.professional.annual} per doctor per
      month billed annually against {price:usd.professional.quarterly} billed quarterly, and Premium is
      {price:usd.premium.annual} against {price:usd.premium.quarterly}. NGO and mission clinics get
      [NGO discount or NGO plan price], and the [NGO clinics page](/solutions/ngo-clinics/) covers
      donor reporting.
