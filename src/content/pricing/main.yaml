notes:
  - 'Meta description follows the spec 4.1 row minus "See local prices": the lint counts the raw string, and with price tokens the full spec text is 167 characters (it renders at about 98). "Per doctor per month" is carried by the title.'
  - 'Head keyword: the spec title and H1 do not contain "clinic management software pricing", so the phrase sits in the first sentence of the opening answer. Title and H1 are kept exactly as spec 4.1 sets them.'
  - 'planCta uses "Start with {plan}", which the cards render as the spec labels "Start with Professional" and "Start with Premium". There is no free trial (spec 12), so the button goes to the demo form.'
  - 'Closing secondary CTA links to /pricing/india/ for now. Switch it to "See the product in 6 minutes" when the six-minute tour has a URL (spec 12, The tour; same note as home.yaml). /tour/ is not in the spec site tree and would fail the post-build link check.'
  - 'Pricing unit conflict on the live site: /best-clinic-management-software-kenya/ says "per user and per location", /emr-software-in-india/ says "per clinic per month". This page follows live /pricing/ (per doctor). Fix the other pages.'
  - INR Professional quarterly is 1,899 on the live site and 1,875 on staging (prices/inr.yaml is null). This page does not quote it; the cards show a placeholder until it is set.
  - 'Live /pricing/ FAQ says a beginner becomes an expert "in less than 1 hour", while the four-day breakdown adds up to two hours. This page uses the four-day breakdown (spec 6.4 keep list).'
  - The 12-branch chain example assumes three doctors per branch (36). It is illustrative; change the numbers to a real customer shape if one can be named.
  - 'Free-EMR table: the statements about OpenMRS, OpenEMR and KenyaEMR are general (open source, self-hosted or partner-hosted, KenyaEMR is an OpenMRS distribution). Check them once more before publishing.'
  - 'Support channels on live /pricing/ are phone, email and chat; this page names phone and chat only.'
  - 'Testimonials: consentOnFile is null for both. "Premanand" vs "Premananda" spelling is unresolved (facts.md, section 2); the name also appears in the training step list.'
  - 'Hero media follows the spec 12 row "Currency-localised pricing cards". If the editor prefers a product screen, use the invoice screen (INR with GST lines) instead.'
sections:
  - discriminant: pricingCards
    value:
      id: plans
      heading: Three plans, from one doctor to a chain of branches
      intro: >-
        Pay annually for the lower price, or quarterly if you would rather not pay for a year up front.
        Every price is per doctor, and your receptionist's login costs nothing.
      currency: usd
      switcher: true
      showConditions: true
      planCta:
        label: Start with {plan}
        href: /contact-us/#book-a-demo
      enterpriseCta:
        label: Talk to sales about Enterprise
        href: /contact-us/#book-a-demo
  - discriminant: costExamples
    value:
      id: what-clinics-pay
      heading: What a 5-doctor polyclinic pays
      intro: >-
        Totals at the annual US dollar price, before local taxes, with a one-doctor clinic and a
        12-branch chain on either side for scale. The same plans in rupees are on the
        [India pricing page](/pricing/india/).
      currency: usd
      period: annual
      examples:
        - title: Solo doctor with a receptionist
          doctors: 1
          locations: 1
          plan: professional
          note: >-
            The receptionist uses the included reception login, so this is one licence. Paying
            quarterly instead would make it {price:usd.professional.quarterly} a month.
        - title: Five-doctor polyclinic
          doctors: 5
          locations: 1
          plan: premium
          note: >-
            Five doctors sharing one front desk and one patient record, with specialty templates and
            WhatsApp reminders. The reception login is still included. If you run an in-house pharmacy
            or lab, add it from the modules below.
        - title: Twelve-branch chain
          doctors: 36
          locations: 12
          plan: enterprise
          note: >-
            Three doctors a branch, with pharmacy and claims run centrally. Enterprise is quoted because
            integrations and custom features are scoped chain by chain.
            [Indicative Enterprise price range per doctor per month].
  - discriminant: planMatrix
    value:
      id: compare
      heading: Every feature, plan by plan
      intro: >-
        The bigger modules, pharmacy and lab management among them, come with Enterprise. On
        Professional and Premium you can add them one at a time, and the modules section below shows
        the price.
      open: false
  - discriminant: addOns
    value:
      id: add-ons
      heading: Modules you add when you need them
      intro: >-
        Add a module when the clinic starts needing it, not before. A solo clinic that opens a
        dispensary next year adds pharmacy then, without changing plan.
      currency: usd
  - discriminant: prose
    value:
      id: licences
      heading: What counts as a doctor licence and a location
      body: |
        You pay one licence for each doctor who uses EasyClinic. A clinic with four consultants and one visiting surgeon pays for [how visiting and part-time doctors are counted].

        Your receptionist does not need one. A reception login is included in the price of every plan, and the person at the front desk books appointments and takes payments on it. It cannot open the EMR or issue a prescription. [Number of reception logins included per clinic]. [Licence rule for nurses and pharmacists].

        A location is [what EasyClinic counts as a location, for example a separate address or front desk]. Professional covers one. Premium and Enterprise cover more than one, and the bill is still counted per doctor, with [per-location fee, or confirmation that there is none].
      aside: |
        **In short**

        - Each doctor: one licence.
        - The front desk: included.
        - A second address: Premium or Enterprise.
        - Nurses and pharmacists: [licence rule for nurses and pharmacists].
  - discriminant: stepList
    value:
      id: training
      heading: Four days of training, about two hours in all
      intro: >-
        Training is included in every plan and is run for you and your clinic staff. The sessions are
        short so the clinic keeps seeing patients while everyone learns.
      steps:
        - title: Basic training
          meta: Day 1 · 40 minutes
          body: You and your staff find your way round the screens you will use every day, at the front desk and in the consult room.
        - title: EMR scenario training
          meta: Day 2 · 40 minutes
          body: Your common cases played through the chart, from the history to the prescription the patient takes home.
        - title: Practice exercises
          meta: Day 3 · 20 minutes
          body: Short exercises on the kinds of patients you see, so the steps stick before you use them in a real queue.
        - title: Road to expertise
          meta: Day 4 · 20 minutes
          body: The shortcuts that make the chart fast. Dr Premanand Raya, a pulmonologist, types a full prescription in half a minute with them.
      note: >-
        Data migration is [migration price, or included]. The [switching page](/switch/) sets out what
        we import from paper records or another system, and how long it takes.
  - discriminant: dataTable
    value:
      id: free-or-paid
      heading: Free EMR or paid clinic software
      intro: >-
        Open-source EMRs such as OpenMRS and OpenEMR cost nothing to license, and for some clinics they
        are the right choice. The cost moves to the server and to the person you call when it stops
        working. This is where the money goes on each side.
      caption: A free or open-source EMR compared with EasyClinic
      columns:
        - What you are paying for
        - Free or open-source EMR
        - EasyClinic
      rows:
        - - The software licence
          - Nothing.
          - '{price:usd.professional.annual} per doctor per month on Professional, billed annually.'
        - - Hosting
          - Your own server, or a hosting partner you pay separately.
          - Hosted by EasyClinic and included in the price. Enterprise can have a private cloud on request.
        - - Setup and training
          - You or a local IT partner install and configure it.
          - No setup fee, and four days of training for you and your staff.
        - - Support
          - Community forums, or a paid support contract with a partner.
          - Unlimited support by phone and chat on every plan.
        - - Appointments and billing
          - Varies by project. Check that billing works the way your clinic invoices and gets paid.
          - On every plan, with a reception login at no charge.
        - - WhatsApp reminders
          - A WhatsApp Business API provider, connected by someone technical.
          - Included on Premium and Enterprise, with [per-message WhatsApp charges, if any]. Professional sends SMS and email reminders.
        - - Your data when you leave
          - On your own server, so it stays with you.
          - '[Export format, and how long data is kept after cancelling].'
        - - Who it suits
          - A programme with its own IT team, or one doctor with no staff and no plans to grow.
          - A private clinic that wants the chart and the till on one login, and someone to call.
      note: >-
        KenyaEMR, used in many Kenyan public facilities, is a distribution of OpenMRS. Hosting and
        support costs for any open-source EMR depend on who you hire to run it. The
        [EasyClinic and KenyaEMR comparison](/easyclinic-vs-kenyaemr/) goes through the two side by side.
  - discriminant: testimonialRow
    value:
      id: customers
      heading: Doctors who have used it for years
      intro: Two doctors in India on why they stayed, in their own words.
      items:
        - manish-bhatia
        - premanand-raya
      layout: row
      usePullQuote: false
