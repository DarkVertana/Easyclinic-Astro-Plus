faqHeading: Questions Indian clinic owners ask about cost
faq:
  - question: Do I pay extra for my receptionist's login?
    answer: >-
      No, a licence for your reception is included in the price of every plan. The reception login cannot
      open the EMR or issue prescriptions, so each doctor has their own licence, from
      {price:inr.professional.annual} a month on Professional billed annually.
  - question: Do I have to charge my patients GST on consultations?
    answer: >-
      Usually not, because healthcare services by a clinical establishment or an authorised medical
      practitioner are exempt from GST. Medicines sold over your pharmacy counter and cosmetic procedures
      are taxable, so a clinic with a pharmacy often issues both kinds of bill. Your CA can tell you which
      of your own services are taxable.
  - question: Is it cheaper to pay annually or quarterly?
    answer: >-
      Annual is cheaper, because Premium is {price:inr.premium.annual} per doctor per month billed annually
      against {price:inr.premium.quarterly} billed quarterly, and Professional is
      {price:inr.professional.annual} against {price:inr.professional.quarterly}. Annual billing means paying for twelve months at once, so
      the quarterly plan suits a clinic that wants three months on real patients before committing a year's
      budget. The plan cards at the top of this page show the saving as a percentage.
  - question: Is there a free trial of EasyClinic in India?
    answer: >-
      No, EasyClinic does not offer a free trial, in India or anywhere else. You can book a 20-minute demo
      where we show the system on your own patient flow. If you want to test it on real patients, pay for
      one quarter; there is no contract to break if you stop.
  - question: Why pay for EasyClinic when there are free EMRs?
    answer: >-
      A free EMR costs nothing to license, and the cost moves to the server it runs on and to the person
      you call when the printer will not talk to the system. Every EasyClinic plan includes unlimited training and support, by phone
      as well as email. If you are one doctor with no staff and no plans to grow, a
      free EMR may be enough.
  - question: Is EasyClinic cheaper than Practo Ray or HealthPlix?
    answer: >-
      No, not at list price. Practo Ray's [CM Atom](https://www.practo.com/providers/clinics/ray/plans) is
      ₹999 a month on a one-year term for up to 50 doctors, and [HealthPlix
      Pro](https://www.healthplix.com/pricing-1) is ₹12,000 a year before 18% GST, though HealthPlix does
      not say whether that price is per doctor. EasyClinic Professional is {price:inr.professional.annual}
      per doctor per month billed annually, with a reception login and unlimited support and training
      included. The [EasyClinic vs Practo Ray](/easyclinic-vs-practo/) and [EasyClinic vs
      HealthPlix](/easyclinic-vs-healthplix/) pages set out what each price covers, with the source and the
      date it was checked, so ask each vendor for the yearly total with tax for your doctors and staff
      logins.
  - question: Does EasyClinic work if I later open a second location?
    answer: >-
      Yes, once you move to Premium or Enterprise, because Professional covers one location and Premium is
      the first plan that covers more than one. Enterprise adds central control of every location and stock
      transfers between branches. There is no contract holding you to the plan you started on, so you can move up when the
      second branch opens.
  - question: Am I locked into a contract?
    answer: >-
      No, EasyClinic has no binding contract on any plan, and no setup fee to lose if you stop. You pay a
      year or a quarter at a time, so the shortest commitment is one quarter, at
      {price:inr.professional.quarterly} or {price:inr.premium.quarterly} per doctor per month.

