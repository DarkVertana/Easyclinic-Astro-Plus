faqHeading: Questions Indian clinic owners ask about cost
faq:
  - question: Is GST charged on top of EasyClinic's prices?
    answer: >-
      The prices on this page are [inclusive of or plus 18% GST], and your GST invoice comes from Novel
      Medicare Solutions Pvt Ltd. If your clinic only provides healthcare services, which are exempt from
      GST, you generally cannot claim that GST back as input tax credit, so treat it as a cost. Your CA can
      tell you whether any part of it is claimable for your clinic.
  - question: Do I have to charge my patients GST on consultations?
    answer: >-
      Usually not, because healthcare services by a clinical establishment or an authorised medical
      practitioner are exempt from GST. Medicines sold over your pharmacy counter and cosmetic procedures
      are taxable, so a clinic with a pharmacy often issues both kinds of bill. EasyClinic's GST invoicing,
      with HSN and SAC codes on each line, is [GST invoicing status as of date].
  - question: Can my patients pay by UPI, and can I pay EasyClinic by UPI?
    answer: >-
      Collecting UPI from patients inside EasyClinic, through Razorpay or PayU, is [UPI, Razorpay and PayU
      status as of date]; cash and card payments at the desk are recorded on the bill today. You pay
      EasyClinic's own subscription by [payment methods accepted for the subscription in India].
  - question: Is it cheaper to pay annually or quarterly?
    answer: >-
      Annual is cheaper. Premium is {price:inr.premium.annual} per doctor per month billed annually against
      {price:inr.premium.quarterly} billed quarterly, and Professional is {price:inr.professional.annual}
      against {price:inr.professional.quarterly}. Annual billing means paying for twelve months at once, so
      the quarterly plan suits a clinic that wants three months on real patients before committing a year's
      budget. The plan cards at the top of this page show the saving as a percentage.
  - question: Is there a free trial of EasyClinic in India?
    answer: >-
      No, EasyClinic does not offer a free trial, in India or anywhere else. You can watch the six-minute
      product tour without filling in a form, or book a 20-minute demo where we show the system on your own
      patient flow. If you want to test it on real patients, pay for one quarter; there is no contract to
      break if you stop.
  - question: Is EasyClinic cheaper than Practo Ray or HealthPlix?
    answer: >-
      We do not claim it is, because the answer depends on the quote each vendor gives for your number of
      doctors and staff, and we can only publish our own price. The [EasyClinic vs Practo
      Ray](/easyclinic-vs-practo/) and [EasyClinic vs HealthPlix](/easyclinic-vs-healthplix/) pages set out
      each vendor's pricing model and any price it publishes, with the source and the date it was checked.
      When you compare, ask each vendor for the monthly price per doctor and what extra staff logins cost.
  - question: What does a second branch cost?
    answer: >-
      On Premium, which covers more than one location, you pay per doctor, so a second branch costs
      {price:inr.premium.annual} a month for each doctor who works there, plus [any per-location fee, if one
      applies]. A doctor who works at both branches is [counted once, or once per branch]. Professional
      covers one location, so a second branch means moving to Premium. Central price lists and stock
      transfers between branches come with Enterprise.
  - question: What happens if I cancel, and can I take my data with me?
    answer: >-
      There is no contract, so you can stop at the end of the period you have paid for, and your patient
      records and bills can be exported as [export format on leaving] before you go. [Refund terms for
      unused months on an annual plan]. [Whether the export on leaving is charged]. [How long data is kept
      after you leave, and when it is deleted].

