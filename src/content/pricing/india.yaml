  - discriminant: prose
    value:
      id: gst-and-payment
      heading: GST and how you pay
      body: |-
        **What you pay us.** You pay per doctor, once a year or once a quarter, and paying for the year costs less each month. Your subscription is with Novel Medicare Solutions Pvt Ltd, 30 Circus Avenue, Kolkata, the company that makes EasyClinic.

        **What GST costs you.** Healthcare services by a clinical establishment or an authorised medical practitioner are exempt from GST, so most clinics cannot claim back the GST they pay on software as input tax credit. Budget for it as a cost. If your clinic also sells taxable items, ask your CA whether part of it can be claimed.

        **What your patients pay you.** Billing and payments come with every plan, so what a patient pays at the desk goes on their bill in EasyClinic. Premium adds online payments.

        **GST on your own bills.** Medicines sold over your pharmacy counter and cosmetic procedures are taxable, even though the consultation is not, so a clinic with a pharmacy often issues both kinds of bill.
      aside: >-
        Ask your CA which of your services are taxable. How billing works inside EasyClinic is on the
        [billing page](/features/billing/).
      width: measure

