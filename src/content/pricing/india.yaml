      id: gst-and-payment
      heading: GST invoices and how you pay
      body: |-
        **What you pay us.** Every price on this page is [inclusive of or plus 18% GST], and your invoice comes from Novel Medicare Solutions Pvt Ltd in Kolkata. You pay the subscription by [payment methods accepted for the subscription in India], once a year or once a quarter.

        **What GST costs you.** Consultations and treatment at a clinic are exempt from GST, so most clinics cannot claim back the GST they pay on software as input tax credit. Budget for it as a cost. If your clinic also sells taxable items, ask your CA whether part of it can be claimed.

        **What your patients pay you.** Cash and card payments at the desk go on the bill today. Collecting UPI inside EasyClinic, through Razorpay or PayU, is [UPI, Razorpay and PayU status as of date].

        **GST on your own bills.** Medicines sold over your pharmacy counter and cosmetic procedures are taxable, even though the consultation is not. EasyClinic's GST invoicing, with HSN and SAC codes on each line, is [GST invoicing status as of date]. The full India compliance table, ABDM included, is on the [India page](/clinic-management-software-india/).

        **Handing the month to your CA.** Export to Tally is [Tally export status and format]. [Whether a GST sales register can be exported for filing].
      aside: >-
        Ask your CA which of your services are taxable. How bills and GST invoices work inside EasyClinic is
