notes:
  - Head keyword "clinic software cost in India" is owned here (spec 4.5 rule 4, cost intent). Spec 4.1 lists "clinic software cost India" as a secondary keyword of /pricing/; drop it there so the two pages do not compete.
  - prices/inr.yaml has asOf null, so every price token renders as unconfirmed until the founders sign the INR prices (spec 5.12). Professional quarterly is null because the live site says 1,899 and staging 1,875; the annual-vs-quarterly FAQ uses the token and fills itself once the price is set.
  - prices/inr.yaml taxNote and paymentMethods are null. Fill them, then replace every "[inclusive of or plus 18% GST]" and "[payment methods accepted for the subscription in India]" placeholder with the same wording.
  - UPI, Razorpay and PayU states are null in countries/in.yaml; the GST regulator (in-gst) state is null. The hero strip renders the GST chip from data; prose only uses placeholders.
  - The three cost-example shapes (1 doctor; 5 doctors; 9 doctors across 3 branches) are illustrative clinic shapes, not customers. Totals are computed by the component from prices/inr.yaml.
  - The GST exemption statements (healthcare services by a clinical establishment exempt; pharmacy counter sales and cosmetic procedures taxable; input tax credit generally unavailable for exempt supplies) are general Indian tax law. Have the company's CA read the GST section and the two GST FAQs before publishing.
  - The free-trial FAQ refers to the six-minute product tour (spec 1.2, 12). It must be live before this page is published. When the tour has a URL, make "See the product in 6 minutes" the secondary hero CTA in place of the phone call.
  - No heroMedia. The spec 12 "currency-localised pricing cards" screen duplicates the live cards on this page; add a hero screenshot only if design wants one (the INR invoice with GST lines is the other candidate, once GST invoicing has a status).
  - Testimonials sanjay-teotia and nrp-chandra-balaji have city null and consentOnFile null. The "ten years" heading repeats their own words; confirm the tenure is still accurate as of publication.
  - Needs a named author (India country lead or product lead) per spec 2.7, and the editor's two-question pass (spec 6.5).
  - Secondary keyword "price per doctor per month India" was removed because /pricing/ owns "price per doctor per month" (spec 4.1). The meta description uses one price token because the length rule counts the raw token text (154 raw, 129 rendered).
  - The integrations row follows plans.yaml (included on Enterprise, an add-on on Professional and Premium). The FAQ on leaving no longer points to /privacy/india/ for data retention, since that page's content is not written; the retention rule is a placeholder until it is.
