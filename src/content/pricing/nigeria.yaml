        **VAT on the subscription.** [Whether NGN plan prices include VAT, or VAT is added to EasyClinic's invoice, and at what rate]. Ask your accountant whether your clinic can recover any VAT on the subscription.

        **What your patients pay you.** Billing and payments come with every plan, so your bills to patients are in naira, and a payment at the desk by card or bank transfer goes on the patient's bill, where the balance shows what is still owed. Premium adds online payments. Whether online payments go through Paystack or Flutterwave: [Paystack and Flutterwave status in EasyClinic, as of date]. When an HMO covers the visit, the claims add-on, which Enterprise includes, prepares the HMO claim from the visit with its capitation or fee-for-service detail. Which HMOs' claim packs and encounter forms EasyClinic produces today: [HMO claim pack status in EasyClinic, as of date].

        **VAT on your own bills.** [How Nigerian VAT applies to a clinic's own bills, for consultations, medicines and cosmetic procedures, from the company's Nigerian tax adviser].
