faqHeading: Questions Nigerian clinic owners ask about cost
faq:
  - question: How much does EasyClinic cost in Nigeria?
    answer: >-
      EasyClinic costs {price:ngn.professional.annual} per doctor per month on Professional and
      {price:ngn.premium.annual} on Premium, priced in naira and billed annually, and Enterprise, for
      clinic chains and hospital OPDs, is priced on a quote. A reception login is included on every plan and there is
      no setup fee.
  - question: Is VAT included in the price?
    answer: >-
      [Whether NGN plan prices include VAT, or VAT is added to EasyClinic's invoice, and at what rate].
      Whether your clinic can recover any VAT on the subscription depends on how your own services are
      taxed, so ask your accountant before you budget for it.
  - question: Can I pay the subscription by bank transfer in naira?
    answer: >-
      [How Nigerian clinics pay the subscription, for example bank transfer in naira or card]. Your
      patients' payments are a separate matter: your bills to patients are in naira, and a payment by
      card or bank transfer is recorded against the patient's bill. Premium adds online payments.
  - question: Is it cheaper to pay annually or quarterly?
    answer: >-
      Annual is cheaper, because Premium is {price:ngn.premium.annual} per doctor per month billed
      annually against {price:ngn.premium.quarterly} billed quarterly, and Professional is
      {price:ngn.professional.annual} against {price:ngn.professional.quarterly}. Annual billing means
      paying for twelve months at once, so the quarterly plan suits a clinic that wants three months on
      real patients before committing a year's budget.
  - question: Are HMO claims included on the Professional plan?
    answer: >-
      No, HMO claims are an add-on on Professional and Premium, and Enterprise includes them. The add-on
      prepares HMO claims with capitation and fee-for-service detail from each visit, and reconciles what
      each HMO pays. Which HMOs' claim packs and encounter forms it produces today: [HMO claim pack
      status in EasyClinic, as of date].
  - question: Do I need to budget for a server or a backup internet line?
    answer: >-
      You do not need a server, because EasyClinic runs in the cloud, but you should budget for a backup
      internet connection, because EasyClinic does not run fully offline today. A second connection on a
      different network from your main line, such as a mobile data router, keeps the front desk working
      when the main line drops.
  - question: What happens to my plan if I open a second branch?
    answer: >-
      You move to Premium or Enterprise, because Professional covers one location and Premium is the
      first plan that covers more than one, at {price:ngn.premium.annual} per doctor per month billed
      annually. Enterprise adds central control of every branch and stock transfers between them. There
      is no contract holding you to the plan you started on, so you can move up when the second branch
      opens.
  - question: Am I locked into any contracts?
    answer: >-
      No, EasyClinic has no binding contract on any plan, and no setup fee to lose if you stop. You pay a
      year or a quarter at a time, so the shortest commitment is one quarter, at
      {price:ngn.professional.quarterly} or {price:ngn.premium.quarterly} per doctor per month. There is
      no free trial; a 20-minute demo shows you EasyClinic on a clinic set up like yours first.

