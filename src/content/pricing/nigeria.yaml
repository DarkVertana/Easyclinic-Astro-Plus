  - discriminant: dataTable
    value:
      id: included
      heading: What the price includes and what costs extra
      intro: >-
        You pay for each doctor who writes notes or prescriptions in the EMR. This table shows what that
        price covers and what you pay for separately.
      caption: What is included in the per-doctor price in Nigeria, and what is charged separately
      columns:
        - Item
        - Included or extra
        - What to know
      rows:
        - - Reception login
          - Included on every plan
          - A licence for your reception comes with the price. Reception cannot open the EMR or write prescriptions.
        - - Locum doctors
          - '[How a locum doctor who covers some shifts is charged]'
          - If locum doctors cover shifts at your clinic or hospital and write notes or prescriptions, this decides how many licences you count.
        - - Other staff logins, such as a nurse or pharmacist
          - Included on every plan
          - Staff logins are part of Professional, and every higher plan includes everything in Professional.
        - - Setup
          - No fee
          - No setup fee on any plan, and no contract to sign.
        - - Training and support
          - Included on every plan
          - The four-day training path further down this page, and unlimited support after it.
        - - Payments at the desk
          - Included on every plan
          - Billing and payments are part of Professional, so your bills to patients are in naira, and a payment by card or bank transfer is recorded against the patient's bill and the balance shows what is still owed.
        - - Online payments
          - Included on Premium and Enterprise
          - '[Whether online payments go through Paystack or Flutterwave in EasyClinic, as of date].'
        - - Customisation options in the software
          - No extra charge
          - Hundreds of customisation options, at no charge. Your own clinical forms and print layouts are part of Premium.
        - - SMS and email reminders
          - Included on every plan
          - Part of Professional, so a one-doctor clinic has them too. WhatsApp reminders need Premium.
        - - WhatsApp reminders and messages
          - Included on Premium and Enterprise
          - How the reminders work is on the [WhatsApp page](/features/whatsapp/).
        - - Pharmacy and lab modules
          - Included on Enterprise
          - Add-ons on Professional and Premium, described in the next section.
        - - HMO claims
          - Included on Enterprise
          - An add-on on Professional and Premium. It prepares HMO claims with capitation and fee-for-service detail from each visit, and reconciles what each HMO pays.
        - - Integrations and custom development
          - Included on Enterprise
          - An add-on on Professional and Premium, scoped per project, for example a connection to your lab machines or an existing HIS.

