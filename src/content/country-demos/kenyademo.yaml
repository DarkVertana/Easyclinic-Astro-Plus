faqHeading: Questions before you book
faq:
  - question: How long is the demo?
    answer: >-
      The demo takes 20 minutes and follows one patient from the booking and the prescription to the
      M-Pesa payment and the SLADE claim. If insurance claims or the pharmacy matter most to your clinic,
      say so when we call and the demo spends its time there.
  - question: Will the demo follow my own clinic's patient flow?
    answer: >-
      Yes, the demo is set up for your practice type and number of locations, so it follows the kind of
      patient day your clinic has, but it runs on a demo clinic with illustrative names and none of your
      real patient records. Your data comes across only after you decide to go ahead, during migration.
  - question: Do I need to install anything?
    answer: >-
      No, EasyClinic is cloud software that runs in a web browser, so there is nothing to install for the
      demo or for daily use, and upgrades arrive every month. It needs an internet connection and does
      not run fully offline today.
  - question: Can my receptionist join the demo?
    answer: >-
      Yes, and it helps, because your receptionist is the person who books patients and takes M-Pesa
      payments all day. Every plan includes a reception login at no extra cost; reception staff can book
      and bill but cannot open the EMR or write prescriptions.
  - question: Is there a free trial?
    answer: >-
      No, EasyClinic does not offer a free trial, so the 20-minute demo is where you see the product on a
      clinic set up like yours. If you go ahead, there is no binding contract and no setup fee: you use
      EasyClinic for as long as you are happy with it.
  - question: What happens after I submit the form?
    answer: >-
      We call you on the number you gave, to fix a time for the demo and ask how your clinic runs, so the
      demo follows your patient flow. If you would rather not wait, call {contact:ke.phone} or write to
      {contact:ke.email}.
  - question: Which insurers can I send claims to?
    answer: >-
      Claims to Jubilee, AAR, CIC, Britam and Resolution go through SLADE, the insurer e-claims platform,
      from the same bill your front desk raised. Insurance claims come with the Enterprise plan, or as an
      add-on on Professional and Premium.
  - question: Can patients pay by M-Pesa?
    answer: >-
      Yes, patients can pay by M-Pesa at the desk, and the payment is recorded against their bill beside
      any claim sent to the insurer, so the balance shows what is still owed.
