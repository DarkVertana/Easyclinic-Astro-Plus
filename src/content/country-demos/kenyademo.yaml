sections:
  - discriminant: demoForm
    value:
      id: book-a-demo
      heading: Book a 20-minute demo
      country: ke
      promise: |-
        In 20 minutes we take one patient through a clinic set up like yours: the booking, the consult and a prescription in English and Swahili, the M-Pesa payment at the desk and the claim to the insurer through SLADE. Before the demo we ask how your clinic runs, so it follows your patient flow and your practice type.

        You leave knowing which plan fits your clinic and how soon it could be live, in as little as {fact:goLiveDays} days.
  - discriminant: painBlocks
    value:
      heading: What EasyClinic fixes first
      intro: If your clinic runs on a paper register and the receptionist's phone, these will sound familiar.
      items:
        - heading: Your clinic works. But it is exhausting you.
          body: >-
            The register is a paper book at reception, and the M-Pesa messages land on the receptionist's
            own phone. The notes get finished after the last patient has gone, and when a patient asks for
            last year's lab result, someone spends the morning looking for it.
          fix: >-
            One system, and everyone on it, from reception to the doctor, the pharmacy and the lab. The note
            and the prescription are done before the patient leaves the room, so the day ends with the
            medicine done instead of the paperwork.
        - heading: You are providing services you are not being paid for.
          body: >-
            The dressing done at the end of a busy afternoon never reaches the bill. Then an insurer sends
            a claim back because nobody checked the patient's cover at registration.
          fix: >-
            Every order in the chart lands on the bill, so the dressing is charged before the patient
            reaches the desk. Cover is checked at registration and the claim goes to the insurer through
            SLADE from the same bill, so the losses become visible, and then they stop.
        - heading: The bigger you grow, the less you can see.
          body: >-
            With one clinic you can see everything from the consulting room. Open a second branch across
            Nairobi or a pharmacy counter next door, and you hear about Tuesday's takings in a phone call on
            Wednesday.
          fix: >-
            One clinic or fifteen, you see every branch from one login, down to the day's takings and the
            claims still waiting on an insurer. Decisions come from the numbers instead of a feeling.
  - discriminant: moduleGrid
    value:
      heading: Eight modules on one patient record
      intro: >-
        Every module works on the same record, so the prescription reaches the pharmacy and the bill without
        anyone typing it twice. Appointments, records, billing, reports and Cura AI note drafting come with
        every plan. Lab reports in the chart and WhatsApp messages start on Premium. Pharmacy and insurance
        claims come with Enterprise or as add-ons, and so does lab management, which covers ordering tests
        from the chart.
      columns: 4
      items:
        - title: Appointments
          outcome: Walk-ins and booked patients on one list, with reminders by SMS, or on WhatsApp from Premium.
          icon: calendar-clock
          href: /features/appointment-scheduling/
        - title: Medical records
          outcome: A bilingual prescription in English and Swahili in under 30 seconds, on the same record as every past visit.
          icon: notebook-pen
          href: /features/emr/
        - title: Billing and payments
          outcome: Orders from the consult land on the bill, and the patient pays by M-Pesa or cash at the desk.
          icon: receipt
          href: /features/billing/
        - title: Insurance and claims
          outcome: Claims to Jubilee, AAR, CIC, Britam and Resolution go through SLADE from the same bill.
          icon: file-check
          href: /features/insurance-claims/
        - title: Inventory and pharmacy
          outcome: Dispense from the prescription on screen, with batch and expiry tracked as medicines leave the counter.
          icon: pill
          href: /features/pharmacy-and-inventory/
        - title: Lab reports
          outcome: On Premium, lab reports come back into the patient's record; with lab management, tests are ordered from the chart.
          icon: flask-conical
          href: /features/lab/
        - title: MOH reports and dashboards
          outcome: MOH 705 and DHIS2 reports come from the visits already recorded, with no month-end tally of the register.
          icon: clipboard-list
          href: /features/reports-and-dashboards/
        - title: AI and automation
          outcome: Cura AI listens to the consult and drafts the note for you to sign, on every plan. CuraPilot, which is not part of any plan, adds clinical decision support during the consult.
          icon: sparkles
          href: /ai/
          links:
            - label: Cura AI note drafting
              href: /ai/
            - label: CuraPilot decision support
              href: /curapilot/
  - discriminant: dataTable
    value:
      heading: Built for how a Kenyan clinic gets paid
      intro: >-
        At a Kenyan clinic much of the money arrives by M-Pesa or from an insurer, and the month ends with
        the MOH 705 report. This is what EasyClinic does with each, as the demo shows it.
      caption: How EasyClinic handles M-Pesa, insurer claims, WhatsApp reminders and Ministry of Health reports for a clinic in Kenya
      columns:
        - At your clinic
        - What EasyClinic does
      rows:
        - - M-Pesa at the desk
          - The patient pays by M-Pesa at reception and the payment is recorded against their bill, so the balance shows what is still owed.
        - - Insurer claims through SLADE
          - Claims for patients covered by Jubilee, AAR, CIC, Britam and Resolution go to the insurer through SLADE, from the same bill the desk raised.
        - - WhatsApp reminders
          - Appointment reminders and follow-up messages reach the patient on WhatsApp, sent from the clinic software instead of a receptionist's own phone.
        - - MOH 705 and DHIS2 reports
          - The monthly MOH 705 outpatient summary and the DHIS2 figures come from the visits already recorded, instead of a tally of the paper register.
      note: >-
        Insurance claims come with the Enterprise plan or as an add-on on Professional and Premium, and
        WhatsApp messages start on Premium. The [pricing page](/pricing/) lists what each plan includes.
  - discriminant: testimonialRow
    value:
      heading: Penda Health in Nairobi, on EasyClinic since 2017
      items:
        - robert-korom-reliability
      layout: single
  - discriminant: stepList
    value:
      heading: From demo to live in as little as {fact:goLiveDays} days
      steps:
        - title: Live demo
          meta: 20 minutes
          body: >-
            One patient through a clinic set up like yours, from the booking and the prescription to the
            M-Pesa payment and the SLADE claim. You leave knowing which plan fits your clinic.
        - title: Staff training
          meta: '{fact:trainingDays} sessions, about two hours in all'
          body: >-
            Most clinics are fully operational within 24 hours of the first session. Training runs over
            {fact:trainingDays} days for you and your staff: basic training on day 1 (40 minutes), EMR
            scenarios on day 2 (40 minutes), practice exercises on day 3 (20 minutes) and the road to
            expertise on day 4 (20 minutes).
        - title: Data migration
          body: >-
            We move your patient list into EasyClinic, so a returning patient is found by name at the desk.
            If your clinic writes on paper, give us 2 hours, or 10 patient records, and we promise to make
            your prescription writing faster.
        - title: Support
          meta: Unlimited, on every plan
          body: >-
            Support and training are included in every plan at no extra charge. You reach support by phone,
            email, chat or the written guides in the [help centre](https://help.easyclinic.io/), and Premium
            and Enterprise clinics also get a named account manager.
      note: >-
        {fact:goLiveDays} days is the fastest time from demo to live, and not every clinic moves that
        fast.
