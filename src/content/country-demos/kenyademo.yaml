editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The M-Pesa payment sitting on the same bill as a SLADE claim to Jubilee or AAR, the prescription in
    English and Swahili, the MOH 705 report built from recorded visits instead of a month-end tally of the
    register, and Penda Health's chief medical officer on nine years of unplanned downtime measured in
    hours are specific to a clinic in Kenya.
  readsMachineWritten: >-
    The eight module outcomes share one length and rhythm and may read as templated to a doctor; the page
    cannot name the Kenya contact the live page's voice relies on or give a KES price; it says nothing
    about SHA or eTIMS, which a Kenyan clinic owner will ask about first; and the three timings side by
    side (operational within 24 hours of training, live in 3 days at the fastest, training over 4 days)
    may read as stitched together rather than lived.
notes:
  - >-
    Structure follows the live /kenyademo/ page (spec 5.13 country demo pages, spec 6 intro): H1, demo
    form, three problems, eight modules, Kenya connections and insurers, local testimonial, demo to live.
    The URL is the live, ranking /kenyademo/ and is kept. The spec's "local compliance" block is left out
    (see the SHA and eTIMS note).
  - >-
    Demo length conflict: the live /kenyademo/ page and its meta offer a 30-minute demo ("30 minutes. No
    commitment."); the rebuild, /indiademo/, /contact-us/, the home page and the DemoForm submit button say
    20 minutes. This page uses 20 throughout. Confirm with the Kenya team which length they run.
  - >-
    The Kenya contact's name is not cleared to publish (countries/ke.yaml contact.publishName is null), so
    no person is named anywhere on the page, including the notes. The hero ContactCard and the DemoForm
    aside fall back to "Or call us directly" with {contact:ke.phone}. Note that {contact:ke.email} renders
    an address built from the contact's first name (the hero ContactCard shows the same address); decide
    whether a role address should replace it. Restore the spec 6 "Or call [name] directly" line once
    publishName is true.
  - >-
    SHA and eTIMS left out entirely: the live /kenyademo/ lists both as integrations and says "eTIMS
    compliant", while the live Kenya FAQ says "Not yet" and the comparison table says "Soon"
    (migration/research/facts.md section 7), and regulators/ke-sha.yaml and ke-etims.yaml have state null.
    No integration row, no status sentence, no regulatorStrip, regulatorTable or heroStrip.regulators.
    SMART e-claiming and the "DHA Certified" and "Kenya Registered" badges are also not carried over. Add
    a Kenya compliance block with state and date once confirmed.
  - >-
    Kenya connections named as the live demo page states them, with no status column: M-Pesa, SLADE to
    the five insurers, WhatsApp, and MOH 705 and DHIS2 reports. countries/ke.yaml M-Pesa state is null,
    so the page does not say whether it uses Daraja, a Till or a Paybill number, or whether reconciliation
    is automatic. Insurer count conflict: /kenyademo/ names five through SLADE, its modules card names
    four, and /emr-software-in-kenya/ says "50+ insurers"; this page names the five.
  - >-
    KES prices are unknown (prices/kes.yaml is null), so the form promise, the step list and the FAQ give
    no price and there is no cost FAQ. Add a "What does EasyClinic cost in Kenya?" FAQ with price tokens
    and a link to /pricing/kenya/ once prices are set (the FAQ is at the countryDemo maximum of 8, so
    replace the free-trial or install question).
  - >-
    goLiveDays (3) is phrased "in as little as 3 days" or as the fastest case, because the live Kenya
    listicle says "2 to 4 week setup". The step list note says only that not every clinic moves that fast:
    no source gives the typical time or says what makes a clinic slower, so the earlier "a clinic group or
    a hospital with years of records takes longer" was cut. "Most clinics fully operational within 24
    hours" is from the live /kenyademo/ training step; this page anchors it to the first training session
    so it does not contradict the 3-day go-live and the four-day training path from the live /pricing/
    FAQ. The Kenya team should confirm that reading and that both figures still hold.
  - >-
    Data migration step: the migration time, what is imported beyond the patient list, whether it happens
    before go-live, whether a paper register is typed in, and whether migration is included in the price
    are unknown, so the step states only that the patient list is moved (the one confirmed migration fact,
    as on /switch/). Support step gives the channels from the live
    /pricing/ FAQ only; whether the Kenya number handles support is unknown, so it is not given as a
    support line.
  - >-
    Process claims for the Kenya team to confirm: the call back on the number given, questions about the
    clinic before the demo, and the demo spending its time on claims or pharmacy when asked. The earlier
    "two or three questions" had no source and was cut. The
    no-free-trial answer follows /indiademo/ and the live site (no trial is offered anywhere); change it
    if a trial or the six-minute tour launches.
  - >-
    countries/ke.yaml contact.whatsapp is null, so the page's WhatsApp button routes to the India number in
