faqHeading: Questions before you book
faq:
  - question: How long is the demo?
    answer: >-
      The demo takes 20 minutes and follows one patient from the booking and the insurance check at the
      front desk to the prescription and the claim. If claims or the pharmacy matter most to your clinic,
      say so when we call and the demo spends its time there.
  - question: Can my receptionist join the demo?
    answer: >-
      Yes, and it helps, because your receptionist is the person who checks the insurance card and takes
      the patient's share at the desk all day. Every plan includes a reception login at no extra cost;
      reception staff can book and bill but cannot open the EMR or write prescriptions.
  - question: Is there a free trial?
    answer: >-
      No, EasyClinic does not offer a free trial, so the 20-minute demo is where you see the product on a
      clinic set up like yours. If you go ahead, there is no binding contract and no setup fee: you use
      EasyClinic for as long as you are happy with it.
  - question: What does EasyClinic cost after the demo?
    answer: >-
      Professional costs {price:aed.professional.annual} per doctor per month and Premium
      {price:aed.premium.annual}, both billed annually, and Enterprise, for clinic chains and hospital
      OPDs, is priced on a quote. A reception login is included and there is no setup fee. The
      [UAE pricing page](/pricing/uae/) gives the quarterly prices and the VAT treatment.
  - question: Will the demo show NABIDH and eClaimLink?
    answer: >-
      The demo shows EasyClinic as it runs today, and today its status is NABIDH [NABIDH status in
      EasyClinic, as of date], Malaffi [Malaffi status in EasyClinic, as of date], Riayati [Riayati status
      in EasyClinic, as of date] and DHA eClaimLink [DHA eClaimLink status in EasyClinic, as of date]. The
      compliance strip on this page carries the same statuses, and the
      [UAE country page](/clinic-management-software-uae/) explains what each one asks of your clinic.
  - question: I run a clinic in Dubai on another system. What does the DHA ask before I switch?
    answer: >-
      The DHA's
      [guideline for clinics changing their EMR](https://dha.gov.ae/uploads/072024/EMR%20Transition%20Guidline2024727664.pdf)
      asks you to tell the NABIDH team at least a month before the switch, and your visits must reach
      NABIDH from the new system as soon as possible after it. The same guideline asks you to check that
      the new vendor keeps health data inside the UAE and has a locally registered representative there.
      For EasyClinic, the answers are [where EasyClinic stores UAE clinics' health data, region and
      provider] and [EasyClinic's locally registered representative or partner in the UAE, by name].
  - question: Do I need to install anything?
    answer: >-
      No, EasyClinic is cloud software that runs in a web browser, so there is nothing to install for the
      demo or for daily use. It needs an internet connection and does not run fully offline today.
  - question: What happens after I submit the form?
    answer: >-
      We call you on the number you gave, to fix a time for the demo and ask how your clinic runs, so the
      demo follows your patient flow. If you would rather not wait, call {contact:ae.phone} or write to
      {contact:ae.email}.
