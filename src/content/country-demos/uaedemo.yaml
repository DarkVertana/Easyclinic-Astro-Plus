editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The Dubai clinic that needs a NABIDH-ready EMR before the DHA activates its licence and must give the
    NABIDH team a month's notice before it switches, and the Abu Dhabi branch that shares its visits with
    Malaffi and sends its claims through Shafafiya, are specific to a clinic in the UAE.
  readsMachineWritten: >-
    Most of what a UAE clinic owner checks first is still a bracket, from the AED price and the named
    contact to every regulator status and the hosting answer, and the eight module outcomes share one
    length and rhythm that may read as templated to a doctor.
notes:
  - >-
    STATUS AND STRUCTURE. Draft, and it cannot publish until the facts below are supplied. Structure
    follows the live /kenyademo/ page per spec 5.13 (country demo pages) and 7.4 CountryDemoPage: H1, demo
    form with "Or call [name] directly", three problems, eight modules, UAE connections and insurers
    (dataTable), UAE compliance (regulatorStrip), proof, demo to live. https://www.easyclinic.io/uaedemo/
    returned 404 on 2026-09-26, so this is a new URL with no live copy or ranking to keep. The
    page-writing rules forbid regulatorStrip on a page meant to publish while statuses are unknown: keep it
    only once every ae row has a state and a date, otherwise remove it before publishing.
  - >-
    ADVERSARIAL REVIEW, 2026-09-26. (1) Cannibalisation (spec 4.5 rule 4: country page = product and
    compliance intent, demo page = conversion; the regulator explainer is written once on the country
    page): the regulatorTable with an emirate-by-emirate explainer became a regulatorStrip with a
    two-sentence intro linking to /clinic-management-software-uae/, and the FAQs on NABIDH, Malaffi and
    Riayati, on eClaimLink, on hosting in the UAE and on Arabic, which repeated the country page's FAQ
    almost word for word, were replaced by demo questions (receptionist, free trial, what the demo shows,
    switching in Dubai). The cost FAQ now gives the annual prices and sends VAT and quarterly prices to
    /pricing/uae/. (2) Invented capability cut: "claims are checked for the prior authorisation before
    they leave" (problem 2 fix) is not in plans.yaml or on any live page; the fix now uses the claims
    add-on's own terms (payer price lists, coverage checks at registration, reconciliation) and the
    prior-authorisation check is a placeholder. "so the losses become visible, and then they stop" was cut
    with it as an unmeasured outcome. (3) Free trial: the spec 1.2 decision of 23 September 2026 is no free
    trial, so the bracket became the same answer as /indiademo/ and /kenyademo/. (4) The demo form promise
    no longer repeats "Or call {contact:ae.name} directly: {contact:ae.phone}": the hero ContactCard
    already renders that line (as a placeholder until ae.yaml is filled) and the DemoForm aside prints its
    own once contact.phone is set, so the promise line would have shown the call line twice and blocked
    publishing on the name alone. (5) Unverified general-knowledge statements cut: "health insurance is
    mandatory in Dubai and Abu Dhabi" (dataTable intro) and "the DHA licenses most clinics in Dubai". (6)
    Eyebrow "Made for clinics in the UAE" became "EasyClinic demo in the UAE": nothing public shows the
    product was built for the UAE. (7) Meta description rewritten to drop a group of three.
  - >-
    OWNER: FOUNDERS (prices). prices/aed.yaml plans, addons, taxNote, paymentMethods and asOf are null.
    The {price:aed...} tokens in the demo form promise and FAQ 4 render placeholders now and show the AED
    prices with no edit here once aed.yaml is filled; VAT and quarterly prices are left to /pricing/uae/.
    The live https://www.easyclinic.io/emr-software-in-uae/ says "See for yourself - try Easy Clinic
    absolutely free - no strings attached"; this page follows the 23 September decision (no free trial),
    so that line must come off the live UAE page at launch.
  - >-
    OWNER: UAE COUNTRY LEAD OR SALES (contact and process). countries/ae.yaml contact is null throughout
    (name, publishName, role, phone, whatsapp, email, hours, callbackWindow), and office is null. The hero
    ContactCard renders "Or call [United Arab Emirates contact name] directly: [United Arab Emirates
    contact phone]" from that file, and the DemoForm aside adds its own call line once contact.phone is
    set. FAQ 8 and the closing band use {contact:ae.phone} and {contact:ae.email}. A name renders only with
    publishName true. If no UAE number exists at launch, switch those tokens to {contact:in.phone} and
    {contact:in.email} and say it is the India number (the live UAE page gives only "Contact support at
    hello@easyclinic.io"). The WhatsApp button routes to the India number in site.yaml, with a UAE
    prefilled message, until contact.whatsapp is set. Process claims carried over from /kenyademo/ and
    /indiademo/ for the UAE team to confirm: the call back on the number given, the questions about the
    clinic before the demo, and the demo spending its time on claims or pharmacy when asked; also in which
    hours (Gulf Standard Time is 90 minutes behind Kolkata). Placeholders: whether training runs online or
    at the clinic and at what time in UAE hours (step 2); UAE support number and hours (step 4).
  - >-
    OWNER: PRODUCT AND COMPLIANCE (regulator status). Every regulators/ae-*.yaml state and asOf is null
    (ae-nabidh, ae-malaffi, ae-adhics, ae-riayati, ae-eclaims, ae-pdpl). The regulatorStrip renders a
    placeholder chip for each. The same facts are bracketed in FAQ 5 (NABIDH, Malaffi, Riayati,
    eClaimLink), the dataTable Dubai and Abu Dhabi claim rows and the step list note: fill the data files
    first, then replace each bracket with the same state and date. Also needed: EasyClinic's Shafafiya
    status for Abu Dhabi claims; how long EasyClinic takes to connect a Dubai clinic to NABIDH; where UAE
    clinics' health data is stored (FAQ 6; the DHA EMR transition guideline 5.4 and 5.5 ask a Dubai clinic
    to check the vendor stores health data in the UAE with a DESC-approved cloud provider); EasyClinic's
    locally registered representative or partner in the UAE (FAQ 6; guideline 5.6). Not carried over from
    the live UAE page: "Regulations: DHA and DOH compliance with strict data governance" and
    "compliance-ready EMR Systems", which state a status with no state, date or certificate.
  - >-
    DATA FILE ERRORS FOUND (owner of src/data/regulators; not edited here). ae-riayati.yaml gives body
    "Emirates Health Services" and link https://www.ehs.gov.ae/, but Riayati, the National Unified Medical
    Record, is a Ministry of Health and Prevention platform (https://mohap.gov.ae/en/riayati, served from
    riayati.mohap.gov.ae; MOHAP launched it with the DoH, EHS and DHA as partners): change body to
    "Ministry of Health and Prevention" and link to https://mohap.gov.ae/en/riayati. ae-adhics.yaml calls
    ADHICS a standard "for healthcare systems"; the DoH describes the Abu Dhabi Healthcare Information and
    Cyber Security Standard as applying to public and private healthcare facilities, mandatory for new and
    renewed licences and a prerequisite for joining Malaffi
    (https://www.doh.gov.ae/en/news/department-of-health-launches-abu-dhabi-healthcare-information-and-cyber-security).
    This page shows only the regulator names and chips, so neither error renders here; the country page's
    regulatorTable renders both.
  - >-
    OWNER: PRODUCT (integrations and features). Bracketed on the page: whether EasyClinic checks for a
    prior authorisation before a claim goes out (problem 2); the UAE insurers and TPAs clinics send claims
    to today (countries/ae.yaml insurers is empty); UAE card terminals or payment gateways, with status and
    date (payments is empty); UAE VAT tax invoices showing the clinic's TRN (taxInvoicing is null); Arabic
    on the printed prescription (module 2; ae.yaml languages lists English and Arabic as the country's
    languages, which does not say the product prints Arabic); which UAE systems migration imports from,
    how long it takes and whether it is included in the price (step 3).
  - >-
    OWNER: MARKETING OR CUSTOMER SUCCESS (proof). countries/ae.yaml clients is empty and no UAE
    testimonial exists; every testimonial in src/data/testimonials is placed on another page, and the six
    quotes on the live UAE page are from Nairobi, Malaysia, Zimbabwe and India. The proof block is the
    Capterra {fact:capterraRating} and Google {fact:googleRating} badges, said plainly to be overall
    ratings, with a bracketed request for a UAE quote (name, role, clinic, emirate, consent on file);
    replace the badges with that testimonial when one is recruited. Review counts (facts capterraReviews
    and googleReviews) are null and left out. heroStrip is omitted so the same two ratings do not appear
    twice on the page.
  - >-
    PUBLIC FACTS USED, from https://www.easyclinic.io/emr-software-in-uae/ (re-read 2026-09-26). The
    emirates the page addresses ("across Dubai, Abu Dhabi, Sharjah, and the wider Emirates"), in the meta
    and problem 3. Branches across emirates on one login ("Clinics with branches in Dubai, Abu Dhabi,
    Sharjah, and other Emirates can manage all operations through one central EMR software dashboard"), in
    the problem 3 fix. "30-Second Prescriptions", in module 2 (also "under 30 seconds" on the live
    /kenyademo/). Medicine stock with expiry monitoring ("Clinics can manage medicine stock, monitor
    expiries, and receive alerts"), in module 5 with plans.yaml. WhatsApp reminders are from plans.yaml
    (Premium), not from the UAE page, which says only "integrated communication tools". Not used: "Best EMR
    Software in UAE 2026", "reduces no-shows" (unmeasured), "Clinics Trust Us. The Industry Awards Us." (no
    award named), the Dubai Marina clinic and Abu Dhabi hospital group lines (illustrative, not clients),
    and the free-trial and compliance lines noted above.
  - >-
    REGULATOR SOURCES, checked 2026-09-26 (the page describes each rule, never EasyClinic's status). DHA
    Manual for Licensing Health Facility, DHA/HRS/HLD/MA-1 issue 1.1, 20 November 2024, 7.2.4 and
    7.2.6.10: activating a facility licence needs evidence of an EMR that meets the NABIDH Minimum Data Set
    and connectivity requirements, and the approval email for tested NABIDH connectivity
    (https://www.dha.gov.ae/uploads/122024/Manual%20for%20Licesning%20Health%20Facility-202420241233143.pdf).
    DHA Guideline for Electronic Medical Record Transition in Healthcare Facilities, HISHD/GD-03, effective
    25 September 2024, 15.1 to 15.4 (tell the NABIDH team at least one month before changing EMR;
    re-integrate as early as possible after), 5.4 to 5.6 (vendor stores health data in the UAE under
    Federal Law No. 2 of 2019; DESC-approved cloud; locally registered representative)
    (https://dha.gov.ae/uploads/072024/EMR%20Transition%20Guidline2024727664.pdf). DoH Policy on the Abu
    Dhabi Health Information Exchange: all healthcare facilities, defined as DoH-licensed establishments
    including clinics, participate in the exchange (Malaffi) in line with ADHICS
    (https://www.doh.gov.ae/-/media/A78104416DF2440E89AC90FB75F11055.ashx; Malaffi operator ADHDS, per
    https://malaffi.ae/). Shafafiya: the DoH data exchange system whose validation rules accept or reject
    Prior Request and Claim Submission transactions
    (https://www.doh.gov.ae/en/Shafafiya/notices/dose-frequency-and-rxinstruction-in-pbm-prior-authorisations-and-claims).
    eClaimLink: the DHA e-claims platform (https://eclaimlink.ae/). Riayati: see the data file note.
  - >-
    EDITORIAL. Demo length is 20 minutes, matching /kenyademo/ and /indiademo/ in the rebuild and the
    DemoForm button (the live Kenya page says 30). goLiveDays (3) is from the live /kenyademo/ and is
    always phrased as the fastest case, because the live Kenya listicle says "2 to 4 week setup"; the step
    list note now says why a Dubai clinic may be slower (NABIDH evidence for licence activation, a month's
    notice when switching). The training step follows the live /pricing/ FAQ. CuraPilot's plan
    availability is not in plans.yaml, so module 8 names decision support without a plan. Links: links.hub,
    the secondary CTA and the related links point to /clinic-management-software-uae/ and /pricing/uae/
    (drafts), /best-clinic-management-software-uae/ (listed in countries/ae.yaml, not yet written),
    /switch/ (published) and /trust/ (draft); production hides unpublished targets. FAQ 6 links to the DHA
    guideline PDF directly; replace it with the DHA page that lists the guideline if the PDF URL changes.
    No heroMedia or module media until the spec 12 screenshots exist; a UAE claim or invoice screen should
    wait for the eClaimLink and VAT statuses. The editorial pass is an AI review: a human editor, ideally
    someone who has sold to UAE clinics, must read the page aloud (spec 6.5), rewrite or cut anything in
    readsMachineWritten, and update editorialPass.
sections:
  - discriminant: demoForm
    value:
      id: book-a-demo
      heading: Book a 20-minute demo
      country: ae
      promise: |-
        In 20 minutes we take one patient through a clinic set up like yours, from the booking and the insurance check at the front desk to the prescription and the claim built from the bill. Before the demo we ask how your clinic runs, so it follows your patient flow and your practice type.

        You leave knowing which plan fits your clinic and what it costs in UAE dirhams, from {price:aed.professional.annual} per doctor per month.
  - discriminant: painBlocks
    value:
      heading: What EasyClinic fixes first
      intro: If your front desk lives between the insurer's portal and the receptionist's phone, these will sound familiar.
      items:
        - heading: Your clinic works. But it is exhausting you.
          body: >-
            Reception checks the patient's insurance card on the insurer's portal in one tab, then types the
            same details again when the claim goes out. The notes get finished after the last patient has
            gone, and when a patient asks for last year's lab result, someone spends the morning looking
            for it.
          fix: >-
            One system with everyone on it, from the front desk and the doctor to the pharmacy and the lab.
            The patient's details are entered once at registration and carried onto the bill and the claim,
            and the note and the prescription are done before the patient leaves the room.
        - heading: You are providing services you are not being paid for.
          body: >-
            The dressing done at the end of a busy evening never reaches the bill. Then an insurer rejects a
            claim because the prior authorisation was missing, or pays it at a lower rate than the price the
            front desk quoted.
          fix: >-
            Every order in the chart lands on the bill, so the dressing is charged before the patient
            reaches the desk. Each insurer's price list and the patient's cover are checked at registration,
            and reconciliation shows what each insurer paid against what you billed. [Whether EasyClinic
            checks for a prior authorisation before a claim goes out, with status and date].
        - heading: The bigger you grow, the less you can see.
          body: >-
            With one clinic in Dubai you can see everything from the consulting room. Open a second branch in
            Abu Dhabi and it answers to the Department of Health and shares its records with Malaffi, and
            you hear about Tuesday's takings in a phone call on Wednesday.
          fix: >-
            One clinic or fifteen, in one emirate or several, you see every branch from one login, down to
            the day's takings and the claims still waiting on an insurer. Decisions come from the numbers
            instead of a feeling.
  - discriminant: moduleGrid
    value:
      heading: Eight modules on one patient record
      intro: >-
        Every module works on the same record, so the prescription reaches the pharmacy and the bill without
        anyone typing it twice. Appointments, records, billing, reports and Cura AI come with every plan;
        lab reports and WhatsApp messages start on Premium, and pharmacy and insurance claims come with
        Enterprise or as add-ons.
      columns: 4
      items:
        - title: Appointments
          outcome: Walk-ins and booked patients on one list, with reminders by SMS, or on WhatsApp from Premium.
          icon: calendar-clock
          href: /features/appointment-scheduling/
        - title: Medical records
          outcome: A prescription in under 30 seconds, on the same record as every past visit. [Whether the prescription can print in Arabic as well as English]
          icon: notebook-pen
          href: /features/emr/
        - title: Billing and payments
          outcome: Orders from the consult land on the bill, and the day-end close shows the takings by payment mode.
          icon: receipt
          href: /features/billing/
        - title: Insurance and claims
          outcome: Claims built from the same bill the front desk raised, with the insurer's price list and the patient's cover checked at registration.
          icon: file-check
          href: /features/insurance-claims/
        - title: Inventory and pharmacy
          outcome: Dispense from the prescription on screen, with batch and expiry tracked as medicines leave the counter.
          icon: pill
          href: /features/pharmacy-and-inventory/
        - title: Lab reports
          outcome: Order tests from the chart, and the results come back into the patient's record.
          icon: flask-conical
          href: /features/lab/
        - title: Reports and dashboards
          outcome: Takings by doctor and by branch, no-shows, stock and the claims still waiting on an insurer, in one morning view.
          icon: layout-dashboard
          href: /features/reports-and-dashboards/
        - title: AI and automation
          outcome: Dictate the note and Cura AI drafts it for you to sign, with clinical decision support during the consult.
          icon: sparkles
          href: /ai/
          links:
            - label: Cura AI note drafting
              href: /ai/
            - label: CuraPilot decision support
              href: /curapilot/
  - discriminant: dataTable
    value:
      id: uae-connections
      heading: Built for how a clinic in the UAE gets paid
      intro: >-
        At a private clinic in Dubai or Abu Dhabi much of the money arrives from an insurer, often after a
        prior authorisation, and the rest is the patient's share at the desk. This is what EasyClinic does
        with each.
      caption: How EasyClinic handles insurance claims, payments at the desk, VAT invoices and WhatsApp reminders for a clinic in the UAE
      columns:
        - At your clinic
        - What EasyClinic does
      rows:
        - - Insurance claims in Dubai
          - 'The claim is built from the same bill the front desk raised, with the patient''s cover checked at registration. Sending it to the insurer through DHA eClaimLink: [DHA eClaimLink status in EasyClinic, as of date].'
        - - Insurance claims in Abu Dhabi
          - 'Prior requests and claims go through Shafafiya, the Department of Health''s data exchange system. Sending them from EasyClinic: [Shafafiya status in EasyClinic, as of date].'
        - - Insurers and TPAs
          - '[UAE insurers and TPAs that EasyClinic clinics send claims to today, by name]'
        - - Payments at the desk
          - 'The patient''s share is recorded against the bill, so the balance shows what is still owed. [UAE card terminals or payment gateways connected to EasyClinic, with status and date]'
        - - VAT invoices
          - '[Whether EasyClinic issues UAE VAT tax invoices showing the clinic''s TRN, with status and date]'
        - - WhatsApp reminders
          - Appointment reminders and follow-up messages reach the patient on WhatsApp, sent from the clinic software instead of a receptionist's own phone.
      note: >-
        Insurance claims come with the Enterprise plan or as an add-on on Professional and Premium, and
        WhatsApp messages start on Premium. The [pricing page](/pricing/) lists what each plan includes.
  - discriminant: regulatorStrip
    value:
      id: compliance-in-the-uae
      heading: EasyClinic's status with UAE regulators
      intro: >-
        A clinic the DHA licenses in Dubai shares its patient visits with NABIDH, and one the Department of
        Health licenses in Abu Dhabi shares them with Malaffi. Each chip gives EasyClinic's status and the
        date it was checked, and the [UAE country page](/clinic-management-software-uae/) explains what
        each rule asks of your clinic.
      regulators: [ae-nabidh, ae-malaffi, ae-riayati, ae-adhics, ae-eclaims, ae-pdpl]
      link: /trust/
  - discriminant: proofBlock
    value:
      id: ratings
      heading: How clinics rate EasyClinic
      intro: >-
        These are EasyClinic's overall public ratings, and they are not specific to the UAE. [Quote from a
        UAE clinic owner or doctor, with name, role, clinic and emirate, and consent on file]
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'
  - discriminant: stepList
    value:
      heading: From demo to live in as little as {fact:goLiveDays} days
      steps:
        - title: Live demo
          meta: 20 minutes
          body: >-
            One patient through a clinic set up like yours, from the booking and the insurance check to the
            prescription and the claim. You leave knowing which plan fits your clinic and what it costs in
            UAE dirhams.
        - title: Staff training
          meta: '{fact:trainingDays} sessions, about two hours in all'
          body: >-
            Day 1 is basic training (40 minutes), day 2 is EMR scenarios (40 minutes), day 3 is practice
            exercises (20 minutes) and day 4 is the road to expertise (20 minutes). The sessions are for you
            and your clinic staff, [whether they run online or at the clinic, and at what time in UAE hours].
        - title: Data migration
          body: >-
            We move your existing patient records into EasyClinic before go-live, so the first morning does
            not start from an empty screen. [Which UAE clinic systems EasyClinic imports from, how long it
            takes, and whether migration is included in the price].
        - title: Support
          meta: Unlimited, on every plan
          body: >-
            Support and training are included in every plan at no extra charge. You reach support by phone,
            email or chat, or through the written guides in the [help centre](https://help.easyclinic.io/),
            and Premium and Enterprise clinics also get a named account manager. [UAE support number and
            hours, in Gulf Standard Time].
      note: >-
        {fact:goLiveDays} days is the fastest time from demo to live, and not every clinic moves that fast.
        In Dubai the DHA activates a new clinic's licence only with evidence of an EMR that meets NABIDH's
        standards, and its guideline for a clinic changing EMR asks for a month's notice to the NABIDH team,
        so a Dubai go-live also depends on [how long EasyClinic takes to connect a Dubai clinic to NABIDH,
        with status and date].
