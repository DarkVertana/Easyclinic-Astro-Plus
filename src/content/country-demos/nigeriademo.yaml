faqHeading: Questions before you book
faq:
  - question: How long is the demo?
    answer: >-
      The demo takes 20 minutes and follows one patient from the booking and the prescription to the
      invoice in naira and the HMO claim. If HMO claims or the pharmacy matter most to your clinic, say so
      when we call and the demo spends its time there. [Whether the demo runs on a video call only, or
      also in person in Lagos or Abuja].
  - question: Can my receptionist join the demo?
    answer: >-
      Yes, and it helps, because your receptionist is the person who books the patients and takes the
      card and bank transfer payments all day. Every plan includes a reception login at no extra cost;
      reception staff can book and bill but cannot open the EMR or write prescriptions.
  - question: Do I need to install anything?
    answer: >-
      No, EasyClinic is cloud software that runs in a web browser, so there is nothing to install: your
      clinic needs a browser and an internet connection. It does not run fully offline today, and what a
      power cut or a dropped line does in the middle of a consult is on the [Nigeria
      page](/hospital-management-software-nigeria/#power-internet-whatsapp).
  - question: What will EasyClinic cost after the demo?
    answer: >-
      Professional costs {price:ngn.professional.annual} per doctor per month billed annually, and every
      plan includes a reception login. The [Nigeria pricing page](/pricing/nigeria/) lists each plan in
      naira, billed annually or quarterly, with the add-ons.
  - question: Which HMOs can I send claims to?
    answer: >-
      [HMOs whose claim forms are set up for Nigerian clinics today, with the date]. Each HMO is set up
      once with its plans and price list, and the claim is built from the visit and the bill with its
      capitation or fee-for-service detail, so what the HMO pays can be set against what you claimed.
      [How a claim reaches each HMO, for example a portal upload, an email or a printed claim pack]. HMO
      claims come with the Enterprise plan, or as an add-on on Professional and Premium.
  - question: Can patients pay by card or bank transfer?
    answer: >-
      Yes, the invoice is in naira and a card or bank transfer payment is recorded against the patient's
      bill, so the balance shows what is still owed. Online payments start on Premium, and the Paystack
      and Flutterwave rows in the payments table on this page give the status of each gateway.
  - question: Is there a free trial?
    answer: >-
      [Whether clinics in Nigeria can try EasyClinic free before paying, and for how long]. The demo
      itself costs nothing, and if you go ahead there is no binding contract and no setup fee, so you use
      EasyClinic for as long as you are happy with it.
  - question: What happens after I submit the form?
    answer: >-
      [The team that calls Nigerian clinics, whether a Nigerian contact, a partner or the India team]
      calls you on the number you gave, within [call-back window in West Africa Time], to fix a time for
      the demo and ask how your clinic runs. If you would rather not wait, call {contact:ng.phone} or
      write to {contact:ng.email}; clinics in Nigeria can also call or WhatsApp the India number,
      {contact:in.phone}.
