editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The rupee prices per doctor per month, the TPA claim sent back because the pre-authorisation was not
    attached, the receipt book that disagrees with the UPI statement by a few hundred rupees and the
    dressing done at the end of a crowded OPD that never reaches the bill are specific to a clinic in
    India, and the proof is an Indian psychiatrist who keeps patient records on EasyClinic.
  readsMachineWritten: >-
    The eight module outcomes share one length and rhythm and the connections table lists plan features
    rather than Indian payment rails, so both may read as templated to a doctor, and the page has no named
    India contact or measured clinic outcome, which the live Kenya page's voice relies on.
