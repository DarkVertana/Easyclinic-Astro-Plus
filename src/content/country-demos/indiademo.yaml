notes:
  - >-
    Structure follows the live /kenyademo/ page (spec 5.13 and 6): demo form, three problems, eight
    modules, integrations and payers, compliance, local testimonial, demo to live. Kenya-specific facts
    (M-Pesa, SLADE, eTIMS, MOH 705, Walter) are not carried over.
  - >-
    "Or call [name] directly" is rendered by the DemoForm and the hero ContactCard from countries/in.yaml.
    contact.name, publishName, hours and callbackWindow are null there, so both show "Or call us
    directly" with +91 91477 70277 until the India contact is confirmed.
  - >-
    Kenya's live page says a 30-minute demo; the rebuild and the confirmation page say 20 minutes. This
    page uses 20. The page does not say whether the demo is a video call or in person, because
    /contact-us/ offers both and the in-person cities are still a placeholder there.
  - >-
    goLiveDays (3) has no asOf in facts.yaml and conflicts with the "2 to 4 week setup" on the live Kenya
    listicle. Confirm before publishing; the opening answer, meta, step list and FAQ all depend on it.
  - >-
    INR Professional quarterly is null in prices/inr.yaml (1,899 live vs 1,875 staging), so the cost FAQ
    quotes both annual prices and Premium quarterly only.
  - >-
    GST invoicing (in-gst) and UPI (countries/in.yaml payments) have null states, so the prose describes
    no GST or UPI capability as working: the GST chip, the integrations table and the hero screenshot carry
    them. Restore "with GST on taxable lines" and "UPI in the day-end close" wording once both have a
    state and date, matching /clinic-management-software-india/ and /pricing/india/.
  - >-
    Support step uses [support line and hours in India] because /contact-us/ has not confirmed whether
    existing-customer support shares the sales number (+91 91477 70277).
  - >-
    Module 7 replaces Kenya's "Compliance and reporting" with reports and dashboards, because every India
    regulator state is null; compliance appears only as status chips (RegulatorStrip), never in prose.
  - >-
    The free-trial FAQ mentions the six-minute tour (spec 12, phase 1). Add a link once the tour page
    exists. FAQ 1 (say so when we call and the demo spends its time on claims or pharmacy) and FAQ 8 (two or
    three questions on the call, as on /contact-us/) are process claims for the India team to confirm.
  - >-
    Dr Prantar Chakrabarti's testimonial has city: null and consentOnFile: null in testimonials data.
    Needs both before publishing. Author needs to be the India country lead or the product lead.
sections:
  - discriminant: demoForm
    value:
      id: book-a-demo
      heading: Book a 20-minute demo
      country: in
      promise: |-
        In 20 minutes we take one patient through a clinic set up like yours: the booking, the consult and prescription, the bill and the WhatsApp follow-up. Before the demo we ask two or three questions about how your clinic runs, so it follows your patient flow and your specialty.

        You leave knowing which plan fits your clinic and what it costs in rupees, from {price:inr.professional.annual} per doctor per month.
  - discriminant: painBlocks
    value:
      heading: What EasyClinic fixes first
      intro: If your clinic runs on a paper register and the receptionist's phone, these will sound familiar.
      items:
        - heading: Your clinic works. But it is exhausting you.
          body: >-
            The register is on paper, appointments sit on the receptionist's personal WhatsApp, the receipt
            book lives in a drawer, and the notes get finished at 9pm after the last patient. When a patient
            asks for last year's report, someone spends the morning looking for it.
          fix: >-
            One system, and everyone on it: reception, doctors, pharmacy and lab. The note and the
            prescription are done before the patient leaves the room, so the evening is yours again.
        - heading: You are giving services you are not paid for.
          body: >-
            The dressing done at the end of a crowded OPD never reaches the bill. The receipt book and the UPI
            statement disagree by a few hundred rupees, and a TPA sends a claim back because the
            pre-authorisation was not attached.
          fix: >-
            Every order in the chart lands on the bill, so the dressing is charged before the patient reaches
            the desk. Claims are checked for the pre-authorisation before they leave, and the money you were
            losing shows up in a report you can act on.
        - heading: The bigger you grow, the less you can see.
          body: >-
            With one clinic you can see everything from the doctor's chair. Add a pharmacy counter or a
            branch across town, and you hear about Tuesday from a phone call on Wednesday.
          fix: >-
            One clinic or fifteen, you get the same morning view: revenue by doctor, collections against
            billing, stock and pending claims. Decisions come from the numbers instead of a feeling.
  - discriminant: moduleGrid
    value:
      heading: Eight modules on one patient record
      intro: >-
        Every module shares the same record, so the prescription reaches the pharmacy and the bill without
        anyone typing it twice. Appointments, records, billing, reports and Cura AI come with every plan.
        Pharmacy and TPA claims come with Enterprise or as add-ons, and lab reports start on Premium; the
        [India pricing page](/pricing/india/) has the full list.
      columns: 4
      items:
        - title: Appointments
          outcome: Walk-ins and booked slots on one calendar, with SMS reminders, or WhatsApp reminders on Premium.
          icon: calendar-clock
          href: /features/appointment-scheduling/
        - title: Records and prescriptions
          outcome: Notes and prescriptions on one record, with a prescription done in about thirty seconds and printed or sent on WhatsApp.
          icon: notebook-pen
          href: /features/emr/
        - title: Billing and payments
          outcome: Orders from the chart land on the bill, part payments included, and the day-end close shows the takings by payment mode.
          icon: receipt
          href: /features/billing/
        - title: Insurance and TPA claims
          outcome: Payer price lists and coverage checked at registration, so the TPA claim leaves with the pre-authorisation attached.
          icon: file-check
          href: /features/insurance-claims/
        - title: Pharmacy and inventory
          outcome: Dispense straight from the prescription and see batch and expiry before a strip leaves the counter.
          icon: pill
          href: /features/pharmacy-and-inventory/
        - title: Lab reports
          outcome: Order tests from the chart; results come back into the record and go to the patient on WhatsApp.
          icon: flask-conical
          href: /features/lab/
        - title: Reports and dashboards
          outcome: Revenue by doctor, collections against billing, no-shows and pending claims in one morning view.
          icon: layout-dashboard
          href: /features/reports-and-dashboards/
        - title: Cura AI
          outcome: Drafts the consult note while you see the patient; you review it and sign.
          icon: sparkles
          href: /ai/
  - discriminant: dataTable
    value:
      heading: Integrations and payers in India
      caption: Payment, accounting, messaging and payer connections for clinics in India
      columns:
        - Connection
        - What it does at your clinic
        - Status
      rows:
        - - UPI
          - Payments recorded against the bill and counted in the day-end close
          - '[UPI status as of date]'
        - - Razorpay
          - Payment links sent to the patient, on the Premium plan
          - '[Razorpay status as of date]'
        - - PayU
          - The same payment links, for clinics that already have a PayU account
          - '[PayU status as of date]'
        - - Tally
          - The day's invoices and receipts exported for your accountant
          - '[Tally export status as of date]'
        - - WhatsApp
          - Reminders and messages to patients, prescriptions and reports included, on the Premium plan
          - '[WhatsApp status as of date]'
        - - TPAs and insurers
          - 'Claim packs with the pre-authorisation attached, reconciled when the payment arrives. [TPAs and insurers EasyClinic submits claims to]'
          - '[TPA and insurer connection status as of date]'
      note: >-
        Each status carries the date it was last checked. Every connection in every country is listed on
        the [integrations page](/integrations/).
  - discriminant: regulatorStrip
    value:
      heading: Compliance in India
      intro: >-
        Each chip shows the current status and the date it was last checked, and opens the trust page with
        the detail. What each rule asks of your clinic, from Health Facility Registry sign-up to a DPDP
        privacy notice, is explained on the [India page](/clinic-management-software-india/).
      regulators:
        - in-abdm-m1
        - in-abdm-m2
        - in-dpdp
        - in-gst
      link: /trust/
  - discriminant: testimonialRow
    value:
      heading: A haematologist on EasyClinic since 2008
      items:
        - prantar-chakrabarti
      layout: single
  - discriminant: stepList
    value:
      heading: From demo to live in as little as {fact:goLiveDays} days
      steps:
        - title: Live demo
          meta: 20 minutes
          body: >-
            One patient through a clinic set up like yours. You leave knowing which plan fits and what it
            costs in rupees.
        - title: Staff training
          meta: '{fact:trainingDays} sessions, about two hours in all'
          body: >-
            Day 1 is basic training (40 minutes), day 2 is EMR scenarios (40 minutes), day 3 is practice
            exercises (20 minutes) and day 4 is the road to expertise (20 minutes). The sessions are for you
            and your clinic staff.
        - title: Data migration
          meta: '[migration time for a typical clinic]'
          body: >-
            We bring your patient list and history across from your current software or spreadsheets, so
            the first morning does not start from an empty screen. [What is imported from each source, and
            whether migration is included in the plan price]
        - title: Support
          meta: Unlimited, on every plan
          body: >-
            Support and training are included in every plan at no extra charge, on [support line and hours
            in India]. Premium and Enterprise clinics also get a named account manager, and the
            [help centre](https://help.easyclinic.io/) has written guides for the common questions.
      note: >-
        {fact:goLiveDays} days is the fastest time from demo to live. A clinic group or a hospital OPD with
        years of records to move takes longer: [typical go-live time for clinic groups and hospital OPDs].
