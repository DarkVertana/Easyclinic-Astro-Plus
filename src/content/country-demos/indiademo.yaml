faqHeading: Questions before you book
faq:
  - question: How long is the demo?
    answer: >-
      The demo takes 20 minutes and follows one patient from the booking to the WhatsApp follow-up. If
      TPA claims or the pharmacy matter most to your clinic, say so when we call and the demo spends its
      time there.
  - question: Will the demo use my own clinic's data?
    answer: >-
      No, the demo runs on a demo clinic set up to look like yours, with your specialty and your kind of
      patient day, but none of your real patient records. Your data comes across only after you decide
      to go ahead, during migration.
  - question: Do I need to install anything?
    answer: >-
      No, EasyClinic runs in a web browser, so there is nothing to install for the demo or for daily use.
      It needs an internet connection and does not run fully offline today. On the Enterprise plan, a
      clinic can ask for private cloud hosting.
  - question: What does EasyClinic cost after the demo?
    answer: >-
      Professional costs {price:inr.professional.annual} per doctor per month billed annually, or
      {price:inr.professional.quarterly} billed quarterly. Premium costs {price:inr.premium.annual} per
      doctor per month billed annually, or {price:inr.premium.quarterly} billed quarterly, and
      Enterprise, for clinic chains and hospital OPDs, is priced on a quote. There is no setup fee and a
      reception login is included. The demo itself costs nothing.
  - question: How long does it take to go live after the demo?
    answer: >-
      A clinic can go live in as little as {fact:goLiveDays} days after the demo, with training over
      {fact:trainingDays} days in sessions of 20 to 40 minutes. That is the fastest case, and not every
      clinic moves that fast.
  - question: Can my receptionist join the demo?
    answer: >-
      Yes, and it helps, because your receptionist is the person who books and bills all day. Every plan
      includes a reception login at no extra cost; reception staff can book and bill but cannot open the
      EMR or write prescriptions.
  - question: Is there a free trial?
    answer: >-
      No, EasyClinic does not offer a free trial, so the 20-minute demo is where you see the product on a
      clinic set up like yours. If you go ahead, there is no binding contract and no setup fee: you use
      EasyClinic for as long as you are happy with it.
  - question: What happens after I submit the form?
    answer: >-
      Someone from our team in India calls you on the number you gave, to fix a time for the demo and ask
      how your clinic runs. If you would rather not wait, call
      {contact:in.phone} or write to {contact:in.email}.
