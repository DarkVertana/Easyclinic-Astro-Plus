sections:
  - discriminant: demoForm
    value:
      id: book-a-demo
      heading: Book a 20-minute demo
      country: in
      promise: |-
        In 20 minutes we take one patient through a clinic set up like yours: the booking, the consult and prescription, the bill and the WhatsApp follow-up. Before the demo we ask how your clinic runs, so it follows your patient flow and your specialty.

        You leave knowing which plan fits your clinic and what it costs in rupees, from {price:inr.professional.annual} per doctor per month.
  - discriminant: painBlocks
    value:
      heading: What EasyClinic fixes first
      intro: If your clinic runs on a paper register and the receptionist's phone, these will sound familiar.
      items:
        - heading: Your clinic works. But it is exhausting you.
          body: >-
            The register is on paper, appointments sit on the receptionist's personal WhatsApp, the receipt
            book lives in a drawer, and the notes get finished at 9pm after the last patient. When a patient
            asks for last year's report, someone spends the morning looking for it.
          fix: >-
            One system, and everyone on it: reception, doctors, pharmacy and lab. The note and the
            prescription are done before the patient leaves the room, so the evening is yours again.
        - heading: You are giving services you are not paid for.
          body: >-
            The dressing done at the end of a crowded OPD never reaches the bill. The receipt book and the UPI
            statement disagree by a few hundred rupees, and a TPA sends a claim back because the
            pre-authorisation was not attached.
          fix: >-
            Every order in the chart lands on the bill, so the dressing is charged before the patient reaches
            the desk. Claims are checked for the pre-authorisation before they leave, and the money you were
            losing shows up in a report you can act on.
        - heading: The bigger you grow, the less you can see.
          body: >-
            With one clinic you can see everything from the doctor's chair. Add a pharmacy counter or a
            branch across town, and you hear about Tuesday from a phone call on Wednesday.
          fix: >-
            One clinic or fifteen, you get the same morning view, with revenue, stock, claims and follow-ups
            on one screen. Decisions come from the numbers instead of a feeling.
  - discriminant: moduleGrid
    value:
      heading: Eight modules on one patient record
      intro: >-
        Every module shares the same record, so the prescription reaches the pharmacy and the bill without
        anyone typing it twice. Appointments, records, billing, reports and Cura AI note drafting come with
        every plan. Pharmacy and TPA claims come with Enterprise or as add-ons. Lab reports in the chart
        start on Premium, and lab management comes with Enterprise or as an add-on; the
        [India pricing page](/pricing/india/) has the full list.
      columns: 4
      items:
        - title: Appointments
          outcome: Walk-ins and booked slots on one calendar, with SMS reminders, or WhatsApp reminders on Premium.
          icon: calendar-clock
          href: /features/appointment-scheduling/
          media:
            kind: screenshot
            src: ../../assets/images/screens/scheduling-day-visits-walk-in.png
            alt: Day visits list with a walk-in and booked patients
            caption: Walk-ins and booked patients on one list.
            frame: none
            origin: old-site
            capturedOn: '2024-01'
        - title: Records and prescriptions
          outcome: Notes and prescriptions on one record, with a prescription done in about thirty seconds and printed, or sent on WhatsApp on Premium.
          icon: notebook-pen
          href: /features/emr/
        - title: Billing and payments
          outcome: Orders from the chart land on the bill, part payments included, and the day-end close shows the takings by payment mode.
          icon: receipt
          href: /features/billing/
          media:
            kind: screenshot
            src: ../../assets/images/screens/invoice-part-payment-balance.png
            alt: Invoice balance after a part payment
            caption: A part payment and the balance due.
            frame: none
            origin: old-site
            capturedOn: '2024-01'
        - title: Insurance and TPA claims
          outcome: Payer price lists and coverage checked at registration, so the TPA claim leaves with the pre-authorisation attached.
          icon: file-check
          href: /features/insurance-claims/
        - title: Pharmacy and inventory
          outcome: Dispense straight from the prescription and see batch and expiry before a strip leaves the counter.
          icon: pill
          href: /features/pharmacy-and-inventory/
        - title: Lab reports
          outcome: On Premium, lab reports come back into the patient's record and go to the patient on WhatsApp; with lab management, tests are ordered from the chart.
          icon: flask-conical
          href: /features/lab/
        - title: Reports and dashboards
          outcome: Revenue and the status of every claim, for one branch or all of them, in one morning view.
          icon: layout-dashboard
          href: /features/reports-and-dashboards/
        - title: Cura AI
          outcome: Drafts the consult note while you see the patient; you review it and sign.
          icon: sparkles
          href: /ai/
  - discriminant: dataTable
    value:
      heading: Connections and claims, by plan
      caption: Messaging, payment, claims and integration options on each EasyClinic plan in India
      columns:
        - Connection
        - What it does at your clinic
        - Plans
      rows:
        - - SMS and email reminders
          - Appointment reminders sent to the patient's phone and inbox
          - Every plan
        - - WhatsApp reminders and messages
          - Reminders and messages sent to patients on WhatsApp
          - Premium and Enterprise
        - - Online payments
          - Patients pay the clinic's bill online
          - Premium and Enterprise
        - - Insurance and TPA claims
          - Payer price lists and coverage checks at registration, then claim packs and reconciliation when the payment arrives
          - Enterprise, or an add-on on Professional and Premium
        - - Integrations and custom development
          - Your lab machines or accounting software connected to EasyClinic, scoped per project
          - Enterprise, or an add-on on Professional and Premium
      note: >-
        The [India pricing page](/pricing/india/) lists what each plan includes.
  - discriminant: testimonialRow
    value:
      heading: A psychiatrist in India on EasyClinic
      items:
        - srinivasa-teja
      layout: single
  - discriminant: logoStrip
    value:
      id: client-logos
      heading: Clinics and hospitals in India that have used EasyClinic
      country: in
  - discriminant: stepList
    value:
      heading: From demo to live in as little as {fact:goLiveDays} days
      steps:
        - title: Live demo
          meta: 20 minutes
          body: >-
            One patient through a clinic set up like yours. You leave knowing which plan fits and what it
            costs in rupees.
        - title: Staff training
          meta: '{fact:trainingDays} sessions, about two hours in all'
          body: >-
            Day 1 is basic training (40 minutes), day 2 is EMR scenarios (40 minutes), day 3 is practice
            exercises (20 minutes) and day 4 is the road to expertise (20 minutes). The sessions are for you
            and your clinic staff.
        - title: Data migration
          body: >-
            We move your patient list into EasyClinic, so a returning patient is found by name at the desk
            instead of being registered again. If your clinic is on paper, give us 2 hours, or 10 patient
            records, and we promise to make your prescription writing faster.
        - title: Support
          meta: Unlimited, on every plan
          body: >-
            Support and training are included in every plan at no extra charge. You reach support by phone,
            email or chat, or through the written guides in the [help centre](https://help.easyclinic.io/).
            Premium and Enterprise clinics also get a named account manager.
      note: >-
        Going live in as little as {fact:goLiveDays} days is the fastest case, and not every clinic moves
        that fast.
