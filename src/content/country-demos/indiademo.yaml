faqHeading: Questions before you book
faq:
  - question: How long is the demo?
    answer: >-
      The demo takes 20 minutes and follows one patient from the booking to the WhatsApp follow-up. If
      TPA claims or the pharmacy matter most to your clinic, say so when we call and the demo spends its
      time there.
  - question: Will the demo use my own clinic's data?
    answer: >-
      No, the demo runs on a demo clinic set up to look like yours, with your specialty and your kind of
      patient day, but none of your real patient records. Your data comes across only after you decide
      to go ahead, during migration.
  - question: Do I need to install anything?
    answer: >-
      No, EasyClinic runs in a web browser on a computer or a tablet, so there is nothing to install for
      the demo or for daily use. It needs an internet connection and does not run fully offline today.
      Clinics that want the system on a private server can ask about private cloud hosting on the
      Enterprise plan.
  - question: What does EasyClinic cost after the demo?
    answer: >-
      Professional costs {price:inr.professional.annual} per doctor per month and Premium costs
      {price:inr.premium.annual}, both billed annually; Premium billed quarterly is
      {price:inr.premium.quarterly}. Enterprise, for clinic chains and hospital OPDs, is priced on a
      quote. There is no setup fee and a reception login is included. The prices are [inclusive of or plus
      18% GST], and the demo itself costs nothing.
  - question: How long does it take to go live after the demo?
    answer: >-
      The fastest clinics go live {fact:goLiveDays} days after the demo, and training runs over
      {fact:trainingDays} days in sessions of 20 to 40 minutes. A clinic group or a hospital OPD with
      years of records to move takes longer, typically [typical go-live time for clinic groups and
      hospital OPDs].
  - question: Can my receptionist join the demo?
    answer: >-
      Yes, and it helps, because your receptionist is the person who books and bills all day. Every plan
      includes a reception login at no extra cost; reception staff can book and bill but cannot open the
      EMR or write prescriptions.
  - question: Is there a free trial?
    answer: >-
      No, EasyClinic does not offer a free trial. The six-minute product tour shows the product without
      asking you to fill in a form, and if you go ahead after the demo there is no contract to sign. If
      you later stop, [what happens to unused months on an annual plan], and your records come back to you
      as [data export format on leaving].
  - question: What happens after I submit the form?
    answer: >-
      [India contact name] calls you on the number you gave, within [call-back window for India], to fix
      a time for the demo and ask two or three questions about how your clinic runs. We use your details
      only to arrange the demo, and if you would rather not wait, call {contact:in.phone}.
