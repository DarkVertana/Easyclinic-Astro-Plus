          outcome: Recall campaigns tell patients when their review is due, and the owner checks the morning numbers for every branch on one screen.
          links:
            - label: Patient engagement
              href: /features/patient-engagement/
            - label: Reports and dashboards
              href: /features/reports-and-dashboards/
            - label: Multi-location
              href: /features/multi-location/

  - discriminant: proofBlock
    value:
      id: study
      eyebrow: The Penda Health study
      heading: What changed when clinicians had AI inside the record
      variant: study
      figures:
        - visits
        - diagnostic-errors
        - treatment-errors
        - history-errors
      body: |
        In 2025, Penda Health and OpenAI studied {fig:visits} patient visits at 15 Penda clinics in Nairobi. Penda's clinicians work in EasyClinic, and AI Consult, an AI copilot embedded in that record, checked their work as they went. Independent physicians rated the visits, and visits where the clinician had the copilot scored better on each of the error measures above.

        The results are published as a preprint on arXiv, not in a journal. The [CuraPilot page](/curapilot/) sets out how the study was run and what it did not measure.
      link:
        label: Read how the study was run
        href: /curapilot/

