faqHeading: You Have Questions, We Have Answers
faq:
  - question: What is clinic management software?
    answer: >-
      Clinic management software, also called practice management software, is the system a clinic runs its
      day on: appointments, patient records and prescriptions, billing and, in bigger clinics, pharmacy, lab,
      insurance claims and reports. What sets it apart from a plain EMR is that the front desk and the till
      work on the same record as the chart, so a booking turns into a visit and the visit into an invoice
      without anyone typing the patient in twice.
  - question: Is Easy Clinic an EMR or a full hospital information system?
    answer: >-
      Easy Clinic is clinic management software with a full EMR built in. It runs appointments, the chart,
      billing, pharmacy, lab and reports for clinics, polyclinics, clinic chains, hospital OPDs and nursing
      homes. It is not a full inpatient hospital information system.
  - question: How much does Easy Clinic cost?
    answer: >-
      Easy Clinic is priced per doctor, with three plans: Professional, Premium and Enterprise. Prices vary by
      country and plan. See the current prices for your country on our plans page, or book a demo and we will
      recommend the right plan for your clinic.
  - question: Does Easy Clinic work offline?
    answer: >-
      Easy Clinic is cloud software, so it needs an internet connection. It runs in a web browser, so any
      device with a connection can use it.
  - question: Am I locked into a contract?
    answer: >-
      Your plan terms are set out when you sign up. Ask us in your demo and we will walk you through the
      billing options for your country.
  - question: Do I have to use the AI?
    answer: >-
      No. Cura AI is there to save time, for example by drafting a note for you to check and sign. You can use
      the EMR, billing and every other module without it. The doctor always makes the final decision.
  - question: Can Easy Clinic run more than one clinic location?
    answer: >-
      Yes. Multi-location management lets you run every branch from one system, with central data and
      reports.
  - question: How long does it take to go live?
    answer: >-
      Training takes about two hours, spread over four days. If you are moving from another system, we can
      import your existing records.

