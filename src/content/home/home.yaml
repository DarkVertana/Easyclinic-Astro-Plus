      regulators:
        - in-abdm-m1
        - ke-sha
        - ke-etims
        - ae-nabidh
        - ae-malaffi
        - ng-ndpa
      link: /trust/

faq:
  - question: What is clinic management software?
    answer: >-
      Clinic management software, also called practice management software, is the system a clinic runs its
      day on: appointments, patient records and prescriptions, billing and, in bigger clinics, pharmacy, lab,
      insurance claims and reports. What sets it apart from a plain EMR is that the front desk and the till
      work on the same record as the chart, so a booking turns into a visit and the visit into an invoice
      without anyone typing the patient in twice.
  - question: Is EasyClinic an EMR or a full hospital information system?
    answer: >-
      EasyClinic is AI EMR software with the front desk, billing, pharmacy and lab built around it, not a full
      hospital information system. It covers outpatient clinics, hospital OPDs, day care and nursing homes,
      but it does not run inpatient wards or operating theatres, so a hospital that needs those runs
      EasyClinic in the OPD beside an inpatient system [inpatient systems EasyClinic has connected to, and
      what the two exchange].
  - question: How much does EasyClinic cost?
    answer: >-
      EasyClinic costs {price:usd.professional.annual} per doctor per month on Professional and
      {price:usd.premium.annual} on Premium when billed annually, or {price:usd.professional.quarterly} and
      {price:usd.premium.quarterly} billed quarterly. In India the annual prices are
      {price:inr.professional.annual} and {price:inr.premium.annual}. Enterprise, for clinic chains and
      hospital OPDs, is quoted for your network, and every plan includes the reception login with no setup fee.
      On Professional and Premium, pharmacy, lab management, insurance claims and integrations are add-ons
      [add-on prices per currency].
  - question: Does EasyClinic work offline?
    answer: >-
      Not fully: EasyClinic's cloud version needs an internet connection and does not run fully offline
      today [what keeps working when the connection drops, and what syncs when it returns]. Clinics where
      the connection cannot be trusted can run a self-hosted installation on their own server
      [self-hosted option: plans and cost].
  - question: Who owns the patient data, and what happens to it if we leave?
    answer: >-
      Your clinic owns its patient records, and EasyClinic does not sell them. If you leave, you can export
      your records [export format and what the export includes], and there is no contract to break
      [notice period, refunds and any export fee on leaving].
  - question: Do I have to use the AI?
    answer: >-
      No, the EMR works without Cura AI: you write notes from your own templates and shortcuts, and the
      prescription goes out exactly as it would with the AI switched on. Cura AI (documentation) comes with
      every plan and drafts the note for you to review and sign, so you can try it on a few patients and
      leave it off if it does not suit you [how Cura AI is switched on or off, per doctor or per clinic].
  - question: Can EasyClinic run more than one clinic location?
    answer: >-
      Yes. Premium covers more than one location and Enterprise adds central control and SOP tracking
      across branches; the largest chain on EasyClinic has {fact:largestChain} locations. A second branch
      opened later costs [what a second branch adds to the bill: per doctor, per location or both].
  - question: How long does it take to go live?
    answer: >-
      The fastest clinics go live {fact:goLiveDays} days after the demo, and staff training is
      {fact:trainingDays} short sessions, about two hours in total. A clinic bringing years of records from
      another system takes longer [typical go-live time with data migration].

