notes:
  - 'Title shortened from the spec 4.1 title (62 characters) to 50: "Clinic Management Software for Doctors: EasyClinic".'
  - 'Spec 6.3 and 5.1 copy says "published in Nature Medicine" and "peer-reviewed". The 39,849-visit study is an arXiv preprint (korom-2025 in study.yaml). Every study mention here says "studied" and "preprint". Do not equate AI Consult with CuraPilot until product confirms (study.yaml note).'
  - 'Opening answer drops the 34% denied-claims figure from spec 5.1: it has no public or internal source (study.yaml denied-claims).'
  - 'Switch the secondary CTA (hero and closing) to "See the product in 6 minutes" when the six-minute tour ships (spec 12, The tour; section 11 UX direction 1).'
  - 'Founder block (section 11 item 9: Girish Mohata and the 2003 story, one photo) is left out on purpose. Spec 12 says it does not run until a real photograph of Girish Mohata exists. Add it between the testimonials and the regulator strip when the photo arrives.'
  - 'Live counter (section 11 item 6, "appointments booked on EasyClinic this week") is left out: there is no product data feed yet.'
  - 'Resources teaser (spec 5.1 item 10, ContentCards "Latest guides", three) is left out until the guides are built. Add it after the regulator strip.'
  - 'Section 11 item 5 asks for Dr Korom''s one-line quote in the study block. The Korom testimonials (robert-korom-partner, robert-korom-reliability) are not assigned to this page; decide whether one moves here.'
  - 'All three testimonials (chao-rochek-buragohain, siddhartha-ghosh, hisham-ismail) have city null; section 11 asks for a city on each home quote. Hisham Ismail is Qualitas Health, Malaysia.'
