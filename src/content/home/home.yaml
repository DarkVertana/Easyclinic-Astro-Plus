editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: 'The Penda Health study of 39,849 visits in Nairobi, where Penda has run on Easy Clinic since 2017, and the four-day training path with its minutes, are specific to Easy Clinic, but as a home page for four countries and every clinic size it carries almost nothing specific to one clinic type or one country.'
  readsMachineWritten: 'The definition answer to "What is clinic management software?" and the evenly matched old-way and new-way lists read like SEO copy, and with no screenshots yet the journey steps describe screens a doctor cannot see.'

notes:
  - 'Title shortened from the spec 4.1 title (62 characters) to 50: "Clinic Management Software for Doctors: Easy Clinic".'
  - 'Published 2026-09-26 with confirmed facts only (owner decision). Screenshots removed because none exist yet; restore when captured (briefs in spec 12 and in git history before this pass): hero Today view (14 appointments, two walk-ins, one video consult, one no-show; phone capture too); old-way generated desk image oldway-desk-01.webp (aiGenerated: true, caption says it is not a customer''s clinic); journey steps: patient app booking (phone), payor coverage check at registration, lab order with an abnormal flag, thirty-second prescription with an interaction warning and Hindi print option, INR invoice with GST lines and a part payment, pharmacy dispensing with an expiring batch, WhatsApp reminder thread (phone), owner dashboard with the eight morning numbers.'
  - 'Regulator strip (spec 5.1 item 6; was in-abdm-m1, ke-sha, ke-etims, ae-nabidh, ae-malaffi, ng-ndpa, placed after the training steps, linking to /trust/) and heroStrip.regulators (in-abdm-m1, ke-sha, ae-nabidh, ng-ndpa) removed for publication: every regulator state in src/data/regulators is null. Restore both when each regulator has a state and date. Use the spec heading "Built for your regulator" only if every listed regulator is Live. Spec 5.1 also names NHIA. The country and trust related-link descriptions were reworded so they no longer promise a status.'
  - 'FAQ "Who owns the patient data, and what happens to it if we leave?" (spec 5.1 item 9) was replaced with "Am I locked into a contract?" because data ownership, export format, notice period, refunds and any export fee are not confirmed. Restore it when /trust/ or /privacy/ states the export policy.'
  - 'Facts still missing that would strengthen the FAQ: what a second branch adds to the bill (per doctor, per location or both; the live Kenya listicle says "per user and per location"); add-on prices (null in every currency); which inpatient systems Easy Clinic has run beside and what they exchange; how Cura AI is switched on or off, per doctor or per clinic; typical go-live time with data migration; what keeps working offline and what syncs, and the self-hosted option''s plans and cost.'
  - 'goLiveDays (3) is phrased "in as little as 3 days", the live /kenyademo/ wording; the live Kenya listicle says "2 to 4 week setup" (facts.yaml note). Keep the phrasing if the listicle is rebuilt. The earlier line "moving years of records across from another system takes longer" was cut from the step note and the go-live FAQ: no source says so, and the /kenyademo/ 3-day path lists data migration as one of its steps. Restore it with a number when the typical go-live time with data migration is supplied. The step note now carries the live pricing FAQ pen-and-paper promise ("2 hours / 10 patient records").'
  - 'Offline FAQ uses the live Kenya listicle wording ("does not run fully offline today") and its statement that a self-hosted option exists. It does not claim the self-hosted option works without internet.'
  - 'Spec 6.3 and 5.1 copy says "published in Nature Medicine" and "peer-reviewed". The 39,849-visit study is an arXiv preprint (korom-2025 in study.yaml). Every study mention here says "studied" and "preprint". Do not equate AI Consult with CuraPilot until product confirms (study.yaml note).'
  - 'Opening answer drops the 34% denied-claims figure from spec 5.1: it has no public or internal source (study.yaml denied-claims).'
  - 'H1 now uses the spec 5.1 promise ("the desk, the chart, the till and the pharmacy"), four items, instead of the spec 4.1 group of three.'
  - 'Switch the secondary CTA (hero and closing) to "See the product in 6 minutes" when the six-minute tour ships (spec 12, The tour; section 11 UX direction 1).'
  - 'Founder block (section 11 item 9: Girish Mohata and the 2003 story, one photo) is left out on purpose. Spec 12 says it does not run until a real photograph of Girish Mohata exists. Add it after the testimonials when the photo arrives.'
  - 'Live counter (section 11 item 6, "appointments booked on Easy Clinic this week") is left out: there is no product data feed yet.'
  - 'Resources teaser (spec 5.1 item 10, ContentCards "Latest guides", three) is left out until the guides are built. Add it after the training steps.'
  - 'Section 11 item 5 asks for Dr Korom''s one-line quote in the study block. The Korom testimonials (robert-korom-partner, robert-korom-reliability) are not assigned to this page; decide whether one moves here.'
  - 'All three testimonials (chao-rochek-buragohain, siddhartha-ghosh, hisham-ismail) have city null, so production shows no city; section 11 asks for a city on each home quote. Hisham Ismail is Qualitas Health, Malaysia.'
  - 'Section 11 item 7 asks for the pricing table in local currency. This page shows USD with no switcher; consider a geo-selected currency later.'
  - 'Spec 5.1 item 4 asks for one screenshot per module pillar. Left out so the page does not repeat the eight journey screenshots; add if design wants them.'
  - 'Hero rating strip shows the two ratings without review counts until facts capterraReviews and googleReviews are supplied (spec 2.4 asks for the count).'
  - 'Directory pages (/doctors/, /clinics/) are out of scope and not linked from this page.'
  - 'Meta description opens with the head keyword; 152 characters as written, 142 after token expansion.'
  - 'Fact check 2026-09-26 (live pages fetched with curl): the journey step "Report" said the owner sees revenue, collections, no-shows and pending claims on one dashboard, by doctor or by branch. No live product page or confirmed fact states collections, no-shows or pending claims as report figures, or any per-doctor split (only the /healthcare-dashboard-software/ blog lists no-show rate and revenue per clinician, as generic KPI advice and an anonymous case study). It now says what live /ceo-landing-page/ (end-of-day financial reports "clinic and organization wide") and live /features/ (daily financial reports; "Claim Status Tracking Dashboard") state, matching /features/reports-and-dashboards/. The Growth card line "morning numbers for every branch on one screen" stays: live /kenyademo/ says "One clinic or fifteen ... One screen" and "Every location. One morning view".'
  - 'Audit 2026-09-27: heroStrip.study set to false, as on /ai/ and /kenyademo/. Its line ("AI copilot studied on ... visits") linked to /curapilot/, which with the related link "Easy Clinic''s clinical copilot" implied CuraPilot was the studied tool; the rules forbid that. The opening answer now names AI Consult. Hero.astro''s strip line now reads "AI Consult studied on ... visits in an Easy Clinic record" and links to /curapilot/#study, so a page that turns the strip back on no longer implies CuraPilot was studied.'
  - 'Audit 2026-09-27: study block trimmed to the confirmed facts (the tool studied was AI Consult, embedded in the Easy Clinic record); "checked the clinicians'' work as they went" is not in the page-writing-rules confirmed list, and /ai/ cut it for the same reason. "Independent physicians rated the visits" now reads "a random sample of the visit records": the paper''s panel rated 5,666 of the 39,849 visits (study.yaml scope, verified 2026-09-27).'
  - 'Audit 2026-09-27: pen-and-paper promise changed from "two hours and ten patient records" to "two hours, or ten patient records", matching /switch/, /pricing/india/, /kenyademo/ and /features/emr/. The live source ("2 hours / 10 patient records") is ambiguous; the company should confirm what the slash means.'
  - 'Audit 2026-09-27: the contract FAQ no longer ends "and Easy Clinic never sells or discloses your clinic''s data". The published /privacy/ allows disclosure (section 3(a)) and says your information may not always remain private, /about-us/ dropped "never disclose" for the same reason, and the clause did not answer the lock-in question.'
  - 'Audit 2026-09-27: (1) The NGO persona card no longer says "Visit and stock reports by programme, in the shape donors ask for": whether visits can be tagged by programme or grant is unknown (ngo-clinics.yaml note) and the /solutions/ hub NGO card makes no donor-reporting claim. Restore "by programme" only after product confirms programme tagging. (2) The "Do I have to use the AI?" FAQ no longer says you write notes "from your own templates", which implied templates on every plan; plans.yaml puts specialty templates and your own forms on Premium. It now uses the /features/emr/ shortcuts wording. (3) The /ai/ related-link description no longer says /ai/ gives the plan for each AI feature: /ai/ says only the note drafting is on the published price list.'
