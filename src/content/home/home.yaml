  - 'goLiveDays (3) conflicts with "2 to 4 week setup" on the live Kenya listicle (facts.yaml note). Confirm before publishing the step list note and the go-live FAQ.'
  - 'Offline FAQ follows the live Kenya listicle ("It does not run fully offline today"; a self-hosted option exists). Product to confirm both.'
