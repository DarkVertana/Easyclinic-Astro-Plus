sections:
  - discriminant: personaRouter
    value:
      id: pick-your-clinic
      heading: Pick your clinic
      intro: >-
        EasyClinic has run clinics since {fact:founded}, from one-doctor practices to a chain of
        {fact:largestChain} locations. Pick the one that sounds like yours; each page shows the screens that
        kind of clinic uses most.
      items:
        - persona: solo
          title: I run my own clinic
          body: One doctor and a receptionist, with no IT staff to call. The prescription takes thirty seconds and the notes are done before you go home.
          href: /solutions/solo-clinic/
        - persona: polyclinic
          title: We share one front door
          body: Specialists sharing rooms and a reception desk. Every doctor writes on the same patient record, and roles decide who sees what.
          href: /solutions/polyclinic/
        - persona: chain
          title: We run many branches
          body: One central chart and one set of SOPs across every branch, with branch KPIs side by side so drift shows up early.
          href: /solutions/clinic-chain/
        - persona: hospital-opd
          title: We run a hospital OPD
          body: A token queue that keeps the OPD moving, and claims that start at the prescription rather than at the billing counter.
          href: /solutions/hospital-opd/
        - persona: ngo
          title: We run an NGO or mission clinic
          body: Visit and stock reports by programme, in the shape donors ask for.
          href: /solutions/ngo-clinics/

  - discriminant: oldWayNewWay
    value:
      id: what-it-replaces
      heading: What one screen replaces
      intro: Walk into a busy clinic at six in the evening and you often find the same four things, none of them talking to each other.
      old:
        title: The old way
        items:
          - A paper register at the desk that only the receptionist can read
          - Appointment reminders sent from someone's personal WhatsApp, when they remember
          - Billing in an Excel sheet that never quite matches the cash drawer
          - Three logins for three systems, and every patient typed in twice
        media:
          kind: photo
          needed: 'Old way generated environment image (spec 12, file oldway-desk-01.webp): cluttered clinic reception desk with a paper appointment register, a stack of patient files with handwritten labels, a personal smartphone showing notification badges, a calculator and receipt book, overhead fluorescent light, no readable text.'
          alt: A cluttered clinic reception desk with a paper appointment register, stacked patient files and a phone
          caption: Generated image of a typical reception desk, for illustration. It is not a customer's clinic.
          frame: none
          aiGenerated: true
      next:
        title: The EasyClinic way
        items:
          - One patient list that the desk and the doctor both see, updated as each patient moves through the clinic
          - WhatsApp reminders that the software sends on a schedule, so nobody uses a personal phone
          - Invoices raised from the consult, and a day-end close that matches the drawer
          - One login per person, each seeing only the screens their role needs

  - discriminant: journeyDiagram
    value:
      id: patient-journey
      heading: The patient journey, from booking to the owner's evening report
      intro: Follow one patient through the clinic. Every step writes to the same record, so nobody retypes a name or an amount.
      steps:
        - label: Book
          body: The patient books online or at the desk, and walk-ins join the same list as booked slots.
          href: /features/appointment-scheduling/
          media:
            kind: screenshot
            needed: 'Patient app: booking screen (spec 12, phone capture)'
            alt: The EasyClinic patient app on a phone, showing a booking screen with open slots
            frame: phone
        - label: Arrive
          body: Reception registers the patient once and checks the insurer or TPA plan before the consult, so the claim starts clean.
          href: /features/insurance-claims/
          media:
            kind: screenshot
            needed: 'Payor setup and coverage check at registration: two insurers, one TPA, a coverage validation result (spec 12)'
            alt: The registration screen with the patient's insurer selected and a coverage check result
            frame: browser
        - label: Consult
          body: Past visits and lab results sit on one chart. Order a test from it and the result comes back into the chart, flagged if it is abnormal.
          href: /features/lab/
          media:
            kind: screenshot
            needed: 'Lab order from the chart and result back with a flag: one abnormal value (spec 12)'
            alt: A patient chart with a lab order and a returned result flagged as abnormal
            frame: browser
        - label: Prescribe
          body: A prescription takes about thirty seconds, with a drug-interaction check. Cura AI can draft the note for the doctor to review and sign.
          href: /features/emr/
          media:
            kind: screenshot
            needed: 'Thirty-second prescription: the Rx screen mid-entry with a drug interaction warning, two drugs, one interaction flagged, Hindi print option visible (spec 12)'
            alt: The prescription screen mid-entry, with a drug-interaction warning between two medicines
            frame: browser
        - label: Pay
          body: The invoice builds itself from what was ordered in the consult, with tax applied, and the receipt goes out on WhatsApp.
          href: /features/billing/
          media:
            kind: screenshot
            needed: 'Invoice from an encounter with GST lines and a part payment, in INR (spec 12)'
            alt: An invoice raised from a consult, with GST lines and a part payment recorded
            frame: browser
        - label: Dispense
          body: The pharmacy dispenses from the prescription on screen, with batch and expiry tracked, so stock falls as medicines leave the counter.
          href: /features/pharmacy-and-inventory/
          media:
            kind: screenshot
            needed: 'Pharmacy dispensing from a prescription with batch and expiry, one expiring batch flagged (spec 12)'
            alt: The pharmacy dispensing screen, showing batch numbers and an expiring batch flagged
            frame: browser
        - label: Follow up
          body: The reminder for the next visit and the lab report reach the patient on WhatsApp, sent by the clinic software on a schedule.
          href: /features/whatsapp/
          media:
            kind: screenshot
            needed: 'WhatsApp reminder thread as the patient sees it: reminder, confirmation reply, prescription PDF, report PDF (spec 12, phone capture)'
            alt: A WhatsApp thread on a phone with an appointment reminder, the patient's reply and a report attached
            frame: phone
        - label: Report
          body: At the end of the day the owner sees revenue, collections, no-shows and pending claims on one dashboard, by doctor or by branch.
          href: /features/reports-and-dashboards/
          media:
            kind: screenshot
            needed: 'Owner dashboard: the eight morning numbers (revenue by branch, collections vs billed, no-show rate, patients per doctor per hour, average ticket, stock days, claims pending, feedback score) (spec 12)'
            alt: The owner dashboard with revenue by branch, collections against billed, no-show rate and claims pending
            frame: browser

