  - discriminant: oldWayNewWay
    value:
      id: what-it-replaces
      heading: What one screen replaces
      intro: Walk into a busy clinic at six in the evening and you often find the same four things, none of them talking to each other.
      old:
        title: The old way
        items:
          - A paper register at the desk that only the receptionist can read, so the doctor keeps asking who is next
          - Appointment reminders sent from someone's personal WhatsApp, when they remember to send them at all
          - Billing in an Excel sheet that never quite matches the cash drawer at the end of the day
          - Three logins for three systems, every patient typed in twice
      next:
        title: The Easy Clinic way
        items:
          - One patient list that the desk and the doctor both see, updated as each patient moves through the clinic
          - WhatsApp reminders that the software sends on a schedule, so nobody uses a personal phone
          - Invoices raised from the consult, and a day-end close that matches the drawer
          - One login per person, each seeing only the screens their role needs

  - discriminant: journeyDiagram
    value:
      id: patient-journey
      heading: The patient journey, from booking to the owner's evening report
      intro: Follow one patient through the clinic. Every step writes to the same record, so nobody retypes a name or an amount.
      steps:
        - label: Book
          body: The patient books online or at the desk, and walk-ins join the same list as booked slots, so the queue is one list.
          href: /features/appointment-scheduling/
        - label: Arrive
          body: Reception registers the patient once and checks the insurer or TPA plan first, so the claim starts clean.
          href: /features/insurance-claims/
        - label: Consult
          body: Past visits and lab results sit on one chart. Order a test from it and the result returns there, flagged if abnormal.
          href: /features/lab/
        - label: Prescribe
          body: A prescription takes about thirty seconds, with a drug-interaction check. Cura AI drafts the note for the doctor to sign.
          href: /features/emr/
        - label: Pay
          body: The invoice builds itself from what was ordered in the consult, and the receipt goes out to the patient on WhatsApp.
          href: /features/billing/
        - label: Dispense
          body: The pharmacy dispenses from the prescription on screen, with expiry dates tracked, so stock updates as it goes.
          href: /features/pharmacy-and-inventory/
        - label: Follow up
          body: The next-visit reminder and the lab report reach the patient on WhatsApp, sent by the software on a schedule.
          href: /features/whatsapp/
        - label: Report
          body: At day end the owner reads the financial report for one branch or all of them, and sees where each claim stands.
          href: /features/reports-and-dashboards/

