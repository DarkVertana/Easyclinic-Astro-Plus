editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: 'The Penda Health study of 39,849 visits in Nairobi, where Penda has run on EasyClinic since 2017, and the four-day training path with its minutes, are specific to EasyClinic, but as a home page for four countries and every clinic size it carries almost nothing specific to one clinic type or one country.'
  readsMachineWritten: 'The definition answer to "What is clinic management software?" and the evenly matched old-way and new-way lists read like SEO copy, and with no screenshots yet the journey steps describe screens a doctor cannot see.'

