  - discriminant: stepList
    value:
      id: training
      heading: Switching is a four-day course
      intro: >-
        Training runs over {fact:trainingDays} days, about two hours in all, for you and your clinic staff.
        It is short on purpose, because a busy clinic cannot stop seeing patients to learn software.
      steps:
        - title: Basic training
          meta: Day 1, 40 minutes
          body: Everyone learns the screens their role uses every day, at the desk and in the consulting room.
        - title: EMR scenario training
          meta: Day 2, 40 minutes
          body: Doctors work through the chart and the prescription using the kinds of cases your clinic sees.
        - title: Practice exercises
          meta: Day 3, 20 minutes
          body: Your staff practise on their own, so the first real patient is not the first attempt.
        - title: Road to expertise
          meta: Day 4, 20 minutes
          body: The shortcuts and templates that make a busy afternoon faster, once the basics are routine.
      note: >-
        A clinic can go from demo to live in as little as {fact:goLiveDays} days. If you write prescriptions
        on paper today, give us two hours and ten patient records and we promise to make your prescription
        writing faster.

faq:
  - question: What is clinic management software?
    answer: >-
      Clinic management software, also called practice management software, is the system a clinic runs its
      day on: appointments, patient records and prescriptions, billing and, in bigger clinics, pharmacy, lab,
      insurance claims and reports. What sets it apart from a plain EMR is that the front desk and the till
      work on the same record as the chart, so a booking turns into a visit and the visit into an invoice
      without anyone typing the patient in twice.
  - question: Is EasyClinic an EMR or a full hospital information system?
    answer: >-
      EasyClinic is AI EMR software with the front desk, billing, pharmacy and lab built around it, not a full
      hospital information system. It covers outpatient clinics, hospital OPDs, day care and nursing homes,
      but it does not run inpatient wards or operating theatres, so a hospital that needs those runs
      EasyClinic in the OPD beside a separate inpatient system.
  - question: How much does EasyClinic cost?
    answer: >-
      EasyClinic costs {price:usd.professional.annual} per doctor per month on Professional and
      {price:usd.premium.annual} on Premium when billed annually, or {price:usd.professional.quarterly} and
      {price:usd.premium.quarterly} billed quarterly. In India the annual prices are
      {price:inr.professional.annual} and {price:inr.premium.annual}. Enterprise, for clinic chains and
      hospital OPDs, is quoted for your network, and every plan includes the reception login with no setup fee.
      Pharmacy, lab management, insurance claims and integrations come with Enterprise, and a clinic on
      Professional or Premium can add them to its plan.
  - question: Does EasyClinic work offline?
    answer: >-
      EasyClinic does not run fully offline today, because the cloud version needs an internet connection.
      EasyClinic also offers a self-hosted option, where the system runs on
      the clinic's own server rather than in EasyClinic's cloud.
  - question: Am I locked into a contract?
    answer: >-
      No, there is no binding contract on any EasyClinic plan and no setup fee, so you use it for as long as
      it suits your clinic. On Professional and Premium you pay per doctor per month, billed annually or
      quarterly, and EasyClinic never sells or discloses your clinic's data.
  - question: Do I have to use the AI?
    answer: >-
      No, the EMR works without Cura AI: you write notes from your own templates and shortcuts, and the
      prescription goes out exactly as it would with the AI. Cura AI (documentation) comes with every plan,
      and when you use it, it drafts the note for you to review and sign.
  - question: Can EasyClinic run more than one clinic location?
    answer: >-
      Yes, EasyClinic runs more than one location on the Premium and Enterprise plans, but not on
      Professional, which covers a single location. A clinic on Professional that opens a second branch
      moves up to Premium, and Enterprise adds central control and SOP tracking across branches. The
      largest chain on EasyClinic has {fact:largestChain} locations.
  - question: How long does it take to go live?
    answer: >-
      A clinic can go from demo to live in as little as {fact:goLiveDays} days, and staff training is
      {fact:trainingDays} short sessions, about two hours in total. Support and training stay unlimited on
      every plan after you go live.

