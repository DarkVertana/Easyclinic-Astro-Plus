          links:
            - label: EMR and e-prescriptions
              href: /features/emr/
            - label: Lab
              href: /features/lab/
            - label: Pharmacy and inventory
              href: /features/pharmacy-and-inventory/
        - title: Money
          icon: receipt
          outcome: Every order becomes an invoice, and the owner sees unbilled work and denied claims before the month ends.
          links:
            - label: Billing
              href: /features/billing/
            - label: Insurance claims
              href: /features/insurance-claims/
            - label: Revenue management
              href: /features/revenue-management/
        - title: Growth
          icon: chart-column
          outcome: Recall campaigns tell patients when their review is due, and the owner checks the morning numbers for every branch on one screen.
          links:
            - label: Patient engagement
              href: /features/patient-engagement/
            - label: Reports and dashboards
              href: /features/reports-and-dashboards/
            - label: Multi-location
              href: /features/multi-location/

  - discriminant: proofBlock
    value:
      id: study
      eyebrow: The Penda Health study
      heading: What changed when clinicians had AI inside the record
      variant: study
      figures:
        - visits
        - diagnostic-errors
        - treatment-errors
        - history-errors
      body: |
        In 2025, Penda Health and OpenAI studied {fig:visits} patient visits at 15 Penda clinics in Nairobi. Penda Health has run on EasyClinic since 2017, and AI Consult, an AI copilot embedded in Penda's EasyClinic record, checked the clinicians' work as they went. Independent physicians rated the visits, and visits where the clinician had the copilot scored better on each of the error measures above.

        The results are published as a preprint on arXiv, not in a journal.
      link:
        label: Read how the study was run
        href: /curapilot/

