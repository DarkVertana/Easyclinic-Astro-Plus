          name: Smart Hospital Manager
          rank: 2
          bestFor: Growing hospitals, clinics and nursing homes that want to pay once
          url: https://smarthospitalmanager.com/pages/managementsoftware/somalia/
          body: >-
            Smart Hospital Manager, from OnClick Technologies, publishes a Somalia page that sells a lifetime licence with no
