sections:
  - discriminant: prose
    value:
      id: verdict
      heading: The verdict by clinic type
      body: >-
        For a clinic or hospital in Mogadishu, Hargeisa or Bosaso that wants the choice of cloud or its own server,
        several sites and telemedicine, SoftClinic GenX ranks first here. For a facility that would rather pay once and
        keep patient data on its own server, Smart Hospital Manager, second, sells a lifetime licence. For a clinic with
        developers or a technical partner, OpenEMR, third, is free and open source, with multi-facility support and
        telehealth. Easy Clinic, unranked here, suits a connected clinic that wants Cura AI to draft the note and WhatsApp
        reminders on one cloud system.
      width: measure

  - discriminant: prose
    value:
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** Easy Clinic publishes this page. We rank the three other systems and leave Easy Clinic unranked, at the end of the table and the list. Every fact about the other three links to the page it came from.

        **When and where.** We read each vendor's own website on 14 October 2026. Where a vendor's pages did not say, the cell reads "Not published" with the date. Capterra and G2 could not be read on that date, so this page gives no independent review score.

        **How we ranked.** We weighed two checks first, a Somalia presence and a published price, then three daily features: WhatsApp to patients, more than one site and AI note drafting. SoftClinic GenX and Smart Hospital Manager publish a Somalia page and no price, and each names more than one site; the tie-break, telemedicine, puts SoftClinic GenX first. OpenEMR is free, which, as on our Kenya page for OpenMRS, we do not count as a published price, and it has no Somalia page, so it is third.

        **Why Easy Clinic is unranked.** Easy Clinic publishes all three daily features but no local price. We do not place ourselves in a ranking we wrote while our local price is unpublished.

        **What this page leaves out.** None of the four names EVC Plus, Zaad or other mobile money, or the Somali language in the product, on the pages we read.
      width: measure

