faq:
  - question: Is this ranking biased, since Easy Clinic publishes it?
    answer: >-
      It could be, so we made it checkable and left Easy Clinic out of the ranking: every fact about the other three links
      to the vendor's own page, read on 14 October 2026, and we do not rank ourselves while our local price is unpublished.
  - question: Which of these work without the internet?
    answer: >-
      SoftClinic GenX can be installed on-premise on a local network, Smart Hospital Manager is self-hosted, and OpenEMR
      runs on your own servers. Easy Clinic runs in the cloud and does not run fully offline today.
  - question: Is OpenEMR really free?
    answer: >-
      The software is free under the GNU General Public License, but you arrange the server and support; its pages say
      support providers charge by the hour or the month, and its free hosted service is for US providers only.
  - question: Do any of these take EVC Plus or Zaad?
    answer: >-
      None of the four names EVC Plus, Zaad or other mobile money on the pages we read on 14 October 2026, so ask each how
      a mobile money payment is recorded against the bill.
  - question: What does Easy Clinic cost in Somalia?
    answer: >-
      Easy Clinic's local price is not yet published. The [pricing page](/pricing/) has the US dollar list, which starts at
      {price:usd.professional.annual} per doctor per month on Professional billed annually, with no setup fee and no
      binding contract.

