          body: >-
            SoftClinic GenX, from Ahmedabad, publishes a Somalia page naming Mogadishu, Hargeisa, Bosaso, Kismayo and
            Baidoa. It runs in the cloud or on-premise, where the build works on a local network, covers single sites to
            multi-location chains, offers telemedicine by text or video and has an SMS facility. It is a licensed product
