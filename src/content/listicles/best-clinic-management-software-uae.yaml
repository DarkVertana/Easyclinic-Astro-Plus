            - label: NABIDH, Malaffi and Riayati
              value: Not published on this page

  - discriminant: stepList
    value:
      id: workflow-tests
      heading: Five tests to run in every demo
      intro: >-
        Feature lists look alike. Run the same tests with every vendor, on a patient day like yours, and count
        the screens each one needs.
      steps:
        - title: Front desk test
          body: >-
            Register a walk-in from an Emirates ID card with an insurance card, and collect the patient's
            co-payment. Unite, MedicoPlus, Insta by Practo and MEDAS publish Emirates ID registration; ask the
            others to show it.
        - title: Exchange test
          body: >-
            Ask the vendor to send one visit to NABIDH or Malaffi and show you the acknowledgement for it. Then
            find the vendor's name on the regulator's list yourself, and for Riayati, ask for a live facility in
            the Northern Emirates you can call.
        - title: Doctor context test
          body: >-
            Open a returning patient and look for the last prescription and lab results beside the history.
            Then dictate a note: EasyClinic (Cura AI) and Pabau (Pabau Scribe) publish AI note drafting, Insta by
            Practo and MEDAS list speech-to-text, and Unite's Scribe AI is not yet released.
        - title: Follow-up test
          body: >-
            Send a reminder and a prescription to a patient's phone, and ask which channel it uses and what it
            costs. WhatsApp is a paid add-on on Unite and Pabau, and on EasyClinic it starts on Premium.
        - title: Claims test
          body: >-
            Build a claim from the bill and ask how it reaches eClaimLink in Dubai or Shafafiya in Abu Dhabi.
            Unite (on Enterprise) and Insta by Practo publish both; ask every other vendor, EasyClinic included,
            to show the submission rather than describe it.

  - discriminant: prose
    value:
      id: what-they-cost
      heading: What each one costs
      body: |-
        Two vendors publish a price in dirhams. [Unite](https://www.unite.care/pricing) charges per user: AED 100 a month on Professional and AED 120 on Enterprise, billed annually, plus a one-time onboarding fee and another for each new branch, and month-to-month billing needs 10 or more users per site. [Clinicea's Dubai page](https://clinicea.com/clinic-management-software-dubai) offers AED 99 per practitioner per month with no setup or training charge, and its [pricing page](https://clinicea.com/pricing) adds a 14-day free trial and no exit fee.

        EasyClinic charges per doctor, {price:usd.professional.annual} a month on Professional billed annually or {price:usd.professional.quarterly} billed quarterly, with a reception login, unlimited support and training, no setup fee and no binding contract; the price in dirhams is not yet published on [its pricing page](/pricing/). [Pabau](https://pabau.com/pricing/) prices by team size and location and lists no UAE prices.

        MedicoPlus, Yolo, Insta by Practo and MEDAS quote on request. [MedicoPlus](https://www.clinicsoftware.ae/pricing) offers a subscription or a one-time on-premise licence with annual maintenance, and includes its NABIDH and Riayati connections in the implementation.

        Count the logins before you compare. Unite prices every user, so two doctors and two receptionists are four users. Clinicea prices each practitioner, and its Dubai page does not say what a front-desk login costs. EasyClinic prices each doctor and includes a reception login. Then add any onboarding fee and the WhatsApp add-on.
      width: measure

  - discriminant: decisionMatrix
    value:
      id: when-to-choose-which
      heading: When to choose which
      options:
        - title: Choose Unite EMR or Clinicea if
          items:
            - Your clinic is in Dubai and you want a price in dirhams before the first call, from AED 100 per user on Unite or AED 99 per practitioner on Clinicea, per month.
            - You also run a branch in Abu Dhabi and want a vendor on both regulator lists, which Unite is and Clinicea is not.
            - You claim from insurers through eClaimLink or Shafafiya and will take Unite's Enterprise plan.
            - You want to try the software first, on Clinicea's 14-day free trial with no credit card.
            - You weigh independent reviews, where Clinicea has 4.8 on Capterra from 43 reviews.
        - title: Choose MedicoPlus, Insta by Practo or MEDAS if
          items:
            - You run a medical centre with lab, radiology and pharmacy on the same system.
            - You want the option of hosting on your own servers, which MedicoPlus and Insta by Practo both offer.
            - Your group has branches in Dubai and Abu Dhabi, and you want a vendor on both regulator lists with a UAE office.
            - You are ready to ask for a quote, since none of the three publishes a price.
        - title: Choose Yolo or Pabau if
          items:
            - WhatsApp reminders and patient marketing matter to you as much as the chart, and you will take a quote.
            - Your clinic is in Dubai only and you want a system on the NABIDH list, which names Yolo and not Pabau.
            - You want AI notes now, and Pabau lists Pabau Scribe as unlimited and free.
            - You run an aesthetic or wellness practice and weigh reviews, where Pabau has 4.7 on Capterra from 652 reviews.
            - You want staff time tracking and payroll in the same system, which Yolo lists.
        - title: Choose EasyClinic if
          us: true
          items:
            - Your doctors want Cura AI to listen to the consult and draft the note, on every plan from Professional.
            - You want a published price per doctor with a reception login included, and no setup fee or binding contract.
            - You run, or plan, branches in more than one emirate, on Premium, or on Enterprise for central control of every location.
            - You have EasyClinic's NABIDH, Malaffi or Riayati status for your emirate, with a date, in writing before you sign.

