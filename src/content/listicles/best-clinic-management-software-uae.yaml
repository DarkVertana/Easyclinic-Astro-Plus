        - id: easyclinic
          name: EasyClinic
          us: true
          bestFor: Clinics and groups that want Cura AI note drafting on every plan and a price per doctor
          url: https://www.easyclinic.io/
          body: >-
            EasyClinic has run clinics since {fact:founded} from its office in Kolkata, and {fact:doctors}
            doctors in {fact:countries} countries use it. Professional, at {price:usd.professional.annual} per
