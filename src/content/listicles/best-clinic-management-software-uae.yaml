  - discriminant: prose
    value:
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** EasyClinic publishes this page. We rank the seven other systems and leave EasyClinic unranked, at the end of the table and the list, because the first thing we ranked on is the regulators' own lists, and this page does not state EasyClinic's NABIDH, Malaffi or Riayati status. Every fact about the other seven links to the page it came from.

        **When and where.** We read each vendor's own website on 26 September 2026, and two lists the regulators publish. The DHA's [NABIDH site](https://nabidh.dha.gov.ae/#/comm/connectedemr) lists 68 EMR systems "tested for connectivity with NABIDH". [Malaffi's list](https://www.malaffi.ae/connected-emrs/) names 72 systems that have at least one client connected and have met its interoperability requirements for that client, and Malaffi adds that this does not mean they meet every other Department of Health requirement. The Ministry of Health and Prevention's list of systems connected to Riayati did not load for us on 26 September 2026, so every Riayati statement here is the vendor's own. Review scores come from Capterra, with the number of reviews. Where a vendor's pages did not say, the cell reads "Not published".

        **What we compared.** What each vendor says about NABIDH, Malaffi and Riayati against the two lists, a UAE office, the pricing model and any published price, WhatsApp messages to patients, running more than one branch, AI note drafting, and a review score with its count.

        **How we ranked.** For a private clinic in Dubai, where most of these vendors compete, we weighed a place on the NABIDH list first and a published price second, then the daily features in the table below. A place on Malaffi's list as well, which matters to a group that also runs in Abu Dhabi, and independent reviews broke ties. Clinicea sits above MedicoPlus because it publishes a price. MedicoPlus sits above Yolo because Malaffi's list also names it, and Yolo sits above Insta by Practo and MEDAS because it publishes WhatsApp reminders as well as multi-clinic support. Pabau is last because neither list named it.

        **How we chose the eight.** [SoftwareSuggest's UAE category](https://www.softwaresuggest.com/clinic-management-software/uae) was led on 26 September 2026 by products with five reviews or fewer, so we started from the two regulator lists and chose systems that publish a UAE page or a UAE office, then added Pabau, which publishes a Dubai guide to NABIDH and has 652 reviews on Capterra.

        **What this page leaves out.** EasyClinic's cells come from its published plans and prices and its UAE page. The page gives EasyClinic's Capterra rating without a review count, gives no price in dirhams because none is published yet, and does not state EasyClinic's regulator status. We did not trial any of the products.
      width: measure

