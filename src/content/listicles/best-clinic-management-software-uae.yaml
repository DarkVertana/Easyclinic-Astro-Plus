            consultations and more than one location, and Enterprise adds central control of every location.
            Insurance claims and pharmacy
            come with Enterprise or as add-ons. A reception login is included with no setup fee or binding
            contract, and a clinic can be live in as little as {fact:goLiveDays} days. A price in dirhams and a
            UAE office are not yet published, and this page does not state EasyClinic's NABIDH, Malaffi or
            Riayati status.
          pros:
            - Cura AI note drafting on every plan, including Professional
            - A published price per doctor with a reception login included, and no setup fee or binding contract
            - More than one location on Premium, and central control of every location on Enterprise
            - '{fact:capterraRating} on Capterra and {fact:googleRating} on Google'
          cons:
            - No price in dirhams and no UAE office published
            - This page does not state its NABIDH, Malaffi or Riayati status
