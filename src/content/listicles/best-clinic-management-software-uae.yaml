              checkedOn: 2026-09-26

        - id: pabau
          name: Pabau
          rank: 7
          bestFor: Aesthetic and wellness practices that weigh marketing tools and reviews
          url: https://pabau.com/
          body: >-
            Pabau is practice software for clinics and med spas, says 4,000+ practices use it, and publishes a
            NABIDH connector page written for Dubai clinics. Every plan includes the full platform, from online
            booking and clinical records to payments, marketing tools and inventory, and plans differ only by the
            number of users. Prices depend on location and team size, the pricing page's regions do not include
            the UAE, and several locations are covered only on Enterprise, for 16 or more users. Pabau Scribe
            listens during the consultation and turns it into structured notes, and the pricing page lists it as
            unlimited and free; WhatsApp comes with the Engage Plus add-on, priced per location. It has 4.7 on
            Capterra from 652 reviews, the largest review count on this page. Its Dubai guide says Pabau is DHA
            NABIDH-approved and that the DHA publishes no list of connected systems, but the NABIDH site lists
            68 systems, and neither it nor Malaffi's list named Pabau on 26 September 2026.
          pros:
            - Pabau Scribe for AI notes, listed as unlimited and free
            - 4.7 on Capterra from 652 reviews
            - Booking, payments, marketing and inventory in every plan
          cons:
