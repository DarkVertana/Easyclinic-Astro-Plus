  - discriminant: prose
    value:
      tone: wash
      id: what-they-cost
      heading: What each one costs
      body: |-
        Two vendors publish a price in dirhams. [Unite](https://www.unite.care/pricing) charges per user: AED 100 a month on Professional and AED 120 on Enterprise, billed annually, plus a one-time onboarding fee and another for each new branch, and month-to-month billing needs 10 or more users per site. [Clinicea's Dubai page](https://clinicea.com/clinic-management-software-dubai) offers AED 99 per practitioner per month with no setup or training charge, and its [pricing page](https://clinicea.com/pricing) adds a 14-day free trial and no exit fee.

        Easy Clinic charges per doctor, {price:usd.professional.annual} a month on Professional billed annually or {price:usd.professional.quarterly} billed quarterly, with a reception login, unlimited support and training, no setup fee and no binding contract; the price in dirhams is not yet published on [its pricing page](/pricing/). [Pabau](https://pabau.com/pricing/) prices by team size and location and lists no UAE prices.

        MedicoPlus, Yolo, Insta by Practo and MEDAS quote on request. [MedicoPlus](https://www.clinicsoftware.ae/pricing) offers a subscription or a one-time on-premise licence with annual maintenance, and includes its NABIDH and Riayati connections in the implementation.

        Count the logins before you compare. Unite prices every user, so two doctors and two receptionists are four users. Clinicea prices each practitioner, and its Dubai page does not say what a front-desk login costs. Easy Clinic prices each doctor and includes a reception login. Then add any onboarding fee and the WhatsApp add-on.
      width: wide

faq:
  - question: Is this ranking biased, since Easy Clinic publishes it?
    answer: >-
      It could be, so we made it checkable and left Easy Clinic out of the ranking: every fact about the other
      seven links to the page it came from, read on 26 September 2026. We ranked on the regulators' lists
      first, and this page does not state Easy Clinic's NABIDH, Malaffi or Riayati status, so ranking Easy Clinic
      against vendors the lists name would not be a fair comparison.
  - question: How do I check a vendor's NABIDH or Malaffi claim?
    answer: >-
      Look for the vendor's name on the regulator's own list: the NABIDH site's Available EMRs page names 68
      systems tested for connectivity, and Malaffi's Connected EMR Systems page names 72. A place on Malaffi's
      list means at least one of the vendor's clients is connected, and Malaffi says it is not a certificate for
      every other Department of Health rule. For Riayati we could not read the ministry's list, so ask for a
      live facility in the Northern Emirates you can call.
  - question: Does a clinic in Abu Dhabi have to connect to Malaffi?
    answer: >-
      Yes, unless it is exempt: the Department of Health requires every licensed facility to connect to Malaffi,
      and a facility that has not connected cannot renew its licence. Military, police, aviation and university
      clinics can be exempt. Connecting needs an accession agreement, a security assessment, an HL7-capable EMR
      and an SDWAN line from Etisalat. Connecting to Malaffi is free, but the clinic pays for its secure line.
  - question: What does Easy Clinic cost, and is there a price in dirhams?
    answer: >-
      Easy Clinic costs {price:usd.professional.annual} per doctor per month on Professional billed annually, or
      {price:usd.professional.quarterly} billed quarterly, and its price in dirhams is not yet published on the
      [pricing page](/pricing/). Premium, which adds WhatsApp messages and more than one location, is
      {price:usd.premium.annual} billed annually. Every plan includes a reception login and unlimited support and
      training, with no setup fee and no binding contract.
  - question: Which of these send WhatsApp reminders to patients?
    answer: >-
      Five publish WhatsApp messages to patients: Easy Clinic on Premium, Unite and Pabau as paid add-ons, Yolo
      for confirmations and reminders, and MedicoPlus for appointment confirmations. Clinicea shares
      prescriptions by WhatsApp. Insta by Practo sends notifications by SMS and email, and MEDAS lists WhatsApp
      only as a support channel.
  - question: Which of these can draft the clinical note with AI?
    answer: >-
      Easy Clinic and Pabau publish AI note drafting that is available now: Cura AI on every Easy Clinic plan and
      Pabau Scribe, which Pabau lists as unlimited and free. Unite shows Unite Scribe AI on its homepage, but its
      own pricing FAQ says the beta is not yet released. Insta by Practo and MEDAS list speech-to-text, which
      types what you say rather than drafting the note, and we found no AI documentation for the other three.
  - question: Can one system run branches in Dubai and Abu Dhabi?
    answer: >-
      Yes, several say so, but ask each vendor how every branch reaches its own emirate's exchange. Insta by
      Practo lists one system across centres in different emirates and health authority standards, Unite keeps
      one patient file across branches, and Easy Clinic covers more than one location from Premium, with central
      control of every location on Enterprise. For a Dubai and Abu Dhabi group, Unite, MedicoPlus, Insta by Practo and
      MEDAS are the four systems named on both regulator lists.
  - question: How long does it take to switch?
    answer: >-
      Easy Clinic can be live in as little as {fact:goLiveDays} days from the demo, with training in
      {fact:trainingDays} short sessions of about two hours in all; this page does not state how long a NABIDH
      or Malaffi connection takes on Easy Clinic. MedicoPlus says going live on NABIDH typically takes 2 to 4
      weeks, and MEDAS says E-Clinic typically takes 4 to 8 weeks with data migration and training. Clinicea
      assigns a NABIDH onboarding specialist who arranges the DHA agreement, and its trainers train your staff.

