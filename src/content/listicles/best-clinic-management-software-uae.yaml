  - discriminant: prose
    value:
      id: regulator-lists
      heading: What the NABIDH and Malaffi lists tell you
      body: |-
        Almost every vendor on this page says it works with NABIDH, and two of them make claims the regulators' own lists contradict. Pabau's Dubai guide says the DHA publishes no list of connected systems, but the NABIDH site has an "Available EMRs" page listing 68 systems tested for connectivity, and Pabau is not on it. MedicoPlus calls itself Dubai's only DHA-certified NABIDH connected EMR, and it is one of those 68.

        **Dubai.** NABIDH is the Dubai Health Authority's platform for sharing patient records between public and private facilities. To join, a facility asks for a readiness assessment, signs an onboarding agreement with the DHA, tests its EMR's connection on the developer portal and is given a launch date ([NABIDH onboarding and readiness](https://nabidh.dha.gov.ae/#/comm/readiness)).

        **Abu Dhabi.** The Department of Health requires every licensed facility, apart from exempt ones such as military and university clinics, to connect to Malaffi. A facility that has not connected cannot renew its licence, and one with a Daman agreement cannot submit claims until it connects. Connecting needs an accession agreement, a security assessment, an HL7-capable EMR and an SDWAN line from Etisalat ([Malaffi: facilities required to connect](https://www.malaffi.ae/providers/facilities-required-to-connect/)).

        **Sharjah and the Northern Emirates.** Riayati is the National Unified Medical Record run by the Ministry of Health and Prevention, and since January 2023 it has been linked with NABIDH and Malaffi ([Department of Health, 31 January 2023](https://www.doh.gov.ae/en/news/uae-health-authorities-announce-successful-integration-between-riayati-malaffi-and-nabidh)). We could not read the ministry's list of connected systems, so ask any vendor that claims Riayati for a live facility in Sharjah or Ajman you can call.

        Before you sign with any vendor, EasyClinic included, find its name on the list for your emirate and ask for the date your own facility would go live.
      width: measure

  - discriminant: vendorList
    value:
      id: vendors
      heading: The eight systems, one by one
      intro: >-
        The seven others in ranked order for a private clinic in Dubai, then EasyClinic, unranked, in the same
        format. Each section gives what the vendor's own pages say, then what we would weigh.
      vendors:
        - id: unite-emr
          name: Unite EMR
          rank: 1
          bestFor: Small and medium clinics and healthcare chains in Dubai and Abu Dhabi
          url: https://www.unite.care/
          body: >-
            Unite began in 2014, set up in Dubai in 2020 when it launched its cloud platform, and lists its
            office at Dubai Silicon Oasis. It says it runs in over 400 clinics in the UAE, and it is the only
            system here with a full price list in dirhams: Professional is AED 100 per user per month billed
            annually and Enterprise AED 120, plus a one-time onboarding fee, and paying month to month needs 10
            or more users per site. Professional covers scheduling, e-prescriptions, SOAP notes, cash and
            insurance billing, DHA statistical reports and onboarding to NABIDH, Riayati and Malaffi, which its
            FAQ says the subscription covers on annual billing. Enterprise adds claim submission, remittance and
            pre-authorisation through eClaimLink and Shafafiya. WhatsApp booking and confirmations are a paid
            add-on, and each new branch has a one-time onboarding charge. Its homepage shows Unite Scribe AI,
            but its pricing FAQ says the beta is not yet released.
          pros:
            - Named on both the NABIDH and Malaffi lists, with onboarding in the annual subscription
            - A published price in dirhams, per user
            - Claims through eClaimLink and Shafafiya on Enterprise
            - One patient file across branches
          cons:
            - An onboarding fee on top, and again for each new branch
            - WhatsApp is a paid add-on
            - Scribe AI is not yet released, per its own FAQ
            - No review score with a count that we could read
          facts:
            - label: Price
              value: AED 100 (Professional) or AED 120 (Enterprise) per user per month billed annually; AED 120 or AED 140 month to month; onboarding fee extra
              source: https://www.unite.care/pricing
              checkedOn: 2026-09-26
            - label: NABIDH list
              value: Listed as Unite
              source: https://nabidh.dha.gov.ae/#/comm/connectedemr
              checkedOn: 2026-09-26
            - label: Malaffi list
              value: Listed as Unite
              source: https://www.malaffi.ae/connected-emrs/
              checkedOn: 2026-09-26
            - label: UAE clinics
              value: Over 400, per its homepage
              source: https://www.uniteemr.com/
              checkedOn: 2026-09-26

        - id: clinicea
          name: Clinicea
          rank: 2
          bestFor: Growing clinics and chains in Dubai
          url: https://clinicea.com/
          body: >-
            Clinicea was founded in November 2012, is used across six continents by its own count, and
            publishes a UAE address in the Al Hamra free zone in Ras Al Khaimah. Its Dubai page calls it NABIDH
            connected and names the Dubai clinics that switched to it, and the NABIDH list includes it, though
            Malaffi's does not. The Dubai signup offer is AED 99 per practitioner per month with no setup,
            onboarding or training charge, and a NABIDH onboarding specialist arranges the DHA agreement before
            Clinicea's trainers train your staff. The pricing page adds a 14-day free trial with no credit card,
            and says there is no exit fee or minimum contract. Prescriptions can be shared by SMS, WhatsApp or
            email, a clinic-chain control panel runs every branch from head office, and your data comes back in
            CSV or XML if you leave. We found no AI note drafting and no Riayati claim on the pages we read.
          pros:
            - AED 99 per practitioner per month on its Dubai signup offer
            - A 14-day free trial, with no exit fee or minimum contract
            - 4.8 on Capterra from 43 reviews
            - A NABIDH onboarding specialist and staff training included
          cons:
            - Not on Malaffi's list, and no Riayati claim found
            - No AI note drafting on the pages we read
            - The AED 99 price is labelled a signup offer
          facts:
            - label: Dubai price
              value: AED 99 per practitioner per month, with no setup or training charges
              source: https://clinicea.com/clinic-management-software-dubai
              checkedOn: 2026-09-26
            - label: Trial and exit
              value: 14-day free trial; no exit fee or minimum contract period
