notes:
  - 'Competitors are the three on the live page (fetched 2026-10-14). GNU Health facts come from the EU Interoperable Europe news item the live page cites and gnuhealth.org (which names no licence, only Free/Libre). Capterra and G2 returned 403; Medicasimple''s own Google and App Store badges are not used.'
