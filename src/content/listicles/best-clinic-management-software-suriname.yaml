sections:
  - discriminant: prose
    value:
      id: verdict
      heading: The verdict by clinic type
      body: >-
        For a private clinic, often dental or allied health, that wants a published monthly price, WhatsApp reminders and
        branch control, Medicasimple ranks first here, though it is a London company with no Suriname page. For public or
        government-linked facilities, GNU Health, second, is the free system Suriname's government adopted in 2025, with a
        version that runs without a network. For a facility that would rather pay once and host it, Smart Hospital
        Manager, third, sells a lifetime licence and runs several branches. Easy Clinic, unranked here, suits a connected
        clinic that wants Cura AI to draft the note and WhatsApp reminders.
      width: measure

  - discriminant: prose
    value:
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** Easy Clinic publishes this page. We rank the three other systems and leave Easy Clinic unranked, at the end of the table and the list. Every fact about the other three links to the page it came from.

        **When and where.** We read each source on 14 October 2026. Where a source did not say, the cell reads "Not published" with the date. Capterra and G2 could not be read on that date, so this page gives no independent review score.

        **How we ranked.** We weighed two checks first, a Suriname presence and a published price, then three daily features: WhatsApp to patients, more than one site and AI note drafting. Each competitor meets one check: Medicasimple a price, GNU Health and Smart Hospital Manager a Suriname presence. GNU Health is free, which, as on our Kenya page for OpenMRS, we do not count as a published price. Medicasimple has two daily features, WhatsApp and branches, so it ranks first. GNU Health and Smart Hospital Manager have one each, more than one site; the tie-break, a named adopter in Suriname, puts GNU Health second.

        **Why Easy Clinic is unranked.** Easy Clinic publishes all three daily features but no local price. We do not place ourselves in a ranking we wrote while our local price is unpublished.

        **Caveats.** Medicasimple's pricing page fills in its prices by script; the figures below come from its own pricing data, served in US dollars to our request.
      width: measure

