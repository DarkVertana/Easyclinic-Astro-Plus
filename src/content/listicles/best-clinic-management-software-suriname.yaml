  - discriminant: vendorList
    value:
      id: vendors
      heading: The four systems, one by one
      intro: The three others in ranked order for a clinic in Suriname, then Easy Clinic, unranked, in the same format.
      vendors:
        - id: medicasimple
          name: Medicasimple
          rank: 1
          bestFor: Private practices from dental to physio, dietetics and aesthetics
          url: https://www.medicasimple.com/
          body: >-
            Medicasimple, from London, is a hosted practice system for dental, physio, dietetics and aesthetic practices,
            working with clinics across Europe, MENA and APAC. It sends automated SMS and WhatsApp reminders, gives connected
            clinics branch-level control on its Superior plan, and offers AI support and AI-assisted translations. Plans run
            from $25 to $160 per practitioner a month, less billed annually, with a 14-day free trial. It has no Suriname
            presence and names no AI note drafting.
          pros:
            - A published price and a free trial
            - WhatsApp reminders and branch control
          cons:
            - No Suriname presence
            - Leans towards dental and allied health practices
          facts:
            - label: Plans
              value: $25, $50, $95 and $160 per practitioner a month, billed monthly
              source: https://www.medicasimple.com/pricing
              checkedOn: 2026-10-14

        - id: gnu-health
          name: GNU Health
          rank: 2
          bestFor: Individuals, health professionals, institutions and governments
          url: https://www.gnuhealth.org/
          body: >-
            GNU Health is Free/Libre hospital and health information software for practitioners, institutions and
            governments. Suriname's government adopted it for its public healthcare system in May 2025, rolling out in
            phases from the Regional Service Centers, with training and localisation under way. It scales to nationwide
            federated networks, and GNU Health in a Box stores data locally without a network. It publishes no price, and we
            found no WhatsApp messages, AI or telemedicine.
          pros:
            - Adopted by Suriname's public health system
            - Free software that can run without a network
          cons:
            - You arrange installation and support
            - No WhatsApp or AI named
          facts:
            - label: Suriname adoption
              value: Adopted by the government for public healthcare, announced 9 May 2025
              source: https://interoperable-europe.ec.europa.eu/collection/gnu-health/news/suriname-adopts-gnu-health-hospital-and-health-information-system
              checkedOn: 2026-10-14

        - id: smart-hospital-manager
          name: Smart Hospital Manager
          rank: 3
          bestFor: Any hospital or clinic that wants to pay once
          url: https://smarthospitalmanager.com/pages/managementsoftware/paramaribo/
          body: >-
            Smart Hospital Manager, from OnClick Technologies, publishes a Paramaribo page that sells a one-time licence with
            no monthly charges, self-hosted so patient data stays on your own server. It sends SMS and email reminders and
            runs multiple hospital branches from one dashboard. It publishes no price and names no Suriname office or client,
            WhatsApp messages or AI.
          pros:
            - A one-time licence with no monthly fee
            - Several branches from one dashboard
          cons:
            - No price published
            - No WhatsApp or AI named
          facts:
            - label: Licence
              value: Buy once, use forever, no monthly charges
              source: https://smarthospitalmanager.com/pages/managementsoftware/paramaribo/
              checkedOn: 2026-10-14

        - id: easyclinic
