        - id: medicalmet
          name: MedicalMet
          rank: 2
          bestFor: Small clinics across Malaysia, from GP to dental and aesthetic
          url: https://medicalmet.com/
          body: >-
            MedicalMet is headquartered in Kuala Lumpur and is fully cloud-based. Its Treatment Note AI listens,
