            across branches and offers video consultations. Kumo AI speech-to-text drafts notes, with Transcribe AI on
            GP PLUS. Plans are yearly per clinic, from MYR 1,280 to MYR 4,280, with a free trial and no refunds.
          pros:
            - Published yearly prices in ringgit
            - MyInvois, TPA management and SNOMED CT
            - WhatsApp reminders, branch sync and AI transcription
          cons:
            - Prices may differ by the visitor's country
            - No offline mode named
