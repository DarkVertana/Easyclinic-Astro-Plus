  - discriminant: vendorList
    value:
      id: vendors
      heading: The four systems, one by one
      intro: The three others in ranked order for a clinic in Malaysia, then Easy Clinic, unranked, in the same format.
      vendors:
        - id: kumodoc
          name: kumoDoc
          rank: 1
          bestFor: GP clinics, multi-branch clinics and healthcare groups
          url: https://www.kumodoc.com/
          body: >-
            kumoDoc, from Gocloud Technologies in Petaling Jaya, is a cloud clinic system on Microsoft Azure that names
            Malaysian clinics such as Klinik Ravi, Klinik Al Farabi and Klinik Dr. Care. It integrates LHDN e-invoicing,
            including for panel patients, manages TPAs, uses SNOMED CT, sends reminders by email or WhatsApp, syncs data
            across branches and offers video consultations. Kumo AI speech-to-text drafts notes, with Transcribe AI on
            GP PLUS. Plans are yearly per clinic, from MYR 1,280 to MYR 4,280, with a free trial and no refunds.
          pros:
            - Published yearly prices in ringgit
            - MyInvois, TPA management and SNOMED CT
            - WhatsApp reminders, branch sync and AI transcription
          cons:
            - Prices may differ by the visitor's country
            - No offline mode named
          facts:
            - label: Plans
              value: MYR 1,280 (GP Lite), 1,800 (GP PLUS), 3,280 (Wellness) and 4,280 (Wellness PLUS) a year
              source: https://www.kumodoc.com/pricing/
              checkedOn: 2026-10-14

        - id: medicalmet
          name: MedicalMet
          rank: 2
          bestFor: Small clinics across Malaysia, from GP to dental and aesthetic
          url: https://medicalmet.com/
          body: >-
            MedicalMet is headquartered in Kuala Lumpur and is fully cloud-based. Its Treatment Note AI listens,
            transcribes and fills in clinical templates, and it adds AI translation, an AI clinical timeline and
            optional AI chatbot and calling. Invoices go to MyInvois automatically, panel pricing handles insurance
            claims, a MyKad reader speeds registration, and WhatsApp reminders go out automatically. Flex plans include
            unlimited branches. Its pricing page gives $12 to $245 a month with a 30-day free trial, no setup fee and no
            contract, while its Malaysia FAQ quotes RM45 a month for Solo. It names no Malaysian clinics.
          pros:
            - An AI scribe and other AI tools
            - MyInvois, panel pricing and a MyKad reader
            - A 30-day free trial with no setup fee
          cons:
            - Its pages quote prices in two currencies
            - No named Malaysian clinics
          facts:
            - label: Pricing
              value: From $12 to $245 a month on the pricing page; RM45 a month for Solo in its FAQ
              source: https://medicalmet.com/pricing/
              checkedOn: 2026-10-14

        - id: remedi
          name: Remedi
          rank: 3
          bestFor: Dental and general practice chains
          url: https://www.remedi.my/
          body: >-
            Remedi, from Remedi Innovations in Cyberjaya, is a cloud system validated as an AWS-qualified solution and
            built with chain clinics in mind, for dental and general practice. It is connected to the MyInvois LHDN
            portal, has a list of TPAs and panels, signs records digitally under the Digital Signature Act and handles
            data under the Personal Data Protection Act 2010. Its Endo AI proposes a dental diagnosis, and it offers
            virtual consultations and SMS campaigns. It sells monthly or yearly subscriptions with a 30-day free trial
            but publishes no price, and we found no WhatsApp messages to patients.
          pros:
            - MyInvois, TPA panels and PDPA named
            - Built for chain clinics, dental and GP
          cons:
            - No price published
            - No WhatsApp messages or AI note drafting named
          facts:
            - label: Trial
              value: Free 30-day trial
              source: https://www.remedi.my/
              checkedOn: 2026-10-14

        - id: easyclinic
          name: Easy Clinic
          us: true
          bestFor: Connected private clinics, from one doctor to a group, that want AI notes and WhatsApp
          url: https://www.easyclinic.io/
          body: >-
            Easy Clinic has run clinics since {fact:founded} and is used by {fact:doctors} doctors in {fact:countries}
            countries, and Qualitas Health runs its clinics in Malaysia on it. Cura AI listens to the consult and drafts
            the note for the doctor to confirm, on every plan, and WhatsApp reminders, video consultations and more than
            one location come with Premium. The limits matter in Malaysia. It names no MyInvois link, and the ringgit
            price is not yet published, so this page leaves it unranked. It does not run fully offline.
          pros:
            - Cura AI note drafting on every plan
            - WhatsApp, video consultations and branches on Premium
            - Qualitas Health as a Malaysian client
          cons:
            - No MyInvois link named
            - The ringgit price is not yet published
          facts:
            - label: Price in Malaysia
              value: Ringgit price not yet published
            - label: US dollar list
              value: From {price:usd.professional.annual} per doctor per month billed annually, on the [pricing page](/pricing/)

  - discriminant: stepList
    value:
      id: workflow-tests
      heading: Four tests to run in every demo
      steps:
        - title: E-invoice test
          body: >-
            Raise a panel patient's invoice and watch it reach MyInvois and come back validated. kumoDoc, MedicalMet and
            Remedi name the link; ask Easy Clinic to show it before you sign.
        - title: Doctor context test
          body: >-
            Dictate a note. Easy Clinic (Cura AI), kumoDoc (Kumo AI) and MedicalMet (Treatment Note AI) publish note
            drafting; Remedi's Endo AI is for dental diagnosis.
        - title: Follow-up test
          body: >-
            Send a reminder to a patient's phone and ask which channel and plan it needs. On Easy Clinic, WhatsApp
            starts on Premium.
        - title: Cost test
          body: Ask for the full yearly price in ringgit for your number of doctors and branches, with any add-ons.

  - discriminant: decisionMatrix
    value:
      id: when-to-choose-which
      heading: When to choose which
      options:
        - title: Choose kumoDoc or MedicalMet if
          items:
            - You want a published price and MyInvois named on the vendor's own page.
            - You want WhatsApp reminders and AI note drafting from a Malaysian company.
            - You want named Malaysian clinics as references, which kumoDoc gives, or a 30-day free trial, which MedicalMet gives.
        - title: Choose Remedi if
          items:
            - You run a dental or GP chain and want TPA panels and MyInvois.
            - You want Endo AI for dental diagnosis.
        - title: Choose Easy Clinic if
          us: true
          items:
            - Your doctors want Cura AI to listen to the consult and draft the note.
            - You run several branches and want one cloud system, as Qualitas Health does.
            - You will confirm e-invoicing and get the ringgit price in writing before you sign.

