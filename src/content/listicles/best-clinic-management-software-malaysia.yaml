faq:
  - question: Is this ranking biased, since Easy Clinic publishes it?
    answer: >-
      It could be, so we made it checkable and left Easy Clinic out of the ranking: every fact about the other three
      links to the vendor's own page, read on 14 October 2026, and we do not rank ourselves while our ringgit price is
      unpublished.
  - question: Which of these connect to MyInvois for LHDN e-invoicing?
    answer: >-
      kumoDoc, MedicalMet and Remedi all say they connect to LHDN e-invoicing through MyInvois. Easy Clinic names no
      MyInvois link on its pages, so ask it to show the e-invoice reaching MyInvois before you sign.
  - question: Which have an AI scribe?
    answer: >-
      Easy Clinic's Cura AI, kumoDoc's Kumo AI speech-to-text and MedicalMet's Treatment Note AI draft notes from the
      consult. Remedi's Endo AI proposes dental diagnoses rather than drafting notes.
  - question: Which publish a price?
    answer: >-
      kumoDoc publishes yearly plans from MYR 1,280 per clinic, and MedicalMet publishes monthly plans from $12, with
      RM45 a month quoted in its FAQ. Remedi offers a 30-day free trial but publishes no price, and Easy Clinic's
      ringgit price is not yet published.
  - question: Do any of these work offline?
    answer: >-
      None of the four names an offline mode on the pages we read; all four run in the cloud. Easy Clinic does not run
      fully offline today.
  - question: What does Easy Clinic cost in Malaysia?
    answer: >-
      Easy Clinic's ringgit price is not yet published. The [pricing page](/pricing/) has the US dollar list, which
      starts at {price:usd.professional.annual} per doctor per month on Professional billed annually, with no setup fee
      and no binding contract.

