      heading: The four systems, one by one
      intro: The three others in ranked order for a clinic in Malaysia, then Easy Clinic, unranked, in the same format.
      vendors:
        - id: kumodoc
          name: kumoDoc
          rank: 1
          bestFor: GP clinics, multi-branch clinics and healthcare groups
          url: https://www.kumodoc.com/
          body: >-
            kumoDoc, from Gocloud Technologies in Petaling Jaya, is a cloud clinic system on Microsoft Azure that names
            Malaysian clinics such as Klinik Ravi, Klinik Al Farabi and Klinik Dr. Care. It integrates LHDN e-invoicing,
