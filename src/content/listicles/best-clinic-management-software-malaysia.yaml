sections:
  - discriminant: prose
    value:
      id: verdict
      heading: The verdict by clinic type
      body: >-
        For a GP clinic or a small group that must submit e-invoices to LHDN, kumoDoc ranks first here: it publishes
        annual prices in ringgit, connects to MyInvois, sends WhatsApp reminders, syncs branches and transcribes notes
        with AI, and names Malaysian clinics that use it. MedicalMet, second, matches all four features with a 30-day
        free trial, and suits a small clinic that wants an AI scribe. Remedi, third, suits a dental or GP chain that
        wants MyInvois, TPA panels and Endo AI for dental diagnosis. Easy Clinic, unranked here, suits a clinic that
        wants Cura AI to draft the note and WhatsApp reminders, but it names no MyInvois link today.
      width: measure

  - discriminant: prose
    value:
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** Easy Clinic publishes this page. We rank the three other systems and leave Easy Clinic unranked, at the end of the table and the list. Every fact about the other three links to the page it came from.

        **When and where.** We read each vendor's own website on 14 October 2026. Where a vendor's pages did not say, the cell reads "Not published" with the date. Review sites could not be read on that date, so this page gives no independent review score.

        **How we ranked.** We weighed two checks first, a Malaysian presence and a published price, then four daily features: LHDN e-invoicing through MyInvois, WhatsApp messages to patients, more than one branch and AI note drafting. All three are Malaysian companies. kumoDoc and MedicalMet both publish a price and all four daily features; the tie-break, named Malaysian clinics, puts kumoDoc first. Remedi publishes no price and two daily features, MyInvois and branches, so it is third.

        **Why Easy Clinic is unranked.** Easy Clinic publishes three of the daily features but no MyInvois link and no price in ringgit. We do not place ourselves in a ranking we wrote while our local price is unpublished.

        **Caveats.** kumoDoc's pricing page shows country-specific blocks, so the prices may differ by visitor. MedicalMet's pricing page gives US dollars and its Malaysia FAQ gives ringgit; both are quoted below.
      width: measure

