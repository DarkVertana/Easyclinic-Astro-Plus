faq:
  - question: Is this ranking biased, since Easy Clinic publishes it?
    answer: >-
      It could be, so we made it checkable and left Easy Clinic out of the ranking: every fact about the other two links to
      the vendor's own page, read on 14 October 2026, and we do not rank ourselves while our rand price is unpublished.
  - question: Which of these switch claims to medical aids in real time?
    answer: >-
      GoodX switches claims in real time to medical aids such as Discovery, Medscheme, MHG and Bestmed. MocDoc names claims
      and TPA management without switching, and Easy Clinic names no medical aid switching.
  - question: Which say they are POPIA compliant?
    answer: >-
      GoodX says it is POPIA compliant and ISO 27001, and MocDoc says it supports the data privacy measures POPIA requires.
      This page does not state Easy Clinic's POPIA position, so ask before you sign.
  - question: Why does MocDoc rank above GoodX?
    answer: >-
      On our stated checks MocDoc publishes a price, WhatsApp and multi-location support, and GoodX publishes no price.
      For a practice billing medical aids, GoodX's real-time switching may matter more than any of those.
  - question: What does Easy Clinic cost in South Africa?
    answer: >-
      Easy Clinic's rand price is not yet published. The [pricing page](/pricing/) has the US dollar list, which starts at
      {price:usd.professional.annual} per doctor per month on Professional billed annually, with no setup fee and no
      binding contract.

