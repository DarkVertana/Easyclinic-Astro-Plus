        - ['**GoodX**', '==Real-time switching of claims to medical aids== such as Discovery, Medscheme, MHG and Bestmed.', '[goodx.co.za](https://goodx.co.za/features/)']
        - ['**Easy Clinic**', '==Not published== (no medical aid switching named, 14 October 2026)', 'This page']

  - discriminant: prose
    value:
      tone: plain
      id: verdict
      heading: The verdict by practice type
      body: >-
        For a private practice that bills medical aids every day, GoodX is the closer fit, whatever the ranking below
        says: it switches claims in real time to schemes such as Discovery, Medscheme, MHG and Bestmed, codes in ICD-10,
        says it is POPIA compliant and has offered video consultations, from a Pretoria company with over 195 staff. For
        a hospital, lab or multi-location group that wants WhatsApp notifications and a published hospital price, MocDoc
        is the wider cloud suite, though it names no medical aid switching. Easy Clinic, unranked here, suits a practice
        that wants Cura AI to draft the note, but it names no medical aid switching today.
      width: measure

  - discriminant: prose
    value:
      tone: wash
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** Easy Clinic publishes this page. We rank the two other systems and leave Easy Clinic unranked, at the end of the table and the list. Every fact about the other two links to the page it came from.

        **When and where.** We read each vendor's own website on 14 October 2026. Where a vendor's pages did not say, the cell reads "Not published" with the date. Capterra and G2 could not be read on that date. GoodX's HelloPeter page showed one review, too few to use.

        **How we ranked.** We weighed two checks first, a South African presence and a published price, then four daily features: real-time medical aid switching, WhatsApp to patients, more than one branch and AI note drafting. MocDoc publishes a South Africa page and a hospital price, WhatsApp and multi-location support, two checks and two features. GoodX has a South African office and switching, one check and one feature, because it publishes no price. So MocDoc ranks first on these checks, and the verdict above says plainly why a medical aid practice may still choose GoodX.

        **Why Easy Clinic is unranked.** Easy Clinic publishes three daily features but no medical aid switching and no rand price. We do not place ourselves in a ranking we wrote while our local price is unpublished.
      width: measure

