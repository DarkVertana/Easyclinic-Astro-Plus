sections:
  - discriminant: prose
    value:
      id: what-is-clinic-management-software
      heading: What is clinic management software?
      tone: wash
      width: wide
      body: >-
        **Clinic management software** is the system that runs the whole clinic, not just the medical notes. It
        handles appointments and reminders, patient records, billing and payments in shillings, pharmacy and
        stock, lab reports, patient messaging, and the numbers that tell you how the clinic is doing. The
        **electronic medical record**, or EMR, is one part of it. In Kenya the better systems also take **M-Pesa
        payments**, talk to patients on WhatsApp in English and Swahili, work across more than one branch, and are
        getting ready for SHA e-claims.

  - discriminant: splitContent
    value:
      id: why-clinics-need-software
      tone: plain
      centerHeading: true
      heading: Why clinics in Kenya need clinic management software in 2026
      intro: >-
        Patients, rules and payers have all moved at the same time. A few things are pushing this harder than the
        rest.
      body: |-
        ### Patients book and chat on WhatsApp.
        If your clinic still runs on phone calls and paper, you are losing time and the odd patient every day.

        ### SHA changed how clinics get paid.
        Claims now run through certified systems, so how your software handles eligibility and claims matters more than it used to.

        ### Missed appointments cost real money.
        WhatsApp and SMS reminders the day before and on the day bring people back and steady your income.

        ### Many patients, two languages.
        Medicine instructions, advice and reminders in English or Swahili land far better than a rushed note on paper.

        ### Three-year cost matters more than the sticker price.
        Cloud pricing means no server to buy, but the real number includes setup, training, support, and what it costs to move again if the system stops fitting.
      media:
        kind: screenshot
        src: ../../assets/images/best-clinic-management/01.webp
        alt: Easy Clinic invoice in Kenyan shillings
        frame: none

