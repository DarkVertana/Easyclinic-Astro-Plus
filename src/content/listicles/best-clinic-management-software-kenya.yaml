    and the decision matrix, as on the Nigeria and UAE listicles (page-graph.ts puts it at ItemList position
    8). Ranked: 1 Clinicea, 2 Helium Health, 3 ClinikEHR, 4 KenyaEMR, 5 OpenMRS, 6 Streamline Health,
    7 HospitalOS. OpenMRS and Streamline Health were swapped (previously 7 and 6): they tie on the weighted
