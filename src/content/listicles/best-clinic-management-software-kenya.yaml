  - discriminant: dataTable
    value:
      id: sha-and-regulators
      wideIntro: true
      tone: wash
      heading: SHA claims now need a DHA-certified system
      intro: |-
        Since 1 October 2026, a clinic can only claim from the Social Health Authority if it uses a system certified by the Digital Health Agency. The rule comes from the Digital Health Regulations, 2025, and covers SHA's contracting cycle up to 30 June 2029.

        Easy Clinic is DHA certified. Before you sign with any vendor, ask for its certificate number and check it on the [Digital Health Agency registry](https://certification.dha.go.ke/registry).
      columns:
        - Vendor
        - What the vendor says
        - Source
      rows:
        - - Easy Clinic
          - DHA certified, certificate CERT-2026-MHA2Q9YM, valid to 16 October 2028. SHA e-claims in development, with early access for existing clients. Compliance with HIPAA and GDPR.
          - '[easyclinic.io](https://www.easyclinic.io/)'
        - - Clinicea
          - Says it is HIPAA compliant in the US and PDPA compliant in Singapore, with GDPR terms for the EU. ==No Kenyan regulator named==.
          - '[Clinicea security page](https://clinicea.com/security)'
        - - Helium Health
          - Says HeliumOS helps facilities ensure regulatory compliance. ==No regulator named==.
          - '[HeliumOS page](https://heliumhealth.com/helium-os/)'
        - - ClinikEHR
          - HIPAA compliant with a business associate agreement, SOC 2 Type II, and the Nigeria Data Protection Act listed for its Nigerian clinics. ==No Kenyan regulator named==.
          - '[ClinikEHR pricing](https://clinikehr.com/pricing) and [about page](https://clinikehr.com/about)'
        - - KenyaEMR
          - ==Built to the Ministry of Health's 2011 Kenya EMR Standards and Guidelines==, and reports to KHIS, Kenya's DHIS2.
          - '[OpenMRS wiki](https://openmrs.atlassian.net/wiki/spaces/docs/pages/25475417/KenyaEMR+Distribution) and [Kenya HMIS](https://kenyahmis.org/documentation/summary-clinical-care-solutions/)'
        - - OpenMRS
          - Says it is FHIR-compliant, which is a data exchange standard. ==No regulator named==.
          - '[OpenMRS product page](https://openmrs.org/product/)'
        - - Streamline Health
          - Says its EMR complies with HIPAA and HITECH and produces Uganda Ministry of Health HMIS reports. ==No Kenyan regulator named==.
          - '[EMR page](https://streamlinehealth.org/stremline-emr/) and [blog](https://streamlinehealth.org/best-emr-platform/)'
        - - HospitalOS
          - The developer lists ISO/IEC 29110 software process certification, renewed on 8 March 2022. ==No Kenyan regulator named==.
          - '[Open Source Technology](https://opensource-technology.com/)'

  - discriminant: migrationPlan
    value:
      id: moving-your-clinic
      tone: plain
      heading: Bringing your clinic across, without losing a thing
      intro: >-
        Most clinics we onboard are moving off something that stopped fitting. Here is how the move works, and
        what is different depending on where you are coming from.
      steps:
        - title: We take the export
          body: You give us access or a file. We pull patient records, visit history, billing and stock out of your current system.
        - title: We map and import
          body: Your fields get matched to ours and checked with you before anything goes live. Duplicates and gaps are cleaned on the way in.
        - title: Your team trains
          body: Front desk, doctors and pharmacy each get a session on their own part of the day, with your account manager on hand.
        - title: You go live
          body: We run both systems in parallel for the first few days, so nothing is lost while your staff settle in.
      stats:
        - { value: 2 to 4 weeks, label: 'Single clinic, start to live' }
        - { value: 4 to 6 weeks, label: Multi-branch clinics and chains }
        - { value: No data loss, label: Parallel running until you sign off }
      systems:
        - name: HosiPoa
          comesAcross: Patient records, appointment history and billing data.
          lookAt: We review the export before we quote a date, so nothing is lost in the move off a hospital system.
        - name: Helium Health
          comesAcross: Patient records, clinical notes and billing history.
          lookAt: Field mapping is agreed with you first, since layouts differ between systems.
        - name: KenyaEMR or OpenMRS
          comesAcross: Patient records and programme data from your local install.
          lookAt: A database export mapped across by our team. We look at how the old system stored data before committing to a date.
        - name: Clinicea
          comesAcross: Patient records, CRM contacts, appointment and billing history.
          lookAt: CRM fields do not always have a direct equivalent, so we agree the mapping with you first.
        - name: Excel or paper
          comesAcross: Patient master list, visit history and stock data.
          lookAt: Column headings and duplicate patient entries get cleaned before import. Usually the quickest route of all.
        - name: An older on-premise system
          comesAcross: A full database export.
          lookAt: We review how the old system stored things before we commit to a date, rather than guessing.
      note: Every migration comes with a dedicated account manager, not a help article.

