  - discriminant: splitContent
    value:
      id: how-easy-clinic-stands-out
      tone: plain
      centerHeading: true
      mediaFirst: true
      alignTop: true
      stickyMedia: true
      heading: How Easy Clinic stands out for clinics in Kenya
      intro: >-
        Easy Clinic earns its place by running the whole clinic in one place, with tools that save the doctor and
        the front desk time on every visit. Four things do most of the work.
      body: |-
        ### One system, front desk to back office
        Appointments, records, billing, insurance and Slade claims, pharmacy, stock, lab, telemedicine and reports, plus a no-code workflow builder, all under one login. Each role, from reception to pharmacy, works from its own queue.

        ### Cura AI where it counts.
        Cura AI works in the background at registration, triage and the visit. It flags what does not add up and suggests diagnosis and treatment. The clinic sets the triggers, the doctor decides, and Cura AI is a paid add-on.

        ### Built for how Kenya pays and talks.
        M‑Pesa payments and Slade insurance claims from inside the record, and reminders and prescriptions over WhatsApp, SMS and email, in English and Swahili.

        ### Made to grow.
        One login across branches, with shared stock and central reports, plus a data warehouse for chains. HL7, FHIR and DICOM support and DHA certification today, with SHA e-claims in development and early access open to existing clients.

        Behind the features sits a long track record. Easy Clinic serves more than 5,000 doctors across 200+ cities in 18+ countries, has run clinics since 2003, and Penda Health's Nairobi clinics have used it since 2017.
      media:
        kind: screenshot
        src: ../../assets/images/best-clinic-management/01.webp
        alt: 'An Easy Clinic invoice in Kenyan shillings for a patient in Westlands, Nairobi: consultation, lab tests and pharmacy items totalling KSh 5,000, with KSh 4,000 claimed from Jubilee via Slade and the KSh 1,000 co-pay received by M-Pesa'
        frame: none

