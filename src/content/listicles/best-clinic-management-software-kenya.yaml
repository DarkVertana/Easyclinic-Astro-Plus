          items: [ENT, Ophthalmology, Orthopaedics, Urology, General surgery]
        - label: Mental health
          items: [Psychiatry, Psychology]

  - discriminant: splitContent
    value:
      id: when-to-switch
      tone: wash
      centerHeading: true
      heading: When should a clinic in Kenya switch to new software?
      body: |-
        The honest answer is that you switch the moment admin starts stealing time from patients.

        Most clinics do not move because of one dramatic failure. They move because the small costs add up, the front desk is always behind, and nobody can say with confidence how the practice is actually doing.
      link:
        label: Book a demo
        href: /kenyademo/
      media:
        kind: screenshot
        src: ../../assets/images/best-clinic-management/03.webp
        alt: 'Six signs it is time to switch: bookings and reminders still on phone calls, patient history on paper, a second location to run, billing, pharmacy and reports in separate tools, doctors stuck on notes, and insurance money slipping because billing is manual'
        frame: none

  - discriminant: splitContent
    value:
      id: how-easy-clinic-stands-out
      tone: plain
      centerHeading: true
      mediaFirst: true
      alignTop: true
      stickyMedia: true
      heading: How Easy Clinic stands out for clinics in Kenya
      intro: >-
        Easy Clinic earns its place by running the whole clinic in one place, with AI doing the heavy lifting.
        Four things do most of the work.
      body: |-
        ### One system, front desk to back office
        Appointments, records, billing, insurance and Slade claims, scheduling, pharmacy, stock, lab and radiology, reports, a no-code workflow builder and a branded patient app, all under one login.

        ### Cura AI where it counts.
        The AI helps finish a prescription in about three clicks, supports diagnosis, and runs wait time management, stock reorder and two-way patient messages.

        ### Built for how Kenya pays and talks.
        M‑Pesa payments and Slade insurance claims from inside the record, and reminders and prescriptions over WhatsApp, SMS and email, in English and Swahili.

        ### Made to grow.
        One shared view across branches, plus a data warehouse for chains. HL7, FHIR and DICOM are live today, with SHA e-claims in development and early access open to existing clients.

        Behind the features sits a long track record. Easy Clinic serves more than 5,000 doctors across 200 cities in 18 countries, handles over 200,000 prescriptions a day, and has supported clinics in Kenya and East Africa for more than 10 years.
      media:
        kind: screenshot
        src: ../../assets/images/best-clinic-management/01.webp
        alt: 'An Easy Clinic invoice in Kenyan shillings for a patient in Westlands, Nairobi: consultation, lab tests and pharmacy items totalling KSh 5,000, with KSh 4,000 claimed from Jubilee via Slade and the KSh 1,000 co-pay received by M-Pesa'
        frame: none

  - discriminant: prose
    value:
      id: verdict
      tone: wash
      heading: The verdict by clinic type
      body: >-
        For a private clinic of one to a few doctors, Clinicea ranks first here and suits a clinic that wants
        a free trial and custom forms, though it names no M-Pesa integration, while Easy Clinic, unranked
        here, suits a clinic that takes M-Pesa at the desk and wants AI note drafting, once you have
        its shilling price, which is not yet published. For a hospital or group that wants inpatient wards,
        mobile money payments, facility loans and AI note drafting from one company, Helium Health, second
        here, is the stronger fit, provided you are ready to ask for a quote. For a county or programme-funded
        facility, KenyaEMR is the national system, and an organisation with its own developers can build
        on OpenMRS.
      width: wide

  - discriminant: vendorList
    value:
      clean: true
      id: vendors
      tone: plain
      heading: The eight systems, one by one
      intro: >-
        The seven others in ranked order for a private clinic in Kenya, then Easy Clinic, unranked, in the same
        format. Each section gives what the vendor's own pages say, then what we would weigh.
      vendors:
        - id: clinicea
          name: Clinicea
          rank: 1
          bestFor: Growing private clinics and clinic chains
          url: https://clinicea.com/
          body: >-
            Clinicea is a cloud clinic platform founded in 2012, with a Kenya page, a Kenyan phone number and
            a Nairobi postal address. Its team turns a clinic's paper forms and consents into a custom EMR, prescriptions can
            be shared by SMS, WhatsApp or email, and a clinic-chain control panel lets head office set prices
            and discount limits for every branch and move stock between them. The pricing page lists three
            plans per practitioner per month in rupees, and the Kenya page says prices start at $59. We found
            no AI note drafting and no M-Pesa integration on the pages we read.
          pros:
            - A 14-day free trial, and no exit fee or minimum contract
            - 4.8 on Capterra from 43 reviews
            - Built for chains, with head-office controls
          cons:
            - No AI note drafting or M-Pesa named
            - The pricing page quotes rupees, and custom EMR forms cost extra
          facts:
            - label: Pricing page
              value: INR 1,999 (Starter), 2,999 (Pro) and 3,999 (Enterprise) per practitioner per month
              source: https://clinicea.com/pricing
              checkedOn: 2026-09-26
            - label: Custom EMR forms
              value: From INR 12,500 one-time, for up to 4 forms
              source: https://clinicea.com/pricing
              checkedOn: 2026-09-26
            - label: Reviews
              value: 4.8 on Capterra from 43 reviews
              source: https://www.capterra.com/p/131430/Clinicea/reviews/
              checkedOn: 2026-09-26

        - id: helium-health
          name: Helium Health
          rank: 2
          bestFor: Hospitals and facilities of any size that also want payment tools
          url: https://heliumhealth.com/
          body: >-
            Helium Health has worked across Sub-Saharan Africa and the Gulf since 2016, with offices in Lagos
            and at Ikigai Westlands in Nairobi, and it launched in Kenya in June 2021 with three Nairobi
            partners. HeliumOS covers records, appointments, pharmacy, labs,
            inpatient wards, billing and insurance claims, with multi-location support. HeliumScribe drafts
            notes from speech, and patients and staff get automated notifications by SMS, WhatsApp and
            email. HeliumWallet takes mobile money, transfers, POS and USSD, and HeliumCredit lends to
            facilities. No price is published, and we found no review page on Capterra or G2.
          pros:
            - AI note drafting and WhatsApp notifications in the same product
            - Inpatient wards, and specialty modules such as antenatal care and chemotherapy
            - Patient payments and facility loans from the same company
            - Multi-location support
          cons:
            - No published price, and no independent review score with a count
            - M-Pesa is not named; HeliumWallet says mobile money
          facts:
            - label: Nairobi office
              value: Ikigai Westlands, Peponi Road
              source: https://heliumhealth.com/
              checkedOn: 2026-09-26
            - label: AI documentation
              value: HeliumScribe, speech to clinical notes
              source: https://heliumhealth.com/helium-os/
              checkedOn: 2026-09-26

        - id: clinikehr
          name: ClinikEHR
          rank: 3
          bestFor: Solo practitioners and small clinics
          url: https://clinikehr.com/
          body: >-
            ClinikEHR, from Bettar Platforms in Delaware, is an AI-assisted record for small clinics and solo
            practitioners. Its price list is public: a free plan for two staff and 50 client records, then
            Essential at $80 a month and Team at $200 a month billed annually, or Essential at $99.90 billed
            monthly, with no long-term contract. The AI Note Taker turns speech into SOAP notes, and Team allows unlimited locations.
            Its about page lists clinics in Nigeria, Ghana, Sierra Leone, Uganda, Egypt and Namibia, not
            Kenya, and online payments go through Stripe or Paystack.
          pros:
            - Free plan and self-serve setup
            - AI Note Taker included for three clinicians on Essential
            - Unlimited locations on Team
          cons:
            - No Kenyan clinics or M-Pesa named
            - WhatsApp is a support channel, not a patient channel
            - Its AI coding suggests CPT procedure codes, a US billing set, alongside ICD-10
          facts:
            - label: Plans
              value: Free, Essential $80 and Team $200 a month billed annually, Enterprise on request
              source: https://clinikehr.com/pricing
              checkedOn: 2026-09-26
            - label: Setup
              value: Most practices are ready in an afternoon, per its pricing page
              source: https://clinikehr.com/pricing
              checkedOn: 2026-09-26

        - id: kenyaemr
          name: KenyaEMR
          rank: 4
          bestFor: Public and programme-funded facilities in Kenya
          url: https://kenyahmis.org/
          body: >-
            KenyaEMR is Kenya's national open-source EMR, a version of OpenMRS built to the Ministry of
            Health's 2011 Kenya EMR Standards and Guidelines and supported by Palladium Kenya under the
            PEPFAR-funded KeHMIS project. Kenya HMIS counts more than 2,200 active KenyaEMR sites. It began in
            HIV and TB care and now covers antenatal and postnatal care, lab and pharmacy; under TaifaCare it
            lists billing, a cashier module that can send an M-Pesa STK push from the bill, inventory and
            dispensing, and it reports to KHIS. Patients get
            SMS reminders through Ushauri. The OpenMRS wiki says it can be installed from a release or built
            from source, but none of the pages we read offers a private clinic support or a price.
          pros:
            - Kenya's national system, built to Ministry of Health standards
            - Open source, with a free service desk for its sites under KeHMIS III
            - In use at more than 2,200 sites
          cons:
            - No published support offer or price for a private clinic
            - No WhatsApp or AI note drafting named
          facts:
            - label: Project phase
              value: KeHMIS III, from October 2021, projected to run until September 2026
              source: https://kenyahmis.org/
              checkedOn: 2026-09-26
            - label: TaifaCare
              value: 718 live facilities in 4 counties
              source: https://kenyahmis.org/taifacare/
              checkedOn: 2026-09-26

        - id: openmrs
          name: OpenMRS
          rank: 5
          bestFor: Organisations with developers or an implementing partner
          url: https://openmrs.org/
          body: >-
            OpenMRS is the open-source EMR that KenyaEMR is built on, made by a global community, and its
            homepage counts more than 8,000 facilities. There is no licence fee, but its FAQ says to budget
            for implementation, training, maintenance and infrastructure, and that implementation usually
            needs systems analysis skills and technical support. It handles bookings across multiple sites,
            billing, stock and dispensing, and connects to DHIS2 and national systems through REST and FHIR
            APIs. It suits an organisation with its own developers.
          pros:
            - No licence fee and no vendor lock-in
            - Configurable forms and translation, with FHIR and DHIS2 connections
            - 4.7 on Capterra, though from only 3 reviews
          cons:
            - Needs a technical team or partner to install and maintain
            - No WhatsApp or AI note drafting on its product pages
          facts:
            - label: Cost
              value: Free and open source; budget for implementation, training, maintenance and infrastructure
              source: https://openmrs.org/faq/
              checkedOn: 2026-09-26

        - id: streamline-health
          name: Streamline Health
          rank: 6
          bestFor: Hospitals and clinics in Uganda
          url: https://streamlinehealth.org/
          body: >-
            Streamline Health Tech is a Ugandan company with offices in Kampala and Mbarara, and it says more
            than 100 facilities use its system. Its EMR covers outpatients, inpatients, theatre, lab, pharmacy
            and stores, with more than 10,000 patient safety prompts and automatic Uganda Ministry of Health
            HMIS reports. Its payments product takes Mobile Money and VISA, and a separate product runs
            community health insurance schemes. The five plans are priced on request, scaled to facility size
            and users, and it says most facilities go live within a week.
          pros:
            - Patient safety prompts at the point of care
            - Mobile money payments and community insurance tools
            - Most facilities live within a week, per its blog
          cons:
            - No Kenyan office or client named, and no published price
            - No WhatsApp or AI note drafting named
          facts:
            - label: Facilities
              value: 100+ hospitals, per its clients page
              source: https://streamlinehealth.org/our-clients/
              checkedOn: 2026-09-26
            - label: Pricing
              value: Scaled to facility size and user count
              source: https://streamlinehealth.org/best-emr-platform/
              checkedOn: 2026-09-26

        - id: hospitalos
          name: HospitalOS
          rank: 7
          bestFor: Small hospitals in Thailand
          url: https://sourceforge.net/projects/hospitalos/
          body: >-
            HospitalOS is free software under the GNU GPL from Open Source Technology Co., Ltd. in Thailand,
            built for small hospitals of 100 beds or fewer and 200 outpatients a day or fewer. Its SourceForge
            page lists Thai as the language, Java desktop screens on a PostgreSQL database, and a last update
            on 20 May 2022. The developer's site is in Thai, lists offices in Bangkok and Phuket, and offers
            Hospital OS Enterprise for public and private hospitals and clinics, with a module for Thai
            government reimbursement. We found nothing on Kenya, WhatsApp, M-Pesa, multi-branch use or AI
            documentation.
          pros:
            - Free, open-source licence (GPL v2)
            - Outpatient, inpatient, pharmacy, lab and dental modules
          cons:
            - Thai-language software with no Kenyan presence, last updated on SourceForge in May 2022
            - Downloaded and run on your own machines
          facts:
            - label: Licence
              value: GNU GPL v2
              source: https://sourceforge.net/projects/hospitalos/
              checkedOn: 2026-09-26

        - id: easyclinic
          name: Easy Clinic
          us: true
          bestFor: Private clinics from one doctor to a chain, paid by M-Pesa and insurers
          url: https://www.easyclinic.io/
          body: >-
            Easy Clinic has run clinics since {fact:founded}, and Penda Health's Nairobi clinics have used it
            since 2017. The patient's M-Pesa payment is recorded against the bill at reception, and claims to
            Jubilee, AAR, CIC, Britam and Resolution go through SLADE from the same bill, on Enterprise or as
            an add-on. Prescriptions print in English and Swahili, and the MOH 705 and DHIS2 reports come
            from the visits already recorded. Cura AI listens to the consult and drafts the note for the doctor to confirm, on every plan, and a
            clinic can be live in as little as {fact:goLiveDays} days. The limits matter in Kenya. The
            shilling price is not yet published, so this page gives no Easy Clinic price for Kenya and leaves
            it unranked; the US dollar list is on the [pricing page](/pricing/). It also does not run fully
            offline, so plan a second internet line.
          pros:
            - Priced per doctor, with no setup fee and no binding contract
            - M-Pesa and SLADE claims on the same bill
            - Cura AI note drafting on every plan
          cons:
            - The shilling price is not yet published
            - Does not run fully offline today
            - WhatsApp messages and a second branch need Premium
          facts:
            - label: Price in Kenya
              value: Shilling price not yet published
            - label: US dollar list
              value: From {price:usd.professional.annual} per doctor per month billed annually, on the [pricing page](/pricing/)
            - label: Kenya line
              value: '{contact:ke.phone}'

  - discriminant: prose
    value:
      id: what-they-cost
      tone: wash
      heading: What each one costs
      body: |-
        Two competitors publish a price. Clinicea's pricing page lists INR 1,999 to 3,999 per practitioner per month, its Kenya page says $59, and it offers a 14-day free trial with no exit fee ([pricing](https://clinicea.com/pricing)). ClinikEHR has a free plan, then $80 or $200 a month billed annually, or $99.90 a month for Essential billed monthly, with no long-term contract ([pricing](https://clinikehr.com/pricing)).

        Easy Clinic's shilling price is not yet published, so this page gives no Easy Clinic price for Kenya. Its US dollar list on the [pricing page](/pricing/) is {price:usd.professional.annual} per doctor per month on Professional and {price:usd.premium.annual} on Premium, both billed annually. Every plan includes a reception login and unlimited support and training, with no setup fee and no binding contract.

        Helium Health and Streamline Health quote on request. KenyaEMR, OpenMRS and the SourceForge edition of HospitalOS carry no licence fee, but OpenMRS tells you to budget for implementation, training, maintenance and infrastructure ([FAQ](https://openmrs.org/faq/)).

        The licence is one line of the cost. Add setup, moving your records across, computers and a second internet line, and the hours your staff spend learning the system in the first month.
      width: wide

faq:
  - question: Is this ranking biased, since Easy Clinic publishes it?
    answer: >-
      It could be, so we made it checkable and left Easy Clinic out of the ranking: every fact about the
      other seven links to the vendor's own page or a review site, read on 26 September 2026. Easy Clinic
      misses the price check because its shilling price is not yet published, which leaves it level with
      Helium Health on everything we weighed, so placing it within that tie would mean judging ourselves.
      Clinicea ranks first and Helium Health second, and KenyaEMR fits a county or programme facility
      better than any other system here.
  - question: Do I need a DHA-certified system to claim from SHA?
    answer: >-
      Yes, if your clinic wants to claim from SHA in the contracting cycle that starts on 1 October 2026:
      SHA requires contracted
      providers to use a health management information system certified by the Digital Health Agency, and
      it extended the deadline to 30 September 2026. Ask every vendor, Easy Clinic included, for its DHA
      certificate and check it with the agency before you sign.
  - question: Is KenyaEMR free for a private clinic?
    answer: >-
      The software is open source with no published licence fee, but none of the pages we read says what
      a private clinic would pay for setup or support. The OpenMRS wiki says KenyaEMR can be installed
      from a release or built from source. It is supported by Palladium Kenya under the PEPFAR-funded
      KeHMIS project, whose service desk gives its sites free support under KeHMIS III, projected to end in
      September 2026, and OpenMRS, which KenyaEMR is
      built on, says to budget for implementation, training, maintenance and infrastructure even without
      a licence fee.
  - question: What does Easy Clinic cost, and is there a price in shillings?
    answer: >-
      Easy Clinic's shilling price is not yet published, so this page cannot tell you what a clinic in
      Kenya would pay. The [pricing page](/pricing/) has the US dollar list, which starts at
      {price:usd.professional.annual} per doctor per month on Professional billed annually. Premium adds
      WhatsApp messages and more than one location, and every plan includes a reception login and
      unlimited support and training, with no setup fee and no binding contract.
  - question: Which of these send WhatsApp reminders to patients?
    answer: >-
      Easy Clinic and Helium Health both publish WhatsApp messages to patients, Easy Clinic on the Premium
      plan and Helium Health through automated notifications in HeliumOS. Clinicea lets you share
      prescriptions by WhatsApp, ClinikEHR lists WhatsApp only as a support channel, and KenyaEMR sends
      appointment and adherence reminders by SMS through Ushauri. We found no WhatsApp feature on the pages
      we read for the other three.
  - question: Does Easy Clinic work when the internet goes down?
    answer: >-
      No, Easy Clinic runs in a web browser over the internet and does not run fully offline today. If your
      clinic loses its connection for hours at a time, keep a mobile data hotspot beside the reception
      computer as a second line, and ask every vendor, Easy Clinic included, to show you what the screen
      does when the connection drops.
  - question: Which systems take M-Pesa at the desk?
    answer: >-
      Easy Clinic records a patient's M-Pesa payment against their bill at reception, and KenyaEMR's
      TaifaCare billing guide shows the cashier sending an M-Pesa STK push from the bill; none of the other
      six names M-Pesa on the pages we read. Helium Health's HeliumWallet and Streamline Health's payments
      product say they take mobile money. Clinicea names payment gateways such as Flutterwave and Stripe,
      and ClinikEHR takes online payments through the clinic's Stripe or Paystack accounts.
  - question: How long does it take to switch?
    answer: >-
      Easy Clinic can be live in as little as {fact:goLiveDays} days from the demo, with training in
      {fact:trainingDays} short sessions of about two hours in all. Streamline Health says most facilities
      are live within a week, and ClinikEHR says most practices are ready in an afternoon with self-serve
      setup. Clinicea's onboarding add-on assigns a product specialist who moves your data across.

