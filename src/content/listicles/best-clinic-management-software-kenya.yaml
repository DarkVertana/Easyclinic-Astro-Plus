  - discriminant: prose
    value:
      id: which-one-fits
      tone: wash
      width: wide
      heading: So which one fits your clinic?
      body: |-
        Easy Clinic fits a private clinic in Kenya that wants to run the whole day in one system. Reception books the patient and checks cover. The doctor writes a prescription in under 30 seconds. The patient pays by M-Pesa, and the insurance claim goes to Slade from the same bill. Reminders and prescriptions reach patients on WhatsApp in English or Swahili. When you open a second branch, it sits in the same login.

        If you run a public or donor funded facility, KenyaEMR is the national system built for that work.

        The quickest way to judge is a 20-minute demo built around your own clinic day.
      link:
        label: Book a demo
        href: /kenyademo/

  - discriminant: specialtyGrid
    value:
      id: built-for-your-speciality
      tone: plain
      heading: Built for how your speciality actually works
      intro: |-
        A dermatologist does not write a prescription the way a paediatrician does. Easy Clinic gives each speciality its own exam template, case sheet and prescription format, built from the way your clinic already works.

        - **Physiotherapy:** sell a 10-session package, take part payments, and see how many sessions are left at a glance.
        - **Dermatology and aesthetics:** take before and after photos, mark them up, and compare visits side by side.
        - **Orthopaedics:** joint-wise exam forms that print on your own letterhead.
        - **Nephrology:** weight-based doses the doctor edits for each patient.
        - **Diabetology:** sugar and HbA1c on one trend chart across every visit.
      groups:
        - label: Primary care
          items: [General practitioner, Family medicine, OPD and walk-in practice]
        - label: Dental
          items: [General dentistry, Orthodontics]
        - label: Skin and aesthetics
          items: [Dermatology, Cosmetic and aesthetic medicine, Trichology, Laser and hair removal, Plastic surgery]
        - label: Women's health
          items: [Obstetrics and gynaecology, IVF and fertility]
        - label: Child health
          items: [Paediatrics, Neonatology]
        - label: Medical specialities
          items: [Cardiology, Diabetology and endocrinology, Gastroenterology, Nephrology, Neurology, Oncology, Pulmonology, Rheumatology]
        - label: Surgical specialities
          items: [ENT, Ophthalmology, Orthopaedics, Urology, General surgery]
        - label: Mental health
          items: [Psychiatry, Psychology]

  - discriminant: splitContent
    value:
      id: when-to-switch
      tone: wash
      centerHeading: true
      heading: When should a clinic in Kenya switch to new software?
      body: |-
        The honest answer is that you switch the moment admin starts stealing time from patients.

        Most clinics do not move because of one dramatic failure. They move because the small costs add up, the front desk is always behind, and nobody can say with confidence how the practice is actually doing.
      link:
        label: Book a demo
        href: /kenyademo/
      media:
        kind: screenshot
        src: ../../assets/images/best-clinic-management/03.webp
        alt: Six signs it is time to switch
