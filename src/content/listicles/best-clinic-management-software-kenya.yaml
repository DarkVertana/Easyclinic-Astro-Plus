  - discriminant: vendorList
    value:
      clean: true
      id: vendors
      tone: plain
      heading: The eight systems, one by one
      intro: >-
        Easy Clinic first, then the other seven. Each one shows what it is, what it costs, where it is strong and
        where it falls short.
      vendors:
        - id: easyclinic
          name: Easy Clinic
          us: true
          bestFor: Private clinics from one doctor to a chain, paid by M-Pesa and insurers
          url: https://www.easyclinic.io/
          body: |-
            Easy Clinic is an electronic medical record and clinic management platform, in use since {fact:founded}. Penda Health's Nairobi clinics have run on it since 2017, and it is DHA certified in Kenya.

            #### What it does in a Kenyan clinic

            - Records the patient's M-Pesa payment against the bill at reception.
            - Sends claims to Jubilee, AAR, CIC, Britam and Resolution through Slade, from the same bill.
            - Prints medicine instructions and advice in English or Swahili.
            - Builds MOH 705 and DHIS2 reports from the visits already recorded.
            - SHA e-claims are in development, with early access for existing clients.

            #### What each plan covers

            - **Professional**, {price:usd.professional.annual} per doctor per month billed annually: appointments, the EMR with WhatsApp prescriptions, billing, dashboards, reminders and staff logins.
            - **Premium**, {price:usd.premium.annual}: adds video consultations, lab reports in the chart, a larger WhatsApp allowance and more than one location.
            - **Enterprise**, on a quote: adds pharmacy and insurance claims. Both are also available as add-ons.
            - **Cura AI**, the clinical AI copilot, is a paid add-on on any plan.

            #### Good to know

            - It runs in any browser on a laptop or tablet.
            - It does not run fully offline today, so keep a second internet line.
            - Shilling pricing is available on request.
          pros:
            - DHA certified, and priced per doctor with no setup fee for clinics up to 5 users
            - M-Pesa and Slade claims on the same bill
            - WhatsApp prescriptions and reminders on every plan, in English and Swahili
          cons:
            - Does not run fully offline today
            - A second branch needs Premium, and Cura AI is a paid add-on
          facts:
            - label: Published price
              value: '{price:usd.professional.annual} (Professional) or {price:usd.premium.annual} (Premium) per doctor per month billed annually; Enterprise on a quote'
            - label: Going live
              value: Most clinics within 2 to 4 weeks
            - label: Certification
              value: DHA certified, CERT-2026-MHA2Q9YM
            - label: Ratings
              value: 4.9 on Capterra from 11 reviews, and 4.8 on Google

        - id: clinicea
          name: Clinicea
          bestFor: Growing private clinics and clinic chains
          url: https://clinicea.com/
          body: >-
            Clinicea is a cloud clinic platform founded in 2012, with a Kenya page, a Kenyan phone number and
            a Nairobi postal address. Its team turns a clinic's paper forms and consents into a custom EMR, prescriptions can
            be shared by SMS, WhatsApp or email, and a clinic-chain control panel lets head office set prices
            and discount limits for every branch and move stock between them. The pricing page lists three
            plans per practitioner per month in rupees, and the Kenya page says prices start at $59. We found
            no AI note drafting and no M-Pesa integration on the pages we read.
          pros:
            - A 14-day free trial, and no exit fee or minimum contract
            - 4.8 on Capterra from 43 reviews
            - Built for chains, with head-office controls
          cons:
            - No AI note drafting or M-Pesa named
            - The pricing page quotes rupees, and custom EMR forms cost extra
          facts:
            - label: Published price
              value: INR 1,999 to 3,999 per practitioner per month; from $59 on its Kenya page
              source: https://clinicea.com/pricing
              checkedOn: 2026-09-26
            - label: Free trial
              value: 14 days, with no exit fee
              source: https://clinicea.com/pricing
              checkedOn: 2026-09-26
            - label: Ratings
              value: 4.8 on Capterra from 43 reviews
              source: https://www.capterra.com/p/131430/Clinicea/reviews/
              checkedOn: 2026-09-26

        - id: helium-health
          name: Helium Health
          bestFor: Hospitals and facilities of any size that also want payment tools
          url: https://heliumhealth.com/
          body: >-
            Helium Health has worked across Sub-Saharan Africa and the Gulf since 2016, with offices in Lagos
            and at Ikigai Westlands in Nairobi, and it launched in Kenya in June 2021 with three Nairobi
            partners. HeliumOS covers records, appointments, pharmacy, labs,
            inpatient wards, billing and insurance claims, with multi-location support. HeliumScribe drafts
            notes from speech, and patients and staff get automated notifications by SMS, WhatsApp and
            email. HeliumWallet takes mobile money, transfers, POS and USSD, and HeliumCredit lends to
            facilities. Pricing is shared on request.
          pros:
            - AI note drafting and WhatsApp notifications in the same product
            - Inpatient wards, and specialty modules such as antenatal care and chemotherapy
            - Patient payments and facility loans from the same company
            - Multi-location support
          cons:
            - No published price, and no independent review score with a count
            - M-Pesa is not named; HeliumWallet says mobile money
          facts:
            - label: Published price
              value: On a quote
              source: https://heliumhealth.com/
              checkedOn: 2026-09-26
            - label: In Kenya since
              value: June 2021, with an office in Westlands, Nairobi
              source: https://heliumhealth.com/helium-health-is-now-live-in-kenya/
              checkedOn: 2026-09-26
            - label: AI notes
              value: HeliumScribe
              source: https://heliumhealth.com/helium-os/
              checkedOn: 2026-09-26

        - id: clinikehr
          name: ClinikEHR
          bestFor: Solo practitioners and small clinics
          url: https://clinikehr.com/
          body: >-
            ClinikEHR, from Bettar Platforms in Delaware, is an AI-assisted record for small clinics and solo
            practitioners. Its price list is public: a free plan for two staff and 50 client records, then
            Essential at $80 a month and Team at $200 a month billed annually, or Essential at $99.90 billed
            monthly, with no long-term contract. The AI Note Taker turns speech into SOAP notes, and Team allows unlimited locations.
            Its about page lists clinics in Nigeria, Ghana, Sierra Leone, Uganda, Egypt and Namibia, not
            Kenya, and online payments go through Stripe or Paystack.
          pros:
            - Free plan and self-serve setup
            - AI Note Taker included for three clinicians on Essential
            - Unlimited locations on Team
          cons:
            - No Kenyan clinics or M-Pesa named
            - WhatsApp is a support channel, not a patient channel
            - Its AI coding suggests CPT procedure codes, a US billing set, alongside ICD-10
          facts:
            - label: Published price
              value: Free plan; Essential $80 or Team $200 a month billed annually
              source: https://clinikehr.com/pricing
              checkedOn: 2026-09-26
            - label: Contract
              value: No long-term contract
              source: https://clinikehr.com/pricing
              checkedOn: 2026-09-26
            - label: Going live
              value: Most practices in an afternoon, with self-serve setup
              source: https://clinikehr.com/pricing
              checkedOn: 2026-09-26

        - id: kenyaemr
          name: KenyaEMR
          bestFor: Public and programme-funded facilities in Kenya
          url: https://kenyahmis.org/
          body: >-
            KenyaEMR is Kenya's national open-source EMR, a version of OpenMRS built to the Ministry of
            Health's 2011 Kenya EMR Standards and Guidelines and supported by Palladium Kenya under the
            PEPFAR-funded KeHMIS project. Kenya HMIS counts more than 2,200 active KenyaEMR sites. It began in
            HIV and TB care and now covers antenatal and postnatal care, lab and pharmacy; under TaifaCare it
            lists billing, a cashier module that can send an M-Pesa STK push from the bill, inventory and
            dispensing, and it reports to KHIS. Patients get
            SMS reminders through Ushauri. The OpenMRS wiki says it can be installed from a release or built
            from source, but none of the pages we read offers a private clinic support or a price.
          pros:
            - Kenya's national system, built to Ministry of Health standards
            - Open source, with a free service desk for its sites under KeHMIS III
            - In use at more than 2,200 sites
          cons:
            - No published support offer or price for a private clinic
            - No WhatsApp or AI note drafting named
          facts:
            - label: Published price
              value: Open source, with no licence fee
              source: https://kenyahmis.org/taifacare/
              checkedOn: 2026-09-26
            - label: Sites
              value: 2,200+ active sites
              source: https://kenyahmis.org/
              checkedOn: 2026-09-26
            - label: Support
              value: Free service desk for KeHMIS sites
              source: https://kenyahmis.org/
              checkedOn: 2026-09-26

        - id: openmrs
          name: OpenMRS
          bestFor: Organisations with developers or an implementing partner
          url: https://openmrs.org/
          body: >-
            OpenMRS is the open-source EMR that KenyaEMR is built on, made by a global community, and its
            homepage counts more than 8,000 facilities. There is no licence fee, but its FAQ says to budget
            for implementation, training, maintenance and infrastructure, and that implementation usually
            needs systems analysis skills and technical support. It handles bookings across multiple sites,
            billing, stock and dispensing, and connects to DHIS2 and national systems through REST and FHIR
            APIs. It suits an organisation with its own developers.
          pros:
            - No licence fee and no vendor lock-in
            - Configurable forms and translation, with FHIR and DHIS2 connections
            - 4.7 on Capterra, though from only 3 reviews
          cons:
            - Needs a technical team or partner to install and maintain
            - No WhatsApp or AI note drafting on its product pages
          facts:
            - label: Published price
              value: No licence fee; budget for setup, training, upkeep and hosting
              source: https://openmrs.org/faq/
              checkedOn: 2026-09-26
            - label: Facilities
              value: 8,000+
              source: https://openmrs.org/
              checkedOn: 2026-09-26
            - label: Ratings
              value: 4.7 on Capterra from 3 reviews
              source: https://www.capterra.com/p/162059/OpenMRS-2/reviews/
              checkedOn: 2026-09-26

        - id: streamline-health
          name: Streamline Health
          bestFor: Hospitals and clinics in Uganda
          url: https://streamlinehealth.org/
          body: >-
            Streamline Health Tech is a Ugandan company with offices in Kampala and Mbarara, and it says more
            than 100 facilities use its system. Its EMR covers outpatients, inpatients, theatre, lab, pharmacy
            and stores, with more than 10,000 patient safety prompts and automatic Uganda Ministry of Health
            HMIS reports. Its payments product takes Mobile Money and VISA, and a separate product runs
            community health insurance schemes. The five plans are priced on request, scaled to facility size
            and users, and it says most facilities go live within a week.
          pros:
            - Patient safety prompts at the point of care
            - Mobile money payments and community insurance tools
            - Most facilities live within a week, per its blog
          cons:
            - No Kenyan office or client named, and no published price
            - No WhatsApp or AI note drafting named
          facts:
            - label: Published price
              value: On a quote, by facility size and users
              source: https://streamlinehealth.org/best-emr-platform/
              checkedOn: 2026-09-26
            - label: Going live
              value: Most facilities within a week
              source: https://streamlinehealth.org/best-emr-platform/
              checkedOn: 2026-09-26
            - label: Base
              value: Kampala and Mbarara, Uganda
              source: https://streamlinehealth.org/
              checkedOn: 2026-09-26

        - id: hospitalos
          name: HospitalOS
          bestFor: Small hospitals in Thailand
          url: https://sourceforge.net/projects/hospitalos/
          body: >-
            HospitalOS is free software under the GNU GPL from Open Source Technology Co., Ltd. in Thailand,
            built for small hospitals of 100 beds or fewer and 200 outpatients a day or fewer. Its SourceForge
            page lists Thai as the language, Java desktop screens on a PostgreSQL database, and a last update
            on 20 May 2022. The developer's site is in Thai, lists offices in Bangkok and Phuket, and offers
            Hospital OS Enterprise for public and private hospitals and clinics, with a module for Thai
            government reimbursement. We found nothing on Kenya, WhatsApp, M-Pesa, multi-branch use or AI
            documentation.
          pros:
            - Free, open-source licence (GPL v2)
            - Outpatient, inpatient, pharmacy, lab and dental modules
          cons:
            - Thai-language software with no Kenyan presence, last updated on SourceForge in May 2022
            - Downloaded and run on your own machines
          facts:
