faq:
  - question: Is this ranking biased, since EasyClinic publishes it?
    answer: >-
      It could be, so we made it checkable: EasyClinic publishes this page and ranks itself first, and
      every fact about the other seven links to the vendor's own page or a review site, read on 26
      September 2026. The verdict also names where others fit better: Helium Health for hospitals that want
      inpatient care and payments from one company, KenyaEMR for county and programme facilities, Clinicea
      if you want a free trial first, and OpenMRS for an organisation with its own developers.
  - question: Do I need a DHA-certified system to claim from SHA?
    answer: >-
      Yes, if your clinic wants to claim from SHA in the 2026/28 contracting cycle: SHA requires contracted
      providers to use a health management information system certified by the Digital Health Agency, and
      it extended the deadline to 30 September 2026. Ask every vendor, EasyClinic included, for its DHA
      certificate and check it with the agency before you sign.
  - question: Is KenyaEMR free for a private clinic?
    answer: >-
      The software is open source with no published licence fee, but none of the pages we read says what
      a private clinic would pay for setup or support. The OpenMRS wiki says KenyaEMR can be installed
      from a release or built from source. It is supported by Palladium Kenya under the PEPFAR-funded
      KeHMIS project, whose service desk gives its sites free support, and OpenMRS, which KenyaEMR is
      built on, says to budget for implementation, training, maintenance and infrastructure even without
      a licence fee.
  - question: What does EasyClinic cost, and is there a price in shillings?
    answer: >-
      EasyClinic costs {price:usd.professional.annual} per doctor per month on Professional billed
      annually, or {price:usd.professional.quarterly} billed quarterly, and a price in shillings is not
      published. Premium, which adds WhatsApp messages and more than one location, is
      {price:usd.premium.annual} billed annually. Every plan includes a reception login and unlimited
      support and training, with no setup fee and no binding contract.
  - question: Which of these send WhatsApp reminders to patients?
    answer: >-
      EasyClinic and Helium Health both publish WhatsApp messages to patients, EasyClinic on the Premium
      plan and Helium Health through automated notifications in HeliumOS. Clinicea lets you share
      prescriptions by WhatsApp, ClinikEHR lists WhatsApp only as a support channel, and KenyaEMR sends
      appointment and adherence reminders by SMS through Ushauri. We found no WhatsApp feature on the pages
      we read for the other three.
  - question: Does EasyClinic work when the internet goes down?
    answer: >-
      No, EasyClinic runs in a web browser over the internet and does not run fully offline today. If your
      clinic loses its connection for hours at a time, keep a mobile data hotspot beside the reception
      computer as a second line, and ask every vendor, EasyClinic included, to show you what the screen
      does when the connection drops.
  - question: Which systems take M-Pesa at the desk?
    answer: >-
      EasyClinic records a patient's M-Pesa payment against their bill at reception, and none of the other
      seven names M-Pesa on the pages we read. Helium Health's HeliumWallet and Streamline Health's payments
      product say they take mobile money. Clinicea names payment gateways such as Flutterwave and Stripe,
      and ClinikEHR takes online payments through the clinic's Stripe or Paystack accounts.
  - question: How long does it take to switch?
    answer: >-
      EasyClinic can be live in as little as {fact:goLiveDays} days from the demo, with training in
      {fact:trainingDays} short sessions of about two hours in all. Streamline Health says most facilities
      are live within a week, and ClinikEHR says most practices are ready in an afternoon with self-serve
      setup. Clinicea's onboarding add-on assigns a product specialist who moves your data across.

