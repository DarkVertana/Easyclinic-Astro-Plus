editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The M-Pesa payment on the same bill as a SLADE claim to Jubilee or AAR, the SHA rule that contracted
    clinics need a DHA-certified system by 30 September 2026, KenyaEMR's place as the national EMR at more
    than 2,200 sites, and Penda Health's Nairobi clinics on EasyClinic since 2017 are specific to a clinic
    owner in Kenya.
  readsMachineWritten: >-
    The eight vendor sections share one shape and rhythm, the table repeats "Not published" in many cells,
    and the page cannot give EasyClinic's SHA or DHA status, a shilling price or a Capterra review count,
    which a Kenyan owner will notice first.

notes:
  - >-
    Structure: spec 5.14 (byline and date from the template; verdict by clinic type; how we compared with
    criteria, date, sources and a disclosure; ranked comparisonTable; one vendor section each with pros and
    cons; decisionMatrix; FAQ 8; sourceList) with the section 11 Healthie order (TL;DR in openingAnswer, who
    each is for in the Best for row, table, workflow tests, pricing, FAQ). The live page
    (https://www.easyclinic.io/best-clinic-management-software-kenya/, read 2026-09-26) had no outbound
    sources, so no fact was carried over from it; its eight-vendor shortlist is kept. Its unsourced claims
    (SHA "Soon", "2-4 week setup", "per user and per location" pricing, the Dr Wanjiku and Mombasa personas,
    "90 minutes of typing") are dropped.
  - >-
    Regulator column dropped from the comparisonTable because EasyClinic's SHA, DHA, eTIMS and SMART status
    is unknown (regulators/ke-*.yaml null). Competitor regulator statements are in a dataTable instead, as
    each vendor publishes them. The SHA rule and the 30 September 2026 deadline come from Capital FM,
    1 September 2026; the same text is on allAfrica (https://allafrica.com/stories/202609010210.html). The DHA
    registry page (certification.dha.go.ke/registry) renders its list in JavaScript; its public API
    (https://service.dha.go.ke/api/public/registry/listings, read 2026-09-26) listed 21 active certificates
    (17 of them HMIS, e.g. Slade 360 HMIS by Safaricom, Tiberbu CareVerse, Smarthealth+) and NONE
    for any of the eight systems on this page, EasyClinic included. The page does not say so: the writing
    rules bar stating EasyClinic's status, and naming only the competitors' absence would imply EasyClinic
    might be listed. OWNER ACTION: the live /kenyademo/ says "DHA Certified"; the registry does not show it.
    Once EasyClinic's DHA and SHA status is confirmed with a date, add a regulator row to the table with
    every vendor (registry-sourced) and remove the "does not state" sentences.
  - >-
    Not found (cells say Not published): Helium Health price and any review page (Capterra listing
    /p/184250/ now 404); Streamline Health price (all five plans "Request Pricing"), Kenya presence, WhatsApp,
    multi-branch and AI documentation; KenyaEMR price or private-clinic route, multi-branch, WhatsApp, AI
    documentation and reviews; ClinikEHR on Capterra (its homepage claims 4.8 from 5,000+ reviews with no
    site named); OpenMRS WhatsApp and AI documentation; HospitalOS almost everything beyond licence and
    scope; M-Pesa by name for every competitor.
  - >-
    Clinicea shows two prices: INR 1,999/2,999/3,999 per practitioner per month on /pricing (the same via
    WebFetch, so not geolocated to our request) and "Starts at just $59" on /kenya1; the table cites the
