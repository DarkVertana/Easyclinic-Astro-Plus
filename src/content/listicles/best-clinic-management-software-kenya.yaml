faq:
  - question: Is Easy Clinic DHA certified for SHA claims?
    answer: >-
      Yes. Easy Clinic is certified by the Digital Health Agency, certificate CERT-2026-MHA2Q9YM, valid to 16
      October 2028. Since 1 October 2026, SHA accepts claims only from clinics on a certified system. SHA e-claims
      inside Easy Clinic are in development, with early access open to existing clients.
  - question: Can patients pay by M-Pesa at reception?
    answer: >-
      Yes. The receptionist takes the M-Pesa payment, and it is recorded against the patient's bill straight away.
      One invoice covers the consultation, tests and medicines, and the receipt can go to the patient on WhatsApp.
      Part payments, advances and the insurance share all sit on the same bill.
  - question: Which insurers can we claim from?
    answer: >-
      Easy Clinic sends claims through Slade to insurers such as Jubilee, AAR, CIC, Britam and Resolution, straight
      from the patient's bill. The plan is linked at registration, so cover is checked before the consultation.
      Insurance claims come with Enterprise, or as an add-on on Professional and Premium.
  - question: How much does Easy Clinic cost in Kenya?
    answer: >-
      Easy Clinic is priced per doctor. Professional is {price:usd.professional.annual} and Premium
      {price:usd.premium.annual} per doctor per month, billed annually, and Enterprise is on a quote. Every plan
      includes a login for your receptionist at no extra cost, and there is no setup fee for clinics up to 5 users.
      Ask us for shilling pricing.
  - question: Can Easy Clinic send WhatsApp reminders in Swahili?
    answer: >-
      Yes. Prescriptions, invoices, lab reports and appointment reminders go out on WhatsApp on every plan, with a
      monthly allowance by plan. Reminders go the day before and again on the day of the visit, never at night.
      Medicine instructions and advice can print in English or Swahili.
  - question: Is Cura AI included in every plan?
    answer: >-
      Cura AI is a paid add-on that works with any plan. It runs in the background at registration, triage and the
      consultation. It flags what does not add up, such as a missed allergy, and suggests diagnosis and treatment.
      The clinic sets the triggers and alert style, and the doctor always makes the final decision.
  - question: Does Easy Clinic produce Ministry of Health reports?
    answer: >-
      Yes. The MOH 705 and DHIS2 reports come from the visits your team has already recorded, so nobody compiles
      them by hand at month end. Easy Clinic also gives you about 25 standard reports and clinical and financial
      dashboards, all exportable to Excel or PDF.
  - question: What happens when we open a second branch?
    answer: >-
      You move to Premium, which covers more than one location. Each branch sits in a location dropdown under the
      same login, with shared patient records and one shared stock. Enterprise adds central control of every
      location and a Power BI data warehouse for clinic chains.
  - question: Does Easy Clinic work when the internet drops?
    answer: >-
      Easy Clinic is cloud software that runs in any browser on a laptop or tablet, so it needs a connection. It
      does not run fully offline today. Most clinics keep a mobile data hotspot beside the reception computer as a
      backup line, so registration, prescriptions and billing carry on if the main line drops.
  - question: How long does it take to switch to Easy Clinic?
    answer: >-
      Most clinics go live within 2 to 4 weeks. Easy Clinic builds your prescription format from your own sample,
      imports records from your old system, and trains reception, doctors, lab and pharmacy on their own part of
      the day. Your dedicated account manager stays with you after go-live.

