  - discriminant: prose
    value:
      id: which-one-fits
      tone: wash
      width: wide
      heading: So which one fits your clinic?
      body: |-
        If you run a public or donor funded facility, KenyaEMR and OpenMRS are built for that world. If you need the public SHA scheme live today, HosiPoa is worth a serious look, and we will say so rather than waste your time.

        Where Easy Clinic makes most sense is a growing private clinic that wants to run the whole practice in one place. Cura AI in the room with the patient. M‑Pesa payments and Slade insurance claims from inside the record. Reminders and prescriptions over WhatsApp in English and Swahili. Appointments, records, billing, pharmacy, lab and reports in a single system that does not need replacing when you open the second branch.

        The fastest way to know is to watch it run on your own workflow for fifteen minutes.
      link:
        label: Book a demo
        href: /kenyademo/

