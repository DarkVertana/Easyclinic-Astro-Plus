sections:
  - discriminant: prose
    value:
      id: verdict
      heading: The verdict by clinic type
      body: >-
        For a private clinic of one to a few doctors, Clinicea ranks first here and suits a clinic that wants
        a free trial and custom forms, though it names no M-Pesa integration, while Easy Clinic, unranked
        here, suits a clinic that takes M-Pesa at the desk and wants AI note drafting, once you have
        its shilling price, which is not yet published. For a hospital or group that wants inpatient wards,
        mobile money payments, facility loans and AI note drafting from one company, Helium Health, second
        here, is the stronger fit, provided you are ready to ask for a quote. For a county or programme-funded
        facility, KenyaEMR is the national system, and an organisation with its own developers can build
        on OpenMRS.
      width: measure

  - discriminant: prose
    value:
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** Easy Clinic publishes this page. We rank the seven other systems and leave Easy Clinic unranked, at the end of the table and the list, for the reason given under "How we ranked" and "Ties" below. Every fact about the other seven systems links to the page it came from.

        **When and where.** We read each vendor's own website on 26 September 2026. Review scores come from Capterra, with the number of reviews, except ClinikEHR's, which is the figure on its own homepage; HospitalOS facts come from its SourceForge page and its developer's site, and KenyaEMR facts from Kenya HMIS (the Palladium Kenya project site) and the OpenMRS wiki. Where a vendor's pages did not say, the cell reads "Not published" with the date.

        **What we compared.** A Kenya presence the vendor publishes, the pricing model and any published price, WhatsApp messages to patients, running more than one branch, AI note drafting, M-Pesa or mobile money at the desk, and a review score with its count.

        **How we ranked.** For a private, fee-paying clinic in Kenya we weighed two checks first, a Kenya presence the vendor publishes and a published price, then the four daily features above; an independent review score with its count broke ties. Clinicea is the only system that meets both of the first two checks, so it ranks first. Easy Clinic meets the Kenya presence check and all four daily features, and misses the price check, because the shilling price a Kenyan clinic would pay is not yet published. ClinikEHR's pricing page is in dollars, and Clinicea's Kenya page gives $59 without saying per what, yet both meet the check, because we take each competitor's published price as it stands and hold our own dollar list to a stricter test. ClinikEHR and KenyaEMR each meet one of the first two checks, a published price for ClinikEHR and a Kenya presence for KenyaEMR, and ClinikEHR sits above because it has two of the daily features, more than one branch and AI note drafting, where KenyaEMR has M-Pesa alone. We chose the checks, and the four daily features suit Easy Clinic: a clinic that puts a Nairobi office or a free trial first should read Helium Health and Clinicea before us.

        **Ties.** Helium Health and Easy Clinic are level on everything we weighed: each publishes a Kenya presence and all four daily features, and neither publishes a price for Kenya. A review score with its count is the tie-break, and neither has one on this page: Easy Clinic's Capterra score appears without the review count we ask of every other vendor, and Helium Health has no review page we could find. With the tie unbroken, the order within it would be our own judgment of ourselves, so Easy Clinic has no rank and Helium Health is second. Lower down, OpenMRS and Streamline Health meet neither of the first two checks and one daily feature each, and OpenMRS sits above because it has independent reviews, 4.7 on Capterra from 3 reviews, and Streamline Health has none we could find.

        **What this page leaves out.** Easy Clinic's own cells come from its published plans and its US dollar price list, and its shilling price is not yet published. The page gives Easy Clinic's Capterra rating without a review count, and it does not state Easy Clinic's SHA or Digital Health Agency status. The eight systems are the ones on the earlier version of this page; Kenyan-built systems are not covered in this edition.
      width: measure

