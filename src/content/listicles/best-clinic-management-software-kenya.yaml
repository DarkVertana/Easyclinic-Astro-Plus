sections:
  - discriminant: prose
    value:
      id: verdict
      heading: The verdict by clinic type
      body: >-
        For a private clinic of one to a few doctors that takes M-Pesa at the desk and claims from
        insurers, choose EasyClinic if you want AI note drafting and WhatsApp reminders, or Clinicea if
        you want a free trial and custom forms first. For a hospital or group that wants inpatient wards,
        mobile money payments, facility loans and AI note drafting from one company, Helium Health is the
        stronger fit, provided you are ready to ask for a quote. For a county or programme-funded
        facility, KenyaEMR is the national system, and an organisation with its own developers can build
        on OpenMRS.
      width: measure

  - discriminant: prose
    value:
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** EasyClinic publishes this page, and it ranks EasyClinic first. Judge that against the sources: every fact about the other seven systems links to the page it came from.

        **When and where.** We read each vendor's own website on 26 September 2026. Review scores come from Capterra, with the number of reviews, except ClinikEHR's, which is the figure on its own homepage; HospitalOS facts come from its SourceForge page and its developer's site, and KenyaEMR facts from Kenya HMIS (the Palladium Kenya project site) and the OpenMRS wiki. Where a vendor's pages did not say, the cell reads "Not published" with the date.

        **What we compared.** A Kenya presence the vendor publishes, the pricing model and any published price, WhatsApp messages to patients, running more than one branch, AI note drafting, M-Pesa or mobile money at the desk, and a review score with its count.

        **How we ranked.** For a private, fee-paying clinic in Kenya we weighed a Kenya presence and a published price first, and the four daily features above next; independent reviews broke ties. ClinikEHR sits above KenyaEMR because a private clinic can sign up to ClinikEHR from a public price list today, while none of the KenyaEMR pages we read offers a private clinic support or a price.

        **What this page leaves out.** EasyClinic's own cells come from its published plans and prices. The page gives EasyClinic's Capterra rating without a review count, and it does not state EasyClinic's SHA or Digital Health Agency status. The eight systems are the ones on the earlier version of this page; Kenyan-built systems are not covered in this edition.
      width: measure

