  - discriminant: vendorList
    value:
      id: vendors
      heading: The four systems, one by one
      intro: >-
        The three others in ranked order for a clinic in Ethiopia, then Easy Clinic, unranked, in the same format.
        Each section gives what the vendor's own pages say, then what we would weigh.
      vendors:
        - id: doctorsapp
          name: DoctorsApp
          rank: 1
          bestFor: Clinics that want a published annual price, AI note drafting and WhatsApp credits
          url: https://www.doctorsapp.in/
          body: >-
            DoctorsApp is an Indian EMR, EHR and hospital system that publishes an article on HMIS software for
            hospitals in Ethiopia, and its homepage says it is available in 6 countries without naming them. Its
            AI medical scribe turns a doctor's voice consultation into structured SOAP notes, it lists
            telemedicine with video consultations, and its clinic plans include WhatsApp credit points. Clinic
            plans are priced per year in rupees, Silver at Rs. 10,999 and Gold at Rs. 16,999 before GST, with
            hospital and nursing home plans on request. We found no branch control and no Ethiopian payment
            method on the pages we read.
          pros:
            - A published annual price for clinics
            - AI note drafting from the doctor's voice
            - WhatsApp credits and telemedicine
          cons:
            - Prices in Indian rupees, with Indian GST
            - No branch control or Ethiopian payment named
          facts:
            - label: Clinic plans
              value: Rs. 10,999 (Silver) and Rs. 16,999 (Gold) a year, before 18% GST
              source: https://www.doctorsapp.in/pricing
              checkedOn: 2026-10-14

        - id: softclinic-genx
          name: SoftClinic GenX
          rank: 2
          bestFor: Hospitals, clinics and diagnostic labs that want cloud or on-premise installation
          url: https://www.softclinicsoftware.com/
          body: >-
            SoftClinic GenX is hospital, clinic and laboratory software that says it is available in Ethiopia,
            naming Addis Ababa, Dire Dawa, Mekelle, Gondar and Hawassa. One system runs OPD and IPD, registration
            and appointments, billing, pharmacy, inventory, a laboratory information system and the EMR, with
            wards, beds and the operation theatre for hospitals. It installs on the cloud or on-premise, and its
            clinic page says it is ideal for managing hospital chains. We found no price, no WhatsApp messages
            and no AI note drafting on the pages we read.
          pros:
            - Cloud or on-premise installation
            - Hospital modules, from wards to the operation theatre
            - A laboratory information system included
          cons:
            - No price published
            - No WhatsApp or AI note drafting named
          facts:
            - label: Cities named in Ethiopia
              value: Addis Ababa, Dire Dawa, Mekelle, Gondar and Hawassa
              source: https://www.softclinicsoftware.com/hospital-management-software-in-ethiopia/
              checkedOn: 2026-10-14
            - label: Installation
              value: Cloud or on-premise
              source: https://www.softclinicsoftware.com/clinic-management-software/
              checkedOn: 2026-10-14

        - id: smart-hospital-manager
          name: Smart Hospital Manager
          rank: 3
          bestFor: Facilities that want to pay once and keep the software on their own server
          url: https://smarthospitalmanager.com/
          body: >-
            Smart Hospital Manager publishes an Ethiopia page that sells a lifetime licence: pay once and use it
