              value: Birr price not yet published
            - label: US dollar list
              value: From {price:usd.professional.annual} per doctor per month billed annually, on the [pricing page](/pricing/)

  - discriminant: stepList
    value:
      id: workflow-tests
      heading: Five tests to run in every demo
      intro: >-
        Feature lists look alike. Run the same tests with every vendor, on a patient day like yours, and watch how
        many screens each one needs.
      steps:
        - title: Front desk test
          body: >-
            With a queue waiting, book a walk-in and take a cash and a telebirr payment. None of the four names
            telebirr on its pages, so ask each one to show how the payment is recorded against the bill.
        - title: Doctor context test
          body: >-
            Open a returning patient and look for the last prescription and lab results on the same screen as the
            history. Then dictate a note: Easy Clinic (Cura AI) and DoctorsApp (AI medical scribe) publish note
            drafting; we found none on the other two systems' pages.
        - title: Connection test
          body: >-
            Pull the network cable halfway through a consult and see what is saved. Easy Clinic and DoctorsApp run
            over the internet; SoftClinic GenX and Smart Hospital Manager can run on your own server instead.
        - title: Follow-up test
          body: >-
            Send a reminder and a prescription to a patient's phone, and ask which channel it uses and which plan
            it needs. On Easy Clinic, WhatsApp starts on Premium and SMS and email come with Professional.
        - title: Cost test
          body: >-
            Ask for the full price in birr for your clinic size, including setup, moving your records across,
            and, for a server you host, the machine, backups and the staff time to run it.

  - discriminant: prose
    value:
      id: what-they-cost
      heading: What each one costs
      body: |-
        Only DoctorsApp publishes a price: Silver at Rs. 10,999 and Gold at Rs. 16,999 a year for a clinic, before 18% GST, with hospitals and nursing homes on request ([pricing](https://www.doctorsapp.in/pricing)).

        Smart Hospital Manager sells a lifetime licence, pay once and own it, but publishes no figure ([Ethiopia page](https://smarthospitalmanager.com/pages/managementsoftware/ethiopia/)). SoftClinic GenX publishes no price on its Ethiopia or clinic pages.

        Easy Clinic's birr price is not yet published, so this page gives no Easy Clinic price for Ethiopia. Its US dollar list on the [pricing page](/pricing/) is {price:usd.professional.annual} per doctor per month on Professional and {price:usd.premium.annual} on Premium, both billed annually. Every plan includes a reception login, with no setup fee and no binding contract.

        The licence is one line of the cost. A pay-once licence on your own server adds the server, backups, updates and the staff time to run them; a cloud subscription folds those in. Add setup, moving your records across and a second internet line, and ask every vendor for a quote in birr.
      width: measure

  - discriminant: decisionMatrix
    value:
      id: when-to-choose-which
      heading: When to choose which
      options:
        - title: Choose DoctorsApp if
          items:
            - You want a published annual price before you talk to sales.
            - Your doctors want an AI scribe that turns the consult into SOAP notes.
            - You want WhatsApp credits and telemedicine in a clinic plan.
            - You are comfortable paying in rupees with Indian GST.
        - title: Choose SoftClinic GenX or Smart Hospital Manager if
          items:
            - You run a hospital and need wards, beds, the operation theatre and a lab system, which SoftClinic GenX lists.
            - You want the software and patient data on your own server, which both offer.
            - You would rather pay once than every month, which Smart Hospital Manager's lifetime licence offers.
            - You have someone to run the server, backups and updates.
        - title: Choose Easy Clinic if
          us: true
          items:
            - You run a connected private clinic, from one doctor to several branches, and want one cloud system.
            - Your doctors want Cura AI to listen to the consult and draft the note.
            - Your patients read WhatsApp more than SMS, and you are ready for Premium.
            - You will get the birr price per doctor in writing before you sign, since it is not yet published.

