sections:
  - discriminant: prose
    value:
      id: verdict
      heading: The verdict by clinic type
      body: >-
        For a private clinic of one to a few doctors that wants a published annual price, WhatsApp messages and AI
        note drafting, DoctorsApp ranks first here, though its prices are in Indian rupees and its pages name no
        branch control. For a hospital, or a facility that wants its software and data on its own server,
        SoftClinic GenX, second here, offers cloud or on-premise installation with OPD, IPD, wards and a
        laboratory system. For a facility that would rather pay once than subscribe, Smart Hospital Manager,
        third, sells a lifetime licence on your own server. Easy Clinic, unranked here, suits a connected
        private clinic or group that wants Cura AI to draft the note and WhatsApp reminders on one cloud system,
        once you have its price in birr.
      width: measure

  - discriminant: prose
    value:
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** Easy Clinic publishes this page. We rank the three other systems and leave Easy Clinic unranked, at the end of the table and the list, for the reason given under "How we ranked" below. Every fact about the other three systems links to the page it came from.

        **When and where.** We read each vendor's own website on 14 October 2026, starting from the Ethiopia page each one publishes. Where a vendor's pages did not say, the cell reads "Not published" with the date. Capterra lists SoftClinic and Doctors App, but its pages could not be read on that date, so this page gives no review score for any of the four.

        **What we compared.** An Ethiopia page the vendor publishes, the pricing model and any published price, WhatsApp messages to patients, running more than one branch, AI note drafting, and whether it can run on the clinic's own server.

        **How we ranked.** For a clinic in Ethiopia we weighed two checks first, an Ethiopia page the vendor publishes and a published price, then three daily features: WhatsApp messages to patients, more than one branch and AI note drafting. All three competitors publish an Ethiopia page. DoctorsApp is the only one that publishes a price, and it has two of the daily features, so it ranks first. Its prices are in rupees, but we take each competitor's published price as it stands and hold our own US dollar list to a stricter test. SoftClinic GenX ranks above Smart Hospital Manager because it names hospital chains, one daily feature, where Smart Hospital Manager names none.

        **Why Easy Clinic is unranked.** Easy Clinic publishes all three daily features but misses the price check, because the birr price a clinic in Ethiopia would pay is not yet published. As on our Kenya, Nigeria and UAE comparisons, we do not place ourselves in a ranking we wrote while our local price is unpublished.

        **What this page leaves out.** Easy Clinic's cells come from its published plans and its US dollar price list. The page does not state any vendor's position under Ethiopia's Personal Data Protection Proclamation of 2024, Easy Clinic included, and it does not cover telebirr, which none of the four names on the pages we read.
      width: measure

