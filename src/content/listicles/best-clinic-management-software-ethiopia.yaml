faq:
  - question: Is this ranking biased, since Easy Clinic publishes it?
    answer: >-
      It could be, so we made it checkable and left Easy Clinic out of the ranking: every fact about the other
      three links to the vendor's own page, read on 14 October 2026. Easy Clinic misses the price check because
      its birr price is not yet published, and we do not place ourselves in a ranking we wrote.
  - question: Which of these work without the internet?
    answer: >-
      SoftClinic GenX and Smart Hospital Manager can be installed on your own server, which keeps working inside
      the clinic when the internet drops. Easy Clinic runs in a web browser over the internet and does not run
      fully offline today, and DoctorsApp's FAQ says to log in from a device with internet access.
  - question: Is it cheaper to pay once or subscribe?
    answer: >-
      A pay-once licence, like Smart Hospital Manager's, can cost less upfront, but you take on the server,
      backups, updates and staff time. A cloud subscription folds those in, so compare the total over a few
      years, in birr, before you decide.
  - question: Which of these take telebirr at the desk?
    answer: >-
      None of the four names telebirr on the pages we read on 14 October 2026, Easy Clinic included. Ask each
      vendor to show how a telebirr or cash payment is recorded against the patient's bill before you sign.
  - question: Which send WhatsApp reminders to patients?
    answer: >-
      Easy Clinic sends WhatsApp reminders and messages on the Premium plan, and DoctorsApp includes WhatsApp
      credit points in its clinic plans. Smart Hospital Manager names automated reminders without the channel,
      and we found no WhatsApp feature on SoftClinic GenX's pages.
  - question: What does Easy Clinic cost in Ethiopia?
    answer: >-
      Easy Clinic's birr price is not yet published, so this page cannot tell you what a clinic in Ethiopia
      would pay. The [pricing page](/pricing/) has the US dollar list, which starts at
      {price:usd.professional.annual} per doctor per month on Professional billed annually, with no setup fee and
      no binding contract.

