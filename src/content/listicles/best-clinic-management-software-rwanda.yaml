  - discriminant: vendorList
    value:
      id: vendors
      heading: The three systems, one by one
      intro: The two others in ranked order for a clinic in Rwanda, then Easy Clinic, unranked, in the same format.
      vendors:
        - id: carelogic
          name: CareLogic
          rank: 1
          bestFor: Rwandan clinics whose income runs through RSSB, Mutuelle de Santé and private insurers
          url: https://usecarelogic.com/en
          body: >-
            CareLogic, from CareLogic Technologies at Norrsken House in Kigali, is a browser-based clinic system that names
            Rwandan clinics such as Kigali Health Center and Ubuzima Polyclinic. It prepares and tracks claims for RSSB,
            Mutuelle de Santé and private insurers from Medical Plus, takes payments including MoMo, lets patients join the
            queue by WhatsApp bot and sends SMS reminders. Plans are 150,000, 250,000 and 450,000 Rwandan francs a month,
            with branches on Hospital Suite. It works in English and French, and we found no AI note drafting.
          pros:
            - RSSB, Mutuelle de Santé and private insurance claims
            - Published prices in Rwandan francs
            - A Kigali company with named Rwandan clinics
          cons:
            - Claims need Medical Plus, branches need Hospital Suite
            - No AI note drafting named
          facts:
            - label: Plans
              value: 150,000, 250,000 and 450,000 RWF a month (Clinic Starter, Medical Plus, Hospital Suite)
              source: https://usecarelogic.com/pricing
              checkedOn: 2026-10-14

        - id: mocdoc
          name: MocDoc
          rank: 2
          bestFor: Clinics to multi-specialty hospitals, from 10 beds to 300 or more
          url: https://mocdoc.com/rwanda
          body: >-
            MocDoc, from Chennai, publishes a Rwanda page for clinics in Kigali to multi-specialty hospitals. It works in
            English, Kinyarwanda and French, manages several locations centrally, and sends notifications by SMS, WhatsApp
            and email. It is fully cloud-based and names health insurance workflows aligned with national systems, without
            naming RSSB or Mutuelle. Its hospital system costs from $4,200 a year; we found no clinic price and no AI.
          pros:
            - Kinyarwanda and French
            - WhatsApp and several sites
          cons:
            - No RSSB or Mutuelle named
            - Hospital prices only, in US dollars
          facts:
            - label: Languages
              value: English, Kinyarwanda and French
              source: https://mocdoc.com/rwanda
              checkedOn: 2026-10-14

        - id: easyclinic
          name: Easy Clinic
          us: true
          bestFor: Connected private clinics, from one doctor to a group, that want AI notes and WhatsApp
          url: https://www.easyclinic.io/
          body: >-
            Easy Clinic has run clinics since {fact:founded} and is used by {fact:doctors} doctors in {fact:countries}
            countries. Cura AI listens to the consult and drafts the note for the doctor to confirm, on every plan, and
            WhatsApp reminders, video consultations and more than one location come with Premium. The limits matter in
            Rwanda. It names no RSSB or Mutuelle claims, Kinyarwanda or MoMo, and its franc price is not yet published.
          pros:
            - Cura AI note drafting on every plan
            - WhatsApp, video consultations and branches on Premium
          cons:
            - No RSSB or Mutuelle claims named
            - The franc price is not yet published
          facts:
            - label: Price in Rwanda
              value: Franc price not yet published
            - label: US dollar list
              value: From {price:usd.professional.annual} per doctor per month billed annually, on the [pricing page](/pricing/)

