          body: Collect patient payments at the front desk, straight from the invoice.
        - title: Insurance made simple
          body: Build each claim from the visit and the bill, without leaving the patient record.
        - title: Reports in a click
          body: Generate the clinic's monthly reports in a click, instead of compiling them by hand.
        - title: Secure and ready to connect
          body: >-
            Role-based access, with HL7, FHIR and DICOM live, so your records are protected and ready to connect
            to labs and other systems.

