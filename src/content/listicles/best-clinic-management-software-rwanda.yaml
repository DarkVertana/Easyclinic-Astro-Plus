              checkedOn: 2026-10-14
            - value: Per doctor per month; the franc price is not yet published. The US dollar list on the [pricing page](/pricing/) starts at {price:usd.professional.annual} billed annually
        - label: RSSB and Mutuelle de Santé claims
          cells:
            - value: Prepares and tracks claims for RSSB, Mutuelle de Santé and private insurers, from Medical Plus
              source: https://usecarelogic.com/en/solutions/billing-and-insurance
