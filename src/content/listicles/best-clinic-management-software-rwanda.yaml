faq:
  - question: Is this ranking biased, since Easy Clinic publishes it?
    answer: >-
      It could be, so we made it checkable and left Easy Clinic out of the ranking: every fact about the other two links
      to the vendor's own page, read on 14 October 2026, and we do not rank ourselves while our franc price is unpublished.
  - question: Which of these file RSSB and Mutuelle de Santé claims?
    answer: >-
      CareLogic prepares and tracks claims for RSSB, Mutuelle de Santé and private insurers from its Medical Plus plan.
      MocDoc names insurance workflows without the schemes, and Easy Clinic names no RSSB or Mutuelle link.
  - question: Which work in Kinyarwanda?
    answer: >-
      MocDoc says it works in English, Kinyarwanda and French. CareLogic names English and French, and Easy Clinic names
      neither Kinyarwanda nor French on the pages we read.
  - question: Do any of these take MoMo?
    answer: >-
      CareLogic names multi-payment support including MoMo. MocDoc and Easy Clinic name no MoMo integration, so ask how a
      MoMo payment is recorded against the bill.
  - question: What does Easy Clinic cost in Rwanda?
    answer: >-
      Easy Clinic's franc price is not yet published. The [pricing page](/pricing/) has the US dollar list, which starts at
      {price:usd.professional.annual} per doctor per month on Professional billed annually, with no setup fee and no
      binding contract.

