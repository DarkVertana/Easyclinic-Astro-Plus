sections:
  - discriminant: prose
    value:
      id: verdict
      heading: The verdict by clinic type
      body: >-
        For a clinic in Kigali whose income runs through RSSB, Mutuelle de Santé and private insurers, CareLogic ranks
        first here: it is a Rwandan company with named Rwandan clinics, published prices in francs and claims for those
        schemes, though claims start on its Medical Plus plan and branches on Hospital Suite. For a hospital, clinic or
        lab that wants Kinyarwanda and French and several sites in the cloud, MocDoc, second, is the wider suite. Easy
        Clinic, unranked here, suits a clinic that wants Cura AI to draft the note and WhatsApp reminders, but it names no
        RSSB or Mutuelle link today.
      width: measure

  - discriminant: prose
    value:
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** Easy Clinic publishes this page. We rank the two other systems and leave Easy Clinic unranked, at the end of the table and the list. Every fact about the other two links to the page it came from.

        **When and where.** We read each vendor's own website on 14 October 2026. Where a vendor's pages did not say, the cell reads "Not published" with the date. Capterra and G2 could not be read on that date, so this page gives no independent review score.

        **How we ranked.** We weighed two checks first, a Rwanda presence and a published price, then four daily features: RSSB and Mutuelle de Santé claims, WhatsApp to patients, more than one branch and AI note drafting. Both meet the two checks. CareLogic has three daily features, claims, its WhatsApp queue bot and branches, and MocDoc two, WhatsApp and branches, so CareLogic ranks first.

        **Why Easy Clinic is unranked.** Easy Clinic publishes three daily features but no RSSB or Mutuelle link and no price in francs. We do not place ourselves in a ranking we wrote while our local price is unpublished.

        **Caveats.** MocDoc's published prices are for its hospital system in US dollars. CareLogic's homepage says 50+ active clinics and its About page 12+ clinics joined; neither figure is used here.
      width: measure

