        - **MocDoc:** Hospital system from $4,200 a year, plus onboarding from $800; no clinic price found ([mocdoc.com](https://mocdoc.com/util/hms-pricing)).

        Easy Clinic's franc price is not yet published, so this page gives no Easy Clinic price in Rwanda. Its US dollar list on the [pricing page](/pricing/) is {price:usd.professional.annual} per doctor per month on Professional and {price:usd.premium.annual} on Premium, both billed annually, with no setup fee and no binding contract.

        A pay-once licence on your own server adds the server, backups, updates and staff time; a subscription folds those in. Ask every vendor for a quote in francs and compare the total over a few years.

