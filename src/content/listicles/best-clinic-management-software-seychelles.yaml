  - discriminant: vendorList
    value:
      id: vendors
      heading: The four systems, one by one
      intro: The three others in ranked order for a clinic in Seychelles, then Easy Clinic, unranked, in the same format.
      vendors:
        - id: doctorsapp
          name: DoctorsApp
          rank: 1
          bestFor: Private clinics, hospitals and healthcare groups that want a published price and an AI scribe
          url: https://www.doctorsapp.in/
          body: >-
            DoctorsApp, an Indian cloud EMR, publishes a Seychelles article for public and private hospitals, clinics,
            diagnostic centres and healthcare groups. It offers an AI medical scribe, AI voice prescriptions, telemedicine
            and WhatsApp for all communication. Clinic plans are Rs. 10,999 and Rs. 16,999 a year before GST, with a refund
            within the first 7 days. It names no Seychelles office, client or local requirement, and no branch control.
          pros:
            - A published price, with a 7-day refund
            - AI scribe, WhatsApp and telemedicine
          cons:
            - Prices in Indian rupees, with Indian GST
            - No branch control or Seychelles office named
          facts:
            - label: Clinic plans
              value: Rs. 10,999 (Silver) and Rs. 16,999 (Gold) a year, before 18% GST
              source: https://www.doctorsapp.in/pricing
              checkedOn: 2026-10-14

        - id: softclinic-genx
          name: SoftClinic GenX
          rank: 2
          bestFor: General practitioners, speciality clinics, nursing homes and larger hospitals
          url: https://www.softclinicsoftware.com/hospital-management-software-in-seychelles/
          body: >-
            SoftClinic GenX, from Ahmedabad, publishes a Seychelles page naming Victoria, Anse Boileau and Beau Vallon. It
            installs cloud-hosted or on-premise, works on a local network, says it suits hospital chains, offers
            telemedicine by text or video and has an SMS facility. It is licensed per user, with free limited apps offered
            separately, but publishes no price, and we found no WhatsApp messages or AI.
          pros:
            - Cloud or on-premise installation
            - Telemedicine and hospital chains
          cons:
            - No price published and no Seychelles office
            - No WhatsApp or AI named
          facts:
            - label: Installation
              value: Cloud-hosted or on-premise
              source: https://www.softclinicsoftware.com/hospital-information-system-his/
              checkedOn: 2026-10-14

        - id: medinous
          name: Medinous
          rank: 3
          bestFor: Clinics, outpatient centres and clinic networks
          url: https://medinous.com/clinic-management-software/
          body: >-
            Medinous describes itself as a US-based company working with healthcare leaders in more than 14 countries, but
            its site does not mention Seychelles. Its Fusion products are for clinics and outpatient centres, with
            multi-facility networks on single sign-on, WhatsApp integration, SMS and email reminders, telehealth video and
            speech-to-text documentation. Prices vary by requirements and modules, with a free demo.
          pros:
            - Multi-facility networks and WhatsApp integration
            - Telehealth video
          cons:
            - No Seychelles page or price
            - No AI note drafting named
          facts:
            - label: Pricing
              value: Varies by requirements and modules; free demo
              source: https://medinous.com/clinic-management-software/
              checkedOn: 2026-10-14

        - id: easyclinic
          name: Easy Clinic
          us: true
          bestFor: Connected private clinics, from one doctor to a group, that want AI notes and WhatsApp
          url: https://www.easyclinic.io/
          body: >-
            Easy Clinic has run clinics since {fact:founded} and is used by {fact:doctors} doctors in {fact:countries}
            countries. Cura AI listens to the consult and drafts the note for the doctor to confirm, on every plan, and
            WhatsApp reminders, video consultations and more than one location come with Premium, which helps a clinic
            reach patients on other islands. Its rupee price is not yet published, and it does not run fully offline.
          pros:
            - Cura AI note drafting on every plan
            - WhatsApp, video consultations and branches on Premium
          cons:
            - The rupee price is not yet published
            - Does not run fully offline today
          facts:
