faq:
  - question: Is this ranking biased, since Easy Clinic publishes it?
    answer: >-
      It could be, so we made it checkable and left Easy Clinic out of the ranking: every fact about the other three links
      to the vendor's own page, read on 14 October 2026, and we do not rank ourselves while our rupee price is unpublished.
  - question: Which of these have an AI scribe?
    answer: >-
      Easy Clinic's Cura AI and DoctorsApp's AI medical scribe draft notes from the consult. Medinous integrates
      speech-to-text editors, and we found no AI on SoftClinic GenX's pages.
  - question: Which can run on our own server?
    answer: >-
      SoftClinic GenX installs on-premise as well as in the cloud. DoctorsApp, Medinous and Easy Clinic describe cloud
      systems, and Easy Clinic does not run fully offline today.
  - question: Do any of these publish a price for Seychelles?
    answer: >-
      None publishes a price in Seychelles rupees. DoctorsApp publishes clinic plans in Indian rupees, and Easy Clinic's US
      dollar list starts at {price:usd.professional.annual} per doctor per month on Professional.
  - question: Which help clinics reach patients on other islands?
    answer: >-
      All four name video consultations or telehealth: DoctorsApp, SoftClinic GenX and Medinous on their own pages, and Easy
      Clinic on Premium, with WhatsApp reminders for follow-up.

