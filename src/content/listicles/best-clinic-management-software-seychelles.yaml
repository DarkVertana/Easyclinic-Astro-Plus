    value:
      tone: wash
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** Easy Clinic publishes this page. We rank the three other systems and leave Easy Clinic unranked, at the end of the table and the list. Every fact about the other three links to the page it came from.

        **When and where.** We read each vendor's own website on 14 October 2026. Where a vendor's pages did not say, the cell reads "Not published" with the date. Capterra and G2 could not be read on that date, so this page gives no independent review score.

        **How we ranked.** We weighed two checks first, a Seychelles presence and a published price, then three daily features: WhatsApp to patients, more than one site and AI note drafting. DoctorsApp meets both checks, so it ranks first. SoftClinic GenX has a Seychelles page but no price, so it is second. Medinous has neither a Seychelles page nor a price, so it is third, although it names two daily features.

        **Why Easy Clinic is unranked.** Easy Clinic publishes all three daily features but no price in Seychelles rupees. We do not place ourselves in a ranking we wrote while our local price is unpublished.
      width: measure

