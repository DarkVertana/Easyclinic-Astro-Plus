faq:
  - question: Is this ranking biased, since Easy Clinic publishes it?
    answer: >-
      It could be, so we made it checkable and left Easy Clinic out of the ranking: every fact about the other three
      links to the vendor's own page, read on 14 October 2026, and we do not rank ourselves while our rufiyaa price is
      unpublished.
  - question: Which of these handle Aasandha?
    answer: >-
      MocDoc says its hospital system is fully integrated with Aasandha. MoCal, Ksatria and Easy Clinic name no Aasandha
      link on the pages we read, so ask each to show an Aasandha claim before you sign.
  - question: Which of these work without the internet on an outer atoll?
    answer: >-
      Ksatria offers a local server for areas without internet. MocDoc is fully cloud-based, and Easy Clinic runs in the
      cloud and does not run fully offline today.
  - question: Is MoCal a full clinic system?
    answer: >-
      No. MoCal is an appointment booking and reminder tool that connects to an existing EHR; it does not keep the
      patient record, bills or pharmacy, so a clinic uses it beside a clinic system.
  - question: What does Easy Clinic cost in the Maldives?
    answer: >-
      Easy Clinic's rufiyaa price is not yet published. The [pricing page](/pricing/) has the US dollar list, which starts
      at {price:usd.professional.annual} per doctor per month on Professional billed annually, with no setup fee and no
      binding contract.

