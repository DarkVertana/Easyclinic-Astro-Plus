  - discriminant: vendorList
    value:
      id: vendors
      heading: The four systems, one by one
      intro: The three others in ranked order for a clinic in the Maldives, then Easy Clinic, unranked, in the same format.
      vendors:
        - id: mocdoc
          name: MocDoc
          rank: 1
          bestFor: Hospitals, clinics and labs from 10 beds to 300 or more
          url: https://mocdoc.com/maldives
          body: >-
            MocDoc, from Chennai, publishes a Maldives page and says its hospital system is fully integrated with Aasandha.
            It prints prescriptions and reports in English and Dhivehi, bills in rufiyaa, supports several branches across
            the islands with unified reporting, and sends notifications by SMS, WhatsApp and email. It is fully
            cloud-based. Its hospital system costs from $4,200 a year for up to 10 users, with one-time onboarding from
            $800; we found no price for its clinic product and no named AI feature.
          pros:
            - Aasandha integration for its hospital system
            - English and Dhivehi prescriptions, rufiyaa billing
            - WhatsApp and branches across the islands
          cons:
            - Hospital prices only, in US dollars
            - Cloud only, no offline mode named
          facts:
            - label: Hospital system
              value: $4,200, $9,000 and $15,000 a year, plus onboarding from $800
              source: https://mocdoc.com/util/hms-pricing
              checkedOn: 2026-10-14

        - id: mocal
          name: MoCal
          rank: 2
          bestFor: Appointment booking and reminders for any practice
          url: https://www.mocal.ai/en/maldivess-best-healthcare-patient-booking-software-Maldives
          body: >-
            MoCal is an online appointment scheduler that publishes a Maldives page for doctors, dentists and specialists.
            It sends automated reminders by SMS, email and WhatsApp, offers virtual consultations with Zoom and Microsoft
            Teams, and connects to an existing EHR rather than replacing it. It has a free plan and a 30-day trial, with paid
            plans that showed in rupees to us. It is not a patient record, billing or pharmacy system, so a clinic would use
            it beside one.
          pros:
            - A free plan, a trial and WhatsApp reminders
            - Virtual consultations
          cons:
            - Booking only, not a clinic record or billing system
            - No Maldives office or Aasandha link
          facts:
            - label: Pricing
              value: Free plan and 30-day trial; paid plans from ₹1,500 a month as shown to us
              source: https://www.mocal.ai/en/pricing
              checkedOn: 2026-10-14

        - id: ksatria
          name: Ksatria
          rank: 3
          bestFor: Small clinics to multi-department hospitals that need a local server
          url: https://www.ksatria.io/en/hospital-information-system/other-countries/
          body: >-
            Ksatria, headquartered in Perth, publishes no Maldives page; the Maldives appears only in its contact form. Its
            page for other countries describes a hospital information system for small clinics to multi-site hospitals,
            deployable in the cloud or on-premise, with a local server option for areas without internet. Its pricing is
            designed for developing economies and NGOs but no figure is published, and we found no WhatsApp messages, AI or
            Aasandha link.
          pros:
            - A local server that runs without the internet
            - Multi-site hospitals
          cons:
            - No Maldives page or price
            - No WhatsApp, AI or Aasandha named
          facts:
            - label: Deployment
              value: Cloud or on-premise, with a local server option for low connectivity
              source: https://www.ksatria.io/en/hospital-information-system/other-countries/
              checkedOn: 2026-10-14

        - id: easyclinic
          name: Easy Clinic
          us: true
          bestFor: Connected private clinics, from one doctor to a group, that want AI notes and WhatsApp
          url: https://www.easyclinic.io/
          body: >-
            Easy Clinic has run clinics since {fact:founded} and is used by {fact:doctors} doctors in {fact:countries}
            countries. Cura AI listens to the consult and drafts the note for the doctor to confirm, on every plan, and
            WhatsApp reminders, video consultations and more than one location come with Premium. The limits matter in the
            Maldives. It names no Aasandha link or Dhivehi prescriptions, its rufiyaa price is not yet published, and it
            does not run fully offline, which matters on the outer atolls.
          pros:
            - Cura AI note drafting on every plan
            - WhatsApp, video consultations and branches on Premium
          cons:
            - No Aasandha link or Dhivehi named
            - The rufiyaa price is not yet published
            - Does not run fully offline today
          facts:
            - label: Price in the Maldives
              value: Rufiyaa price not yet published
            - label: US dollar list
              value: From {price:usd.professional.annual} per doctor per month billed annually, on the [pricing page](/pricing/)

  - discriminant: stepList
    value:
      id: workflow-tests
      heading: Four tests to run in every demo
      steps:
        - title: Aasandha test
          body: Take an Aasandha patient to a submitted claim. MocDoc names the integration; ask the others, Easy Clinic included, to show it.
        - title: Connection test
          body: Pull the network cable mid-consult. Ksatria offers a local server; MocDoc, MoCal and Easy Clinic run over the internet.
        - title: Language test
          body: Print a prescription in Dhivehi. MocDoc names English and Dhivehi; ask the others to show it.
        - title: Cost test
          body: Ask for the full yearly price in rufiyaa for your doctors and sites, including onboarding.

