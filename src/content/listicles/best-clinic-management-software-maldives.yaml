sections:
  - discriminant: prose
    value:
      id: verdict
      heading: The verdict by clinic type
      body: >-
        For a hospital or clinic group that bills Aasandha and runs sites across the atolls, MocDoc ranks first here: its
        hospital system is integrated with Aasandha, it prints in English and Dhivehi, bills in rufiyaa and supports
        several branches, and it publishes yearly hospital prices. For a practice that only needs online booking and
        reminders, MoCal, second, is a scheduling tool with a free plan, not a clinic record. For an island facility with
        a weak connection, Ksatria, third, offers a local server that runs without the internet, though it has no
        Maldives page. Easy Clinic, unranked here, suits a connected clinic that wants Cura AI notes and WhatsApp
        reminders, but it names no Aasandha link today.
      width: measure

  - discriminant: prose
    value:
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** Easy Clinic publishes this page. We rank the three other systems and leave Easy Clinic unranked, at the end of the table and the list. Every fact about the other three links to the page it came from.

        **When and where.** We read each vendor's own website on 14 October 2026. Where a vendor's pages did not say, the cell reads "Not published" with the date. G2 and Capterra could not be read on that date, so this page gives no independent review score.

        **How we ranked.** We weighed two checks first, a Maldives page the vendor publishes and a published price, then four daily features: Aasandha claims, WhatsApp messages to patients, more than one site and AI note drafting. MocDoc meets both checks and three daily features, so it ranks first. MoCal meets both checks and one daily feature, WhatsApp, so it is second. Ksatria publishes no Maldives page and no price, and has one daily feature, multi-site, so it is third.

        **Why Easy Clinic is unranked.** Easy Clinic publishes three daily features but no Aasandha link and no price in rufiyaa. We do not place ourselves in a ranking we wrote while our local price is unpublished.

        **Caveats.** MocDoc's published prices are for its hospital system in US dollars; we found no price for its clinic product. MoCal's pricing page showed rupees to us, which may depend on the visitor's country.
      width: measure

