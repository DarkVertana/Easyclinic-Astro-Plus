      tone: inverse
      badge: Built for Qatar
      heading: Made for how clinics in Qatar get paid and report
      items:
        - title: Payments at the desk
          body: Collect patient payments at the front desk, straight from the invoice.
        - title: Insurance made simple
          body: Build each claim from the visit and the bill, without leaving the patient record.
        - title: Reports in a click
          body: Generate the clinic's monthly reports in a click, instead of compiling them by hand.
        - title: Secure and ready to connect
          body: >-
            Role-based access, with HL7, FHIR and DICOM live, so your records are protected and ready to connect
            to labs and other systems.

  - discriminant: splitContent
    value:
      id: what-clinics-compare
      tone: plain
      centerHeading: true
      mediaFirst: true
      heading: What clinics in Qatar actually compare before they choose
      body: |-
        Most shortlists in Qatar come down to a handful of names, and on a features page they all read the same. The differences only show up once you ask the right questions.

        The systems compared on this page alongside Easy Clinic are Focus Softnet, SoftClinic GenX and Carewell ezyERP. Each one is strong at something. None of them is strong at everything.

        The comparison below is built from what each company documents on its own website. Nothing is invented, and where a vendor does not state a position publicly, we say so instead of guessing.
      media:
        kind: screenshot
        src: ../../assets/images/best-clinic-management/02.webp
        alt: 'Six things worth checking before you sign: where the vendor stands on the national insurance scheme, whether it takes local payments and handles claims, whether the AI works during the visit, which languages it writes in, what happens when you open a second branch, and who owns the patient relationship'
        frame: none

