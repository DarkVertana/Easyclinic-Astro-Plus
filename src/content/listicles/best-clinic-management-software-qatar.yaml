sections:
  - discriminant: prose
    value:
      id: verdict
      heading: The verdict by clinic type
      body: >-
        For a hospital or medium-to-large group that wants a Doha office and an ERP across locations, Focus Softnet
        ranks first here. For a clinic or hospital that wants cloud or on-premise installation, telemedicine and an
        insurance claims module, SoftClinic GenX, second, is the closer fit, though its office is in India. For a clinic
        that wants a Doha supplier for a Windows system with insurance handling, Carewell's ezyERP, third, is an option.
        Easy Clinic, unranked here, suits a connected private clinic or group that wants Cura AI to draft the note and
        WhatsApp reminders, once you have its price in riyals.
      width: measure

  - discriminant: prose
    value:
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** Easy Clinic publishes this page. We rank the three other systems and leave Easy Clinic unranked, at the end of the table and the list. Every fact about the other three links to the page it came from.

        **When and where.** We read each vendor's own website on 14 October 2026. Where a vendor's pages did not say, the cell reads "Not published" with the date. Capterra and G2 could not be read on that date, so this page gives no independent review score.

        **How we ranked.** We weighed two checks first, a Qatar presence and a published price, then three daily features: WhatsApp messages to patients, more than one site and AI note drafting. All three publish a Qatar presence and none publishes a price. Focus Softnet and SoftClinic GenX each name more than one site; the tie-break, an office in Qatar, puts Focus Softnet first. Carewell names none of the three for its clinic product, so it is third.

        **Why Easy Clinic is unranked.** Easy Clinic publishes all three daily features but no price in riyals. We do not place ourselves in a ranking we wrote while our local price is unpublished.

        **What this page leaves out.** None of the four names MOPH or Seha links on the pages we read, and this page does not state any vendor's position on them, Easy Clinic included.
      width: measure

