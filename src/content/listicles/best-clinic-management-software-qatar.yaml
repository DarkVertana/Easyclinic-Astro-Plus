  - discriminant: prose
    value:
      id: which-one-fits
      tone: wash
      width: wide
      heading: So which one fits your clinic?
      body: |-
        If you run a public or donor funded facility, a national or open-source system may be built for that world. If you need a national insurance scheme connected today, check which of the systems above already has it, and we will say so rather than waste your time.

        Where Easy Clinic makes most sense is a growing private clinic that wants to run the whole practice in one place. Cura AI in the room with the patient. Payments and insurance claims from inside the record. Reminders and prescriptions over WhatsApp. Appointments, records, billing, pharmacy, lab and reports in a single system that does not need replacing when you open the second branch.

        The fastest way to know is to watch it run on your own workflow for fifteen minutes.
