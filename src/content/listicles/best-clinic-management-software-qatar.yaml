  - discriminant: stepList
    value:
      id: workflow-tests
      heading: Four tests to run in every demo
      steps:
        - title: Insurance test
          body: Take an insured patient from registration to the claim, and ask each vendor to show the claim screen.
        - title: Doctor context test
          body: Dictate a note. Easy Clinic (Cura AI) publishes note drafting; we found none for clinical notes on the other three.
        - title: Language test
          body: Ask to see Arabic on the patient's prescription and invoice, since only SoftClinic GenX shows Arabic on its Qatar page.
        - title: Cost test
          body: Ask for the full price in riyals for your doctors and sites, including setup and support.

