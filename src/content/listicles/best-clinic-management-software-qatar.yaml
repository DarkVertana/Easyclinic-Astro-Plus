      id: vendors
      heading: The four systems, one by one
      intro: The three others in ranked order for a clinic in Qatar, then Easy Clinic, unranked, in the same format.
      vendors:
        - id: focus-softnet
          name: Focus Softnet
          rank: 1
          bestFor: Hospitals and medium-to-large healthcare organisations
          url: https://www.focussoftnet.com/qa/hospital-erp-software
          body: >-
            Focus Softnet has an office in Old Salata, Doha, and sells a cloud-hosted hospital ERP for healthcare
            organisations in single or multiple locations, aimed at medium and large enterprises. Its company-wide
            Focus AI covers analysis, NLP and AI agents, and it describes a general WhatsApp integration for orders and
            appointments, but neither is described for clinical notes or patients on its hospital page. It publishes no
            plan price, and we found no MOPH or Seha link.
