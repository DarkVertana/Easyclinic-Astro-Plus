faq:
  - question: Is this ranking biased, since Easy Clinic publishes it?
    answer: >-
      It could be, so we made it checkable and left Easy Clinic out of the ranking: every fact about the other three
      links to the vendor's own page, read on 14 October 2026, and we do not rank ourselves while our riyal price is
      unpublished.
  - question: Which of these have an office in Qatar?
    answer: >-
      Focus Softnet has an office in Old Salata, Doha, and Carewell International one in the Sofitel Complex, Doha.
      SoftClinic GenX's office is in Ahmedabad, India, and Easy Clinic has no office in Qatar.
  - question: Which of these can run on our own server?
    answer: >-
      SoftClinic GenX installs on-premise or on a local network, and Carewell's ezyERP is a Windows application. Focus
      Softnet describes itself as cloud-hosted, and Easy Clinic runs in the cloud and does not run fully offline today.
  - question: Do any of these publish a price for Qatar?
    answer: >-
      No. None of the three competitors publishes a plan price on the pages we read, and Easy Clinic's riyal price is not
      yet published; its US dollar list starts at {price:usd.professional.annual} per doctor per month on Professional.
  - question: Which have AI note drafting?
    answer: >-
      Easy Clinic's Cura AI drafts the note from the consult. Focus Softnet's Focus AI is a company-wide analysis tool
      rather than a clinical scribe, and we found no AI on SoftClinic GenX's or Carewell's pages.

