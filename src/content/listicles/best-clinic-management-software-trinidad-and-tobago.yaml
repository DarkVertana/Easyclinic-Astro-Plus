faq:
  - question: Is this ranking biased, since Easy Clinic publishes it?
    answer: >-
      It could be, so we made it checkable and left Easy Clinic out of the ranking: every fact about the other three links
      to the vendor's own page, read on 14 October 2026, and we do not rank ourselves while our local price is unpublished.
  - question: Which of these have an office in Trinidad and Tobago?
    answer: >-
      RioMed has an office at 7 Gray Street, St Clair, Port of Spain, and Adroit says it serves Trinidad and Tobago through
      a branch office. MocDoc's office is in Chennai, India, and Easy Clinic has no office there.
  - question: Is Cellmaflex really free?
    answer: >-
      RioMed's FAQ says Cellmaflex is completely free for doctors for now, with plans from free to premium; the paid plan
      prices are not published, so ask what will change and when.
  - question: Which have AI note drafting?
    answer: >-
      Easy Clinic's Cura AI drafts the note from the consult. RioMed offers ambient scribing on its wider Cellma platform but
      does not describe it for Cellmaflex, and we found no AI drafting on MocDoc's or Adroit's pages.
  - question: What does Easy Clinic cost in Trinidad and Tobago?
    answer: >-
      Easy Clinic's local price is not yet published. The [pricing page](/pricing/) has the US dollar list, which starts at
      {price:usd.professional.annual} per doctor per month on Professional billed annually, with no setup fee and no binding
      contract.

