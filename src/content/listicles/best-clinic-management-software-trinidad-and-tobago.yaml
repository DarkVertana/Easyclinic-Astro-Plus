      vendors:
        - id: mocdoc
          name: MocDoc
          rank: 1
          bestFor: Hospitals, clinics and labs across the islands
          url: https://mocdoc.com/trinidad-tobago
          body: >-
            MocDoc, from Chennai, publishes a Trinidad and Tobago page for hospitals, Regional Health Authorities, clinics
            and labs. It is fully cloud-based, scales to multi-location hospitals, sends SMS and email reminders, offers
            WhatsApp at extra charge, and names insurance and TPA workflows. Its hospital system costs from $4,200 a year for
            up to 10 users, plus onboarding; we found no clinic price, no AI feature and no named local client.
          pros:
            - A published hospital price
            - Multi-location, with WhatsApp as an add-on
          cons:
            - Office in India, no named local clients
            - Hospital prices only, in US dollars
          facts:
            - label: Hospital system
