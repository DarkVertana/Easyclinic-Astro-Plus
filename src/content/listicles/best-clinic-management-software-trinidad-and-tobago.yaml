sections:
  - discriminant: prose
    value:
      id: verdict
      heading: The verdict by clinic type
      body: >-
        For a hospital or multi-location group that wants a published price, MocDoc ranks first here, with WhatsApp as a
        paid add-on, though its office is in India. For a clinic that wants a local supplier and a free start, RioMed's
        Cellmaflex, second, runs from St Clair in Port of Spain and is free for doctors for now. For a clinic that values
        local references and a choice of cloud or on-premise, Adroit, third, names Trinidadian clients such as Gulf View
        Medical Centre and Tricare Medical Centre, though it publishes no price. Easy Clinic, unranked here, suits a
        connected clinic that wants Cura AI to draft the note and WhatsApp reminders.
      width: measure

  - discriminant: prose
    value:
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** Easy Clinic publishes this page. We rank the three other systems and leave Easy Clinic unranked, at the end of the table and the list. Every fact about the other three links to the page it came from.

        **When and where.** We read each vendor's own website on 14 October 2026. Where a vendor's pages did not say, the cell reads "Not published" with the date. Capterra and G2 could not be read on that date, so this page gives no independent review score.

        **How we ranked.** We weighed two checks first, a Trinidad and Tobago presence and a published price, then three daily features: WhatsApp to patients, more than one site and AI note drafting. MocDoc and Cellmaflex meet both checks; MocDoc has two daily features and Cellmaflex none named for Cellmaflex itself, so MocDoc ranks first and Cellmaflex second. Adroit has a local office and clients but no price, and one daily feature, so it is third.

        **Why Easy Clinic is unranked.** Easy Clinic publishes all three daily features but no local price. We do not place ourselves in a ranking we wrote while our local price is unpublished.

        **Caveats.** MocDoc's published prices are for its hospital system in US dollars. RioMed's AI scribe and WhatsApp are described for its wider Cellma platform, not for Cellmaflex, so they are not counted for Cellmaflex.
      width: measure

