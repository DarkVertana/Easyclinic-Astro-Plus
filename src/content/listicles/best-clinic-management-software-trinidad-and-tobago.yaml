              source: https://mocdoc.com/util/hms-pricing
              checkedOn: 2026-10-14

        - id: cellmaflex
          name: Cellmaflex (RioMed)
          rank: 2
          bestFor: Clinics in Trinidad and Tobago that want a local supplier and a free start
          url: https://www.riomed.com/cellmaflex/
          body: >-
            Cellmaflex is RioMed's cloud clinic platform for Trinidad and Tobago, from an office at 7 Gray Street, St Clair,
