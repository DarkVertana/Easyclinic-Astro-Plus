faq:
  - question: Is this ranking biased, since Easy Clinic publishes it?
    answer: >-
      It could be, so we made it checkable and left Easy Clinic out of the ranking: every fact about the other three links
      to the vendor's own page, read on 14 October 2026, and we do not rank ourselves while our shilling price is
      unpublished.
  - question: Which of these handle NHIF?
    answer: >-
      Ksatria says it is designed to align with Ministry of Health requirements and NHIF processes. Tenwave, Smart Hospital
      Manager and Easy Clinic name no NHIF link, so ask each to show an NHIF claim before you sign.
  - question: Which of these work without the internet?
    answer: >-
      Ksatria's on-site server runs without the internet day to day, and Smart Hospital Manager is self-hosted. Tenwave is
      cloud-ready, and Easy Clinic runs in the cloud and does not run fully offline today.
  - question: Do any of these take M-Pesa?
    answer: >-
      None of the four names M-Pesa on the pages we read on 14 October 2026. Ksatria names Seerbit for digital payments, so
      ask each vendor how a mobile money payment is recorded against the bill.
  - question: What does Easy Clinic cost in Tanzania?
    answer: >-
      Easy Clinic's shilling price is not yet published. The [pricing page](/pricing/) has the US dollar list, which starts
      at {price:usd.professional.annual} per doctor per month on Professional billed annually, with no setup fee and no
      binding contract.

