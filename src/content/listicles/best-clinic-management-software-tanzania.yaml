        - id: ksatria
          name: Ksatria
          rank: 1
          bestFor: Clinics, day clinics and hospitals of 20 to 500 beds
          url: https://www.ksatria.io/en/hospital-information-system/tanzania/
          body: >-
            Ksatria, headquartered in Perth, publishes a Tanzania page and works with a local partner, One Click Africa. It is
            designed to align with Ministry of Health requirements and NHIF processes, partners with Seerbit for
            point-of-care digital payments, configures hospital groups and branches, and offers an on-site server that runs
            without the internet day to day. It sells a monthly subscription per user with no upfront licence, by quote. We
            found no WhatsApp messages or AI, and its DHIS2 link is still under development.
          pros:
