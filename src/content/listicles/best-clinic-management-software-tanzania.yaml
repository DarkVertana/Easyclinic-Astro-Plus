sections:
  - discriminant: prose
    value:
      id: verdict
      heading: The verdict by clinic type
      body: >-
        For a clinic or hospital that bills NHIF and needs to keep working when the internet drops, Ksatria ranks first
        here: it names NHIF processes, a local partner in One Click Africa, branch control and an on-site server that runs
        without the internet. For a facility that wants a cloud hospital system from a supplier with offices in India,
        Singapore and Australia, Tenwave's ETHER, second, adds a separate product for clinic chains. For a facility that
        would rather pay once and host it, Smart Hospital Manager, third, sells a lifetime licence. Easy Clinic, unranked
        here, suits a connected clinic that wants Cura AI to draft the note, but it names no NHIF link today.
      width: measure

  - discriminant: prose
    value:
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** Easy Clinic publishes this page. We rank the three other systems and leave Easy Clinic unranked, at the end of the table and the list. Every fact about the other three links to the page it came from.

        **When and where.** We read each vendor's own website on 14 October 2026. Where a vendor's pages did not say, the cell reads "Not published" with the date. Capterra and G2 could not be read on that date, so this page gives no independent review score.

        **How we ranked.** We weighed two checks first, a Tanzania presence and a published price, then four daily features: NHIF, WhatsApp to patients, more than one branch and AI note drafting. All three publish a Tanzania page and none publishes a price. Ksatria has two daily features, NHIF and branches, so it ranks first. Tenwave and Smart Hospital Manager have one each, branches; the tie-break, telemedicine named, puts Tenwave second.

        **Why Easy Clinic is unranked.** Easy Clinic publishes three daily features but no NHIF link and no shilling price. We do not place ourselves in a ranking we wrote while our local price is unpublished.

        **What this page leaves out.** None of the four names M-Pesa, TRA receipts or GoTHOMIS on the pages we read.
      width: measure

