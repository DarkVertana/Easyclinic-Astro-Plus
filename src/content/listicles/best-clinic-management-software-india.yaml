faqHeading: Questions clinic owners ask
faq:
  - question: How much does Easy Clinic cost in India?
    answer: >-
      Easy Clinic is priced per doctor. Professional is {price:inr.professional.annual} per doctor per month and
      Premium is {price:inr.premium.annual}, both billed annually, or {price:inr.professional.quarterly} and
      {price:inr.premium.quarterly} billed quarterly. Every plan includes a login for your receptionist at no
      extra cost, and there is no setup fee for clinics up to 5 users. Enterprise is priced on a quote.
  - question: Is Cura AI included in every plan?
    answer: >-
      Cura AI is a paid add-on that works with any plan. It runs in the background at registration, triage and the
      consultation. It flags what does not add up, such as a missed allergy, and suggests diagnosis and treatment.
      The clinic sets the triggers and alert style, and the doctor always makes the final decision.
  - question: Does Easy Clinic send WhatsApp reminders to patients?
    answer: >-
      Yes. Easy Clinic sends prescriptions, invoices, lab reports and appointment reminders on WhatsApp on every
      plan, with a monthly message allowance by plan. Reminders go out the day before and again on the day of the
      visit, never at night. Medicine instructions and advice can print in the patient's own language, and SMS and
      email work too.
  - question: How long does it take to switch to Easy Clinic?
    answer: >-
      Most clinics go live within 2 to 4 weeks. Easy Clinic builds your prescription format from your own sample,
      imports records from your old system, and trains reception, doctors, lab and pharmacy on their own part of
      the day. Your dedicated account manager stays with you after go-live, and new staff are trained through the
      year.
  - question: Can our doctors and staff share one login?
    answer: >-
      We advise against it. Each doctor, nurse, receptionist, lab technician and pharmacist gets their own login
      and works from their own queue. That keeps every prescription, bill and stock entry traceable to the person
      who made it. The admin sets what each role can see, and a doctor can also be the admin.
  - question: What happens when we open a second branch?
    answer: >-
      You move to Premium, at {price:inr.premium.annual} per doctor per month billed annually, which covers more
      than one location. Each branch sits in a location dropdown under the same login, with shared patient records
      and one shared stock. Enterprise adds central control of every location and a Power BI data warehouse for
      clinic chains.
  - question: Does Easy Clinic work when the internet drops?
    answer: >-
      Easy Clinic is cloud software that runs in any browser on a laptop or tablet, so it needs a connection. It
      does not run fully offline today. Most clinics keep a mobile hotspot beside the reception computer as a
      backup line, so registration, prescriptions and billing carry on if the main line drops.
  - question: Is Easy Clinic enough for a clinic with inpatient beds?
    answer: >-
      Easy Clinic is built for outpatient care: single clinics, polyclinics, clinic chains and hospital OPDs.
      Enterprise adds pharmacy, lab management, insurance claims and a patient portal for the outpatient side of a
      hospital. It is not a full hospital information system for wards and operation theatres, so inpatient beds
      need a separate IPD system.
  - question: Does Easy Clinic support ABHA?
    answer: >-
      Easy Clinic lists compliance with ABHA, HIPAA and GDPR. Patient records are protected with role-based
      access, audit logs and encryption in transit and at rest, and each person sees only what their role needs.
      Ask us to create an ABHA number for a test patient during your demo, so you can see it working.
  - question: Will we be locked into a long contract?
    answer: >-
      Easy Clinic bills a year or a quarter at a time. Your patient records belong to your clinic, not to us, and
      you can export them to Excel or PDF at any time. If Easy Clinic stops fitting your clinic, you leave with
      everything you put in.

