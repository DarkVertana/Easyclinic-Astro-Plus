  - discriminant: stepList
    value:
      id: four-tests
      heading: Four tests to run in every demo
      intro: >-
        A feature list will not tell you how the software feels on a Monday morning. Run the same four tests
        on each vendor you shortlist, with your own receptionist at the keyboard and a real day's patient list.
      steps:
        - title: Front desk test
          body: >-
            Book a walk-in and a WhatsApp request into the same hour, then move one of them. Watch whether the
            receptionist needs a second screen or a personal phone to do it.
        - title: Doctor context test
          body: >-
            Open a returning patient's chart and time how long it takes to see the last prescription and the
            last lab result. If an AI note tool is offered, dictate one real consultation and read every line
            it wrote before you would sign it.
        - title: Follow-up test
          body: >-
            Set a follow-up for next Tuesday and a repeat prescription, then ask who sends the reminder, on
            which channel, and whether the doctor has to leave the consultation to do it.
        - title: Owner visibility test
          body: >-
            Ask for yesterday's visits and collections by payment mode, doctor by doctor, and last week's
            no-shows. If it takes more than a minute or an export to Excel, you will be doing it by hand at
            every month end.

  - discriminant: decisionMatrix
    value:
      id: which-to-choose
      heading: Which one to choose
      intro: >-
        Four groups, because several of the seven solve the same problem. Pick the list that sounds most like
        your clinic.
      options:
        - title: Choose Easy Clinic if
          us: true
          items:
            - >-
              You want the appointment book, the prescription, the bill and the reminders in one login, with a
              reception login included in the per-doctor price.
            - >-
              You are opening a second branch: Premium covers more than one location, and Enterprise adds
              central control of every location.
            - You want Cura AI note drafting on every plan, from {price:inr.professional.annual} per doctor per month.
            - >-
              Your staff need training: {fact:trainingDays} short sessions of about two hours in all, then
              support by phone, email and chat.
            - You do not want a contract or a setup fee.
        - title: Choose Practo Ray if
          items:
            - Your patients already book you on Practo.com, since both Ray plans include Practo.com integration.
            - >-
              You have several doctors and want one price for all of them: CM Atom is ₹999 a month for up to
              50 doctors on a one-year term.
            - SMS reminders are enough, with 3,000 or 8,000 free SMS depending on the plan.
            - >-
              You want patients to pay online before the visit through Ray Payment Solution, at 1.8% to 2% a
              transaction.
            - You want to try it first, with a 7-day free trial that has the features of the top plan.
        - title: Choose HealthPlix or Doctors App if
          items:
            - >-
              You are one doctor and want a low yearly price: ₹10,999 on Doctors App Silver with two staff
              logins, or ₹12,000 on HealthPlix Pro, both before 18% GST.
            - Your internet drops often, since HealthPlix describes itself as an online and offline EMR.
            - Your patients want the prescription in their own language, which both say they print in 14 languages.
            - You want an appointment booking website included, on HealthPlix Elite or Doctors App Gold.
        - title: Choose MocDoc or Healthray if
          items:
            - >-
              You run inpatient beds, or a lab and pharmacy, alongside the clinic, since both sell those modules
              as well as clinic software.
            - >-
              You want ABHA creation at the front desk, which both say is built in, and you will check it on a
              test patient.
            - 'You want a price per centre rather than per doctor, as Healthray publishes: ₹36,000 a year for up to 10 users on the plan with the EMR.'
            - You need on-premise or hybrid hosting, which Healthray offers.
            - You want a vendor with a longer review record, such as MocDoc HMS at 4.9 from 44 reviews on Capterra.

