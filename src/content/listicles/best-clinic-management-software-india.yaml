              value: 4.9 on Capterra from 44 reviews (MocDoc HMS listing)
              source: https://www.capterra.com/p/161290/MocDoc-HMS/
              checkedOn: 2026-09-26

        - id: practo-ray
          name: Practo Ray
          bestFor: Clinics whose patients already book on Practo.com
          url: https://www.practo.com/providers/clinics/ray
          body: >-
            Ray is Practo's clinic management software, and Practo says 50,000+ doctors use it in 5 countries.
            Both plans include the appointment calendar, billing, patient charting, SMS confirmations and
            reminders, and Practo.com integration. Practo's own FAQ says Ray is clinic software and not an
            advertising product; online booking by patients sits with Practo.com and the separate Practo Prime
            programme, which charges a one-time platform fee the first time each patient connects through it in a
            rolling 180-day window.
            Prices are per plan rather than
            per doctor: CM Atom is ₹999 a month on a one-year term for up to 50 doctors, and Clinic Management
            is ₹1,499 a month on one year, or ₹999 on four years, for unlimited doctors. Online payments through
            Ray Payment Solution cost 2% or 1.8% a transaction. The agreement renews each year unless you give
            60 days' notice. Practo says Ray is ABDM compliant, and there is a 7-day free trial.
          pros:
            - One plan covers up to 50 doctors (CM Atom) or unlimited doctors (Clinic Management).
            - Practo.com integration on both plans.
