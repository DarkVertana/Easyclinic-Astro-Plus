      id: verdict
      width: wide
      heading: The short answer, by type of clinic
      body: >-
        If you are one doctor and the price matters most, Doctors App charges ₹10,999 a year before GST with
        two staff logins, and HealthPlix, at ₹12,000, describes itself as an online and offline EMR. If your
        patients already book you on Practo.com, Practo Ray has Practo.com integration on both plans, and if
        you also run a lab and pharmacy counter, or inpatient beds, MocDoc and Healthray sell those modules
