  - discriminant: scopeBox
    value:
      id: limits
      heading: What this comparison does not tell you
      variant: limits
      items:
        - >-
          We read each vendor's website and review listings on 26 September 2026 and did not trial the products,
          so nothing here rates speed or ease of use.
        - >-
          Competitor features and claims, ABDM compliance included, are as each vendor states them on its own
          site; we have not tested them.
        - >-
          Review counts are small, from none to 44 per listing, so a handful of clinics can move a score.
        - >-
          Prices are list prices. Vendors may discount, and some add GST and extra-provider charges on top.
        - >-
          Easy Clinic's column uses only facts from our own price list and plans. The page gives Easy Clinic's
          Capterra and Google ratings without a review count and does not state its ABDM status, so neither has
          a row in the table; the Capterra link shows the current count.

