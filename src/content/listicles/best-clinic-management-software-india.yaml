  - discriminant: prose
    value:
      id: pricing
      heading: How the published prices compare
      body: |
        The seven vendors count their prices in different ways, so line them up for your own clinic before you compare. Easy Clinic charges per doctor per month, {price:inr.professional.annual} on annual Professional, with the reception login included. [Practo Ray](https://www.practo.com/providers/clinics/ray/plans) charges one monthly price per plan with a limit on doctors, ₹999 a month for up to 50 doctors on CM Atom, so at list price Ray costs less than Easy Clinic from the first doctor, and the gap grows with every doctor you add. [DocEngage](https://www.docengage.in/pricing) opens its price list per user, ₹699 a month billed annually on the clinic plan with the EMR, and also prices each care centre at ₹36,000 a year for up to 10 users. [Healthray](https://healthray.com/pricing/) shows the same two figures on one card without saying which applies. Both charge extra providers and the patient app on top. [MocDoc](https://mocdoc.com/clinic-management-software) does not publish prices.

        For one doctor, [Doctors App](https://doctorsapp.in/) (₹10,999 a year with two staff logins) and [HealthPlix](https://www.healthplix.com/pricing-1) (₹12,000 a year) also publish lower prices than Easy Clinic, both before 18% GST. Doctors App's plans cover one doctor each; HealthPlix's pricing page does not say how many doctors a plan covers. DocEngage's per-user price comes to ₹8,388 a year for one login on the plan with the EMR, so ask how it counts front-desk logins. From three doctors, the ₹36,000 per-centre price is also below Easy Clinic Professional.

        Ask every vendor for one number: the yearly total with tax for your doctors and front-desk staff, with the modules you will use in the first year, such as pharmacy or WhatsApp.

  - discriminant: vendorList
    value:
      id: vendors
      heading: Each option in detail
      intro: >-
        Easy Clinic first, because this is our page, then the six others in alphabetical order. Each gets the
        same structure: what it is, what it costs, where it is strong and where it falls short.
      vendors:
        - id: easyclinic
          name: Easy Clinic
          us: true
          bestFor: Clinics of two or more doctors, polyclinics and groups adding branches
          url: https://www.easyclinic.io/
          body: >-
            Easy Clinic is clinic software from a Kolkata company, and it has run clinics since {fact:founded}.
            {fact:doctors} doctors in {fact:cities} cities use it, and the largest chain on it
            has {fact:largestChain} locations. Professional, at {price:inr.professional.annual} per doctor per
            month billed annually, covers the appointment book, the EMR with e-prescriptions, billing,
            dashboards, SMS and email reminders, staff logins and Cura AI note drafting. Premium, at
            {price:inr.premium.annual}, adds WhatsApp reminders and messages, video consultations, lab reports
            in the chart and more than one location. Pharmacy and insurance claims come with Enterprise, or as
            add-ons on the other plans. A reception login is included, there is no setup fee and no binding
            contract, and training is {fact:trainingDays} short sessions of about two hours in all, with support
            by phone, email and chat. It is cloud-based and does not run fully offline today, and it is not a
            full hospital information system for wards and theatres.
          pros:
            - Priced per doctor with the reception login included, and no setup fee or contract.
            - Cura AI note drafting on every plan, including Professional.
            - One plan family from a single doctor to Enterprise chains with central control of every location.
            - Customisation without extra charges, and unlimited support and training.
          cons:
            - Not the cheapest at list price, for one doctor or for several.
            - WhatsApp messages and a second location need Premium, at {price:inr.premium.annual} per doctor per month.
            - Does not run fully offline today.
            - Not a full hospital information system for inpatient wards.
          facts:
            - label: Published price
              value: >-
                {price:inr.professional.annual} (Professional) or {price:inr.premium.annual} (Premium) per doctor
                per month billed annually; Enterprise on a quote
            - label: Billed quarterly
              value: '{price:inr.professional.quarterly} or {price:inr.premium.quarterly} per doctor per month'
            - label: Going live
              value: In as little as {fact:goLiveDays} days from the demo
            - label: Ratings
              value: '{fact:capterraRating} on Capterra and {fact:googleRating} on Google'
              source: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/

        - id: docengage
          name: DocEngage
          bestFor: Clinics that run their own marketing and want a healthcare CRM from the same vendor
          url: https://www.docengage.in/
          body: >-
            DocEngage is a Bengaluru company that sells healthcare CRM alongside clinic, EHR, telehealth, home
            care and hospital software. Its clinic software covers multi-centre scheduling, a rate card per
            location, pharmacy with inventory, queues, treatment packages and 80+ reports, and it lists
            integrations with your website, Facebook, IVR, SMS, email and WhatsApp. Its plan descriptions and
            prices match Healthray's. The price list opens per user, billed annually: ₹499 a month on the
            Clinical Management Basic plan and ₹699 on Advanced, which adds the EMR, notes, prescriptions and
            pharmacy. A second tab prices a care centre for up to 10 users at ₹30,000 or ₹36,000 a year. Taxes
            are extra, and so are additional providers and the patient app. DocEngage leads with its CRM, a separate product from
            ₹96,000 a year per care centre with lead management; WhatsApp campaigns and memberships need the
            CRM's Advanced plan. It suits a clinic that runs its own marketing, such as a cosmetology practice.
            We found no ABDM claim and no AI note drafting on the pages we read.
          pros:
            - A healthcare CRM with lead management from the same vendor, and WhatsApp campaigns on its Advanced plan.
            - Multi-centre scheduling and a rate card per location.
            - Published prices per user, or per care centre for up to 10 users.
          cons:
            - No ABDM claim on the pages we read.
            - No AI note drafting described.
            - The CRM is priced separately, from ₹96,000 a year per care centre.
            - Few directory reviews, 3 on SoftwareSuggest.
          facts:
            - label: Published price
              value: >-
                ₹499 (Basic) or ₹699 (Advanced) per user per month billed annually, or ₹30,000 or ₹36,000 a year
                per care centre for up to 10 users; taxes extra
              source: https://www.docengage.in/pricing
              checkedOn: 2026-09-26
            - label: Healthcare CRM
              value: From ₹96,000 a year per care centre; WhatsApp campaigns and memberships on Advanced, ₹1,80,000
              source: https://www.docengage.in/pricing
              checkedOn: 2026-09-26
            - label: Review score
              value: 4.7 on SoftwareSuggest from 3 reviews (DocEngage EHR listing)
              source: https://www.softwaresuggest.com/docengage
              checkedOn: 2026-09-26

        - id: doctors-app
          name: Doctors App
          bestFor: One doctor who wants a low yearly price with staff logins included
          url: https://doctorsapp.in/
          body: >-
            Doctors App sells EMR and hospital software and says 5,000+ doctors across 18 specialities use it.
            Its two clinic plans each cover one doctor: Silver at ₹10,999 a year with two staff logins, and Gold
            at ₹16,999 with three, both before 18% GST. Both include appointments, digital prescriptions, lab
            report uploads, speciality modules, clinic analytics and help moving old patient records. WhatsApp
            message credits are limited on Silver and included on Gold, and on Gold the clinic's own WhatsApp
            number can be connected as needed. Doctors App describes itself as "ABDM compliant by NHA" and
            offers an AI scribe that turns a spoken consultation into SOAP notes, though the scribe is not listed
            in either clinic plan. Lab and pharmacy are marked "as per need" on both plans, and nursing homes and
            hospitals get a quote for inpatient features. Gold adds an appointment booking site, an SEO website
            and digital marketing tools. Doctors App promises a full refund in the first 7 days.
          pros:
            - ₹10,999 a year for one doctor with two staff logins, before GST.
            - AI scribe for SOAP notes from the spoken consultation.
            - WhatsApp message credits on both plans, and the clinic's own number as an option on Gold.
            - Inpatient features for nursing homes and hospitals, priced on a quote.
            - A full refund if you are not satisfied within the first 7 days.
          cons:
            - Each plan covers one doctor.
            - Lab and pharmacy are marked "as per need" rather than included in the plan.
            - Running more than one branch is not described on the pages we read.
            - Few directory reviews, 5 ratings and 1 written review on Techjockey.
          facts:
            - label: Published price
              value: ₹10,999 (Silver) or ₹16,999 (Gold) a year per doctor, before 18% GST
              source: https://doctorsapp.in/
              checkedOn: 2026-09-26
            - label: ABDM
              value: Describes itself as "ABDM compliant by NHA"
              source: https://doctorsapp.in/
              checkedOn: 2026-09-26
            - label: Review score
              value: 4.5 on Techjockey from 5 ratings and 1 review
              source: https://www.techjockey.com/detail/doctors-app
              checkedOn: 2026-09-26

        - id: healthplix
          name: HealthPlix
          bestFor: A doctor who wants a fast prescription in the patient's language, online or offline
          url: https://www.healthplix.com/
          body: >-
            HealthPlix is a Bengaluru company that calls its product India's largest online and offline EMR,
            used by 14,000+ doctors in 370+ cities. It is built around the doctor's desk: a prescription in
            about 30 seconds, speciality modules used by doctors in 16 specialities, and prescriptions in 14
            languages, so a patient can
            read the advice in Hindi or Bengali. Both published plans include the speciality OPD EMR,
            teleconsultation, billing, a patient queue, drug interaction checks, a patient app and ABDM, which
            HealthPlix says it is compliant with. Pro costs ₹12,000 a year and Elite ₹18,000 a year, both before
            18% GST. Elite adds the Plix AI tools such as Quick Rx and past-visit summaries, a multi-clinic
            setup, an appointment booking website and 5,000 message credits. H.A.L.O records the consultation
            and drafts the transcript, summary and prescription, but it is not listed in either published plan.
            Pharmacy is not listed in either plan, and
            hospitals that need inpatient care or the PlixConnect CRM are quoted separately.
          pros:
            - Published yearly prices of ₹12,000 (Pro) and ₹18,000 (Elite), before GST.
            - Describes itself as an online and offline EMR.
            - Prescriptions in 14 languages.
            - H.A.L.O drafts the note and prescription from the recorded consultation.
          cons:
            - The AI tools and the multi-clinic setup are on Elite only.
            - WhatsApp appears only on the SPOT mobile app page, for prescriptions; neither published plan names it.
            - Pharmacy is not listed in either published plan.
            - No reviews yet on Capterra, and 4 on SoftwareSuggest.
          facts:
            - label: Published price
              value: ₹12,000 (Pro) or ₹18,000 (Elite) a year, before 18% GST
              source: https://www.healthplix.com/pricing-1
              checkedOn: 2026-09-26
            - label: ABDM
              value: The pricing page says "HealthPlix is ABDM compliant EMR"
              source: https://www.healthplix.com/pricing-1
              checkedOn: 2026-09-26
            - label: Review score
              value: 4.5 on SoftwareSuggest from 4 reviews
              source: https://www.softwaresuggest.com/healthplix
              checkedOn: 2026-09-26
            - label: Capterra
              value: No reviews yet (0 reviews)
              source: https://www.capterra.com/p/10005728/HealthPlix/
              checkedOn: 2026-09-26

        - id: healthray
          name: Healthray
          bestFor: Clinics that may grow into a hospital on the same system
          url: https://healthray.com/
          body: >-
            Healthray's main product is hospital software, with a lighter setup for clinics and nursing homes,
            and it says 2,500+ hospitals and clinics and 5,000+ doctors use it. It says it is NHA-approved and
            ABDM compliant, with ABHA creation at registration, and that 1M+ ABHA IDs have been created on it.
            The clinic software lists SMS and WhatsApp reminders, speciality templates, pharmacy and lab links,
            teleconsultation, and an AI assistant with voice-to-note transcription. The pricing page shows
            ₹30,000 a year per care centre for up to 10 users on the Clinical Management Basic plan and ₹36,000
            on Advanced, which adds the EMR, notes, prescriptions and pharmacy, billed yearly with taxes extra;
            the same cards also show ₹499 and ₹699 per user per month, so ask which applies to you. Extra
            providers and the patient app cost more, and the yearly charge can be revised for inflation.
            It offers cloud, on-premise and hybrid hosting, says most clinics go live in about 7 days, and gives
            support in English, Hindi and Gujarati.
          pros:
            - Published prices per care centre for up to 10 users, with per-user figures alongside.
            - Cloud, on-premise or hybrid hosting.
            - SMS and WhatsApp reminders, and voice-to-note transcription.
            - Inpatient, lab and pharmacy modules on the same system when the clinic grows.
          cons:
            - The ₹30,000 Basic plan does not list the EMR; that needs Advanced.
            - Extra providers and the patient app cost extra.
            - The yearly charge can be revised for inflation.
            - Most of the customers named on its homepage are hospitals.
          facts:
            - label: Published price
              value: >-
                ₹30,000 (Basic) or ₹36,000 (Advanced) a year per care centre, up to 10 users, taxes extra; the
                same cards show ₹499 or ₹699 per user per month
              source: https://healthray.com/pricing/
              checkedOn: 2026-09-26
            - label: ABDM
              value: Says it is NHA-approved and ABDM compliant, with ABHA creation at registration
              source: https://healthray.com/
              checkedOn: 2026-09-26
            - label: Going live
              value: Most clinics in about 7 days; larger polyclinics with pharmacy and lab in one to two weeks
              source: https://healthray.com/clinic-management-software/
