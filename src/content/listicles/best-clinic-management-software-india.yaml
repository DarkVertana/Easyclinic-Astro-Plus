      heading: When should a clinic in India switch to new software?
      body: |-
        The honest answer is that you switch the moment admin starts stealing time from patients.

        Most clinics do not move because of one dramatic failure. They move because the small costs add up, the front desk is always behind, and nobody can say with confidence how the practice is actually doing.
      link:
        label: Book a demo
        href: /indiademo/
      media:
        kind: screenshot
        src: ../../assets/images/best-clinic-management/01.webp
        alt: 'An Easy Clinic invoice for a patient visit: consultation, lab tests and pharmacy items, with the insurance share claimed, the co-pay received and the balance settled'
        frame: none

  - discriminant: splitContent
    value:
      id: how-easy-clinic-stands-out
      tone: plain
      centerHeading: true
      mediaFirst: true
      alignTop: true
      stickyMedia: true
      heading: How Easy Clinic stands out for clinics in India
      intro: >-
        Easy Clinic earns its place by running the whole clinic in one place, with AI doing the heavy lifting.
        Four things do most of the work.
      body: |-
        ### One system, front desk to back office
        Appointments, records, billing, insurance claims, scheduling, pharmacy, stock, lab and radiology, reports, a no-code workflow builder and a branded patient app, all under one login.

        ### Cura AI where it counts.
        The AI helps finish a prescription in about three clicks, supports diagnosis, and runs wait time management, stock reorder and two-way patient messages.

        ### Built for how your clinic pays and talks.
        Payments and insurance claims from inside the record, and reminders and prescriptions over WhatsApp, SMS and email.

        ### Made to grow.
        One shared view across branches, plus a data warehouse for chains. HL7, FHIR and DICOM are live today.

        Behind the features sits a long track record. Easy Clinic serves more than 5,000 doctors across 200 cities in 18 countries, handles over 200,000 prescriptions a day, and has supported clinics for more than 10 years.
