sections:
  - discriminant: prose
    value:
      id: verdict
      heading: The short answer, by type of clinic
      body: >-
        If you are one doctor and the price matters most, Doctors App charges ₹10,999 a year before GST with
        two staff logins, and HealthPlix, at ₹12,000, describes itself as an online and offline EMR. If your
        patients already book you on Practo.com, Practo Ray has Practo.com integration on both plans, and if
        you also run a lab and pharmacy counter, or inpatient beds, MocDoc and Healthray sell those modules
        alongside their clinic software. For a clinic of two or more doctors, or a group opening branches, that
        wants the appointment book, the chart, the bill and WhatsApp reminders in one login with training and
        support included, we would choose Easy Clinic, and we say that as the company that makes it.

  - discriminant: prose
    value:
      id: how-we-compared
      heading: How we compared them
      body: |
        We read each vendor's own website on 26 September 2026, including price lists and help articles, and took review scores, with the number of reviews behind them, from Capterra, SoftwareSuggest and Techjockey. Every competitor fact in the table and in the vendor sections links to the page it came from. Where a vendor does not publish something, the cell says "Not published" with the date we looked.

        We compared what an Indian clinic owner asks about first: the published price and how it is counted, WhatsApp reminders, AI help with the clinical note, running more than one branch, and what happens when the internet drops. We did not run a trial of each product, so nothing here rates speed or ease of use. The four tests further down are how to judge that on your own clinic's day.

        The six competitors are Practo Ray, HealthPlix, MocDoc, Healthray, Doctors App and DocEngage. In the vendor sections they follow Easy Clinic in alphabetical order, with no ranking between them, because the right one depends on your clinic.

