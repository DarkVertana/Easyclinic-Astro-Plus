  - discriminant: splitContent
    value:
      id: when-to-switch
      tone: wash
      centerHeading: true
      heading: When should a clinic in India switch to new software?
      body: |-
        The honest answer is that you switch the moment admin starts stealing time from patients.

        Most clinics do not move because of one dramatic failure. They move because the small costs add up, the front desk is always behind, and nobody can say with confidence how the practice is actually doing.
      link:
