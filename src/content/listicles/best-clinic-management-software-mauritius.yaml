faq:
  - question: Is this ranking biased, since Easy Clinic publishes it?
    answer: >-
      It could be, so we made it checkable and left Easy Clinic out of the ranking: every fact about the other four
      links to the vendor's own page, read on 14 October 2026, and we do not rank ourselves while our rupee price is
      unpublished.
  - question: Which print prescriptions in French?
    answer: >-
      MocDoc's Mauritius page says it supports prescriptions and reports in English and French. None of the other four,
      Easy Clinic included, names French prescriptions on the pages we read.
  - question: Which of these work without the internet?
    answer: >-
      Ksatria's on-site server runs without a live connection, and Adroit installs on-premise. DoctorsApp, MocDoc and
      Easy Clinic run in the cloud, and Easy Clinic does not run fully offline today.
  - question: Which have an AI scribe?
    answer: >-
      Easy Clinic's Cura AI and DoctorsApp's AI medical scribe draft notes from the consult. Adroit's eScribe is a
      remote human scribe, and we found no AI note drafting on MocDoc's or Ksatria's pages.
  - question: What does Easy Clinic cost in Mauritius?
    answer: >-
      Easy Clinic's rupee price is not yet published. The [pricing page](/pricing/) has the US dollar list, which starts
      at {price:usd.professional.annual} per doctor per month on Professional billed annually, with no setup fee and no
      binding contract.

