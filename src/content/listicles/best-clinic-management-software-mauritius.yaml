        - ['**MocDoc**', 'Says it ==supports Mauritius Data Protection Act 2017 requirements== and aligns with Mauritius Ministry of Health guidelines. Lists generic claims and TPA tools. Does not name the Medical Council or any insurer.', '[mocdoc.com](https://mocdoc.com/mauritius)']
