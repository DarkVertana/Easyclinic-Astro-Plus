  - discriminant: vendorList
    value:
      id: vendors
      heading: The five systems, one by one
      intro: The four others in ranked order for a clinic in Mauritius, then Easy Clinic, unranked, in the same format.
      vendors:
        - id: doctorsapp
          name: DoctorsApp
          rank: 1
          bestFor: Private clinics, polyclinics and healthcare chains that want a published price and an AI scribe
          url: https://www.doctorsapp.in/
          body: >-
            DoctorsApp, an Indian cloud EMR, publishes a Mauritius article that lists private clinics, hospitals,
            polyclinics and healthcare chains as its users, with multi-clinic and multi-branch management, telemedicine,
            AI voice prescriptions and an AI medical scribe that turns the conversation into structured notes. Its plans
            include WhatsApp for all communication. Clinic plans are Rs. 10,999 and Rs. 16,999 a year before GST, with
            hospitals on request. It names no Mauritius office, client, currency or local rule.
          pros:
            - The only published price here
            - AI scribe, WhatsApp and branches
          cons:
            - Prices in Indian rupees, with Indian GST
            - No Mauritius office or client
          facts:
            - label: Clinic plans
              value: Rs. 10,999 (Silver) and Rs. 16,999 (Gold) a year, before 18% GST
              source: https://www.doctorsapp.in/pricing
              checkedOn: 2026-10-14

        - id: mocdoc
          name: MocDoc
          rank: 2
          bestFor: Clinics and hospitals from 10 beds to 300 or more
          url: https://mocdoc.com/mauritius
          body: >-
            MocDoc, from Chennai, publishes a Mauritius page saying it supports Data Protection Act 2017 requirements and
            multilingual prescriptions and reports in English and French. It is fully cloud-based, sends notifications by
            SMS, WhatsApp and email, and manages multi-location clinics centrally. It publishes no price, names no AI
            feature behind its AI heading, and its office is in India.
          pros:
            - Data Protection Act 2017 and English and French named
            - WhatsApp notifications and multi-location control
          cons:
            - No price published
            - No AI note drafting named
          facts:
            - label: Languages
              value: Prescriptions and reports in English and French
              source: https://mocdoc.com/mauritius
              checkedOn: 2026-10-14

        - id: adroit
          name: Adroit Infosystems
          rank: 3
          bestFor: Small clinics to hospital networks that want on-premise or cloud installation
          url: https://adroitinfosystems.com/healthcare-management-systems-mauritius
          body: >-
            Adroit, headquartered in Utah, publishes a Mauritius page with a local partner, BMH Consulting, and a client,
            Royal Green Hospital. Its eHospital supports main hospitals, satellite clinics and other locations, eClinic
            serves clinics and solo practitioners, and both install on-premise or in the cloud, with telehealth. Updates
            go to patients by SMS or email. Its eScribe is a remote human scribe service rather than AI, and it publishes
            no price.
          pros:
            - A local partner and a Mauritian hospital client
            - On-premise or cloud, with telehealth
          cons:
            - No price published
            - No WhatsApp or AI note drafting named
          facts:
            - label: Client in Mauritius
              value: Royal Green Hospital
              source: https://adroitinfosystems.com/healthcare-management-systems-mauritius
              checkedOn: 2026-10-14

        - id: ksatria
          name: Ksatria
          rank: 4
          bestFor: Private hospitals, clinics and medical centres of about 20 to 500 beds
          url: https://www.ksatria.io/en/hospital-information-system/mauritius/
          body: >-
            Ksatria, headquartered in Perth, publishes a Mauritius page with a regional contact for East Africa and the
            Indian Ocean and says it is looking for a local partner. It is cloud first, with an on-site server that runs
            without a live connection, configures hospital groups and branches, and sells a subscription without high
            upfront investment. It publishes no price, and we found no WhatsApp messages or AI on the pages we read.
          pros:
            - An on-site option that runs without the internet
            - Branch configuration
          cons:
            - No price published and no local partner yet
            - No WhatsApp or AI named
          facts:
            - label: Pricing model
              value: Flexible subscription without high upfront investment
              source: https://www.ksatria.io/en/hospital-information-system/mauritius/
              checkedOn: 2026-10-14

        - id: easyclinic
          name: Easy Clinic
          us: true
          bestFor: Connected private clinics, from one doctor to a group, that want AI notes and WhatsApp
          url: https://www.easyclinic.io/
          body: >-
            Easy Clinic has run clinics since {fact:founded} and is used by {fact:doctors} doctors in {fact:countries}
            countries. Cura AI listens to the consult and drafts the note for the doctor to confirm, on every plan, and
            WhatsApp reminders, video consultations and more than one location come with Premium. The limits matter in
            Mauritius. Its rupee price is not yet published, so this page leaves it unranked, and it names no Data
            Protection Act position or French prescriptions. It does not run fully offline.
          pros:
            - Cura AI note drafting on every plan
            - WhatsApp, video consultations and branches on Premium
          cons:
            - The rupee price is not yet published
            - No French prescriptions or Data Protection Act position named
          facts:
            - label: Price in Mauritius
              value: Rupee price not yet published
            - label: US dollar list
              value: From {price:usd.professional.annual} per doctor per month billed annually, on the [pricing page](/pricing/)

  - discriminant: stepList
    value:
      id: workflow-tests
      heading: Four tests to run in every demo
      steps:
        - title: Language test
          body: >-
            Print a prescription in French. MocDoc names English and French prescriptions; ask the others, Easy Clinic
            included, to show it.
        - title: Doctor context test
          body: >-
            Dictate a note. Easy Clinic (Cura AI) and DoctorsApp (AI medical scribe) publish AI note drafting; Adroit's
            eScribe is a human service.
        - title: Connection test
          body: >-
            Pull the network cable mid-consult. Adroit and Ksatria offer on-premise or on-site servers; the others run in
            the cloud.
        - title: Cost test
          body: Ask for the full yearly price in Mauritian rupees for your number of doctors and sites.

  - discriminant: decisionMatrix
    value:
      id: when-to-choose-which
      heading: When to choose which
      options:
        - title: Choose DoctorsApp or MocDoc if
          items:
            - You want a published price and an AI scribe, which DoctorsApp has.
            - You want prescriptions in English and French and a named Data Protection Act position, which MocDoc has.
            - You want WhatsApp notifications from a cloud system.
        - title: Choose Adroit or Ksatria if
          items:
            - You run a hospital and want on-premise installation.
            - You want a local partner and a Mauritian hospital reference, which Adroit has.
            - You need to keep working without the internet, which Ksatria's on-site server offers.
        - title: Choose Easy Clinic if
          us: true
          items:
            - Your doctors want Cura AI to listen to the consult and draft the note.
            - Your patients read WhatsApp more than SMS, and you are ready for Premium.
            - You will get the rupee price in writing before you sign.

