  - discriminant: prose
    value:
      tone: plain
      id: verdict
      heading: The verdict by clinic type
      body: >-
        For a private clinic that wants a published price, WhatsApp, branches and an AI scribe, DoctorsApp ranks first
        here, though its prices are in Indian rupees. For a clinic that wants prescriptions in English and French and a
        named Data Protection Act position, MocDoc, second, is the closer fit. For a hospital that wants on-premise
        installation, Adroit, third, has a local partner and a Mauritian hospital client, and Ksatria, fourth, runs on
        an on-site server without the internet. Easy Clinic, unranked here, suits a connected private clinic or group
        that wants Cura AI to draft the note and WhatsApp reminders, once you have its price in rupees.
      width: measure

  - discriminant: prose
    value:
      tone: wash
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** Easy Clinic publishes this page. We rank the four other systems and leave Easy Clinic unranked, at the end of the table and the list. Every fact about the other four links to the page it came from.

        **When and where.** We read each vendor's own website on 14 October 2026. Where a vendor's pages did not say, the cell reads "Not published" with the date. Capterra and G2 could not be read on that date, so this page gives no independent review score.

        **How we ranked.** We weighed two checks first, a Mauritius presence and a published price, then three daily features: WhatsApp messages to patients, more than one branch and AI note drafting. All four publish a Mauritius page. DoctorsApp is the only one with a price and has all three daily features, so it ranks first; its prices are in Indian rupees, and we take each competitor's price as it stands. MocDoc has two daily features and is second. Adroit and Ksatria have one each, branches; the tie-break, a named client in Mauritius, puts Adroit third.

        **Why Easy Clinic is unranked.** Easy Clinic publishes all three daily features but no price in Mauritian rupees. We do not place ourselves in a ranking we wrote while our local price is unpublished.
      width: measure

