  - discriminant: vendorList
    value:
      id: vendors
      heading: The four systems, one by one
      intro: The three others in ranked order for a clinic in Uganda, then Easy Clinic, unranked, in the same format.
      vendors:
        - id: zanda
          name: Zanda
          rank: 1
          bestFor: Allied health practices that want a published price and an AI scribe
          url: https://zandahealth.com/clinic-management-software/
          body: >-
            Zanda is a cloud practice system built for allied health professionals, with scheduling, billing, SMS and email
            reminders, a client portal and telehealth. Its AI Scribe records, transcribes and drafts notes, and its Growth
            plan supports multiple locations. Prices are in US dollars: Starter at US$19 a month for one practitioner and
            Growth at US$49 plus US$19 per extra practitioner, with AI Pro and telehealth as add-ons. It names no Uganda
            presence, mobile money or WhatsApp.
          pros:
            - A published price in US dollars
            - An AI scribe and multiple locations
          cons:
            - No Uganda presence or mobile money named
            - Built for allied health rather than general clinics
          facts:
            - label: Plans
              value: Starter US$19 a month; Growth US$49 plus US$19 per extra practitioner
              source: https://zandahealth.com/pricing/
              checkedOn: 2026-10-14

        - id: kico
          name: Kico Web Design
          rank: 2
          bestFor: Small and medium clinics in Uganda that want a custom system
          url: https://kicowebdesign.com/services/clinic-management-software
          body: >-
            Kico Web Design is a Kampala web and software agency that builds clinic systems to order for small and medium
            clinics, without the insurance claim depth of a full hospital system. It integrates MTN Money and Airtel Money
            so patients pay for consultations and drugs directly, sets up SMS reminders, and says its systems work on
            intermittent internet. Each project is quoted on scope. It names no WhatsApp messages, branches, AI or clinic
            clients.
          pros:
            - MTN Money and Airtel Money integrated
            - A supplier in Kampala
            - Built for intermittent internet
          cons:
            - A custom build with no published price
            - No WhatsApp, branches or AI named
          facts:
            - label: Location
              value: Kampala, serving all of Uganda
              source: https://kicowebdesign.com/services/clinic-management-software
              checkedOn: 2026-10-14

        - id: smart-hospital-manager
          name: Smart Hospital Manager
          rank: 3
          bestFor: Clinics and practitioners that want to pay once and host it
          url: https://smarthospitalmanager.com/pages/managementsoftware/uganda/
          body: >-
            Smart Hospital Manager, from OnClick Technologies, publishes a Uganda page that sells a lifetime licence with no
            monthly fees, renewals or per-patient charges, self-hosted on your own server. It lists an SMS gateway, TPA
            management and payment gateways, and says it works for clinics with different locations. It publishes no price
            and names no Uganda office or client, mobile money, WhatsApp or AI.
          pros:
            - A lifetime licence with no monthly fee
            - Runs on your own server
          cons:
            - No price published
            - No mobile money, WhatsApp or AI named
          facts:
            - label: Licence
              value: Pay once, own for life, no monthly fees or renewals
              source: https://smarthospitalmanager.com/pages/managementsoftware/uganda/
              checkedOn: 2026-10-14

