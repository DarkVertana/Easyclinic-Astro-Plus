faq:
  - question: Is this ranking biased, since Easy Clinic publishes it?
    answer: >-
      It could be, so we made it checkable and left Easy Clinic out of the ranking: every fact about the other three links
      to the vendor's own page, read on 14 October 2026, and we do not rank ourselves while our shilling price is
      unpublished.
  - question: Which of these take MTN or Airtel Money?
    answer: >-
      Kico Web Design integrates MTN Money and Airtel Money for consultations and drugs. Zanda takes cards through Stripe,
      and Smart Hospital Manager and Easy Clinic name no mobile money on the pages we read.
  - question: Which have an AI scribe?
    answer: >-
      Easy Clinic's Cura AI and Zanda's AI Scribe draft notes from the session. We found no AI on Kico Web Design's or Smart
      Hospital Manager's pages.
  - question: Which cope with unreliable internet?
    answer: >-
      Kico Web Design says its systems work on intermittent internet, and Smart Hospital Manager runs on your own server.
      Zanda and Easy Clinic run in the cloud, and Easy Clinic does not run fully offline today.
  - question: What does Easy Clinic cost in Uganda?
    answer: >-
      Easy Clinic's shilling price is not yet published. The [pricing page](/pricing/) has the US dollar list, which starts
      at {price:usd.professional.annual} per doctor per month on Professional billed annually, with no setup fee and no
      binding contract.

