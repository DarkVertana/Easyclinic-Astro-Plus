sections:
  - discriminant: prose
    value:
      id: verdict
      heading: The verdict by clinic type
      body: >-
        For a practice that wants a published price and AI note drafting, Zanda ranks first here, though it is built for
        allied health practices and names no Uganda presence or mobile money. For a small or medium clinic in Kampala that
        takes MTN or Airtel Money and copes with intermittent internet, Kico Web Design, second, builds a custom system to
        a quote. For a facility that would rather pay once and host it, Smart Hospital Manager, third, sells a lifetime
        licence. Easy Clinic, unranked here, suits a connected clinic that wants Cura AI to draft the note and WhatsApp
        reminders, but it names no mobile money today.
      width: measure

  - discriminant: prose
    value:
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** Easy Clinic publishes this page. We rank the three other systems and leave Easy Clinic unranked, at the end of the table and the list. Every fact about the other three links to the page it came from.

        **When and where.** We read each vendor's own website on 14 October 2026. Where a vendor's pages did not say, the cell reads "Not published" with the date. Capterra and G2 could not be read on that date, so this page gives no independent review score.

        **How we ranked.** We weighed two checks first, a Uganda presence and a published price, then four daily features: mobile money, WhatsApp to patients, more than one location and AI note drafting. Each competitor meets one of the two checks: Zanda a price, Kico Web Design and Smart Hospital Manager a Uganda presence. Zanda has two daily features, locations and AI, so it ranks first. Kico Web Design and Smart Hospital Manager have one each; the tie-break, an office in Uganda, puts Kico Web Design second.

        **Why Easy Clinic is unranked.** Easy Clinic publishes three daily features but no mobile money and no shilling price. We do not place ourselves in a ranking we wrote while our local price is unpublished.
      width: measure

