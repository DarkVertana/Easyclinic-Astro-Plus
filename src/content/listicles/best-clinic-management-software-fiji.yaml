      heading: What clinics in Fiji actually compare before they choose
      body: |-
        Most shortlists in Fiji come down to a handful of names, and on a features page they all read the same. The differences only show up once you ask the right questions.

        The systems compared on this page alongside Easy Clinic are MocDoc, Smart Hospital Manager and SoftNet. Each one is strong at something. None of them is strong at everything.

        The comparison below is built from what each company documents on its own website. Nothing is invented, and where a vendor does not state a position publicly, we say so instead of guessing.
      media:
