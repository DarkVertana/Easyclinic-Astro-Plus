faq:
  - question: Is this ranking biased, since Easy Clinic publishes it?
    answer: >-
      It could be, so we made it checkable and left Easy Clinic out of the ranking: every fact about the other three
      links to the vendor's own page, read on 14 October 2026, and we do not rank ourselves while our Fiji dollar price
      is unpublished.
  - question: Which of these link billing to FRCS's VAT Monitoring System?
    answer: >-
      MocDoc's Fiji page says its billing integrates with the VAT Monitoring System for FRCS reporting. SoftNet names
      FRCS accreditation for its POS product, not its hospital software, and Easy Clinic and Smart Hospital Manager name
      no link, so ask each to show it before you sign.
  - question: Which of these work without the internet?
    answer: >-
      Smart Hospital Manager and SoftNet install on your own server, which keeps working inside the clinic when the
      internet drops. Easy Clinic and MocDoc run in the cloud, and Easy Clinic does not run fully offline today.
  - question: Which send WhatsApp reminders to patients?
    answer: >-
      MocDoc sends notifications by SMS, email or WhatsApp, and Easy Clinic sends WhatsApp reminders on Premium.
      SoftNet sends prescriptions by SMS or email, and Smart Hospital Manager lists an SMS gateway.
  - question: Is it cheaper to pay once or subscribe?
    answer: >-
      A pay-once licence can cost less upfront, but you take on the server, backups, updates and staff time. A cloud
      subscription folds those in, so compare the total over a few years, in Fiji dollars.
  - question: What does Easy Clinic cost in Fiji?
    answer: >-
      Easy Clinic's Fiji dollar price is not yet published. The [pricing page](/pricing/) has the US dollar list,
      which starts at {price:usd.professional.annual} per doctor per month on Professional billed annually, with no
      setup fee and no binding contract.

