    value:
      id: when-to-choose-which
      heading: When to choose which
      options:
        - title: Choose MocDoc if
          items:
            - You want billing linked to FRCS's VAT Monitoring System named on the vendor's own page.
            - You run several clinics or facilities and want unified reporting.
            - You are comfortable with a supplier whose office is in India.
        - title: Choose Smart Hospital Manager or SoftNet if
          items:
            - You want the software and patient data on your own server, which both offer.
            - You would rather pay once, which Smart Hospital Manager's lifetime licence offers.
            - You want a supplier with an office in Suva, which SoftNet has.
        - title: Choose Easy Clinic if
          us: true
          items:
            - You run a connected private clinic, from one doctor to several branches, and want one cloud system.
            - Your doctors want Cura AI to listen to the consult and draft the note.
            - Your patients read WhatsApp more than SMS, and you are ready for Premium.
            - You will get the Fiji dollar price in writing, and confirm VAT handling, before you sign.

