sections:
  - discriminant: prose
    value:
      id: verdict
      heading: The verdict by clinic type
      body: >-
        For a clinic or hospital that wants VAT billing linked to FRCS, WhatsApp notifications and several sites
        under one login, MocDoc ranks first here, though it publishes no price and its office is in Chennai. For a
        facility that would rather pay once and run the software on its own server, Smart Hospital Manager, second,
        sells a lifetime licence. For a hospital that wants a supplier in Suva, SoftNet, third, is the only one of the
        four with a Fiji office. Easy Clinic, unranked here, suits a connected private clinic or group that wants
        Cura AI to draft the note and WhatsApp reminders on one cloud system, once you have its price in Fiji dollars.
      width: measure

  - discriminant: prose
    value:
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** Easy Clinic publishes this page. We rank the three other systems and leave Easy Clinic unranked, at the end of the table and the list. Every fact about the other three links to the page it came from.

        **When and where.** We read each vendor's own website on 14 October 2026, starting from the Fiji page each one publishes or links. Where a vendor's pages did not say, the cell reads "Not published" with the date. G2 and Capterra could not be read on that date, so this page gives no independent review score for any of the four.

        **What we compared.** A Fiji presence the vendor publishes, the pricing model and any published price, WhatsApp messages to patients, running more than one site, AI note drafting, and where the software runs.

        **How we ranked.** We weighed two checks first, a Fiji presence the vendor publishes and a published price, then three daily features: WhatsApp messages to patients, more than one site and AI note drafting. All three publish a Fiji presence, and none publishes a price. MocDoc has two of the daily features, so it ranks first; Smart Hospital Manager mentions different locations, one daily feature, so it is second; SoftNet names none of the three, so it is third.

        **Why Easy Clinic is unranked.** Easy Clinic publishes all three daily features but has no published price in Fiji dollars. As on our other country comparisons, we do not place ourselves in a ranking we wrote while our local price is unpublished.

        **What this page leaves out.** Easy Clinic's cells come from its published plans and its US dollar price list. It names no FRCS VAT Monitoring System link and no mobile money such as M-PAiSA or MyCash, and neither do the other three on the pages we read, except MocDoc's VAT link.
      width: measure

