  - discriminant: stepList
    value:
      id: workflow-tests
      heading: Five tests to run in every demo
      intro: >-
        Feature lists look alike. Run the same tests with every vendor, on a patient day like yours.
      steps:
        - title: VAT test
          body: >-
            Raise an invoice and ask to see how it reaches FRCS's VAT Monitoring System. MocDoc names that link; ask
            the other three, Easy Clinic included, to show it before you sign.
        - title: Doctor context test
          body: >-
            Open a returning patient and dictate a note. Easy Clinic (Cura AI) publishes note drafting; we found none
            on the other three systems' pages.
        - title: Connection test
          body: >-
            Pull the network cable halfway through a consult. Easy Clinic and MocDoc run in the cloud; Smart Hospital
            Manager and SoftNet run on your own server instead.
        - title: Follow-up test
          body: >-
            Send a reminder to a patient's phone and ask which channel it uses and which plan it needs. On Easy
            Clinic, WhatsApp starts on Premium and SMS and email come with Professional.
        - title: Cost test
          body: >-
            Ask for the full price in Fiji dollars, including setup, moving your records across and, for a server you
            host, the machine, backups and staff time.

  - discriminant: prose
    value:
      id: what-they-cost
      heading: What each one costs
      body: |-
        None of the three competitors publishes a price. MocDoc asks for a demo, SoftNet for a quote, and Smart Hospital Manager sells a one-time lifetime licence without naming the figure ([Fiji page](https://smarthospitalmanager.com/pages/managementsoftware/fiji/)).

        Easy Clinic's Fiji dollar price is not yet published, so this page gives no Easy Clinic price for Fiji. Its US dollar list on the [pricing page](/pricing/) is {price:usd.professional.annual} per doctor per month on Professional and {price:usd.premium.annual} on Premium, both billed annually, with no setup fee and no binding contract.

        A pay-once licence on your own server adds the server, backups, updates and staff time; a cloud subscription folds those in. Ask every vendor for a quote in Fiji dollars and compare the total over a few years.
      width: measure

