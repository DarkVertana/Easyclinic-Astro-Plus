  - discriminant: vendorList
    value:
      id: vendors
      heading: The four systems, one by one
      intro: >-
        The three others in ranked order for a clinic in Fiji, then Easy Clinic, unranked, in the same format.
      vendors:
        - id: mocdoc
          name: MocDoc
          rank: 1
          bestFor: Facilities from 10 beds to 300 or more, clinics, labs and specialty centres
          url: https://mocdoc.com/fiji
          body: >-
            MocDoc, from Yro Systems in Chennai, publishes a Fiji page that names clinics in Suva, hospitals in Lautoka
            and labs in Nadi. It is fully cloud-based, its billing links to FRCS's VAT Monitoring System for
            VAT-compliant billing, and its multi-location feature manages several clinics or facilities across Fiji
            with unified reporting. Notifications for registrations, appointments and billing go by SMS, email or
            WhatsApp. It publishes no price, its office and phone are in Chennai, and its Fiji page names no AI
            feature behind its AI heading.
          pros:
            - Billing linked to FRCS's VAT Monitoring System
            - WhatsApp, SMS and email notifications
            - Several sites under one login
          cons:
            - No price published
            - Office and phone in India, not Fiji
          facts:
            - label: VAT
              value: Integrates with Fiji's VAT Monitoring System for FRCS reporting
              source: https://mocdoc.com/fiji
              checkedOn: 2026-10-14

        - id: smart-hospital-manager
          name: Smart Hospital Manager
          rank: 2
          bestFor: Clinics of any size that want to pay once and host the software themselves
          url: https://smarthospitalmanager.com/
          body: >-
            Smart Hospital Manager, from OnClick Technologies, publishes a Fiji page that sells a one-time lifetime
            licence with no monthly charges. It installs on your own web hosting server, lists an SMS gateway and
            payment gateways, and says it suits any hospital, specialist or dentist, with many practitioners or
            different locations. It publishes no price, names no WhatsApp messages or AI, and names no Fiji office or
            client. A pay-once licence means you run the server, the backups and the updates yourself.
          pros:
            - A lifetime licence with no monthly fee
            - Runs on your own server
          cons:
            - No price published
            - You run the server, backups and updates
            - No WhatsApp or AI named
          facts:
            - label: Licence
              value: One-time payment, lifetime licence, self-hosted
              source: https://smarthospitalmanager.com/pages/managementsoftware/fiji/
              checkedOn: 2026-10-14

        - id: softnet
          name: SoftNet
          rank: 3
          bestFor: Hospitals of any size that want a Fiji-based supplier
          url: https://softnetsolutions.com.fj/service/hospital-and-patient-management-software/
          body: >-
            SoftNet Solutions is based in Suva, at 72 Kula Street, Samabula, and sells a hospital and patient
            management suite that it says can be installed in any hospital, from a single clinic to a multi-speciality
