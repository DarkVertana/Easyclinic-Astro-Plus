  - discriminant: stepList
    value:
      id: workflow-tests
      heading: Five tests to run in every demo
      intro: Run the same tests with every vendor, on a patient day like yours.
      steps:
        - title: NHIS test
          body: >-
            Take an NHIS patient from registration to a submitted claim. Ksatria names NHIS claims workflows; ask the
            others, Easy Clinic included, to show the claim itself.
        - title: Payment test
          body: >-
            Take a cash and a Mobile Money payment at the desk. None of the four names MTN MoMo on its pages, so ask
            each one how the payment is recorded against the bill.
        - title: Connection test
          body: >-
            Pull the network cable halfway through a consult. Ksatria's on-site option and Smart Hospital Manager run
            on your own server; Easy Clinic runs in the cloud and does not run fully offline today.
        - title: Doctor context test
          body: >-
            Open a returning patient and dictate a note. Easy Clinic (Cura AI) publishes note drafting; we found none on
            the other three systems' pages.
        - title: Cost test
          body: >-
            Ask for the full price in cedis, including setup, moving your records across and, for a server you host,
            the machine, backups and staff time.

  - discriminant: prose
    value:
      id: what-they-cost
      heading: What each one costs
      body: |-
        None of the three competitors publishes a price. Ksatria sells a monthly subscription per user with no upfront licence, by quote ([hospital management systems](https://www.ksatria.io/en/hospital-management-systems/)); Smart Hospital Manager sells a one-time lifetime licence without naming the figure; and Health Pro HMS shows a placeholder price on its shop page.

        Easy Clinic's cedi price is not yet published, so this page gives no Easy Clinic price for Ghana. Its US dollar list on the [pricing page](/pricing/) is {price:usd.professional.annual} per doctor per month on Professional and {price:usd.premium.annual} on Premium, both billed annually, with no setup fee and no binding contract.

        A pay-once licence on your own server adds the server, backups, updates and staff time; a subscription folds those in. Ask every vendor for a quote in cedis and compare the total over a few years.
      width: measure

