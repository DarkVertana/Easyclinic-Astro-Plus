faq:
  - question: Is this ranking biased, since Easy Clinic publishes it?
    answer: >-
      It could be, so we made it checkable and left Easy Clinic out of the ranking: every fact about the other three
      links to the vendor's own page, read on 14 October 2026, and we do not rank ourselves while our cedi price is
      unpublished.
  - question: Which of these handle NHIS claims?
    answer: >-
      Ksatria says it integrates NHIS claims workflows. Health Pro HMS and Smart Hospital Manager name insurance claims
      without NHIS, and Easy Clinic's NHIA and NHIS claim integration is planned, not live, so ask each vendor to show
      an NHIS claim before you sign.
  - question: Which of these work without the internet?
    answer: >-
      Ksatria's on-site option runs fully independently of the internet day to day, and Smart Hospital Manager installs
      on your own server. Easy Clinic runs in the cloud and does not run fully offline today.
  - question: Do any of them take Mobile Money?
    answer: >-
      None of the four names MTN MoMo or other Mobile Money on the pages we read on 14 October 2026. Ksatria names
      Seerbit for point-of-care digital payments, and Easy Clinic's Mobile Money integrations are planned.
  - question: Is it cheaper to pay once or subscribe?
    answer: >-
      A pay-once licence can cost less upfront, but you take on the server, backups, updates and staff time. A
      subscription folds those in, so compare the total over a few years, in cedis.
  - question: What does Easy Clinic cost in Ghana?
    answer: >-
      Easy Clinic's cedi price is not yet published. The [pricing page](/pricing/) has the US dollar list, which starts
      at {price:usd.professional.annual} per doctor per month on Professional billed annually, with no setup fee and no
      binding contract.

