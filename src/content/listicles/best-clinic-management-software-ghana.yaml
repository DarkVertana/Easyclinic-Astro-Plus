        Easy Clinic's cedi price is not yet published, so this page gives no Easy Clinic price for Ghana. Its US dollar list on the [pricing page](/pricing/) is {price:usd.professional.annual} per doctor per month on Professional and {price:usd.premium.annual} on Premium, both billed annually, with no setup fee and no binding contract.

