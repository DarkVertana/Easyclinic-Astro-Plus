sections:
  - discriminant: prose
    value:
      id: verdict
      heading: The verdict by clinic type
      body: >-
        Helium Health ranks first of the six we ranked and fits a hospital or a group that wants inpatient wards
        and HMO payments from a vendor with a Lagos office, and AjirMed, designed in Nigeria and second here, is
        the alternative with an AI scribe. For a solo doctor or a small clinic, ClinikEHR lets you start on a
        free plan, and EasyClinic, unranked here, suits a clinic with a steady internet line that wants Cura AI
        to draft the note, once you have its naira price, which is not yet published. Where the internet drops
        often, CliniquePlus and Hyella run on a server inside the facility that the clinic's computers reach
        without a connection.
      width: measure

  - discriminant: prose
    value:
      id: how-we-compared
      heading: How we compared
      body: |-
        **Who wrote this.** EasyClinic publishes this page. We rank the six other systems and leave EasyClinic unranked, at the end of the table and the list, for the reason given under "How we ranked" below. Every fact about the other six systems links to the page it came from.

        **When and where.** We read each vendor's own website on 26 September 2026, including its pricing page and privacy policy where it has them. AjirMed, CliniquePlus and ClinikEHR also publish buyer's guides about Nigeria; where a claim appears only in one of those, the page says so. Review scores come from Capterra, with the number of reviews. Where a vendor's pages did not say, the cell reads "Not published".

        **How we chose the seven.** SoftwareSuggest's Nigeria address for hospital software now redirects to [its global hospital software list](https://www.softwaresuggest.com/hospital-management-software), which is mostly Indian systems priced in rupees, so we used the search results for clinic, hospital and EMR software in Nigeria. We kept the systems that publish a Nigerian office, a Nigeria page or clinics in Nigeria.

        **How we ranked.** For a private clinic in Nigeria we checked eight things each vendor publishes: a price you can see before a sales call, WhatsApp messages to patients, more than one branch, AI note drafting, working through a power or internet outage, HMO claims, a Nigerian address or phone line, and independent reviews with a count. Helium Health, AjirMed, Hyella and ClinikEHR meet five, CliniquePlus four and MocDoc three. EasyClinic meets five as well. It misses the price check, because the naira price a Nigerian clinic would pay is not yet published, and it also misses the outage and Nigerian address checks. ClinikEHR's pricing page is in dollars too and still meets the check, because we take each competitor's published price as it stands and hold our own dollar list to a stricter test. That puts EasyClinic in a tie with four others, and the order within a tie is our judgment, so we leave EasyClinic unranked rather than place ourselves. We chose the checks, and several suit EasyClinic: a clinic that puts a Nigerian office or working offline above everything else should read Helium Health, AjirMed, Hyella and CliniquePlus before us.

        **Ties.** Among the four ranked systems on five checks, Helium Health comes first because its product pages name both WhatsApp messages and AI note drafting, and AjirMed is next because it adds an AI scribe to a Nigerian phone line. Hyella follows for its naira price list. ClinikEHR's offline and HMO claims appear only in its blog, which is why it sits fourth. EasyClinic's plan list also names WhatsApp messages and AI note drafting, so the first of these reasons ties it with Helium Health, and the second, which counts a Nigerian phone line, would put Helium Health ahead. These reasons are our own judgment, and we do not use our judgment to place ourselves, so EasyClinic has no rank.

        **What this page leaves out.** EasyClinic's own cells come from its published plans and its US dollar price list, and its naira price is not yet published. This page does not state EasyClinic's NHIA or NDPA status, and it gives EasyClinic's Capterra rating without a review count. We did not run a trial of any system, so nothing here rates speed or ease of use, and other systems sold in Nigeria are not covered in this edition.
      width: measure

