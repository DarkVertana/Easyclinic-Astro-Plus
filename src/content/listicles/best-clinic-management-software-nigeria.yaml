  onlyUsCouldWrite: >-
    The outage test, the capitation and fee-for-service split on an HMO claim, and the point that Easy Clinic
    publishes no Nigerian office while Helium Health, Hyella and CliniquePlus publish Lagos and Abuja addresses are
    specific to a clinic owner in Nigeria.
