  - discriminant: migrationPlan
    value:
      id: moving-your-clinic
      tone: plain
      heading: Bringing your clinic across, without losing a thing
      intro: >-
        Most clinics we onboard are moving off something that stopped fitting. Here is how the move works, and
        what is different depending on where you are coming from.
      steps:
        - title: We take the export
          body: You give us access or a file. We pull patient records, visit history, billing and stock out of your current system.
        - title: We map and import
          body: Your fields get matched to ours and checked with you before anything goes live. Duplicates and gaps are cleaned on the way in.
        - title: Your team trains
          body: Front desk, doctors and pharmacy each get a session on their own part of the day, with your account manager on hand.
        - title: You go live
          body: We run both systems in parallel for the first few days, so nothing is lost while your staff settle in.
      stats:
        - { value: 2 to 4 weeks, label: 'Single clinic, start to live' }
        - { value: 4 to 6 weeks, label: Multi-branch clinics and chains }
        - { value: No data loss, label: Parallel running until you sign off }
      systems:
        - name: 'Helium Health'
          comesAcross: 'Patient records, appointment history and billing data.'
          lookAt: 'We review the export before we quote a date, so nothing is lost in the move.'
        - name: 'AjirMed'
          comesAcross: 'Patient records, clinical notes and billing history.'
          lookAt: 'Field mapping is agreed with you first, since layouts differ between systems.'
        - name: 'Hyella'
          comesAcross: 'Patient records, appointments and invoices.'
          lookAt: 'Fields without a direct equivalent are agreed with you before anything is imported.'
        - name: 'ClinikEHR'
          comesAcross: 'Patient records, appointment history and billing data.'
          lookAt: 'We review the export before we quote a date, so nothing is lost in the move.'
        - name: 'CliniquePlus'
          comesAcross: 'Patient records, clinical notes and billing history.'
          lookAt: 'Field mapping is agreed with you first, since layouts differ between systems.'
        - name: 'MocDoc'
          comesAcross: 'Patient records, appointments and invoices.'
          lookAt: 'Fields without a direct equivalent are agreed with you before anything is imported.'
        - name: 'Excel or paper'
          comesAcross: 'Patient master list, visit history and stock data.'
          lookAt: 'Column headings and duplicate patient entries get cleaned before import. Usually the quickest route of all.'
        - name: 'An older on-premise system'
          comesAcross: 'A full database export.'
          lookAt: 'We review how the old system stored things before we commit to a date, rather than guessing.'
      note: Every migration comes with a dedicated account manager, not a help article.

