faq:
  - question: Can Easy Clinic handle HMO claims?
    answer: >-
      Yes. The patient's HMO and plan are linked at registration, so cover is checked before the consultation.
      Tests and medicines are checked against the plan during care, and the claim is built from the visit and the
      bill with the documents attached. HMO claims come with Enterprise, or as an add-on on Professional and
      Premium.
  - question: How much does Easy Clinic cost in Nigeria?
    answer: >-
      Easy Clinic is priced per doctor. Professional is ₦107,000 and Premium ₦134,000 per doctor per month, billed
      annually, and Enterprise is on a quote. Every plan includes a login for your receptionist at no extra cost,
      and there is no setup fee for clinics up to 5 users.
  - question: What happens when the power or internet goes?
    answer: >-
      Easy Clinic is cloud software, so it needs a connection, and it does not run fully offline today. Most
      clinics keep a mobile data hotspot and a small UPS beside the reception computer, so registration,
      prescriptions and billing carry on when the main line or power drops. Your records stay safe in the cloud
      throughout.
  - question: How does Easy Clinic protect patient data?
    answer: >-
      Easy Clinic lists compliance with HIPAA and GDPR. Records are protected with role-based access, audit logs
      and encryption in transit and at rest, and each person sees only what their role needs. Your patient data
      belongs to your clinic, and you can export it to Excel or PDF at any time.
  - question: Does Easy Clinic send WhatsApp reminders to patients?
    answer: >-
      Yes. Easy Clinic sends prescriptions, invoices, lab reports and appointment reminders on WhatsApp on every
      plan, with a monthly message allowance by plan. Reminders go out the day before and again on the day of the
      visit, never at night. Medicine instructions and advice can print in the patient's own language.
  - question: Is Cura AI included in every plan?
    answer: >-
      Cura AI is a paid add-on that works with any plan. It runs in the background at registration, triage and the
      consultation. It flags what does not add up, such as a missed allergy, and suggests diagnosis and treatment.
      The clinic sets the triggers and alert style, and the doctor always makes the final decision.
  - question: How does Easy Clinic support clinics in Nigeria?
    answer: >-
      Every clinic gets a dedicated account manager and help on WhatsApp. The Easy Clinic team builds your
      prescription format, imports your old records and trains each role online before you go live. New staff are
      trained through the year, so a change at the front desk does not slow the clinic down.
  - question: What happens when we open a second branch?
    answer: >-
      You move to Premium, which covers more than one location. Each branch sits in a location dropdown under the
      same login, with shared patient records and one shared stock. Enterprise adds central control of every
      location and a Power BI data warehouse for clinic chains.
  - question: Can our doctors and staff share one login?
    answer: >-
      We advise against it. Each doctor, nurse, receptionist, lab technician and pharmacist gets their own login
      and works from their own queue. That keeps every prescription, bill and stock entry traceable to the person
      who made it. The admin sets what each role can see, and a doctor can also be the admin.
  - question: How long does it take to switch to Easy Clinic?
    answer: >-
      Most clinics go live within 2 to 4 weeks. Easy Clinic builds your prescription format from your own sample,
      imports records from your old system, and trains reception, doctors, lab and pharmacy on their own part of
      the day. Your dedicated account manager stays with you after go-live.

