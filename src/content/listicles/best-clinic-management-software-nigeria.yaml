sections:
  - discriminant: prose
    value:
      id: what-is-clinic-management-software
      heading: What is clinic management software?
      tone: wash
      width: wide
      body: >-
        **Clinic management software** is the system that runs the whole clinic, not just the medical notes. It
        handles appointments and reminders, patient records, billing and payments, pharmacy and stock, lab
        reports, patient messaging, and the numbers that tell you how the clinic is doing. The **electronic medical
        record**, or EMR, is one part of it. In Nigeria the better systems also take payments at the desk, talk to
        patients on WhatsApp, work across more than one branch, and handle insurance claims from the patient
        record.

  - discriminant: splitContent
    value:
      id: why-clinics-need-software
      tone: plain
      centerHeading: true
      heading: Why clinics in Nigeria need clinic management software in 2026
      intro: >-
        Patients, rules and payers have all moved at the same time. A few things are pushing this harder than the
        rest.
      body: |-
        ### Patients book and chat on WhatsApp.
        If your clinic still runs on phone calls and paper, you are losing time and the odd patient every day.

        ### HMOs expect cleaner claims.
        When the HMO plan is checked at the desk and the claim is built from the visit, how your software handles cover and claims matters more than it used to.

        ### Missed appointments cost real money.
        WhatsApp and SMS reminders the day before and on the day bring people back and steady your income.

        ### Patients read their own prescriptions.
        Medicine instructions and advice in a language the patient reads land far better than a rushed note on paper.

        ### Three-year cost matters more than the sticker price.
        Cloud pricing means no server to buy, but the real number includes setup, training, support, and what it costs to move again if the system stops fitting.
      media:
        kind: screenshot
        src: ../../assets/images/best-clinic-management/04-nigeria.webp
        alt: Easy Clinic in numbers
        frame: none

