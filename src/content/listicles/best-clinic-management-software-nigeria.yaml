  - discriminant: splitContent
    value:
      id: how-easy-clinic-stands-out
      tone: plain
      centerHeading: true
      mediaFirst: true
      alignTop: true
      stickyMedia: true
      heading: How Easy Clinic stands out for clinics in Nigeria
      intro: >-
        Easy Clinic earns its place by running the whole clinic in one place, with tools that save the doctor and
        the front desk time on every visit. Four things do most of the work.
      body: |-
        ### One system, front desk to back office
        Appointments, records, billing, HMO claims, pharmacy, stock, lab, telemedicine and reports, plus a no-code workflow builder, all under one login. Each role, from reception to pharmacy, works from its own queue.

        ### Cura AI where it counts.
        Cura AI works in the background at registration, triage and the visit. It flags what does not add up and suggests diagnosis and treatment. The clinic sets the triggers, the doctor decides, and Cura AI is a paid add-on.

        ### Built for how your clinic pays and talks.
        Payments from the invoice at the desk and HMO claims from inside the record. Prescriptions, invoices, lab reports and reminders on WhatsApp, SMS and email, with medicine instructions in the patient's language.

        ### Made to grow.
        One login across branches, with shared stock and central reports. Chains can add a Power BI data warehouse, and HL7, FHIR and DICOM support keeps it ready to connect.

        Behind the features sits a long track record. Easy Clinic serves more than 5,000 doctors across 200+ cities in 18+ countries, has run clinics since 2003, and the largest chain on it runs 250 clinics.
