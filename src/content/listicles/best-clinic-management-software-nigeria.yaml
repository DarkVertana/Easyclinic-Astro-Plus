editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The outage test, the capitation and fee-for-service split on an HMO claim, and the point that EasyClinic
    has no Nigerian office while Helium Health, Hyella and CliniquePlus publish Lagos and Abuja addresses are
    specific to a clinic owner in Nigeria.
  readsMachineWritten: >-
    The seven vendor sections share one shape and rhythm, and a Nigerian owner will notice first that EasyClinic
    sits unranked with no naira price on the page, while every other system is ranked on what it publishes.

notes:
  - >-
    Structure: spec 5.14 (byline and date from the template; verdict by clinic type; how we compared with
    criteria, date, sources and a disclosure; ranked comparisonTable with a regulator row; one vendor section
    each with pros and cons; decisionMatrix; FAQ 8; sourceList), following best-clinic-management-software-kenya.yaml.
    EasyClinic is unranked and placed last, as on best-clinic-management-software-uae.yaml (see Ranking).
    The regulator row gives each vendor's own words on NHIA, HMO claims and NDPA; EasyClinic's cell says "Not
    published" (regulators/ng-*.yaml are all null); link /trust/ from it once the trust page publishes. No regulatorStrip or regulatorTable.
  - >-
    Vendor choice: https://www.softwaresuggest.com/hospital-management-software/nigeria now answers 301 to the
    global /hospital-management-software list (re-read 2026-09-26: "Compare 369 HMS Solutions", eHospital, MocDoc
    HIMS, Aarogya, DocOn..., prices in rupees, no Nigerian vendor), so the page describes the redirect and links
    the global list; its Nigeria blog is from 2020 (updated May 2025) with no Nigerian vendors. Techimply and GoodFirms returned 403. Search results for "best hospital management
    software Nigeria", "EMR software Nigeria" and "clinic management software Nigeria" surfaced MocDoc, AjirMed,
    CliniquePlus, Hyella, Healthray (en-ng page with no Nigeria-specific facts), ClinikEHR blogs, Focus Softnet
    Hospital ERP, eClinicPlus, Adroit, Smart Hospital Manager, Momentum Healthcare EMR and DawaHQ. Chosen: Helium
    Health (the best-known Nigerian vendor), AjirMed, Hyella, CliniquePlus (Nigerian, each with HMO features),
    MocDoc (spec 4.2 SERP holder with a Nigeria page and reviews) and ClinikEHR (free plan, public prices, lists
    Nigerian clinics). Left out: DawaHQ publishes "Plans start from ₦25,000/month" but says on its homepage it is
    "Early access: 1 committed pilot · pre-revenue"; Momentum Healthcare EMR's homepage shows "Used by 0+" and a
    lorem ipsum FAQ; Clinicea has no Nigeria page (clinicea.com/nigeria redirects home).
  - >-
    Ranking: eight published checks (price visible, WhatsApp to patients, more than one branch, AI note drafting,
    working through an outage, HMO claims named, Nigerian address or phone, independent reviews with a count).
    Scores as read: EasyClinic 5 (no price for Nigeria, no outage, no Nigerian presence); Helium 5 (no price, no
    outage, no reviews); AjirMed 5 (no price, no WhatsApp, no reviews; branches and outage from its own guide);
    Hyella 5 (no WhatsApp, no AI, no reviews); ClinikEHR 5 (no WhatsApp, no Nigerian address, no independent
    reviews; outage and HMO from its blog); CliniquePlus 4; MocDoc 3 (HMOs not named). Order within the
    five-point tie is judgment and is explained on the page. Re-scored 2026-09-26: EasyClinic had been credited
    with the price check on its USD list price and ranked first on 6. The live
    https://www.easyclinic.io/emr-software-in-nigeria/ (re-read 2026-09-26) says "Plans are priced in naira" and
    src/data/prices/ngn.yaml is all null, so the price a Nigerian clinic would pay is not published and the check
    is not met. That drops EasyClinic into a five-way tie at 5, and the page's first tie-break (product pages
    naming both WhatsApp and AI note drafting) ties it with Helium Health; the second (AI scribe plus a
    Nigerian phone line) would put Helium ahead, and the Ties paragraph says so, which keeps the page from implying
    EasyClinic could be first; any order the publisher chose would still be it judging itself. So EasyClinic is UNRANKED (no rank field) and LAST in the table columns, the vendor
    list and the decision matrix, as on the UAE listicle (src/lib/seo/page-graph.ts orders an unranked vendor by
    its array index, so it is ItemList position 7). Ranked: 1 Helium Health, 2 AjirMed, 3 Hyella, 4 ClinikEHR,
    5 CliniquePlus, 6 MocDoc (competitor order unchanged). ClinikEHR keeps the price check for its public USD
    pricing page (its blog's conflicting naira figures are noted below and not used); How we ranked states this
    asymmetry on the page (competitor prices taken as published, EasyClinic's USD list held to a stricter
    test). Once a naira price is
    published in ngn.yaml, EasyClinic scores 6 and should be ranked on the same rules, with the opener, verdict,
    How we ranked, Ties, FAQ and matrix order revisited.
  - >-
    Not found (cells say Not published): Helium Health price, offline use, any review page (Capterra
    /p/184250/Helium-Health/ returns 404; GoodFirms 403) and any NHIA mention; AjirMed price figures and street
    address; Hyella WhatsApp, AI note drafting, NHIA and reviews (Capterra /p/209633/Hyella/ returns 404);
    CliniquePlus price figures, WhatsApp to patients, AI note drafting and reviews (a Trustpilot "CliniquePlus" is a
    Turkish dental clinic, not this product); MocDoc price, AI note drafting, offline use, a Nigerian office and
    HMO or NHIA by name; ClinikEHR a Nigerian address, WhatsApp to patients and a Capterra listing.
  - >-
    Conflicts noted and not printed: Capterra's Ajirmed listing shows "Starting price $10 per user per month"
    while ajirmed.com's pricing page gives no figures (the page cites ajirmed.com). ClinikEHR's Nigeria blog gives
    two different naira prices for Essential (₦24,900 and ₦69,900) and a "Lagos-based support team", while its
    pricing page quotes USD and its about page lists only Dover, Delaware and a US phone; the page uses the
    pricing and about pages. Helium Health counts 500+ providers on its homepage and 1,000+ facilities on its
    about page, so the page uses only 10,000+ health workers (both pages). Hyella's FAQ writes "#200,000" (the
    common Nigerian keyboard stand-in for ₦) and covers all its business software; the page says so. MocDoc's
    Nigeria page shows unnamed-site ratings (4.8 from 400+ reviews) that are not used.
  - >-
    EasyClinic facts used: USD price tokens, only as the US dollar list on /pricing/ and never as the price
    for Nigeria (NGN null; every price mention says the naira price is not yet published), plans.yaml (WhatsApp and more than one location from
    Premium, Cura AI on every plan, insurance/TPA/HMO claims on Enterprise or as the claims add-on, no setup fee,
    no contract, reception login), founded, doctors, countries, largestChain, goLiveDays, trainingDays, the
    Kolkata office, not fully offline today, Penda Health on EasyClinic since 2017. From the live
    https://www.easyclinic.io/emr-software-in-nigeria/ (read 2026-09-26) nothing is stated on the page: its
    "each visit becomes an HMO claim with the right capitation and tariff" was left out because the country page
    treats HMO claim-pack status as unknown (regulators/ng-hmo-claims.yaml null); only the plans.yaml inclusion is
    used. Also NOT used from that page: "aligned with the NDPA 2023 and Nigeria Data Protection Commission rules" (a status claim),
    naira billing through gateways (payment rail), "Plans are priced in naira" (no NGN price exists; it is the
    reason the price check is not met, see Ranking),
    "try Easy Clinic absolutely free" (no trial), and the Port Louis and Curepipe line copied from the Mauritius
    template. OWNER ACTION: that live page claims NDPA alignment and naira plans; confirm or remove before the
    rebuild launches. The fact check removed it from the sourceList because no fact on this page comes from it
    and it 301s to the draft /hospital-management-software-nigeria/ (src/data/redirects.yaml).
  - >-
    CTAs point to /contact-us/#book-a-demo and /pricing/ because /nigeriademo/, /pricing/nigeria/,
