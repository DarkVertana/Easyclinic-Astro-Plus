  - discriminant: vendorList
    value:
      id: vendors
      heading: The seven systems, one by one
      intro: >-
        The six others in ranked order for a private clinic in Nigeria, then EasyClinic, unranked, in the same
        format. Each section gives what the vendor's own pages say, then what we would weigh.
      vendors:
        - id: helium-health
          name: Helium Health
          rank: 1
          bestFor: Healthcare facilities of any size that also want payment tools
          url: https://heliumhealth.com/
          body: >-
            Helium Health has worked since 2016, with offices in Lekki Phase 1, Lagos, and in Nairobi and a
            Nigerian phone line, and it counts 10,000+ health workers. HeliumOS covers records, appointments,
            pharmacy, labs, inpatient wards and billing, configures insurance schemes and tariffs, and generates,
            submits and tracks claims. HeliumWallet takes payments from HMOs and private patients by POS, transfer,
            USSD or payment link, and HeliumCredit lends to facilities. HeliumScribe drafts notes from speech, and
            patients get notifications by SMS, WhatsApp and email. No price is published, and we found no review
            page on Capterra.
          pros:
            - A Lagos office and a Nigerian phone line
            - HMO and patient payments through HeliumWallet
            - AI note drafting and WhatsApp notifications in one product
            - Inpatient wards, and facility loans from the same company
          cons:
            - No published price and no independent review score
            - Nothing published on working offline
          facts:
            - label: Lagos office
              value: Block 22, Babatunde Anjous Avenue, Lekki Phase 1
              source: https://heliumhealth.com/
              checkedOn: 2026-09-26
            - label: HMO payments
              value: HeliumWallet processes payments from health management organisations and private patients
              source: https://heliumhealth.com/helium-wallet/
              checkedOn: 2026-09-26
            - label: Data protection
              value: A privacy programme aligned to NDPA principles, per its privacy notice
              source: https://heliumhealth.com/privacy-notice/
              checkedOn: 2026-09-26

        - id: ajirmed
          name: AjirMed
          rank: 2
          bestFor: Multi-branch hospitals, diagnostic laboratories and large clinics
          url: https://ajirmed.com/
          body: >-
            AjirMed is hospital software designed in Nigeria, with customers named in Lagos, Ibadan and Osogbo and
            a Nigerian phone and WhatsApp line. It connects records, lab, pharmacy, wards, billing and HMO
            administration, and its medical scribe turns the consultation into a draft note that the clinician
            reviews and approves. Its own buyer's guide claims NHIA and HMO electronic claims with capitation
            tracking, NDPC-ready audit logs, and offline working that syncs later, although its pricing page says
            all you need is an internet connection. Deal 360 is a yearly plan sized to the facility, with unlimited
            staff licences and the first year's setup payable in four instalments, but no figures are published.
          pros:
            - NHIA and HMO claims with capitation tracking, per its own guide
            - An AI scribe with clinician sign-off
            - Unlimited staff licences and patients on Deal 360
            - Customers named in Lagos, Ibadan and Osogbo
          cons:
            - No published price or street address
            - WhatsApp messages to patients not named
          facts:
            - label: Pricing
              value: Deal 360, sized to the facility; first year's setup and maintenance in four payments or upfront
              source: https://ajirmed.com/price-of-hospital-management-system-hms-cost-of-affordable-hms
              checkedOn: 2026-09-26
            - label: Going live
              value: From sign-up to the first AI note in 24 hours, per its AI scribe guide
              source: https://ajirmed.com/what-is-an-ai-medical-scribe-complete-guide-nigerian-doctors.electronic-medical-records-emr-nigeria
              checkedOn: 2026-09-26
            - label: Reviews
              value: No reviews yet on its Capterra listing
              source: https://www.capterra.com/p/235290/Ajirmed/
              checkedOn: 2026-09-26

        - id: hyella
          name: Hyella
          rank: 3
          bestFor: Providers that want the EMR and back-office accounting in one system
          url: https://hyella.com/
          body: >-
            Hyella is an Abuja company at 42 Lobito Crescent, Wuse II, formally set up for healthcare in 2020 after
            years as general business software. Its HMIS joins the EMR to accounting, HR, procurement and fixed assets, and a
            multi-store feature gives each branch its own dashboard. The HMO reconciliation module tracks what each
            HMO owes and helps retrieve unclaimed funds, and its privacy policy cites the NDPR 2019. The server
            version runs inside the facility, so other computers reach it without internet. Its FAQ, written for all
            its business software, lists ₦200,000 for the stand-alone version or ₦400,000 for the server version,
            with training for up to three users, then ₦70,000 or ₦90,000 a year, and a 30-day trial.
          pros:
            - The only naira price list among the competitors
            - Works without internet on a server in the facility
            - HMO reconciliation and accounting in the same system
            - A 30-day trial, per its FAQ
          cons:
            - The price list covers all its business software, not the hospital system alone
            - No AI note drafting or WhatsApp to patients named
          facts:
            - label: Price list
              value: ₦200,000 or ₦400,000 once, then ₦70,000 or ₦90,000 a year
              source: https://hyella.com/faqs/
              checkedOn: 2026-09-26
            - label: Set up as a healthcare company
              value: '2020'
              source: https://hyella.com/our-story/
              checkedOn: 2026-09-26

        - id: clinikehr
          name: ClinikEHR
          rank: 4
          bestFor: Small clinics and independent practitioners
          url: https://clinikehr.com/
          body: >-
            ClinikEHR, from Bettar Platforms in Dover, Delaware, is an AI-assisted record for small clinics and
            solo practitioners, and its about page says clinics in Nigeria run on it, under the Nigeria Data
            Protection Act 2023, without naming one. The price list is public: a free plan for two staff and 50 client records, then Essential at $80
            and Team at $200 a month billed annually, with no long-term contract. The AI Note Taker is included for
            three clinicians on Essential, and Team allows unlimited locations. Its Nigeria blog says it supports
            HMO billing and works offline, but the pricing page quotes dollars, lists US CMS-1500 claim forms
            and offers text-message numbers for the US and Canada.
          pros:
            - A free plan and a public price list
            - AI Note Taker on Essential, and unlimited locations on Team
          cons:
            - Its Nigerian claims appear in its blog, not on its pricing page
            - WhatsApp is a support channel, not a patient channel
          facts:
            - label: Plans
              value: Free, Essential $80 and Team $200 a month billed annually, Enterprise on request
              source: https://clinikehr.com/pricing
              checkedOn: 2026-09-26
            - label: Setup
              value: Most practices are ready in an afternoon, per its pricing page
              source: https://clinikehr.com/pricing
              checkedOn: 2026-09-26

        - id: cliniqueplus
          name: CliniquePlus
          rank: 5
          bestFor: Small and medium private hospitals, and multi-branch hospital groups
          url: https://netwalkers.ng/site/cliniqueplusemr
          body: >-
            CliniquePlus is the EMR of Netwalkers NG, at 18 Karimu Laka Street, Egbeda, Lagos, with case studies at
            hospitals in Lagos and Yola and a Nigerian Army medical centre. It runs on a server inside the facility,
            so the clinic keeps working without internet and syncs to the cloud when the line returns, and it offers
            up to three weeks of on-site training anywhere in Nigeria. Its blog describes an HMO claims module that
            submits claims and tracks approvals and denials, and it says it complies with the National Health Act
            2014 and the NDPA 2023. Prices are quoted in naira for each hospital, with no figures published. Its pages name no AI note
            drafting or WhatsApp messages to patients, and we found no directory reviews.
          pros:
            - Keeps working through internet outages on a local server
            - Up to three weeks of on-site training anywhere in Nigeria
            - A Lagos office, with hospital case studies in Lagos and Yola
            - An HMO claims module, per its blog
          cons:
            - No published price
            - No AI note drafting or WhatsApp to patients named
          facts:
            - label: Offline design
              value: Clinics run locally without internet; data syncs to the cloud when connectivity returns
              source: https://netwalkers.ng/site/cliniqueplusemr
              checkedOn: 2026-09-26
            - label: HMO claims
              value: Submits claims electronically and tracks approvals, denials and pending claims
              source: https://www.netwalkers.ng/site/show_post/hmo-claims-management-software
              checkedOn: 2026-09-26

        - id: mocdoc
          name: MocDoc
          rank: 6
          bestFor: Hospitals, clinics and labs, from 10 beds to 300+ beds
          url: https://mocdoc.com/nigeria
          body: >-
            MocDoc, from Yro Systems in Chennai, India, sells hospital, clinic, lab and pharmacy software and has a
            Nigeria page naming cities from Lagos to Port Harcourt, though no Nigerian client by name. It says it
            has 1,500+ customers worldwide, and its clinic
            software sends appointment notifications by SMS, WhatsApp and email and has a combo view that follows one
            doctor across branches. The Nigeria page lists insurance pre-authorisation, claims and TPA management,
            says MocDoc is HIPAA compliant and supports NDPA 2023 requirements, and describes it as 100% cloud-based.
            Its AI work is clinical decision support built on Indian guidance, and no price is published. The MocDoc
            HMS listing on Capterra has 4.9 from 44 reviews, the most we found for any system on this page.
          pros:
            - WhatsApp notifications and a combo view across branches
            - 4.9 on Capterra from 44 reviews, and lab and pharmacy products from the same vendor
          cons:
            - No Nigerian office or Nigerian client named, and no published price
            - HMOs and NHIA are not named on its Nigeria page
          facts:
            - label: Customers
              value: 1,500+ worldwide, per its homepage
              source: https://mocdoc.com/
              checkedOn: 2026-09-26
            - label: Review score
              value: 4.9 on Capterra from 44 reviews (MocDoc HMS listing)
              source: https://www.capterra.com/p/161290/MocDoc-HMS/
              checkedOn: 2026-09-26

        - id: easyclinic
          name: EasyClinic
          us: true
          bestFor: Private clinics from one doctor to a chain that want AI note drafting on every plan and pricing per doctor
          url: https://www.easyclinic.io/
          body: >-
            EasyClinic has run clinics since {fact:founded} and is used by {fact:doctors} doctors in
            {fact:countries} countries; in Africa, Penda Health's Nairobi clinics have run on it since 2017. Cura
            AI drafts the note on every plan, and Premium adds WhatsApp reminders and more than one location.
            Insurance, TPA and HMO claims come with Enterprise, or as an add-on on the other plans, and a clinic can
            be live in as little as {fact:goLiveDays} days. The limits matter in Nigeria. The office is in Kolkata
            with no Nigerian phone line, and the naira price is not yet published, so this page gives no EasyClinic
            price for Nigeria and leaves it unranked; the US dollar list is on the [pricing page](/pricing/). It
            also does not run fully offline, so plan a second internet line.
          pros:
            - Priced per doctor, with no setup fee or binding contract
            - Cura AI note drafting on every plan
            - WhatsApp reminders and branches on Premium
            - Live in as little as {fact:goLiveDays} days
          cons:
            - No Nigerian office or phone line, and the naira price is not yet published
            - Does not run fully offline today
          facts:
            - label: Price in Nigeria
              value: Naira price not yet published
            - label: US dollar list
              value: From {price:usd.professional.annual} per doctor per month billed annually, on the [pricing page](/pricing/)
            - label: HMO claims
              value: On Enterprise, or as the claims add-on on Professional and Premium

  - discriminant: stepList
    value:
      id: workflow-tests
      heading: Five tests to run in every demo
      intro: >-
        Feature lists look alike. Run the same tests with every vendor, on a patient day like yours, and watch
        how many screens each one needs.
      steps:
        - title: Outage test
          body: >-
            Pull the network cable halfway through a consultation and keep writing, then plug it back in and see
            what was saved. EasyClinic does not run fully offline today. CliniquePlus and Hyella say they run on a
            server in the building, and AjirMed's guide says it syncs later. Then ask what keeps the server or the
            router running when the power goes.
        - title: HMO test
          body: >-
            Register a patient on one of your own HMOs, bill a visit the HMO covers in part, and ask for the claim
            and that HMO's monthly reconciliation on screen. Ask how capitation patients are kept apart from
            fee-for-service ones.
        - title: Doctor test
          body: >-
            Open a returning patient and dictate a note. EasyClinic (Cura AI), Helium Health (HeliumScribe), AjirMed
            (its medical scribe) and ClinikEHR (AI Note Taker) publish note drafting; we found none on the other
            three systems' pages.
        - title: Follow-up test
          body: >-
            Send a reminder to a patient's phone and ask which channel it uses and which plan it needs. On
            EasyClinic, WhatsApp starts on Premium and SMS and email come with Professional.
        - title: Paperwork test
          body: >-
            Ask every vendor, EasyClinic included, what it has in writing on the NDPA, and how your patient records
            come back to you if you leave.

  - discriminant: prose
    value:
      id: what-they-cost
      heading: What each one costs
      body: |-
        Two competitors publish figures. ClinikEHR has a free plan, then $80 or $200 a month billed annually, or $99.90 a month for Essential billed monthly ([pricing](https://clinikehr.com/pricing)). Hyella's FAQ lists ₦200,000 or ₦400,000 once, then ₦70,000 or ₦90,000 a year, on a price list written for all its business software ([FAQ](https://hyella.com/faqs/)).

        EasyClinic's naira price is not yet published, so this page gives no EasyClinic price for Nigeria. Its US dollar list on the [pricing page](/pricing/) is {price:usd.professional.annual} per doctor per month on Professional and {price:usd.premium.annual} on Premium, both billed annually. Every plan includes a reception login, with no setup fee and no binding contract.

        AjirMed sells a yearly plan sized to the facility and lets you split the first year's setup into four payments ([pricing](https://ajirmed.com/price-of-hospital-management-system-hms-cost-of-affordable-hms)). CliniquePlus quotes in naira for each hospital ([guide](https://www.netwalkers.ng/site/show_post/the-definitive-guide-choosing-the-best-emr-in-nigeria-for-your-hospital-2026)), and Helium Health and MocDoc publish no price.

        The licence is one line of the cost. Add a second internet line and the power to keep the router running through an outage. Then count the hours your staff spend learning the system in the first month.
      width: measure

  - discriminant: decisionMatrix
    value:
      id: when-to-choose-which
      heading: When to choose which
      options:
        - title: Choose Helium Health if
          items:
            - You run a hospital or a large facility with inpatient wards and discharge billing.
            - You want HMO and patient payments through HeliumWallet, and possibly a facility loan, from the same company.
            - You want a vendor with an office in Lagos.
            - You want AI note drafting and WhatsApp notifications in one product, and you are ready to ask for a quote.
        - title: Choose a Nigerian system that works through internet outages if
          items:
            - The internet drops often. CliniquePlus and Hyella run on a server inside the facility, and AjirMed's guide says it works offline and syncs later.
            - You want on-site training, which CliniquePlus offers for up to three weeks anywhere in Nigeria.
            - You want accounting and HR in the same system as the EMR, which Hyella sells.
            - You want an AI scribe with clinician sign-off from a Nigerian vendor, which AjirMed sells.
        - title: Choose ClinikEHR or MocDoc if
          items:
            - You are a solo practitioner testing software, and ClinikEHR's free plan for two staff and 50 client records is enough.
            - You want a public dollar price list with no long-term contract, which ClinikEHR has.
            - You run a hospital with a lab and a pharmacy and want WhatsApp notifications from one vendor, which MocDoc sells.
            - You weigh independent reviews, where MocDoc HMS has 4.9 on Capterra from 44 reviews.
        - title: Choose EasyClinic if
          us: true
          items:
            - You run a private clinic, from one doctor to several branches, and will get the naira price per doctor in writing before you sign, since it is not yet published.
            - Your doctors want Cura AI to draft the note, which comes on every plan.
            - Your patients read WhatsApp more than SMS, and you are ready for Premium.
            - Your clinic has a steady internet line with a backup, since EasyClinic does not run fully offline.
            - You are content with support by phone and email from a company with no Nigerian office.

