faq:
  - question: Is this ranking biased, since EasyClinic publishes it?
    answer: >-
      It could be, so we made it checkable and left EasyClinic out of the ranking: every fact about the other six
      links to the vendor's own page or a review site, read on 26 September 2026. EasyClinic meets five of our
      eight checks, level with four others, and misses the price check because its naira price is not yet
      published, so placing it within that tie would mean judging ourselves. Helium Health ranks first, and
      CliniquePlus or Hyella fit better where the internet drops often. A clinic that puts a Nigerian office
      first should shortlist those before EasyClinic.
  - question: Does EasyClinic have an office or a phone line in Nigeria?
    answer: >-
      No, EasyClinic's office is at 30 Circus Avenue in Kolkata, India, and its site publishes no Nigerian office
      or phone number today. Helium Health, Hyella and CliniquePlus publish Nigerian office addresses and AjirMed
      a Nigerian phone line, so weigh that if you want someone who can visit the clinic.
  - question: What does EasyClinic cost, and is there a price in naira?
    answer: >-
      EasyClinic's naira price is not yet published, so this page cannot tell you what a clinic in Nigeria would
      pay. The [pricing page](/pricing/) has the US dollar list, which starts at {price:usd.professional.annual}
      per doctor per month on Professional billed annually. Premium adds WhatsApp messages and more than one
      location, and every plan includes a reception login, with no setup fee and no binding contract.
  - question: When the power or the internet goes, which of these keep working?
    answer: >-
      CliniquePlus and Hyella say they keep working without the internet, because both run on a server inside
      the facility that the clinic's other computers reach without a connection, though that server still needs
      power. AjirMed's own guide says staff can read records and
      write notes offline and sync later, and ClinikEHR's Nigeria blog makes a similar claim. EasyClinic does not
      run fully offline today, MocDoc describes itself as 100% cloud-based, and Helium Health publishes nothing on
      offline use. Whichever you choose, pull the network cable during the demo and watch what is saved.
  - question: Which of these handle HMO claims?
    answer: >-
      All seven describe insurance claims in some form, and six of them name HMOs. Hyella has an HMO reconciliation
      module, CliniquePlus's blog describes an HMO claims module, and AjirMed's guide claims NHIA and HMO electronic claims with
      capitation tracking. Helium Health submits and tracks insurance claims and takes HMO payments through
      HeliumWallet, and ClinikEHR's Nigeria blog says it supports HMO billing workflows. On EasyClinic, insurance,
      TPA and HMO claims come with Enterprise or as an add-on. MocDoc lists insurance claims and TPA management
      without naming HMOs. Ask each vendor to raise a claim for one of your own HMOs on screen.
  - question: Which of these say they follow the Nigeria Data Protection Act?
    answer: >-
      Five of the six competitors cite the NDPA 2023 on their own sites: Helium Health, AjirMed, CliniquePlus,
      MocDoc and ClinikEHR. Hyella's privacy policy cites the older NDPR 2019. These are statements about
      themselves, not certificates, and this page does not state EasyClinic's NDPA status, so ask every vendor,
      EasyClinic included, what it has in writing and whether it will sign a data processing agreement with your
      clinic.
  - question: Which of these send WhatsApp reminders to patients?
    answer: >-
      EasyClinic, Helium Health and MocDoc publish WhatsApp messages to patients: EasyClinic on the Premium plan,
      Helium Health through notifications in HeliumOS and MocDoc through appointment notifications. AjirMed's
      guide lists SMS and email, ClinikEHR lists WhatsApp only as a support channel, and we found no WhatsApp
      feature on the CliniquePlus or Hyella pages we read.
  - question: How long does it take to go live?
    answer: >-
      EasyClinic can be live in as little as {fact:goLiveDays} days from the demo, with training in
      {fact:trainingDays} short sessions of about two hours in all. ClinikEHR says most practices are ready in an
      afternoon with self-serve setup, and AjirMed's AI scribe guide says a hospital can go from sign-up to its
      first AI note in 24 hours. CliniquePlus offers up to three weeks of on-site training anywhere in Nigeria,
      and Hyella sends technical staff to install the software after purchase.

