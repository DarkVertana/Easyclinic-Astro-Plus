  - switching EMR systems
  - paper to EMR
  - moving clinic records to new software
title: 'Switching to EasyClinic: Data Migration'
metaDescription: >-
  The four steps from the demo to go-live, in as little as {fact:goLiveDays} days, and what changes for a
  clinic moving from paper or from other software.
h1: Switching to EasyClinic from paper or another system
linkLabel: Switching to EasyClinic
eyebrow: For clinics on paper or other software
