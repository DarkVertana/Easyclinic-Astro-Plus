editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The training sessions of 40, 40, 20 and 20 minutes and the promise to clinics on paper of faster
    prescribing for 2 hours or 10 patient records are how EasyClinic takes a clinic on, and Dr T. L.
    Prabhu's six months from paper to paperless at Prashanthi Clinic sets a real expectation next to the
    3-day go-live.
  readsMachineWritten: >-
    With only the patient list confirmed as moving across, the section on moving from another system says
    plainly that nothing else is listed and gives advice instead, where a doctor on other software wants to
    read what comes across from their system, so the read-aloud pass should check that part does not sound
    evasive.

notes:
  - 'Spec 5.17 /switch/ and keyword row 4.1. Published 2026-09-26 with confirmed facts only (owner decision). The company family needs no proof block (src/lib/rules/audit.ts), and none is added: all 16 testimonials are already placed on other pages. When a customer who moved from another system is recruited, add a testimonialRow here.'
  - 'H1 changed from spec 4.1 "Switch without losing a single record" to a plain H1. The only confirmed migration fact is the patient list (live /kenyademo/ step 3, "Your patient list moved across cleanly. Nothing left behind."), so the page does not promise that every record survives the move, and "Nothing left behind" is not repeated. Restore the spec H1 only when what is imported, and from which systems, is confirmed.'
  - 'Meta description changed from spec 4.1 ("What we import from your current system, how long it takes, and what happens on day one"): what is imported beyond the patient list is unknown, and the spec line is a group of three.'
  - 'Left out as unknown (spec 5.17): what is imported from Practo Ray, HealthPlix, KenyaEMR or Excel (none of them is named, and the spec secondary keyword "migrate from Practo Ray" is dropped until it can be answered); whether visit notes, bills, lab results or scanned reports come across from any system; whether a paper register is typed in as the patient list; what the clinic does with its paper files; downtime during the move; a checklist download; a named migration lead; and whether data migration is charged. No FAQ on migration cost or keeping paper records for the same reason. "No setup fee" in the contract answer comes from plans.yaml conditions and is not a statement about migration charges.'
  - 'Editorial review 2026-09-26 (adversarial pass): removed claims not stated on the live site or in src/data. Cut: the step list intro saying every clinic, from a paper register or other software, goes through the same steps (whether a paper register becomes the patient list is unknown), with no intro in its place; step 3 meta "Before your first day" (inferred from the live step order, not stated); the reasons a clinic takes longer than 3 days ("more staff to train, or years of records") in the step note and FAQ 1; "nobody stops seeing patients" from the training intro (the FAQ keeps the brief-approved answer); "stop when it does not" from the contract answer (annual billing makes stopping at any time an unstated promise); "installed" from the traditional EMR link description (the live page says "built mainly to record information", not installed); "scenarios like your clinic''s own" (the live Day 2 is "EMR scenario Training"); "the habit that changes most" and "what was billed next to what came in" in the spreadsheet paragraph (now the spec 5.11 day-end close). "Shortcuts for the medicines you prescribe most" became "shortcuts set up for the way you prescribe", matching /features/emr/. Meta description and summary rewritten: the old meta implied a paper clinic gets its patient list moved across, and the summary was a group of three.'
  - 'Open tension, not resolved on the page: go-live "in as little as 3 days" (live /kenyademo/) sits next to the four-day training (live /pricing/). Both are stated as live-site facts; a reader may ask how a clinic is live before day 4 of training. Confirm whether the later sessions run after go-live, and say so on the page once confirmed.'
  - 'Steps follow live /kenyademo/ ("From demo to live in as little as 3 days": Live Demo, Staff Training, Data Migration, Support). Dropped from that section: "Most clinics fully operational within 24 hours" (unsourced, and it conflicts with goLiveDays and the "2 to 4 week setup" on the live Kenya listicle, see the facts.yaml note), "Simple enough to learn in a day" (conflicts with the four-day training) and "8+ years average client relationship" (not in facts.yaml). The demo is 20 minutes to match the rebuild CTAs; the live /kenyademo/ says 30.'
  - 'Training table and intro follow the live /pricing/ FAQ: the four sessions, "a personalised training program for you (and your clinic staff)", "at your convenient times" and "No EMR provider can claim that you will become an expert on day 1". The paper paragraph paraphrases the same page ("A handwritten prescription is extremely flexible ... It only takes a little practice") and its promise "give us just 2 hours / 10 patient records". The slash is rendered "2 hours, or 10 patient records"; /contact-us/ renders it "2 hours and 10 patient records". Align both pages once the meaning is confirmed. "and more comprehensive" is dropped (banned word).'
  - 'Dr T. L. Prabhu is named in the paper paragraph from testimonials/tl-prabhu.yaml ("We have moved from a paper based clinic to a completely paperless setup in about 6 months"). The testimonial id stays on /solutions/solo-clinic/ and is not used here. If each customer should appear on one page only, cut the last paragraph of "Moving from paper".'
  - 'Thirty-second prescription follows spec 2.8 and 5.5, the live /kenyademo/ ("under 30 seconds") and the solo clinic page; it is a product claim, not a measured figure.'
  - 'Nurse or clinical assistant role: live /pricing/ reception FAQ ("You can choose to have a clinical assistant or nurse role as a user who can complete some of your EMR records"). Whether that login costs a licence is unknown and not stated.'
  - 'Adoption risk line: live /easyclinic-vs-practo/ FAQ 7 ("If staff feel it adds steps rather than removes friction, adoption drops"). Setup around the clinic without charge: live /pricing/ customisation FAQ ("Our support team will help you set it up to your needs without any charges"). Support channels (phone, email and chat on live /pricing/) are written "call or write" to avoid a group of three. Named account manager on Premium and Enterprise: plans.yaml. Step 3 has no timing meta: the live order (training "before day one", migration, then support "from day one") suggests migration before go-live but does not say so.'
  - 'Spreadsheet billing paragraph follows the spec 5.11 billing page and the solo clinic page (bill raised from the visit, payments recorded against it, day report). No cash or card split is claimed.'
  - 'Offline FAQ follows the live site ("does not run fully offline today"). The self-hosted option on the live Kenya listicle is not offered here because it is unconfirmed.'
  - 'Spec 6.5 named person: the only named people are the author byline (Subhashish Saha, head of customer success) and Dr Prabhu. The author byline does not make him the migration lead; name one when the company confirms who runs migrations.'
  - 'Related links: /easyclinic-emr-vs-traditional-emr/ (a kept live slug, spec 3.2) is now the EMR vs paper records guide (published 2026-09-26); the link label follows it. No heroMedia: no screenshots exist yet (spec 12).'
