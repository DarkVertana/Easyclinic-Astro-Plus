sections:
  - discriminant: stepList
    value:
      id: the-steps
      heading: Four steps from the demo to your first day
      steps:
        - title: A demo on your own workflow
          meta: 20 minutes
          body: >-
            We show you EasyClinic working the way your clinic works today, before you commit to anything.
            Bring the question that matters most to you, such as how a walk-in is registered or how the day's
            takings are closed.
        - title: Training for you and your staff
          meta: '{fact:trainingDays} days, about two hours in all'
          body: >-
            A personalised programme for you and your clinic staff, in four short sessions at times that suit
            the clinic. The table below sets out each session.
        - title: Your patient list moved across
          body: >-
            We move your patient list into EasyClinic, so a returning patient is found by name at the desk
            instead of being registered again. Records beyond the patient list, such as older visit notes and
            bills, are covered under moving from another system below.
        - title: Support from your first day
          meta: At no extra cost
          body: >-
            Once you are live, you can call our support team or write to them as often as you need, at no extra
            cost on any plan. Premium and Enterprise clinics also have a named account manager.
      note: >-
        A clinic can be live in as little as {fact:goLiveDays} days from the demo. That is the quickest case,
        and yours may take longer.

  - discriminant: dataTable
    value:
      id: training
      heading: Two hours of training, spread over four days
      intro: >-
        A change in the way you work takes time to become normal, and no EMR company can honestly promise
        that you will be an expert on the first day. So the learning is split into four short sessions for
        you and your clinic staff, at times that suit the clinic.
      columns:
        - Day
        - Session
        - Length
      rows:
        - - Day 1
          - Basic training
          - 40 minutes
        - - Day 2
          - EMR scenario training
          - 40 minutes
        - - Day 3
          - Practice exercises
          - 20 minutes
        - - Day 4
          - Road to expertise
          - 20 minutes
      note: >-
        Training is part of every plan at no extra cost, and support carries on after day 4, by phone or in
        writing.

  - discriminant: prose
    value:
      id: from-paper
      heading: Moving from paper
      body: |-
        For a doctor on paper, the prescription is the part of the day that changes most. A handwritten prescription is flexible: you write, draw, scribble and correct as you go. A good EMR lets you do all of that too, and getting there takes a little practice.

        We make clinics on paper a promise: give us 2 hours, or 10 patient records, and we will make your prescription writing faster than pen and paper. Shortcuts set up for the way you prescribe cut down the typing, so a routine prescription takes about thirty seconds while the patient is still in the chair.

        The desk changes as well. Your receptionist gets a login that is included in the price, and uses it to register patients, book appointments, raise bills and take payments, but cannot open the EMR or write a prescription. A nurse or clinical assistant can be given a role that completes parts of the record for you.

        Going fully paperless can take longer than going live. At Prashanthi Clinic, Dr T. L. Prabhu moved from a paper-based clinic to a completely paperless one in about six months.

  - discriminant: prose
    value:
      id: from-another-system
      heading: Moving from another system
      body: |-
        If your clinic already runs on software, the move has two halves: the records, and the habits your staff have built around the old screens.

        The records first. Your patient list is moved across as one of the four steps above. We do not list here what else comes across, such as older visit notes, bills, lab results or scanned reports. If you need any of it in EasyClinic, agree in writing what will come across before you sign up, and keep access to your old system until you have checked what arrived.

        Then the habits. Staff who know one system well are quick in it, and slower for a while in a new one. The biggest risk with any clinic software is that staff feel it adds steps, and stop using it. That is why day 2 of the training is spent on EMR scenarios, and why our support team helps you set EasyClinic up to fit your clinic, using the customisation options in the product, without charging for it.

        If your bills and day-end totals live in a spreadsheet today, that habit changes too. In EasyClinic the bill is raised from the visit and each payment is recorded against it, so the day-end close happens in the same system as the bill.

faq:
  - question: How long does it take to switch to EasyClinic?
    answer: >-
      A clinic can be live in as little as {fact:goLiveDays} days after the demo, which is the quickest case,
      and yours may take longer. Training is four sessions over {fact:trainingDays} days, about two hours in
      all, at times that suit your clinic.
  - question: Do we have to stop seeing patients while we switch?
    answer: >-
      No, the training is four sessions of 40, 40, 20 and 20 minutes on four separate days, fixed at times
      that suit your clinic, so the clinic keeps running while you learn. Expect the first days on
      EasyClinic to feel slower than your old way of working, until the shortcuts become habit.
  - question: Who does the work of moving our clinic across?
    answer: >-
      The EasyClinic team does: we run the demo, train you and your staff, move your patient list across and
      support you from the first day. You can call our support team or write to them, and they help you set
      EasyClinic up to fit your clinic without charging for it. Premium and Enterprise clinics also have a
      named account manager.
  - question: Is there a contract to sign when we switch?
    answer: >-
      No, there is no binding contract, so you can use EasyClinic for as long as it works for your clinic.
      There is no setup fee either, and Professional and Premium are priced per
      doctor per month, billed annually or quarterly.
  - question: Will writing prescriptions on a screen be slower than on paper?
    answer: >-
      At first it can be, and our promise to clinics on paper is that if you give us 2 hours, or 10 patient
      records, we will make your prescription writing faster than pen and paper. Shortcuts set up for the
      way you prescribe cut down the typing.
  - question: Our current software works without the internet. Will EasyClinic?
    answer: >-
      No, EasyClinic is cloud software and does not run fully offline today, so your clinic needs a working
      internet connection. If your line drops often, keep a second connection, even a phone hotspot, for the
      days it goes down.

