  - discriminant: spotlight
    value:
      id: research
      heading: The Penda Health study, and our part in it
      paper:
        badge: Preprint, not yet reviewed by a journal
        title: 'AI-based Clinical Decision Support for Primary Care: A Real-World Study'
        href: https://arxiv.org/abs/2507.16947
        meta: Korom and others · Penda Health and OpenAI · arXiv, July 2025
        linkLabel: Read the paper on arXiv
      stats:
        - value: '{fig:visits}'
          label: patient visits compared
        - value: '15'
          label: Penda Health clinics in Nairobi
        - value: '{fig:diagnostic-errors}'
          label: fewer diagnostic errors with AI Consult
        - value: '{fig:treatment-errors}'
          label: fewer treatment errors with AI Consult
      points:
        - icon: flask-conical
          title: The study
          body: >-
            In July 2025, researchers at Penda Health and OpenAI published a preprint on arXiv. It compared
            {fig:visits} patient visits at 15 Penda Health clinics in Nairobi by clinicians with and without AI
            Consult, an AI tool embedded in Penda's Easy Clinic record. Independent physicians rated a random
            sample of the visit records, and clinicians with AI Consult made {fig:diagnostic-errors} fewer
            diagnostic errors and {fig:treatment-errors} fewer treatment errors.
        - icon: database
          title: Our part
          body: >-
            Our part, as the paper tells it, is the record. It names Easy Clinic as the cloud-hosted record Penda
            introduced in 2017, which supports all of its patient visits, and it does not name any other Easy
            Clinic product.
      caveat: >-
        The paper is a preprint that has not been through a journal's review, and its figures are errors that
        physicians judged from visit records, not measures of how patients fared afterwards.
      link:
        label: More on the study on the CuraPilot page
        href: /curapilot/

