faqHeading: Questions about the company
faq:
  - question: Who owns Easy Clinic?
    answer: >-
      Easy Clinic is owned and made by Novel Medicare Solutions Pvt Ltd, a private limited company based in
      Kolkata, India. Girish Mohata founded it and is its chief executive, and Mrinal Pasari is a
      co-founder.
  - question: Where is Easy Clinic based?
    answer: >-
      Easy Clinic is based in Kolkata, at 30 Circus Avenue, Kolkata 700017. Clinics in India can call
      {contact:in.phone} and clinics in Kenya have their own line on {contact:ke.phone}; the
      [contact page](/contact-us/) lists both with their email addresses.
  - question: How long has Easy Clinic been running clinics?
    answer: >-
      Easy Clinic has been running clinics since {fact:founded}, which is more than 20 years.
      {fact:retention} of its customers have used it for more than five years, and Penda Health in
      Nairobi has used it as the record for its clinics since 2017.
  - question: Is Easy Clinic a startup?
    answer: >-
      No, Easy Clinic has been running clinics since {fact:founded}. Its head of software development has
      been with the company since 2010 and its head of customer success since 2012.
  - question: Does Easy Clinic sell patient data?
    answer: >-
      No, Easy Clinic never sells patient data, and we do not misuse the records a clinic keeps in
      Easy Clinic.

