editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The timeline rests on a haematologist's 2008 start and a Hyderabad fertility clinic's 2012 start in
    their own words, and the research section says exactly what part the Penda paper gives Easy Clinic.
  readsMachineWritten: >-
    With no photos and one-line entries for Girish Mohata and Vikas Malpani, the leadership table reads
    like a directory, and the two promises are short enough to sound like slogans, so the read-aloud pass
    should check the page sounds like someone from the company talking.

notes:
  - 'Published 2026-09-26 with confirmed facts only (owner decision). Grounded on the live /about-us/ page (re-fetched 2026-09-26; counters in the HTML are 20, 92, 500 and 98). Live copy dropped as old boilerplate (spec 5.19): the vision, mission and six values, "Dream Team", "Chief Product Officers", "revolutionising", "empower", "seamless", "world-class", "unparalleled", and the "try Easy Clinic absolutely free" line (no free trial exists).'
  - 'Fact-check pass 2026-09-26 removed: the 2003 row''s claim that Novel Medicare Solutions Pvt Ltd made Easy Clinic in 2003 (the company''s name and incorporation date for that year are not sourced); "keeps no server of its own" (Enterprise offers custom or private cloud hosting); "without a contract holding them" after the retention figure (whether long-standing customers ever had contracts is unknown); the visit advice "call first so the person you want to meet is in"; "organisations as different as" (unsourced characterisation); "No open roles right now" in the careers link (the careers page owns that fact). The story now links to /customers/ rather than putting customer names on solution and specialty page links. The meta description no longer repeats the doctors and countries pair (spec 2.11 stat line).'
  - 'Leadership: names and roles from src/data/authors. No photos (none exist) and no LinkedIn URLs (all null), though spec 5.19 asks for both. Backgrounds keep only plain statements from the live page: Mrinal Pasari (solution and enterprise architect, 20 years, enterprise application development for banking to healthcare), Vikas Malpani (entrepreneur and business strategist), Gaurab Chatterjee (since 2010, over 16 years, Microsoft technologies), Subhashish Saha (since 2012, leads his team). Left out: Girish Mohata "build and exit multiple tech companies profitably" (unverified) and the puffery around Vikas Malpani. Add a verified line for Girish when supplied. Spec 12 founder block needs a real photograph of Girish Mohata.'
  - 'Timeline keeps to dated facts with a source: founded {fact:founded} (live "Established in 2003"); 2008 and 2012 from testimonial data (prantar-chakrabarti customerSince 2008, seetha-lakshmi-kolanakuduru customerSince 2012); 2017 and 2025 from arXiv:2507.16947, re-read 2026-09-26 ("A cloud-hosted electronic medical record (EMR), Easy Clinic, was introduced in 2017, supporting all patient visits"; "AI Consult is embedded in Penda''s cloud-hosted EMR (Easy Clinic)"; Easy Clinic is named only as the EMR). The first clinics of 2003 and the year Easy Clinic moved to the cloud are unknown; add rows when the company supplies them.'
  - 'No testimonial ids on this page. The company family needs no proof block, and each testimonial stays on the page it praises (prantar-chakrabarti on /solutions/hospital-opd/, seetha-lakshmi-kolanakuduru on /specialties/ivf-emr/); /customers/ shows every testimonial, so the story links there.'
  - 'Numbers: doctors and cities from /pricing/, countries from /about-us/ and /kenyademo/, retention and supportSatisfaction from the live /about-us/ counters (facts.yaml note: no method or date published), which the table note says plainly. Not used: the "20+ years" counter (years are inconsistent across the live site: 22+, 20+, 15+; "more than 20 years" in the FAQ is derived from {fact:founded}), "500+ custom workflows" and "8+ years average client relationship" (not in the confirmed facts).'
  - 'Research: only korom-2025 (arXiv preprint, verified 2026-09-26) is cited. The Nature Health and Nature Medicine papers in study.yaml are separate studies with easyclinicRole null and are not mentioned. "108 independent physicians" is written as "independent physicians" (claims rule); the paper''s abstract says visits were rated by independent physicians and its methods say a random sample of visits was rated. The verified 10% fewer investigation errors is left out (no fig token). The page never calls the studied tool Cura AI or CuraPilot.'
  - 'Values cut to two things the company will not do (spec 5.19; two rather than three per spec 6.2). No sale of patient data: live /pricing/ FAQ ("We never misuse, sell or in any way disclose your data"). The page does not repeat "never disclose" because the privacy policy allows disclosure. No lock-in: live /pricing/ FAQ ("There are NO binding contracts whatsoever. Use Easy Clinic till you are happy with it.") and plans.yaml conditions (no setup fee, no contract). Data export on leaving is not stated here.'
  - 'LEGAL, fix before or with this page: the global part of src/content/legal/privacy.mdx (section 2, clause (d)) says the company "may collect, analyse, use, publish, create and sell de-identified information, of which your personal or sensitive personal information might be a component". Only the Kenya section says "We do not sell personal data, health data, or de-identified data derived from health data". This page promises "We never sell patient data", so it no longer links to the privacy policy as support for that promise. Remove or rewrite clause (d) so the policy and this page agree, then the promise and FAQ can link to /privacy/ again. The policy also names a registered office at New Alipore, Kolkata 700053; this page uses the 30 Circus Avenue office only (page-writing-rules).'
  - 'Country partners (spec 5.19) are left out: none are confirmed. Qualitas Health is not named as a current customer because its testimonial is in the past tense ("We had the pleasure of using"); CIMAS Health is named from its testimonial ("the heart of our operations today").'
  - 'Schema: src/lib/seo/page-graph.ts adds AboutPage and Organization (with sameAs from site.yaml) for /about-us/. Spec 5.19 also asks for founders: page-graph.ts adds them to the Organization node from src/data/authors (every author whose role says founder: Girish Mohata, Mrinal Pasari).'
  - 'The /siliconindia/ press page redirects here (redirects.yaml, "confirm"); the press mention itself is not used because its content is not in the confirmed facts.'
