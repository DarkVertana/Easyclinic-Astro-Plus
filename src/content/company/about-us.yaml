faqHeading: You Have Questions, We Have Answers
faq:
  - question: Who owns Easy Clinic?
    answer: >-
      Easy Clinic is owned and made by Novel Medicare Solutions Pvt Ltd, a private limited company based
      in Kolkata, India. Girish Mohata founded it and is its chief executive, and Mrinal Pasari is a
      co-founder. In Kenya, Easy Clinic works through its Kenyan company, Novel Software Solutions Private
      Ltd.
  - question: Where is Easy Clinic based?
    answer: >-
      Easy Clinic is based in Kolkata, India, at 30 Circus Avenue, Kolkata 700017. It also has a Kenyan
      company, Novel Software Solutions Private Ltd, and a Kenya phone line for clinics there. Clinics in
      {fact:countries} countries use Easy Clinic.
  - question: How long has Easy Clinic been running clinics?
    answer: >-
      Since {fact:founded}, when Easy Clinic was established. Some customers have used it for well over a
      decade. Dr Prantar Chakrabarti, a haematologist, has used it since 2008.
  - question: Is Easy Clinic a startup?
    answer: >-
      No. Easy Clinic has been running since {fact:founded}, and more than 5,000 doctors in
      {fact:countries} countries use it today. It is still founder-led, with Girish Mohata as chief
      executive.
  - question: Does Easy Clinic sell patient data?
    answer: >-
      No. Patient data belongs to the clinic that records it. Easy Clinic stores it to run the software
      for that clinic. How data is handled is set out in our privacy policy.

