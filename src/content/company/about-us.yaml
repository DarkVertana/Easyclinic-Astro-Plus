  - discriminant: prose
    value:
      id: story
      heading: Running clinics since {fact:founded}
      width: wide
      body: |-
        Easy Clinic has been running doctors' clinics since {fact:founded}. Two customers quoted on our [customers page](/customers/) have used it since 2008 and 2012: Dr Prantar Chakrabarti, a haematologist at the Institute of Hematology and Transfusion Medicine, and Aditya Women and Infertility Clinic in Hyderabad. Today Easy Clinic runs in the cloud and clinics sign in at [app.easyclinic.io](https://app.easyclinic.io/). It is used in {fact:countries} countries, by clinics that range from one doctor and a receptionist to multi-location clinic chains. In Nairobi, Penda Health has kept its clinic records on Easy Clinic since 2017, and in 2025 researchers at Penda Health and OpenAI published a preprint on {fig:visits} of its patient visits, in which an AI tool called AI Consult ran inside that record.

