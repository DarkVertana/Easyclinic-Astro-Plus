sections:
  - discriminant: prose
    value:
      id: story
      heading: Running clinics since {fact:founded}
      body: |-
        EasyClinic has been running doctors' clinics since {fact:founded}. Two customers quoted on our [customers page](/customers/) have used it since 2008 and 2012: Dr Prantar Chakrabarti, a haematologist at the Institute of Hematology and Transfusion Medicine, and Aditya Women and Infertility Clinic in Hyderabad. Today EasyClinic runs in the cloud and clinics sign in at [app.easyclinic.io](https://app.easyclinic.io/). It is used in {fact:countries} countries, by clinics that range from one doctor and a receptionist to a chain of {fact:largestChain} locations. In Nairobi, Penda Health has kept its clinic records on EasyClinic since 2017, and in 2025 researchers at Penda Health and OpenAI published a preprint on {fig:visits} of its patient visits, in which an AI tool called AI Consult ran inside that record.

  - discriminant: dataTable
    value:
      id: milestones
      heading: The dates we can put a source to
      intro: This list keeps to dates with a source, and the note under it says where each one comes from.
      columns:
        - Year
        - What happened
      rows:
        - - '{fact:founded}'
          - EasyClinic is established and starts running doctors' clinics.
        - - '2008'
          - Dr Prantar Chakrabarti, a haematologist at the Institute of Hematology and Transfusion Medicine, starts using EasyClinic.
        - - '2012'
          - Aditya Women and Infertility Clinic, an obstetrics and fertility clinic in Hyderabad, starts using EasyClinic.
        - - '2017'
          - Penda Health in Nairobi introduces EasyClinic as the cloud-hosted record for its clinics.
        - - '2025'
          - Researchers at Penda Health and OpenAI publish a preprint on {fig:visits} patient visits at 15 Penda clinics, comparing clinicians with and without AI Consult, an AI tool embedded in the EasyClinic record.
      note: >-
        The founding year is our own. The 2008 and 2012 dates are the customers' own, from Dr Chakrabarti
        and from Dr Seetha Lakshmi Kolanakuduru at Aditya. The 2017 and 2025 dates come from the paper,
        [arXiv:2507.16947](https://arxiv.org/abs/2507.16947).

  - discriminant: dataTable
    value:
      id: numbers
      heading: EasyClinic in four numbers
      columns:
        - Number
        - What it counts
      rows:
        - - '{fact:doctors}'
          - Doctors who use EasyClinic
        - - '{fact:cities}'
          - Cities those doctors work in
        - - '{fact:retention}'
          - Customers who have used EasyClinic for more than five years
        - - '{fact:supportSatisfaction}'
          - Customers satisfied with our support and training
      note: >-
        All four are EasyClinic's own figures, as we stated them in September 2026. We have not published
        how or when the retention and satisfaction figures were measured, so treat them as our own count.

  - discriminant: dataTable
    value:
      id: leadership
      heading: Who runs EasyClinic
      intro: Five people lead the company.
      columns:
        - Name
        - Role
        - Background
      rows:
        - - Girish Mohata
          - Founder and CEO
          - Founded EasyClinic and leads it as chief executive.
        - - Mrinal Pasari
          - Co-founder
          - A solution and enterprise architect with 20 years of experience in enterprise application development, in fields from banking to healthcare.
        - - Vikas Malpani
          - Director, business growth and strategy
          - An entrepreneur and business strategist who leads the company's growth.
        - - Gaurab Chatterjee
          - Head of software development
          - At EasyClinic since 2010, with over 16 years in software development and a background in Microsoft technologies.
        - - Subhashish Saha
          - Head of customer success
          - At EasyClinic since 2012, leading the team that supports the clinics using it.

  - discriminant: prose
    value:
      id: research
      heading: The Penda Health study, and our part in it
      body: |-
        In July 2025, researchers at Penda Health and OpenAI published a preprint on arXiv, [AI-based Clinical Decision Support for Primary Care: A Real-World Study](https://arxiv.org/abs/2507.16947) (Korom and others). It compared {fig:visits} patient visits at 15 Penda Health clinics in Nairobi by clinicians with and without AI Consult, an AI tool embedded in Penda's EasyClinic record. Independent physicians rated a random sample of the visit records, and clinicians with AI Consult made {fig:diagnostic-errors} fewer diagnostic errors and {fig:treatment-errors} fewer treatment errors.

        Our part, as the paper tells it, is the record. It names EasyClinic as the cloud-hosted record Penda introduced in 2017, which supports all of its patient visits, and it does not name any other EasyClinic product. The paper is a preprint that has not been through a journal's review, and its figures are errors that physicians judged from visit records, not measures of how patients fared afterwards.
      aside: >-
        The [CuraPilot page](/curapilot/) covers the study in more detail, including what it did and did
        not test.

  - discriminant: featureRows
    value:
      id: what-we-will-not-do
      heading: What we will not do
      intro: Two promises a clinic can hold us to.
      items:
        - heading: We will not sell patient data
          body: >-
            We never sell patient data, and we do not misuse the records a clinic keeps in EasyClinic.
        - heading: We will not lock you in with a contract
          body: >-
            There is no binding contract on any plan and no setup fee, so a clinic can use EasyClinic for
            as long as it is happy with it, and stop when it is not.

  - discriminant: prose
    value:
      id: where-we-are
      heading: Where to find us
      body: |-
        Our office is at 30 Circus Avenue, Kolkata 700017, West Bengal, India. Clinics in India can call {contact:in.phone}, and clinics in Kenya have their own line on {contact:ke.phone}.

        Outside India, Penda Health in Nairobi and CIMAS Health in Zimbabwe both use EasyClinic.
      aside: >-
        **Looking for work?** The [careers page](/careers/) says whether we are hiring and how to send us
        your CV.

faqHeading: Questions about the company
faq:
  - question: Who owns EasyClinic?
    answer: >-
      EasyClinic is owned and made by Novel Medicare Solutions Pvt Ltd, a private limited company based in
      Kolkata, India. Girish Mohata founded it and is its chief executive, and Mrinal Pasari is a
      co-founder.
  - question: Where is EasyClinic based?
    answer: >-
      EasyClinic is based in Kolkata, at 30 Circus Avenue, Kolkata 700017. Clinics in India can call
      {contact:in.phone} and clinics in Kenya have their own line on {contact:ke.phone}; the
      [contact page](/contact-us/) lists both with their email addresses.
  - question: How long has EasyClinic been running clinics?
    answer: >-
      EasyClinic has been running clinics since {fact:founded}, which is more than 20 years.
      {fact:retention} of its customers have used it for more than five years, and Penda Health in
      Nairobi has used it as the record for its clinics since 2017.
  - question: Is EasyClinic a startup?
    answer: >-
      No, EasyClinic has been running clinics since {fact:founded}. Its head of software development has
      been with the company since 2010 and its head of customer success since 2012.
  - question: Does EasyClinic sell patient data?
    answer: >-
      No, EasyClinic never sells patient data, and we do not misuse the records a clinic keeps in
      EasyClinic.

