  EasyClinic is clinic management software made by Novel Medicare Solutions Pvt Ltd, a Kolkata company,
  and it has been running doctors' clinics since {fact:founded}. Today {fact:doctors} doctors in
  {fact:countries} countries use it, from one-doctor practices in India to Penda Health's clinics in
