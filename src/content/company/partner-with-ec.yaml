notes:
  - 'Draft until the fact sheet answers spec 5.19: the commission or margin range and whether partners earn a commission or resell at a margin; how often and for how long the share is paid, and what happens to it when a clinic cancels; the partner tiers (names, who each suits, what moves a partner up or down; the table has two rows only as a frame, so add or remove rows to match); training hours and format; what the demo environment contains, how long access lasts and whether each partner gets one of their own; what co-marketing partners get; two named partners with their country, what they do and the year they joined, with consent to be named; and how long most clinics take to go live beyond the 3-day fastest case.'
  - 'Grounding: live https://www.easyclinic.io/partner-with-ec/ (re-fetched 2026-09-26). Kept as plain facts: partners are consultants, distributors and IT service providers; "consistent recurring income"; a revenue-sharing model ("Earn from every clinic you introduce to Easy Clinic. The bigger they grow, the more you earn."); sign up, learn the product, introduce clinics (Easy Clinic handles the rest, from implementation to support); partners are trained on the product; "when your clients have questions, our support team has their back"; the live page names co-branded materials, success stories and demo environments (details unknown, so bracketed); the sign-up form asks for name, email, company name or website, country, phone and a note. Clinic prices, no setup fee, no binding contract, reception login, unlimited support and training, the named account manager on Premium and Enterprise, and the four-day training come from plans.yaml, the price files and the live /pricing/ FAQ; the 20-minute demo is the spec 7.9 CTA (live /kenyademo/ says 30).'
  - 'Dropped from the live page as boilerplate or unsourced: the H1 "Partner with Easy Clinic" and H2 "Empower clinics. Drive growth. Earn together.", "transforming healthcare operations worldwide", "cutting-edge tools", "unmatched features", "seamless payor management", "pitch it like a pro", "Let''s build a healthier future together", the claim that payor rules "reduce claim rejection rates" (no public figure) and "AI generates intelligent EMR prescriptions in minutes" (no minutes-per-note figure).'
  - 'Penda Health and Qualitas Health appear only as customers (live page: "From Qualitas Health in Malaysia to Penda Health in Kenya"; Penda on Easy Clinic since 2017 per arXiv 2507.16947). Qualitas is written "has used it" because its testimonial is in the past tense, matching /about-us/. They are not channel partners and must not fill the partners table. Dr Korom calls Easy Clinic an "innovation partner", which is a different sense of the word, so his quotes are not used here.'
  - 'Editorial fixes on 2026-09-26: the go-live note no longer says how long a clinic with records to migrate takes (no source; now a placeholder); "a demo environment of your own" became "a demo environment" because the live page does not say each partner gets one; "Owners ask about the price first" and "Then they ask who else uses it" were rewritten as advice, not unsourced claims about owners; "moves up to Premium on the same system" lost "on the same system"; the partners table intro no longer states that two partners exist; prices were taken out of the tiers note because the owner section and the FAQ carry them.'
  - 'No demoForm: the contact page FAQ sends partners to email because the demo form is set up for clinics. If a partner application form is built (the live page has one: name, email, company or website, country, phone, note), add it and point the primary CTA at it. The mailto subject line is a convenience; change it if partner email goes to a separate inbox.'
  - 'Spec 6.5 named person: no one is named as the partner contact because who handles partners is not confirmed. Name the partner contact (for example the director of business growth and strategy) only once the company confirms it.'
  - 'Company family needs no proof block. Once the two partners are named, a quote from one of them (verbatim, consent on file, in src/data/testimonials/) would be the page''s proof; add it as a testimonialRow with layout single.'
  - 'editorialPass records the AI review only; a human editor must read the page aloud and redo both answers once the brackets are filled, before status moves to published. Related links follow the brief (/about-us/, /contact-us/); /about-us/ now exists in src/content/company/ but does not yet link here.'
  - 'Prices: the clinic-facing prices are Easy Clinic''s list prices. If partners resell at a margin and may set their own price, the "What does a clinic pay" FAQ and the What to tell a clinic owner section need a line saying so.'
