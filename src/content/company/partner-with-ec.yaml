# /partner-with-ec/ (spec 5.19 company pages; section 6 voice). Draft: spec 5.19 requires the commission or
# margin range, partner tiers, enablement (training hours, demo environment, co-marketing) and two named
# partners, and none of them is confirmed. Everything outside the brackets is a live or confirmed fact.
status: draft
headKeyword: Easy Clinic partner program
secondaryKeywords:
  - Easy Clinic reseller
  - clinic software partner program
  - EMR software reseller program
  - healthcare software distributor
title: Easy Clinic Partner Program for Consultants and Distributors
metaDescription: >-
  The Easy Clinic partner program pays a recurring [commission or margin range] on each clinic you
  introduce. We set up and support the clinic for you.
h1: Bring clinics to Easy Clinic and earn a share of what they pay
linkLabel: Partner program
eyebrow: For people who already sell to clinics or advise them
openingAnswer: >-
  The Easy Clinic partner program pays you a recurring [commission or margin range] on every clinic you
  introduce, paid [how often, and for how long]. You make the introduction, and we implement the
  software and support the clinic afterwards, including {fact:trainingDays} days of staff training, so
  you need no support desk of your own.
summary: >-
  What partners earn, how the tiers differ, the training and demo environment you get, and who sets up
  and supports the clinics you bring to Easy Clinic.
author: subhashish-saha
lastUpdated: 2026-09-26
ctas:
  primary:
    label: Email us about partnering
    href: mailto:hello@easyclinic.io?subject=Easy Clinic%20partner%20program
  secondary:
    label: Call {contact:in.phone}
    href: tel:+919147770277
  whatsapp: Hi, I was reading the Easy Clinic partner program page and would like to talk about introducing clinics to Easy Clinic.

sections:
  - discriminant: prose
    value:
      id: who-it-is-for
      heading: Who the program is for
      body: |-
        The program is for people clinic owners already listen to. A consultant who advises clinics knows which owners still write prescriptions on paper and which are fighting the software they have. A distributor, or an IT firm that looks after a clinic's computers, is already in the building when the printer stops talking to the system. Either way, the owner trusts you, and the program pays you for the introduction.

        You do not need to build or support anything. You introduce the clinic, and Easy Clinic handles the rest, from implementation to support. Our support team answers the clinic's questions by phone or in writing for as long as it is a customer, at no extra cost to the clinic.
      aside: >-
        **Running a clinic yourself?** This page is for partners. To see Easy Clinic for your own clinic,
        [book a 20-minute demo](/contact-us/#book-a-demo).

  - discriminant: stepList
    value:
      id: how-it-works
      heading: How the partner program works
      intro: >-
        Between your first email and your first payment, most of the work is ours.
      steps:
        - title: Write to us
          meta: One email
          body: >-
            Email hello@easyclinic.io with your company name and the countries you cover, and tell us
            about the clinics you already sell to or advise.
        - title: Learn the product
          meta: '[Training hours]'
          body: >-
            We train you on how Easy Clinic works, so you can show a clinic owner the chart and the bill
            yourself. [Training format, and who runs it.]
        - title: Introduce a clinic
          body: >-
            Show the clinic Easy Clinic on a partner demo environment, or bring the owner to our 20-minute
            demo and we run it. The clinic pays per doctor per month, with no binding contract.
        - title: We set the clinic up
          meta: In as little as {fact:goLiveDays} days
          body: >-
            We implement the software and train the clinic's staff over {fact:trainingDays} days, about
            two hours in all. From then on, the clinic's questions come to our support team.
        - title: You are paid
          meta: '[How often]'
          body: >-
            Your share of what the clinic pays reaches you [payment method and schedule, and for how long
            the share is paid].
      note: >-
        {fact:goLiveDays} days is the fastest a clinic goes live. [How long most clinics take, and how much
        longer a clinic moving its records from another system takes.]

  - discriminant: dataTable
    value:
      id: partner-tiers
      heading: What you earn at each tier
      intro: >-
        Every clinic you introduce earns you a recurring share of what it pays Easy Clinic. Clinics pay per
        doctor per month, so when a clinic you introduced adds a doctor, your share grows with it.
        [Whether partners earn a commission on what Easy Clinic invoices, or buy at a partner price and
        resell at a margin.]
      columns:
        - Tier
        - Who it suits
        - Your share
        - What comes with it
      rows:
        - - '[Tier 1 name]'
          - '[Who it suits]'
          - '[Commission or margin range]'
          - '[Training, demo environment and co-marketing at this tier]'
        - - '[Tier 2 name]'
          - '[Who it suits]'
          - '[Commission or margin range]'
          - '[Training, demo environment and co-marketing at this tier]'
      note: >-
        [What moves a partner from one tier to the next, and whether a partner can move back down.]

  - discriminant: featureRows
    value:
      id: enablement
      heading: What we give you to sell with
      intro: >-
        Training and a demo environment are for you. Support is for the clinics you bring, and it comes
        with their own plan.
      items:
        - heading: Product training
          body: >-
            You get [training hours] of training on Easy Clinic before you introduce your first clinic,
            [format, and who runs it]. The clinics you bring get their own {fact:trainingDays}-day staff
            training from us after they sign up.
        - heading: A demo environment
          body: >-
            You get a demo environment, [what it contains, and how long access lasts], so you can show a
            clinic owner Easy Clinic without booking a call with us first.
        - heading: Co-marketing
          body: >-
            [Co-marketing: which co-branded material and customer stories partners get, and at which
            tier.]
        - heading: Support for every clinic you bring
          body: >-
            When a clinic you introduced has a question, it calls or writes to our support team, so you
            need no support desk of your own. Support and training are unlimited on every plan at no extra
            charge, and Premium and Enterprise clinics also have a named account manager.

  - discriminant: prose
    value:
      id: what-to-tell-clinics
      heading: What to tell a clinic owner
      body: |-
        Start with the price. Professional is {price:inr.professional.annual} per doctor per month in India on annual billing, and Premium is {price:inr.premium.annual}. In US dollars they are {price:usd.professional.annual} and {price:usd.premium.annual}. Enterprise, for clinic chains and hospital OPDs, is priced on a quote. There is no setup fee and no binding contract.

        Then tell them who else uses it. Easy Clinic has been running clinics since {fact:founded}, and Penda Health has run its clinics in Nairobi on it since 2017. Qualitas Health in Malaysia has used it too. {fact:retention} of Easy Clinic's customers have used it for more than five years.

        Tell them the limits as well, because they will find them anyway. Easy Clinic is cloud software and does not run fully offline today, so a clinic whose line drops often needs a backup connection. Professional covers one location, and a clinic that opens a second branch moves up to Premium.
      aside: >-
        The [pricing page](/pricing/) sets out what each plan includes, and [about Easy Clinic](/about-us/)
        has the company's story from {fact:founded}.

  - discriminant: dataTable
    value:
      id: current-partners
      heading: Partners who sell Easy Clinic today
      intro: >-
        [One line on the two partners below, once both have agreed to be named.]
      columns:
        - Partner
        - Where they work
        - What they do
        - Partner since
      rows:
        - - '[Partner 1 name]'
          - '[Country]'
          - '[What they do, and the kind of clinics they bring]'
          - '[Year]'
        - - '[Partner 2 name]'
          - '[Country]'
          - '[What they do, and the kind of clinics they bring]'
          - '[Year]'

faqHeading: Questions partners ask
faq:
  - question: How much does an Easy Clinic partner earn?
    answer: >-
      You earn [commission or margin range] of what each clinic you introduce pays Easy Clinic, paid [how
      often, and for how long]. Clinics pay per doctor per month, so a clinic that adds doctors pays more
      and your share grows with it. On the Professional plan in India, a clinic pays
      {price:inr.professional.annual} per doctor per month on annual billing.
  - question: What is the difference between the partner tiers?
    answer: >-
      The tiers differ in [what each tier pays, and what it asks of the partner], and you move up when
      [what moves a partner from one tier to the next]. Whatever your tier, the clinics you bring get the
      support that comes with their own plan, because they call our support team directly.
  - question: Do I have to implement and support the clinics myself?
    answer: >-
      No, Easy Clinic implements every clinic you introduce and trains its staff over {fact:trainingDays}
      days, about two hours in all, at no charge to the clinic. After that the clinic calls or writes to
      our support team, and support is unlimited on every plan, so you do not need a support desk of your
      own.
  - question: What does a clinic pay for Easy Clinic?
    answer: >-
      A clinic pays per doctor per month: in India, Professional is {price:inr.professional.annual} and
      Premium {price:inr.premium.annual} on annual billing, or {price:inr.professional.quarterly} and
      {price:inr.premium.quarterly} billed quarterly. In US dollars, Professional is
      {price:usd.professional.annual} and Premium {price:usd.premium.annual} on annual billing, and
      Enterprise is priced on a quote. There is no setup fee, and a login for the receptionist is included
      in the price.
  - question: What happens to my share if a clinic I introduced leaves?
    answer: >-
      [What happens to the partner's share when a clinic cancels, and whether any of it is paid back.] A
      clinic can leave whenever it chooses, because Easy Clinic has no binding contracts, though
      {fact:retention} of Easy Clinic's customers have used it for more than five years.
  - question: How are partners trained, and can I run my own demos?
    answer: >-
      Partners get [training hours] of product training before their first introduction, [format, and who
      runs it], and a demo environment, [what it contains, and how long access lasts]. If you would rather
      not run the demo yourself, bring the clinic owner to our 20-minute demo and we will run it for you.

