sections:
  - discriminant: prose
    value:
      id: not-hiring
      heading: We are not hiring right now
      body: |-
        There are no open positions at EasyClinic at the moment. We grow deliberately and open a role only when we can give the person who takes it real ownership and proper support, so this page will sometimes be quiet, and that is by design.

        You can still introduce yourself. Email a short introduction and your CV to [hello@easyclinic.io](mailto:hello@easyclinic.io) and we keep it on file, so we already know you when we start hiring. Every new opening is posted on this page first, and our [LinkedIn page](https://www.linkedin.com/company/easy-clinic/) announces it the moment it goes live. Roles can open at short notice.

  - discriminant: prose
    value:
      id: working-here
      heading: What working at EasyClinic is like
      body: |-
        EasyClinic is a product company, and everything we build starts with one question: does this make a clinician's day easier? Our software supports {fact:doctors} doctors in {fact:cities} cities, and every feature ships to practising doctors who depend on it daily. You see what your work changes in how a clinic runs, from a thirty-second prescription to a billing queue that moves more smoothly.

        We hire people we can trust with a problem and let them own the outcome, with a genuine say in how it gets solved. Expect honest feedback and space to learn. As the product and the company grow, there is room to stretch into areas you have not worked in before. EasyClinic is built on a low-code technical framework, so you work with current tools rather than fighting a legacy system.
      aside: |-
        **Where we are**

        EasyClinic is made by Novel Medicare Solutions Pvt Ltd. Our office is at 30 Circus Avenue, Kolkata 700017, West Bengal, India.

        Gaurab Chatterjee, our head of software development, has been at EasyClinic since 2010.

  - discriminant: stepList
    value:
      id: how-hiring-works
      heading: How hiring works when a role opens
      intro: When a role does open, the process is set up to respect your time.
      steps:
        - title: We post the role
          body: The role goes on this page and on our [LinkedIn page](https://www.linkedin.com/company/easy-clinic/).
        - title: You apply
          body: You send a short introduction and your CV.
        - title: We get to know you
          body: We talk with you about your experience and the role.
        - title: We decide and tell you
          body: We make a decision quickly and tell you either way.

faqHeading: Questions people ask about working at EasyClinic
faq:
  - question: Are there any open roles at EasyClinic right now?
    answer: >-
      No, there are no open roles at EasyClinic right now. We open a role only when we can give the new
      person real ownership and proper support, and when one opens it is posted on this page first.
  - question: Can I send my CV even though you are not hiring?
    answer: >-
      Yes, email a short introduction and your CV to [hello@easyclinic.io](mailto:hello@easyclinic.io) and
      we keep it on file. That way we already know you when we start hiring.
  - question: How will I find out when a role opens?
    answer: >-
      Check this page, because every new opening is posted here first, and follow EasyClinic on
      [LinkedIn](https://www.linkedin.com/company/easy-clinic/) to hear the moment a role goes live. Roles
      can open at short notice, so it is worth looking in regularly.
  - question: If I apply for a role, will I hear back?
    answer: >-
      Yes, when you apply for a posted role we make a decision quickly and tell you either way. Before
      deciding, we talk with you about your experience and the role.
  - question: What technology is EasyClinic built on?
    answer: >-
      EasyClinic is built on a low-code technical framework and runs in the cloud, with monthly upgrades.
      Doctors and their staff sign in at [app.easyclinic.io](https://app.easyclinic.io/).
  - question: Which company is behind EasyClinic, and where is its office?
    answer: >-
      EasyClinic is made by Novel Medicare Solutions Pvt Ltd, and the office is at 30 Circus Avenue, Kolkata
      700017, West Bengal, India.

