editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The page says plainly that there are no open roles and gives the one address to write to, ties the work
    to the thirty-second prescription and the billing queue at clinics that use EasyClinic, and names Novel
    Medicare Solutions, the office at 30 Circus Avenue in Kolkata and Gaurab Chatterjee, at EasyClinic since
    2010.
  readsMachineWritten: >-
    The culture paragraph about ownership and honest feedback could sit on any software company's careers
    page, and with no team size or named hiring contact to anchor it, the read-aloud pass should cut any line
    that sounds like a job-board template.

notes:
  - 'Spec 5.19 /careers/: honest "not hiring" copy, culture paragraph, Kolkata office. Grounded in the live https://www.easyclinic.io/careers/ as read on 2026-09-26, which says "We''re not hiring right now" and lists no role. Every statement about hiring, the culture and the process restates the live page.'
  - 'No JobPosting schema: there are no roles (spec 2.10, 5.19). When a role opens, add a section for it (title, team, location, how to apply), change the title, opening answer and FAQ 1, and add JobPosting for that role only.'
  - 'Removed from the live page: the "1000+ International Placements support" counter (no source, and its meaning is unclear), the footer boilerplate, and "modern". The shared stat line (spec 2.11) is not used; the doctors and cities figures appear once, in a sentence, because the live careers page states them.'
  - 'Spec asks for an open-application form. No application form block exists (demoForm books demos and posts to the demo CRM), and the live page asks for an email, so the CTAs are mailto: links to hello@easyclinic.io. Add a form when one exists, and a separate careers address if the company wants CVs out of the sales inbox.'
  - 'The live page has no FAQ (re-read 2026-09-26). The audit''s four FAQs were on the staging build (open roles, CV while not hiring, hiring process, where to follow); their substance is kept in FAQs 1 to 4 with answers from the live page. FAQ 3 no longer says LinkedIn gets a role "at the same time", which contradicted "posted here first"; it now restates the live "notified the moment a role goes live". FAQ 5 (technology) restates the live "low-code technical framework" line, "Cloud-based, monthly upgrades" from the live /kenyademo/ (facts.md section 6) and the app sign-in URL from site.yaml. FAQ 6 uses the legal entity and office address from site data, and no longer asks "which company would I be working for", since no page states who employs staff.'
  - 'Title keeps "No Open Roles Now, How to Apply" rather than the brief''s example "Work in Kolkata": the live page does not say where roles are based, so the title does not imply it. Title Case matches the other title tags on the site; headings are sentence case.'
  - 'Left out for lack of a confirmed fact: whether roles are office-based, hybrid or remote; which teams hire; internships; salary or benefits; team size; whether speculative CVs get a reply; relocation or visas. The page gives the office address only and does not say roles are based there. Add any of these as FAQs once confirmed.'
  - 'Named people: Gaurab Chatterjee (head of software development) and the byline, Subhashish Saha, from src/data/authors. "At EasyClinic since 2010" is from the live /about-us/ ("in his role at Easy Clinic since 2010") and facts.md, as about-us.yaml states it; no other bio, no photos, no personal LinkedIn. The LinkedIn link is the company page from site.yaml social, which the live careers page links.'
  - 'ctas.whatsapp is set so the persistent button and the closing band do not send the default demo request from a careers page. The WhatsApp line is the main sales line; applications still go by email.'
  - 'Related links: /about-us/ and /contact-us/ (brief). No proof block: the company family does not require one, and no testimonial is about working at EasyClinic.'
