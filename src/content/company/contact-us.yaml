  primary:
    label: Book a 20-minute demo
    href: /contact-us/#book-a-demo
  secondary:
    label: Email hello@easyclinic.io
    href: mailto:hello@easyclinic.io
notes:
  - 'Spec 5.19 /contact-us/, 7.9 (demo form) and section 11 UX 3. LocalBusiness schema is added automatically for this page (spec 2.10).'
  - No heroMedia. Spec 12 lists no screen for the contact page, and the demo form is the page's main visual. Add one only if the team wants a Kolkata reception photo (generated environmental image, never presented as our office).
  - 'Country table: names, phones and hours come from src/data/countries/*.yaml through contact tokens. Walter Brian Maguke (Kenya) renders only once countries/ke.yaml sets publishName: true. India, UAE and Nigeria have no named contact yet; UAE and Nigeria have no local number.'
  - 'Spec 6.5 named person: the only named person on the page is the Kenya contact in the table, gated on publishName. If consent does not come through, the author byline is the only name left; consider naming the India contact once countries/in.yaml has one.'
  - Hours in the table must be written in each country's local time (the table intro says so).
  - 'Spec asks for a country selector. A dataTable stands in until a selector exists; each country row could also become a contactCard block.'
  - 'Booking calendar tool not chosen yet. Replace [booking calendar embed] with the embed (needs a component or an iframe block), or delete the "Book a time directly" section and the calendar mention in FAQ 2.'
  - 'Secondary CTA points at https://wa.me/919147770277 (site.yaml whatsapp). The persistent WhatsApp button uses ctas.whatsapp as the prefilled message.'
  - 'Author: suggest Subhashish Saha (Head of customer success), since this page serves existing customers as well as new clinics. Needs sign-off.'
  - Confirm whether existing-customer support uses the same number as sales (+91 91477 70277 in site.yaml); FAQ 1 and the aside assume a separate support line until told otherwise.
  - '[call-back window] appears in the demo form promise and FAQ 2. If one window applies everywhere, write it once in both; if it differs by country, fill countries/<code>.yaml contact.callbackWindow for the confirmation page.'
sections:
  - discriminant: demoForm
    value:
      id: book-a-demo
      heading: Book a 20-minute demo
      intro: Tell us your type of practice and how many locations you run, and we will set the demo up around a clinic like yours.
      promise: |
        **What happens after you send this.** We call you within [call-back window] on the number you gave, and where your country has a named contact in the table below, that person makes the call.

        On that call we ask how your clinic runs today and fix a time for the 20-minute demo.
  - discriminant: dataTable
    value:
      id: local-contacts
      heading: Talk to someone in your country
      intro: If you would rather talk now than fill in a form, call the person for your country. Hours are in local time.
      columns:
        - Country
        - Who to call
        - Phone
        - Hours
      rows:
        - - India
          - '{contact:in.name}'
          - '{contact:in.phone}'
          - '{contact:in.hours}'
        - - Kenya
          - '{contact:ke.name}'
          - '{contact:ke.phone}'
          - '{contact:ke.hours}'
        - - UAE
          - '{contact:ae.name}'
          - '{contact:ae.phone}'
          - '{contact:ae.hours}'
        - - Nigeria
          - '{contact:ng.name}'
          - '{contact:ng.phone}'
          - '{contact:ng.hours}'
      note: |
        Clinics in any other country can call or WhatsApp {contact:in.phone}, or email hello@easyclinic.io. Each of the four countries above also has its own demo page: [India](/indiademo/), [Kenya](/kenyademo/), [UAE](/uaedemo/) and [Nigeria](/nigeriademo/).
  - discriminant: prose
    value:
      id: book-a-time
      heading: Book a time directly
      body: |
        Pick a 20-minute slot below and the demo is booked, with no call first to arrange it.

        [booking calendar embed]

        If none of the times fit around your clinic hours, send the form above or a WhatsApp message and we will find one that does.
  - discriminant: prose
    value:
      id: visit-or-write
      heading: Visit or write to us
      body: |
        EasyClinic is made by Novel Medicare Solutions Pvt Ltd, a Kolkata company that has been running clinics on its software since {fact:founded}. The office is at 30 Circus Avenue, Kolkata 700017, West Bengal, India.

        Write to hello@easyclinic.io for anything that is not urgent. If you plan to visit, call {contact:in.phone} first so the person you want to meet is in the office that day.
      aside: |
        **Already a customer?**

        Sign in to the software at [app.easyclinic.io](https://app.easyclinic.io/). How-to articles are at [help.easyclinic.io](https://help.easyclinic.io/), and for anything they do not answer, call [support line and hours for existing customers].
