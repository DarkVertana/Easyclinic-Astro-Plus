faqHeading: Questions people ask before they get in touch
faq:
  - question: I already use EasyClinic and something is not working. Who do I contact?
    answer: |
      Existing customers should start at the help centre, [help.easyclinic.io](https://help.easyclinic.io/), and call [support line and hours for existing customers] for anything the articles do not answer. Support and training are included in every plan at no extra charge, and Premium and Enterprise clinics can also go to their named account manager. Please do not use the demo form on this page for support, because it books demos and does not open a support request.
  - question: How quickly will someone call me after I book a demo?
    answer: |
      We call you within [call-back window] of your request, on the number you gave, to fix a time for the 20-minute demo. If you would rather not wait, call the number for your country in the table above, or pick a slot in the booking calendar yourself.
  - question: Can the demo be in a language other than English, such as Hindi or Swahili?
    answer: |
      Demos are given in [demo languages by country], so tell us your language in your WhatsApp message or when we call, and we will say on that call whether we can do it. Prescriptions are a separate question: they can print in two languages, such as English and Swahili, and the full list is [prescription languages].
  - question: Do you visit clinics in person?
    answer: |
      We visit clinics in person in [cities where the team visits clinics in person], and everywhere else the demo is a 20-minute video call. If you are outside those cities and want someone on site for training or go-live, ask on that first call and we will tell you then whether we can send someone.
  - question: I want to partner with EasyClinic or resell it. Who do I talk to?
    answer: |
      Partners and resellers should start at the [partner programme page](/partner-with-ec/), which sets out the partner tiers and the margin you earn. The demo form here is set up for clinics, so if you would rather write, email hello@easyclinic.io with your company name and the countries you cover.
