faqHeading: Questions people ask before they get in touch
faq:
  - question: I already use EasyClinic and something is not working. Who do I contact?
    answer: |
      Start at the help centre, [help.easyclinic.io](https://help.easyclinic.io/), and for anything the articles do not answer, call {contact:in.phone} or email hello@easyclinic.io with your clinic's name. Support is included in every plan at no extra charge, and Premium and Enterprise clinics also have a named account manager to go to. Please do not use the demo form on this page for support, because it books demos and does not open a support request.
  - question: Will I be tied into a contract if I go ahead after the demo?
    answer: |
      No, there is no binding contract and no setup fee, so you can use EasyClinic for as long as you are happy with it. Professional and Premium are priced per doctor per month and billed annually or quarterly: in India, Professional is {price:inr.professional.annual} per doctor per month on annual billing or {price:inr.professional.quarterly} on quarterly billing. A login for your receptionist is included in that price, though the receptionist cannot open the EMR or write prescriptions.
  - question: How soon could my clinic be running on EasyClinic after the demo?
    answer: |
      Clinics can go live in as little as {fact:goLiveDays} days after the demo. Training for you and your clinic staff takes {fact:trainingDays} days and two hours in all: 40 minutes of basic training on day 1, 40 minutes of EMR scenario training on day 2, 20 minutes of practice exercises on day 3 and 20 minutes on the road to expertise on day 4. There is no charge for the training.
  - question: We still write prescriptions on paper. Is a demo worth our time?
    answer: |
      Yes, and clinics on paper get a specific promise from us: give us 2 hours, or 10 patient records, and we will make your prescription writing faster. The demo itself takes 20 minutes, and there is no binding contract, so you decide after it whether those 2 hours are worth giving.
  - question: Does EasyClinic work without an internet connection?
    answer: |
      No, EasyClinic does not run fully offline today, so your clinic needs a working internet connection to use it. You and your staff sign in at [app.easyclinic.io](https://app.easyclinic.io/), so if your line drops often, mobile data on a spare phone or a dongle is worth keeping as a backup.
  - question: I want to partner with EasyClinic or resell it. Who do I talk to?
    answer: |
      Email hello@easyclinic.io with your company name and the countries you cover, and say whether you want to [partner with EasyClinic](/partner-with-ec/) or resell it. Please use email rather than the demo form, because the form is set up for clinics booking a demo.
