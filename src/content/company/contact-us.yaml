editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: The Kolkata office at 30 Circus Avenue with the India and Kenya lines side by side, and the promise of faster prescribing to clinics on paper in exchange for 2 hours or 10 patient records, are specific to how Easy Clinic works with clinics in India and Kenya.
  readsMachineWritten: With no named person to call, no hours and no call-back time, the contact table and the demo form promise can read like a switchboard, and the FAQ answers are all much the same length.
notes:
  - 'FAQ answers 2 to 6 replaced 2026-10-27 at the owner''s request. "Many clinics on Easy Clinic moved straight from paper" rests on testimonials such as tl-prabhu (paper to paperless); no count is claimed. The offline answer no longer mentions the self-hosted option.'
  - 'Contact form (2026-10-23, owner request): the short form (name, email, phone, speciality, note) with a help panel, per the owner''s screenshot. The Kenya phone, email and Nairobi address in the help panel (+254 762907500, kenya@easyclinic.io, Spring Valley Business Park) come from that screenshot and differ from src/data/countries/ke.yaml (+254 750 184 357, walter@easyclinic.io), which the Kenya pages still use; the office cards (Call us in India or Kenya) on this page use the screenshot details too. The office maps load Google Maps only on a click (frame-src www.google.com in astro.config.ts). Owner: use the screenshot on this page for now; reconcile ke.yaml when confirmed. The screenshot''s Cloudflare check is not built: the form keeps the honeypot and 3-second spam traps.'
  - 'Spec 5.19 /contact-us/, 7.9 (demo form) and section 11 UX 3. LocalBusiness schema is added automatically for this page (spec 2.10).'
  - 'Published 2026-09-26 with confirmed facts only (owner decision). Taken out until the fact sheet answers them: the call-back window, contact names and hours, demo and prescription languages, the cities the team visits in person, and the booking calendar. Each can come back as a line or an FAQ once confirmed.'
  - 'heroMedia: telehealth-call.jpg, a stock photo of a patient on a video consultation (owner request 2026-10-23). It illustrates remote care and is not presented as our office or a customer.'
  - 'Country table shows only the confirmed phone and email for India and Kenya. When a contact name is cleared (countries/<code>.yaml publishName: true) or hours are known, add Who to call and Hours columns back with contact tokens, hours in local time. UAE and Nigeria have no local number yet, so the table intro sends them to the India line.'
  - 'Spec 6.5 named person: the only named person on the page is the author byline. Name the Kenya contact in the table once countries/ke.yaml sets publishName: true.'
  - 'Spec asks for a country selector. A dataTable stands in until a selector exists; each country row could also become a contactCard block.'
  - 'Spec asks for a booking calendar embed. No tool is chosen, so the "Book a time directly" section was removed; add it back (needs a component or an iframe block) when one is.'
  - 'Call-back window: when known, add it to the demo form promise; if it differs by country, fill countries/<code>.yaml contact.callbackWindow for the confirmation page.'
  - 'Secondary CTA points at https://wa.me/919147770277 (site.yaml whatsapp). The persistent WhatsApp button uses ctas.whatsapp as the prefilled message.'
  - FAQ 1 and the aside send existing customers to the main number and hello@easyclinic.io. If support has its own line, put it in both places.
  - 'Country demo links: /indiademo/ (published) is named in the table note; /kenyademo/ sits on the Kenya row and /uaedemo/ and /nigeriademo/ on the country names in the table intro, so each reads correctly as plain text while its page is unpublished. When those pages go live, consider a note naming all four.'
  - 'FAQ 3 and the /switch/ link use goLiveDays ("in as little as 3 days"), which conflicts with the "2 to 4 week setup" on the live Kenya listicle (see the facts.yaml note).'
  - 'Audit 2026-09-27: pen-and-paper promise changed from "2 hours and 10 patient records" to "2 hours, or 10 patient records", the wording on /switch/, /pricing/india/, /kenyademo/ and /features/emr/. The live /pricing/ FAQ source ("give us just 2 hours / 10 patient records") is ambiguous; if the company says both are required, change every page to "and". The FAQ follow-on "whether those 2 hours are worth giving" still reads correctly.'
  - 'Audit 2026-09-27: "a Kolkata company that has been running clinics on its software since 2003" dated the company itself to 2003; the confirmed fact is that Easy Clinic has run clinics since 2003, and the entity''s name and incorporation date for that year are unsourced (about-us.yaml records the same removal). It now reads "Novel Medicare Solutions Pvt Ltd, a Kolkata company, and has been running clinics since 2003". Also removed the visit advice ("call first so the person you want to meet is in the office that day"): no confirmed fact covers visits or who is in the office, and the about-us fact-check removed the same line. The office address stays (confirmed).'

