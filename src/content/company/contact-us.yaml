faqHeading: You Have Questions, We Have Answers

faq:
  - question: I already use Easy Clinic and something is not working. Who do I contact?
    answer: |
      Start at the help centre, [help.easyclinic.io](https://help.easyclinic.io/), and for anything the articles do not answer, call {contact:in.phone} or email hello@easyclinic.io with your clinic's name. Support is included in every plan at no extra charge, and Premium and Enterprise clinics also have a named account manager to go to. Please do not use the demo form on this page for support, because it books demos and does not open a support request.
  - question: Will I be tied into a contract if I go ahead after the demo?
    answer: >-
      You choose annual or quarterly billing when you sign up. Annual billing costs less per month. Your
      plan terms are set out in our [Terms of Service](/terms/), and we walk you through them before you
      sign.
  - question: How soon could my clinic be running on Easy Clinic after the demo?
    answer: >-
      Training takes about two hours, spread over four days, for you and your staff. We agree your go-live
      date with you after the demo. If you are moving from another system, we can import your existing
      records first.
  - question: We still write prescriptions on paper. Is a demo worth our time?
    answer: >-
      Yes. Bring a real case to the demo. We will write the same prescription on Easy Clinic while you
      watch, so you can judge the time difference yourself. Many clinics on Easy Clinic moved straight
      from paper.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      No. Easy Clinic is cloud software, so it needs an internet connection. It runs in a web browser on
      any device with a connection, at the clinic or away from it.
  - question: I want to partner with Easy Clinic or resell it. Who do I talk to?
    answer: >-
      Email [hello@easyclinic.io](mailto:hello@easyclinic.io) with your company name, the countries you
      work in and the clinics you serve. Our team will pass it to the right person and get back to you.

