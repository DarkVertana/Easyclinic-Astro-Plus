faqHeading: You Have Questions, We Have Answers
faq:
  - question: Can a clinic outside India and Kenya use Easy Clinic?
    answer: Yes, Easy Clinic runs in the cloud in a web browser, and clinics in {fact:countries} countries use it today, so a clinic anywhere with an internet connection can run on it.
  - question: What does Easy Clinic cost outside India?
    answer: Easy Clinic is priced per doctor per month. Outside India, Professional is {price:usd.professional.annual} and Premium is {price:usd.premium.annual} per doctor per month, billed annually. Enterprise, for clinic chains, is priced on a quote. Local taxes are extra.
  - question: What training does a clinic in another country get?
    answer: The same as every clinic. Training takes about two hours over four days, run online for you and your staff. It is included in every plan, and support continues by phone, email and chat after you go live.
  - question: Is there a free trial?
    answer: The way to try Easy Clinic is a free 20-minute demo, set up around a clinic like yours. Ask in the demo about trying it with your own team before you sign up.
