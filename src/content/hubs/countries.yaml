faq:
  - question: Can a clinic outside these four countries use EasyClinic?
    answer: Yes, EasyClinic runs in the cloud in a web browser, and clinics in {fact:countries} countries use it today, so a clinic anywhere with an internet connection can run on it.
  - question: What does EasyClinic cost outside India?
    answer: Prices are published in US dollars, with Professional at {price:usd.professional.annual} and Premium at {price:usd.premium.annual} per doctor per month billed annually, and Enterprise is priced on a quote.
  - question: Do I need a server or IT staff?
    answer: No, EasyClinic runs in the cloud in a web browser, so there is nothing to install, and updates arrive every month without an engineer visiting the clinic.
  - question: How is training done for a clinic in another country?
    answer: Training runs over {fact:trainingDays} short sessions of about two hours in total on a video call, and support by phone, email and chat is included in every plan.
  - question: Is there a free trial?
    answer: There is no free trial, and the demo runs on a clinic set up like yours so you see your own patient flow before you decide.
