faq:
  - question: Can a clinic outside India and Kenya use Easy Clinic?
    answer: Yes, Easy Clinic runs in the cloud in a web browser, and clinics in {fact:countries} countries use it today, so a clinic anywhere with an internet connection can run on it.
  - question: What does Easy Clinic cost outside India?
    answer: Prices are published in US dollars, with Professional at {price:usd.professional.annual} and Premium at {price:usd.premium.annual} per doctor per month billed annually, and Enterprise is priced on a quote.
  - question: Do I need a server or IT staff?
    answer: No, Easy Clinic runs in the cloud in a web browser, so there is nothing to install, and updates arrive every month without an engineer visiting the clinic.
  - question: What training does a clinic in another country get?
    answer: Training runs over {fact:trainingDays} short sessions of about two hours in total, and support by phone, email and chat is included in every plan.
  - question: Is there a free trial?
    answer: There is no free trial, and the demo runs on a clinic set up like yours so you see your own patient flow before you decide.
