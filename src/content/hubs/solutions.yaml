faq:
  - question: I run a single-doctor clinic. Where do I start?
    answer: >-
      Start with Professional, at {price:usd.professional.annual} per doctor per month billed annually
      or {price:inr.professional.annual} in India, which covers one location and includes a login for
      your receptionist. After the demo a clinic can go live in as little as {fact:goLiveDays} days, and
      training for you and your staff runs over {fact:trainingDays} days of short sessions, about two
      hours in all. The [solo clinic page](/solutions/solo-clinic/) is the one to read next.
  - question: Can a polyclinic start on Premium and move to Enterprise later?
    answer: >-
      Yes, and because no plan has a contract, nothing holds a polyclinic on Premium once it needs more.
      Premium is the plan for group practices that share one front door, and Enterprise, priced on a
      quote, includes everything in Premium plus modules such as financial accounting or the patient
      portal and app. Pharmacy and lab management do not force the move on their own, because a clinic
      on Premium can add either one as a module.
  - question: Does a clinic chain need Enterprise?
    answer: >-
      Not for a second branch alone: Premium covers more than one location, at
      {price:usd.premium.annual} per doctor per month billed annually. Enterprise is for the chain that
      wants head office in charge, with central control of every location and clinical SOP tracking
      across branches, and each chain gets its own quote.
  - question: Do specialty clinics pay more?
    answer: >-
      Yes, if you want specialty EMR templates, which come with Premium at {price:usd.premium.annual}
      per doctor per month billed annually against {price:usd.professional.annual} on Professional. In
      India the two are {price:inr.premium.annual} and {price:inr.professional.annual}. The templates are
      included in the Premium price, with no separate charge listed for each specialty, and a general
      practitioner who needs none of them can stay on Professional.
  - question: Is there a free trial?
    answer: >-
      No, EasyClinic does not offer a free trial. The 20-minute demo follows your own clinic's patient
      flow on a demo clinic set up like yours, and if you go ahead there is no contract to sign.
  - question: Can EasyClinic run a whole hospital, or only the OPD?
    answer: >-
      Only the outpatient side: EasyClinic runs the OPD and day care of a hospital or nursing home, and
      inpatient wards and operating theatres are out of scope. A hospital with beds keeps a separate
      inpatient system beside EasyClinic, and connecting the two is an integration scoped per project.
      The [hospital OPD page](/solutions/hospital-opd/) sets out where the line falls.

