editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The plan table maps each kind of practice to EasyClinic's own plans and per-doctor prices in dollars
    and rupees, and the page admits that EasyClinic does not run inpatient wards or fully offline, though
    it names no person and nothing on it is specific to one country.
  readsMachineWritten: >-
    The fourteen one-line specialty descriptions follow one pattern and say little beyond the specialty's
    name, and the ratings block has no review counts, so a doctor may read both as filler.

notes:
  - 'Published 2026-09-26 with confirmed facts only (owner decision). No heroMedia, no screenshots, no regulator blocks, no testimonials.'
  - 'Audit note (staging audit 2026-09-23, /solutions/ row): "Hub is fine as a router; add NGO card and the two-question selector; remove stat line." The NGO card is added and there is no stat line. The two-question doctors selector (spec 5.9) is out of scope for this build and is never linked.'
  - 'Specialty hrefs follow src/data/nav.yaml (Solutions, By specialty) and redirects.yaml, which differ from spec 4.3 for four pages: /mental-health/ (spec /mental-health-emr/), /obgyn-emr-software/ (spec /obgyn-emr/), /physiotherapy-clinic-management-software/ (spec /physiotherapy-software/), /ayurveda-clinic-management-software/ (spec /ayurveda-software/). Keep this list in step with nav.yaml if the slugs change.'
  - 'Specialty descriptions are deliberately generic (EMR, prescriptions and billing are in every plan). The specialty-specific objects in spec 5.15 (odontogram, growth charts, refraction and so on) are not confirmed product facts. When each specialty page is published, delete the description here and HubGrid falls back to that page''s own summary.'
  - 'Left out for lack of a confirmed fact: NGO pricing (spec 5.10 "[decide before launch]"), so there is no NGO row in the plan table and no NGO pricing FAQ; a "Can I switch plans later?" FAQ, because moving down a plan, whether records carry over on a plan change, and what happens to the unused part of an annual payment are not confirmed (the polyclinic FAQ covers moving up only, from plans.yaml "Everything in Premium, plus" and the no-contract condition); what a second branch adds to the bill (per doctor, per location or both); add-on prices; which specialty templates exist; review counts for the badges (capterraReviews and googleReviews are null); a Google reviews URL (the 4.8 comes from the Trustindex badge on the live footer, so the Google badge has no link).'
  - 'NGO card uses the spec 5.10 promise words ("low budgets and low bandwidth") and states the live-site limit ("does not run fully offline today", facts.md). It does not mention the self-hosted option, whose offline behaviour is not confirmed, and makes no donor-reporting claim.'
  - 'Hospital card and FAQ use the scope in spec 5.8 and the published /solutions/hospital-opd/ page: OPD, day care and nursing homes, not inpatient wards or operating theatres. The HIS connection line comes from the plans.yaml integrations add-on ("an existing HIS, scoped per project").'
  - 'No free trial per spec 1.2 (decided 23 September). The demo wording ("on a demo clinic set up like yours") matches /indiademo/, which says the demo uses none of the clinic''s real records. The trial answer no longer says a clinic "stops paying", because refunds on an annual payment are not confirmed.'
  - 'Chain card and FAQ use plans.yaml Enterprise lines only ("Central control of every location", "Clinical SOP tracking across branches"). Spec 5.7 figures for stockouts and denied claims are not used: they have no public source.'
  - 'Plan table "What decides it" cells use plans.yaml inclusions only. The hospital row says pharmacy and lab are included on Enterprise rather than implying they need it, because plans.yaml lists both as add-ons for Professional and Premium.'
  - 'Secondary keyword "clinic software by specialty" replaced with "clinic software by practice size" so specialty terms stay with the /specialties/ hub and the specialty pages (spec 4.5 rule 5).'
  - 'Meta description is 154 characters, opens with the head keyword and carries no tokens (the lint measures the raw string, so a price token would count at its token length).'
  - 'Title (58 characters) carries the head keyword; spec section 4 has no row for this hub. Head keyword "clinic software by practice type" does not collide with any other page as of 2026-09-26.'
  - 'Audit 2026-09-27: added General practice, ENT and Neurology to the by-specialty grid, in step with the same addition to the nav.yaml By specialty menu. All three pages are published and had only two or three in-content inbound links. Descriptions follow the existing generic pattern; the GP card says "on every plan" because plans.yaml puts patient records and the EMR in Professional and the GP page says a GP without templates can stay on Professional. readsMachineWritten now counts fourteen descriptions.'
  - 'Audit 2026-09-27: the plan table intro and the /pricing/ related-link description no longer say every plan is priced per doctor per month. Enterprise is on a quote (plans.yaml custom: true), and whether that quote is per doctor is not public; the link uses the /compare/ hub''s wording.'
