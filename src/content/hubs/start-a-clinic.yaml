faq:
  - question: When should a new clinic choose its software?
    answer: Before the first patient walks in, because registration, the appointment book and billing all start on day one, and moving a running clinic off paper later takes longer than starting on software.
  - question: How long does it take to get EasyClinic running in a new clinic?
    answer: Training runs over {fact:trainingDays} short sessions of about two hours in total, and the fastest clinics go live in as little as {fact:goLiveDays} days after the demo.
  - question: What does EasyClinic cost for a clinic with one doctor?
    answer: The Professional plan is {price:usd.professional.annual} per doctor per month billed annually, or {price:inr.professional.annual} in India, and a login for your receptionist is included.
  - question: Do I need any IT staff to run clinic software?
    answer: No, EasyClinic runs in the cloud in a web browser, so there is no server to buy, and support and training are included in every plan at no extra charge.
  - question: Can I start small and add doctors or branches later?
    answer: Yes, you pay per doctor, so a second doctor adds one licence, and the Premium plan covers more than one location on the same patient record.
