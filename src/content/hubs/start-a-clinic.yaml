faq:
  - question: When should a new clinic choose its software?
    answer: Before the first patient walks in, because registration, the appointment book and billing all start on day one, and moving a running clinic off paper later takes longer than starting on software.
  - question: How long does it take to get EasyClinic running in a new clinic?
    answer: Training runs over {fact:trainingDays} short sessions of about two hours in total, and the fastest clinics go live in as little as {fact:goLiveDays} days after the demo.
  - question: What does EasyClinic cost for a clinic with one doctor?
    answer: The Professional plan is {price:usd.professional.annual} per doctor per month billed annually, or {price:inr.professional.annual} in India, and a login for your receptionist is included.
  - question: Do I need any IT staff to run clinic software?
    answer: No, EasyClinic runs in the cloud in a web browser, so there is no server to buy, and support and training are included in every plan at no extra charge.
  - question: Can I start small and add doctors or branches later?
    answer: Yes, you pay per doctor, so a second doctor adds one licence, and the Premium plan covers more than one location on the same patient record.
editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: 'The hub groups EasyClinic''s own setup guides and posts by the seven countries they cover, and most of them end with the software choice for opening day.'
  readsMachineWritten: 'The card descriptions are short and functional; an editor may want one line of first-hand advice from someone who has opened a clinic.'
notes:
  - 'Audit 2026-09-27: the proof heading was "Clinics that started on EasyClinic", but the block shows only EasyClinic''s overall Capterra and Google ratings, which do not come from clinics that opened on it. It now reads "How clinics rate EasyClinic" (the /compare/ and /solutions/polyclinic/ wording), and the ratings are {fact:capterraRating} and {fact:googleRating} instead of plain 4.9 and 4.8.'
  - 'Audit 2026-09-27: the hub now links the nine published posts with topic start-a-clinic, which had no inbound link except /blog/ (spec 2.9). Kenya and India groups gained the country posts; Rwanda (/clinic-in-rwanda/) and Malaysia (/clinic-in-malaysia/) have their own sections; the country-neutral checklist and break-even posts sit under "Before you open, anywhere". The posts stay in the posts collection (owner /countries/, /kenyademo/, /pricing/india/ or /solutions/solo-clinic/). New cards carry no label or description, so each shows the post''s own linkLabel and summary and no new claim is added.'
  - 'Audit 2026-09-27: meta description, summary, opening answer and onlyUsCouldWrite now name seven countries. The opening answer no longer says each guide covers registration, costs and software (the added posts do not); "most end with choosing software" holds for 14 of the 19 linked pages (checked 2026-09-27: the ten guides, the Rwanda and Malaysia posts, /clinic-setup-cost-in-india/ and /healthcare-startup-in-kenya/). The audit''s suggested meta ("licences, setup costs and software") was not used because it is a group of three.'
  - 'Audit 2026-09-27: the Ethiopia card description changed from "Ministry of Health registration" to "The clinic licence", because /clinic-in-ethiopia/ no longer sends a private clinic to the federal Ministry of Health: the Ministry''s regulatory office licenses the health institutions under the federal government and supports the regional health regulatory bodies (https://www.moh.gov.et/directorates/Health_and_Health_Related_Institutions_Regulatory, fetched 2026-09-27).'
