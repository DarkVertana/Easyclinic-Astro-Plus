faqHeading: Questions clinics ask when comparing software
faq:
  - question: Why should I trust a comparison that EasyClinic publishes?
    answer: >-
      You should check it rather than trust it, and the pages are written so that you can: each one says
      EasyClinic publishes it, and gives the source and the date for every fact it states about another
      product. The India page names EasyClinic its pick for some clinics and says so plainly. The country pages
      outside India rank the competing systems and leave EasyClinic unranked, and each gives its reason.
  - question: Does EasyClinic ever say another product is the better choice?
    answer: >-
      Yes, each of the nine comparison pages names clinics for which another product fits better, and several
      of those verdicts turn on what EasyClinic does not do. EasyClinic does not run fully offline today, so a
      clinic whose internet drops during OPD hours may be better served elsewhere, and it runs the outpatient
      side of a facility, so a hospital that needs software for its inpatient wards should look at other
      products. On every country page outside India, another system ranks first.
  - question: Is EasyClinic the cheapest option?
    answer: >-
      No, eight of the nine comparison pages name at least one product with a lower published price in the
      same currency, or with no licence fee at all. On the UAE page the other prices are in dirhams and
      EasyClinic's only in US dollars, because its dirham price is not yet published, so convert them before
      you compare. EasyClinic charges per doctor per month, from
      {price:inr.professional.annual} in India or {price:usd.professional.annual} in US dollars on Professional
      billed annually, with a reception login included. Vendors count their prices in different ways, so use
      each page to work out the yearly total for your own number of doctors before you compare.
  - question: How current are the facts about other products?
    answer: >-
      Each comparison page lists its sources with the date we read each one, and on all nine that date is 26
      September 2026. That is when we read the source, not when the vendor wrote it, and a vendor can change
      its prices and plans at any time, so open the linked source and ask the vendor for a written quote before
      you sign.
  - question: Can I try EasyClinic before I decide?
    answer: >-
      There is no free trial; instead, the 20-minute demo follows your own clinic's patient flow on a demo
      clinic set up like yours. The head-to-head and country pages give four or five tests to run on every
      product you are considering, so bring your receptionist to the demo and run them there.
  - question: What does switching to EasyClinic take once I have chosen?
    answer: >-
      A clinic can be live in as little as {fact:goLiveDays} days after the demo, and the training takes about
      two hours spread over {fact:trainingDays} days. There is no binding contract to sign. The notice period
      and the data export of the system you are leaving can set the real date, so read your current contract
      before you give notice. The two alternatives pages cover leaving Practo Ray and leaving HealthPlix, and
      the [switching page](/switch/) sets out our steps.

