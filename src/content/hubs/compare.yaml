  - discriminant: prose
    value:
      id: how-we-compare
      heading: How we write a comparison
      body: |-
        **We make one of the products.** EasyClinic publishes these comparisons, and each of the nine says as much. Check our work before you rely on it: each page gives the source and the date for every fact it states about another product, usually the vendor's own website or a review site, and collects those sources in one list near the end.

        **Where a vendor publishes nothing on a point, the page says so.** The cell states that the point is not published, with the date we looked, instead of a guess.

        **Other products win some of the verdicts.** Each comparison page gives a verdict by type of clinic near the top, and every one of them sends some clinics to another product. Two of EasyClinic's own limits decide several of those verdicts: it does not run fully offline today, and it runs the outpatient side of a facility, with inpatient wards out of scope. Every country page except India's ranks the other systems and leaves EasyClinic unranked. The UAE page ranks on the regulators' own lists before anything else and does not state where EasyClinic stands with those regulators. On the Kenya and Nigeria pages EasyClinic misses the price check, because its price in shillings or naira is not yet published, which leaves it level with at least one other system, and we do not rank ourselves within a tie.

        **The verdicts pick EasyClinic for some clinics too.** The India page names it our pick for a clinic of two or more doctors, saying plainly that the choice comes from the company that makes it, and the two alternatives pages say which clinics we would move to EasyClinic, in the same plain terms. The head-to-head pages name the kinds of clinic it suits, and the country pages that leave it unranked still say which clinics it fits, with what to get in writing before you sign.

        **What the pages do not tell you.** None of them scores how fast or easy a product is to use, because the facts about other products come from what is published, and speed and ease show only on a working day. Instead the head-to-head and country pages give four or five tests to run on every product you are considering. Run them on a real clinic day, with your receptionist at the desk. None of the pages states EasyClinic's own standing with a regulator or a national health system, such as ABDM in India or SHA in Kenya, so ask every vendor for that in writing, us included. None gives the number of reviews behind EasyClinic's rating, and the pages for clinics outside India give EasyClinic's price only in US dollars, because no price in the local currency is published yet. The country pages compare a shortlist, not every system on sale in the country.
      width: measure

  - discriminant: proofBlock
    value:
      id: ratings
