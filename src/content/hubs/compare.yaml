the Kenya page ranks EasyClinic first: the prose, FAQ 1, FAQ 2 and editorialPass now say every country page outside India ranks the competing systems, puts another system first and leaves EasyClinic unranked, and the "pick EasyClinic" paragraph cites India, the alternatives pages, the head-to-head pages and the unranked country pages'' verdicts ("suits"/"fits", with the shilling price, the emirate status or the naira price to get in writing before you sign, per the Kenya, UAE and Nigeria verdicts and "Choose EasyClinic if" matrices).'
  - 'Every comparison page sends some clinics to another product, checked 2026-09-26: vs-practo (Ray for three of six clinic types), vs-healthplix (HealthPlix for four of seven), vs-kenyaemr (opening answer and "Choose KenyaEMR if"), Ray alternatives ("Stay on Practo Ray if" and two groups of other vendors), HealthPlix alternatives ("When staying on HealthPlix is the better choice" and three groups), India (verdict and three other groups), Kenya (seven ranked above EasyClinic with Clinicea first; Helium Health for hospitals, KenyaEMR for county facilities, OpenMRS for developers), UAE (seven ranked above EasyClinic), Nigeria (six ranked, CliniquePlus and Hyella where the internet drops). Each gives its verdict by clinic type near the top (openingAnswer or the first section: "Which one fits", "The short answer", "Which alternative fits which clinic", "The verdict by clinic type").'
