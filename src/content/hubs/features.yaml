        - Tabular Rx
        - Medical calculators
        - Side-by-Side past records
        - Upload documents
        - Clinical Assistant / Nurse intake
        - ADR alerts
        - Personalised case sheet
        - Growth & Progress charts
      media:
        kind: screenshot
        src: ../../assets/images/solutions/2_EMR-853x1024.png
        alt: 'The Easy Clinic EMR for specialists: a signed prescription beside a summary of the last visit and the patient facesheet, with a Complete Blood Count trend chart and results table below'
        frame: none

  - discriminant: splitContent
    value:
      id: billing
      heading: Billing, Payments & Reconciliation made really simple
      centerHeading: true
      mediaFirst: true
      featureList: true
      narrowMedia: true
      alignTop: true
      body: |-
        ### One-Click Billing
        Simple one-click billing process, designed for ease of use by receptionists and billing clerks. Invoices are ready in less than 10 seconds.

        ### Effortless Payment Processing
        Seamlessly manage online and offline payments with immediate balance visibility and payment suggestions at a click.

        ### Flexible Payment Options
        Offers flexibility in handling part payments, advance payments, refunds, and invoice voiding with proper authorization, as well as payment amortisation for package treatments.

        ### Service List with Flexible pricing
        Effortlessly manage billing services and items with the ability to adjust prices, offering variable pricing flexibility without the need to regenerate entire billing records.

        ### Automated Taxable Item Management
        Utilises a custom tax definition module for automatic management of taxable versus non-taxable items, simplifying tax-related processes.

        ### Comprehensive Financial Reporting
        Access detailed financial reports in various formats for daily, weekly, monthly, and quarterly book balancing and profit & loss analysis.

        ### Digital Integration
        Integrated with WhatsApp, SMS, and Email to digitally send payment receipts and invoices to patients.

        ### Customizable Billing Templates
        Personalise billing templates to fit the unique needs of your practice, enhancing the professional appearance of your invoices and receipts.
      chipsLabel: And more...
      chips:
        - Quick Bill - 1 Click
        - Service List
        - Multi Level Price List
        - Discount Authorisation
        - Taxable & Non Taxable Items
        - Profit & Loss Analysis
      media:
        kind: screenshot
        src: ../../assets/images/solutions/Invoice_Feature_01.png
        alt: 'Easy Clinic billing: a list of invoices with their status, an invoice with its items and totals, revenue by day, an invoice balance with a registered payment, and a commercial invoice ready to print, email or send by WhatsApp or SMS'
        frame: none

  - discriminant: splitContent
    value:
      id: financial-accounting
      heading: Advanced Financial accounting
      centerHeading: true
      featureList: true
      narrowMedia: true
      alignTop: true
      body: |-
        ### Robust Security Controls
        Ensures comprehensive security measures to prevent fraudulent transactions and unauthorised discounts, safeguarding financial integrity.

        ### Third-Party Payor Management
        Efficiently manage dealings with insurance companies, corporate tie-ups, TPAs, and e-claiming processes for streamlined financial operations.

        ### Customizable Billing Workflows
        Create or modify workflows to centralise and ensure accuracy in billing for various services like consultations, pharmacy, lab tests, procedures, vaccinations, and teleconsultations.

        ### Dynamic Price List Module
        Advanced price list module enables management of multiple price lists based on payor, location, customer type, clinician, and visit type, with automated price selection to eliminate manual input errors.

        ### Detailed Till Management
        Comprehensive till management for balancing various payment modes such as cash, credit, and online payments, complete with a detailed audit trail for transaction accountability.

        ### Seamless Integration with Financial Software
        Offers integration capabilities with third-party financial software solutions, enhancing the efficiency of your financial ecosystem.
