  - discriminant: splitContent
    value:
      id: inventory
      heading: Efficient Inventory management
      centerHeading: true
      featureList: true
      narrowMedia: true
      mediaTop: true
      alignTop: true
      body: |-
        ### Comprehensive Inventory Management
        Manages products, services, packages, and consumables with multi-level categorisation and custom fields.

        ### Seamless EMR Integration
        Integrates smoothly from EMR prescription to billing and pharmacy dispensing, enhancing workflow efficiency.

        ### Stock Availability in Real Time
        Offers doctors a real-time view of stock availability at the time of prescribing including options to search for alternatives.

        ### Detailed Unit of Measure (UOM) Capabilities
        Allows for defining multiple units or pack sizes for each product, tailored for each transaction type, whether for purchase or sale. This feature brings in versatility and precision in inventory management.

        ### Automatic Deduction of Consumables
        Consumables or non-billables that are part of a service, package or product are automatically adjusted, maintaining accurate stock levels.

        ### AI-Assisted Reorder Management
        AI assistant helps define reorder levels and quantities based on past trends and lead times, optimising stock management.

        ### Powerful Price List Management
        Manages unique price lists for different payors, patient types, or locations without manual input, minimising errors.

        ### Automatic Tracking with Alerts
        Tracks drugs, supplies, and equipment in real time, with alerts for low supply levels, expiration dates, and reorder times.

        ### Custom Package Treatments
        Allows creation of bespoke package treatments with multiple items, billable in one visit or across multiple visits.

        ### Barcode Support for Efficiency
        Supports barcodes to expedite inventory transactions, including scanning vendor barcodes or generating custom ones.

        ### Role-Based Access Control
        Ensures fine-grained access control based on user roles, coupled with a complete transaction audit for security.

        ### Bulk Inventory Upload
        Facilitates uploading or adjusting inventory in bulk via file upload for streamlined management.

        ### Advanced Inventory Reporting and Dashboard
        Provides a comprehensive view of stock movement, current stock levels, cost of goods sold, and analysis of fast vs slow-moving items, seasonal trends, etc., through a detailed reporting and dashboard module.
      chipsLabel: And more...
      chips:
