sections:
  - discriminant: hubGrid
    value:
      id: modules
      heading: Twelve modules, grouped the way a clinic runs
      intro: >-
        The front desk, the chart, the money and growth. Every module writes to the same patient record,
        so the name typed at reception is the name on the bill and on the claim.
      columns: 3
      layout: panels
      groups:
        - title: Front desk
          items:
            - href: /features/appointment-scheduling/
              label: Walk-ins and booked slots on one calendar
              description: The desk works from one list for the whole day, and reminders reach patients by SMS or email without a phone call.
              icon: calendar-clock
            - href: /features/whatsapp/
              label: Reminders and prescriptions sent on WhatsApp by the software
              description: Reminders, prescriptions, reports and feedback requests go out on approved templates, so nobody at the desk uses a personal phone.
              icon: message-circle
            - href: /features/telehealth/
              label: Video consults that end with the prescription in the chart
              description: The patient pays before the call, and the video visit sits on the same record as every clinic visit.
              icon: video
        - title: Chart
          items:
            - href: /features/emr/
              label: Thirty-second prescriptions with drug-interaction checks
              description: The note is finished when the visit ends, and earlier visits and lab reports are on the same record.
              icon: notebook-pen
            - href: /features/lab/
              label: Lab orders from the chart, results back into the record
              description: An abnormal result comes back flagged on the chart the doctor already has open, and the report can go to the patient on WhatsApp.
              icon: flask-conical
            - href: /features/pharmacy-and-inventory/
              label: Dispensing from the prescription, with batch and expiry tracked
              description: Stock falls as each prescription is dispensed, so you reorder before a medicine runs out.
              icon: pill
        - title: Money
          items:
            - href: /features/billing/
              label: Invoices that build themselves from the consult
              description: Each order in the chart lands on the bill, so the till closes clean at the end of the day.
              icon: receipt
            - href: /features/insurance-claims/
              label: Coverage checked at registration, before the claim is built
              description: The payer's price list applies at the desk, and each claim is reconciled when the payer's money arrives.
              icon: shield-check
            - href: /features/revenue-management/
              label: Unbilled visits and denied claims, found before month end
              description: The owner sees work that was done but never billed, and where the cash drawer and the bills disagree.
              icon: trending-up
        - title: Growth
          items:
            - href: /features/patient-engagement/
              label: Recall messages and a patient app that write back to the chart
              description: Patients book and read their reports in the app, and a recall goes out when their review is due.
              icon: heart-handshake
            - href: /features/reports-and-dashboards/
              label: The owner's morning view of every branch
              description: Revenue and claim status on one screen, which you can check before the first patient walks in.
              icon: chart-column
            - href: /features/multi-location/
              label: One login for every branch, with central price lists
              description: Head office sets prices and SOPs once, and each branch's numbers sit side by side.
              icon: network

  - discriminant: planMatrix
    value:
      id: plans
      heading: What each plan includes
      open: true
      wideIntro: true
      intro: >-
        Professional is {price:usd.professional.annual} and Premium is {price:usd.premium.annual} per
        doctor per month, billed annually, and Enterprise is priced on a quote. Pharmacy, lab
        management, insurance claims and integrations come with Enterprise, and on Professional or
        Premium you can add them one at a time. Prices in rupees, and the quarterly prices, are on the
        [pricing page](/pricing/).

  - discriminant: splitContent
    value:
      id: emr
      heading: Electronic Medical Records (EMR) which is flexible
      headingAccent: flexible
      centerHeading: true
      mediaFirst: true
      featureList: true
      narrowMedia: true
      alignTop: true
      body: |-
        ### 30 Second Prescription
        Generate detailed prescriptions in just 30 seconds and provide instantly in any language via print or WhatsApp, SMS, or Email.

        ### Customised EMR
        Tailored EMR to suit every doctor's specialty, workflow, and preferences, ensuring a personalised experience.

        ### AI-Powered Assistance
        With an AI assistant, complete prescriptions in three clicks, saving time on your documentation processes.

        ### Visual Health Trend Analysis
        Display vitals, lab reports, and clinical parameters as charts and graphs for easy visualisation of patient's health trends.

        ### Efficient Patient Summaries
        Quick access to auto-generated patient summary and facesheet for a comprehensive review of case histories, saving valuable time and presenting important data intelligently.

        ### Efficient Point and Click Input
        Utilises a simple point-and-click UI for recording chief complaints, medical history, vitals, and more. Includes customizable examination forms, auto-complete notes, diagnosis, medications, investigations, referral, follow-up, and patient guidelines. Offers the flexibility to choose specific controls without navigating through lengthy screens.

        ### Comprehensive Medical History Record
        Record the Medical History of a patient in your own custom intake form. It can be as detailed or short as you want. Details of chronic illnesses, family, social and obs-gynae history, substance use, alternative therapies, COVID history, and immunizations can be recorded. These details are then displayed as part of the patient's face sheet, saving a lot of time in subsequent visits.
      chipsLabel: And more...
      chips:
        - Multilingual Prescription
        - Custom examination forms
        - Image upload
        - Document upload
        - Referral management
        - Automated follow up
        - Drug interaction check
        - Vitals & Lab charts
        - Confidential notes
        - Patient education
        - Collaborative case notes
        - Triage
        - Personalised Print formats
      link:
        label: Click to read EMR features in detail
        href: /features/emr/
      media:
        kind: screenshot
        src: ../../assets/images/solutions/1_EMR.png
        alt: 'The Easy Clinic EMR: chief complaints, vitals, clinical notes, diagnosis and medications on one screen, with a prescription language picker, a dosage selector and a fasting blood sugar trend chart'
        frame: none

