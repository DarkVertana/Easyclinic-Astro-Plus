editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The plan boundaries as EasyClinic sells them (WhatsApp and video consults from Premium, pharmacy and
    lab management with Enterprise or as add-ons), the Kenyan MOH 705 and DHIS2 reports, and the plain
    admissions that EasyClinic runs no inpatient wards and keeps no donor records come from how the
    product is actually sold and used.
  readsMachineWritten: >-
    The twelve module cards all follow one pattern, a benefit label and one outcome line, which can read
    as a template to a doctor, and the page has no named person or measured outcome, so it leans on plan
    facts and two ratings.

notes:
  - 'Spec 5.4 promise and sections; spec 4.1 has no /features/ row, so the head keyword "clinic management software features" comes from the page brief. Title is 47 characters and carries the head keyword; the brief example "Clinic Software Features: Every EasyClinic Module" (49) is the alternative if the editor prefers it.'
  - 'Spec 5.4 section 2 asks for a ModuleGrid with a screenshot per module. The hub uses hubGrid (the brief), with no media, because screenshots do not exist yet (page-writing rules). Add one captioned screenshot per module (spec 12 list) when they arrive; the journey steps take the same eight screens as the home page.'
  - 'Hub grid groups follow src/data/nav.yaml exactly (Front desk, Chart, Money, Growth). Labels are benefit-and-mechanism names (spec 5.4); descriptions render as plain text, so they carry no markdown (tokens still resolve, as the registry expands them in every string).'
  - 'Left out for lack of a confirmed fact: the measured no-show reduction (facts noShowReduction is null), so no card says reminders "cut no-shows" as spec 5.4 suggests; minutes per note with Cura AI; the eight morning KPIs named as "all live" (spec 5.11); GST, VAT and eTIMS invoice formats (every tax regulator state is null); any integration by name or status (integration states unknown).'
  - 'Proof: spec 5.4 asks for one testimonial per pillar; the brief says no testimonials, so the proof block is the Capterra and Google rating badges. Both lack review counts (facts capterraReviews and googleReviews are null) and the Google badge has no public review URL. Add both when known. Badge ratings use the {fact:capterraRating} and {fact:googleRating} tokens, which the registry resolves before rendering.'
  - 'CTAs: spec 5.4 asks for "Watch a 6-minute product tour" and "Book a demo". The tour does not exist yet, so the secondary CTA is "See pricing". Switch it to "See the product in 6 minutes" when the tour ships (spec 12).'
  - 'FAQ follows spec 5.4 item 5, split into six: EMR customisation; buying one module (add-ons per plans.yaml); pharmacy, inventory and lab by plan; telehealth and the patient app by plan; inpatient wards (spec 5.8 scope); fundraising CRM (spec 5.10). Open to-dos: how long a custom prescription template takes and who builds it (spec 6.4 question); add-on prices in every currency; which inpatient systems EasyClinic has run beside and what they exchange; whether nursing homes with beds are in scope (spec 5.8 says nursing homes are covered, and inpatient is out of scope).'
  - 'Integrations prose names categories only (the spec 5.17 directory categories), never a status (page-writing rules), and the custom-connection paragraph follows the plans.yaml integrations add-on. /integrations/ has no content entry yet, so in production its link renders as plain text until that page publishes. When src/data/integrations has states and dates, the hub can name the live ones per country.'
  - 'Secondary keywords exclude "practice management software" (owned by /, spec 4.1) and "EMR software" terms (owned by /features/emr/), per spec 2.1 (one page, one query cluster).'
  - 'Sticky sub-navigation (section 11 UX 6) can use the section ids: patient-journey, modules, plans, integrations, ratings.'
  - 'Author is Subhashish Saha, Head of customer success, per the page-writing rules. Spec 2.7 prefers the product lead for product pages; switch if one is named.'
  - 'Fact check 2026-09-26 (live pages fetched with curl): the journey step "Report" and the reports card said the owner sees revenue, collections (against billing), no-shows and pending claims on one dashboard, by doctor or by branch, and the card label said "every doctor and branch". No live product page or confirmed fact states collections, no-shows or pending claims as report figures, or any per-doctor split (only the /healthcare-dashboard-software/ blog lists them, as generic KPI advice and an anonymous case study). Both now say only what live /kenyademo/ states ("One clinic or fifteen ... Revenue, stock, claims, follow-ups. One screen ... before the first patient walks in"), with claim status as live /features/ names it ("Claim Status Tracking Dashboard"), matching /features/reports-and-dashboards/.'
