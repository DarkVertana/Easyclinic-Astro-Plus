  - discriminant: splitContent
    value:
      id: advanced-emr
      heading: Advanced EMR for specialists
      centerHeading: true
      featureList: true
      narrowMedia: true
      alignTop: true
      body: |-
        ### Specialty-Oriented Design
        Tailored for specialists, super-specialists, and clinic chains, addressing diverse healthcare needs. [Choose your specialty](/specialties/) for a focussed read.

        ### AI-Driven Diagnostic Support
        Intelligent AI assistance for differential diagnosis and warning against adverse drug events, crucial for patients with multiple chronic conditions.

        ### Customizable Template and Form Builder
        Easily match any paper forms with our flexible template builder, ensuring a smooth digital transition.

        ### Comprehensive Patient Data Visualization
        Single-screen access to longitudinal patient visit data, enhancing the efficiency of patient care.

        ### Efficient Access to Common Resources
        Quick access to frequently used medications, investigations, and clinical tools like guidelines, checklists, and reminders.

        ### Seamless Care Team Collaboration
        Facilitates effective communication and coordination between nurses, doctors, and other caregivers for integrated patient care.
      chipsLabel: And more...
