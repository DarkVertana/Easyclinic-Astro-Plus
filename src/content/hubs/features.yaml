faq:
  - question: Can I change the EMR to fit the way I write notes?
    answer: >-
      Yes, every plan lets you change the EMR through the product's own customisation options at no
      extra charge, and Premium and Enterprise add specialty EMR templates and your own clinical forms
      and print layouts. Professional has the same EMR and e-prescriptions without those two. A feature
      built only for your clinic is custom development, scoped per project: it comes with Enterprise and
      is an add-on on Professional and Premium.
  - question: Can I buy a single module, such as pharmacy, without moving to Enterprise?
    answer: >-
      Yes, for four modules: pharmacy and inventory, lab management, insurance and payer claims, and
      integrations with custom development can each be added to Professional or Premium on its own.
      Enterprise includes all four. The other modules come with a plan rather than one at a time:
      WhatsApp messages, video consultations, lab reports in the chart and more than one location start
      on Premium, and the patient portal and app come only with Enterprise.
  - question: Which plan includes pharmacy and lab management?
    answer: >-
      Enterprise includes both, along with inventory and stock transfers between branches. On
      Professional or Premium you can add pharmacy and inventory, or lab management, one at
      a time. Premium already brings lab reports into the patient's chart, and lab management adds
      orders from the chart and sample tracking.
  - question: Are video consultations and the patient app included?
    answer: >-
      Video consultations are included from Premium, at {price:usd.premium.annual} per doctor per month
      billed annually, and the patient portal and app come with Enterprise. On Professional, patients
      hear from the clinic through SMS and email reminders, and WhatsApp messages start on Premium.
  - question: Is Easy Clinic a full hospital system with inpatient wards?
    answer: >-
      No, Easy Clinic does not run inpatient wards or operating theatres. It covers outpatient care, from
      a one-doctor clinic to a hospital OPD and day care, so a hospital that admits patients needs a
      separate system for its wards and can run Easy Clinic in its OPD.
  - question: Does Easy Clinic include a fundraising or donor CRM for NGO clinics?
    answer: >-
      No, Easy Clinic has no fundraising or donor CRM, so donor records and grant tracking stay in the
      tool you use for them now. What it gives an NGO or mission clinic is the patient record and the
      reports built from it, such as the visits seen and the stock used each month. Clinics in Kenya
      also get the MOH 705 and DHIS2 reports from the same records.

