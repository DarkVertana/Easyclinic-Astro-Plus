  - discriminant: splitContent
    value:
      id: pharmacy
      heading: Integrated Pharmacy & Simplified Dispensing
      centerHeading: true
      featureList: true
      narrowMedia: true
      alignTop: true
      body: |-
        ### Seamless Prescription Transfer
        Enables automatic transfer of prescriptions from doctors to the pharmacy for quick and accurate dispensing.

        ### Refill Order Tracking and Reminders
        Tracks refill orders for patient's subsequent visits and sends automated reminders to patients for refill collection.

        ### Label Printing and Regulatory Compliance
        Provides options to print labels and other necessary regulatory forms, ensuring compliance with healthcare regulations.

        ### Expiry Management
        Features expiry reports and warnings at the time of sale, with automatic prioritisation of product batches nearing expiry.

        ### Pre-Visit Price Look-up and Quoting
        Allows pharmacists to look up prices and details of all pharmacy items and generate quotes for patients prior to their visit.

        ### Controlled Medication Alerts
        Includes warnings and checks for dispensing regulated or controlled medications, enhancing patient safety.

        ### OTC Product
        Provides the ability to add over-the-counter (OTC) products at the time of dispensing, enhancing the range of services offered by the pharmacy.

        ### Stand-Alone Dispensing and Refill Collection
        The pharmacy module can function independently for dispensing or refill collection, without the need to go through the EMR management or appointment queue. This facilitates quicker service for patients requiring only pharmacy services.
