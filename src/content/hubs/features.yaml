  - discriminant: splitContent
    value:
      id: logistics
      heading: Streamlined Logistics and Stock Movement
      centerHeading: true
      mediaFirst: true
      featureList: true
      narrowMedia: true
      alignTop: true
      body: |-
        ### Comprehensive Logistics Processes
        Manages end-to-end logistics including requisition requests, purchase orders, goods receipt, returns, stock transfers, stocktaking, and stock adjustments.

        ### Supplier and Vendor Management
        Offers the ability to manage suppliers and vendors, with integration options for real-time checks on lead time, stock availability, and pricing.

        ### Efficient Requisition and Purchase Orders
        Generate requisitions or purchase orders with a single click, incorporating checks on reorder levels, preferred vendors, purchase prices, and lead times.

        ### Advanced Goods Receipt Module
        Enables fast goods intake using barcodes or file import and supports split orders, free samples, shortfalls, etc.

        ### Streamlined Stock Transfers
        Easily transfer stock between locations or from a central warehouse to different clinics, with complete tracking and audit logs for goods sent, in transit, and received.

        ### Stock take Flexibility
        Conduct quick or comprehensive stock counts with options to iterate counts before finalising any stock variance.

        ### Stock Adjustment with Authorisation
        Perform stock adjustments for shortfalls, excess, expired or damaged products, with proper authorisation checks and audit logs.

        ### Fool-Proof Workflow Engine for Internal Control
        Easy Clinic is equipped with a robust workflow engine that mandates the review and verification of all inventory movements and transactions. This system allows for multiple levels of checks as needed, along with a customizable approval step.
