faq:
  - question: Which plan includes specialty templates?
    answer: Specialty EMR templates come with the Premium plan, at {price:usd.premium.annual} per doctor per month billed annually, along with your own clinical forms and print layouts.
  - question: Can I build my own forms for my specialty?
    answer: Yes, Premium includes your own clinical forms and print layouts, and the customisation options in the product come without extra charges.
  - question: Can a polyclinic use different templates for each specialist?
    answer: Yes, each specialist can work in their own templates while the whole clinic shares one patient record, which is how polyclinics run on EasyClinic.
  - question: Do specialty packages such as treatment courses work in billing?
    answer: Yes, Premium includes package treatments, so a course of sessions or a treatment plan is billed as one package rather than visit by visit.
  - question: My specialty is not on the list. Can EasyClinic still work for my clinic?
    answer: Yes, the EMR and billing work for any outpatient specialty, and the form below books a demo set up around the way your clinic practises.
