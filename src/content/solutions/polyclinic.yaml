        - label: Google
          rating: '{fact:googleRating}'

faqHeading: Questions polyclinic owners ask
faq:
  - question: Can each specialist keep their own way of writing notes?
    answer: >-
      Yes, on Premium: specialists write in specialty EMR templates on the same patient chart, and your
      clinic's own clinical forms and print layouts are part of the plan, so a specialty without a
      ready template can use a form of its own. Changes made with the product's own customisation options
      cost nothing extra, and a feature built only for your clinic is scoped per project as custom
      development. Professional does not include specialty templates.
  - question: Do the pharmacy and the lab work from the same record?
    answer: >-
      The lab does on Premium, where lab reports come into the patient's chart, and the pharmacy does
      once you add the pharmacy module, which lets the pharmacist dispense from the doctor's prescription
      and track batch and expiry. Pharmacy and full lab management, with orders from the chart and sample
      tracking, are both included in Enterprise.
  - question: Who sees what in the patient record?
    answer: >-
      Each person logs in as themselves, and the role on their login decides which screens they can open.
      The front desk works on the reception login, which is included in the price and cannot open the EMR
      or issue a prescription, so the receptionist books and bills without reading the clinical notes.
  - question: How does a referral from one department to another work?
    answer: >-
      The referring doctor's notes stay on the one patient chart, so when the front desk books the patient
      with the second specialist, that specialist opens a chart that already holds the first visit's notes
      and prescriptions. Nobody copies a letter across or asks the patient to bring the file, and on
      Premium any lab reports are there too.
  - question: Can one front desk run the appointments for every doctor?
    answer: >-
      Yes. The front desk books every doctor and every shared room from one resource calendar, and takes
      payments for all of them on the reception login, which is included in the price.
  - question: How is a polyclinic priced?
    answer: >-
      Per doctor: Premium costs {price:usd.premium.annual} per doctor per month billed annually or
      {price:usd.premium.quarterly} billed quarterly, and in India {price:inr.premium.annual} or
      {price:inr.premium.quarterly}. A five-doctor polyclinic pays for five licences, and the reception
      login is included. There is no setup fee and no contract. Enterprise, which includes pharmacy and
      lab management, is priced on a quote.
  - question: What happens when we open a second branch?
    answer: >-
      Premium already covers more than one location, so a second branch does not mean a new plan or a
      second system. Enterprise adds central control of every location and clinical SOP tracking across
      branches, and is priced on a quote.

