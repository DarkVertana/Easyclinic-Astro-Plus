  - discriminant: splitContent
    value:
      id: specialty-emr
      tone: wash
      heading: An EMR for every specialty
      centerHeading: true
      compact: true
      alignTop: true
      body: |-
        ### Specialty templates, one chart
        On Premium, each specialist writes in a specialty EMR template, and every template saves to the same patient history.

        ### Your own forms and print layouts
        On Premium, a department without a ready template can use a clinical form of its own, and prints come out the way you set them.

        ### Referrals without a letter
        The second specialist opens a chart that already holds the first visit's notes and prescriptions, so the patient does not repeat her history.

        ### Shared rooms on one calendar
        Each doctor and each shared room has a column of its own, so the front desk sees a taken procedure room before offering the slot.

        ### Dispensing from the prescription
        With the pharmacy module, the pharmacist works from the doctor's prescription and tracks batch and expiry. Included in Enterprise, or added to Premium.

        ### One counter for every specialist
        Chart orders become invoice lines, part payments are recorded against their bill, and billing can be kept department-wise.
      chips:
        - Specialty EMR templates
        - Your own clinical forms
        - Your own print layouts
        - Lab reports in the chart
        - Resource calendar
        - Role-based logins
        - Department-wise billing
        - Package treatments
      media:
        kind: screenshot
        src: ../../assets/images/solutions/2_EMR.png
        alt: 'The Easy Clinic EMR: a signed prescription beside a summary of the last visit and the patient facesheet, with a Complete Blood Count trend chart below'
        frame: none

