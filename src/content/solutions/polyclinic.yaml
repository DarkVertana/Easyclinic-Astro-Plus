sections:
  - discriminant: dayTimeline
    value:
      id: a-tuesday
      heading: A Tuesday at a polyclinic, with and without Easy Clinic
      intro: >-
        Same building, same doctors, same patients. What changes is whether the chart, the rooms and the
        bill follow the patient from one specialist to the next.
      entries:
        - time: '09:00'
          title: One desk, several doctors
          before: >-
            Each consultant keeps a diary. The receptionist flicks between them to find the physician a
            free slot, and nobody can see who has the procedure room at 3pm.
          after: >-
            The front desk books every doctor and every shared room from one resource calendar, each in its
            own column, and sees the procedure room is taken at 3pm before it offers the slot to anyone else.
          href: /features/appointment-scheduling/
        - time: '11:30'
          title: A referral down the corridor
          before: >-
            The physician sends the patient to the skin specialist with a slip of paper. The patient tells
            her history again, and the second doctor prescribes without knowing what the first one gave.
          after: >-
            The physician's notes and prescriptions stay on the one patient chart, so the skin specialist
            opens the visit with them already there. Nobody copies a letter across, and on Premium any lab
            reports are in the same chart.
          href: /features/emr/
        - time: '12:15'
          title: At the pharmacy counter
          before: >-
            The patient reaches the counter with a slip the pharmacist has to read twice, and the stock book
            will be brought up to date on Saturday, if at all.
          after: >-
            With the pharmacy module, the pharmacist dispenses from the prescription on screen and tracks
            batch and expiry, so the reorder goes out before the shelf is empty. Pharmacy is included in
            Enterprise, or added to Premium as a module.
          href: /features/pharmacy-and-inventory/
        - time: '18:30'
          title: One counter closes
          before: >-
            The patient who saw the physician and then the dentist paid at two counters, and a part payment
            from the morning sits on a scrap of paper that nobody can match to a bill.
          after: >-
            Every specialist's patients paid at one front desk, orders written in the chart became lines on
            the invoice, and each part payment was recorded against its bill. Billing can be kept
            department-wise, so each specialty's bills sit under its own department.
          href: /features/billing/

  - discriminant: painBlocks
    value:
      id: where-it-breaks
      heading: Where group practices lose the thread
      intro: >-
        In a polyclinic, the time goes missing between the doctors: in the chart one specialist cannot
        see, and in the room two of them booked for the same hour.
      items:
        - heading: Notes stay with each specialist
          body: >-
            The gynaecologist keeps her notes in one system and the skin specialist writes on paper. A patient
            who sees both tells her history twice, and the second doctor prescribes without the first one's
            list.
          fix: >-
            Every specialist writes on one patient chart, so the second doctor opens the visit with the first
            doctor's notes and prescriptions already there. On Premium, lab reports come into the same chart.
          href: /features/emr/
          linkLabel: Read how the chart works
        - heading: The shared room is double-booked
          body: >-
            Two consultants share the procedure room on Thursday afternoons, and each keeps a diary. At 3pm both
            patients arrive for the same room, and the front desk finds out in the corridor.
          fix: >-
            One resource calendar shows doctors and shared rooms side by side in columns. The front desk sees
            that the procedure room is taken at 3pm before it offers the slot to anyone else.
          href: /features/appointment-scheduling/
          linkLabel: Read how the calendar works
        - heading: The pharmacy lags behind the visit
          body: >-
            The patient reaches the counter with a slip the pharmacist has to read twice, and the stock book is
            brought up to date on Saturday, if at all.
          fix: >-
            With the pharmacy module, the pharmacist dispenses from the prescription on screen and tracks batch
            and expiry. Pharmacy is included in Enterprise, or added to Premium as a module.
          href: /features/pharmacy-and-inventory/
          linkLabel: Read how dispensing works

