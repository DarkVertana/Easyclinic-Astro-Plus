  - discriminant: prose
    value:
      id: staff-access
      width: wide
      heading: Departments and staff access
      body: |-
        A polyclinic is several specialists sharing one front desk. Every specialist writes on the same patient chart, so the second doctor opens the visit with the first doctor's notes already there, and on Premium each specialty keeps its own EMR templates.

        Each person logs in as themselves, and the role on that login decides what they can open. Doctors are licensed one by one, and the front desk works on a reception login that comes with the plan.

        Billing can be kept department-wise, so each specialty's bills sit under its own department, and the front desk books every doctor and shared room from one calendar.

