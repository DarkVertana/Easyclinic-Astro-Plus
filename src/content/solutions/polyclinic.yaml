sections:
  - discriminant: painBlocks
    value:
      id: where-it-breaks
      heading: Where group practices lose the thread
      intro: >-
        In a polyclinic, the time goes missing between the doctors: in the chart one specialist cannot
        see, and in the room two of them booked for the same hour.
      items:
        - heading: Each specialist keeps their own notes
          body: >-
            The gynaecologist keeps her notes in one system and the skin specialist writes on paper, and
            neither has seen the other's. A patient who sees two of them in the same
            month tells her history twice, and the second doctor prescribes without knowing what the first
            one gave.
          fix: >-
            Every specialist writes on one patient chart, so the second doctor opens the visit with the
            first doctor's notes and prescriptions already there. On Premium, lab reports come into the
            same chart.
          href: /features/emr/
          linkLabel: Read how the chart works
        - heading: The shared room gets booked twice
          body: >-
            Two consultants share the procedure room on Thursday afternoons, and each keeps a diary. At 3pm
            both patients arrive for the same room, one of them after fasting since morning, and the front
            desk finds out when the second one sits down in the corridor.
          fix: >-
            One resource calendar shows doctors and shared rooms side by side in columns. The front desk
            sees that the procedure room is taken at 3pm before it offers the slot to anyone else.
          href: /features/appointment-scheduling/
          linkLabel: Read how the calendar works
        - heading: The pharmacy lags behind the visit
          body: >-
            The patient reaches the counter with a slip the pharmacist has to read twice, and the stock book
            is brought up to date on Saturday, if at all. On Tuesday the strip the doctor has just prescribed
            turns out to be gone.
          fix: >-
            With the pharmacy module, the pharmacist dispenses from the prescription on screen and tracks
            batch and expiry, so the reorder goes out before the shelf is empty. Pharmacy is included in
            Enterprise, or added to Premium as a module.
          href: /features/pharmacy-and-inventory/
          linkLabel: Read how dispensing works

  - discriminant: featureRows
    value:
      id: one-record
      heading: One record, many workflows
      intro: >-
        Each specialty keeps its own way of writing, on the same chart as everyone else. The patient has
        one history, whichever specialists they see.
      items:
        - heading: Specialty templates on one chart
          plan: premium
          body: >-
            On Premium, specialists write in specialty EMR templates, and every template writes to the same
            patient chart. The dermatologist's notes and the physician's prescriptions sit in one history,
            and the next doctor opens it before the patient sits down.
        - heading: Your own forms and print layouts
          plan: premium
          body: >-
            Where a department needs a form of its own, Premium includes your clinic's own clinical forms
            and print layouts, so the prescription and the report come out the way your clinic sets them.
            Changes made with the product's own customisation options carry no charge.
        - heading: Lab reports in the same chart
          plan: premium
          body: >-
            Lab reports come into the patient's chart on Premium, so every specialist who opens the chart
            reads the same result. Full lab management, with orders from the chart and sample tracking, is
            part of Enterprise or a module you add to Premium.
        - heading: Doctors and shared rooms on one calendar
          body: >-
            The resource calendar puts each doctor and each shared room in its own column. Whoever books the
            procedure room sees every slot already taken in it, on the same screen as the doctors' lists.

  - discriminant: rolesMatrix
    value:
      id: who-sees-what
      heading: Who sees what
      intro: >-
        Each person in the clinic logs in as themselves, and the role on that login decides what they can
        open. Doctors are licensed one by one, and the front desk works on a reception login that comes
        with the plan.
      roles:
        - Owner
        - Doctor
        - Nurse
        - Reception
        - Pharmacist
        - Accountant
      rows:
        - permission: Has a login of their own
          cells:
            - true
            - 'Yes, one licence each'
            - true
            - 'Yes, included in the price'
            - true
            - true
        - permission: Issues prescriptions
          cells:
            - 'Only if also a doctor'
            - true
            - false
            - false
            - false
            - false
      note: >-
        The reception login is included in every plan, and it cannot open the EMR or issue a
        prescription. Prescriptions are written on a doctor's login.

  - discriminant: prose
    value:
      id: billing
      heading: Shared billing and package treatments
      body: |
        One front desk takes payments for every specialist in the building, so the patient who saw the physician and then the dentist pays at one counter. Orders written in the chart become lines on the invoice, and a part payment is recorded against the bill it belongs to.

        On Premium the receipt can go to the patient on WhatsApp, and the bill can be paid online. Billing can be kept department-wise, so each specialty's bills sit under its own department.

        Package treatments come with Premium. A course of treatment spread over several visits, such as a set of physiotherapy sessions or a dental treatment plan, is billed as one package instead of visit by visit.
      aside: |
        **On Premium**

        - Package treatments
        - Online payments
        - Receipts and reminders on WhatsApp
        - Lab reports in the chart

  - discriminant: splitTable
    value:
      id: plans
      heading: What Premium covers, and what a polyclinic adds
      intro: >-
        Premium is the plan for group practices that share one front door. The bigger modules come with
        Enterprise, or can be added to Premium one at a time when the clinic starts to need them.
      left:
        title: Included in Premium
        items:
          - Specialty EMR templates
          - Your own clinical forms and print layouts
          - Package treatments
          - Lab reports in the chart
          - WhatsApp reminders and messages
          - Online payments
          - More than one location
          - A named account manager
      right:
        title: Added as a module, or included in Enterprise
        items:
          - 'Pharmacy and inventory: dispense from the prescription, with batch and expiry tracked'
          - 'Lab management: orders from the chart and sample tracking'
          - Insurance and payer claims
          - Integrations and custom development
      note: >-
        Enterprise includes all four and adds central control of every location. It is priced on a quote
        for your clinic.

  - discriminant: proofBlock
    value:
      id: ratings
      heading: How clinics rate EasyClinic
      intro: >-
        {fact:retention} of EasyClinic's customers have used it for more than five years. These are its
        public ratings.
