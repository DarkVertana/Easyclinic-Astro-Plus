      width: wide
      heading: Staff and access
      body: |-
        A clinic with one doctor usually runs with a receptionist beside them, and both work on the same patient records. The doctor writes the note and the prescription; the receptionist books patients and takes payments.

        Each member of staff has their own login, and the role decides which screens they see. A reception login comes with every plan, and reception cannot open the EMR or write a prescription.

        Training and support are unlimited on every plan, so a new receptionist can be shown the system after you go live at no extra cost.

