editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The Tuesday timeline and the three pains describe a one-doctor clinic in India as it runs, from the
    receptionist phoning patients over lunch to the dressing that never reaches the receipt book, and the
    quote is Dr T. L. Prabhu's own account of taking Prashanthi Clinic paperless.
  readsMachineWritten: >-
    The before-and-after pairs in the timeline are tidy and parallel and the day-one rows restate
    plans.yaml, and the only measured number on the page is the six months in Dr Prabhu's quote, so the
    read-aloud pass should check the page sounds like a clinic owner talking and not a brochure.

notes:
  - 'Hero screenshot (spec 5.5 item 1: single screen with today''s list, chart and invoice) is left out: no screenshots exist yet. Add heroMedia from the spec 12 Today view and thirty-second prescription captures when they are taken.'
  - 'Spec 5.5 CTA "See the product in 6 minutes" is left out until the tour ships (spec 12, The tour). Add it as the secondary hero CTA then, and link it from the free-trial FAQ.'
  - 'Opening answer changed from spec 5.5: "reminds patients on WhatsApp" is not true at the $79 price, because WhatsApp reminders are Premium only in plans.yaml (Professional has SMS and email). The group of three was also cut. "Raises the bill from the same screen" rests on the spec 5.5 hero (today''s list, chart and invoice on one screen) and the spec 5.11 billing page (invoice from EMR orders).'
  - 'Meta description changed from spec 4.2: "Set up in four days" is the four-day training, not go-live, and "$79 a month" is per doctor and billed annually, hence "from". The spec''s "appointments, prescriptions and billing" group of three became four items. Go-live uses {fact:goLiveDays} in the step list note only.'
  - 'PainBlocks: spec 5.5 asks for a number on each pain ([measured no-show reduction]). No no-show, minutes-per-note or billing-leak figure exists (facts.yaml noShowReduction and minutesPerNote are null), so none is stated. Add the no-show figure to the second pain when it is measured. The intro is the spec 6.3 after-text verbatim.'
  - 'Timeline 09:12 says "about thirty seconds" per spec 2.8, 5.5 and 5.11 (EMR promise), the live /kenyademo/ ("under 30 seconds") and Dr Premanand Raya''s quote ("within a half minute", shortcuts). It is a product claim, not a measured study figure. "Day-end close" and billing from the consult follow the spec 5.11 billing page; no cash or card split is claimed.'
  - 'Cura AI drafting during the consult with review and sign follows spec 4.1 (/ai row), spec 12 (draft SOAP note in a "review and sign" state) and plans.yaml (Cura AI note drafting on Professional).'
  - '"When you grow": a second consulting room is stated only as not changing the plan (pricing is per doctor, and Professional covers one location). Whether Professional schedules rooms separately is not confirmed, so room scheduling is not claimed. Per-location fees and whether a doctor working at two branches needs a second licence are unknown and not stated.'
  - 'Testimonial tl-prabhu has city null; it renders without a city in production. Add the city (spec 5.5 item 6 asks for specialty and city).'
  - 'FAQ left out for lack of a confirmed fact: mobile app for the doctor, e-prescription legality by country, data export format and timing on leaving, refund of unused months on annual billing, and how long a custom prescription layout takes to build. The data answer says only that you can take your data (no format, no ownership wording) and points to the privacy policy (/privacy/) for what EasyClinic may do with it, as /questions-to-ask-your-clinic-emr-software-provider/ does. The setup question was reworded to "Do I need IT staff to set it up?" because who performs setup beyond training and support is not confirmed.'
  - 'Offline FAQ follows the live site ("does not run fully offline today"). The self-hosted option mentioned on the live Kenya listicle is not offered here because it is unconfirmed and not a solo-clinic plan.'
  - 'Step list note: goLiveDays (3, "in as little as 3 days" on /kenyademo/) conflicts with the "2 to 4 week setup" on the live Kenya listicle (facts.yaml note). Typical go-live time, and what makes a clinic slower, are unknown, so the note says only that yours may take longer. Day 3 and day 4 step bodies describe only the session names from the live /pricing/ FAQ.'
  - 'Related links follow spec 5.5 item 9. The buyer''s country page is fixed to India until a geo-selected link exists; /features/billing/ is linked from the timeline, pains and day-one rows.'
