sections:
  - discriminant: painBlocks
    value:
      id: where-opd-breaks
      heading: Where OPD volume breaks software
      intro: >-
        A clinic with two doctors can run on a register and a good receptionist. An OPD where several
        departments share one registration desk and one pharmacy counter cannot.
      items:
        - heading: The front desk sets the pace for the whole OPD
          body: >-
            OPD throughput is decided at the registration counter before any doctor sees a patient. At
            ten in the morning the queue mixes walk-ins with patients who booked and expect to go first.
            Every name typed at the desk is typed again at billing, and insured patients reach the doctor
            before anyone has checked their plan.
          fix: >-
            Walk-ins sit beside booked appointments on one calendar that the desk and the doctors share.
            Reception registers each patient once and checks the insurer or TPA plan before the consult.
            Billing then works from the same record.
          href: /features/appointment-scheduling/
          linkLabel: Appointments and walk-ins
        - heading: The prescription reaches the pharmacy and the lab late
          body: >-
            The patient walks a handwritten prescription to the pharmacy counter, and the pharmacist
            either reads it or phones the consulting room. The lab starts its clock when the paper slip
            arrives, whenever that is, and by the follow-up visit the report is in the patient's bag or
            lost.
          fix: >-
            The pharmacy dispenses from the prescription on its screen, with batch and expiry tracked and
            a reorder point before a medicine runs out. Tests are ordered from the chart and samples
            tracked in the lab, so the result comes back into the record the doctor opens at the
            follow-up.
          href: /features/pharmacy-and-inventory/
          linkLabel: Pharmacy and inventory
        - heading: Claims die after the consult
          body: >-
            The claim is put together at the billing counter, often days later, by someone who was not in
            the consulting room. By then nobody can fix a wrong plan picked at registration or a
            pre-authorisation that was never attached, and the TPA or HMO sends the claim back.
          fix: >-
            The claim starts at registration, when the plan is linked and coverage checked, and the
            prescription and the pre-authorisation add to it on the way. The claim pack is built from the
            visit and the invoice, and reconciliation shows which payer still owes what.
          href: /features/insurance-claims/
          linkLabel: Insurance claims

  - discriminant: flowDiagram
    value:
      id: claims-flow
      heading: From registration to claim submission
      intro: >-
        Each step writes to the same claim, so the billing desk finishes a claim that started at the
        registration counter instead of building one from paper at the end of the week. The payers change
        from country to country and the steps stay the same. The examples below name who pays in each
        country; they are payer examples, not a list of EasyClinic connections.
      steps:
        - label: Register
          body: Reception registers the patient once, and walk-ins and booked patients join the same OPD list.
        - label: Link the plan
          body: The patient's payer is linked to the record at the desk, with that payer's own price list.
          check: Catches the wrong plan
        - label: Check coverage
          body: Coverage is checked while the patient is still at the desk, before the consult.
        - label: Prescribe within formulary
          body: The doctor prescribes and orders tests from the chart against what the plan covers, so an uncovered item is caught in the consulting room instead of at billing.
          check: Catches items the plan does not cover
        - label: Pre-authorise
          body: Where the payer asks for pre-authorisation, it is attached to the claim at this step, not searched for at the billing counter.
          check: Catches a missing pre-authorisation
        - label: Invoice
          body: The invoice builds from what was ordered in the consult, priced from that payer's price list.
        - label: Submit
          body: The claim pack is built from the visit and the invoice, and the billing desk submits it to the payer.
        - label: Reconcile
          body: When the payer pays, the payment is matched against the claim, and the claims dashboard shows where each claim stands.
      examples:
        - country: India
          body: TPAs acting for insurers, and corporate panels where the employer settles the bill.
        - country: Kenya
          body: SHA, and private insurers such as Jubilee, AAR, CIC, Britam and Resolution.
        - country: UAE
          body: >-
            Insurers, which in Dubai receive claims and prior authorisations through DHA eClaimLink, the
            Dubai Health Authority's electronic claims system.
        - country: Nigeria
          body: HMOs, and the NHIA (National Health Insurance Authority).

  - discriminant: prose
    value:
      id: departments
      heading: Departments and staff access
      body: |-
        A hospital OPD is several clinics sharing one registration desk. Every department on EasyClinic writes on the same patient record, so the physician sees what orthopaedics prescribed last month, and a patient sent from one department to another is not registered twice. On Premium and Enterprise each department keeps its own specialty templates.

        Each member of staff has their own login, and the role decides which screens they see. A reception login comes with every plan, and reception cannot open the EMR or write a prescription.

        Enterprise adds workflow rules and central control of every location, for a hospital that runs OPDs in more than one place. It also adds financial accounting and a reporting server with custom analytics.

  - discriminant: scopeBox
    value:
      id: not-in-scope
      heading: What EasyClinic does not run in a hospital
      intro: >-
        EasyClinic stops at the ward door. If your hospital or nursing home admits patients, the inpatient
        side needs its own system, and EasyClinic runs the OPD and day care beside it.
      variant: isNot
      items:
        - '**Inpatient wards.** Admissions, bed management, ward rounds and nursing charts are out of scope.'
        - '**Operating theatres.** Theatre scheduling and the theatre''s own records are out of scope.'
        - '**Intensive care.** ICU charting and monitoring are out of scope.'
        - '**A full hospital information system.** EasyClinic does not replace an HIS. It covers the outpatient side, with pharmacy, lab, billing and insurance claims.'
      note: >-
        Connecting EasyClinic to the inpatient system you already run is an integration project, scoped for
        your hospital and that system. Integrations come with Enterprise, or as an add-on on Professional
        and Premium.

  - discriminant: testimonialRow
    value:
      id: customer
      heading: Dr Prantar Chakrabarti, on EasyClinic since 2008
      intro: A haematologist at the Institute of Hematology and Transfusion Medicine, on the features he likes most.
      items:
        - prantar-chakrabarti
      layout: single
      usePullQuote: true

faqHeading: Questions hospital and nursing home owners ask
faq:
  - question: Is EasyClinic a full hospital information system (HIS)?
    answer: >-
      No, EasyClinic is not a full HIS. It runs the outpatient side of a hospital or nursing home, the OPD
      and day care with their pharmacy, lab, billing and insurance claims, and it does not run inpatient
      wards, bed management, operating theatres or the ICU. A hospital that needs those keeps a separate
      inpatient system and runs EasyClinic in the OPD.
  - question: Does EasyClinic include pharmacy and lab?
    answer: >-
      Yes, pharmacy and lab management both come with Enterprise, and a hospital on Professional or
      Premium can add them to its plan. The pharmacy dispenses from the doctor's prescription with batch
      and expiry tracked, and lab tests are ordered from the chart with the results coming back into the
      patient's record. Premium on its own shows lab reports in the chart but does not include lab
      management.
  - question: Can EasyClinic handle insurance billing in the OPD?
    answer: >-
      Yes, Enterprise includes claims to insurers as well as to TPAs and HMOs, and a hospital on
      Professional or Premium can add payer claims to its plan. Each payer gets its own price list and
      coverage is checked at registration. EasyClinic builds the claim pack from the visit and the invoice,
      and payments are reconciled against the claim when they arrive.
  - question: Can one EasyClinic system run several OPD departments?
    answer: >-
      Yes, every department works on the same patient record, so a patient referred from medicine to
      orthopaedics is not registered twice. Each department can keep its own specialty templates on
      Premium and Enterprise, and each staff login sees only the screens its role needs. Enterprise adds
      workflow rules and central control across locations.
  - question: Does EasyClinic do bed management?
    answer: >-
      No, bed management is part of inpatient care, which is out of scope for EasyClinic. Admissions and
      bed allocation stay on your inpatient system, and EasyClinic runs the OPD and day care beside it.
  - question: Can EasyClinic connect to the HIS we already run?
    answer: >-
      Yes, as an integration project scoped for your hospital and the HIS you run. Integrations and custom
      features come with Enterprise, and Professional and Premium can add them. What passes between the
      two systems is agreed as part of that scope, before the work starts.
  - question: Can we host EasyClinic on a private cloud?
    answer: >-
      Yes, private cloud hosting is available on request on the Enterprise plan, and EasyClinic also offers
      a self-hosted option on the hospital's own server. The standard cloud version does not run fully
      offline today, which matters in an OPD where the internet connection drops.
  - question: How is EasyClinic priced for a hospital OPD?
    answer: >-
      Professional and Premium are priced per doctor per month, and Enterprise, the plan built for
      hospital OPDs and nursing homes, is quoted for your hospital. For comparison, Premium costs
      {price:inr.premium.annual} per doctor per month billed annually in India, or
      {price:usd.premium.annual} in US dollars. There is no setup fee on any plan and no binding contract.

