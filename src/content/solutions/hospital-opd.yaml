sections:
  - discriminant: dayTimeline
    value:
      id: a-tuesday
      heading: A Tuesday in the OPD, with and without Easy Clinic
      intro: >-
        Same OPD, same patients, same registration desk. What changes is how many times a name is typed,
        and whether the claim is still paper at the end of the week.
      entries:
        - time: '10:00'
          title: The registration rush
          before: >-
            Walk-ins queue beside patients who booked and expect to go first. Every name typed at the desk
            is typed again at billing, and insured patients reach the doctor before anyone has checked their
            plan.
          after: >-
            Walk-ins sit beside booked appointments on one calendar that the desk and the doctors share.
            Reception registers each patient once and checks the insurer or TPA plan before the consult.
          href: /features/appointment-scheduling/
        - time: '11:20'
          title: The prescription leaves the consulting room
          before: >-
            The patient walks a handwritten prescription to the pharmacy counter, and the pharmacist phones
            the consulting room to read it. The lab starts its clock when the paper slip arrives.
          after: >-
            On Enterprise, or with the pharmacy and lab add-ons on Professional or Premium, the pharmacy
            dispenses from the prescription on its screen, with batch and expiry tracked. Tests are ordered
            from the chart, and the result comes back into the record the doctor opens at the follow-up.
          href: /features/pharmacy-and-inventory/
        - time: '15:00'
          title: The claim pack
          before: >-
            The claim is put together at the billing counter by someone who was not in the consulting room.
            Nobody can fix a wrong plan picked at registration, and the TPA or HMO sends the claim back.
          after: >-
            With payer claims, which come with Enterprise or as an add-on, the claim started at
            registration and the prescription and pre-authorisation were added on the way. The claim pack
            is built from the visit and the invoice, and the billing desk submits it to the payer.
          href: /features/insurance-claims/
        - time: '18:30'
          title: Closing the day
          before: >-
            The week's claims are still a pile of paper at the billing counter, and which payer still owes
            what is a question nobody can answer before the weekend.
          after: >-
            When a payer pays, the payment is matched against its claim and the claims dashboard shows where
            each claim stands. Revenue and claim status are in the view the owner opens the next morning.
          href: /features/reports-and-dashboards/

  - discriminant: painBlocks
    value:
      id: where-opd-breaks
      heading: Where OPD volume breaks software
      intro: >-
        A clinic with two doctors can run on a register and a good receptionist. An OPD where several
        departments share one registration desk and one pharmacy counter cannot.
      items:
        - heading: The front desk sets the pace
          body: >-
            At ten in the morning the queue mixes walk-ins with patients who booked and expect to go first.
            Every name typed at the desk is typed again at billing, and nobody checks the plan before the
            consult.
          fix: >-
            Walk-ins sit beside booked appointments on one calendar the desk and the doctors share. Reception
            registers each patient once and checks the insurer or TPA plan before the consult.
          href: /features/appointment-scheduling/
          linkLabel: Appointments and walk-ins
        - heading: The pharmacy and lab hear late
          body: >-
            The patient walks a handwritten prescription to the pharmacy, and the pharmacist phones the
            consulting room to read it. The lab starts its clock when the paper slip arrives.
          fix: >-
            The pharmacy dispenses from the prescription on its screen, with batch and expiry tracked. Tests are
            ordered from the chart, and the result comes back into the record.
          href: /features/pharmacy-and-inventory/
          linkLabel: Pharmacy and inventory
        - heading: Claims die after the consult
          body: >-
            The claim is put together at the billing counter, often days later, by someone who was not in the
            consulting room. A wrong plan cannot be fixed by then, and the TPA or HMO sends it back.
          fix: >-
            The claim starts at registration, when the plan is linked and coverage checked. The claim pack is
            built from the visit and the invoice, and reconciliation shows which payer still owes what.
          href: /features/insurance-claims/
          linkLabel: Insurance claims

