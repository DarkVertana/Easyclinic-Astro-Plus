  - discriminant: splitContent
    value:
      id: opd-workflow
      tone: wash
      heading: Built for a busy hospital OPD
      centerHeading: true
      compact: true
      alignTop: true
      body: |-
        ### One registration across departments
        Every department writes on the same patient record, so a patient referred from medicine to orthopaedics is seen there without being registered again.

        ### Specialty templates per department
        On Premium and Enterprise, each department keeps its own specialty templates while all of them write to one patient record.

        ### Logins that match each role
        Every member of staff signs in with their own login, and the role decides the screens. Reception, included with every plan, cannot open the EMR.

        ### Pharmacy and lab on the same record
        With Enterprise, or the add-ons on Professional or Premium, the pharmacy works from the prescription and lab results return to the chart.

        ### Payer claims built from the visit
        With Enterprise or the claims add-on, each payer has its own price list, coverage is checked at the desk and payments are reconciled.

        ### Workflow rules and central control
        Workflow rules come with Enterprise, alongside central control of every location for a hospital running OPDs on more than one site.
      chips:
        - Walk-ins and appointments
        - SMS and email reminders
        - Reception login included
        - Department specialty templates
        - Batch and expiry tracking
        - Price list per payer
        - Claims dashboard
        - Payment reconciliation
      media:
        kind: screenshot
        src: ../../assets/images/solutions/2_EMR.png
        alt: 'The Easy Clinic EMR: a signed prescription beside a summary of the last visit and the patient facesheet, with a Complete Blood Count trend chart below'
        frame: none

