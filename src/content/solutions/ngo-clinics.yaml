sections:
  - discriminant: prose
    value:
      id: donor-report
      heading: What a donor report is built from
      body: |-
        A monthly donor report usually asks four things: how many people the clinic saw, who they were, which medicines went out, and where the money went. On paper, somebody answers them at month end by counting through the register and the stock book, and that somebody is usually also running the clinic.

        On EasyClinic the answers come from records the staff made while the patient was in front of them. Patient numbers and demographics come from the visits, narrowed with filters and search parameters of your own, and the day-end financial report covers every transaction, for each clinic and for the whole organisation. Reports can be generated and sent out automatically, and they export to Excel and PDF for the grant report.

  - discriminant: dataTable
    value:
      id: what-donors-ask
      heading: What donors ask for and what the system produces
      intro: >-
        Each row is a report or dashboard EasyClinic already describes on its own pages, with the plan or
        module that includes it.
      caption: Donor questions, the EasyClinic report that answers each, and the plan it needs
      columns:
        - What the donor asks
        - What EasyClinic produces
        - Plan
      rows:
        - - How many patients did the clinic see, and who were they?
          - Patient numbers and demographics from the visits recorded, with filters of your own and reports that run across every site
          - Every plan; more than one site from Premium
        - - Where did the money go?
          - A day-end financial report covering every transaction, for each clinic and for the whole organisation, and financial reports from the day to the quarter
          - Every plan; more than one site from Premium
        - - Which medicines and supplies were used?
          - Stock movement and stock levels, cost of goods sold, fast- and slow-moving items, and expiry reports
          - Enterprise, or the pharmacy and inventory module on Professional or Premium
        - - Can you send it in our format?
          - Reports export to Excel and PDF, and a custom report can be created when the library lacks the one you need. Enterprise adds a reporting server with custom analytics
          - Exports on every plan; custom analytics with Enterprise
        - - Are you reporting to the health ministry?
          - In Kenya, the MOH 705 and DHIS2 reports, built from the visits already recorded instead of a month-end tally of the register
          - For clinics in Kenya
      note: >-
        Dashboards and reports come with every plan, and each login sees only the reports its role allows.
        A programme with more than one site needs Premium, at {price:usd.premium.annual} per doctor per
        month billed annually.

  - discriminant: prose
    value:
      id: connectivity
      heading: It needs an internet connection at every site
      body: |-
        EasyClinic is cloud software and does not run fully offline today. Every site that records patients in it needs a mobile data or Wi-Fi connection while the clinic is open, and a second connection, even a phone hotspot beside the registration desk, is worth keeping for the day the main line drops.

        On Premium and Enterprise every site works in the same account, so what a site records shows on the programme's dashboards in real time, and head office does not wait for a site to send its figures in. The dashboards open on a phone too, and the phone needs a connection as well. If an outreach camp has no signal at all, EasyClinic is the wrong tool for the camp itself today.

        [The slowest connection a site can work on, measured, and whether private cloud hosting on Enterprise keeps a site running when its internet drops].

  - discriminant: prose
    value:
      id: pricing
      heading: What EasyClinic costs an NGO clinic
      body: |-
        [NGO tier or discount, in numbers, and which organisations qualify].

        For comparison, the standard plans are priced per doctor per month, with no setup fee and no contract. Professional costs {price:usd.professional.annual} billed annually ({price:inr.professional.annual} in India) and covers one location. Premium, at {price:usd.premium.annual} ({price:inr.premium.annual} in India), covers more than one, so a programme with several sites starts there. Enterprise, which adds the pharmacy and central control of every location, is quoted for each organisation. Every plan includes a reception login and unlimited support and training.

        [How a nurse or clinical officer who sees patients on their own is licensed, and at what price].

  - discriminant: prose
    value:
      id: patient-data
      heading: Patient data at a programme clinic
      body: |-
        Programme clinics often see the patients with the most to lose if a record leaks: people living with HIV, survivors of violence, refugees, children. Kenya's Data Protection Act 2019 treats health data as sensitive personal data, as many data protection laws do, and under it the clinic is the data controller, because it decides what is recorded and why. The clinic is responsible for obtaining the patient's consent where the law asks for it. Donor reports need counts rather than names, so check each export for names and patient numbers before it leaves the clinic.

        In EasyClinic each login sees only what its role allows, and access can also be set by department. The reception login included with every plan books patients and takes payments but cannot open the EMR, and audit logs keep a record of what each user did. What EasyClinic may do with the data it holds for your clinic is set out in our [privacy policy](/privacy/), which has a separate section for Kenya. Read the part that covers your country with your data protection lead before any patient records go in.

  - discriminant: scopeBox
    value:
      id: not-for-you
      heading: EasyClinic is not for you if
      variant: notFor
      items:
        - >-
          **Your outreach camps have no signal at all.** EasyClinic does not run fully offline today, so a
          camp with no mobile data or Wi-Fi needs another way to record patients on the day.
        - >-
          **You need inpatient wards.** EasyClinic runs outpatient care and day care. A mission hospital
          with beds keeps a separate system for the wards and theatres and runs EasyClinic in the OPD, as
          the [hospital OPD page](/solutions/hospital-opd/) explains.
        - >-
          **Your facility is in Kenya's national KenyaEMR rollout.** If you report on HIV or TB programmes
          as part of it, KenyaEMR is built for that job and has no licence fee.
          [EasyClinic vs KenyaEMR](/easyclinic-vs-kenyaemr/) sets out who each one suits.
        - >-
          **Your site is one clinician with no staff and no reports to send.** A free EMR may be enough,
          and we will tell you so.

  - discriminant: proofBlock
    value:
      id: clients
      heading: Who already uses EasyClinic
      intro: >-
        Hand in Hand India and Dayanand Education Society are among the clients listed on easyclinic.io.
        We do not yet have a programme manager's own words to put on this page, so these are EasyClinic's
        public ratings, from clinics of every kind.
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'

faqHeading: Questions NGO and mission clinics ask
faq:
  - question: Is there a discount for NGOs and mission clinics?
    answer: >-
      [NGO tier or discount, in numbers, and which organisations qualify]. Without it, EasyClinic costs
      {price:usd.professional.annual} per doctor per month billed annually on Professional
      ({price:inr.professional.annual} in India), with no setup fee and no contract, and support and
      training are included.
  - question: Does EasyClinic work offline at outreach sites?
    answer: >-
      No, EasyClinic does not run fully offline today, so a site needs a mobile data or Wi-Fi connection
      while it records patients. If your outreach camps work with no signal at all, keep the camp on paper
      and enter the visits when the team is back in range, or choose a system built to run offline.
  - question: Can the figures go into DHIS2 or a donor's portal?
    answer: >-
      In Kenya, the MOH 705 and DHIS2 reports are built from the visits already recorded, so nobody tallies
      the register at month end. [Whether EasyClinic submits the figures to DHIS2 directly or the clinic
      uploads them, as of date]. For a donor's own portal, reports export to Excel and PDF for your
      team to upload, and a direct connection to a particular system is custom development: part of
      Enterprise, or scoped per project as a module on Professional and Premium.
  - question: Can one account run several programme sites?
    answer: >-
      Yes, on Premium or Enterprise: each site is a location in one account, so a patient seen at two
      sites has one record, and reports show each site and the whole programme. Enterprise adds central
      control of every location, and a network can give its own clinics, franchise clinics, mobile medical
      units and associate clinics different access to data.
  - question: How long does it take to train staff at a new site?
    answer: >-
      About two hours, spread over {fact:trainingDays} days: our team runs four short sessions of 20 to 40
      minutes, included in every plan, so each new site's staff learn between patients. After that,
      support is unlimited at no extra cost, by phone or in writing, and Premium and Enterprise add a
      named account manager.
  - question: Which languages does EasyClinic work in?
    answer: >-
      [Languages the EasyClinic screens are available in, and prescription languages beyond English and
      Swahili]. In Kenya, prescriptions print in English and Swahili, so the patient reads the dosage in
      the language they use at home.

