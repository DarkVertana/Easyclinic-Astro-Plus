  - discriminant: splitContent
    value:
      id: advanced-emr
      tone: wash
      heading: Advanced EMR for programme clinics
      centerHeading: true
      compact: true
      alignTop: true
      body: |-
        ### Access set by role and department
        Every login works within what its role allows, and access can be narrowed by department as well.

        ### A reception login kept out of the EMR
        The desk books patients and takes payments on a login included with every plan, without opening the EMR.

        ### A record of what each user did
        Audit logs show the actions each user took, so a clinic manager can check who did what.

        ### Reports from the visits you record
        Patient numbers and demographics are drawn from recorded visits, narrowed with your own filters and exported to Excel or PDF.

        ### Dispensing with batch and expiry
        On Enterprise, or with the pharmacy and inventory module, medicines go out against the prescription and each batch is tracked to expiry.

        ### Several sites, one patient record
        On Premium and Enterprise each site is a location in one account, so a patient seen at two sites keeps a single record.
      chips:
        - Reception login
        - Access by role
        - Access by department
        - Audit logs
        - Excel and PDF export
        - Day-end financial report
        - Batch and expiry tracking
        - Real-time dashboards
