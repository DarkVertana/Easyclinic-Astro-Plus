      heading: Billing, Payments & Reconciliation made really simple
      intro: Billing and payments come with every plan. Online payments and WhatsApp come with Premium, and financial accounting with Enterprise.
      centerHeading: true
      compact: true
      alignTop: true
      stickyMedia: true
      body: |-
        ### One-Click Billing
        Simple one-click billing process, designed for ease of use by receptionists and billing clerks. Invoices are ready in less than 10 seconds.

        ### Effortless Payment Processing
        Seamlessly manage online and offline payments with immediate balance visibility and payment suggestions at a click.

        ### Flexible Payment Options
        Offers flexibility in handling part payments, advance payments, refunds, and invoice voiding with proper authorization, as well as payment amortisation for package treatments.

        ### Service List with Flexible pricing
        Effortlessly manage billing services and items with the ability to adjust prices, offering variable pricing flexibility without the need to regenerate entire billing records.

        ### Automated Taxable Item Management
        Utilises a custom tax definition module for automatic management of taxable versus non-taxable items, simplifying tax-related processes.

        ### Financial Reporting
        Access detailed financial reports in various formats for daily, weekly, monthly, and quarterly book balancing and profit & loss analysis.

        ### Digital Integration
        Integrated with WhatsApp, SMS, and Email to digitally send payment receipts and invoices to patients.

        ### Customizable Billing Templates
        Personalise billing templates to fit the unique needs of your practice, enhancing the professional appearance of your invoices and receipts.
