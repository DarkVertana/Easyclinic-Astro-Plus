notes:
  - 'Status draft: spec 5.10 item 4 wants an NGO tier or discount "in numbers [decide before launch]". Placeholders to fill before publishing: the NGO tier or discount and who qualifies (opening answer, pricing section, first FAQ); how a nurse or clinical officer who sees patients alone is licensed (pricing section; pricing/main.yaml also lists the licence rule for nurses as unknown); the screen and prescription languages (last FAQ); the slowest connection a site can work on and whether private cloud hosting keeps a site running offline (connectivity section); whether EasyClinic submits to DHIS2 directly or the clinic uploads (DHIS2 FAQ). Everything else uses confirmed facts only, so the page can publish once those five are supplied.'
  - 'Grounding: live /ngo-landing-page/ fetched 2026-09-26 (it 301s here per src/data/redirects.yaml, so no redirectFrom). Used from it: end-of-day financial reports clinic- and organisation-wide covering all transactions; role-based access control; automated generation and distribution of reports; centralised patient records across locations. Report library, filters, Excel and PDF export, custom reports, access by department, audit logs, inventory reports and real-time dashboards on a phone follow the grounding recorded on /features/reports-and-dashboards/ (live /features/ and /reports-and-dashboards/). Plans from plans.yaml. Reception rule, no contract, support channels, four-day training and "does not run fully offline today" from facts.md. MOH 705 and DHIS2 for Kenya from live /kenyademo/ ("MOH 705 and DHIS2 done automatically"), worded as on /kenyademo/ in this repo.'
  - 'Left out of the live NGO page: tracking donor contributions and fund usage, fundraising campaign management and "increased funding from donors" (no detail of what is recorded; confirm with product before any donor-tracking claim); AI clinician assistant, AI-generated reporting, predictive health-risk AI and AI inventory demand forecasting (not in plans.yaml under those names); automated vaccination and medication-refill reminders (plans.yaml has SMS and email reminders only); staff burnout and turnover claims (unmeasured); "Join 5000+ Doctors" stat line; "14-Day Free Trial, with an extra 30-Day Money Back Guarantee" (conflicts with published pages that say there is no free trial).'
  - 'Spec 5.10 table rows left out for lack of a grounded report: visits by programme (whether visits can be tagged by programme or grant is unknown), services by category, referrals, and "demographics without identifiers" (whether a demographics report carries no identifiers is not confirmed, so the page gives advice to check exports instead). Custom report creation has no confirmed plan, so the table gives no plan for it.'
  - 'Connectivity (spec 5.10 item 3): offline and "what syncs and when" answered from facts.md ("does not run fully offline today") and real-time dashboards; no sync behaviour is claimed. Not stated because unknown: the minimum bandwidth EasyClinic needs per site (spec 5.10 promises "low bandwidth"; supply a measured figure to restore it), whether the full app works in a phone browser, and the self-hosted option''s behaviour without internet (the self-hosted option from the live Kenya listicle is not described for that reason; the connectivity section carries a placeholder for the measured connection and for private cloud hosting, plans.yaml Enterprise). The live Kenya listicle FAQ also says EasyClinic is "tuned to stay responsive on low bandwidth" and works on 3G; not used because it is not in the confirmed-facts list and the same page carries claims that conflict with other pages (2-4 week setup, per user and per location pricing).'
  - 'Data protection (spec 5.10 item 5): the obligation is described from src/data/regulators/ke-dpa.yaml and the Kenya section of /privacy/ (clinic as data controller; consent is the provider''s responsibility), with no compliance claim. Conflict for the company and legal: the global part of /privacy/ (section 2(d)) says EasyClinic "may collect, analyse, use, publish, create and sell de-identified information", while the Kenya section says "We do not sell personal data, health data, or de-identified data derived from health data". For that reason the live pricing FAQ line "We never misuse, sell or in any way disclose your data" is not quoted here, and the page sends readers to the policy for their country. The Kenya section also describes consent-recording fields and an audit record of consent; not claimed because product features in the legal text are not in the confirmed-facts list. Add them once product confirms, with the countries they apply to.'
  - 'Named clients (spec 5.10 item 7): Hand in Hand India and Dayanand Education Society are logo-wall alts on live /about-us/ and /ai/ (facts.md section 3). Named only as "clients listed on easyclinic.io", with no description of their programmes and without calling them NGO clinics. Replace or add a testimonial from an NGO client when one is collected; the proof block is the badges variant because every testimonial is placed elsewhere and the customer variant renders only with a testimonial.'
  - 'FAQ (spec 5.10 item 8 lists seven topics for six questions): donor portals and DHIS2 export share one question. "Training on the ground" is asked as how long it takes, because whether trainers travel to a programme site, and at what cost, is unknown. The DHIS2 answer says only that the Kenya reports are built from recorded visits; whether EasyClinic submits to DHIS2 directly or the clinic uploads is unknown, so the answer carries the same placeholder as /emr-software-in-kenya/. DHIS2 outside Kenya is not claimed. The multi-site answer follows /features/multi-location/ (Premium for more than one location; access for owned clinics, franchisees, mobile medical units and associate clinics from live /clinic-chain-software/).'
  - 'Pricing section shows USD and INR only: KES, AED and NGN prices are unknown. A Kenyan NGO reads a dollar price until KES is supplied.'
  - 'Hero screenshot (spec 5.10 item 1: programme report with visits, services and stock by month) left out: no screenshots exist, and no single "programme report" is confirmed as a product screen. The first section describes the report in words from confirmed reports.'
  - 'Spec 6.5 pass: the page has no named person and no measured figure of its own; the NGO price will be its number. Both CTAs go to /contact-us/#book-a-demo, as the orchestrator brief sets; point "Apply for NGO pricing" at an application form if one is built.'
  - 'Related links follow spec 2.9: three feature pages (reports, multi-location, pharmacy), one specialty page (paediatrics, for child-health programmes) and one country page (Kenya, where the MOH 705 and DHIS2 reports apply), plus the KenyaEMR comparison and pricing. /emr-software-in-kenya/ is a draft today.'
