sections:
  - discriminant: dayTimeline
    value:
      id: a-tuesday
      heading: A Tuesday at an NGO clinic, with and without Easy Clinic
      intro: >-
        Same clinic, same patients, on the Tuesday the monthly donor report is due. What changes is who
        counts through the register, and when.
      entries:
        - time: '08:30'
          title: Registration opens
          before: >-
            The receptionist writes each patient into the register, and the paper files sit in a cupboard
            that anyone at the desk can open.
          after: >-
            The reception login, included with every plan, books each patient and takes payments but cannot
            open the EMR, so the desk sees only what its role allows.
          href: /features/appointment-scheduling/
        - time: '11:00'
          title: Medicines go out
          before: >-
            Each medicine given out is written into the stock book by hand, and expiry dates are checked by
            reading the boxes on the shelf.
          after: >-
            With the pharmacy and inventory module, or on Enterprise, medicines are dispensed from the
            prescription and each batch is tracked to its expiry, so stock movement and expiry reports are
            ready when a donor asks which medicines went out.
          href: /features/pharmacy-and-inventory/
        - time: '15:00'
          title: The donor report is due
          before: >-
            The clinic manager stops running the clinic to count through the register and the stock book for
            the month's patient numbers.
          after: >-
            Patient numbers and demographics come from the visits staff recorded, narrowed with filters of
            your own, and the report exports to Excel and PDF. Check the export for names and patient numbers
            before it leaves the clinic.
          href: /features/reports-and-dashboards/
        - time: '18:00'
          title: The day closes
          before: >-
            Each site counts its takings and sends the figures to head office, which waits for the last site
            before it knows where the money went.
          after: >-
            The day-end financial report covers every transaction, for each clinic and for the whole
            organisation. On Premium and Enterprise every site works in the same account, so head office sees
            each site on its dashboards in real time, as long as the site has its connection.
          href: /features/multi-location/

  - discriminant: painBlocks
    value:
      id: three-pains
      heading: What Easy Clinic fixes first
      intro: >-
        At a programme clinic the hours go into counting: the register at month end, the stock book when a
        donor asks, and the figures each site sends in. Easy Clinic fixes those three first, from the
        records staff make while the patient is in front of them. Every site still needs an internet
        connection.
      items:
        - heading: Why reports wait for month end
          body: >-
            A donor report asks how many people the clinic saw and who they were. On paper somebody answers
            it by counting through the register, and that somebody is usually also running the clinic.
          fix: >-
            The answers come from the visits staff recorded, narrowed with filters of your own. Reports can
            be generated and sent out automatically, and they export to Excel and PDF.
          href: /features/reports-and-dashboards/
          linkLabel: How reports and dashboards work
        - heading: Why stock is counted by hand
          body: >-
            Each medicine given out goes into the stock book by hand, and expiry is checked by reading the
            boxes on the shelf. When a donor asks which medicines went out, the answer is only as good as
            the book.
          fix: >-
            With the pharmacy and inventory module, or on Enterprise, medicines are dispensed from the
            prescription and each batch is tracked to its expiry, with stock movement and expiry reports.
          href: /features/pharmacy-and-inventory/
          linkLabel: How pharmacy and inventory work
        - heading: Why head office waits on sites
          body: >-
            Each site keeps its own register and sends its figures in, and head office waits for the last
            one. A patient seen at two sites has two sets of paper, and neither site sees the other's.
          fix: >-
            On Premium and Enterprise each site is a location in one account, so a patient seen at two sites
            has one record and head office sees each site in real time, while it has its connection.
          href: /features/multi-location/
          linkLabel: How more than one location works

