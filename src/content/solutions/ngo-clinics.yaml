editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The page ties each donor question to a report Easy Clinic's own pages describe, down to the MOH 705 and
    DHIS2 reports for Kenyan clinics and the reception login that cannot open the EMR, names two clients
    listed on easyclinic.io, and says plainly that it does not run fully offline and does not cover
    inpatient wards.
  readsMachineWritten: >-
    With NGO pricing still a placeholder, no programme manager's own words, no measured figure and no
    programme report screenshot, the donor-report prose describes a generic programme clinic and the table
    restates the reports page, so the read-aloud pass should check it sounds like someone who has written
    a grant report.

