  EasyClinic is clinic software for NGO clinics and mission hospitals: staff record each visit and each
  bill once, and the reports a donor asks for, from patient numbers by site to a day-end financial
  report covering every transaction, are built from those records. NGO pricing is [NGO tier or discount,
