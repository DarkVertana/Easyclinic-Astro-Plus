  - discriminant: prose
    value:
      id: donor-report
      width: wide
      heading: What a donor report is built from
      body: |-
        A monthly donor report usually asks four things: how many people the clinic saw, who they were, which medicines went out, and where the money went. On paper, somebody answers them at month end by counting through the register and the stock book, and that somebody is usually also running the clinic.

        On Easy Clinic the answers come from records the staff made while the patient was in front of them. Patient numbers and demographics come from the visits, narrowed with filters and search parameters of your own, and the day-end financial report covers every transaction, for each clinic and for the whole organisation. Reports can be generated and sent out automatically, and they export to Excel and PDF for the grant report.

faqHeading: Questions NGO and mission clinics ask
faq:
  - question: Is there a discount for NGOs and mission clinics?
    answer: >-
      The price list has no separate NGO plan, so ask us about your programme. On the standard plans, Easy Clinic costs
      {price:usd.professional.annual} per doctor per month billed annually on Professional
      ({price:inr.professional.annual} in India), with no setup fee and no contract, and support and
      training are included.
  - question: Does Easy Clinic work offline at outreach sites?
    answer: >-
      No, Easy Clinic does not run fully offline today, so a site needs a mobile data or Wi-Fi connection
      while it records patients. If your outreach camps work with no signal at all, keep the camp on paper
      and enter the visits when the team is back in range, or choose a system built to run offline.
  - question: Can the figures go into DHIS2 or a donor's portal?
    answer: >-
      In Kenya, the MOH 705 and DHIS2 reports are built from the visits already recorded, so nobody tallies
      the register at month end. For a donor's own portal, reports export to Excel and PDF for your
      team to upload, and a direct connection to a particular system is custom development: part of
      Enterprise, or scoped per project as a module on Professional and Premium.
  - question: Can one account run several programme sites?
    answer: >-
      Yes, on Premium or Enterprise: each site is a location in one account, so a patient seen at two
      sites has one record, and reports show each site and the whole programme. Enterprise adds central
      control of every location, and a network can give its own clinics, franchise clinics, mobile medical
      units and associate clinics different access to data.
  - question: How long does it take to train staff at a new site?
    answer: >-
      About two hours, spread over {fact:trainingDays} days: our team runs four short sessions of 20 to 40
      minutes, included in every plan, so each new site's staff learn between patients. After that,
      support is unlimited at no extra cost, by phone or in writing, and Premium and Enterprise add a
      named account manager.
  - question: Which languages does Easy Clinic work in?
    answer: >-
      In Kenya, prescriptions print in English and Swahili, so the patient reads the dosage in
      the language they use at home.

