sections:
  - discriminant: painBlocks
    value:
      id: what-breaks
      heading: What breaks when clinics multiply
      intro: >-
        With one clinic the owner sees everything from the consulting room. From the second branch on, head
        office runs the chain on phone calls and spreadsheets, and these are the first things to slip.
      items:
        - heading: Care drifts from branch to branch
          body: >-
            The protocol written at head office is followed to the letter at the flagship and loosely three
            branches away. One branch's diabetes review includes the foot check and the HbA1c; another's is a
            repeat prescription. Nobody at head office knows which until a patient complains.
          fix: >-
            Head office writes the SOP once and every branch works from the same template and checklist.
            Clinical SOP tracking shows adherence as a percentage for each branch, so drift turns up as a
            number before it turns up as a complaint.
        - heading: Head office hears about Tuesday on Wednesday
          body: >-
            Each branch manager sends the day's figures after closing, on WhatsApp or in a spreadsheet laid
            out their own way. By the time someone at head office has added them up, the short till and the
            empty shelf are a day old, and no two branches count a visit the same way.
          fix: >-
            Every branch bills and dispenses in the same EasyClinic system, so head office reads the figures
            each branch entered, counted the same way everywhere, without waiting for the evening message or
            retyping a spreadsheet. The KPI dashboard puts the branches side by side.
          href: /features/reports-and-dashboards/
          linkLabel: See the morning numbers by branch
        - heading: The patient starts again at every door
          body: >-
            A patient seen at your north branch walks into the south branch with the same complaint and none
            of the history. The doctor takes the history again and repeats the blood test done last month,
            and the patient wonders what the chain is for.
          fix: >-
            One central chart serves every branch. The notes and lab reports from the north branch are on the
            same record at the south branch, so the second doctor starts from last month's visit.
          href: /features/multi-location/
          linkLabel: How one record works across branches
  - discriminant: splitTable
    value:
      id: central-and-local
      heading: Central control, local flexibility
      intro: >-
        Head office holds what has to be the same at every branch. The branch keeps what depends on its own
        doctors and its own neighbourhood.
      left:
        title: Head office sets
        items:
          - Clinical SOPs, and the tracking that shows which branches follow them
          - Price lists for every branch and every payer
          - The formulary each branch pharmacy dispenses from
          - Note and prescription templates
      right:
        title: Each branch adjusts
        items:
          - Appointment slots
          - Doctor timings
          - Staff and shifts
          - Local promotions
      note: SOP tracking and central control of every location come with the Enterprise plan.
  - discriminant: featureRows
    value:
      id: one-record
      heading: What head office gets from one record
      items:
        - heading: Every branch on one morning screen
          body: >-
            The owner's dashboard puts the branches side by side, starting with revenue for each branch.
            Where the chain runs pharmacy and claims, each branch's stock and the status of its claims sit
            beside it, so a branch that falls behind shows up on the same screen as the branches that are on
            track.
          bullets:
            - Custom analytics on a reporting server, on Enterprise
          link:
            label: See the reports and dashboards
            href: /features/reports-and-dashboards/
        - heading: Stock that moves between branches
          body: >-
            Each branch pharmacy dispenses from the prescription and tracks every batch and its expiry. When
            one branch runs short of an antibiotic that another holds in quantity, the stock moves on a
            transfer that takes it off one branch's count and onto the other's. Reorder alerts flag an item
            before the shelf is empty.
          bullets:
            - Batch and expiry tracked at every branch
            - Transfers recorded at the sending and the receiving branch
          plan: enterprise
          link:
            label: See pharmacy and inventory
            href: /features/pharmacy-and-inventory/
        - heading: A new branch goes live on the same record
          body: >-
            Whether you own the new branch or a franchisee does, it opens on the SOPs, price lists, formulary
            and templates head office has already set, so nobody sets them up again for the new branch. Its
            staff take the same four-day training as every other branch, and the branch appears on the
            owner's dashboard beside the rest.
          bullets:
            - Head office settings in place before the first patient
            - The same four-day training at every branch
          plan: enterprise
          link:
            label: See how branches share one record
            href: /features/multi-location/
        - heading: Revenue that leaks between the chart and the bank
          body: >-
            In a chain, money goes missing where one person hands work to the next. A dressing ordered in the
            chart never reaches the bill. One branch charges last year's price for a scan. A claim comes back
            denied and waits in a tray, and the till at one branch closes a little short every Friday without
            anyone at head office seeing the pattern.
          bullets:
            - Orders in the chart carried through to the bill
            - Price lists set by head office for every branch
            - Coverage checked at registration, with ageing and denial reports
            - A day-end cash close at each branch, with the variance shown
          plan: enterprise
          link:
            label: See revenue management
            href: /features/revenue-management/
  - discriminant: testimonialRow
    value:
      id: customers
      heading: A health group in Zimbabwe on building its operations around EasyClinic
      intro: >-
        Clinics and hospitals on EasyClinic include Premier Hospital, Ross Clinics, Seth GS KEM Hospital,
        German Osteo and Caring Minds. In Nairobi, Penda Health has run its clinics on EasyClinic since
        2017.
      items:
        - foster-akaketwa
      layout: single
  - discriminant: stepList
    value:
      id: roll-out
      heading: How a chain moves onto EasyClinic
      intro: >-
        Branches go live in the order you choose, and each one joins the same record as the branches before
        it.
      steps:
        - title: Demo for head office
          body: >-
            Head office sees the central chart and the branch dashboard, and brings the questions its own
            network raises, such as how franchise branches fit in or which payers each branch bills.
        - title: Map the branches
          body: >-
            Together we list every branch, owned or franchised, and decide setting by setting what head office
            holds and what each branch keeps. The SOPs, price lists, formulary and templates are then set once,
            at the centre.
        - title: Train each branch
          meta: '{fact:trainingDays} days, about two hours in all'
          body: >-
            Each branch's staff take the four-day path: basic training on day 1 (40 minutes), EMR scenarios on
            day 2 (40 minutes), practice exercises on day 3 (20 minutes) and the road to expertise on day 4 (20
            minutes). Training is included at no extra charge.
        - title: Go live, branch by branch
          body: >-
            Each branch goes live on the same record as the others and joins the owner's dashboard beside
            them. Support is included on every plan at no extra charge, and Premium and Enterprise include a
            named account manager.
