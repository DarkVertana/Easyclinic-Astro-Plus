sections:
  - discriminant: dayTimeline
    value:
      id: a-tuesday
      heading: A Tuesday across your branches, with and without Easy Clinic
      intro: >-
        Same branches, same patients. What changes is how much of the day head office can see, and how
        soon.
      entries:
        - time: '08:30'
          title: The morning numbers
          before: >-
            Last night's figures arrived on WhatsApp, each branch laid out its own way. Someone at head office
            is still adding them up, and no two branches count a visit the same way.
          after: >-
            The owner opens the dashboard and sees the branches side by side, starting with revenue for each
            branch, counted the same way everywhere from what each branch entered.
          href: /features/reports-and-dashboards/
        - time: '10:15'
          title: A patient at a second branch
          before: >-
            A patient seen at the north branch last month walks into the south branch. The doctor takes the
            history again and repeats last month's blood test.
          after: >-
            The notes and lab reports from the north branch are on the same chart, so the second doctor starts
            from last month's visit. Premium and Enterprise both cover more than one location.
          href: /features/multi-location/
        - time: '13:00'
          title: One branch runs short
          before: >-
            One branch is out of an antibiotic that another branch holds in quantity. The pharmacist phones
            around, and the stock moves with nothing written down at either end.
          after: >-
            The stock moves on a transfer that takes it off one branch's count and onto the other's, and
            reorder alerts flag the item before the shelf is empty. Stock transfers come with Enterprise.
          href: /features/pharmacy-and-inventory/
        - time: '18:30'
          title: Every till closes
          before: >-
            One branch's till closes a little short again. The figure reaches head office tomorrow, and nobody
            there sees the pattern.
          after: >-
            Each branch runs its day-end cash close with the variance shown, and head office reads the same
            figures the branch entered, without waiting for the evening message.
          href: /features/revenue-management/

  - discriminant: painBlocks
    value:
      id: what-breaks
      heading: What breaks when clinics multiply
      intro: >-
        With one clinic the owner sees everything from the consulting room. From the second branch on, head
        office runs the chain on phone calls and spreadsheets, and these are the first things to slip.
      items:
        - heading: Care drifts between branches
          body: >-
            The protocol written at head office is followed to the letter at the flagship and loosely three
            branches away. Nobody at head office knows which until a patient complains.
          fix: >-
            Every branch works from the same SOP template and checklist. Clinical SOP tracking shows adherence
            for each branch, so drift shows up as a number before it shows up as a complaint.
        - heading: Head office hears a day late
          body: >-
            Each branch manager sends the day's figures after closing, laid out their own way. By the time head
            office has added them up, the short till and the empty shelf are a day old.
          fix: >-
            Every branch bills and dispenses in the same system, so head office reads the figures each branch
            entered, counted the same way. The KPI dashboard puts the branches side by side.
          href: /features/reports-and-dashboards/
          linkLabel: See the morning numbers by branch
        - heading: History stays at one branch
          body: >-
            A patient seen at your north branch walks into the south branch with none of the history. The doctor
            takes it again and repeats last month's blood test.
          fix: >-
            One central chart serves every branch. The notes and lab reports from the north branch are on the
            same record at the south branch, so the second doctor starts from last month's visit.
          href: /features/multi-location/
          linkLabel: How one record works across branches
