faq:
  - question: Can franchised and owned branches run on the same EMR?
    answer: >-
      Yes. EasyClinic treats a franchised branch and an owned branch alike, as locations under central
      control, so both share one patient record and work from the SOPs, price lists, formulary and
      templates head office sets. A franchisee adjusts what any branch adjusts, such as appointment slots
      or local promotions.
  - question: How do we standardise care across branches in different cities?
    answer: >-
      Write the SOP once at head office and every branch works from it, with the same note templates and
      the same formulary. Clinical SOP tracking, on the Enterprise plan, then shows adherence branch by
      branch, so you can see which city follows the protocol and which has drifted, and walk into that
      branch with the numbers.
  - question: Does EasyClinic make sense for a chain of only two branches?
    answer: >-
      Yes. Two branches can run on Premium, which covers more than one location and costs
      {price:usd.premium.annual} per doctor per month on annual billing, or {price:inr.premium.annual} in
      India. Enterprise adds clinical SOP tracking, insurance claims, stock transfers and central control
      of every location, and the largest chain on EasyClinic has {fact:largestChain} locations, so you do
      not change systems as the chain grows.
  - question: How is a clinic chain priced?
    answer: >-
      EasyClinic's published prices are per doctor per month, with no separate line for a branch, and
      Premium, at {price:usd.premium.annual} per doctor per month billed annually, covers more than one
      location. Enterprise, the plan with SOP tracking and central control of every location, has no list
      price, and each chain gets its own quote.
  - question: Which branch should go live first?
    answer: >-
      Start with one branch that head office can watch closely, and settle the SOPs and price lists there
      before the next branch goes live on them. Each branch's staff then take the same four-day training,
      and the rest of the network follows in whatever order suits you.
  - question: Can a doctor who works at two branches use one login?
    answer: >-
      Yes. A doctor who moves between branches signs in with one login and sees the same patient record
      at each, so a patient seen on Monday at one branch and on Thursday at another has one chart.
      Central control of every location comes with the Enterprise plan.
  - question: What happens at a branch when the internet goes down?
    answer: >-
      EasyClinic does not run fully offline today, so plan for a working internet connection at every
      branch. A backup connection, such as mobile data on a dongle, is worth keeping for the day the main
      line drops.
  - question: Are we tied in if the first branches do not work out?
    answer: >-
      No. EasyClinic has no binding contracts, so after the first branches go live you decide whether the
      rest of the network follows.
