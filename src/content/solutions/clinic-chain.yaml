  - discriminant: splitContent
    value:
      id: advanced-emr
      tone: wash
      heading: Advanced EMR for clinic chains
      centerHeading: true
      compact: true
      alignTop: true
      body: |-
        ### One chart at every branch
        A patient's notes and lab reports go with them from branch to branch, and a doctor who works at two branches signs in once.

        ### SOPs tracked branch by branch
        Head office writes each clinical SOP once. On Enterprise, adherence shows for every branch, so drift is visible before a patient complains.

        ### Templates and formulary set centrally
        Every branch writes notes on the same templates and dispenses from the same formulary, owned and franchised branches alike.

        ### Branches side by side on one dashboard
        The owner sees revenue for each branch counted the same way, with stock and claim status where the chain runs those modules.

        ### Stock transfers between branches
        Medicine moves on a transfer recorded at both ends, with batch, expiry and reorder alerts at every branch. Transfers come with Enterprise.

        ### Revenue control at every counter
        On Enterprise, head office sets price lists for each branch and payer. Chart orders carry through to the bill, and each till closes with the variance shown.
      chips:
        - One central chart
        - One doctor login
        - SOP adherence tracking
        - Shared formulary
        - Branch KPI dashboard
        - Stock transfers
        - Reorder alerts
        - Day-end cash close
