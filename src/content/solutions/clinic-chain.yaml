  - discriminant: prose
    value:
      id: staff-access
      width: wide
      heading: Branches and staff access
      body: |-
        Every branch writes on one central chart. A doctor who moves between branches signs in with one login and sees the same patient record at each, so a patient seen on Monday at one branch and on Thursday at another has one chart.

        Each member of staff has their own login, and the role decides which screens they see. A reception login comes with every plan, and reception cannot open the EMR or write a prescription. Each branch keeps its own appointment slots, doctor timings, and staff and shifts.

        Head office sets the clinical SOPs, price lists, formulary and templates for every branch. SOP tracking and central control of every location come with the Enterprise plan.

