editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The definitions put the four countries EasyClinic sells in side by side in a clinic's own terms: the two
    meanings of DHA in Dubai and Kenya, the bill of supply that GST-exempt consultations need, the NABIDH
    connection DHA checks before a Dubai licence is activated, and the ODPC registration every Kenyan clinic
    owes whatever its size. Little of it rests on EasyClinic's own experience.
  readsMachineWritten: >-
    Forty definitions of similar length that open with what the term is and close with what it means for a
    clinic will read as generated, so the read-aloud pass should vary the endings and check that no
    definition drifts into describing EasyClinic.

notes:
  - 'Spec 5.19 asks for forty definitions of 60 to 100 words with an anchor each and a link to the deeper page; there are exactly 40, each with an id (the anchor), an href, and a source for every regulator, law, scheme, platform and standard. Descriptive terms (claim denial, clinic management software, e-prescription, no-show, OPD, revenue leakage, token system) carry no source.'
  - 'Terms trimmed from the brief''s list: practice management is the aka of clinic management software; IPD is defined inside OPD; recall campaign was dropped. "Revenue cycle" became "Revenue leakage" because spec 4.5 rule 2 says the phrase "revenue cycle management" appears only on /features/revenue-management/.'
  - 'No definition states or implies EasyClinic''s status with any regulator, exchange or integration (all unknown). The Kenya insurer names on /kenyademo/ (Jubilee, AAR, CIC, Britam, Resolution via SLADE) are left out of the SLADE entry because they describe EasyClinic''s integration claims, not SLADE itself.'
  - 'Link targets follow spec 4.5: TPA, HMO, SHA, SLADE, eClaimLink and pre-authorisation go to /features/insurance-claims/ (rule 2); GST, eTIMS and M-Pesa go to /features/billing/; denials and leakage go to /features/revenue-management/; ABDM goes to /trust/ (rule 6); WhatsApp API and templates go to /features/whatsapp/ (rule 3). /clinic-management-software-uae/ is planned as a draft; until it publishes, production drops those four links (registry urlFor returns null) and the terms render with the official source link only.'
  - 'Sources re-fetched and checked 26 Sep 2026 by an adversarial fact-check pass. ABDM, ABHA, HPR: NHA "brief guide on ABDM and its building blocks" on abdm.gov.in (14-digit ABHA, earlier Health ID, PHR address xyz@abdm, voluntary participation, HPR covers doctors of modern medicine, dentistry and the Ayush systems with nurses and others to follow, HPR does not replace council registration, no HPR fee, only ABDM-enrolled doctors access records from other providers, a private facility joining ABDM needs its professionals on HPR); launch 27 Sep 2021 from PIB (PRID 1758502). M1 (ABHA creation and verification), M2 (HIP, linking records) and M3 (HIU, consent-based fetch) checked on sandbox.abdm.gov.in milestone docs. HFR: hfr and hpr portals both redirect to nhpr.abdm.gov.in (National Healthcare Providers Registry); facility types, voluntary enrolment and verified or self-declared status from the building-blocks guide. HPR source moved from the NHPR portal (a script-only page) to the building-blocks guide, which holds every HPR claim. ABDM FHIR R4 profiles: nrces.in FHIR IG for ABDM.'
  - 'DPDP: PIB explainer of 17 Nov 2025 (Act 11 Aug 2023; Rules notified 14 Nov 2025; 18-month phased compliance; 90-day response to rights requests; penalties up to ₹250 crore for security safeguards). The end date of the phase-in is not given because a proposal to shorten it (reported Jan 2026) has no located amending instrument.'
  - 'NMC Telemedicine Practice Guidelines: source changed from the nmc.org.in home page (no telemedicine document reachable; its document links return 404) to the MoHFW eSanjeevani copy of the Board of Governors document dated 25 March 2020, "Appendix 5 of the Indian Medical Council (Professional Conduct, Etiquette and Ethics) Regulation, 2002", which holds Lists O, A, B and the prohibited list (Schedule X and NDPS drugs) and the signed or e-prescription rule.'
  - 'GST: CBIC Circular 32/06/2018 (health care services by a clinical establishment, authorised medical practitioner or para-medics exempt, Sl. 74 of Notification 12/2017-CT(Rate)); cosmetic and plastic surgery exclusion from the same notification; bill of supply for exempt supplies is section 31(3)(c) of the CGST Act (not fetched, standard law). NABH: nabh.co (QCI constituent, programme list, "NABH accreditation is voluntary"). TPA and pre-authorisation: IRDAI Master Circular on Health Insurance Business, 29 May 2024 (cashless decision within one hour, discharge authorisation within three hours, documents collected from hospitals, NHCX onboarding).'
  - 'Kenya: SHA launch 1 Oct 2024 (health.go.ke press release); three funds (sha.go.ke menu); 2.75% and KES 300 minimum, PHC access at level 2 and 3, empanelment and emergency exception, pre-authorisation definition (Social Health Insurance (General) Regulations 2024 PDF on health.go.ke). SHA HMIS rule: SHA notice of 1 Sep 2026 as reported by Kenyans.co.ke, The Star, Capital FM and The Standard (a DHA-certified HMIS able to exchange data with SHA, replacing reliance on the Provider Portal, required for the 2026/28 contracting cycle, deadline extended from 1 Sep to 30 Sep 2026); the notice itself is not posted on sha.go.ke, so the SHA source stays the home page; re-check after 30 Sep 2026. The seven-day claim deadline in the regulations PDF is left out because the copy is unnumbered and may differ from the gazetted text. eTIMS: KRA public notices (all businesses from 1 Sep 2023; expenses without eTIMS invoices not deductible from 1 Jan 2024) and "What is eTIMS". ODPC: Guidance Note on Processing of Health Data (health data sensitive, processing by or under a provider or person bound by secrecy, mandatory registration for the health sector, 72-hour breach report, written notice to affected patients). KMPDC: kmpdc.go.ke (registers and licenses practitioners and health facilities, annual licence, CPD compliance). The Quality Healthcare and Patient Safety Bill 2025 passed the National Assembly on 2 Jun 2026 and was read in the Senate on 15 Jul 2026 (The Star; Mzalendo tracker shows no assent as of 20 Sep 2026); it would create an Authority to license and inspect facilities, so the KMPDC entry says so and must be updated if it is enacted. Digital Health Act: Agency functions (s.6) checked in the Kenya Law PDF of Act 15 of 2023; kenyalaw.org returns 403 to fetches; LN 76 and 77 of 2025 commenced 11 Apr 2025. "Sets interoperability standards" was softened to "promotes standards for data exchange" because s.6 says the Agency promotes and supports standards. MOH 705A (under five) and 705B (five and over) monthly summaries reported in KHIS; hiskenya.org is the KHIS DHIS2 login page; no single official MOH 705 page was found. SLADE: Savannah Informatics Slade360 EDI page (claims submission, payer review and approval, payment tracking, 6 payers and 3,000+ providers); the earlier "validates against cover in real time" was not on the page and was removed. M-Pesa: Safaricom Lipa na M-Pesa page (Buy Goods till, Paybill; WebFetch gets 403, a browser fetch works) and Daraja.'
  - 'UAE: DHA entry now cites the DHA Manual for Licensing Health Facility (Nov 2024), which holds its mandate (licensure and inspection of facilities and professionals, regulations), Sheryan-only applications, the inspection and the NABIDH EMR evidence and tested-connectivity approval email before activation. NABIDH entry now cites the DHA Standards for Interoperability and Data Exchange (issue 2, effective 2 Jul 2025, served at the 2022 upload URL), which defines NABIDH, applies to DHA-licensed facilities, names HL7 v2 as the recommended standard and asks systems to support FHIR; the two sources were swapped so each entry rests mainly on its own citation. Malaffi: doh.gov.ae featured page (launched 2019, "my file", ADHDS PPP, integrated with Riayati and NABIDH) and the DoH HIE standards page (minimum data set sent from EMRs to Malaffi). Riayati: mohap.gov.ae resets the connection, so the source is now the DoH news release of 31 Jan 2023 (Riayati is the NUMR under MoHAP; integration with Malaffi and NABIDH announced); facility types (public and private hospitals, clinics, day care centres, diagnostic centres) come from MOHAP page listings in search results. "Pharmacies" was removed from the Riayati entry because no fetched source lists them. eClaimLink: eclaimlink.ae (registration opened April 2012), eClaimLink General Circular 04/2018 (eRx reference for insured and cash patients, DHA and DHCC licensed) and the DHIC data governance directive. PDPL: u.ae data protection page (Decree-Law 45 of 2021; consent except listed cases; correction right; ICT Health Law No. 2 of 2019 covers health ICT); the health-data carve-out and the ICT Health Law rules (Article 13 localisation, Article 20 25-year retention) come from legal summaries because uaelegislation.gov.ae returns 403.'
  - 'Nigeria: NHIA about page (Act signed 19 May 2022, replaced NHIS Act 1999, Vulnerable Group Fund), NHIA accredited HMO list; capitation for primary and fee-for-service for secondary care and HMO authorisation codes for referrals come from NHIA operational guideline summaries and a federal hospital NHIS page, not a single NHIA document. NDPA: NDPC registration guidance notice (health sector designation, 200 data subjects in six months); 72-hour breach report is section 40(2) as quoted by NDPC materials; signing date 12 Jun 2023. Re-checked 26 Sep 2026: the NHIA about page confirms the 19 May 2022 signing and the NHIS Act 1999 repeal; the mandatory cover for citizens and legal residents is sections 3(b) and 14(1) of the Act as summarised by WHO AFRO and legal commentary; the NHIA HMO page is the accredited HMO list (no count given here because the about page and the list disagree, 82 against 94). NDPA signing date, section 32 (DPO for controllers of major importance) and section 40(2) (72 hours) checked in the gazetted Act text. The pre-authorisation entry now also names HMO authorisation codes before a referral, on the same basis as the HMO entry.'
  - 'Facts left out as unconfirmed or changeable: the number of ABHA accounts and registered facilities, NHIA HMO and provider counts, Malaffi and Riayati facility counts, SHIF benefit tariffs, WhatsApp per-message rates, DPDP phase-in end date, whether DHA Kenya certification exists for any vendor, and HFR registration fees.'
