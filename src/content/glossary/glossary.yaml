openingAnswer: >-
  This glossary defines 40 terms a clinic owner meets when buying software in India, Kenya, the UAE and
  Nigeria, from EMR and EHR to ABDM, SHA, NABIDH and NHIA. Each definition says what the term is and what
  it asks of a clinic, with a link to the official source for every law or scheme and to the page on this
  site that goes deeper.
summary: >-
