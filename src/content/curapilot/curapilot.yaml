title: 'CuraPilot, the AI Copilot for Doctors: EasyClinic'
metaDescription: >-
  CuraPilot is an AI copilot for doctors: it reads past visits and checks the prescription during the
  consult. Every flag is advice; the clinician decides.
h1: An AI copilot for doctors that reads past visits during the consult
linkLabel: CuraPilot
eyebrow: CuraPilot, the clinical copilot from EasyClinic
openingAnswer: >-
  CuraPilot is EasyClinic's AI copilot for doctors: during the consult it reads the patient's past
  visits and checks the prescription before it is finalised, and the clinician decides what to do with
  each flag. In a 2025 preprint by Penda Health and OpenAI covering {fig:visits} visits at 15 Nairobi
  clinics that run on EasyClinic, clinicians who had AI Consult, a copilot inside that record, made
  {fig:diagnostic-errors} fewer diagnostic errors, though the paper does not name CuraPilot.
