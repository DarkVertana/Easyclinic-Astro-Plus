title: 'CuraPilot, the AI Copilot for Doctors: Easy Clinic'
metaDescription: >-
  CuraPilot is an AI copilot for doctors: it reads past visits and checks the prescription during the
  consult. Every flag is advice; the clinician decides.
h1: An AI copilot for doctors that reads past visits
linkLabel: CuraPilot
eyebrow: CuraPilot, the clinical copilot from Easy Clinic
openingAnswer: >-
  CuraPilot is Easy Clinic's AI copilot for doctors: it reads past visits and checks the prescription in
  the consult, and the doctor decides each flag. In a 2025 Penda Health and OpenAI preprint of
  {fig:visits} visits on Easy Clinic, clinicians with AI Consult made {fig:diagnostic-errors} fewer
  diagnostic errors; the paper does not name CuraPilot.
summary: >-
  Easy Clinic's AI copilot for doctors, and what the Penda Health study of {fig:visits} visits in Nairobi
  did and did not measure.
