editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: 'EasyClinic has been Penda Health''s record since 2017, so this page can say exactly where AI Consult ran, quote Penda''s chief medical officer and admit that the paper names AI Consult and not CuraPilot.'
  readsMachineWritten: 'The three leaks and the three intelligence rows keep the old page''s template shape, the consult walkthrough describes an alert a doctor cannot yet see in a screenshot, and the "does not name CuraPilot" caveat repeats in several places.'

notes:
  - 'Title changed from spec 4.1 ("CuraPilot: AI Clinical Copilot Proven on 39,849 Visits"): "proven" is banned and the study did not measure CuraPilot by name. H1 changed from "The AI copilot studied on 39,849 patient visits" for the same reason.'
  - 'Spec 5.3 promise ("the only clinic AI whose outcomes were measured on real visits and peer-reviewed") is not used: the 39,849-visit study is a preprint (korom-2025, peerReviewed false), it measured AI Consult, and "the only" has no source.'
  - 'Study honesty: the paper names AI Consult, embedded in Penda''s Easy Clinic EMR since 2017. It does not name CuraPilot (study.yaml note: confirm whether CuraPilot is AI Consult). If product confirms they are the same system, the opening answer, painBlocks clinical fix, studyCard intro and limits, and the "Did the study test CuraPilot?" FAQ can be rewritten.'
  - '"108 independent physicians" is written as text from the paper (verified in page-writing-rules); there is no fig token for it. "10% fewer investigation errors" is verified but left out because it has no fig token; add an investigation-errors figure to study.yaml to use it. The study FAQ splits its figures across two sentences rather than listing three in a row (spec 6.2).'
  - 'Removed for lack of a source: 67% fewer stockouts, 34% fewer denied claims, 45-day early warning, "28 organisations", "23% to under 4%" rejections, 99.97% uptime (spec 5.3 moves uptime to /trust), "100% clinician satisfaction", "22+ years". The Nature Health and Nature Medicine papers are separate studies and are not cited.'
  - 'Integration note names only the approach (EasyClinic, or an existing HIS through HL7 FHIR and open APIs). The live list (KenyaEMR, OpenMRS, M-Pesa, eTIMS, SMART e-claiming, SLADE, SHA, DHIS2) is left out: integration status is unconfirmed, and live Kenya pages say SHA and eTIMS are not yet supported. Restore an honest per-system list with states from src/data/integrations when confirmed.'
  - 'Cost: CuraPilot and the proof of concept have no published price, so spec 5.3 "What it costs" and the FAQ "How is it priced?" are left out. The stepList note says only that CuraPilot is not part of any plan on the price list (true of plans.yaml, which has no CuraPilot line).'
  - 'FAQs left out for lack of a confirmed fact: "Is it available in Kenya, India, UAE and Nigeria?", "How is it priced?", "What data leaves the clinic?". Replaced with "Did the study test CuraPilot?" and "Has the study been published in a journal?" (the plain form of "Is the study peer reviewed?", which the claims lint blocks as text).'
  - 'Walkthrough ("What changed for the clinician") has no screenshot: spec 12 asks for a live alert capture. Add media to the flowDiagram step "A pattern is flagged" when it exists. The example symptoms come from the mock alert on the live page and are illustrative.'
  - 'Operational and financial features (consumption forecasting, claim checks) are written without naming a product, because spec 1.2 and the /ai/ page put stock prediction and AI billing under Cura AI while the live CuraPilot page claims them. The rows stay because spec 5.3 says to keep this section; product should decide which name owns them.'
  - 'Staging "intelligence layer" bullets for voice commands, telemedicine and patient engagement are dropped: they overlap Cura AI and feature pages. The staging "drug interaction, allergy and dose" bullet is split in two to avoid a group of three.'
  - 'CTA "Download the study summary" (gated PDF) replaced with "Read the study" linking to arXiv, because no PDF exists yet. Dr Korom video (spec proof, VideoObject schema) left out: none exists.'
  - 'links.hub not set: /ai/ now has a content entry (ai.yaml), but the site tree (spec 3.1) lists /ai and /curapilot as siblings under AI. Set hub: /ai/ if the breadcrumb should run Cura AI > CuraPilot.'
  - 'Old URL /curapilot-ai/ already 301s here through src/data/redirects.yaml (spec 3.4), so redirectFrom is not set.'
