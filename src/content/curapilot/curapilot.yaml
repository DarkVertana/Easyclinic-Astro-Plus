sections:
  - discriminant: painBlocks
    value:
      id: three-leaks
      eyebrow: Why AI, why now
      heading: Three leaks hiding inside clinic operations
      intro: >-
        The information that would catch each of these is usually already in the record, spread across
        visits and sites.
      items:
        - heading: 'Clinical: blind spots across visits'
          body: >-
            No single visit holds enough information. A diagnosis can stay hidden across months of
            visits, sometimes at more than one facility, unless someone reads the record as one story.
          fix: >-
            CuraPilot reads past visits during the consult and flags patterns no single visit shows. In the
            Penda Health preprint, clinicians with AI Consult in their Easy Clinic record made
            {fig:diagnostic-errors} fewer diagnostic errors; the paper does not name CuraPilot.
        - heading: 'Operations: stockouts found too late'
          body: >-
            A medicine shortage usually shows up when the patient is already at the counter, not weeks
            before. The signal is there in what each store dispenses, but it is scattered across sites.
          fix: >-
            For clinics that dispense from Easy Clinic, Cura AI's stock prediction compares what each store
            dispenses with the stock left, and shows a shortage while there is still time to reorder. Its
            effect on stockouts is not yet measured.
        - heading: 'Revenue: claims lost at the prescription'
          body: >-
            Treatments get written without anyone checking what the patient's plan covers. The denial is
            decided in the consulting room, weeks before billing sees it.
          fix: >-
            Each claim is checked against the payer's rules before it leaves the facility, so an error is
            found while it can still be fixed, not weeks later when the denial comes back to billing. Its
            effect on claim denials is not yet measured.

  - discriminant: featureRows
    value:
      id: intelligence-layer
      eyebrow: What it does
      heading: One intelligence layer, working everywhere your clinic does
      intro: >-
        CuraPilot reads from the same live record the clinic already works in. The prescription the doctor
        signs is the same line the claim is checked against and the pharmacy reorders from.
      items:
        - heading: Clinical intelligence
          icon: stethoscope
          body: Guidance at the point of care, drawn from the patient in front of you.
          bullets:
            - Decision support during the consult, from this patient's own record
            - Drug interaction and allergy checks before the prescription is final
            - Abnormal lab and radiology results flagged in the consult
          link:
            label: See the EMR it reads from
            href: /features/emr/
        - heading: Operational intelligence
          icon: boxes
          body: The pharmacy shelf and every branch dashboard read from the same record.
          bullets:
            - Stock prediction, a Cura AI job, from how fast each medicine goes out
            - Live dashboards across every facility, showing today rather than last month
            - An end-of-day summary for the owner, written by Cura AI from the day's reports
          link:
            label: See Cura AI stock prediction
            href: /ai/
        - heading: Financial intelligence
          icon: wallet
          body: Claims checked before they leave, and one view of the network for leadership.
          bullets:
            - Every claim checked against the payer's rules before it leaves
            - Network-wide performance, with facility comparisons and trends
            - Bill codes suggested by Cura AI from the diagnosis and services in the note
          link:
            label: See insurance claims
            href: /features/insurance-claims/

  - discriminant: flowDiagram
    value:
      id: consult
      eyebrow: In the consult
      heading: What changes for the clinician during a consult
      intro: >-
        The consult runs as before, in the record the clinician already uses. What changes is the flags
        CuraPilot raises along the way, and the clinician decides what to do with each one.
      steps:
        - label: Open the visit
          body: >-
            The clinician opens the visit as usual. CuraPilot reads the same record as the consult goes on,
            with past visits and lab results already in it.
        - label: A pattern is flagged
          body: >-
            When symptoms repeat across earlier visits, such as fatigue and blurred vision over months,
            CuraPilot raises an alert for the clinician.
          check: Advisory by design
        - label: The prescription is checked
          body: >-
            Before it is final, the prescription is checked against the patient's allergies and other
            medicines. A dose that looks wrong is flagged.
        - label: The clinician decides
          body: >-
            Every flag is advice, not an order. The clinician acts on it or dismisses it, and the visit
            carries on as normal from there.
          check: Clinician decides
        - label: The claim goes out checked
          body: >-
            When the visit is billed, the claim is checked against the payer's rules before it leaves the
            facility, not after a denial comes back.

  - discriminant: studyCard
    value:
      id: study
      eyebrow: The Penda Health study
      heading: What the Penda Health study measured
      intro: >-
        The study measured AI Consult, a copilot that Penda Health and OpenAI ran inside Penda's Easy Clinic
        record. The paper does not name CuraPilot. Easy Clinic built the record the study took place in, and
        Penda has run on it since 2017.
      publication: korom-2025
      figures:
        - visits
        - diagnostic-errors
        - treatment-errors
        - history-errors
      method: >-
        Penda Health and OpenAI ran AI Consult, a copilot embedded in Penda's Easy Clinic record, during real
        patient visits. Then 108 independent physicians rated a random sample of the visit records for errors, comparing visits
        where the clinician had AI Consult with visits where the clinician did not.
      sites: >-
        15 Penda Health clinics in Nairobi, Kenya, all running on Easy Clinic, the record Penda has used
        since 2017.
      limits: >-
        The paper is a preprint on arXiv and has not yet been through a journal's review. Its figures are
        error rates that physicians judged from the visit records, not measures of how patients fared
        afterwards. It studied AI Consult and does not name CuraPilot.

  - discriminant: testimonialRow
    value:
      id: penda-health
      heading: Penda Health on working with Easy Clinic
      intro: Dr Robert Korom is chief medical officer at Penda Health, which has run on Easy Clinic since 2017.
      items:
        - robert-korom-partner
      layout: single
      usePullQuote: false

  - discriminant: splitContent
    value:
      id: where-it-runs
      eyebrow: Integration
      heading: Where CuraPilot runs
      body: >-
        CuraPilot sits on Easy Clinic, or on top of an existing hospital information system. On Easy Clinic
        it reads the record your clinicians already write in, so there is no second system to keep up to
        date.


        This page gives the approach, not a list of named systems. If your clinics run another system, name
        it when you ask for a proof of concept.
      link:
        label: Book a demo
        href: /contact-us/#book-a-demo
      secondary:
        label: Contact us
        href: /contact-us/
      media:
        kind: screenshot
        src: ../../assets/images/curapilot/AI-suggestions-1.png
        alt: An Easy Clinic visit with the chief complaints, vitals and diagnosis, and a suggestion set of investigations, medications and guidelines for the diagnosis picked
        frame: none

  - discriminant: stepList
    value:
      id: proof-of-concept
      heading: How a 90-day proof of concept runs
      intro: >-
        A proof of concept runs for 90 days in four stages on your own clinics' data, and ends with results
        measured against your baseline.
      steps:
        - title: Understand
          meta: Weeks 1 to 3
          body: >-
            We learn how your clinics work today and record the baseline that the rest of the proof of
            concept is measured against.
        - title: Deploy
          meta: Weeks 4 to 6
          body: CuraPilot goes live for your clinicians, on Easy Clinic or on your existing hospital information system.
        - title: Measure
          meta: Weeks 7 to 10
          body: The results are measured on your own data, against the baseline from the first stage.
        - title: Decide
          meta: Week 11 onwards
          body: With your own numbers in front of you, you decide whether to keep CuraPilot.
      note: >-
        CuraPilot is not part of any plan on the [price list](/pricing/), and this page does not publish its
        price or the price of a proof of concept.

  - discriminant: capabilityList
    value:
      id: capabilities
      eyebrow: Capabilities
      heading: Eleven capabilities, one intelligence layer
      intro: >-
        CuraPilot is not a single feature. It covers clinical, operational and financial work, all from the
        same record the clinic already uses.
      groups:
        - label: Clinical
          items:
            - title: Clinical decision support
              body: Guidance at the point of care, drawn from this patient's own record.
            - title: Safety alerts
              body: >-
                Drug interaction and allergy checks before the prescription is final, and a flag on any dose
                that looks wrong.
            - title: Diagnostic analysis
              body: Patterns across visits that no single visit shows, raised as an alert during the consult.
            - title: Voice documentation
              body: >-
                Talk through the consult and Cura AI drafts the note and prescription in the chart, for the
                doctor to confirm.
            - title: Lab and radiology results
              body: Results in the consult, with abnormal findings flagged.
        - label: Operations
          items:
            - title: Stock prediction
              body: >-
                How fast each medicine goes out, set against the stock left, so a shortage shows while there
                is time to reorder.
            - title: Operations analytics
              body: Live dashboards across every facility, showing today rather than last month.
        - label: Finance and leadership
          items:
            - title: Claim checks
              body: Every claim checked against the payer's rules before it leaves the facility.
            - title: Executive insights
              body: Network-wide performance for leadership, with facility comparisons and trends.
        - label: Patients
          items:
            - title: Patient engagement
              body: Follow-ups and reminders for patients, sent from the same record as the visit.
            - title: Telemedicine
              body: Video consults in the same record, so the patient's history is open during the call.

faq:
  - question: Does CuraPilot replace our EMR?
    answer: >-
      No, CuraPilot works inside the record you already keep. On Easy Clinic it reads the same patient
      record the clinician writes in, and on another hospital information system, notes and
      prescriptions stay in that system.
  - question: What did the Penda Health study show?
    answer: >-
      The 2025 preprint by Penda Health and OpenAI found that clinicians who had AI Consult made
      {fig:diagnostic-errors} fewer diagnostic errors and {fig:treatment-errors} fewer treatment errors
      than clinicians without it, across {fig:visits} visits at 15 clinics in Nairobi. The biggest drop
      was in history-taking errors, {fig:history-errors} fewer, as rated by 108 independent physicians on a
      random sample of the visit records.
  - question: Did the study test CuraPilot?
    answer: >-
      Not by name: the paper studied AI Consult, a copilot inside Penda's Easy Clinic record, and does not
      name CuraPilot. Easy Clinic built that record, and Penda Health has used it since 2017.
  - question: Does the clinician stay in control?
    answer: >-
      Yes, CuraPilot is advisory by design. It raises a flag during the consult, and the clinician decides
      whether to act on it, so the diagnosis and the prescription stay the clinician's.
  - question: What happens when the clinician disagrees with a flag?
    answer: >-
      The clinician dismisses it and carries on with the visit as they judge best. A flag is a second
      opinion to weigh, and the decision stays with the clinician.
  - question: Does CuraPilot work with the EMR we already use?
    answer: >-
      CuraPilot is built to sit on Easy Clinic or on top of an existing hospital information system. This
      page does not list named systems, so name yours when you ask for a proof of concept.
  - question: Has the study been published in a journal?
    answer: >-
      No, the {fig:visits}-visit study is a preprint that has not yet been through a journal's review. It
      was posted on arXiv (2507.16947) in July 2025, and its figures measure errors as physicians judged
      them from visit records rather than how patients fared afterwards.
  - question: How long does a proof of concept take?
    answer: >-
      A proof of concept takes 90 days in four stages: Understand in weeks 1 to 3, Deploy in weeks 4 to 6,
      Measure in weeks 7 to 10, and Decide from week 11. The results are measured on your own clinics'
      data, against your own baseline.

