  - discriminant: vendorList
    value:
      id: alternatives
      heading: Each alternative, from a HealthPlix clinic's point of view
      intro: >-
        Easy Clinic first, because this is our page, then the five others in alphabetical order. Each section
        says what changes if you move from HealthPlix, with the vendor's strengths and gaps listed below it.
      vendors:
        - id: easyclinic
          name: Easy Clinic
          us: true
          bestFor: A polyclinic that dispenses medicines or bills TPAs, or a chain run from one office
          url: https://www.easyclinic.io/
          body: >-
            Easy Clinic is clinic software from a Kolkata company that has run clinics since {fact:founded}, and
            {fact:doctors} doctors use it. Coming from HealthPlix, the first change is the price model: per
            doctor per month, {price:inr.professional.annual} on Professional or {price:inr.premium.annual} on
            Premium billed annually, or {price:inr.professional.quarterly} and {price:inr.premium.quarterly}
            billed quarterly. A reception login is included, and it books and bills but cannot open the EMR or
            write a prescription. Cura AI (documentation) drafts the note for the doctor to confirm on every
            plan, so there is no separate scribe to buy. Premium adds WhatsApp reminders and more than one
            location. Enterprise adds central control and SOP tracking across branches, and pharmacy and
            insurance claims come with it or as add-ons. There is no setup
            fee and no binding contract. Two things may keep you on HealthPlix: Easy Clinic does not run fully
            offline today, and for one doctor it costs more than HealthPlix Pro.
          pros:
            - Priced per doctor, with the reception login included and quarterly billing if you prefer.
            - Cura AI (documentation) on every plan, with no separate scribe subscription.
            - No binding contract and no setup fee.
            - Unlimited support and training on every plan, in {fact:trainingDays} short sessions of about two hours in all.
          cons:
            - Costs more per doctor than HealthPlix Pro at list price.
            - Does not run fully offline today, where HealthPlix describes an offline EMR.
            - WhatsApp reminders and a second location need Premium.
            - No free trial; you see it on a 20-minute demo instead.
          facts:
            - label: Published price
              value: >-
                {price:inr.professional.annual} (Professional) or {price:inr.premium.annual} (Premium) per doctor
                per month billed annually; Enterprise on a quote
            - label: Billed quarterly
              value: '{price:inr.professional.quarterly} or {price:inr.premium.quarterly} per doctor per month'
            - label: Going live
              value: In as little as {fact:goLiveDays} days from the demo
            - label: Ratings
              value: '{fact:capterraRating} on Capterra and {fact:googleRating} on Google'
              source: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/

        - id: doctors-app
          name: Doctors App
          bestFor: One doctor who wants a low yearly price with two staff logins included
          url: https://doctorsapp.in/
          body: >-
            Doctors App sells EMR and hospital software, and says it serves 5,000+ doctors from 18 specialities.
            Like HealthPlix, it prices its clinic plans by the year before 18% GST and prints prescriptions in
            14 languages. The difference is what the price names: Silver is ₹10,999 a year for one doctor with
            two staff logins, and Gold is ₹16,999 with three. Both plans include appointments, digital
            prescriptions, lab report uploads and help uploading old patient data. WhatsApp credit points are
            limited on Silver and included on Gold, while lab and pharmacy are marked "as per need" on both.
            Doctors App also offers an AI scribe that turns a spoken consultation into SOAP notes, though neither
            clinic plan lists it. It describes itself as ABDM compliant by NHA, and it refunds the fee in full if
            you are not satisfied within the first 7 days. It does not describe an offline mode, and it has
            one written review on Techjockey.
          pros:
            - ₹10,999 a year for one doctor with two staff logins, before GST.
            - Help uploading old patient data on both clinic plans.
            - An AI scribe that writes SOAP notes from the spoken consultation.
            - A full refund if you are not satisfied within the first 7 days.
          cons:
            - Each clinic plan covers one doctor.
            - No offline mode described.
            - The AI scribe and pharmacy are not listed as included in either plan.
            - Five ratings and one written review on Techjockey.
          facts:
            - label: Published price
              value: ₹10,999 (Silver) or ₹16,999 (Gold) a year per doctor, before 18% GST
              source: https://doctorsapp.in/
              checkedOn: 2026-09-26
            - label: Staff logins
              value: Two on Silver, three on Gold
              source: https://doctorsapp.in/
              checkedOn: 2026-09-26
            - label: ABDM
              value: Describes itself as "ABDM compliant by NHA"
              source: https://doctorsapp.in/
              checkedOn: 2026-09-26
            - label: Review score
              value: 4.5 on Techjockey from 5 ratings and 1 review
              source: https://www.techjockey.com/detail/doctors-app
              checkedOn: 2026-09-26

        - id: eka-care
          name: Eka Care
          bestFor: A doctor or small group that wants each plan's doctors and staff named in the price
          url: https://www.eka.care/
          body: >-
            Eka Care sells Eka Doc, an EMR for doctors, beside a patient health app and the EkaScribe AI scribe,
            and says 90K+ doctors have been onboarded. Its plans say who they cover, which HealthPlix's do not:
            Eka Doc Plus is ₹16,999 a year for one doctor and two staff, and Eka Clinic Pro ₹1,00,000 for five
            doctors and 15 staff, both before 18% GST, and extra seats have published prices. WhatsApp messages
            cost one Eka credit, or ₹1, each, and an in-clinic pharmacy is an add-on
            from ₹10,999 a year through an eVital integration. EkaScribe is priced on its own, at ₹1,499 a month
            per doctor or free for five consultations a day, and it also works inside other web-based EMRs
            through a Chrome extension. Eka Care says it is ABDM compliant and NHA approved, and offers a full
            refund within the first two weeks. It does not describe an offline mode, and it has a single review
            on Capterra.
          pros:
            - Plans that name the doctors and staff they cover, up to five doctors and 15 staff on Clinic Pro.
            - EkaScribe has a published price and a free tier of five consultations a day.
            - Extra seats at published prices, from ₹8,000 for a basic seat.
            - A full refund within the first two weeks.
          cons:
            - Costs more than HealthPlix Pro for one doctor, ₹16,999 against ₹12,000, both before GST.
            - WhatsApp is charged per message, and the scribe is a separate subscription.
            - No offline mode described.
            - One review on Capterra, scoring 1.0, and none on Techjockey.
          facts:
            - label: Published price
              value: >-
                ₹16,999 (Eka Doc Plus) or ₹18,749 (Eka Doc Pro) a year for one doctor and two staff, ₹1,00,000
                (Eka Clinic Pro) for five doctors and 15 staff, before 18% GST
              source: https://www.eka.care/practice-management/plan-pricing
              checkedOn: 2026-09-26
            - label: AI scribe
              value: EkaScribe, ₹1,499 a month per doctor billed monthly; free plan limited to 5 consultations a day
              source: https://ekascribe.ai/
              checkedOn: 2026-09-26
            - label: ABDM
              value: Lists "ABDM Compliant" and "NHA Approved" on its page for doctors
              source: https://www.eka.care/s/for-doctors
              checkedOn: 2026-09-26
            - label: Review score
              value: 1.0 on Capterra from 1 review
              source: https://www.capterra.com/p/10006107/Eka-Care/
              checkedOn: 2026-09-26
            - label: Techjockey
              value: No reviews yet
              source: https://www.techjockey.com/detail/eka-care
              checkedOn: 2026-09-26

        - id: healthray
          name: Healthray
          bestFor: A clinic that may grow into a hospital, or wants the option of an on-premise install
          url: https://healthray.com/
          body: >-
            Healthray leads with hospital software, and it sells clinic modules on the same platform; it
            says 2,500+ hospitals and clinics and 5,000+ doctors use it. It counts price by care centre rather
            than by doctor: ₹30,000 a year for up to 10 users on Clinical Management Basic, or ₹36,000 on
            Advanced, which adds the EMR, notes, prescriptions and pharmacy, billed yearly with taxes extra. The
            same cards show ₹499 and ₹699 per user per month, so ask which applies to you. Additional providers
            and the patient app cost extra, and the yearly charge can be revised for inflation. The clinic
            software lists SMS and WhatsApp reminders and voice-to-note transcription, and a clinic that grows
            can switch on inpatient wards and TPA claims without moving systems. It can also be installed
            on-premise, an option to ask about if HealthPlix's offline mode is why you chose it. Migration from
            registers or old software is included in every plan, and most clinics go live in about 7 days.
            There is a free trial.
          pros:
            - Migration from registers or old software included in every plan.
            - On-premise or hybrid installation on offer.
            - SMS and WhatsApp reminders, and voice-to-note transcription.
            - Inpatient modules on the same system if the clinic grows.
            - A free trial, with no credit card.
          cons:
            - The plan with the EMR is ₹36,000 a year per care centre, beside a ₹699 per-user figure on the same card.
            - Additional providers and the patient app cost extra.
            - The yearly charge can be revised for inflation.
          facts:
            - label: Published price
              value: >-
                ₹30,000 (Basic) or ₹36,000 (Advanced) a year per care centre, up to 10 users, taxes extra; the
                same cards show ₹499 or ₹699 per user per month
              source: https://healthray.com/pricing/
              checkedOn: 2026-09-26
            - label: Going live
              value: Most clinics in about 7 days, with migration from registers or old software included
              source: https://healthray.com/clinic-management-software/
              checkedOn: 2026-09-26
            - label: ABDM
              value: Says it is NHA-approved and ABDM compliant, with ABHA creation at registration
              source: https://healthray.com/
              checkedOn: 2026-09-26
            - label: Review score
              value: 5.0 on Techjockey from 21 reviews (Healthray EMR listing)
              source: https://www.techjockey.com/detail/healthray-emr
              checkedOn: 2026-09-26
            - label: SoftwareSuggest
              value: 4.7 from 7 reviews (Healthray HIMS listing)
              source: https://www.softwaresuggest.com/healthray
              checkedOn: 2026-09-26

        - id: mocdoc
          name: MocDoc
          bestFor: A clinic that runs a lab or a pharmacy, or several branches, with one vendor
          url: https://mocdoc.com/
          body: >-
            MocDoc, based in Chennai, sells clinic, hospital, laboratory and pharmacy software, and says 30k+
            doctors in 10+ countries use it. Against HealthPlix, its case is for a clinic that also runs a lab
            or a pharmacy. The clinic software follows one doctor's appointments across branches in a combo
            view and sends notifications by WhatsApp as well as SMS and email. Case sheets come in templates for 15+ specialities with ICD-10 coding. Its AI work is
            clinical decision support built on AIIMS guidance for conditions such as diabetes and hypertension,
            with contraindication and drug interaction alerts, and it does not describe AI note drafting.
            MocDoc says its software is ABDM compliant, with ABHA creation. It publishes no prices, so you need a
            quote to compare it with HealthPlix's ₹12,000, and it describes itself as cloud-based without
            describing an offline mode. Its review record is the largest on this page, though it belongs to the hospital
            product.
          pros:
            - Clinic, hospital, lab and pharmacy software from one vendor.
            - WhatsApp notifications, and a combo view for a doctor who works across branches.
            - Clinical decision support built on AIIMS guidance.
            - 4.9 on SoftwareSuggest from 213 reviews.
          cons:
            - No published prices.
            - No AI note drafting described.
            - No offline mode described; MocDoc calls itself cloud-based.
            - The large review count is for MocDoc HIMS, its hospital product, not the clinic software.
          facts:
            - label: Published price
              value: Not published (checked 26 September 2026)
              source: https://mocdoc.com/clinic-management-software
              checkedOn: 2026-09-26
            - label: ABDM
