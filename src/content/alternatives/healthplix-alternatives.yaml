              checkedOn: 2026-09-26

        - id: practo-ray
          name: Practo Ray
          bestFor: A clinic with several doctors, or one whose patients book on Practo.com
          url: https://www.practo.com/providers/clinics/ray
          body: >-
            Ray is Practo's clinic management software, and Practo says 50,000+ doctors in 5 countries use it.
            Its price is per plan, not per doctor: CM Atom is ₹999 a month on a one-year term for up to 50
            doctors, and Clinic Management ₹1,499 a month on one year, or ₹999 on four years, for unlimited
            doctors. For a clinic with several doctors, one plan price covers all of them. Both Ray plans
            include the calendar, billing, patient charting, SMS reminders and Practo.com integration, and both
            list "No Ads". Online payments through Ray Payment Solution cost 2% or 1.8% a transaction. The plans
            page mentions neither WhatsApp nor AI note drafting. Practo's support team helps move data from your
            existing software, and a 7-day free trial has the features of the top plan. The agreement renews a
            year at a time unless you give 60 days' notice, with a pro rata refund if you cancel. Practo says Ray
            is ABDM compliant.
          pros:
