  - discriminant: prose
    value:
      id: staying
      heading: When staying on HealthPlix is the better choice
      body: |
        A switch means new habits at the prescription pad, so it should buy you something. HealthPlix is the only product on this page that [calls itself an offline EMR](https://www.healthplix.com/), and its [October 2023 launch post](https://blogs.healthplix.com/product-updates/revolutionizing-healthcare-the-launch-of-offline-emr-for-doctors-in-india/) says doctors can open records and write prescriptions without internet, with the data syncing when the connection returns. If your clinic loses its line during OPD hours, no alternative here describes an offline EMR in those terms, and Easy Clinic does not run fully offline today.

        For one doctor, HealthPlix Pro at ₹12,000 a year before GST also costs less than Eka Care or Easy Clinic at list price. And if the gap you found is the multi-clinic setup or the Plix AI prescription checks, [Elite](https://www.healthplix.com/pricing-1) adds both for ₹18,000 a year. Ask HealthPlix about the gap before you move.

  - discriminant: decisionMatrix
    value:
      id: which-to-choose
      heading: Which one to choose
      intro: >-
        Four groups, each tied to a published fact. If none of them sounds like your clinic, the section above
        may be the answer.
      options:
        - title: Choose Easy Clinic if
          us: true
          items:
            - >-
              You want the price per doctor in writing, with a reception login that books and bills included.
            - >-
              You want the AI scribe in the plan price: Cura AI (documentation) is on every plan from
              {price:inr.professional.annual} per doctor per month.
            - You would rather pay by the quarter, with no binding contract and no setup fee.
            - You dispense medicines or bill TPAs, since pharmacy and insurance claims come with Enterprise or as add-ons.
            - >-
              You run a chain from one office: Enterprise adds central control and SOP tracking across branches,
              and the largest chain on Easy Clinic has {fact:largestChain} locations.
        - title: Choose Doctors App or Eka Care if
          items:
            - >-
              You are one doctor and want the staff logins named in the yearly price: two on Doctors App Silver
              at ₹10,999, or two on Eka Doc Plus at ₹16,999, both before GST.
            - >-
              You want an AI scribe with a published price. EkaScribe is ₹1,499 a month per doctor, or free for
              five consultations a day.
            - You want a refund window while you settle in, 7 days on Doctors App or two weeks on Eka Care.
            - >-
              You run a small group and want one bundle: Eka Clinic Pro is ₹1,00,000 a year for five doctors and
              15 staff.
        - title: Choose Practo Ray if
          items:
            - Your patients already book you on Practo.com, since both Ray plans include Practo.com integration.
            - You have many doctors and want one price for all of them, ₹999 a month for up to 50 on CM Atom.
            - You want a pro rata refund for the unused months if you cancel, which Practo's Ray agreement gives.
            - You want to try it first, with a 7-day free trial of the top plan's features.
        - title: Choose Healthray or MocDoc if
          items:
            - >-
              Your clinic has beds, or will. Healthray switches on inpatient wards and TPA claims on the same
              system.
            - >-
              You run a lab or a pharmacy with the clinic. MocDoc sells software for both, and Healthray's
              ₹36,000 Advanced plan includes pharmacy.
            - Your internet is unreliable and you want the option of an on-premise install, which Healthray offers.
            - You want a long review record, such as MocDoc HIMS at 4.9 on SoftwareSuggest from 213 reviews.

  - discriminant: stepList
    value:
      id: moving-off-healthplix
      heading: Moving off HealthPlix
      intro: >-
        Your records are the part of the move that needs planning, and HealthPlix's terms leave the export to
        its discretion, so the order matters. These steps apply whichever alternative you choose.
      steps:
        - title: Check your renewal date
          meta: Before you pick a date
          body: >-
            HealthPlix's [published prices](https://www.healthplix.com/pricing-1) are yearly, and its [terms of
            service](https://www.healthplix.com/terms-and-conditions/termsandconditions-1) describe termination
            and the data export but say nothing about refunds. Ask HealthPlix in writing what happens to the
            unused part of your year, and if there is no refund, plan the move for the end of the year you have
            paid for.
        - title: Ask for the export while you can still log in
          meta: Before you cancel
          body: >-
            Clause 8 of the terms says that on termination your access ends and your information may be
            destroyed, subject to any retention the law requires, and that HealthPlix will, "at its discretion",
            make "reasonable efforts" to let you take a backup or export in a suitable electronic format. Ask
            for the export while your plan is running, and ask what it contains: patient details, visit notes,
            prescriptions and uploaded reports.
        - title: Open the export before you cancel
          body: >-
            Pick five patients you saw last month and find each one's last prescription in the export. If a
            record is missing or will not open, raise it with HealthPlix while you still have access.
        - title: Get the import in writing
          body: >-
            [Healthray](https://healthray.com/clinic-management-software/) includes migration from registers or
            old software in every plan, [Practo](https://www.practo.com/providers/clinics/ray/plans) says its
            support team helps migrate data from existing software, [Doctors App](https://doctorsapp.in/) helps
            upload old patient data on both clinic plans, and [Eka Care](https://www.eka.care/s/for-doctors)
            lists data migration among its features. MocDoc does not publish it. Easy Clinic moves your patient
            list across as part of going live and does not list what else comes across. Whichever vendor you
            choose, agree in writing what will come across before you sign.
        - title: Move the booking links on the day
          meta: Elite clinics
          body: >-
            On [Elite](https://www.healthplix.com/pricing-1), patients can book through your Google Business
            Profile and a HealthPlix booking website. Change both links on the day you switch, so no patient
            books into a system you have left.
        - title: Plan the first week at the new prescription pad
          body: >-
            HealthPlix advertises a prescription in 30 seconds, so expect a new pad to feel slower until the
            habits form. Ask each vendor how training runs. Easy Clinic's is {fact:trainingDays} short sessions of about two
            hours in all, and a clinic can be live in as little as {fact:goLiveDays} days from the demo.
      note: >-
        For the Easy Clinic side of the move, [switching to Easy Clinic](/switch/) sets out the four steps from the
        demo to your first day.

