  - discriminant: vendorList
    value:
      id: alternatives
      heading: Each alternative in detail
      intro: >-
        EasyClinic first, because this is our page, then the five others in alphabetical order, with no ranking
        between them. Each gets the same structure: what changes when you move from Ray, what it costs, where it
        is strong and where it falls short.
      vendors:
        - id: easyclinic
          name: EasyClinic
          us: true
          bestFor: Clinics that want AI note drafting on every plan, and WhatsApp reminders and branches from Premium
          url: https://www.easyclinic.io/
          body: >-
            EasyClinic is clinic software from a Kolkata company that has been running clinics since
            {fact:founded}, used by {fact:doctors} doctors in {fact:countries} countries. We make it, so weigh
            this section with that in mind. The first change from Ray is how you pay: Ray prices the plan, and
            EasyClinic prices the doctor, at {price:inr.professional.annual} a month on Professional billed
            annually with the reception login included, so a group pays more than on CM Atom. What the price
            buys is Cura AI note drafting on every plan, and on Premium, at {price:inr.premium.annual}, WhatsApp
            reminders and messages and more than one location. Pharmacy and lab management are add-ons, or part
            of Enterprise. There is no binding contract, and you can pay a quarter at a time. Training runs over
            {fact:trainingDays} days, about two hours in all. EasyClinic does not run fully offline today and is
            not a full hospital information system. None of its plans includes a patient listing like
            Practo.com, so keep your free Practo Profile if patients find you there.
          pros:
            - Cura AI note drafting on every plan, including Professional.
            - WhatsApp reminders and more than one location on Premium, at {price:inr.premium.annual} per doctor per month.
            - No binding contract, and quarterly billing if you do not want to pay for a year.
            - Hundreds of customisation options at no charge, with unlimited support and training.
          cons:
            - Costs more than Ray's CM Atom at list price, and the gap grows with each doctor.
            - Does not run fully offline today.
            - No patient listing like Practo.com on any plan.
            - Not a full hospital information system for wards and theatres.
          facts:
            - label: Published price
              value: >-
                {price:inr.professional.annual} (Professional) or {price:inr.premium.annual} (Premium) per doctor
                per month billed annually; {price:inr.professional.quarterly} or {price:inr.premium.quarterly}
                billed quarterly
            - label: Going live
              value: In as little as {fact:goLiveDays} days from the demo
            - label: Rating
              value: '{fact:capterraRating} on Capterra'
              source: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/

        - id: docengage
          name: DocEngage
          bestFor: Clinics that run their own marketing and want a healthcare CRM from the same vendor
          url: https://www.docengage.in/
          body: >-
            DocEngage, whose site says it is made in Bangalore, sells a healthcare CRM alongside clinic, EHR,
            telehealth, home care and hospital software. Its clinic software covers multi-centre scheduling, a rate card per location,
            pharmacy with inventory, queues, treatment packages and 80+ reports, and lists integrations with your
            website, Facebook, IVR, SMS, email and WhatsApp. The price list opens per user, billed annually: ₹499
            a month on Clinical Management Basic and ₹699 on Advanced, which adds the EMR, notes, prescriptions
            and pharmacy. A second tab prices a care centre for up to 10 users at ₹30,000 or ₹36,000 a year, the
            same figures Healthray publishes. Taxes are extra. So are additional providers and the patient app,
            and the yearly charge can be revised for inflation. For a clinic leaving Ray, its pricing FAQ says
            DocEngage takes care of migration for clinics switching from other software, and there is a one-week
            trial. We found no AI note drafting on the pages we read.
          pros:
            - A healthcare CRM with lead management from the same vendor.
            - Multi-centre scheduling and a rate card per location.
            - Published prices per user, or per care centre for up to 10 users.
            - Says it takes care of migration for clinics switching from other software.
          cons:
            - No AI note drafting described on the pages we read.
            - The CRM is priced separately, from ₹96,000 a year per care centre.
            - The yearly charge can be revised for inflation.
            - Few directory reviews, 3 on SoftwareSuggest.
          facts:
            - label: Published price
              value: >-
                ₹499 (Basic) or ₹699 (Advanced) per user per month billed annually, or ₹30,000 or ₹36,000 a year
                per care centre for up to 10 users; taxes extra
              source: https://www.docengage.in/pricing
              checkedOn: 2026-09-26
            - label: Healthcare CRM
              value: From ₹96,000 a year per care centre for up to 10 users
              source: https://www.docengage.in/pricing
              checkedOn: 2026-09-26
            - label: Review score
              value: 4.7 on SoftwareSuggest from 3 reviews (DocEngage EHR listing)
              source: https://www.softwaresuggest.com/docengage
              checkedOn: 2026-09-26

        - id: doctors-app
          name: Doctors App
          bestFor: One doctor who wants a low yearly price with staff logins included
          url: https://doctorsapp.in/
          body: >-
            Doctors App sells EMR and hospital software and says 5,000+ doctors use it. Its two clinic plans each
            cover one doctor: Silver at ₹10,999 a year with two staff logins, and Gold at ₹16,999 with three,
            both before 18% GST. That is a yearly price per doctor, so the total grows with each doctor you add,
            where Ray's CM Atom covers up to 50 doctors on one price. Both plans include appointments, digital
            prescriptions, lab report uploads, speciality modules and clinic analytics, along with help uploading
            old patient data. The site also says patient data can be moved across from other EMRs, which matters
            when you arrive with a Ray export. WhatsApp message credits are limited on Silver and included on
            Gold, and Gold offers the clinic's own WhatsApp number as needed.
            Doctors App offers an AI scribe that turns a spoken consultation into SOAP notes, though neither
            clinic plan lists it. Lab and pharmacy are marked "As Per Need" on both plans. It promises a full
            refund if you are not satisfied within the first 7 days.
          pros:
            - ₹10,999 a year for one doctor with two staff logins, before GST.
            - Help uploading old patient data on both clinic plans.
            - WhatsApp credits on both plans, and the clinic's own number as an option on Gold.
            - A full refund if you are not satisfied within the first 7 days.
          cons:
            - Each plan covers one doctor.
            - The AI scribe is not listed in either clinic plan.
            - Lab and pharmacy are marked "As Per Need" rather than included.
            - Few directory reviews, 5 ratings and 1 written review on Techjockey.
          facts:
            - label: Published price
              value: ₹10,999 (Silver) or ₹16,999 (Gold) a year per doctor, before 18% GST
              source: https://doctorsapp.in/
              checkedOn: 2026-09-26
            - label: Moving records in
              value: Assistance in uploading old patient data on both clinic plans
              source: https://doctorsapp.in/
              checkedOn: 2026-09-26
            - label: Review score
              value: 4.5 on Techjockey from 5 ratings and 1 review
              source: https://www.techjockey.com/detail/doctors-app
              checkedOn: 2026-09-26

        - id: healthplix
          name: HealthPlix
          bestFor: A doctor who wants a fast prescription in the patient's language, online or offline
          url: https://www.healthplix.com/
          body: >-
            HealthPlix is a Bengaluru company whose home page calls its product India's largest online and
            offline EMR, used by 14,000+ doctors in 370+ cities. It quotes a yearly price where Ray quotes a
            monthly one: Pro costs ₹12,000 a year and Elite ₹18,000, both before 18% GST, and the pricing page
            does not say whether that is per doctor or per clinic. Both plans include the speciality OPD EMR,
            teleconsultation, billing for the doctor's staff, a patient queue and drug interaction checks. Elite
            adds the Plix AI tools, such as Quick Rx and past-visit summaries, a multi-clinic setup, an
            appointment booking website and 5,000 free credits for patient messages. H.A.L.O records the
            consultation and drafts a summary and the prescription, but neither published plan lists it.
            Prescriptions can be shared in 14 languages. Its SPOT mobile app sends prescriptions by SMS or
            WhatsApp, though neither plan names WhatsApp. The pages we read name no pharmacy module and say
            nothing about moving records in from other software.
          pros:
            - Describes itself as an online and offline EMR.
            - Published yearly prices of ₹12,000 (Pro) and ₹18,000 (Elite), before GST.
            - Prescriptions in 14 languages.
            - H.A.L.O drafts the note and prescription from the recorded consultation.
          cons:
            - The AI tools and the multi-clinic setup are on Elite only.
            - The pricing page does not say whether the price is per doctor or per clinic.
            - Pharmacy is not named, and WhatsApp appears only on the SPOT app page, not in either plan.
            - Few directory reviews, 4 on SoftwareSuggest and none on Capterra.
          facts:
            - label: Published price
              value: ₹12,000 (Pro) or ₹18,000 (Elite) a year, before 18% GST
              source: https://www.healthplix.com/pricing-1
              checkedOn: 2026-09-26
            - label: AI for the note
              value: H.A.L.O records the consultation and drafts a summary and the prescription
              source: https://www.healthplix.com/halo
              checkedOn: 2026-09-26
            - label: Review score
              value: 4.5 on SoftwareSuggest from 4 reviews; 4.3 on Techjockey from 6
              source: https://www.softwaresuggest.com/healthplix
              checkedOn: 2026-09-26

        - id: healthray
          name: Healthray
          bestFor: Clinics that may grow into a hospital on the same system
          url: https://healthray.com/
          body: >-
            Healthray sells clinic and hospital software on one platform and says 2,500+ clinics and hospitals
            use it. It prices each care centre for up to 10 users: ₹30,000 a year on Clinical Management Basic and
            ₹36,000 on Advanced, which adds the EMR, notes, prescriptions and pharmacy, billed yearly. The same
            cards also show ₹499 and ₹699 per user per month, so ask which applies. Taxes are extra. So are
            additional providers and the patient app, and the yearly charge can be revised for inflation. The
            clinic software lists SMS and WhatsApp reminders and voice-to-note transcription, and inpatient wards
            and TPA claims can be switched on later without migrating. Two points matter to a clinic leaving Ray:
            migration from registers or old software is included in every plan, and Healthray says most clinics
            go live in about 7 days. It also offers on-premise and hybrid installation, and a one-week trial.
          pros:
            - Migration from registers or old software included in every plan.
            - SMS and WhatsApp reminders, and voice-to-note transcription.
            - On-premise or hybrid installation as well as cloud.
            - Inpatient and pharmacy modules on the same system when the clinic grows.
          cons:
            - The ₹30,000 Basic plan does not list the EMR; that needs Advanced.
            - Additional providers and the patient app cost extra.
            - The yearly charge can be revised for inflation.
            - Customisation needs approval from its engineering team, and charges apply.
          facts:
