openingAnswer: >-
  If you are leaving Practo Ray, this page compares six alternatives sold to Indian clinics: EasyClinic,
  which we make, HealthPlix, MocDoc, Healthray, Doctors App and DocEngage. Which one fits depends on what
  Ray's published plans do not give you, such as WhatsApp reminders, AI help with the note, a pharmacy
  counter or inpatient beds, or a shorter commitment than Ray's one-year term, which renews unless you give
  60 days' notice.
