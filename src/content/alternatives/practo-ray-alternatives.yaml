        - id: mocdoc
          name: MocDoc
          bestFor: Clinics that also run a pharmacy or inpatient beds
          url: https://mocdoc.com/
          body: >-
            MocDoc sells clinic, hospital, laboratory and pharmacy software, and says it has 1,500+ customers in
            10+ countries. It is first on SoftwareSuggest's list of Practo Ray alternatives, where its hospital
            system, MocDoc HIMS, has 4.9 from 213 reviews, and the MocDoc HMS listing on Capterra has 4.9 from 44
            reviews. Those are the largest review counts of any product on this page. Its clinic front desk has a
