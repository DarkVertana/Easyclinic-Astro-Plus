  - discriminant: decisionMatrix
    value:
      id: which-to-choose
      heading: Which one to choose, or whether to stay
      intro: >-
        Four lists, because several alternatives solve the same problem and staying on Ray is sometimes the
        right answer. Pick the one that sounds most like your clinic.
      options:
        - title: Stay on Practo Ray if
          items:
            - >-
              Most of your new patients book on Practo.com, and you want those bookings in your calendar. Both Ray
              plans list a Practo.com integration, which Ray's agreement says includes online appointments from
              Practo.com.
            - >-
              Several doctors share one budget. CM Atom covers up to 50 doctors for ₹999 a month on a one-year
              term, while Doctors App and EasyClinic charge for each doctor, and Healthray and DocEngage cap a
              care centre at 10 users.
            - SMS reminders are enough, with 3,000 or 8,000 free SMS depending on the plan.
            - >-
              You want the renewal price fixed. Practo says a plan's renewal price will not change, where
              Healthray and DocEngage say their yearly charge can be revised for inflation.
            - >-
              Your front desk can keep working from an Android phone when the internet drops, since Ray's phone
              app keeps the schedule and patient contacts working offline, according to a 2016 Practo help
              article.
        - title: Move to EasyClinic if
          us: true
          items:
            - >-
              Your doctors finish notes after the last patient. Cura AI drafts the note on every plan, from
              {price:inr.professional.annual} per doctor per month.
            - >-
              Your patients answer on WhatsApp. WhatsApp reminders and messages come with Premium, at
              {price:inr.premium.annual} per doctor per month billed annually.
            - >-
              You run, or plan, more than one branch. Premium covers more than one location, and Enterprise adds
              central control of every location.
            - >-
              You want no year-long commitment. There is no binding contract, and you can pay a quarter at a
              time.
            - You want the software shaped to your clinic, with hundreds of customisation options at no charge.
        - title: Move to HealthPlix or Doctors App if
          items:
            - >-
              You are one doctor and want a low yearly price: ₹10,999 on Doctors App Silver with two staff
              logins, or ₹12,000 on HealthPlix Pro, both before 18% GST.
            - Your internet drops often, since HealthPlix describes itself as an online and offline EMR.
            - >-
              You want an AI scribe from a vendor whose one-doctor price is below EasyClinic's: HealthPlix's
              H.A.L.O and the Doctors App AI scribe both turn the conversation into notes, though neither is
              listed in a published plan, so ask what each adds to the price.
            - Your patients want the prescription in their own language, which both say they share in 14 languages.
        - title: Move to MocDoc, Healthray or DocEngage if
          items:
            - >-
              You run a pharmacy counter or inpatient beds alongside the clinic. MocDoc and Healthray sell those
              modules as well as clinic software.
            - >-
              You want one price per care centre rather than per doctor. Healthray and DocEngage publish ₹36,000
              a year for up to 10 users on the plan with the EMR.
            - >-
              You want help moving records in. Healthray includes migration from old software in every plan,
              and DocEngage says it takes care of migration.
            - You need on-premise or hybrid installation, which Healthray offers.
            - You want a vendor with many directory reviews, such as MocDoc HIMS at 4.9 from 213 reviews on SoftwareSuggest.

  - discriminant: stepList
    value:
      id: leaving-ray
      heading: Leaving Ray, whichever alternative you choose
      intro: >-
        The Practo steps come from Ray's subscription agreement and help centre, read on 26 September 2026.
        Those pages were first published between 2013 and 2017, so ask Practo to put anything that matters to
        you in writing.
      steps:
        - title: Find your renewal date
          meta: Practo agreement, clause 8.1
          body: >-
            Ray's [subscription
            agreement](https://help.practo.com/practo-instruction-and-policies/click-wrap-subscription-agreement-ray/)
            runs for one year and renews for another year automatically unless either side gives 60 days' notice
            before the term ends. Put the date 60 days before your renewal in the diary.
        - title: Give written notice
          meta: Practo agreement, clauses 8.2 and 3.2
          body: >-
            The same agreement lets you ask to end the subscription at any time with 60 days' written notice to
            the Practo address it gives. If you cancel, Practo refunds the unused period pro rata.
        - title: Export before you give notice
          meta: Ray settings
          body: >-
            Practo's [help
            centre](https://help.practo.com/practo-ray/settings/understanding-the-settings-of-your-practo-ray-account/)
            describes an Import/Export page in Ray's settings that emails four kinds of data: contacts,
            treatments, expenses and appointments. Prescriptions and clinical notes are not named there, so ask
            Practo in writing how to get them.
        - title: Keep your own copy
          meta: Practo agreement, clause 8.4
          body: >-
            After 30 days from termination, Practo has no obligation to keep your data and will then delete it,
            unless the law prevents it. When you end the subscription yourself, the agreement makes taking a
            copy first your responsibility, and it says end-users' data will not be available afterwards.
        - title: Ask the new vendor what it imports
          meta: Any alternative
          body: >-
            Healthray says migration from registers or old software is included in every plan, and Doctors App
            offers help uploading old patient data. DocEngage says it takes care of migration, while MocDoc and
            HealthPlix say nothing about it on the pages we read. Whoever you choose, get the list of Ray files
            they will bring across in writing before you sign.
        - title: If you choose EasyClinic
          meta: EasyClinic
          body: >-
            The switch runs in four steps: a demo on your own patient flow, training over {fact:trainingDays}
            days, data migration, and support from your first day. A clinic can be live in as little as
            {fact:goLiveDays} days after the demo. [Switching to EasyClinic](/switch/) sets out each step.
      note: >-
        Keep the overlap short. Pick one date after which every new booking goes into the new system, even if
        Ray is still paid up.

