faqHeading: Questions clinics ask about leaving Ray
faq:
  - question: Will we pay less if we leave Ray?
    answer: >-
      Not with three or more doctors: at list price, every alternative here that publishes a price costs more
      than Ray's CM Atom, which covers up to 50 doctors for ₹999 a month on a one-year term, or ₹11,988 a year.
      For one doctor, Doctors App's ₹10,999 a year is lower, though it is quoted before 18% GST and Practo's
      plans page does not say whether Ray's price includes GST, and DocEngage and Healthray show ₹499 per user
      per month on a basic plan that does not list the EMR. HealthPlix Pro is ₹12,000 a year before GST.
      EasyClinic Professional is {price:inr.professional.annual} per doctor per month billed annually, so it
      costs more than CM Atom from the first doctor, and MocDoc does not publish a price. Ask each vendor for the
      yearly total with tax for your doctors and front-desk logins.
    lastVerified: 2026-09-26
  - question: Do we lose our Practo.com profile if we leave Ray?
    answer: >-
      Probably not, though no Practo page addresses leaving Ray directly: its [Practo Pro app
      page](https://www.practo.com/practo-pro-app) lists Practo Profile, the listing patients find on
      Practo.com, as a free product, and its [Prime page](https://www.practo.com/providers/prime) says a
      clinic's profile stays on Practo, and patients can still search for it, without a Prime subscription.
      What Ray adds, according to its subscription agreement, is the ability to get online appointments from Practo.com into Ray, with feedback collection
      and record sharing listed beside it. Ask Practo in writing which of those stay with your profile once Ray
      ends.
    lastVerified: 2026-09-26
  - question: How much notice does Practo need before we can leave Ray?
    answer: >-
      Sixty days in writing. Ray's [subscription
      agreement](https://help.practo.com/practo-instruction-and-policies/click-wrap-subscription-agreement-ray/)
      runs for a year and renews for another year unless you give 60 days' notice before it ends, and it also
      lets you ask to end the subscription at any time on 60 days' written notice. If you cancel, Practo refunds
      the unused period pro rata. The version we read is dated 2017 on Practo's help centre, so ask Practo
      whether it is the one you signed.
    lastVerified: 2026-09-26
  - question: What happens to our Ray data after we cancel?
    answer: >-
      Practo will delete it once 30 days have passed after the agreement ends, unless the law prevents it:
      clause 8.4 says Practo has no obligation to keep your data after that, and that copying it before you end
      the subscription yourself is your responsibility. Ray's export, as Practo's [help
      centre](https://help.practo.com/practo-ray/settings/understanding-the-settings-of-your-practo-ray-account/)
      describes it, emails contacts, treatments, expenses and appointments. Prescriptions and clinical notes are
      not named, so ask Practo how to get them before you give notice.
    lastVerified: 2026-09-26
  - question: Will the new vendor move our Ray records across?
    answer: >-
      Some of them say they will help, but none of the six lists on its site which Ray files it imports, so get
      that in writing before you sign. Healthray says migration from registers or old software is included in
      every plan, and Doctors App offers help uploading old patient data on both clinic plans and says data can
      be moved from other EMRs. DocEngage says it takes care of migration for clinics switching from other
      software, while MocDoc and HealthPlix say nothing about it on the pages we read. On EasyClinic, data migration is one of the four onboarding steps on [Switching
      to EasyClinic](/switch/). Whoever you choose, what arrives is limited by what you can export from Ray.
    lastVerified: 2026-09-26
  - question: Ray's phone app works offline. Will we lose that if we leave?
    answer: >-
      Possibly, because only two of the six alternatives publish an offline or local option: HealthPlix calls
      itself an online and offline EMR, and Healthray offers on-premise and hybrid installation as well as
      cloud. EasyClinic does not run fully offline today. MocDoc and Doctors App describe cloud
      platforms, and DocEngage says nothing about it on the pages we read. Ray's Android app, according to a 2016
      Practo help article, keeps the schedule and patient contacts working offline, while new bills and
      reminders wait for a connection. Test any product on your own connection before you sign.
    lastVerified: 2026-09-26
  - question: Will our patients still see the records we shared through Practo after we leave?
    answer: >-
      Ray's agreement suggests not: clause 8.4 says that when a clinic ends its subscription itself, end-users'
      data will not be available after termination. The same
      [agreement](https://help.practo.com/practo-instruction-and-policies/click-wrap-subscription-agreement-ray/)
      calls the people who use your clinic's service end-users, and the [Ray
      plans](https://www.practo.com/providers/clinics/ray/plans) list sharing records with your patients as part
      of Ray. Ask Practo in writing what your patients will still see once Ray ends, and give them copies of
      anything they need before then.
    lastVerified: 2026-09-26

