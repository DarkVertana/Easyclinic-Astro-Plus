sections:
  - discriminant: painBlocks
    value:
      id: where-it-slips
      heading: Where a physiotherapy clinic loses track
      intro: >-
        Physiotherapy is often paid for as a course and delivered in sessions, and most of what goes
        missing falls between one session and the next.
      items:
        - heading: The package card at the front desk
          body: >-
            A patient pays for ten sessions in advance and gets a card that the desk ticks at each visit. By
            the seventh visit the card has stayed at home, and the receipt book shows two part payments
            that nobody has matched to the course.
          fix: >-
            On Premium the course is billed as one package treatment, with the advance and any part payment
            recorded against it, and each visit is written against the patient's session-wise treatment
            plan.
          href: /features/billing/
          linkLabel: Read how billing works
        - heading: The exercise sheet goes home and does not come back
          body: >-
            The home programme is written on a sheet the patient folds into a pocket. When a colleague
            takes the patient on the day you are away, the only copy of what was prescribed is in that
            pocket.
          fix: >-
            The exercise plan is created and stored on the patient's record, so whoever sees the patient
            next opens the whole visit history, exercises included, on one screen.
          href: /features/emr/
          linkLabel: Read how the chart works
        - heading: The patient who stops after session four
          body: >-
            The pain eases after the fourth session and the patient stops coming, halfway through the plan.
            Nobody calls, because the follow-up list is a page in the register that gets read when someone
            has time.
          fix: >-
            Book the rest of the course as recurring sessions at the first visit, and each booked session
            gets an automated reminder. SMS and email reminders come with every plan, and Premium adds
            WhatsApp.
          href: /features/whatsapp/
          linkLabel: Read how WhatsApp reminders work
        - heading: Two therapists, one machine at 11am
          body: >-
            Two therapists book patients who both need the same piece of equipment at 11am. The clash shows
            up when the second patient is already changed and waiting.
          fix: >-
            Equipment and assistants are booked inside the appointment slot, and the calendar shows each
            resource's bookings, so the desk sees the machine is taken at 11am before it offers that time
            to a second patient.
          href: /features/appointment-scheduling/
          linkLabel: Read how booking works

  - discriminant: featureRows
    value:
      id: course-of-treatment
      heading: Built around the course of treatment
      intro: >-
        A course of physiotherapy runs over weeks, so the record follows the course and each session is
        written against it. Premium, the plan for specialists, includes every row below, and the rows
        marked Premium are not on Professional.
      items:
        - heading: Session-wise treatment plans
          body: >-
            Set up a therapy programme for the condition in front of you, such as rehabilitation after
            surgery or a sports injury, and manage it session by session, with the patient's progress
            through the course on the same record.
        - heading: Goals and progress over time
          body: >-
            Record the patient's goals, such as less pain or better mobility, and monitor their progress
            against those goals over time. If you score pain or function on a paper form today, Premium
            lets you rebuild that form as a digital one with the form builder, and the therapist fills it
            in on the record at each session.
        - heading: Exercise plans on the record
          body: >-
            Therapists create and store a structured exercise plan for each patient, on the same record as
            the session notes. A colleague covering your list opens the record and sees the exercises the
            patient was given.
        - heading: Packages for a course of sessions
          plan: premium
          body: >-
            Package treatments are part of Premium. The course is billed as one package, and an advance or
            a part payment is recorded against the bill it belongs to, so the desk sees the balance
            straight away. Receipts and invoices can go to the patient on WhatsApp.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Recurring sessions and reminders
          body: >-
            Book the recurring sessions of a course in one go, alongside fixed-time appointments and
            walk-ins. Each session gets an automated reminder, and Premium adds WhatsApp to the SMS and
            email reminders every plan has.
          link:
            label: Read how booking works
            href: /features/appointment-scheduling/
        - heading: Video sessions for patients who cannot travel
          plan: premium
          body: >-
            On Premium, a video session is booked through the appointment screen and the fee can be
            collected online at booking. The therapist and the patient both join from a web browser on a
            computer or a phone, with no other software to install.
        - heading: Cura AI drafts the session note
          body: >-
            Cura AI (documentation) is included in every plan. It drafts the session note for the
            therapist to review and sign.
          link:
            label: Read how Cura AI works
            href: /ai/

  - discriminant: proofBlock
    value:
      id: ratings
      heading: How clinics rate EasyClinic
      intro: >-
        We do not yet have a physiotherapist's own words to put on this page. These are EasyClinic's
        public ratings, from clinics of every kind.
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'

  - discriminant: stepList
    value:
      id: training
      heading: How long does it take to learn EasyClinic?
      intro: >-
        About two hours, spread over {fact:trainingDays} days, and training is included in every plan. Each
        session is 20 to 40 minutes, short enough to fit between the morning and evening lists, so the
        clinic keeps treating patients while the team learns.
      steps:
        - title: 'Day 1: basic training'
          meta: 40 minutes
          body: >-
            The screens the front desk and the therapists use every day. Bring your receptionist, whose
            login is part of the plan.
        - title: 'Day 2: EMR scenario training'
          meta: 40 minutes
          body: >-
            You work through the chart on the kinds of case your clinic sees, from a first assessment to a
            follow-up session.
        - title: 'Day 3: practice exercises'
          meta: 20 minutes
          body: You work through exercises on your own, then bring back the questions that came up.
        - title: 'Day 4: road to expertise'
          meta: 20 minutes
          body: The shortcuts that make each note quicker, once the basics have become habit.
      note: >-
        From the demo, a clinic can be live in as little as {fact:goLiveDays} days.

faqHeading: Questions physiotherapy clinic owners ask
faq:
  - question: What does EasyClinic cost for a physiotherapy clinic?
    answer: >-
      Premium, the plan with package treatments and specialty templates, costs {price:inr.premium.annual}
      per doctor per month billed annually in India, or {price:usd.premium.annual} in US dollars.
      Professional, at {price:inr.professional.annual} or {price:usd.professional.annual}, has the chart
      and billing but no package treatments and no WhatsApp messages. Both include a reception login, and
      there is no binding contract on either.
  - question: Can I sell a package of sessions and see what the patient has paid?
    answer: >-
      Yes, on Premium, where package treatments are part of the plan: the course is billed as one
      package, and an advance or a part payment is recorded against that bill, so the balance shows at
      the desk. Professional does not include package treatments.
  - question: Can I track a patient's progress against their goals?
    answer: >-
      Yes, you record goals such as pain reduction or mobility improvement and monitor the patient's
      progress against them over time, on the same record as the treatment plan. If you already use a
      scoring form on paper, Premium lets you rebuild it as a digital form in your clinic's own layout.
  - question: Can I book a patient's whole course of sessions in advance?
    answer: >-
      Yes, the recurring sessions of a course can be booked together, with the equipment or assistant
      each one needs booked inside the same slot. Each session gets an automated reminder by SMS and
      email, and by WhatsApp on Premium.
  - question: Can I see patients by video?
    answer: >-
      Yes, on Premium, which includes video consultations: the therapist and the patient join from a web
      browser on a computer or a phone, with nothing to install. The fee can be collected online when the
      session is booked.
  - question: Does EasyClinic work without an internet connection?
    answer: >-
      No, EasyClinic does not run fully offline today: the cloud version needs an internet connection, so
      the clinic needs a working line while it sees patients. A self-hosted option also exists, where the
      system runs on the clinic's own server rather than in EasyClinic's cloud.

