editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The ticked package card and the exercise sheet that leaves in the patient's pocket are physiotherapy
    problems, and every capability comes from Easy Clinic's own physiotherapy pages, with a plan named only
    where plans.yaml names one; nothing on the page is specific to one country beyond the rupee price.
  readsMachineWritten: >-
    The page has no named physiotherapist, no screenshot and no number measured in a physiotherapy
    clinic, so the feature rows read like a capability list, and a physiotherapist will notice that no
    outcome measure is named and that sending home exercises to the patient on WhatsApp is not mentioned.

