  - 'Spec 5.15 must-have "home-exercise sharing on WhatsApp" is left out: neither live physiotherapy page says the exercise plan can be sent to the patient on WhatsApp (the live EMR page says only that prescriptions can be shared by print, WhatsApp, SMS or email, and that therapists can create and store exercise plans). Company to confirm whether the exercise plan goes to the patient on WhatsApp, with pictures or videos or as text only, and on which plan (WhatsApp messages are Premium in plans.yaml). Then add a feature row and a FAQ.'
  - 'Spec 5.15 must-have "outcome scores": the live page says only "Track patient goals (e.g., pain reduction, mobility improvement) and monitor their progress over time". Company to confirm which named outcome measures (for example VAS or NPRS for pain, ODI, NDI, LEFS) exist as ready physiotherapy templates, and whether a score is charted as a trend across sessions (the live page lists "Growth & Progress charts" without detail). The spec 12 screenshot "Physiotherapy session plan with outcome score" (six sessions, one score) depends on it. Until then the goals row offers only the Premium form builder for a clinic''s own paper scoring form.'
  - 'Company to confirm: how physiotherapists and physiotherapy assistants are licensed under per-doctor pricing (the page keeps the price list wording "per doctor per month" and adds no FAQ on it); whether a package shows sessions used and remaining; whether session-wise treatment plans, goal tracking, exercise plans and recurring-session booking are on Professional or need Premium (the live page lists them in the general EMR and scheduling sections, so the page gives them no plan badge, and the featureRows intro says only that Premium includes every row, not that unbadged rows are on Professional; specialty templates and your own forms are Premium per plans.yaml); what Cura AI drafts for a physiotherapy session, with one example note (spec 5.15 item 8); any devices or integrations used in physiotherapy (spec 5.15 item 6, section left out).'
