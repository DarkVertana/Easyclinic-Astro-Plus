  - 'Editor pass 2026-09-26: the opening answer and summary now tie only packages to Premium (the earlier "EasyClinic does this on its Premium plan" implied treatment plans and goals need Premium); the Cura AI row uses the site wording "drafts the note for review and sign" and no longer says it drafts "from the consultation"; the offline FAQ uses the home page wording (self-hosted option exists) instead of Enterprise private cloud hosting, which does not help a clinic without internet; the unsourced "a clinic bringing years of records across takes longer" was cut from the step note, as on the home page; the related-link and cost FAQ triads were cut to pairs.'
