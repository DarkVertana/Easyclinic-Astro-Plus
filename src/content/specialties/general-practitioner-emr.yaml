editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The history intake fields and the check-up and vaccination alerts come from EasyClinic's own general
    practitioner and family physician pages, and the plan split a GP meets is stated as it is: the EMR on
    Professional, the dispensary only on Enterprise or as a module.
  readsMachineWritten: >-
    The four pain scenes are composites rather than a named practice's day, and with no general
    practitioner quoted and no visit timed, a GP may find the two feature sections read like a capability
    list.

notes:
  - 'Grounding: stated plainly on the live /general-practitioner-emr/ and /family-physician-emr/ pages (retrieved 2026-09-26): customisable intake forms capturing chronic conditions, family and social history, obs-gynae details, substance use, alternative therapies, COVID history and immunisations, fed into the face sheet; auto-generated summaries and facesheets; charts of vitals, lab reports and clinical parameters; point-and-click documentation of chief complaints, history and vitals with auto-complete notes, diagnoses, investigations, referrals, follow-ups and patient guidelines; referral management, automated follow-up, drug interaction check, triage, image and document upload, multilingual prescriptions; prescriptions shared by print, WhatsApp, SMS or email; templates for common family medicine conditions (diabetes, hypertension, respiratory infections) and preventive care reminders for annual check-ups, vaccinations and screenings (family physician page); the FAQ lines on long-term tracking of diabetes and hypertension and on vaccinations and routine check-ups; token numbers, first-come-first-serve, docket numbers and priority patients, queue status and waiting times; one-click billing from a service list, part payments, refunds and invoice voiding with authorisation, discount authorisation, receipts by WhatsApp, SMS or email; video consults in the browser with online fees and a remote-consult line on the prescription. "Professional, the plan meant for general practitioners and physicians" rests on the live /pricing/ "Best suited for: general practitioners and physicians" (facts.md section 1); plans.yaml bestFor says "A doctor running their own clinic, with a receptionist", which is size wording owned by /solutions/solo-clinic/, so it is not quoted here.'
  - 'Recruit a named general practitioner testimonial (spec 5.15 item 9): a named GP or family physician on EasyClinic, with city, clinic and consent on file, added to src/data/testimonials/ and placed only on this page as a customer proofBlock or a single testimonialRow, ideally about the facesheet, chronic-condition charts or referrals. Dr Sanjay Teotia (general physician) is already placed on pricing/india.yaml, and his quote is about ease of use rather than a GP feature, so he is not used here. Until then the proof block is the Capterra and Google badges with no count (review counts are null in facts.yaml).'
  - 'Plan placement (company to confirm): plans.yaml puts "Patient records and the EMR" and "E-prescriptions" on Professional but does not say whether the intake form, the facesheet, vitals charts, preventive care alerts, referral management, triage, the drug interaction check or bilingual prescriptions are on Professional. The live GP page lists them in its general EMR section, so those rows carry no plan badge and the featureRows intro names only what Premium adds; nothing says the unbadged rows are on Professional. The family medicine condition templates are shown as Premium (specialty EMR templates and your own clinical forms in plans.yaml); if they are on Professional, drop the badge. Whether SMS and email delivery of prescriptions and receipts is on Professional is also unconfirmed (plans.yaml names only SMS and email reminders).'
  - 'Spec 5.15 template items left out for lack of a public fact (company to-do): (3) screenshots of each chart object; (4) a timed walkthrough of the most common GP visit (the walk-in section is untimed); (5) GP templates and forms named and counted (the live page names only diabetes, hypertension and respiratory infections, "such as", so no dataTable); (6) devices used in general practice, such as BP monitors, glucometers or ECG machines, and whether any connect (section left out); (8) which note types Cura AI drafts for a GP visit, with one example note; (9) the named GP testimonial above. Also to confirm: whether preventive care alerts follow a national immunisation schedule (India UIP, Kenya KEPI) or are set per patient, and by which channel they go out; whether a nurse or clinical assistant doing triage and vitals needs a paid licence; which prescription languages exist beyond English and Swahili.'
  - 'Dropped from the live pages: "Create and share in 30 seconds" and "invoices ready in less than 10 seconds" (unmeasured here); the two comparison tables ("Easy Clinic vs Other EMR" and "EMR Software Comparison for General Practitioner Clinics", unsourced competitor cells); "over 100 graphical dashboards"; "Reduces no-shows" (noShowReduction is null); AI-powered diagnostic support, differential diagnoses and ADR alerts (CuraPilot claims); AI-powered wait time management and AI two-way messaging; "Inventory for medicines & supplies Built-in" and the FAQ "Inventory management is included" (plans.yaml puts pharmacy and inventory on Enterprise or as a module; the page says so in the dispensing FAQ); patient self check-in and self-service intake on the phone (the patient portal and app are Enterprise; plan unclear); the "Advanced EMR for specialists" list (medical calculators, side-by-side past records, nurse intake, tabular Rx, growth and progress charts), because the live /pricing/ names "Advanced EMR for Specialists" as a Premium inclusion and the items are not tied to a plan; the "14-Day Free Trial, with an extra 30-Day Money Back Guarantee" and "try Easy Clinic absolutely free" lines (owner decision: no free trial); the shared testimonials (placed on other pages); HR, roster, incentive and commission plans, data warehouse, Power BI and Azure Data Factory (not GP-specific and plan unknown); "Where clinics lose time" filler (replaced by four GP-specific pains).'
  - 'No heroMedia and no media: screenshots do not exist yet. When the seeded demo tenant exists: the GP facesheet with history, immunisations and a BP chart as hero, the referral on the record, and the token queue at the desk. The four pains are illustrative general practice situations, not customers; "every two months" and "Saturday" are examples.'
  - 'Title 50 characters; meta description 150 characters with the $79 token resolved (154 in the lint, which counts a token as 7). H1 follows the brief rather than the spec 5.15 item 1 pattern, whose colon clause would need a group of three. The opening answer names what a GP needs beyond a note and a prescription (spec 5.15 item 2) as two items, to avoid a group of three.'
  - 'Related links: /solutions/solo-clinic/ is the solution page for the usual GP practice size (spec 2.9); /clinic-management-software-india/ and /emr-software-in-kenya/ are still drafts and will resolve when they publish. The Kenya description names bilingual prescriptions only and says nothing about integration status.'
  - 'Adversarial fact check, 2026-09-26 (live /general-practitioner-emr/ and /family-physician-emr/ re-fetched): cut "moving old records across from another system adds time" from the go-live note (no source; the /kenyademo/ 3-day path lists data migration as one of its steps, and home.yaml cut the same line); cut "the vitals taken before the consult are on the chart" from the triage row (pre-consult vitals by a nurse is the "Clinical Assistant / Nurse intake" item in the Premium "Advanced EMR for specialists" list; triage alone is stated); cut "on the screen before the patient sits down", "on one screen" and "on the same screen" (the live pages say "for quick and easy reference during follow-ups" and "without navigating complex screens", and "single screen" appears only in the Advanced EMR list); cut "warns you while you are still writing it" from the drug interaction check (only the check itself is stated); cut "so stock is reordered" as a consequence of batch and expiry tracking in the dispensing FAQ; cut "Most do not" and "the problem the check-up was meant to catch" (unmeasured, and an outcome claim); fixed groups of three (templates row; past visits, diagnoses and treatments; prescription channels); replaced the referral FAQ, which repeated pain 4 and the referrals row, with the paper-files question answered from the stated image and document upload and intake form; the offline FAQ now gives advice rather than asserting how much of the product needs a connection, since the live wording is "does not run fully offline today".'
  - The editorial pass recorded here is an AI review. A human editor still needs to read the page aloud; the page has no named person and no measured number, so it meets only two of the four spec 6.5 pass marks (a local fact in the rupee price and the Kenyan bilingual prescription, and admissions of limits in the dispensing, offline and plan FAQs) until the testimonial arrives.
