sections:
  - discriminant: painBlocks
    value:
      id: where-a-general-practice-loses-track
      heading: Where a general practice loses track
      intro: >-
        A general practice sees the same patients for years, for a cough one month and a blood pressure review<br class="hidden lg:inline">
        the next. Most of what goes wrong is history that does not follow the patient into the consulting room.
      items:
        - heading: The history is in last year's file
          body: >-
            A patient you have seen since her children were small comes in with chest pain. Her father's
            heart attack and the smoking she gave up are written in an old file, and the doctor who saw her
            on Saturday had neither in front of him.
          fix: >-
            The history is taken once and kept. Chronic conditions, family and social history, substance
            use and immunisations go into the intake form and onto the patient's facesheet, which is in
            front of you at every follow-up.
        - heading: Blood pressure readings on the back of old prescriptions
          body: >-
            A patient with hypertension comes in every two months. Each reading is on that visit's
            prescription, so deciding whether the new tablet is working means turning pages and doing the
            arithmetic in your head.
          fix: >-
            Vitals are recorded at each visit and charted over time, so the trend since the tablet changed
            is one graph on the screen. On Premium, lab reports come into the chart as well, and their
            values can be charted the same way.
        - heading: The check-up nobody reminds them about
          body: >-
            The annual check-up and the vaccination you advised both depend on the patient remembering.
            Some forget, and nobody at the clinic knows until they walk in again with something else.
          fix: >-
            Set the follow-up in the consult and the patient is reminded automatically, and the EMR can send
            alerts when an annual check-up or a vaccination is due. Reminders go by SMS and email on every
            plan, and by WhatsApp on Premium.
        - heading: The referral goes out on a prescription slip
          body: >-
            You send a patient to a cardiologist with a note on the back of a prescription slip. The report
            comes back weeks later in the patient's bag, and whether it reaches the file depends on who is
            at the desk that day.
          fix: >-
            The referral is written in the consult, alongside the note and the prescription, and it stays on
            the patient's record. When the specialist's report comes back, it is uploaded to the patient's
            record as a document or an image, beside your own visits.

  - discriminant: featureRows
    value:
      id: built-around-the-gp-chart
      heading: Built around the general practice chart
      intro: >-
        The EMR and e-prescriptions come with every plan, starting with Professional. Your own templates
        and lab reports in the chart come with Premium, at {price:inr.premium.annual} per doctor per month
        in India or {price:usd.premium.annual} in US dollars, billed annually.
      layout: grid
      items:
        - heading: The facesheet and the history
          icon: file-heart
          body: >-
            The history is taken on an intake form, as detailed or as brief as you want it, and what it
            records lands on the patient's facesheet. The facesheet and the auto-generated summary put the
            key facts in front of you at every follow-up, and each past visit stays on the same record
            with its diagnosis and treatment.
          bullets:
            - History taken on an intake form, detailed or brief
            - Each past visit kept with its diagnosis and treatment
        - heading: Chronic conditions over the years
          icon: activity
          body: >-
            Patients with diabetes or hypertension are tracked over the long term. Vitals and other clinical
            parameters are charted visit by visit, so a change in treatment can be read against the trend.
            On Premium, lab reports come into the chart and their values are charted as well.
          bullets:
            - Diabetes and hypertension tracked over the long term
            - On Premium, lab values charted beside the vitals
        - heading: Follow-ups and check-ups
          icon: bell-ring
          body: >-
            The follow-up is set during the consult, and the patient gets an automated reminder before it
            is due. The EMR also sends alerts when an annual check-up or a vaccination is due. Appointment
            reminders go by SMS and email on every plan, and by WhatsApp on Premium.
          bullets:
            - An automated reminder before each follow-up is due
            - Reminders by SMS and email, and WhatsApp on Premium
        - heading: Referrals and reports from outside
          icon: route
          body: >-
            Referrals are written in the consult and managed from the patient's record, so the referral
            stays with the rest of the history. Reports and images that come back from a specialist or a
            scan centre are uploaded to the same record.
          bullets:
            - Referrals written in the consult and kept on the record
            - Specialist and scan centre reports uploaded to the record
        - heading: Your own templates for the conditions you see most
          icon: layout-template
          body: >-
            Family practice has its regular conditions, such as diabetes or a respiratory infection, and a
            template for each saves writing the same note from scratch. On Premium you can have a template
            for each of them, and turn your paper forms into digital ones with the form builder.
          bullets:
            - A template for each condition you see most, on Premium
            - Paper forms turned into digital ones with the form builder
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the visit note for you to review and
            sign, and it is optional: a doctor who prefers to write every note writes it in the same chart.
          bullets:
            - Drafts the visit note for you to review and sign
            - Optional for a doctor who prefers to write every note

  - discriminant: featureRows
    value:
      id: a-walk-in-visit
      heading: A walk-in visit, from the token to the follow-up
      intro: >-
        A general practice sees many of its patients without a booking, so the visit starts at the desk
        and ends with the next appointment. The appointment book and billing come with every plan.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: 'At the desk: the token and the queue'
          icon: calendar-clock
          body: >-
            A walk-in gets a token number and joins the day's list beside the booked patients, first come
            first served, and a patient who needs to be seen sooner can be moved up as a priority. The desk
            sees the queue and each patient's waiting time as the day goes on.
          link:
            label: Read how the appointment book works
            href: /features/appointment-scheduling/
        - heading: 'Before the consult: triage'
          icon: activity
          body: >-
            Triage is part of the EMR, for deciding who needs to be seen first when the waiting room is
            full.
        - heading: 'In the consult: point and click'
          icon: notebook-pen
          body: >-
            The chief complaint, the history, the vitals and the examination are recorded by pointing and
            clicking, with auto-complete for notes and diagnoses. Investigations, referrals, the follow-up
            date and advice for the patient are added in the same consult.
        - heading: The prescription, checked and sent
          icon: pill
          body: >-
            The prescription is written on the same record, with the drug interaction check built into the
            EMR. It can be printed, or sent to the patient by SMS or email and, on Premium, by WhatsApp, and
            it can be bilingual, such as English and Swahili for clinics in Kenya.
        - heading: 'Back at the desk: the bill'
          icon: receipt
          body: >-
            The receptionist raises the bill in one click from the clinic's service list, and on Premium the
            receipt goes to the patient on WhatsApp. Part payments are recorded against the bill, and a refund or a discount goes through only with authorisation.
          link:
            label: Read how billing works
            href: /features/billing/

