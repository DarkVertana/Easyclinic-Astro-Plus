editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-11-05
  onlyUsCouldWrite: >-
    The reaction written in one nurse's notebook while another draws up the next build-up dose is an allergy
    clinic problem, and the fix is the shot record the live allergy page states, with plans named only where
    plans.yaml names them.
  readsMachineWritten: >-
    The page has no named allergist and no measured number, and it names no allergen panel, extract or
    build-up schedule field because none is confirmed, so an allergist may find the immunotherapy row thin.

notes:
  - 'Owner request 2026-11-05: the FAQ heading is "You Have Questions, We Have Answers" and the eleven FAQs are the live /allergy-emr-software/ page''s, word for word. Two answers go further than the rest of the page: inventory is said to be included (it is Enterprise or a module), and the clinic is said to be fully cloud-based.'
  - 'Owner request 2026-11-05: the ratings section (How clinics rate Easy Clinic) and the training steps section were removed from every specialty page.'
