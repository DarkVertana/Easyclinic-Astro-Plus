sections:
  - discriminant: painBlocks
    value:
      id: where-an-allergy-clinic-loses-track
      heading: Where an allergy clinic loses track
      intro: >-
        Allergy care is a test followed by months of shots, and what goes missing is usually<br class="hidden md:inline">
        a result or a reaction from an earlier visit that decides what is given today.
      items:
        - heading: The prick test sheet is in a folder
          body: >-
            In January the patient had a skin prick test against a panel of allergens, and the nurse wrote the
            wheal sizes on a printed sheet that went into a folder. At the review in April the doctor is
            choosing the extract for immunotherapy, and the sheet is somewhere in the January pile.
          fix: >-
            Allergy test results are stored on the patient's record in Easy Clinic, so the doctor opens them
            at the review. On Premium the clinic records prick, scratch and intradermal results on test
            templates instead of a printed sheet.
        - heading: Last week's reaction is in another nurse's notebook
          body: >-
            During the build-up phase the patient comes in every week for a shot at a slightly higher dose. Last
            Tuesday she had a large swelling at the injection site, and the nurse on duty wrote it in her own
            notebook. This Tuesday a different nurse is on, and she draws up the next step on the schedule.
          fix: >-
            Each immunotherapy shot is recorded on the patient's record with any reaction and the adjustment
            made to the dose, so the nurse giving today's shot opens the record and sees last week's swelling
            and the dose it led to.
        - heading: The patient on maintenance stops coming
          body: >-
            Once the shots move to the maintenance phase the visits are weeks apart, and nobody notices that a
            patient has missed two in a row until he walks in with his symptoms back.
          fix: >-
            The doctor sets the next follow-up in the note, and Easy Clinic sends the patient an automated
            reminder by SMS and email on every plan, with WhatsApp added on Premium. The schedule of recurring
            shots is kept on the record, so the date of the last one given is there when he does come back.
        - heading: The drug allergy is in a different doctor's note
          body: >-
            A patient told the clinic's other doctor two years ago that penicillin gave her hives. It sits in
            that consultation note, and today's doctor, writing a prescription for a chest infection, has not
            read back that far.
          fix: >-
            Allergies are recorded on the patient's facesheet, which opens with the record at every visit, so
            the penicillin allergy is in front of whichever doctor sees her. The prescription screen also has a
            drug interaction check.

  - discriminant: featureRows
    value:
      id: the-allergy-record
      heading: Built around the allergy record
      intro: >-
        Skin test templates come with Premium, Easy Clinic's plan for specialists. Vaccine and medicine
        stock comes with Enterprise or as a module.
      layout: grid
      items:
        - heading: Skin and patch test templates
          icon: flask-conical
          body: >-
            On Premium the chart comes with templates for recording skin test results, such as prick, scratch
            or intradermal testing, and the form builder turns a paper test sheet the clinic already uses into
            a digital form. Results are stored on the patient's record beside the consultation.
          bullets:
            - Prick, scratch and intradermal results on templates
            - Your paper test sheet turned into a digital form
        - heading: Immunotherapy shot records
          icon: calendar-clock
          body: >-
            Each shot is recorded on the patient's record with any reaction and any adjustment to the dose, and
            recurring shots, follow-ups and the treatment schedule are kept on the same record. A patient on
            immunotherapy for years has one history, from the first test to the latest shot.
          bullets:
            - Each shot recorded with its reaction and dose adjustment
            - Recurring shots and follow-ups on the patient's record
        - heading: Allergies on the facesheet
          icon: file-heart
          body: >-
            The intake form takes the medical history in detail or briefly, including chronic illnesses, family
            and social history and immunisations, and it feeds the facesheet, which shows the patient's
            allergies beside conditions and past procedures. The complete visit history is on one screen, and
            vitals and lab values can be charted over time.
          bullets:
            - Allergies and conditions on the facesheet
            - A drug interaction check on the prescription
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the consultation note for the doctor to
            review.
          bullets:
            - Cura AI comes with every plan
            - The doctor reviews every draft note

