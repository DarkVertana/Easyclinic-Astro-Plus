  - 'Recruit a named mental health testimonial (spec 5.15 item 9): a named psychiatrist, psychologist or mental health practice owner on Easy Clinic, with city, practice and consent on file, added to src/data/testimonials/ and placed only on this page. The two psychiatrist testimonials that exist are already placed: nrp-chandra-balaji on /features/emr/ and srinivasa-teja on /indiademo/ (both have city null). If one is reassigned here, remove it from its current page. Until then the proof is the Capterra and Google badges, and the intro only points to the EMR page quote (no testimonial id is placed here). Review counts are null in facts.yaml, so the badges show no count.'
  - 'Grounding (live pages retrieved 2026-09-26). /mental-health/: mental health evaluations, family history, substance use history and diagnostic criteria; progress notes for symptoms, therapy progress and medication effects; drug interaction checks (alerts for potential interactions or contraindications); customisable intake forms, detailed or concise, feeding the facesheet; form builder for paper forms; visit history on one screen; side-by-side past records; confidential notes, collaborative case notes (EMR list); in-built video and chat, video consults created through the appointment module with online fee payment, browser on computer or phone, teleconsult prescriptions by WhatsApp, SMS or email with a disclaimer that the consult was remote; part and advance payments, refunds and invoice voiding with authorisation, payment amortisation for package treatments; multi session booking, data access control for reception, confidential appointment (scheduling list); access rights and audit logs, access by roles, departments and hierarchical levels, usage history, role based access. /psychiatry-emr/: customisable treatment plans with therapy goals, progress tracking and milestones; medication management (psychotropic prescriptions, dosage adjustments, refill reminders). /psychology-emr/: session notes, observations and assessments; psychometric test management (results from standardised tests such as MMPI, Beck Depression Inventory or IQ tests). Reception login rule from facts.md. Plans from plans.yaml (video consultations, own clinical forms, package treatments and WhatsApp messages on Premium; pharmacy and inventory on Enterprise or as a module). WhatsApp prescription sending is tied to Premium to match /features/emr/.'
  - 'Spec 5.15 must-haves left out (company to-do). (1) Session notes separate from the shared chart: the live pages list "Confidential notes" and "Confidential Appointment" as feature names but do not say what either hides or from which roles; company to describe who can read a confidential note (the author only, prescribers, the care team) and what a confidential appointment hides at the desk, then add a row and a FAQ ("Are therapy notes kept apart from the rest of the chart?"). (2) Outcome scales PHQ-9 and GAD-7: not named on any live page; company to confirm whether they exist as ready templates, whether the total is scored automatically and whether the score is charted as a trend across sessions (the live pages list "Growth & Progress charts" without detail). Until then the page offers the stored psychometric results named on /psychology-emr/ and the Premium form builder, and does not name PHQ-9 or GAD-7 as a capability. (3) Medication audit: the page states dose-by-dose tracking and user audit logs, both grounded, but not a medication audit trail; company to confirm whether each prescription change is logged with the user and time, and whether a report of psychotropic or controlled prescribing exists. (4) Consent language per country: nothing on the live pages; company to confirm whether consent forms (treatment, teletherapy, information sharing) can be captured and stored, and in which countries'' wording. Teletherapy is included (video consultations are Premium in plans.yaml).'
  - 'Also for the full spec 5.15 template: which plan carries the psychiatry and psychology screens (treatment plans, medication management, psychometric results, role and department access are listed on the live pages with no plan, so those rows carry no plan badge and the featureRows intro no longer says Premium includes every row; it says only that most specialists choose Premium, from the plans.yaml highlight); the mental health templates and forms by name and count (spec item 5; no dataTable, because the only template claim is the "Psychiatry consultation templates: Yes" cell in the live comparison table); a timed walkthrough of a follow-up visit (item 4); which mental health note types Cura AI drafts, with an example (item 8); devices and integrations (item 6, none for this specialty, section left out); whether counsellors and psychologists who do not prescribe need a paid per-doctor licence.'
  - 'Dropped from the live pages: the "14-Day Free Trial, with an extra 30-Day Money Back Guarantee" and "try Easy Clinic absolutely free" lines (owner decision: no free trial); "prescriptions in 30 seconds", "three clicks" and "invoices ready in less than 10 seconds" (unmeasured here); "over 100 graphical dashboards"; "Reduces no-shows" (no measured figure); both comparison tables on /psychiatry-emr/ (unsourced competitor cells; its "Inventory for medicines & supplies: Built-in" conflicts with plans.yaml); AI-powered diagnostic support and ADR alerts (CuraPilot claims); AI wait-time management and AI two-way messaging; patient self-service booking, check-in and intake forms on the phone (plan unclear; the patient portal and app is Enterprise); "ensuring clarity and compliance" after the teleconsult disclaimer; data warehouse and Power BI; "any language" prescriptions (the EMR page limits this to English and Swahili in Kenya). Multi-session booking (scheduling list, no plan) was taken out of the Premium package row so the Premium badge does not claim it; add it back once its plan is known. Refund and invoice-voiding authorisation (billing on every plan) was taken out of the same row for the same reason. The duplicated placeholder sentence the spec mentions for staging does not exist in this rewrite.'
  - 'Confidentiality wording is limited to what the live pages state: the reception login cannot open the EMR (facts.md), access by role and department, audit logs and usage history, and the names "confidential notes" and "confidential appointment". The page claims no compliance with any law (India DPDP Act, Mental Healthcare Act 2017, NMC telemedicine guidelines, Kenya or Nigeria data protection) and names none. The front-desk pain is about the paper file, not the appointment register: what "confidential appointment" and "data access control for reception" hide in the scheduler is not stated on the live pages, so the fix rests only on the reception login rule, roles and audit logs.'
