sections:
  - discriminant: painBlocks
    value:
      id: where-it-slips
      heading: Where a mental health practice loses track
      intro: >-
        Mental health care runs over months, and a patient's story is told across many sessions, often to
        more than one clinician. The four slips below happen between those sessions.
      items:
        - heading: The therapy notebook and the prescription pad
          body: >-
            The psychologist writes session notes in her own notebook and the psychiatrist writes on a pad
            whose copy goes home with the patient. At the three-month review neither can see what the other
            recorded, and the patient is asked to tell the story again.
          fix: >-
            Session notes and observations go on the patient's record in EasyClinic, and progress notes
            follow the symptoms and the effect of each medication from visit to visit. Collaborative case
            notes let the psychiatrist and the psychologist work from the same record.
          href: /features/emr/
          linkLabel: Read how the chart works
        - heading: The patient's file waits at the front desk
          body: >-
            In a small practice the file sits on the reception desk until the doctor calls the patient in,
            with last month's session notes inside it. Anyone who stops at the desk can open it.
          fix: >-
            Each person logs in as themselves, and the role on that login decides which screens they can
            open. The reception login included in the price is not allowed into the EMR and cannot issue
            prescriptions, and audit logs keep a record of what each user did.
        - heading: Three dose changes on three sheets of paper
          body: >-
            A patient starting an antidepressant comes back every few weeks while the dose is adjusted. Each
            change is on a separate sheet the patient took home, and when she says the side effects started
            after the last change, nobody in the room can say which change that was.
          fix: >-
            Psychotropic prescriptions are tracked on the record with each dosage adjustment and refill
            reminders, and the progress notes record how the patient responded to each medication. The drug
            interaction check alerts the doctor to potential interactions or contraindications.
        - heading: The session that happened on a personal phone
          body: >-
            A patient who cannot face the journey in a bad week asks to be seen by video. The call happens on
            the doctor's personal WhatsApp and the prescription is a photograph of the pad. The fee gets
            chased a week later, if anyone remembers.
          fix: >-
            On Premium a video session is booked from the appointment screen, and the fee can be paid online
            at booking. The patient joins from a web browser on a computer or a phone, and the prescription
            goes to them on WhatsApp or by email with a note that the consultation was held remotely.
          href: /features/telehealth/
          linkLabel: Read how video consultations work

  - discriminant: featureRows
    value:
      id: the-mental-health-record
      heading: Built around the mental health record
      intro: >-
        Each session is written against the same record, so the course of care reads from intake to the
        latest visit. Premium is the plan most specialists choose, and the rows marked Premium are not on
        Professional.
      items:
        - heading: Mental health history, taken once
          body: >-
            The record holds the mental health evaluation and the diagnostic criteria you worked from, with
            the family and social history and the substance use history taken at intake. Intake forms can
            take a detailed history or a short one, and what they capture goes onto the patient's facesheet
            for the next follow-up.
          bullets:
            - Mental health evaluation and diagnostic criteria
            - Family and social history taken at intake
            - Substance use history
            - Key data on the patient's facesheet
        - heading: Session notes and treatment plans
          body: >-
            The therapist records the session's notes and observations, with any assessment made, on the
            patient's record. A treatment plan holds the therapy goals and the milestones towards them, and
            the whole visit history opens on one screen, with past records side by side.
          bullets:
            - Therapy goals and milestones in the treatment plan
            - Progress notes from visit to visit
            - Past records side by side
            - Case notes shared with the care team
        - heading: Psychometric test results on the record
          body: >-
            Results from standardised tests, such as the Beck Depression Inventory or the MMPI, are stored
            on the patient's record, so the result from intake is there when you repeat the test months
            later. If you use a paper questionnaire today, Premium lets you rebuild it as a digital form with
            the form builder, and the clinician fills it in on the record.
        - heading: Psychotropic medication, dose by dose
          body: >-
            Psychotropic prescriptions are tracked with each dosage adjustment and refill reminders, and the
            drug interaction check alerts you to potential interactions or contraindications. The
            prescription is printed or sent by SMS or email, and on Premium by WhatsApp as well.
          bullets:
            - Each dosage adjustment recorded with the prescription
            - Refill reminders
        - heading: Who can open the record
          body: >-
            Access is set by role and by department, so the front desk and the clinicians each open only the
            screens their role allows. The reception login included in the price is not allowed into the EMR
            and cannot issue prescriptions, and audit logs keep a record of what each user did. The EMR also
            has confidential notes, and the scheduler has confidential appointments.
          bullets:
            - Access by role and by department
            - No EMR access on the reception login
            - Confidential notes and confidential appointments
            - Audit logs and usage history for each user
        - heading: Video sessions from a web browser
          plan: premium
          body: >-
            On Premium, a video session is booked from the appointment screen beside visits in person, and
            the fee can be paid online when the session is booked. EasyClinic has video and chat built in,
            so you and the patient join from a web browser on a computer or a phone, with no other software
            to install. The prescription from the session goes to the patient on WhatsApp or by email, and
            says the consultation was held remotely.
          link:
            label: Read how video consultations work
            href: /features/telehealth/
        - heading: A course of therapy, billed as one package
          plan: premium
          body: >-
            On Premium a course of therapy can be billed as one package treatment, with the payment spread
            over the course. Each advance or part payment is recorded against the bill, so the desk can see
            what is still owed before the next session.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Cura AI drafts the note
          plan: professional
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the note and the prescription in the
            patient's chart, and the draft stays a suggestion until the clinician corrects and confirms it.
          link:
            label: Read what Cura AI does
            href: /ai/

  - discriminant: proofBlock
    value:
      id: ratings
      heading: How clinics rate EasyClinic
      intro: >-
        These are EasyClinic's public ratings, from clinics of every kind. A psychiatrist who wrote, after
        ten years on EasyClinic, that it took his practice from pen and paper to a digital record is quoted
        on [the EMR page](/features/emr/).
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'

  - discriminant: stepList
    value:
      id: training
      heading: How long does it take to learn EasyClinic?
      intro: >-
        About two hours, spread over {fact:trainingDays} days, and training is included in every plan. Each
        session is 20 to 40 minutes, short enough to fit between appointments, so the practice keeps seeing
        patients while the team learns.
      steps:
        - title: 'Day 1: basic training'
          meta: 40 minutes
          body: >-
            The screens the front desk and the clinicians use every day. Bring your receptionist, whose
            login is part of the plan.
        - title: 'Day 2: EMR scenario training'
          meta: 40 minutes
          body: >-
            You work through the chart and the prescription on the kinds of case your practice sees, from a
            first assessment to a follow-up.
        - title: 'Day 3: practice exercises'
          meta: 20 minutes
          body: You work through exercises on your own, then bring back the questions that came up.
        - title: 'Day 4: road to expertise'
          meta: 20 minutes
          body: The shortcuts that make each note quicker, once the basics have become habit.
      note: >-
        From the demo, a practice can be live in as little as {fact:goLiveDays} days.

faqHeading: Questions mental health practice owners ask
faq:
  - question: What does EasyClinic cost for a psychiatry or psychology practice?
    answer: >-
      Premium, the plan with video consultations and your own clinical forms, costs
      {price:inr.premium.annual} per doctor per month billed annually in India, or
      {price:usd.premium.annual} in US dollars. Professional, at {price:inr.professional.annual} or
      {price:usd.professional.annual}, has the EMR and billing but no video consultations. Both include a
      reception login, with no setup fee and no binding contract.
  - question: Can my receptionist read a patient's session notes?
    answer: >-
      No, not on the reception login that comes with every plan: it is not allowed into the EMR and cannot
      issue prescriptions. Each clinician logs in as themselves with access set by role and by department,
      and audit logs keep a record of what each user did.
  - question: Can I keep psychometric test results on the patient's record?
    answer: >-
      Yes, results from standardised tests such as the Beck Depression Inventory or the MMPI are stored on
      the patient's record, beside the session notes. If you use a paper questionnaire today, Premium lets
      you rebuild it as a digital form in your practice's own layout with the form builder.
  - question: Can I follow a patient's medication and dose changes over time?
    answer: >-
      Yes, psychotropic prescriptions are tracked with each dosage adjustment and refill reminders, and the
      progress notes record the effect of each medication from visit to visit. The drug interaction check
      alerts you to potential interactions or contraindications.
  - question: Can I see patients by video?
    answer: >-
      Yes, on Premium, which includes video consultations: you and the patient join from a web browser on a
      computer or a phone, with nothing to install. The fee can be paid online when the session is booked,
      and the prescription goes to the patient on WhatsApp or by email with a note that the consultation
      was held remotely.
  - question: Can a patient pay for a course of therapy sessions in parts?
    answer: >-
      Yes, on Premium, where package treatments are part of the plan: the course is billed as one package
      with the payment spread over it, and each advance or part payment is recorded against the bill.
      Professional does not include package treatments.
  - question: Does EasyClinic run the practice's pharmacy?
    answer: >-
      Yes, but not on Premium alone: pharmacy and inventory are included in Enterprise, or added to
      Professional and Premium as a module. With the module, the pharmacist dispenses from the doctor's
      prescription and tracks each batch to its expiry date.
  - question: Does EasyClinic work without an internet connection?
    answer: >-
      No, EasyClinic does not run fully offline today: the cloud version needs an internet connection, so
      the practice needs a working line while it sees patients. A self-hosted option also exists, where the
      system runs on the practice's own server rather than in EasyClinic's cloud.

