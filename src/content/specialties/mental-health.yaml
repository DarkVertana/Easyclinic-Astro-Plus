faqHeading: "You Have Questions, We Have Answers"
faq:
  - question: What does Easy Clinic cost for a psychiatry or psychology practice?
    answer: >-
      Premium, the plan with video consultations and your own clinical forms, costs
      {price:inr.premium.annual} per doctor per month billed annually in India, or
      {price:usd.premium.annual} in US dollars. Professional, at {price:inr.professional.annual} or
      {price:usd.professional.annual}, has the EMR and billing but no video consultations. Both include a
      reception login, with no setup fee and no binding contract.
  - question: Can my receptionist read a patient's session notes?
    answer: >-
      No, not on the reception login that comes with every plan: it is not allowed into the EMR and cannot
      issue prescriptions. Each clinician logs in as themselves with access set by role and by department,
      and audit logs keep a record of what each user did.
  - question: Can I keep psychometric test results on the patient's record?
    answer: >-
      Yes, results from standardised tests such as the Beck Depression Inventory or the MMPI are stored on
      the patient's record, beside the session notes. If you use a paper questionnaire today, Premium lets
      you rebuild it as a digital form in your practice's own layout with the form builder.
  - question: Can I follow a patient's medication and dose changes over time?
    answer: >-
      Yes, psychotropic prescriptions are tracked with each dosage adjustment and refill reminders, and the
      progress notes record the effect of each medication from visit to visit. The drug interaction check
      alerts you to potential interactions or contraindications.
  - question: Can I see patients by video?
    answer: >-
      Yes, on Premium, which includes video consultations: you and the patient join from a web browser on a
      computer or a phone, with nothing to install. The fee can be paid online when the session is booked,
      and the prescription goes to the patient on WhatsApp or by email with a note that the consultation
      was held remotely.
  - question: Can a patient pay for a course of therapy sessions in parts?
    answer: >-
      Yes, on Premium, where package treatments are part of the plan: the course is billed as one package
      with the payment spread over it, and each advance or part payment is recorded against the bill.
      Professional does not include package treatments.
  - question: Does Easy Clinic run the practice's pharmacy?
    answer: >-
      Yes, but not on Premium alone: pharmacy and inventory are included in Enterprise, or added to
      Professional and Premium as a module. With the module, the pharmacist dispenses from the doctor's
      prescription and tracks each batch to its expiry date.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      No, Easy Clinic does not run fully offline today: the cloud version needs an internet connection, so
      the practice needs a working line while it sees patients. A self-hosted option also exists, where the
      system runs on the practice's own server rather than in Easy Clinic's cloud.

