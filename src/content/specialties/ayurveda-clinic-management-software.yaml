editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The Abhyanga oil changed on day four while the therapy room works from yesterday's sheet, and the one
    Shirodhara table booked twice at 10am, are Ayurveda clinic problems whose fixes are capabilities
    EasyClinic's own Ayurveda page states, with the plan named where plans.yaml names one, and the
    inpatient answer is the limit a Panchakarma hospital will actually meet.
  readsMachineWritten: >-
    The page names no Ayurvedic template or classical formulation list and no AYUSH record format, because
    none is confirmed, and with no named vaidya or measured number an Ayurveda doctor may find the feature
    rows general and the Prakriti answer (lay out your own form on Premium) thin.

notes:
  - 'Grounding: treatment plans including Panchakarma therapy schedules, herbal medication prescriptions, dietary recommendations and daily routines; multi-day Panchakarma courses planned, tracked and followed up, with each session and therapy recorded within the case history; therapy sessions, procedures and follow-ups recorded for Panchakarma; diet and lifestyle recommendations created and shared as part of the treatment plan; custom prescription formats for Ayurvedic medicines and herbal treatments; quick access to commonly used Ayurveda medications; prescriptions shared by print, WhatsApp, SMS or email; herbal medicine inventory for churnas, decoctions, oils and supplements, so clinics know what is available before prescribing; custom examination forms and the form builder for paper forms; customisable intake forms (chronic illnesses, family and social history, alternative therapies and more) feeding the facesheet; visit history on a single screen, side-by-side past records, facesheets, vitals and lab charts, image and document upload, collaborative case notes; multi-session booking, fixed-time appointments and walk-ins, resource booking (equipment or assistants) within the appointment slot, multi-resource calendar, automated reminders and follow-up; part and advance payments, refunds and invoice voiding with authorisation, payment amortisation for package treatments, multi-level price list, discount authorisation, receipts on WhatsApp; one continuous patient history for long-term tracking. All stated plainly on the live /ayurveda-emr-software/ page (retrieved 2026-09-26). Plan placement follows plans.yaml (WhatsApp, package treatments, own forms and print layouts, specialty templates on Premium; pharmacy and inventory on Enterprise or as a module). Reception login, no binding contract and the offline answer follow facts.md; the inpatient answer follows the published home page FAQ ("does not run inpatient wards or operating theatres"). Penda Health on EasyClinic since 2017 is from the verified study facts.'
  - 'Recruit a named Ayurveda testimonial (spec 5.15 item 9): a named Ayurveda doctor (vaidya) or Ayurveda clinic or Panchakarma centre owner on EasyClinic, with city, clinic and consent on file, added to src/data/testimonials/ and placed only on this page as a customer proofBlock or a single testimonialRow. Until then the proof block is the Capterra and Google badges, and its intro says no Ayurveda doctor quote exists yet. Review counts are null in facts.yaml, so the badges show no count. The four testimonials on the live /ayurveda-emr-software/ page (two psychiatrists, a general physician, an ophthalmologist) are not about Ayurveda and are not used. Dr Manish Bhatia (Asha Homeopathy, Jaipur) is the nearest fit for the merged /alternative-medicine/ audience, but his record is assigned elsewhere.'
  - 'Spec 5.15 ayurveda must-haves, company to-do. (1) Panchakarma scheduling: INCLUDED only as far as the live page states it (the Panchakarma therapy schedule on the treatment plan, multi-day courses tracked session by session, multi-session booking, equipment and assistants booked inside the slot, a calendar per resource). Not stated, so left out: therapy rooms set up as named resources (the Shirodhara table pain uses equipment and an assistant, the live wording); therapist rosters by therapy or by the patient''s gender; the Purvakarma, Pradhana karma and Paschat karma stages as structured steps; the oil or medicine quantity used per session drawn from stock; a therapist''s daily therapy list. Confirm each, with plan. (2) Classical formulations: LEFT OUT. The live page says only that prescription formats can be customised for Ayurvedic medicines and that commonly used Ayurveda medications are at hand; it does not say a library of classical formulations ships ready (for example from the Ayurvedic Formulary of India), with dosage forms (churna, kashaya, arishta, asava, taila, ghrita, vati), anupana and timing relative to food as fields. Confirm whether such a list exists, its size, and whether the clinic adds its own proprietary formulations. (3) AYUSH documentation: LEFT OUT. The live pages state no AYUSH case-sheet format, no NAMASTE (National AYUSH Morbidity and Standardized Terminologies) codes and no National AYUSH Grid or ABDM connection; the live post''s "ensures Ayurveda clinics can easily meet compliance expectations" is a compliance claim with unknown status. Confirm status and date for each before any line goes on the page (no regulatorStrip or regulatorTable until then).'
  - 'Spec 5.15 template items also left out for lack of facts: named and countable Ayurveda templates and forms (item 5, so no dataTable; the live comparison table says "Ayurvedic prescription templates: Yes" but names none); a ready Prakriti, Vikriti or Nadi Pariksha template (the page offers only the Premium form builder); a timed walkthrough of the most common Ayurveda visit (item 4); devices and integrations for Ayurveda (item 6); which Ayurveda note types Cura AI drafts, with an example (item 8). Also confirm: which plan carries the Panchakarma treatment plan, diet recording and resource booking (the live page does not say, so those rows carry no plan tag); whether the custom Ayurvedic prescription format needs Premium (plans.yaml puts own print layouts on Premium, and the page says so); how therapists and Panchakarma assistants are licensed under per-doctor pricing; which prescription languages are available (the live page says "any language" and answers yes to regional languages, but only English and Swahili are confirmed elsewhere, so the page names no language and has no language FAQ); whether diet and daily-routine advice is sent to the patient on WhatsApp and on which plan.'
  - 'Dropped from the live pages: the /ayurveda-clinic-management-software/ post in full (AI scheduling, predictive analytics, AI inventory forecasting, AI-assisted billing and dosha classification as generic AI claims, the Ministry of AYUSH "7.5 crore" figure, the Kerala and Pune scenes with "over 80 therapy sessions a day", the three unnamed case studies in Lagos, Kuala Lumpur and Bangalore, and the compliance line); from /ayurveda-emr-software/: both comparison tables (unsourced "Other EMR" and "Generic EMR" cells, and inventory "Built-in", which conflicts with plans.yaml); "prescriptions in 30 seconds", "under 30 seconds" and "invoices ready in less than 10 seconds" (unmeasured here); "over 100 graphical dashboards"; "Reduces no-shows" (noShowReduction is null); AI diagnostic support and ADR alerts (CuraPilot claims); AI two-way messaging and AI wait-time alerts; patient self-service booking, check-in and phone intake forms (the patient portal is Enterprise; plan unclear); the data warehouse, Power BI and Azure Data Factory lines; HR, roster, incentive and commission plans (not specialty-specific); "ensure compliance" and "secure, cloud-based platform" (status unknown); "fully cloud-based and accessible from anywhere" (replaced by the offline FAQ); the "14-Day Free Trial, with an extra 30-Day Money Back Guarantee" and "try Easy Clinic absolutely free" lines (owner decision: no free trial); the "Join 5000+ Doctors" and "5000+ Doctors across 200 cities" stat lines. From /alternative-medicine/: the homoeopathy, Unani, naturopathy, acupuncture and chiropractic lines. That page now redirects here, so a homoeopathy clinic has no page of its own; decide whether spec 3.1 needs one.'
  - 'No heroMedia and no media: screenshots do not exist yet. Hero when captured: the treatment plan with a 14-day Panchakarma schedule and sessions marked done, then the resource calendar with a therapy table booked, the Ayurvedic prescription print and the package bill with part payments. The four pains are illustrative Ayurveda clinic situations, not customers; "day four", "14-day", "10am" and "six weeks" are examples.'
  - 'H1: the page uses the spec 5.15 item 1 form (as the dental and dermatology pages do) rather than the spec 4.3 H1 ("Software for ayurveda clinics and hospitals"); "hospitals" is left out of the H1 because an Ayurveda hospital usually admits patients for Panchakarma and EasyClinic does not run inpatient wards, which the hospital FAQ says. Switch to the 4.3 H1 if the owner prefers the keyword-map wording. Spec 5.15 item 2 asks for three needs; the opening answer names two to avoid a group of three. Title 47 characters; meta description 150 characters with the token resolved (151 as the linter counts an unresolved token). /clinic-management-software-india/ and /emr-software-in-kenya/ are still drafts; the related links resolve once they publish.'
  - The editorial pass recorded here is an AI review. A human editor, ideally one who knows an Ayurveda clinic, still needs to read the page aloud and check the Ayurvedic terms (Abhyanga, Shirodhara, churna, kashaya, arishta, taila, anupana, Prakriti, Nadi Pariksha, vaidya) and answer the two spec 6.5 questions; the page has no named person and no measured number, so it meets only two of the four spec 6.5 pass marks (a local fact in the rupee price and the Penda Health link, and admissions of limits in the stock, inpatient and offline FAQs) until the testimonial arrives.
  - 'Editorial review 2026-09-26 (AI fact check against the live /ayurveda-clinic-management-software/, /ayurveda-emr-software/ and /alternative-medicine/ pages, re-fetched that day): every capability line was re-checked against the live wording; nothing new was found on /alternative-medicine/ beyond what /ayurveda-emr-software/ states. Changes: the featureRows intro now says Premium includes every row (except stock, Enterprise or a module) and the Premium-marked rows are not on Professional, instead of implying the unmarked rows are on Professional, because plans.yaml puts specialty templates and your own forms on Premium and the plan for the Ayurvedic prescription format and the Panchakarma treatment plan is unconfirmed; the plan FAQ now names specialty templates and your own forms among what Professional lacks; the day-four fix says the change goes onto the record the next session is written in (the live page says sessions are recorded in the case history, not against the plan); "each booked session gets a reminder" became "booked sessions get automated reminders"; groups of three removed (print, SMS, email; Prakriti, Vikriti, Nadi Pariksha; oils, churnas and other medicines; reception login, setup fee, contract); the Panchakarma FAQ was reworded from a yes-we-do-that question to how a course runs; the multi-level price list and discount authorisation bullets were cut from the Premium-marked package row, since they are general billing and the new intro would have read them as Premium-only.'
