  - discriminant: stepList
    value:
      id: training
      heading: How long does it take to learn EasyClinic?
      intro: >-
        About two hours, spread over {fact:trainingDays} days, and training is included in every plan. Each
        session is 20 to 40 minutes, short enough to fit between the morning consultations and the evening
        list, so the clinic keeps seeing patients while the team learns.
      steps:
        - title: 'Day 1: basic training'
          meta: 40 minutes
          body: >-
            The screens the front desk and the doctors use every day: the appointment book and the bill at
            the desk, the chart and the prescription in the consulting room. Bring your receptionist, whose
            login is part of the plan.
        - title: 'Day 2: EMR scenario training'
          meta: 40 minutes
          body: >-
            You work through the chart and the prescription on the kinds of cases your clinic sees.
        - title: 'Day 3: practice exercises'
          meta: 20 minutes
          body: You repeat what the first two sessions covered, so the first real patient is not your first attempt.
        - title: 'Day 4: road to expertise'
          meta: 20 minutes
          body: The shortcuts that make each note and prescription quicker, once the basics have become habit.
      note: >-
        From the demo, a clinic can be live in as little as {fact:goLiveDays} days.

faqHeading: Questions Ayurveda clinic owners ask
faq:
  - question: Which EasyClinic plan does an Ayurveda clinic need, and what does it cost?
    answer: >-
      Premium, if you sell Panchakarma courses as packages or want your own case sheet as a digital form:
      {price:inr.premium.annual} per doctor per month billed annually in India or
      {price:inr.premium.quarterly} billed quarterly, and {price:usd.premium.annual} or
      {price:usd.premium.quarterly} in US dollars. Professional, at {price:inr.professional.annual} billed
      annually, has the chart and billing but not the specialty templates, your own forms, package
      treatments or WhatsApp messages that Premium adds. Both include a login for your receptionist, and
      neither has a setup fee or a binding contract.
  - question: How does a Panchakarma course run on EasyClinic?
    answer: >-
      The course is planned on the patient's treatment plan, which holds the Panchakarma therapy schedule,
      and its sessions are booked together, each with the equipment or assistant the therapy needs inside
      the same appointment slot. Each session and therapy is then recorded within the case history, and the
      follow-up after the course is planned and tracked on the same record.
  - question: Can I record Prakriti assessment and Nadi Pariksha findings?
    answer: >-
      Yes, on a form you set up yourself: on Premium the form builder turns your paper case sheet into a
      digital examination form, filled in at each visit and kept on the patient's record. The findings then
      sit in one history beside the prescriptions and the therapies given.
  - question: Can a Panchakarma course be billed as a package and paid in instalments?
    answer: >-
      Yes, on Premium: the course is billed as one package treatment, and each advance or part payment is
      recorded against it, so the desk sees the balance. The payment can be spread over the course, and if
      the patient stops partway, a refund goes through only with authorisation. Professional does not
      include package treatments.
  - question: Does EasyClinic track our stock of oils and churnas?
    answer: >-
      Yes, but not on Professional or Premium alone: pharmacy and inventory come with Enterprise, or as a
      module added to either plan. With the module, the clinic knows what is in stock before the doctor
      prescribes, and each batch is tracked to its expiry date.
  - question: Can EasyClinic run an Ayurveda hospital where patients stay for Panchakarma?
    answer: >-
      It can run the outpatient side, but not the wards: EasyClinic runs clinics and hospital OPDs and does
      not run inpatient wards, so a hospital that admits patients for a residential Panchakarma course runs
      EasyClinic in the OPD beside a separate inpatient system. Patients who come in each day for their
      therapies are booked and recorded in EasyClinic as usual.
  - question: Does EasyClinic work without an internet connection?
    answer: >-
      No, EasyClinic does not run fully offline today: the cloud version needs an internet connection, so
      the clinic needs a working line while it sees patients. A self-hosted option also exists, where the
      system runs on the clinic's own server rather than in EasyClinic's cloud.

