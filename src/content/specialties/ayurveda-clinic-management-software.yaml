sections:
  - discriminant: painBlocks
    value:
      id: where-ayurveda-clinics-lose-track
      heading: Where an Ayurveda clinic loses track
      intro: >-
        Ayurvedic treatment runs as a course, over days in the therapy room and months of follow-up, and
        most of what goes missing falls between the consulting room and the therapy room.
      items:
        - heading: The therapy sheet pinned up in the therapy room
          body: >-
            On day four of a 14-day course the doctor changes the oil for the patient's Abhyanga and
            writes it in the case file. The therapists work from the sheet pinned up in the therapy room,
            which still has yesterday's oil on it, and the case file only learns what was given if someone
            copies it across at the end of the day.
          fix: >-
            The treatment plan holds the Panchakarma therapy schedule on the patient's record, and each
            session and therapy is recorded within the same case history. The change the doctor makes on
            day four goes onto the record the next session is written in, and the care team's shared case
            notes sit there too.
          href: /features/emr/
          linkLabel: Read how the chart works
        - heading: Two Shirodhara bookings, one Shirodhara table
          body: >-
            Two doctors each book a patient for Shirodhara at 10am, and the clinic has one table and one
            therapist free. The clash shows up when the second patient is already changed and waiting.
          fix: >-
            The equipment and the assistant a therapy needs are booked inside the appointment slot, and the
            calendar shows each resource's bookings, so the desk sees the table is taken at 10am before it
            offers that time. The sessions of a course can be booked together at the first visit.
          href: /features/appointment-scheduling/
          linkLabel: Read how booking works
        - heading: The prescription and the diet list, written out again
          body: >-
            An Ayurvedic prescription is long: a churna with its anupana, a kashaya before food, an arishta
            after it, and a taila for the joints. Written by hand at every visit, it takes the time the
            consultation needed, and when the patient comes back after six weeks, last visit's list of foods
            to take and avoid is on a sheet they left at home.
          fix: >-
            The prescription can be set up for Ayurvedic medicines and herbal treatments, with commonly used
            Ayurvedic medicines at hand as you write. Diet and lifestyle advice and the daily routine are
            recorded as part of the treatment plan, so at the next visit they open in the patient's history
            beside the past prescriptions.
          href: /features/emr/
          linkLabel: Read how prescriptions work
        - heading: The course paid in parts, tracked in the receipt book
          body: >-
            A Panchakarma course is often sold at one price, with an advance at the start and the balance
            before the last sessions. The receipt book shows two part payments nobody has matched to the
            course, and when a patient stops after day six, nobody is sure what is owed back.
          fix: >-
            On Premium the course is billed as one package treatment, and every advance and part payment is
            recorded against it, so the desk sees the balance on the bill. A refund goes through only with
            authorisation.
          href: /pricing/
          linkLabel: See what Premium includes

  - discriminant: featureRows
    value:
      id: built-around-the-treatment-plan
      heading: Built around the Ayurvedic treatment plan
      intro: >-
        Premium, EasyClinic's plan for specialists, includes every row below except medicine stock, which
        comes with Enterprise or as a module added to Professional or Premium. The rows marked Premium are
        not on Professional.
      items:
        - heading: Treatment plans that hold the Panchakarma schedule
          body: >-
            Plan a patient's treatment in detail on their record: the Panchakarma therapy schedule, the
            herbal medicines, the diet and the daily routine. A multi-day course is planned and tracked
            there, and each session and therapy is recorded within the patient's case history, through to
            the follow-up after the course ends.
          bullets:
            - Panchakarma therapy schedule on the treatment plan
            - Each session and therapy recorded in the case history
            - Diet and lifestyle advice kept with the plan
            - Follow-up after the course on the same record
        - heading: Therapy sessions booked with what they need
          body: >-
            Book the sessions of a course together, alongside fixed-time appointments and walk-ins. The
            equipment and assistants a therapy needs are booked inside the appointment slot, and the
            calendar shows each resource's bookings. Booked sessions get automated reminders by SMS and
            email on every plan, and by WhatsApp on Premium.
          link:
            label: Read how booking works
            href: /features/appointment-scheduling/
        - heading: Prescriptions written for Ayurvedic medicines
          body: >-
            The prescription can be set up for Ayurvedic medicines and herbal treatments, with commonly used
            Ayurvedic medicines at hand as you write. The patient gets it printed, by SMS, by email or, on
            Premium, by WhatsApp, and Premium also prints it in your clinic's own layout.
        - heading: Your own case sheet for Prakriti and Nadi Pariksha
          plan: premium
          body: >-
            On Premium, the form builder turns the paper case sheet you use today, with your Prakriti
            assessment and Nadi Pariksha findings, into a digital examination form filled in at each visit.
            You lay the form out yourself. Intake forms capture the medical history in as much or as little
            detail as you want, including chronic illnesses and the other therapies the patient has tried,
            and it all goes onto the facesheet.
          media:
            kind: screenshot
            src: ../../assets/images/screens/ayurveda-prakriti-assessment.png
            alt: Prakriti assessment form with Vata, Pitta and Kapha options for body type, skin, hair, appetite and sleep
            caption: A Prakriti assessment built as a digital form.
            frame: browser
            origin: old-site
            capturedOn: '2025-01'
        - heading: The whole course of care in one history
          body: >-
            Ayurvedic care runs over months, so every visit and every therapy is recorded in one continuous
            patient history. The facesheet puts the patient's key data on one screen, and past records open
            side by side with today's.
          bullets:
            - Automated follow-up reminders
            - Vitals and lab values charted over time
            - Reports and documents uploaded to the record
            - Case notes shared across the care team
        - heading: Panchakarma courses billed as packages
          plan: premium
          body: >-
            On Premium a Panchakarma course is billed as one package treatment, and the payment can be
            spread over the course. Advances and part payments are recorded against the package, and a
            refund or a voided invoice goes through only with authorisation.
          bullets:
            - Advances and part payments recorded against the package
            - Receipts and invoices sent to the patient on WhatsApp
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Oils and churnas in stock, tracked to expiry
          plan: enterprise
          body: >-
            Stock of Ayurvedic medicines such as churnas, kashayas (decoctions), oils and supplements is
            tracked with Enterprise, or with the pharmacy and inventory module added to Professional or
            Premium. With it, the clinic knows what is in stock before the doctor prescribes, and each batch
            is tracked to its expiry date.
          link:
            label: Read how pharmacy and inventory work
            href: /features/pharmacy-and-inventory/
        - heading: Cura AI drafts the note
          plan: professional
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the consultation note for the doctor to
            review.
          link:
            label: Read what Cura AI does
            href: /ai/

