h1: 'Ayurveda clinic software: Panchakarma courses and prescriptions on one record'
linkLabel: Ayurveda
eyebrow: For Ayurveda clinics and Panchakarma centres
openingAnswer: >-
  An Ayurveda clinic needs two things a general EMR leaves out: a treatment plan that holds a multi-day
  Panchakarma course session by session, and a prescription written in Ayurvedic medicines with the diet
  and daily routine beside it. EasyClinic keeps both on the patient's record, and its Premium plan, at
  {price:inr.premium.annual} per doctor per month billed annually in India or {price:usd.premium.annual}
  in US dollars, adds your own case-sheet forms and bills the course as one package paid in parts.
summary: >-
  The Panchakarma course and the Ayurvedic prescription on one treatment plan, with the course billed as
  one package paid in parts on the Premium plan.
