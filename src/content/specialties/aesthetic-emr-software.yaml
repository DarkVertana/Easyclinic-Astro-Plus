sections:
  - discriminant: painBlocks
    value:
      id: where-an-aesthetic-clinic-loses-track
      heading: Where an aesthetic clinic loses track
      intro: >-
        Aesthetic work is repeat work. A client comes back for a top-up months later, often to a<br class="hidden md:inline">
        different injector or a different branch, and the visit depends on what was done last time.
      items:
        - heading: Last session's notes are on a face chart in a drawer
          body: >-
            In June the doctor treated the client's frown lines and crow's feet and marked the points on a paper
            face chart. In October the client is back for a top-up with the clinic's other injector, who asks
            her what was done, because the chart is in the first doctor's drawer.
          fix: >-
            Every Botox, filler, peel or laser session is recorded on the client's record, with the
            before-and-after photographs beside it, so whoever sees her next opens what was done and how she
            looked before and after.
        - heading: The touch-up is never booked
          body: >-
            The doctor tells the client to come back in about four months for a top-up, and the client means to
            call. Nobody at the desk writes it down, and she next appears a year later, after the result has
            long faded.
          fix: >-
            The doctor sets the follow-up in the note, and Easy Clinic sends the client an automated reminder by
            SMS and email on every plan, with WhatsApp added on Premium, so the top-up is asked for rather than
            remembered.
        - heading: The vials in the fridge do not match the book
          body: >-
            Toxin, fillers and the cannulas that go with them are expensive, and the clinic counts them by hand
            at the end of the month. The count never matches the procedures in the appointment book, and nobody
            can say which sessions used what.
          fix: >-
            With the pharmacy and inventory module, a consumable that is part of a service or a package comes
            off the stock count when that service is billed, and each batch is tracked to its expiry date. The
            module comes with Enterprise, or is added to Professional or Premium.
        - heading: The client is treated at the other branch
          body: >-
            The clinic has two branches across the city. A client treated at one walks into the other for her
            top-up, and the second branch has no record of her, her photographs or her signed consent.
          fix: >-
            On Premium, Easy Clinic runs more than one location on one system, with appointments scheduled
            centrally and the same client record open at every branch.

  - discriminant: featureRows
    value:
      id: the-aesthetic-record
      heading: Built around the aesthetic client's record
      intro: >-
        Procedure templates and your own forms come with Premium, Easy Clinic's plan for
        specialists, and are not on Professional. Stock of injectables comes with Enterprise or as a
        module.
      layout: grid
      items:
        - heading: Before-and-after photographs on each session
          icon: scan-eye
          body: >-
            Capture and store before-and-after images of each aesthetic treatment on the client's record, and
            compare them at the follow-up to see how the client has responded. Documents and scanned reports
            are uploaded to the same record.
          bullets:
            - Before-and-after images stored on the client's record
            - Earlier photographs opened for comparison at the next visit
        - heading: Every procedure, session by session
          icon: history
          body: >-
            Track past and ongoing procedures, such as Botox, fillers, chemical peels and laser treatments,
            across the sessions and follow-ups they take. The client's profile holds skin type, allergies,
            medical history and past treatments, so an earlier procedure or an allergy is in view before the
            next one is planned.
          bullets:
            - Botox, fillers, peels and laser sessions tracked
            - Skin type, allergies and past treatments on the profile
        - heading: Consent on the client's record
          icon: file-check
          body: >-
            Consent documentation for a procedure is stored in the client's record, and a form signed on paper
            can be scanned and uploaded there as a document.
          bullets:
            - Procedure consent stored on the client's record
            - A form signed on paper scanned and uploaded
        - heading: Aesthetic procedure templates and your own forms
          icon: layout-template
          body: >-
            On Premium the chart comes with specialty templates, and the form builder turns a paper procedure
            sheet you already use into a digital form filled in at each session, with your own print layout.
          bullets:
            - Specialty templates on the chart with Premium
            - Your paper procedure sheet turned into a digital form
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the session note for the doctor to review.
          bullets:
            - Cura AI comes with every plan
            - The doctor reviews every draft session note

  - discriminant: featureRows
    value:
      id: procedures-packages-and-branches
      heading: Procedure days, packages and branches
      intro: >-
        An aesthetic clinic sells courses and runs machines that more than one doctor uses, often across more
        than one branch.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: The machine and the assistant booked with the client
          icon: calendar-clock
          body: >-
            Equipment and the assistant who runs it are booked inside the appointment slot, and the sessions of
            a course can be booked together. Booked appointments and walk-ins sit on the same calendar.
          link:
            label: Read how booking works
            href: /features/appointment-scheduling/
        - heading: Treatment packages paid over the course
          icon: receipt
          plan: premium
          body: >-
            On Premium a course of sessions is billed as one package treatment, with the payment spread over
            the course and every advance or part payment recorded against it. Refunds and discounts go through
            only with authorisation.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: More than one branch
          icon: layers
          plan: premium
          body: >-
            On Premium the clinic runs more than one location on one system, with central scheduling and the
            same client record at each branch.
          link:
            label: Read how more than one location works
            href: /features/multi-location/
        - heading: Injectables and consumables in stock
          icon: package
          plan: enterprise
          body: >-
            With pharmacy and inventory, which comes with Enterprise or as a module on Professional and
            Premium, the clinic keeps injectables, skincare products and supplies in stock. Each batch is
            tracked to its expiry date, and a consumable used in a service comes off the stock count with it.
          link:
            label: Read how pharmacy and inventory work
            href: /features/pharmacy-and-inventory/

