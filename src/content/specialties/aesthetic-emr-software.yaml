      body: |-
        ### Before & After Image Management
        Easily capture and store before-and-after images of aesthetic treatments, allowing for quick comparison and tracking of patient progress. Our software ensures secure, organized image management, enhancing patient engagement and providing clear visual evidence of treatment outcomes.

        ### Fast and Instant Prescriptions
        Generate detailed prescriptions in 30 seconds and share them immediately via print, WhatsApp, SMS, or email in any language.

        ### Personalized Aesthetic EMR
        Custom-built for Aesthetic specialists, tailored to your unique specialty, workflow, and preferences for a seamless and efficient experience.

        ### AI-Powered Efficiency
        Create prescriptions in just three clicks with the help of an AI assistant, simplifying your workflow and saving time.

        ### Visual Health Insights
        Monitor Aesthetic patient trends with ease using charts and graphs to visualize specific vitals, lab reports, and clinical parameters for improved care.

        ### Complete Patient Summaries
        Instantly access auto-generated case histories and facesheets, intelligently organized to save time and enhance patient care.

        ### User-Friendly Point-and-Click Interface
        Simplify documentation for Aesthetic specialists with an intuitive interface to record chief complaints, medical history, vitals, and more. Includes custom examination forms, auto-complete notes, diagnosis, medications, investigations, referrals, follow-ups, and patient guidelines, all easily accessible without the need to navigate through lengthy screens.

        ### Detailed Medical History Records
        Customize intake forms for patients to capture complete or concise medical histories, including chronic illnesses, family and social history, obstetric-gynecological details, substance use, alternative therapies, COVID history, and immunizations. All data is seamlessly integrated into the patient’s facesheet for quick and easy follow-ups.
