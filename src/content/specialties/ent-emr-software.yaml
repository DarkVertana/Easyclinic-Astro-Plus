editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The audiogram folded into the patient's bag and the scope pictures left on the endoscopy computer are
    ENT clinic problems, and every capability on the page is one that EasyClinic's live ENT page or
    plans.yaml states plainly.
  readsMachineWritten: >-
    The page has no named ENT specialist and no screenshot and names one ENT form only, so the chart rows
    read like a capability list, and an ENT surgeon will notice that it says nothing about connecting an
    audiometer or an endoscope, or about charting an audiogram.

notes:
  - 'Recruit a named ENT testimonial (spec 5.15 item 9): a named ENT specialist or ENT clinic owner on EasyClinic, with city, clinic and consent on file, added to src/data/testimonials/ and placed only on this page as a customer proofBlock or a single testimonialRow. Until then the proof block is the Capterra and Google badges, and its intro says no ENT quote exists yet. Capterra and Google review counts are null in facts.yaml, so the badges show no count. The four testimonials on the live ENT page (two psychiatrists, a general physician, an ophthalmologist) are not ENT and are placed on other pages.'
  - 'Grounding: stated plainly on the live /ent-emr-software/ page (retrieved 2026-09-26): ENT consultation templates; custom examination forms "like Ear Examination"; point-and-click recording of chief complaints, history, vitals, diagnosis, medications, investigations, referrals, follow-ups and patient guidelines with auto-complete; customisable intake forms feeding the facesheet; storage of "hearing test results, endoscopy records, and other diagnostic data" (FAQ); image and document upload; recording "minor surgeries and ENT procedures in patient records" (FAQ); "detailed follow-up tracking for recurring ENT conditions" (FAQ); automated follow up; drug interaction check; tabular Rx; side-by-side past records; clinical assistant or nurse intake; vitals and lab charts; form builder for paper forms; teleconsultation in a browser with online fee and a remote-consult line on the prescription; walk-ins, first-come-first-served, tokens, priority patients and waiting room status; resource booking (equipment or assistants) inside the appointment slot; multi-session booking; service list billing, part and advance payments, refunds and invoice voiding with authorisation, payment amortisation for package treatments, discount authorisation, taxable items, financial reports and Excel or PDF export; single-doctor and multi-doctor use (FAQ); cloud-based (FAQ). Plan placement follows plans.yaml.'
  - 'Plan tags: the live page ties nothing to a plan. The ENT templates row is tagged Premium because plans.yaml puts specialty EMR templates and your own clinical forms on Premium; package treatments, WhatsApp and video consultations are Premium per plans.yaml. Storage and upload of hearing tests and endoscopy records, procedure recording and follow-up tracking carry no plan tag, and the featureRows intro says only that Premium includes every row.'
  - 'Company to-do, spec 5.15 template items with no public source (no ENT must-have row exists in spec 5.15): (item 5) the ENT templates and forms by name and count, since the live page names only the Ear Examination form, and the fields on it; (item 6) devices and integrations with status: audiometer, tympanometer, endoscopy or video laryngoscopy camera, whether endoscopy video (not only stills) can be stored, whether audiogram thresholds can be entered and charted as data rather than uploaded as a file, and whether any direct device connection exists at all (the page is silent on it); (item 4) a timed walkthrough of the most common ENT visit; (item 8) which ENT note types Cura AI drafts, with one example; (item 7) whether common ENT procedures (for example tonsillectomy or septoplasty) are set up as package treatments, and procedure note and consent templates; which plan carries procedure documentation and follow-up tracking; whether audiologists and ENT assistants need a paid licence under per-doctor pricing.'
  - 'Dropped from the live page: both "Easy Clinic vs Other/Generic EMR" comparison tables (unsourced competitor cells), "prescriptions in 30 seconds", "invoices ready in less than 10 seconds", "over 100 graphical dashboards", "Reduces no-shows" (noShowReduction is null), AI diagnostic support and ADR alerts (CuraPilot claims), AI-powered wait-time alerts and AI two-way messaging (plan unclear), patient self-booking and check-in on the phone (plan unclear), "Inventory management is included for medicines and clinic supplies" and "Inventory for medicines & supplies: Built-in" (conflict with plans.yaml; the FAQ gives the plans.yaml answer), prescriptions "in any language" (only English and Swahili are confirmed), HR, roster, incentive and commission features (plan unclear), data warehouse and Power BI (Enterprise chain scope), the shared stat line, and the "14-Day Free Trial, with an extra 30-Day Money Back Guarantee" and "try Easy Clinic absolutely free" lines (owner decision: no free trial).'
  - 'No dataTable of templates: the live page names one ENT template (Ear Examination), which is too few to count; add the table once the company lists the ENT templates by name. No dayTimeline: no timed ENT visit exists.'
  - 'No heroMedia and no media: screenshots do not exist yet. When the seeded demo tenant exists, capture the ENT chart with the ear examination form as hero, an audiogram and an endoscopy image uploaded on the patient record, and a minor procedure recorded and billed from the service list.'
  - 'The four pains are illustrative ENT clinic situations, not customers; "a bead out of a child''s nose" and "the polyp" are examples. The video row''s line that an examination still needs the clinic is a clinical admission, not a product limit.'
  - 'Removed in the adversarial fact check (2026-09-26), for lack of a plain source: that audiograms and scope images go in only as files, and that a direct audiometer or endoscopy connection is custom integration work scoped per project (a device integration status; the plans.yaml add-on names lab machines, accounting and an HIS only); "examination findings" in the point-and-click list (the live list is used instead); "where its price is set once" (the live page says service prices can be adjusted); "with the visit they came from"; walk-ins and booked patients "in one list" and a priority patient "moved up"; an audit log showing "who made each entry on a patient''s record" (the live page says only audit logs); and "the cloud version needs a working connection while you see patients" (the live page says only that it does not run fully offline). The ear examination form is now called a custom examination form, as the live page does, rather than one of the ENT consultation templates.'
  - 'Title 28 characters; meta description 151 characters with the token resolved ($99), 155 as the linter counts tokens. The brief H1 "EMR for ENT clinics" is extended in the spec 5.15 item 1 pattern with two honest objects. /clinic-management-software-india/ and /emr-software-in-kenya/ are still drafts; the related links resolve once they publish. The Kenya link description avoids integration status and names only the bilingual prescription from facts.md.'
  - The editorial pass recorded here is an AI review. A human editor still needs to read the page aloud and answer the two spec 6.5 questions; the page has no named person and no measured number, so it meets only two of the four spec 6.5 pass marks (a local fact in the rupee price, and admissions of limits in the stock and offline answers) until the testimonial arrives.
