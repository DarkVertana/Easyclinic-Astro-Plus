sections:
  - discriminant: painBlocks
    value:
      id: where-an-ent-clinic-loses-track
      heading: Where an ENT clinic loses track
      intro: >-
        An ENT visit often produces a hearing test or a scope picture as well as the note, and those are
        the records that end up somewhere other than the chart.
      items:
        - heading: Last year's audiogram is in the patient's plastic bag
          body: >-
            A patient with hearing loss comes back after a year for a repeat audiogram. The old report is
            folded into a bag of papers, or filed in the audiometry room, and the comparison the whole visit
            turns on waits until someone finds it.
          fix: >-
            The scanned hearing test report uploads to the patient's record, beside the visits written
            there, so last year's result is already on the record when this year's is added.
          href: /features/emr/
          linkLabel: Read how the chart works
        - heading: The scope pictures stay on the endoscopy computer
          body: >-
            A diagnostic nasal endoscopy is saved on the computer beside the scope, or printed and handed
            to the patient. At the review visit the doctor describes the polyp from memory, because the
            picture is on another machine in another room.
          fix: >-
            Upload the images and the report to the patient's record after the procedure, and they are on
            the chart at the review.
        - heading: The wax removal is done but never written up
          body: >-
            Between consultations the doctor clears an impacted ear or takes a bead out of a child's nose in
            the procedure room. The procedure goes in a register, if anywhere, and the desk bills it from
            what the assistant remembers.
          fix: >-
            Minor surgeries and ENT procedures are recorded in the patient's record, and the desk bills
            each one as an item from the clinic's service list.
          href: /features/billing/
          linkLabel: Read how billing works
        - heading: The ear that keeps discharging
          body: >-
            Chronic ear discharge and sinusitis come back, and the patient returns every few months with no
            memory of what was tried last time. Nobody calls the ones who stop coming, because the follow-up
            dates are in the doctor's head.
          fix: >-
            Follow-up for a recurring ENT condition is tracked on the patient's record, so the next visit
            starts from what was tried last time, and the follow-up itself is automated.

  - discriminant: featureRows
    value:
      id: the-ent-chart
      heading: Built around the ENT chart
      intro: >-
        What the doctor records in the consulting room and the procedure room. Premium, the plan for
        specialists, includes every row below, and the row marked Premium is not on Professional.
      items:
        - heading: The consultation, by point and click
          body: >-
            Chief complaint, history, vitals, diagnosis, medicines, investigations, referrals, patient
            guidelines and the follow-up date are recorded by point and click, with auto-complete, without
            paging through long screens. The medicines and investigations you order most sit within reach,
            and the prescription goes through a drug interaction check.
          bullets:
            - A tabular prescription, printed or sent to the patient
            - A facesheet with the patient's key history on one screen
            - Past records opened side by side with today's visit
            - History and vitals taken by an assistant or nurse before the doctor
        - heading: ENT templates, with the ear examination form
          plan: premium
          body: >-
            On Premium the chart comes with the ENT consultation templates and custom examination forms,
            such as the ear examination form. If you examine the nose and throat on a paper form of your
            own, the form builder turns it into a digital form, and you set your own print layout for the
            prescription and the case sheet.
          media:
            kind: screenshot
            src: ../../assets/images/screens/ent-ear-examination.png
            alt: Ear examination form for the left and right ear, with tympanic membrane and tuning fork findings
            caption: The ear examination form, left and right.
            frame: browser
            origin: old-site
            capturedOn: '2025-01'
          link:
            label: Compare what each plan includes
            href: /pricing/
        - heading: Hearing tests and endoscopy records
          body: >-
            Hearing test results and endoscopy records are stored in EasyClinic. Scanned reports and images
            upload to the patient's record, so the audiogram and the scope pictures sit beside the visits
            they belong to. Vitals are charted over time on the same record, and on Premium lab reports
            come into the chart as well.
          bullets:
            - Audiograms and other hearing test reports on the record
            - Endoscopy images and reports on the same record
            - Reports the patient brings, scanned and attached
            - Vitals charted visit by visit
        - heading: Procedures and minor surgery on the record
          body: >-
            Minor surgeries and ENT procedures done in the clinic are recorded in the patient's record.
            When a procedure is booked ahead, the equipment or the assistant it needs is booked inside the
            same appointment slot, and the multi-resource calendar shows the desk what is already taken.
        - heading: Cura AI drafts the note
          plan: professional
          body: >-
            Cura AI, the documentation assistant, comes with every plan. It drafts the note, and the draft
            stays a suggestion until the doctor corrects and confirms it.
          link:
            label: Read what Cura AI does
            href: /ai/

  - discriminant: featureRows
    value:
      id: the-visit
      heading: An ENT visit, from the front desk to the follow-up
      intro: >-
        What happens around the consultation, in a clinic with one doctor and a receptionist.
      items:
        - heading: Booked patients and walk-ins at the same desk
          body: >-
            The desk books fixed-time appointments and takes walk-ins first come, first served, and a
            priority appointment can go to the patient who needs one. The waiting room view shows the queue
            and how long each patient has waited, so the receptionist can answer the patient who asks.
          bullets:
            - Token numbers for the walk-in queue
            - Several sessions booked in one go
          link:
            label: Read how booking works
            href: /features/appointment-scheduling/
        - heading: The bill for the consultation and the procedure
          body: >-
            The receptionist bills the consultation and any procedure from the clinic's service list, and
            each payment is recorded against the bill, with the balance on screen. Part payments and
            advances are recorded at the desk, and a refund or a voided invoice goes through only with
            authorisation.
          bullets:
            - Discounts only with authorisation
            - Taxable and non-taxable items kept apart on the bill
            - Receipts sent by SMS or email, and on WhatsApp with Premium
            - Daily and monthly financial reports, exported to Excel or PDF
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Treatment billed as a package
          plan: premium
          body: >-
            On Premium a treatment sold as a package is billed as one package treatment, and the payment
            can be spread over the course of the treatment, with each part payment recorded against it.
        - heading: Reminders for the follow-up visit
          body: >-
            The follow-up date goes in the note, and the patient gets an automated reminder for it, by SMS
            or email on every plan and by WhatsApp on Premium.
          link:
            label: Read how WhatsApp reminders work
            href: /features/whatsapp/
        - heading: Video follow-ups
          plan: premium
          body: >-
            On Premium, a video consultation is booked through the appointment screen and the fee can be
            collected online at booking. Doctor and patient join from a web browser on a computer or a
            phone, and the prescription is sent with a line saying the consultation was remote. It suits a
            review of symptoms or a report; a review that needs the otoscope or the scope still happens in
            the clinic.
          link:
            label: Read how video consultations work
            href: /features/telehealth/

  - discriminant: proofBlock
    value:
      id: ratings
      heading: How clinics rate EasyClinic
      intro: >-
        We do not yet have an ENT specialist's own words to put on this page. These are EasyClinic's public
        ratings, from clinics of every kind.
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'

  - discriminant: stepList
    value:
      id: training
      heading: '{fact:trainingDays} days of training, about two hours in all'
      intro: >-
        Training is included in every plan, in sessions of 20 to 40 minutes spread over
        {fact:trainingDays} days, short enough to fit between the morning and evening OPD, so the clinic
        keeps seeing patients while you learn.
      steps:
        - title: 'Day 1: basic training'
          meta: 40 minutes
          body: >-
            The screens the front desk and the doctor use every day. Bring your receptionist, whose login is
            part of the plan.
        - title: 'Day 2: EMR scenario training'
          meta: 40 minutes
          body: >-
            You work through the chart and the prescription on the kinds of case your clinic sees.
        - title: 'Day 3: practice exercises'
          meta: 20 minutes
          body: You repeat what the first two sessions covered, so the first real patient is not your first attempt.
        - title: 'Day 4: road to expertise'
          meta: 20 minutes
          body: The shortcuts that make each note quicker, once the basics have become habit.
      note: >-
        From the demo, a clinic can be live in as little as {fact:goLiveDays} days.

faqHeading: Questions ENT clinic owners ask
faq:
  - question: Which EasyClinic plan does an ENT clinic need, and what does it cost?
    answer: >-
      Premium, if you want the ENT consultation templates and your own examination forms: it costs
      {price:inr.premium.annual} per doctor per month billed annually in India, or
      {price:usd.premium.annual} in US dollars. Professional, at {price:inr.professional.annual} or
      {price:usd.professional.annual}, has the EMR and the billing but not the specialty templates. Both
      include a reception login, with no setup fee and no binding contract.
  - question: Can I keep audiograms and endoscopy pictures on the patient's record?
    answer: >-
      Yes, hearing test results and endoscopy records are stored in EasyClinic, and scanned reports and
      images upload to the patient's record. When the patient comes back for a repeat audiogram, last
      year's report is on the same record as this year's.
  - question: Can I record the minor procedures I do in the clinic?
    answer: >-
      Yes, minor surgeries and ENT procedures are recorded in the patient's record, and each one is billed
      from the clinic's service list. If a procedure needs a piece of equipment or an assistant, book it
      inside the appointment slot so the desk can see it is taken.
  - question: Is EasyClinic too much for a one-doctor ENT clinic?
    answer: >-
      No, it works for single-doctor clinics as well as multi-doctor centres, and Professional is the plan
      for a doctor running their own clinic with a receptionist. Move to Premium when you want the ENT
      templates and your own forms. Training takes about two hours over {fact:trainingDays} days.
  - question: Can I turn my own paper examination form into a digital one?
    answer: >-
      Yes, on Premium, which includes your own clinical forms and print layouts: the form builder turns a
      paper form, such as your nose and throat examination sheet, into a digital form on the chart. We do
      not charge for the customisation itself.
  - question: Can my receptionist read the ENT notes?
    answer: >-
      No, the reception login included in the price is not allowed into the EMR and cannot issue
      prescriptions. Access is set by role for every login, and user activity is kept in audit logs.
  - question: Does EasyClinic manage the clinic's medicine stock?
    answer: >-
      Not on Professional or Premium alone: pharmacy and inventory are included in Enterprise, or added to
      Professional and Premium as a module. With the module, the pharmacy dispenses from the doctor's
      prescription and tracks each batch to its expiry date.
  - question: Does EasyClinic work without an internet connection?
    answer: >-
      No, EasyClinic does not run fully offline today, so plan on a working internet connection in the
      consulting room and at the desk. A self-hosted option also exists, where the system runs on the clinic's own server
      rather than in EasyClinic's cloud.

