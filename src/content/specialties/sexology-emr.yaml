sections:
  - discriminant: painBlocks
    value:
      id: where-sexology-clinics-lose-trust
      heading: Where a sexology clinic loses a patient's trust
      intro: >-
        Many patients take months to book a first appointment with a sexologist, and a single moment that feels exposed can<br class="hidden lg:inline">
        be the reason they do not come back. These are the moments that happen between the desk and the consulting room.
      items:
        - heading: The reason for the visit is written on the file at the desk
          body: >-
            The patient's file waits on the reception desk until the doctor calls them in, with the last
            consultation's notes inside it. Anyone who works the desk, or stands at it, can read why they came.
          fix: >-
            Each person logs in as themselves, and the role on that login decides which screens they can open.
            The reception login included in the price is not allowed into the EMR and cannot issue
            prescriptions, and audit logs keep a record of what each user did.
        - heading: The counselling sessions live in a notebook
          body: >-
            The doctor prescribes and the counsellor sees the couple every two weeks, writing in her own
            notebook. At the review, the doctor cannot see what the sessions covered or whether the exercises
            are helping.
          fix: >-
            Session notes and progress go on the patient's record against a treatment plan, and collaborative
            case notes let the doctor and the counsellor work from the same record.
        - heading: The patient who will not sit in a waiting room
          body: >-
            A patient from a small town will not be seen walking into a sexology clinic, so the follow-up
            happens on the doctor's personal phone, and the prescription is a photo of the pad.
          fix: >-
            On Premium a video consultation is booked from the appointment screen, with the fee paid online at
            booking. The patient joins from a web browser on a phone or a computer, and the prescription goes
            to them on WhatsApp or by email, marked as issued after a remote consultation.
        - heading: A course of sessions paid in cash, tracked from memory
          body: >-
            Therapy is agreed as a course of sessions, and the patient pays something at each visit. By the
            sixth session neither the patient nor the desk is sure what is still owed.
          fix: >-
            On Premium the course is billed as one package treatment, and every advance and part payment is
            recorded against it, so the balance is on the bill before the next session.

  - discriminant: featureRows
    value:
      id: sexology-record
      heading: Built around a private sexology record
      intro: >-
        Sexology templates, private video consultations and package billing need Easy Clinic's Premium plan,
        the plan most specialists choose. Who can open the record is set on every plan.
      layout: grid
      items:
        - heading: Who can open the record
          icon: lock
          body: >-
            Access is set by role and by department, so the front desk and the clinicians each open only the
            screens their role allows. The reception login is not allowed into the EMR and cannot issue
            prescriptions, and audit logs and usage history keep a record of what each user did. The EMR also
            has confidential notes, and the scheduler has confidential appointments.
          bullets:
            - Confidential notes and confidential appointments
            - Audit logs and usage history for each user
        - heading: Sexology templates
          icon: layout-template
          body: >-
            Premium includes Easy Clinic's specialty templates, with templates for sexual dysfunctions such as
            erectile dysfunction and vaginismus. A paper intake form or questionnaire your clinic already uses
            can be rebuilt in the form builder, and your prescription prints in your own layout.
          bullets:
            - Templates for erectile dysfunction and vaginismus
            - Your own paper forms, rebuilt with the form builder
        - heading: The history, taken once
          icon: file-heart
          body: >-
            The intake form records chronic illnesses, family and social history, substance use and earlier
            treatments, with as much or as little detail as the clinic wants. What it records goes onto the
            patient's facesheet, so the patient is not asked the same questions at every visit.
          bullets:
            - Substance use and earlier treatments on the facesheet
            - The patient is not asked the same questions each visit
        - heading: Counselling sessions and the treatment plan
          icon: heart-handshake
          body: >-
            Each therapy or counselling session is recorded on the patient's record, with progress tracked
            against the treatment plan, and collaborative case notes let the doctor, the counsellor and the
            nurse work from the same record. Several sessions can be booked at once.
          bullets:
            - Progress tracked against the treatment plan
            - Doctor, counsellor and nurse work from the same record
        - heading: Medicines, with an interaction check
          icon: pill
          body: >-
            Prescriptions and the treatment plan are tracked on the record, past records open side by side with
            today's visit, and the drug interaction check warns of an interaction while the prescription is
            written.
          bullets:
            - Prescriptions tracked with the treatment plan
            - Past records open side by side with today's visit
        - heading: Private video consultations
          icon: video
          body: >-
            On Premium a video consultation is booked from the appointment screen beside visits in person, and
            the fee can be paid online at booking. Easy Clinic has video and chat built in, so the patient joins
            from a web browser with nothing to install.
          bullets:
            - The fee can be paid online at booking on Premium
            - The patient joins from a web browser with nothing to install
        - heading: A course of sessions, billed as one package
          icon: wallet
          body: >-
            On Premium a course of therapy is billed as one package treatment, with the payment spread over the
            course and each advance and part payment recorded against it.
          bullets:
            - Payment spread over the course of therapy
            - Each advance and part payment recorded against it
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the note for the doctor to review.
          bullets:
            - Cura AI comes with every plan
            - The doctor reviews every draft note

