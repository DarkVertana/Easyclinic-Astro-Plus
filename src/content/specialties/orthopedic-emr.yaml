      body: |-
        ### 30-Second Prescription
        Generate complete prescriptions in under 30 seconds, instantly available in any language via print, WhatsApp, SMS, or Email.

        ### Specialized Orthopedic EMR
        Tailored to match the unique needs, workflows, and preferences of orthopedicians for a personalized experience.

        ### AI-Driven Efficiency
        Streamline prescriptions with an AI assistant, completing them in just three clicks and reducing documentation time.

        ### Electronic Medical Records (EMR)
        Detailed patient history with orthopedic-specific fields (e.g., joint pain severity, mobility assessments, X-ray/MRI results).

        ### Template-Driven Documentation
        Pre-built templates for orthopedic diagnoses, treatment plans, and procedures (e.g., fracture management, joint replacement, physical therapy).

        ### Visual Health Insights
        Visualize key vitals, lab results, and clinical parameters through charts and graphs, providing a clear view of patient health trends.

        ### Streamlined Patient Summaries
        Gain instant access to auto-generated orthopedic patient summaries and facesheets, offering a concise and intelligent review of case histories while saving valuable time.

        ### Intuitive Point-and-Click Interface
        Simplify documentation with an easy-to-use point-and-click UI for recording chief complaints, medical history, vitals, and more. Features custom examination forms, auto-complete notes, diagnosis, medications, investigations, referrals, follow-ups, and patient guidelines. Enjoy the flexibility to access specific controls without navigating through lengthy screens.

        ### Detailed Medical History Tracking
        Create custom intake forms to record patients medical histories as extensively or briefly as needed. Capture details such as chronic illnesses, family and social history, obstetric-gynecological details, substance use, alternative therapies, COVID history, and immunizations. These records are seamlessly integrated into the pain management patient’s facesheet, streamlining follow-up visits and saving valuable time.
