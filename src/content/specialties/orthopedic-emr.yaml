editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The film that travels in the patient's bag and the physiotherapy slip that never comes back are
    orthopaedic problems, and every capability that answers them comes from EasyClinic's live orthopaedic
    page or plans.yaml, with the theatre and ward limit taken from the published hospital OPD scope;
    nothing is specific to one country beyond the rupee price.
  readsMachineWritten: >-
    The page has no named orthopaedic surgeon and no measured number, the fracture review walkthrough
    carries no timings, and an orthopaedic surgeon will notice that implant tracking and any DICOM viewer
    or imaging-archive link are not mentioned.

notes:
  - 'Recruit a named orthopaedic testimonial (spec 5.15 item 9): an orthopaedic surgeon or clinic owner on EasyClinic, with city, clinic and consent on file, added to src/data/testimonials/ and placed only on this page. The one orthopaedic testimonial on file, chao-rochek-buragohain (Arogya Orthopaedic Clinic, city null), is assigned to the home page and praises usability rather than an orthopaedic feature; decide whether it moves here. Until then the proof block is the Capterra and Google badges, with no review counts (null in facts.yaml).'
  - 'Grounding: orthopaedic history fields (joint pain severity, mobility assessments, X-ray and MRI results), pre-built templates for diagnoses, treatment plans and procedures (fracture management, joint replacement, physical therapy named as examples), storage of X-rays, MRI scans and other imaging in patient records, image and document upload, documentation of surgeries, fracture treatments and other procedures, referral management, automated follow-up, drug interaction check, side-by-side past records, nurse or clinical assistant intake, vitals and lab charts, the form and template builder, personalised print formats and case sheet, video consultations with online fees and the remote-consult disclaimer on the prescription, token numbers and waiting room management, one-click billing, part and advance payments, refunds and invoice voiding with authorisation, payment amortisation for package treatments and taxable item handling are all stated plainly on the live /orthopedic-emr/ page (retrieved 2026-09-26). Plan placement follows plans.yaml: specialty templates, own forms and print layouts, package treatments, video and WhatsApp on Premium; pharmacy and inventory on Enterprise or as a module. The theatre and ward limit comes from the published /solutions/hospital-opd/ scope box.'
  - 'Spec 5.15 must-have "implant tracking" is left out: the live page does not mention implants, and plans.yaml covers pharmacy and general inventory only. Company to confirm whether EasyClinic records which implant (make, size, batch or serial number) went into which patient, whether implant stock is tracked in the inventory module, and on which plan. Then add a feature row and a FAQ.'
  - 'Spec 5.15 must-have "imaging" is included as file-based storage only (uploaded images and documents on the record, side-by-side past records). Company to confirm whether a DICOM viewer exists, whether any X-ray machine or PACS connection has been built, and with what status; the imaging FAQ now states only file-based storage. The earlier line that a direct feed from an X-ray machine or imaging archive "would be custom integration work" was cut in the 26 September edit: plans.yaml scopes the integrations add-on to lab machines, accounting systems and an existing HIS, so it implied a device integration nobody has confirmed.'
  - 'Spec 5.15 must-have "physio referrals" is included as referral management from the chart and a shared record for a physiotherapist working in the same clinic or hospital, linking /physiotherapy-clinic-management-software/. Company to confirm whether a referral can be sent electronically to a physiotherapist outside the clinic (the live page mentions WhatsApp, SMS and email messages to referral doctors and third-party providers but not referral letters), and whether the physiotherapy session record appears on the orthopaedic chart when the physiotherapist is a separate EasyClinic customer.'
  - 'Spec 5.15 must-have "surgical packages" is included through package treatments on Premium (plans.yaml) and the live billing rows. Company to confirm whether a package shows the procedures or reviews used and remaining, and how a package billed in the clinic works when the surgery happens in a hospital on another system.'
  - 'Other spec 5.15 template items not yet possible: the full list and count of orthopaedic templates and forms (item 5; the live page names three as examples, so they are feature-row bullets rather than a dataTable); a timed walkthrough of the review visit (item 4; the fracture review rows carry no minutes because no timing is measured); devices and integrations used in orthopaedics with status (item 6); which orthopaedic note types Cura AI drafts, with one example note (item 8); whether the orthopaedic history fields need Premium (the live page does not tie them to a plan; the 26 September edit moved them into the Premium templates row as the conservative reading of "Specialty EMR templates" in plans.yaml, so a Professional buyer is not promised them; badge them on Professional if the company confirms); how nurses, clinical assistants and physiotherapists are licensed under per-doctor pricing.'
  - 'Dropped from the live page: both "Easy Clinic vs Other EMR" comparison tables (unsourced competitor cells), "prescriptions in under 30 seconds" and "three clicks", "invoices ready in less than 10 seconds", "over 100 graphical dashboards", "Reduces no-shows" (noShowReduction is null), prescriptions "in any language" (only English and Swahili are confirmed), AI diagnostic support and ADR alerts (CuraPilot claims), AI wait-time alerts and AI two-way messaging, patient self check-in (plan unclear), the "Inventory for medicines & supplies: Built-in" cell and FAQ (plans.yaml puts inventory on Enterprise or as a module), "Rehabilitation & follow-up tracking: Advance" and the rehabilitation FAQ (its answer is about paediatric care, a copy error), the shared "Where clinics lose time" style filler, the four non-orthopaedic testimonials, and the "14-Day Free Trial, with an extra 30-Day Money Back Guarantee" and "try Easy Clinic absolutely free" lines (owner decision: no free trial).'
  - 'No heroMedia and no media: screenshots do not exist yet. Hero when captured: an orthopaedic record with an X-ray open beside the visit note from the fracture management template; then the package bill with an advance and a part payment. The four pains are illustrative orthopaedic situations, not customers; "six weeks", "two weeks late" and the knee replacement are examples.'
  - 'Title 35 characters; meta description 147 characters (no tokens). H1 starts with the spec 4.3 H1 "EMR for orthopaedic clinics" and adds the spec 5.15 item 1 pattern with two items instead of three (spec 6.2 groups of three), as the cardiology, ENT and paediatric pages do. The offline FAQ follows the live /best-clinic-management-software-kenya/ wording: a self-hosted deployment for larger clinics and groups that want data on their own infrastructure. /clinic-management-software-india/ and /emr-software-in-kenya/ are drafts; those related links resolve once they publish.'
  - The editorial pass recorded here is an AI review. A human editor still needs to read the page aloud and answer the two spec 6.5 questions; the page has no named person and no measured number, so it meets only two of the four spec 6.5 pass marks (a local fact in the rupee price, and admissions of limits on theatres, wards, offline use and plan placement) until the testimonial arrives.
