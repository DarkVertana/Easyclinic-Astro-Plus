sections:
  - discriminant: painBlocks
    value:
      id: where-orthopaedic-clinics-lose-track
      heading: Where an orthopaedic clinic loses track
      intro: >-
        Orthopaedic care runs over weeks and months, from the injury to the last review after
        physiotherapy, and most of what goes missing falls between one visit and the next.
      items:
        - heading: The X-ray travels in the patient's bag
          body: >-
            The patient brings last month's films to the fracture review, when they remember them. The MRI
            report from the diagnostic centre is a photo on the patient's phone, and the doctor holds the old
            film up to the window beside today's.
          fix: >-
            X-rays and MRI scans are uploaded to the patient's record and stay there, and past records open
            beside today's visit, so the comparison does not wait on what the patient remembered to bring.
          href: /features/emr/
          linkLabel: Read how the chart works
        - heading: The six-week review nobody booked
          body: >-
            The plaster goes on and the patient is told to come back in six weeks, a date written only on
            the prescription. Nobody at the desk knows who is due that week, so the patient turns up two
            weeks late, or not at all.
          fix: >-
            The follow-up is set from the chart before the patient leaves, and an automated reminder goes
            out before the date. SMS and email reminders come with every plan, and Premium adds WhatsApp.
          href: /features/appointment-scheduling/
          linkLabel: Read how booking and reminders work
        - heading: The physiotherapy slip that never comes back
          body: >-
            When the cast comes off, the patient leaves with a slip for physiotherapy. At the next review the
            doctor asks how many sessions they did and what the physiotherapist found, and the answer
            depends on the patient's memory.
          fix: >-
            The referral is written from the chart and stays on the patient's record. If the
            physiotherapist works in your clinic or hospital on EasyClinic, they write on the same patient
            record, so their notes are there when the patient comes back to you.
          href: /physiotherapy-clinic-management-software/
          linkLabel: Read about EasyClinic for physiotherapy
        - heading: The surgery package lives in a register
          body: >-
            A knee replacement is quoted as one package. The patient pays an advance when the date is fixed
            and the balance after the operation, and the accounts desk tracks both in a register. When the
            surgery is postponed, nobody is sure what was paid or what is owed back.
          fix: >-
            On Premium the surgery is billed as one package treatment, with the payment spread over the
            course of treatment and every advance and part payment recorded against it. The desk sees the
            balance straight away, and a refund goes through only with authorisation.
          href: /pricing/
          linkLabel: See what Premium includes

  - discriminant: featureRows
    value:
      id: orthopaedic-chart
      heading: Built around the orthopaedic chart
      intro: >-
        Rows marked Premium need EasyClinic's Premium plan, the plan for specialists. The orthopaedic
        history and templates, and package billing, are the two rows below that Professional does not
        include.
      items:
        - heading: Orthopaedic history and templates
          plan: premium
          body: >-
            Premium includes EasyClinic's specialty EMR templates. For orthopaedics the history has fields
            such as joint pain severity and mobility assessment, with the X-ray and MRI results recorded
            alongside. Pre-built templates cover orthopaedic procedures, fracture management and joint
            replacement among them, and a physical therapy template covers the rehabilitation that follows.
            A paper examination or intake form your clinic already uses can be rebuilt in the form builder,
            and your prescription and case sheet print in your own layout, with no charge for the
            customisation.
          bullets:
            - Fracture management template
            - Joint replacement template
            - Physical therapy template
            - Your own paper forms, rebuilt with the form builder
        - heading: X-rays and MRI scans on the record
          body: >-
            X-rays and MRI scans are stored on the patient's record as uploaded images and documents, with
            any other imaging the patient brings in. Past records open side by side with today's visit, and
            the patient's visits over the years sit on one screen.
        - heading: Surgeries and procedures on the same record
          body: >-
            A surgery or a fracture treatment is documented on the patient's record like any other
            procedure, so the operation and every review after it are in one place. EasyClinic runs the
            outpatient side: the operating theatre's own scheduling and records, and the wards, stay on the
            hospital's system.
        - heading: Referrals, physiotherapy included
          body: >-
            Referral management is part of the chart, so the referral is written during the consult and
            stays on the patient's record. A physiotherapist who works in your clinic or hospital on
            EasyClinic writes on the same record, and you see their notes at the next review.
          link:
            label: Read about EasyClinic for physiotherapy
            href: /physiotherapy-clinic-management-software/
        - heading: Surgery packages, paid in parts
          plan: premium
          body: >-
            On Premium a surgery or a course of treatment is billed as one package treatment, and the patient
            can pay for it in parts. Advances and part payments are recorded against the package, and a
            refund or a voided invoice goes through only with authorisation.
          bullets:
            - Advances and part payments recorded against the package
            - Refunds and voided invoices only with authorisation
            - Taxable and non-taxable items handled automatically
            - Receipts and invoices sent to the patient on WhatsApp or email
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Cura AI drafts the note
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the note beside the consult, and the
            draft stays a draft until the doctor reviews and signs it.
          link:
            label: Read what Cura AI does
            href: /ai/

  - discriminant: featureRows
    value:
      id: fracture-review
      heading: A fracture review, from the desk to the bill
      intro: >-
        The review visit is the one an orthopaedic clinic repeats most: the patient is back with a new
        X-ray, and the doctor decides what happens next. This is how that visit runs on EasyClinic.
      items:
        - heading: At the desk
          body: >-
            The patient checks in at the desk, booked or walked in, and gets a token number for the queue.
            The new X-ray, or the report that came with it, is uploaded to the patient's record, and a nurse
            or clinical assistant takes the complaint and the vitals before the consult.
          link:
            label: Read how the queue works
            href: /features/appointment-scheduling/
        - heading: In the consulting room
          body: >-
            The doctor has last month's X-ray open beside today's visit and writes the note by point and
            click, or from the orthopaedic template on Premium. The prescription screen warns of a drug
            interaction while it is being written, and the prescription prints for the patient or goes out by
            email, or on WhatsApp on Premium.
        - heading: The referral and the next review
          body: >-
            A referral to physiotherapy is written from the chart, and the follow-up date is set before the
            patient leaves. The reminder goes to the patient automatically before the review.
        - heading: At the bill
          body: >-
            The visit is billed in one click at the desk, or recorded against the surgery package on
            Premium. Either way the balance shows straight away.

  - discriminant: proofBlock
    value:
      id: ratings
      heading: How clinics rate EasyClinic
      intro: >-
        These are EasyClinic's public ratings, from clinics of every kind rather than orthopaedic clinics
        alone.
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'

  - discriminant: stepList
    value:
      id: training
      heading: How long does it take to learn EasyClinic?
      intro: >-
        About two hours, spread over {fact:trainingDays} days, and training is included in every plan. Each
        session is 20 to 40 minutes, short enough to fit between the morning OPD and the evening clinic, so
        the clinic keeps seeing patients while the team learns.
      steps:
        - title: 'Day 1: basic training'
          meta: 40 minutes
          body: >-
            The screens the front desk and the doctors use every day. Bring your receptionist, whose login
            is part of the plan.
        - title: 'Day 2: EMR scenario training'
          meta: 40 minutes
          body: >-
            You work through the chart and the prescription on the kinds of case your clinic sees, from a
            first visit after an injury to a review.
        - title: 'Day 3: practice exercises'
          meta: 20 minutes
          body: You repeat what the first two sessions covered, so the first real patient is not your first attempt.
        - title: 'Day 4: road to expertise'
          meta: 20 minutes
          body: The shortcuts that make each note quicker, once the basics have become habit.
      note: >-
        From the demo, a clinic can be live in as little as {fact:goLiveDays} days.

faqHeading: Questions orthopaedic clinic owners ask
faq:
  - question: Which EasyClinic plan does an orthopaedic clinic need, and what does it cost?
    answer: >-
      Premium, the plan for specialists, because the orthopaedic templates and package treatments start
      on it: {price:inr.premium.annual} per doctor per month billed annually in India or
      {price:inr.premium.quarterly} billed quarterly, and {price:usd.premium.annual} or
      {price:usd.premium.quarterly} in US dollars. Professional, at {price:inr.professional.annual} or
      {price:usd.professional.annual} billed annually, has the chart and billing but no specialty templates
      or package treatments. Both include a reception login, with no setup fee and no binding contract.
  - question: Can I keep X-rays and MRI scans in EasyClinic?
    answer: >-
      Yes, X-rays and MRI scans are stored on the patient's record, uploaded as images or as documents,
      with any other imaging the patient brings in. Past records open side by side with today's visit, so
      last month's X-ray is on screen at the fracture review whether or not the patient brought the film.
  - question: Can I write the operation note in EasyClinic?
    answer: >-
      Yes, surgeries and fracture treatments are documented on the patient's record like any other
      procedure, and on Premium the orthopaedic templates cover procedures such as joint replacement.
      EasyClinic does not run the operating theatre: theatre scheduling and the theatre's own records stay
      on the hospital's system, as do admissions and the wards.
  - question: How do I refer a patient to physiotherapy and follow their progress?
    answer: >-
      Write the referral from the chart, where it stays on the patient's record, and on Premium use the
      physical therapy template for the rehabilitation plan. If the physiotherapist works in your clinic or
      hospital on EasyClinic, their notes go on the same record, so you read them at the next review.
  - question: How is a surgery package billed when the patient pays in parts?
    answer: >-
      On Premium the surgery is billed as one package treatment, and each advance or part payment is
      recorded against it, so the desk sees the balance before taking the next payment. If the surgery is
      cancelled, a refund or a voided invoice goes through only with authorisation.
  - question: Does EasyClinic run the clinic pharmacy and the stock?
    answer: >-
      Yes, but not on Premium alone: pharmacy and inventory come with Enterprise, or as a module added to
      Professional or Premium. With the module, the pharmacist dispenses from the doctor's prescription and
      tracks each batch to its expiry date.
  - question: Can I see a patient by video after surgery?
    answer: >-
      Yes, on Premium, which includes video consultations booked through the appointment screen, with the
      option to collect the fee online at booking. The patient joins from a web browser on a computer or a
      phone, and the prescription goes out on WhatsApp or email, marked as issued after a remote
      consultation.
  - question: Does EasyClinic work without an internet connection?
    answer: >-
      No, EasyClinic does not run fully offline today: the cloud version needs an internet connection, so
      the clinic needs a working line while it sees patients. Larger clinics and groups that want their
      data on their own infrastructure can choose a self-hosted deployment instead of EasyClinic's cloud.

