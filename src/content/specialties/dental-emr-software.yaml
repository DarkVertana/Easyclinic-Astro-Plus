editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The root canal that never gets its crown and the braces paid off in a notebook are dental problems,
    and every dental capability comes from Easy Clinic's own dental page, with a plan named only where
    plans.yaml names one: package treatments for implants and braces on Premium, and the stock of dental
    supplies on Enterprise or as a module.
  readsMachineWritten: >-
    The page has no named dentist and no number measured in a dental clinic, and a dentist will notice
    that it names no periodontal chart, no tooth numbering system and no recall list for the six-monthly
    scaling, and that the four pain scenarios are composites rather than one clinic's day.

