sections:
  - discriminant: painBlocks
    value:
      id: where-dental-clinics-lose-track
      heading: Where a dental clinic loses track
      intro: >-
        Dental work is done tooth by tooth and often over several sittings, and most of what goes missing
        falls between one sitting and the next.
      items:
        - heading: The tooth chart is a sketch in the case file
          body: >-
            At the first visit the dentist sketches the teeth on the case paper and marks the missing molar
            and the two cavities. The X-ray sits on the computer beside the sensor in the next room, so six
            months later the dentist is reading a faded drawing and asking the assistant to find the image.
          fix: >-
            The dental chart records each tooth's condition visually on the patient's record, and the
            procedures done are recorded there too. X-rays and other images are uploaded as files to the
            same record, so at the next visit the dentist opens them there instead of asking the assistant
            to find them.
          href: /features/emr/
          linkLabel: Read how the chart works
        - heading: The root canal that never gets its crown
          body: >-
            The root canal is started and the pain goes, so the patient does not come back for the second
            sitting. Months later the tooth cracks, and the case paper shows a treatment that stopped
            halfway without anyone calling to ask why.
          fix: >-
            The treatment plan sits on the patient's record, with each visit and follow-up tracked against
            it. The sittings can be booked together at the first visit, and each booked sitting gets an
            automated reminder by SMS and email on every plan, and by WhatsApp on Premium.
          href: /features/whatsapp/
          linkLabel: Read how WhatsApp reminders work
        - heading: The braces paid in instalments, tracked in a notebook
          body: >-
            A course of braces or an implant is agreed at one price and paid in parts over months. The
            instalments go into a notebook at the front desk, and when the patient asks what is still owed,
            the answer waits for the accountant.
          fix: >-
            On Premium the treatment is billed as one package, and every advance and part payment is
            recorded against it, so the desk sees the balance on the bill. A refund or a voided invoice
            goes through only with authorisation.
          href: /features/billing/
          linkLabel: Read how part payments and packages work
        - heading: Two dentists, one chair at 5pm
          body: >-
            The desk books a scaling into chair two at 5pm without seeing that the other dentist has an
            extraction there, with the only assistant. The clash shows up when both patients are sitting in
            the waiting room.
          fix: >-
            Chairs and assistants are booked inside the appointment slot, and the calendar shows each one's
            bookings, so the desk sees chair two is taken at 5pm before it offers that time.
          href: /features/appointment-scheduling/
          linkLabel: Read how booking works

  - discriminant: featureRows
    value:
      id: built-around-the-dental-chart
      heading: Built around the dental chart
      intro: >-
        What the dentist works with in the chair, from the first examination to the last sitting of a
        treatment plan.
      items:
        - heading: A visual chart, tooth by tooth
          body: >-
            The dental chart documents each patient's condition visually, such as a missing tooth or a
            cavity, and findings are recorded tooth by tooth. The procedures done are recorded on the same
            patient record, so at the next visit the dentist sees what was found and what was done.
          bullets:
            - Visual charting of each tooth's condition
            - Tooth-wise findings and procedures recorded
            - Past visits side by side with today's
            - The patient's whole visit history on one screen
        - heading: Treatment plans that run over several visits
          body: >-
            Create a treatment plan for fillings, root canals, crowns, orthodontics or implants, and track
            the visits and follow-ups it takes on the patient's record. When a patient comes back after a
            gap of months, the plan and the procedures already done are on the same record.
        - heading: X-rays and images on the patient's record
          body: >-
            X-rays and other images are uploaded to the patient's record as files, so they open from the
            same record as the chart. The facesheet, generated automatically, sums up the patient's key
            data before the patient sits down.
        - heading: The medical history, read before an extraction
          body: >-
            Intake forms capture the patient's medical history in as much or as little detail as you want,
            including chronic illnesses and substance use, and it all goes onto the facesheet. Before an
            extraction the dentist reads it at a glance instead of asking again with the patient in the
            chair.
        - heading: Your own forms and print layouts
          plan: premium
          body: >-
            On Premium, a paper examination form your clinic already uses is rebuilt as a digital form
            with the form builder, and the prescription prints in your own layout. Premium also includes
            specialty EMR templates, and the customisation comes without charges.
        - heading: Cura AI drafts the note
          plan: professional
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the note for the dentist to review, and
            it is optional, so a dentist who would rather write every note writes it in the same chart.
          link:
            label: Read what Cura AI does
            href: /ai/

  - discriminant: featureRows
    value:
      id: from-the-chair-to-the-front-desk
      heading: From the chair to the front desk
      intro: >-
        Package treatments come with Premium. Inventory for dental supplies comes with Enterprise, or as a
        module added to Professional or Premium.
      items:
        - heading: Chairs and assistants booked with the appointment
          body: >-
            Book the chair and the assistant a procedure needs inside the appointment slot, and see each
            one's bookings on the calendar. The appointment book takes fixed-time appointments and
            walk-ins, and the sittings of one treatment can be booked together.
          link:
            label: Read how booking works
            href: /features/appointment-scheduling/
        - heading: Procedures billed from your own price list
          plan: professional
          body: >-
            Billing comes with every plan. Each procedure goes on the bill from the clinic's service list,
            which can carry more than one price level, and a price can be adjusted without redoing the
            bill.
          bullets:
            - Discounts only with authorisation
            - Taxable and non-taxable items kept apart on the bill
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Implants and orthodontics billed as packages
          plan: premium
          body: >-
            On Premium an implant or a course of braces is billed as one package treatment, and the payment
            is spread over the course of the treatment. Advances and part payments are recorded against the
            package, and refunds and voided invoices go through only with authorisation.
          bullets:
            - Advances and part payments recorded against one package
            - Receipts and invoices sent to the patient on WhatsApp
        - heading: Stock of dental supplies and medicines
          plan: enterprise
          body: >-
            Inventory for dental supplies and medicines comes with Enterprise, or as the pharmacy and
            inventory module added to Professional or Premium. With it, each batch is tracked to its expiry
            date, and the clinic reorders before it runs out.
          link:
            label: Read how pharmacy and inventory work
            href: /features/pharmacy-and-inventory/

  - discriminant: proofBlock
    value:
      id: ratings
      heading: How clinics rate EasyClinic
      intro: >-
        No dentist has yet given us a quote for this page. These are EasyClinic's overall public
        ratings, not ratings from dental clinics alone.
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'

  - discriminant: stepList
    value:
      id: training
      heading: How long does it take to learn EasyClinic?
      intro: >-
        About two hours, spread over {fact:trainingDays} days, and training is included in every plan. Each
        session is 20 to 40 minutes, and each person learns the screens their own role uses.
      steps:
        - title: 'Day 1: basic training'
          meta: 40 minutes
          body: >-
            The screens the front desk and the dentists use every day: the appointment book and the bill at
            the desk, the chart and the prescription at the chair.
        - title: 'Day 2: EMR scenario training'
          meta: 40 minutes
          body: >-
            You work through the chart and the prescription on the kinds of cases your clinic sees.
        - title: 'Day 3: practice exercises'
          meta: 20 minutes
          body: You repeat what the first two sessions covered, so the first real patient is not your first attempt.
        - title: 'Day 4: road to expertise'
          meta: 20 minutes
          body: The shortcuts that make each note quicker, once the basics have become habit.
      note: >-
        From the demo, a clinic can be live in as little as {fact:goLiveDays} days.

faqHeading: Questions dental clinic owners ask
faq:
  - question: Which EasyClinic plan does a dental clinic need, and what does it cost?
    answer: >-
      A dental clinic that bills implants or braces as packages needs Premium, the plan for specialists:
      {price:inr.premium.annual} per doctor per month billed annually in India or
      {price:inr.premium.quarterly} billed quarterly, and {price:usd.premium.annual} or
      {price:usd.premium.quarterly} in US dollars. Premium also adds specialty EMR templates and your own
      forms and print layouts. Professional, at {price:inr.professional.annual} or
      {price:usd.professional.annual} billed annually, has the EMR and billing but not package treatments
      or specialty EMR templates. Neither plan has a setup fee or a binding contract.
  - question: Can I chart each tooth and record what was done to it?
    answer: >-
      Yes, the dental chart records each patient's condition visually, such as a missing tooth or a
      cavity, and documentation is tooth-wise, with the procedures done recorded on the patient's record.
      Past visits open side by side with today's, so the dentist compares them on one screen.
  - question: How do X-rays get into the patient's record?
    answer: >-
      They are uploaded to the patient's record as image files, alongside other images, so the dentist
      opens them from the same record as the chart. A scanned report from another clinic goes in the
      same way.
  - question: How are implants and braces billed when the patient pays in instalments?
    answer: >-
      On Premium the treatment is billed as one package, and each advance or part payment is recorded
      against it, so the front desk sees the balance before taking the next payment. The payment can be
      spread over the course of treatment, and a refund for a treatment stopped partway goes through only
      with authorisation. Professional does not include package treatments.
  - question: Can the front desk book chairs and assistants, not only the dentist?
    answer: >-
      Yes, chairs and assistants are booked inside the appointment slot, and the calendar shows each
      one's bookings. The sittings of one treatment can be booked together, and each gets an automated
      reminder by SMS and email, or by WhatsApp on Premium.
  - question: Does EasyClinic keep stock of dental supplies?
    answer: >-
      Yes, but not on Professional or Premium alone: inventory for dental supplies and medicines comes
      with Enterprise, or as the pharmacy and inventory module added to Professional or Premium. With the
      module, each batch is tracked to its expiry date.
  - question: Can my assistants and the front desk use EasyClinic?
    answer: >-
      Yes, logins for your staff come with every plan, and the role on each login decides which screens
      it can open. The reception login is included in the price, and it cannot open the EMR or issue a
      prescription.
  - question: Does EasyClinic work without an internet connection?
    answer: >-
      No, EasyClinic does not run fully offline today: the cloud version needs an internet connection, so
      the clinic needs a working line while it sees patients. A self-hosted option also exists, where the
      system runs on the clinic's own server rather than in EasyClinic's cloud.

