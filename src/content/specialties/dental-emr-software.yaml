editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The root canal that never gets its crown and the braces paid off in a notebook are dental problems,
    and every dental capability comes from EasyClinic's own dental page, with a plan named only where
    plans.yaml names one: package treatments for implants and braces on Premium, and the stock of dental
    supplies on Enterprise or as a module.
  readsMachineWritten: >-
    The page has no named dentist and no number measured in a dental clinic, and a dentist will notice
    that it names no periodontal chart, no tooth numbering system and no recall list for the six-monthly
    scaling, and that the four pain scenarios are composites rather than one clinic's day.

notes:
  - 'Grounding: visual dental charting of patient conditions (e.g. missing teeth, cavities, crowns), tooth-wise documentation and procedure recording, treatment plans for fillings, root canals, crowns, orthodontics and implants, tracking of multiple visits, procedures and follow-ups, storage of X-rays, images and reports in patient records (image and document upload), side-by-side past records, visit history on a single screen, facesheets, customisable intake forms for medical history (chronic illnesses, substance use and more), appointment and chair scheduling, resource booking (equipment or assistants) within the appointment slot, multi-session booking, fixed-time appointments and walk-ins, automated reminders and follow-up, part and advance payments, refunds and invoice voiding with authorisation, payment amortisation for package treatments, a service list with flexible and multi-level pricing, discount authorisation, taxable and non-taxable items, receipts on WhatsApp, SMS and email, the form builder for paper forms, personalised print formats, role-based access, and inventory for dental supplies and medicines are all stated plainly on the live /dental-emr-software/ page (retrieved 2026-09-26). Plan placement follows plans.yaml; staff logins, the reception rule, customisation without charges and the offline answer follow facts.md. Penda Health on EasyClinic since 2017 is from the verified study facts.'
  - 'Recruit a named dental testimonial (spec 5.15 item 9): a named dentist or dental clinic owner on EasyClinic, with city, clinic and consent on file, added to src/data/testimonials/ and placed only on this page as a customer proofBlock or a single testimonialRow. Until then the proof block is the Capterra and Google badges, and its intro says no dentist quote exists yet. Review counts are null in facts.yaml, so the badges show no count. The four testimonials on the live dental page (two psychiatrists, a general physician, an ophthalmologist) are not about dentistry and are not used here.'
  - 'Spec 5.15 dental must-haves left out, company to-do: (1) periodontal chart: the live page does not mention pocket depths, bleeding on probing, mobility or recession; confirm whether a periodontal chart exists and on which plan. (2) Odontogram detail: the live page says "visual dental charting" and "tooth-wise documentation", so the page says "visual chart" and never "odontogram"; confirm the numbering system (FDI, Universal or Palmer), whether surfaces can be marked, and whether planned and completed work show differently. (3) Treatment plan phases and estimates: the live page says treatment plans are created and tracked over visits, not that a plan has phases or produces a cost estimate for the patient; confirm both. (4) Imaging: the page states file upload only, as the live page does; confirm whether DICOM images can be viewed and whether any RVG sensor, OPG machine or intraoral camera connects directly, with status. (5) Dental lab orders: not on the live page (plans.yaml lab management is pathology orders, not crowns or dentures sent to a dental lab); confirm whether lab work can be ordered and tracked with a due date. (6) Hygiene recall: the live page states automated follow-up and reminders only; confirm a recall list or a recall interval (for example six-monthly scaling). Add a feature row and a FAQ for each once confirmed.'
  - 'Spec 5.15 template items also left out for lack of facts: named and countable dental templates and forms (item 5, so no dataTable; the live page names none); a timed walkthrough of the most common dental visit (item 4); dental devices and integrations (item 6); which dental note types Cura AI drafts, with an example note (item 8). Also confirm which plan carries the dental chart and treatment plans (the live page does not tie them to a plan, so those rows carry no plan tag and the plan FAQ recommends Premium for package treatments), how a visiting orthodontist or a hygienist is licensed under per-doctor pricing, and whether billing templates can be customised on Professional.'
  - 'Dropped from the live page: both comparison tables ("Easy Clinic vs Other EMR Software" and "EMR Software Comparison for Dental Clinics", unsourced competitor cells); "prescriptions in 30 seconds" and "invoices ready in less than 10 seconds" (unmeasured here); "over 100 graphical dashboards"; "Reduces no-shows" (noShowReduction is null); AI-powered diagnostic support and ADR alerts (CuraPilot claims); AI-powered wait-time management and AI two-way messaging; patient self-service booking and check-in (plan unclear; the patient portal is Enterprise); the data warehouse, Power BI and Azure Data Factory lines (integration status unknown); HR, roster and incentive plans (not dental-specific); "fully cloud-based and accessible from anywhere" (replaced by the offline FAQ); prescriptions "in any language"; and the "14-Day Free Trial, with an extra 30-Day Money Back Guarantee" and "try Easy Clinic absolutely free" lines (owner decision: no free trial).'
  - 'H1: the brief asks for the spec 5.15 item 1 form rather than the spec 4.3 H1 ("Software for dental clinics"). The spec example "charting, treatment plans and billing on one screen" is cut to two items: it is a group of three, and the live page does not say the bill sits on the chart screen. The spec 5.15 item 2 opener asks for three needs; the opening answer names two for the same reason.'
  - 'No heroMedia and no media: screenshots do not exist yet. Hero when captured: the dental chart with a treatment plan (spec 11: "the odontogram on dental"), then the package bill with part payments and the chair calendar. The four pains are illustrative dental clinic situations, not customers; "5pm", "chair two" and "six months" are examples.'
  - 'Title 45 characters; meta description 150 characters with the token resolved (154 as the linter counts an unresolved token); "from" because $99 is the annual-billing price. /clinic-management-software-india/ and /emr-software-in-kenya/ are still drafts; the related links resolve once they publish. /features/billing/ is now published, so the package pain, the price-list row and a related link point to it.'
  - 'Fact-check pass 2026-09-26 (live page re-fetched): removed "open beside the chart" (the live page states upload and storage in the record, not a side-by-side image view), "on one screen" for the facesheet (the live page says auto-generated facesheets only), "run on the same list" for walk-ins, "from clinics of every specialty" on the ratings, and the training outcome "so the chairs stay busy". The discount and tax bullets moved from the Premium package row to the every-plan billing row, since the live page lists them as billing features and nothing ties them to packages. The plan FAQ now says Professional lacks specialty EMR templates, since plans.yaml puts them on Premium and the live page does not say which plan carries the dental chart.'
  - The editorial pass recorded here is an AI review. A human editor still needs to read the page aloud and answer the two spec 6.5 questions; the page has no named person and no measured number, so it meets only two of the four spec 6.5 pass marks (a local fact in the rupee price and the Penda Health link, and admissions of limits in the stock and offline FAQs) until the testimonial arrives.
