  - discriminant: featureRows
    value:
      id: review-visit
      heading: A GI review, from the desk to the bill
      intro: >-
        How a review visit runs on Easy Clinic. We have not timed these steps in a gastroenterology clinic,
        so the page gives no minutes for them.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: The intake before the consult
          icon: activity
          body: >-
            A nurse or clinical assistant records the vitals and any change in the history before the
            consult. Each person logs in as themselves, and the role on that login decides which screens
            they can open; the reception login included in the price cannot open the EMR or issue a
            prescription.
        - heading: The consult, by point and click
          icon: notebook-pen
          body: >-
            The gastroenterologist opens the record with the last endoscopy report on it. Complaints,
            diagnosis, medications, investigations, referrals and follow-ups are picked with auto-complete,
            and on Premium the visit can be written on a template, IBD for example.
        - heading: The prescription goes home on paper or on WhatsApp
          icon: pill
          body: >-
            The prescription is printed for the patient or, on Premium, sent on WhatsApp, with the diet and
            preparation advice written as patient guidelines.
        - heading: The bill at the desk
          icon: receipt
          body: >-
            Consultation and procedure charges go on the bill from the clinic's service list. Part and advance
            payments are recorded against it, and a refund or a voided invoice goes through only with
            authorisation.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Follow-ups by video
          icon: video
          plan: premium
          body: >-
            On Premium, a review can be a video consult, booked through the appointment screen with the fee
            paid online. The patient joins from a web browser on a phone or a computer, and the
            prescription says the consult was held remotely.
          link:
            label: Read how video consults work
            href: /features/telemedicine/

