      body: |-
        ### Prescription Can Be Generated in Just 30 Seconds
        Create detailed prescriptions in just 30 seconds and deliver them instantly in any language via print, WhatsApp, SMS, or email.

        ### Personalized EMR for Gastroenterology
        An EMR customized to match the specialty, workflow, and preferences of GI doctors, delivering a tailored and seamless experience.

        ### AI-Driven Assistance
        Utilize an AI assistant to complete prescriptions in just three clicks, streamlining documentation and saving valuable time.

        ### GI Health Trend Visualization
        Present vitals, lab reports, and clinical parameters as intuitive charts and graphs for clear and easy tracking of a patient’s health trends.

        ### Specialty-Specific Templates
        Specialty specific templates for gastroenterological conditions like IBS, GERD, IBD, and liver diseases.

        ### Medication Management
        Complete medication management which includes Drug interaction checks, prescription tracking, and prior authorization.

        ### Effortless Patient Summaries
        Instant access to auto-generated patient summaries and facesheets, providing a complete review of case histories while saving time and presenting key data effectively.

        ### Intuitive Point-and-Click Input
        Features an easy-to-use point-and-click interface for recording chief complaints, medical history, vitals, and more. Includes custom examination forms, auto-complete notes, diagnoses, medications, investigations, referrals, follow-ups, and GI patient guidelines. Provides the flexibility to access specific controls without navigating complex or lengthy screens.

        ### Detailed Medical History Record
        Capture the medical history of a GI patient using customizable intake forms tailored to your needs, whether detailed or concise. Record information such as chronic illnesses, family and social history, obstetric-gynecological details, substance use, alternative therapies, COVID history, and immunizations. These details are seamlessly displayed in the patient’s facesheet, streamlining future visits and saving valuable time.
