sections:
  - discriminant: painBlocks
    value:
      id: where-a-gastroenterology-clinic-loses-track
      heading: Where a gastroenterology clinic loses track
      intro: >-
        A GI patient moves between the consulting room, the endoscopy suite and the lab, and comes back<br class="hidden lg:inline">
        for years. What goes missing is the procedure report and the run of results between visits.
      items:
        - heading: The colonoscopy report went home with the patient
          body: >-
            A patient with ulcerative colitis comes for review with a plastic folder: two colonoscopy
            reports, a biopsy result and printouts of the images. The surveillance decision waits while you
            find last year's report and compare the extent of disease.
          fix: >-
            Endoscopy reports, images and other diagnostic reports are stored in the patient's file,
            uploaded as documents or images, so last year's report sits on the same record as today's note,
            and past visits open side by side with the current one.
        - heading: Liver function tests on six visits, read one at a time
          body: >-
            A patient with fatty liver disease has had liver function tests every few months. To see whether
            the enzymes are coming down, you open each report in turn and work out the trend in your head.
          fix: >-
            Vitals and clinical parameters are drawn as charts over time. On Premium, lab reports come into
            the chart and their values are charted beside the vitals, so the trend since the last change is
            one graph.
        - heading: The procedure note is on a separate sheet
          body: >-
            Each endoscopist writes the procedure on the unit's own printed sheet, and the findings never
            reach the consult notes, so the doctor who sees the patient next reads the sheet, if it can be
            found.
          fix: >-
            On Premium, custom examination and procedure forms are built for the clinic's gastroenterology
            workflow, and the procedure is recorded on the patient's record with the treatment notes.
        - heading: The IBD patient who missed the review
          body: >-
            "Review in six weeks with stool tests" is written on the prescription. The patient feels better
            on the new medicine and does not come back until the next flare.
          fix: >-
            The follow-up is set in the note before the patient leaves, and the patient gets an automated
            reminder: by SMS and email on every plan, and on WhatsApp on Premium.

  - discriminant: featureRows
    value:
      id: gastroenterology-chart
      heading: Built around the gastroenterology chart
      intro: >-
        What a gastroenterologist reopens at every review, kept on one patient record. Premium, the plan
        for specialists, includes everything below.
      layout: grid
      items:
        - heading: Endoscopy and diagnostic reports on the record
          icon: scan-line
          body: >-
            Endoscopy reports, lab results and other diagnostic reports are stored in the patient's file,
            uploaded as documents or images. Procedures are documented on the patient's record with the
            treatment notes, and the full visit history is on one screen.
          bullets:
            - Endoscopy reports and images kept in the patient's file
            - GI procedures documented with the treatment notes
        - heading: Lab values as trend charts
          icon: chart-line
          body: >-
            On Premium, lab reports come into the chart and values such as liver enzymes are charted visit
            by visit beside the vitals. Full lab management, with orders from the chart and sample tracking,
            comes with Enterprise or as a module added to Professional or Premium.
          bullets:
            - On Premium, lab reports come into the chart
            - Liver enzymes charted visit by visit beside the vitals
        - heading: Medication and treatment plans over the long term
          icon: pill
          body: >-
            GI conditions often need long-term care. Medication and treatment plans are recorded and tracked
            on the patient's record, chronic patients are followed up over the years, and the prescription
            carries a drug interaction check.
          bullets:
            - Medication and treatment plans tracked on the record
            - A drug interaction check on the prescription
        - heading: Your own procedure forms
          icon: layout-template
          body: >-
            On Premium the form builder turns the clinic's paper procedure or examination sheet into a
            digital form in its own layout, so every endoscopist records the same fields. Customising forms
            carries no charge.
          bullets:
            - Your paper procedure sheet turned into a digital form
            - Every endoscopist records the same fields
        - heading: The history on the facesheet
          icon: file-heart
          body: >-
            The intake form records chronic illnesses, family history, social history and substance use,
            alcohol included, with as much detail as the clinic wants. What it records is shown on the
            patient's facesheet with an auto-generated summary.
          bullets:
            - Chronic illness, family and social history at intake
            - An auto-generated summary on the facesheet
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) is included in every plan. It drafts the note for the
            gastroenterologist to review.
          bullets:
            - Cura AI is included in every plan
            - The gastroenterologist reviews every draft note

  - discriminant: dataTable
    value:
      id: gastroenterology-templates
      heading: Gastroenterology templates
      intro: >-
        We have gastroenterology templates for the conditions below. The table lists only the ones we name,
        so it is not a full count. Specialty templates and your own clinical forms come with Premium.
      caption: Named gastroenterology templates, with the plan each needs
      columns:
        - Template
        - Type
        - Plan
      rows:
        - - Irritable bowel syndrome (IBS)
          - Condition template
          - Premium
        - - Gastro-oesophageal reflux disease (GERD)
          - Condition template
          - Premium
        - - Inflammatory bowel disease (IBD)
          - Condition template
          - Premium
        - - Liver diseases
          - Condition template
