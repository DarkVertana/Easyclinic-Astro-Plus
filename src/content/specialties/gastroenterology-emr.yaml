editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-11-05
  onlyUsCouldWrite: >-
    The four named templates (IBS, GERD, IBD and liver disease) and the endoscopy report storage come from
    Easy Clinic's own gastroenterology page, and the plan split is stated as plans.yaml has it: templates,
    forms and lab charts on Premium, lab management and the pharmacy on Enterprise or as a module.
  readsMachineWritten: >-
    The pains are composites rather than a named clinic's day, and the page has no gastroenterologist's
    words, no timed visit and no endoscopy suite integration, so a gastroenterologist will find the
    procedure rows thinner than the template table.

