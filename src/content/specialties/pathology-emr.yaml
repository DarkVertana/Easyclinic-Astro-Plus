sections:
  - discriminant: painBlocks
    value:
      id: where-a-pathology-lab-loses-time
      heading: Where a clinic's pathology lab loses time
      intro: >-
        A lab that sits inside a clinic works for the doctors upstairs as much as for<br class="hidden md:inline">
        the patient at the counter. Most of the lost time is spent between the two.
      items:
        - heading: The doctor phones the lab for the result
          body: >-
            The report is ready at noon, but it is on paper at the lab counter. The doctor upstairs rings
            down to have the haemoglobin read out over the phone, while the next patient waits.
          fix: >-
            With lab management, the result comes back into the patient's record once it is entered,
            with abnormal values flagged, so the doctor reads it on the chart already open.
        - heading: Every technician types the report differently
          body: >-
            The morning technician writes units one way and the evening one another, and the reference
            ranges drift between reports. The doctors notice, and so do patients who compare.
          fix: >-
            Lab reports are generated from built-in templates, so the technician enters the values on a set
            layout for each test and every report from the lab reads the same way.
        - heading: The health check-up package is billed test by test
          body: >-
            A patient comes for the clinic's health check-up package. The counter enters each of the tests
            in it one at a time, and one gets missed off the bill or off the work list.
          fix: >-
            The test catalog holds single tests and the health check-up packages you put together, and the
            tests ordered go on the patient's bill, so the desk does not type them in again.
        - heading: The reagent ran out on Saturday morning
          body: >-
            The weekend rush of fasting samples arrives, and the kit for one of the busiest tests is used
            up. Nobody had seen the stock fall.
          fix: >-
            Reagents and lab supplies can be kept in Easy Clinic's inventory, which comes with Enterprise or
            as part of the pharmacy and inventory add-on on Professional and Premium.

  - discriminant: featureRows
    value:
      id: pathology-workflow
      heading: Built around the lab's work list
      intro: >-
        The lab's side and the doctor's side work on the same patient record. Lab management, the first
        three rows, comes with Enterprise or as an add-on on Professional and Premium, and flagged results
        in the chart come with Premium.
      layout: grid
      items:
        - heading: A test catalog with your own packages
          icon: list-checks
          body: >-
            Your lab's tests sit in one catalog, blood, urine and imaging tests among them, with the health
            check-up packages you put together. The doctor orders from it on the patient's chart, so the lab
            reads the order as it was written.
          bullets:
            - Single tests and your own check-up packages
            - Orders from the chart, not from a paper slip
        - heading: Samples tracked by barcode or QR code
          icon: scan-line
          body: >-
            Each sample is labelled with a barcode or QR code when it is collected, tying the tube to the
            patient and the test, and tracking follows it from collection through processing to the result,
            so tubes are not mixed up on the way.
          bullets:
            - Each tube tied to the patient and the test
            - Tracked from collection through processing to the result
        - heading: Reports built from templates
          icon: file-text
          body: >-
            The technician enters the values on the test's report template and the report is generated from
            it, so every report from the lab has the same layout, whoever was on the bench that day.
          bullets:
            - Values entered on the test's report template
            - The same layout on every report, whoever is on the bench
        - heading: Several technicians, each with their own login
          icon: users
          body: >-
            Lab technicians, the pathologist and the doctors each log in as themselves, and the role on that
            login decides which screens they can open; the reception login included in the price cannot open
            the EMR.
          bullets:
            - Each role decides which screens a login can open
            - The reception login in the price cannot open the EMR
        - heading: Results in the chart, flagged and charted
          icon: chart-line
          body: >-
            Lab reports come into the patient's chart with abnormal values flagged, and the values are
            charted across visits beside the vitals. On Premium and Enterprise, the report can also go to the
            patient on WhatsApp.
          bullets:
            - Abnormal values flagged as reports come into the chart
            - Reports sent on WhatsApp on Premium and Enterprise
        - heading: Outside reports on the same record
          icon: file-check
          body: >-
            When a sample goes to an outside lab, its report is scanned and uploaded to the patient's record
            as a file, beside the results from your own lab. A direct feed from an outside lab's system would
            be integration work, scoped as a project.
          bullets:
            - Outside lab reports scanned and uploaded as files
            - A direct feed from another lab scoped as a project

  - discriminant: featureRows
    value:
      id: sample-desk-to-report
      heading: A sample, from the desk to the report going out
      intro: >-
        How one test runs through a clinic's lab on Easy Clinic. We have not timed these steps in a lab, so
        the page gives no minutes for them.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: At the desk
          icon: calendar-clock
          body: >-
            Walk-ins join the same calendar as booked appointments, so the counter works from one list. The
            appointment screen shows each patient's status through the visit, from check-in until they leave.
          link:
            label: Read how booking works
            href: /features/appointment-scheduling/
        - heading: The tests on the bill
          icon: receipt
          body: >-
            The tests ordered from the chart go on the patient's bill, so the desk does not type them in again,
            and billing and payments come with every plan. An advance or a part payment is recorded against
            the bill, and the balance shows at once.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Collection and processing
          icon: flask-conical
          body: >-
            Sample collection, processing and result generation follow one workflow in lab management, which
            comes with Enterprise or as an add-on on Professional and Premium. The lab can tell where each
            sample is between collection and the result.
          link:
            label: Read how lab orders and results work
            href: /features/lab/
        - heading: The report reaching the patient
          icon: message-circle
          body: >-
            Once the values are entered, the result comes back into the patient's record, ready for the doctor
            at the follow-up. On Premium and Enterprise the report can go to the patient on WhatsApp, so the
            patient has it at any other doctor they see. On Professional, a report can still be scanned and
            attached to the patient's record as a file.

