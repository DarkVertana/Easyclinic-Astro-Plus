editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-11-05
  onlyUsCouldWrite: >-
    The plan split for the lab (lab management on Enterprise or as an add-on, reports in the chart and on
    WhatsApp on Premium), the barcode or QR sample labels and the report templates come from Easy Clinic's
    own pathology and pricing pages, and match the lab feature page word for word on plans.
  readsMachineWritten: >-
    The four pains are composites, and the page has no pathologist's words, no measured turnaround and no
    named analyser, so a pathologist will notice that quality control, accreditation and the sign-off of a
    report are not described.

