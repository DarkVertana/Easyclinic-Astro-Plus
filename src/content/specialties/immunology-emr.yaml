faqHeading: "You Have Questions, We Have Answers"
faq:
  - question: Which Easy Clinic plan does an immunology clinic need, and what does it cost?
    answer: >-
      Premium, because the autoimmune templates and lab reports in the chart come with it:
      {price:inr.premium.annual} per doctor per month billed annually in India or
      {price:inr.premium.quarterly} billed quarterly, and {price:usd.premium.annual} or
      {price:usd.premium.quarterly} in US dollars. Professional, at {price:inr.professional.annual} or
      {price:usd.professional.annual}, has the EMR and billing but not the specialty templates. Both include
      a reception login, with no setup fee and no binding contract.
  - question: How is this different from the Easy Clinic allergy page?
    answer: >-
      This page is for clinics that follow autoimmune disease and immunodeficiency: disease activity
      templates, lab trends and vaccinations. A clinic that mainly runs skin tests and immunotherapy courses
      will find those on the allergy clinic page, and both run on the same patient record.
  - question: Can I compare disease activity between visits?
    answer: >-
      Yes, on Premium: the autoimmune templates record symptoms, triggers and disease activity on the same
      fields at each visit, and past visits open side by side with today's. Lab results and vitals are
      charted across visits beside them.
  - question: Can Easy Clinic keep the vaccination history and schedule the next dose?
    answer: >-
      Yes, the vaccination history is kept on the patient's record, and immunisations can be scheduled for
      patients with an immunodeficiency or an autoimmune disorder. The patient gets an automated reminder by
      SMS and email on every plan, or by WhatsApp on Premium.
  - question: Can our lab results come straight into the chart?
    answer: >-
      On Premium, lab reports come into the chart and are charted across visits, and a report from an
      outside lab can be uploaded as a file. Running your own lab, with orders from the chart and sample
      tracking, is lab management, which comes with Enterprise or as an add-on on Professional and Premium.
  - question: Does Easy Clinic run the pharmacy at our clinic?
    answer: >-
      Yes, but not on Premium alone: pharmacy and inventory are included in Enterprise, or added to
      Professional and Premium as a module. With the module, the pharmacist dispenses from the doctor's
      prescription and tracks each batch to its expiry date.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      No, Easy Clinic does not run fully offline today: the cloud version needs an internet connection, so
      the clinic needs a working line while it sees patients. A self-hosted option also exists, where the
      system runs on the clinic's own server rather than in Easy Clinic's cloud.

