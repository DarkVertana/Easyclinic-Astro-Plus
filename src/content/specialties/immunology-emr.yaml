sections:
  - discriminant: painBlocks
    value:
      id: where-an-immunology-clinic-loses-track
      heading: Where an immunology clinic loses track
      intro: >-
        Autoimmune disease flares and settles over years, and the question at each review is whether<br class="hidden lg:inline">
        it is better or worse than last time. Most of what goes missing is the record that answers it.
      items:
        - heading: Last year's flare was written up in a different way
          body: >-
            A patient with lupus comes for a review. The notes from the last flare describe the joints,
            the rash and the fatigue in free text, in another doctor's words, so you cannot tell at a glance
            whether this is worse.
          fix: >-
            On Premium, autoimmune conditions are recorded on templates for symptoms, triggers and disease
            activity, lupus and Sjögren's syndrome among them, so every visit is written the same way and
            past visits open side by side.
        - heading: The inflammatory markers are on separate reports
          body: >-
            To see whether the new medicine is working, you read the inflammatory markers and the blood
            count off a stack of reports from several labs, one visit at a time.
          fix: >-
            Vitals, lab results and clinical parameters are drawn as charts across visits. On Premium, lab
            reports come into the chart, and an outside lab's report is uploaded to the same record.
        - heading: Nobody is sure which vaccines the patient has had
          body: >-
            Before starting an immunosuppressant, you need the patient's vaccination history. It is on a
            card the patient left at home, and the next dose is due on a date nobody wrote down.
          fix: >-
            The vaccination history is kept on the patient's record, and immunisations can be scheduled for
            patients with an immunodeficiency or an autoimmune disorder, with an automated reminder before
            the date.
        - heading: The reaction to last year's drug is in an old file
          body: >-
            A patient reacted badly to a medicine two years ago, and the note of it sits in a paper file
            that did not come to clinic today.
          fix: >-
            Allergens, sensitivity levels and reactions are recorded on the patient's record and show on the
            facesheet, and the EMR includes a drug interaction check on the prescription.

  - discriminant: featureRows
    value:
      id: immunology-chart
      heading: Built around the immunology chart
      intro: >-
        What an immunologist reopens at every review, kept on one patient record. Premium, the plan for
        specialists, includes everything below.
      layout: grid
      items:
        - heading: Autoimmune templates for disease activity
          icon: clipboard-list
          body: >-
            Customisable templates record the symptoms, the triggers and the disease activity of an
            autoimmune condition, lupus, Sjögren's syndrome and multiple sclerosis among them, so a review
            is compared with the last on the same fields.
          bullets:
            - Symptoms, triggers and disease activity on one template
            - Each review compared with the last on the same fields
        - heading: Lab results charted across visits
          icon: chart-line
          body: >-
            Vitals, lab results and clinical parameters are shown as charts and graphs, so a marker reads as
            one line across visits. On Premium, lab reports come into the chart, and reports from outside
            labs are uploaded to the patient's file as documents or images.
          bullets:
            - Lab results and vitals shown as charts across visits
            - Outside lab reports uploaded as documents or images
        - heading: Vaccinations and immunisation schedules
          icon: calendar-clock
          body: >-
            The vaccination history is kept on the record, and immunisations can be scheduled for patients
            with an immunodeficiency or an autoimmune disorder. The intake form records immunisations and
            COVID history along with chronic illnesses, family history, social history and substance use.
          bullets:
            - Vaccination history kept on the patient's record
            - Immunisation schedules for immunodeficiency patients
        - heading: Allergies, sensitivities and reactions
          icon: file-heart
          body: >-
            Allergens, sensitivity levels and reactions are tracked on the patient's record and shown on the
            facesheet, and the prescription carries a drug interaction check. Skin testing and immunotherapy
            schedules are covered on the allergy page.
          bullets:
            - Allergens, sensitivity levels and reactions tracked
            - A drug interaction check on the prescription
        - heading: Confidential and shared notes
          icon: lock
          body: >-
            Case notes are shared across the care team, nurses and immunologists alike, and the EMR also
            keeps confidential notes. Each person logs in as themselves, and the role on that login decides
            which screens they can open.
          bullets:
            - Case notes shared by nurses and immunologists
            - Confidential notes and a role on every login
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) is included in every plan. It drafts the note for the immunologist to
            review.
          bullets:
            - Cura AI is included in every plan
            - The immunologist reviews every draft note

