editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-11-05
  onlyUsCouldWrite: >-
    The named autoimmune templates (lupus, Sjögren's syndrome, multiple sclerosis) on symptoms, triggers
    and disease activity, and immunisation scheduling for immunodeficient patients, come from Easy Clinic's
    own immunology page, with plan placement from plans.yaml; the only local fact is the rupee price.
  readsMachineWritten: >-
    The four pains are composites rather than a named clinic's day, and the page has no immunologist's
    words, no screenshot of an autoimmune template and no timed visit, so an immunologist will notice that
