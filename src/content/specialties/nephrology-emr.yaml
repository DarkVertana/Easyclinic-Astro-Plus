  - discriminant: featureRows
    value:
      id: review-visit
      heading: A kidney clinic review, from the nurse's desk to the bill
      intro: >-
        How a review visit runs on Easy Clinic. We have not timed these steps in a nephrology clinic, so the
        page gives no minutes for them.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: The nurse records the vitals first
          icon: activity
          body: >-
            A nurse or clinical assistant does the intake before the consult, entering weight and blood
            pressure by point and click. The reception login included in the price cannot open the EMR or
            issue a prescription.
        - heading: The consult, by point and click
          icon: notebook-pen
          body: >-
            The nephrologist opens the record with the vitals and the latest kidney function values on it.
            Complaints, diagnosis, medications, investigations, referrals and follow-ups are picked with
            auto-complete, and on Premium the visit can be written on a template, CKD for example.
        - heading: The prescription goes home on paper or on WhatsApp
          icon: pill
          body: >-
            The prescription is printed for the patient or, on Premium, sent on WhatsApp, with the kidney
            patient guidelines on it.
        - heading: The bill at the desk
          icon: receipt
          body: >-
            Billing, invoicing and payment tracking are included. Part and advance payments are recorded
            against the bill, and a refund or a voided invoice goes through only with authorisation.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Reviews by video
          icon: video
          plan: premium
          body: >-
            On Premium, a renal review can be a video consult, booked through the appointment screen with the
            fee paid online. The patient joins from a web browser, and the prescription says the renal
            consultation was held remotely.
          link:
            label: Read how video consults work
            href: /features/telemedicine/

