      heading: Electronic Medical Records (EMR) which is flexible
      headingAccent: flexible
      centerHeading: true
      mediaFirst: true
      featureList: true
      narrowMedia: true
      stickyMedia: true
      alignTop: true
      body: |-
        ### Prescription in Just 30 Seconds
        Create detailed prescriptions in just 30 seconds and deliver them instantly in any language via print, WhatsApp, SMS, or email.

        ### Personalized EMR for Nephrology
        A customized health record system designed to align with the nephrologist's specialty, workflow, and preferences, providing a personalized experience.

        ### AI-Driven Assistance
        Use an AI assistant to complete renal prescriptions in just three clicks, streamlining your documentation process and saving valuable time.

        ### Health Trend Visualization
        Present vitals, lab results, and clinical parameters as charts and graphs for clear and easy tracking of the patient’s health trends.

        ### Nephrology-Specific Templates
        Nephrology-specific templates for chronic kidney disease (CKD), acute kidney injury (AKI), and transplant management.

        ### Medication Management
        Support for complex prescriptions, including immunosuppressants and renal-dose adjustments.

        ### Streamlined Patient Summaries
        Instant access to auto-generated patient summaries and facesheets, enabling a thorough review of case histories, saving time, and presenting key data effectively.

        ### Intuitive Point-and-Click Input
        Features a simple point-and-click interface for recording chief complaints, medical history, vitals, and more. Includes custom examination forms, auto-complete notes, diagnoses, medications, investigations, referrals, follow-ups, and kidney patient guidelines. Provides flexibility to select specific controls without navigating lengthy screens.

        ### Complete Medical History Record
        Capture the medical history of a kidney patient using a customizable intake form, tailored to your preferred level of detail. Record information on chronic illnesses, family history, social and obstetric-gynecological history, substance use, alternative therapies, COVID history, and immunizations. These details are then displayed in the patient's face sheet, streamlining future visits and saving valuable time.
