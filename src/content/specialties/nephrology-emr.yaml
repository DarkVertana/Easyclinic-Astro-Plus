sections:
  - discriminant: painBlocks
    value:
      id: where-a-nephrology-clinic-loses-track
      heading: Where a nephrology clinic loses track
      intro: >-
        A kidney patient is rarely discharged. They come back for years, often several times a week once dialysis<br class="hidden lg:inline">
        starts, and what goes missing is the record that joins the clinic, the dialysis unit and the lab.
      items:
        - heading: The creatinine trend is spread across a year of reports
          body: >-
            A patient with diabetic kidney disease brings creatinine and potassium reports from three labs.
            To decide whether the decline has sped up, you lay them out by date and work out the slope in
            your head.
          fix: >-
            Kidney function reports are stored on the patient's record, and on Premium lab reports come
            into the chart and their values are charted visit by visit beside the vitals, so the trend is
            one graph.
        - heading: The dialysis unit keeps its own register
          body: >-
            The patient dialyses three times a week, and the session notes are in the unit's register. When
            the nephrologist reviews her in clinic, the last month of sessions is a walk away.
          fix: >-
            Dialysis sessions are managed in Easy Clinic with the rest of the patient's record, so the
            clinic and the unit work from the same system. Each person logs in as themselves, and the role
            on that login decides which screens they can open.
        - heading: Every dose is a renal dose
          body: >-
            A transplant patient is on immunosuppressants, blood pressure tablets and a phosphate binder, and
            every new medicine has to be thought through against her kidney function. One wrong addition
            undoes months of careful prescribing.
          fix: >-
            The prescription handles complex regimens, immunosuppressants and renal-dose adjustments
            included, and the EMR runs a drug interaction check on what you prescribe.
        - heading: The three-monthly review slips to six
          body: >-
            "Review in three months with KFT" is written on the prescription. The patient feels well, the
            date passes, and the next visit comes with swollen ankles and a higher creatinine.
          fix: >-
            The follow-up is set in the note before the patient leaves, and the patient gets an automated
            reminder: by SMS and email on every plan, and on WhatsApp on Premium.

  - discriminant: featureRows
    value:
      id: nephrology-chart
      heading: Built around the nephrology chart
      intro: >-
        What a nephrologist reopens at every review, kept on one patient record. Premium, the plan for
        specialists, includes everything below.
      layout: grid
      items:
        - heading: Kidney function results as trend charts
          icon: chart-line
          body: >-
            Kidney function reports are stored and monitored on the patient's record. On Premium, lab reports
            come into the chart and values such as creatinine are charted visit by visit beside the vitals,
            blood pressure included. Full lab management, with orders from the chart and sample tracking,
            comes with Enterprise or as a module.
          bullets:
            - On Premium, creatinine charted visit by visit
            - Full lab management with Enterprise or as a module
        - heading: CKD followed over the long term
          icon: history
          body: >-
            Chronic kidney disease is monitored over the long term with follow-up tracking, and the patient's
            whole visit history sits on one screen, so today's review is read against every earlier one.
          bullets:
            - Chronic kidney disease followed with follow-up tracking
            - Today's review read against every earlier one
        - heading: Dialysis sessions on the record
          icon: activity
          body: >-
            Dialysis sessions are managed in Easy Clinic with the patient's records, so the nephrologist and
            the unit share one system rather than a register and a file.
          bullets:
            - Dialysis sessions managed with the patient's records
            - The nephrologist and the unit share one system
        - heading: Complex prescriptions, checked
          icon: pill
          body: >-
            The prescription supports complex regimens, including immunosuppressants and renal-dose
            adjustments, and the EMR includes a drug interaction check. Kidney patient guidelines, such as
            fluid and diet advice, can go on the prescription as patient guidelines.
          bullets:
            - Immunosuppressants and renal-dose adjustments on the prescription
            - A drug interaction check on what you prescribe
        - heading: The history on the facesheet
          icon: file-heart
          body: >-
            The intake form records chronic illnesses such as diabetes and hypertension, family history and
            social history. What it records is shown on the patient's facesheet, with an auto-generated
            summary before each review.
          bullets:
            - Diabetes, hypertension and family history at intake
            - An auto-generated summary before each review
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) is included in every plan. It drafts the note for the nephrologist to
            review.
          bullets:
            - Cura AI is included in every plan
            - The nephrologist reviews every draft note

