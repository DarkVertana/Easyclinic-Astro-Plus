sections:
  - discriminant: painBlocks
    value:
      id: where-an-alternative-medicine-clinic-loses-track
      heading: Where an alternative medicine clinic loses track
      intro: >-
        Treatment in homoeopathy, Unani or naturopathy runs for months or years, and<br class="hidden md:inline">
        what goes missing is usually the earlier visit the doctor is building on today.
      items:
        - heading: The first case-taking is eight pages in a file
          body: >-
            A homoeopath's first consultation with a patient takes an hour and fills pages: the complaint, the
            history, the patient's habits, sleep and temperament. Three months later, at a follow-up, the doctor
            needs that case and the remedy given since, and the file is in a cupboard at the other end of the
            clinic.
          fix: >-
            The intake form takes the medical history in as much or as little detail as the doctor wants,
            including chronic illnesses, family and social history and other therapies tried, and it feeds the
            facesheet. Each visit's treatment is kept on the same record, so the case and every remedy since
            open together.
        - heading: The software expects a tablet in milligrams
          body: >-
            Clinic software built for allopathic prescriptions asks for a tablet, a strength in milligrams and
            a dose three times a day. A homoeopathic remedy with its potency, or a Unani compound, does not fit
            those boxes, so the doctor writes it by hand and the record stays on paper.
          fix: >-
            The prescription format in Easy Clinic can be set up for homoeopathy, Unani and other alternative
            treatments, and the remedies you use often are at hand as you write. On Premium it prints in your
            clinic's own layout.
        - heading: Four practitioners, one diary
          body: >-
            An integrative centre has a homoeopath, a naturopath, an acupuncturist and a chiropractor, and one
            paper diary at the desk. Two of them want the same treatment room at four o'clock, and the desk only
            finds out when both patients arrive.
          fix: >-
            Different kinds of treatment are managed on one system, with several practitioners scheduled at the
            same time, and the equipment or assistant a session needs is booked inside the appointment slot.
        - heading: The diet chart goes home and is lost
          body: >-
            The naturopath writes a diet plan and a daily routine on a printed sheet. Six weeks later the patient
            is back, the sheet is lost, and nobody can say what was advised.
          fix: >-
            Diet plans, lifestyle advice and treatment notes are recorded on the patient's record, so the advice
            given six weeks ago is there at the next visit.

  - discriminant: featureRows
    value:
      id: the-treatment-record
      heading: Built around a long course of treatment
      intro: >-
        Your own case sheet and video follow-ups come with Premium, Easy Clinic's plan for
        specialists, and are not on Professional. Medicine and herbal stock comes with Enterprise or
        as a module.
      layout: grid
      items:
        - heading: Prescriptions set up for your remedies
          icon: pill
          body: >-
            The prescription format can be set up for homoeopathy, Unani and other alternative treatments, with
            commonly used medicines at hand as you write. The patient gets the prescription printed, by SMS or by
            email, or by WhatsApp on Premium.
          bullets:
            - Prescription format set up for homoeopathy and Unani
            - Sent printed, by SMS or email, or by WhatsApp on Premium
        - heading: A treatment history that runs for years
          icon: history
          body: >-
            Keep a detailed history of each patient's treatments, consultations and progress, including the
            herbs, supplements, therapies and other treatments used. The facesheet puts the patient's key data on
            one screen, and past records open side by side with today's.
          bullets:
            - Remedies, therapies and supplements in one history
            - Diet plans and lifestyle advice on the record
        - heading: Your own case sheet
          icon: notebook-pen
          body: >-
            On Premium, the form builder turns the paper case sheet you already use into a digital form filled
            in at each visit, laid out the way you take a case, and the prescription prints in your own layout.
          bullets:
            - Your paper case sheet as a digital form on Premium
            - The prescription printed in your own layout
        - heading: Several practitioners on one calendar
          icon: users
          body: >-
            Manage different kinds of treatment, such as acupuncture, chiropractic and naturopathy, on one
            system, with several practitioners scheduled at the same time. Equipment and assistants are booked
            inside the appointment slot, and case notes are shared across the care team.
          bullets:
            - Acupuncture, chiropractic and naturopathy on one system
            - Equipment and assistants booked inside the slot
        - heading: Medicine and herbal stock
          icon: package
          body: >-
            With pharmacy and inventory, which comes with Enterprise or as a module on Professional and Premium,
            the clinic keeps its medicines, herbs and supplies in stock, and each batch is tracked to its expiry
            date.
          bullets:
            - Medicines, herbs and supplies kept in stock
            - Each batch tracked to its expiry date
        - heading: Video follow-ups
          icon: video
          body: >-
            On Premium a follow-up can be a video consultation booked through the appointment screen, with the
            fee collected online at booking. The prescription reaches the patient by WhatsApp, SMS or email with
            a note that the consultation was remote.
          bullets:
            - Video follow-ups booked from the appointment screen
            - The fee collected online at booking
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the consultation note for the doctor to
            review.
          bullets:
            - Cura AI comes with every plan
            - The doctor reviews every draft note

  - discriminant: featureRows
    value:
      id: a-course-of-visits
      heading: A course of visits, from the desk to the next appointment
      intro: >-
        Treatment here runs as a series of visits over months, so much of the clinic's work happens at
        the desk: booking the next session, taking the payment and reminding the patient to come back.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: Booked patients and walk-ins at the same desk
          icon: calendar-clock
          body: >-
            Fixed-time appointments and walk-ins sit on one calendar, and the sessions of a course, such as
            acupuncture or chiropractic, can be booked together. The waiting room view shows the queue and
            how long each patient has waited.
          link:
            label: Read how booking works
            href: /features/appointment-scheduling/
        - heading: The bill for the consultation and the therapy
          icon: receipt
          body: >-
            The receptionist bills the consultation and any therapy from the clinic's service list, and each
            payment is recorded against the bill, with the balance on screen. A refund or a voided invoice
            goes through only with authorisation, and the receipt goes to the patient by SMS or email, or on
            WhatsApp with Premium.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: A course of treatment billed as a package
          icon: hand-coins
          body: >-
            On Premium a course of treatment the clinic sells as a package is billed as one package
            treatment, and the payment can be spread over the course. Advances and part payments are
            recorded against the package, so the desk sees the balance on the bill.
        - heading: Reminders for the follow-up visit
          icon: bell-ring
          body: >-
            The follow-up date goes in the note, and the patient gets an automated reminder for it, by SMS or
            email on every plan and by WhatsApp on Premium. Reminders go out automatically, days or hours
            before the visit, at the times the clinic sets.
          link:
            label: Read how WhatsApp reminders work
            href: /features/whatsapp/

