sections:
  - discriminant: painBlocks
    value:
      id: where-an-endocrinology-clinic-loses-track
      heading: Where an endocrinology clinic loses track
      intro: >-
        Endocrine care is slow. A thyroxine dose is adjusted over months and bone density is<br class="hidden md:inline">
        compared year on year, so what goes missing is the line that joins one result to the next.
      items:
        - heading: The TSH results are on four different lab letterheads
          body: >-
            A woman on thyroxine brings TSH reports from three labs and a fourth from her gynaecologist. To
            see whether the last dose change worked, you lay them out on the desk in date order and match
            each one to the dose on that visit's prescription.
          fix: >-
            On Premium, lab reports come into the patient's chart and their values are charted across
            visits beside the vitals, so the TSH trend since the dose change is one graph. A report from an
            outside lab can be uploaded to the same record as a file.
        - heading: The PCOS history is taken again at every visit
          body: >-
            A young woman with PCOS is seen by two doctors in the practice. Her cycle history, her mother's
            diabetes and her sister's thyroid disease are asked for again each time, because the first
            history is on a paper sheet in the file room.
          fix: >-
            The intake form records chronic illnesses, family history, obs-gynae details and social
            history once, and the family history can name hereditary endocrine disorders such as diabetes,
            thyroid disease or PCOS. What it records is shown on the patient's facesheet at every visit.
        - heading: The bone scan report from two years ago
          body: >-
            A patient with osteoporosis comes for her yearly review with today's bone density report. The
            one you want to compare it with was handed back to her two years ago and is somewhere at home.
          fix: >-
            Diagnostic reports are uploaded to the patient's record as documents or images and stay there,
            so last year's report sits beside this year's, and past visits open side by side with the
            current one.
        - heading: Every doctor writes the thyroid review differently
          body: >-
            The clinic has a printed sheet for thyroid reviews, but each consultant fills it in their own
            way, and the junior doctor skips half of it. Comparing one patient's reviews across doctors
            means reading three styles of note.
          fix: >-
            On Premium, the form builder turns the clinic's paper sheet into a digital form, so every doctor
            records the same fields in the same order, and customising forms carries no charge.

  - discriminant: featureRows
    value:
      id: endocrinology-chart
      heading: Built around the endocrinology chart
      intro: >-
        What an endocrinologist reopens at every review, kept on one patient record. Premium, the plan for
        specialists, includes everything below.
      layout: grid
      items:
        - heading: Hormone and lab values as trend charts
          icon: chart-line
          body: >-
            On Premium, lab reports come into the chart and values such as TSH are charted visit by visit,
            beside vitals such as weight and blood pressure, so a dose change can be read against the
            trend. Full lab management, with orders from the chart and sample tracking, comes with
            Enterprise or as a module added to Professional or Premium.
          bullets:
            - TSH charted visit by visit on Premium
            - Full lab management with Enterprise or as a module
        - heading: Long-term conditions followed over years
          icon: history
          body: >-
            Easy Clinic tracks long-term endocrine conditions, hypothyroidism and osteoporosis among them,
            over the years a patient is seen. Every past visit stays on the same record, and past records
            open side by side with today's.
          bullets:
            - Thyroid disorders and osteoporosis followed over the long term
            - Past visits side by side with today's
        - heading: The family history of endocrine disease
          icon: clipboard-plus
          body: >-
            The intake form records hereditary endocrine disorders in the family history, such as diabetes,
            thyroid conditions or PCOS, with obs-gynae details, social history and chronic illnesses. What
            it records is shown on the patient's facesheet, and an auto-generated summary puts the key data
            on one screen before each review.
          bullets:
            - Diabetes, thyroid conditions or PCOS in the family
            - An auto-generated summary before each review
        - heading: Your own thyroid and PCOS forms
          icon: notebook-pen
          body: >-
            On Premium the clinic turns its own review sheets into digital forms with the form builder, and
            custom examination forms keep each doctor's notes in the same shape. Customising forms carries
            no charge.
          bullets:
            - Review sheets turned into digital forms on Premium
            - No charge for customising forms
        - heading: A drug interaction check when you prescribe
          icon: shield-check
          body: >-
            An endocrine patient is often on several long-term medicines from more than one specialist.
            Easy Clinic's EMR includes a drug interaction check on the prescription.
          bullets:
            - For patients on medicines from more than one specialist
            - Interactions checked on the prescription
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) is included in every plan. It drafts the note for the endocrinologist
            to review.
          bullets:
            - Cura AI is included in every plan
            - The endocrinologist reviews every draft note

  - discriminant: featureRows
    value:
      id: review-visit
      heading: An endocrinology review, from the nurse's desk to the bill
      intro: >-
        How a review visit runs on Easy Clinic. We have not timed these steps in an endocrinology clinic,
        so the page gives no minutes for them.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: The nurse records the vitals first
          icon: activity
          body: >-
            A nurse or clinical assistant does the intake before the consult, entering weight, height and
            blood pressure by point and click, so a child seen for growth or an adult on a weight programme
            has the measurement charted before the doctor opens the record. Each person logs in as
            themselves, and the role on that login decides which screens they can open.
        - heading: The consult, by point and click
          icon: notebook-pen
          body: >-
            The endocrinologist opens the record with the vitals and the latest lab values on it.
            Complaints, diagnosis, medications, investigations, referrals and follow-ups are picked with
            auto-complete, and on Premium the visit can be written on the clinic's own review form.
        - heading: The prescription and the education material
          icon: pill
          body: >-
            The prescription is printed for the patient or, on Premium, sent on WhatsApp. Easy Clinic also
            carries patient education material, so a patient starting thyroxine or a PCOS programme goes
            home with more than a slip.
        - heading: Programmes paid in parts
          icon: hand-coins
          plan: premium
          body: >-
            On Premium, a course of care the clinic sells as a package, a PCOS or thyroid programme for
            example, is billed as one package treatment and paid in parts. Each advance and part payment is
            recorded against it, and a refund goes through only with authorisation.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Reviews by video
          icon: video
          plan: premium
          body: >-
            On Premium, a stable patient's review can be a video consult, booked through the appointment
            screen with the fee paid online. The patient joins from a web browser on a phone or a
            computer, and the prescription says the consult was held remotely.
          link:
            label: Read how video consults work
            href: /features/telemedicine/

