faqHeading: "You Have Questions, We Have Answers"
faq:
  - question: Which Easy Clinic plan does an endocrinology clinic need, and what does it cost?
    answer: >-
      Premium, because lab reports in the chart, your own clinical forms and package treatments come with
      it: {price:inr.premium.annual} per doctor per month billed annually in India or
      {price:inr.premium.quarterly} billed quarterly, and {price:usd.premium.annual} or
      {price:usd.premium.quarterly} in US dollars. Professional, at {price:inr.professional.annual} or
      {price:usd.professional.annual}, has the EMR and billing but not those three. Both include a reception
      login, with no setup fee and no binding contract.
  - question: Can I see a patient's TSH or other hormone results as a trend?
    answer: >-
      Yes, on Premium: lab reports come into the chart and their values are charted visit by visit beside
      the vitals, so the result since the last dose change reads as one line. A report from an outside lab
      can also be uploaded to the patient's file.
  - question: Does Easy Clinic have endocrinology templates?
    answer: >-
      We do not publish a list of endocrinology templates. On Premium the form builder turns the clinic's own
      thyroid, PCOS or bone review sheet into a digital form, and custom examination forms keep every
      doctor's notes in the same fields.
  - question: Is this the same page as diabetology?
    answer: >-
      No, diabetes care has its own page, with sugar and HbA1c trends and foot and eye examinations. This
      page is for the rest of endocrine practice, and both run on the same Easy Clinic record, so a patient
      with diabetes and hypothyroidism has one chart.
  - question: Can several doctors and a nurse work on the same patient's record?
    answer: >-
      Yes, every doctor in the clinic writes on the same patient record, and a nurse or clinical assistant
      can record the intake, vitals included, before the consult. Each person logs in as themselves and the
      role on that login decides which screens they can open; the reception login included in the price
      cannot open the EMR or issue a prescription.
  - question: Can bone density and scan reports go on the record?
    answer: >-
      Yes, as files: bone density, ultrasound and other diagnostic reports are uploaded to the patient's
      record as documents or images, beside the visits. A direct connection to a scanner would be custom
      integration work, which comes with Enterprise or is added to Professional and Premium.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      No, Easy Clinic does not run fully offline today: the cloud version needs an internet connection, so
      the clinic needs a working line while it sees patients.

