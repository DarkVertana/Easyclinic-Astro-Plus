editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-11-05
  onlyUsCouldWrite: >-
    The hereditary endocrine history on the intake form and long-term tracking of hypothyroidism and
    osteoporosis come from Easy Clinic's own endocrinology page, and the plan split is stated as
    plans.yaml has it: lab charts, forms and packages on Premium, lab management on Enterprise or as a
    module.
  readsMachineWritten: >-
    The pains are composites rather than a named clinic's day, and the page names no endocrinology
    template, no growth standard and no adrenal or pituitary workflow, so an endocrinologist will find the
