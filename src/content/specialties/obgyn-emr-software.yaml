faqHeading: Questions OB-GYN clinic owners ask
faq:
  - question: Which Easy Clinic plan does an OB-GYN clinic need, and what does it cost?
    answer: >-
      Premium, the plan for specialists, because the gynaecology templates and package treatments start on
      it: {price:inr.premium.annual} per doctor per month billed annually in India or
      {price:inr.premium.quarterly} billed quarterly, and {price:usd.premium.annual} or
      {price:usd.premium.quarterly} in US dollars. It also brings lab reports into the chart and adds video
      consultations. The price includes a reception login. There is no setup fee and no binding contract.
  - question: Can Easy Clinic track a pregnancy from one antenatal visit to the next?
    answer: >-
      Yes, gestational age, trimester progress, fetal growth parameters and the due date are tracked on the
      patient's record, with each antenatal visit and follow-up on the same record. On Premium you can also
      rebuild your paper antenatal card as a digital form with the form builder, so the fields your doctors
      already use carry over.
  - question: How do ultrasound reports get into the record, and does Easy Clinic connect to our scan machine?
    answer: >-
      By upload: the ultrasound report and any images are stored in the patient's file as documents or
      images, where the doctor opens them at the next visit. No plan lists a connection to an ultrasound
      machine. Custom integrations, such as connections to lab machines or an existing HIS, are scoped per
      project and come with Enterprise or as an add-on to Professional and Premium.
  - question: Does Easy Clinic cover the delivery and the delivery package?
    answer: >-
      No, the delivery is inpatient care, and Easy Clinic does not run inpatient wards or operating theatres,
      so the admission and the bill for the stay belong on the inpatient system of the hospital or nursing
      home where she delivers. Easy Clinic runs the antenatal and postnatal visits in the OPD, and on Premium
      the antenatal care you sell as a package is billed as one package treatment, with the advance and each
      part payment recorded against it.
  - question: Who in the clinic can read a patient's gynaecological history?
    answer: >-
      Only the people whose role allows it: each person logs in as themselves, and the role on that login
      decides which screens they can open. The reception login, included in the price, cannot open the EMR or
      issue a prescription, so the front desk books and bills without reading clinical notes. The EMR also
      has confidential notes, and user activity is kept in audit logs.
  - question: Can Easy Clinic run the pharmacy that dispenses our antenatal supplements?
    answer: >-
      Yes, with the pharmacy and inventory module, which is included in Enterprise or added to Professional
      and Premium; Premium alone does not include it. With the module, the pharmacist dispenses from the
      doctor's prescription and tracks each batch to its expiry date.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      No, Easy Clinic does not run fully offline today: the cloud version needs an internet connection, so the
      clinic needs a working line while it sees patients. A self-hosted option also exists, where the system
      runs on the clinic's own server rather than in Easy Clinic's cloud.
  - question: Is there a free trial?
    answer: >-
      No, Easy Clinic does not offer a free trial. You can book a demo where we show the system on your own
      clinic's patient flow, and if you want to test it on real patients, pay for one quarter; there is no
      contract to break if you stop.

