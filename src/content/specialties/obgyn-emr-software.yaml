  - >-
    The editorial pass recorded here is an AI review. A human editor still needs to read the page aloud and
    answer the two spec 6.5 questions; the page has no named person and no measured number, so it meets only
    two of the four spec 6.5 pass marks (a local fact in the rupee price and the Penda link, and admissions
