editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The antenatal card left at home at 28 weeks and the patient who moves to her mother's town at 32 weeks
    with an antenatal package half paid are an Indian OB-GYN clinic's problems, and the page says plainly
    where Easy Clinic stops: the delivery and its bill stay on the inpatient system, no plan lists an
    ultrasound machine connection, and only antenatal care is billed here as a package, on Premium.
  readsMachineWritten: >-
    The page has no named obstetrician, no screenshot and no measured number, the pain scenarios are
    composites, the template table says little beyond each template's name, and an obstetrician will notice
    that it does not say whether the due date is calculated from the last period or revised after the
    dating scan.

notes:
  - >-
    Grounding: pregnancy tracking (gestational age, trimester progress, fetal growth parameters and due
    dates); gynaecological charting templates for Pap smears, pelvic exams and breast exams; menstrual cycles
    and hormonal treatments in the history; obstetric-gynaecological details on intake forms feeding the
    facesheet; auto-generated case histories and facesheets; side-by-side past records; ultrasound and
    diagnostic report storage in patient files; image and document upload; vitals and lab charts; the form
    builder for paper forms; personalised print formats and case sheet; confidential notes; antenatal visits
    and follow-ups; prenatal and postnatal care; automated reminders and follow-up; part and advance payments,
    refunds and invoice voiding with authorisation, payment amortisation for package treatments and taxable
    item handling; receipts and invoices on WhatsApp; video consultations with online fees, browser access
    and the remote-consultation disclaimer on the prescription; role-based access and audit logs. All are
    stated plainly on the live /obgyn-emr-software/ page (retrieved 2026-09-26). Plan placement follows
    plans.yaml; the reception rule is from the live /pricing/ FAQ; the inpatient scope follows spec 5.8 and
    the published /solutions/hospital-opd/ page; the offline answer follows facts.md, worded as on the
    cardiology and paediatric pages; the free-trial answer follows the spec 1.2 decision (no free trial) and
    the /pricing/india/ wording.
  - >-
    Dropped from the live page: "prescriptions in just 30 seconds" and "three clicks" (unmeasured here); both
    "Easy Clinic vs other EMR" comparison tables (unsourced competitor cells); AI-driven diagnostic
    assistance, differential diagnoses and ADR alerts (CuraPilot claims); the drug interaction check (plan and
    scope not stated); "invoices ready in less than 10 seconds"; "over 100 graphical dashboards"; "reduces
    no-shows" (noShowReduction is null); AI wait-time alerts and AI two-way messaging; "Inventory for
    medicines & supplies: Built-in" and the FAQ "Inventory management is included" (plans.yaml puts pharmacy
    and inventory in Enterprise or an add-on); "fully cloud-based and accessible from anywhere" (the site
    says it does not run fully offline); "14-Day Free Trial, with an extra 30-Day Money Back Guarantee" and
    "try Easy Clinic absolutely free" (owner decision: no free trial, answered in the FAQ); patient
    self-service intake and check-in on the phone (plan not stated; the patient portal and app are Enterprise
    in plans.yaml); resource booking, multi-location scheduling, HR, roster and commission plans (not
    specialty-specific); "fertility & treatment tracking" (owned by /ivf-emr/); the four testimonials from
    psychiatrists, a general physician and an ophthalmologist, which belong on their own pages.
  - >-
    Company to-do, spec 5.15 must-have "antenatal timeline": the live page says gestational age, trimester
    progress, antenatal visits and follow-ups are tracked, but names no timeline view and no antenatal visit
    schedule, so the page describes the pregnancy record visit by visit and claims no timeline. Confirm
    whether a timeline view exists (visits, scans and tests laid out by gestational week), whether the
    schedule of antenatal visits is set up for each pregnancy and reminded automatically, and against which
    guideline (India's antenatal schedule, Kenya's, or the WHO contact schedule).
  - >-
    Company to-do, spec 5.15 must-have "EDD": the live page says due dates are tracked but not how they are
    set. Confirm whether the EDD is calculated from the last menstrual period, whether it can be revised
    after the dating scan, and whether gestational age updates itself at each visit. The page says only that
    the due date is tracked on the record; readsMachineWritten flags the gap.
  - >-
    Company to-do, spec 5.15 must-have "ultrasound records": stated only as report storage (documents and
    images uploaded to the patient file) and "fetal growth parameters" tracking. Confirm which fetal
    biometry fields are structured (for example BPD, HC, AC, FL and estimated fetal weight), whether they are
    plotted on a growth chart, and any direct ultrasound machine or DICOM connection with its status. The FAQ
    says only that no plan lists an ultrasound machine connection, and describes custom integrations in the
    plans.yaml add-on wording (lab machines, an existing HIS, scoped per project) without claiming that an
    ultrasound machine can be connected.
  - >-
    Company to-do, spec 5.15 must-have "delivery packages": the delivery is inpatient care, out of scope per
    spec 5.8, so the page bills antenatal care as a Premium package treatment and says the delivery and its
    bill stay on the inpatient system. Confirm whether an OB-GYN who delivers in her own nursing home can
    bill a delivery package through Easy Clinic billing and how that sits beside the inpatient bill, and
    whether a package shows the visits used and remaining.
  - >-
    Other spec 5.15 template items left out for lack of facts: a timed walkthrough of an antenatal visit
    (item 4); OB-GYN templates beyond the three the live page names, with a count (item 5); integrations and
    devices such as ultrasound or CTG machines (item 6, no section); which OB-GYN note types Cura AI drafts,
    with one example (item 8). Also unknown: which plan carries pregnancy tracking and the obstetric history
    (the live page ties them to no plan, so those rows carry no plan badge and the plan FAQ recommends
    Premium for the templates and packages only); what a confidential note hides and from whom, and whether
    the live page's "confidential appointment" hides the patient's name on the calendar.
  - >-
    Recruit a named OB-GYN testimonial (spec 5.15 item 9): an obstetrician or gynaecologist on Easy Clinic,
    with city, clinic and consent on file, added to src/data/testimonials/ and placed only on this page.
    Dr Seetha Lakshmi Kolanakuduru (Aditya Women and Infertility Clinic, Hyderabad) is placed on /ivf-emr/
    only; a second quote from that clinic about antenatal records, or from another obstetrician, would serve
    here. Until then the proof block is the Capterra and Google badges, with no counts (null in facts.yaml),
    and its intro says no OB-GYN quote exists yet.
  - >-
    No heroMedia and no media: screenshots do not exist yet. When the seeded demo tenant exists: the
    pregnancy record with gestational age, due date and fetal growth rows as hero, a scan report uploaded to
    the patient file, the Pap smear template, and an antenatal package bill with part payments.
  - >-
    The four pains are illustrative OB-GYN clinic situations, not customers; "28 weeks", "32 weeks" and "two
    weeks" are examples. The H1 keeps the spec 4.3 wording ("EMR for OB-GYN and gynaecology clinics") and
    adds the spec 5.15 item 1 pattern after the colon with two objects rather than three, as the cardiology
    and paediatric pages do; the eyebrow names the doctors so it does not repeat the H1. Title 47 characters
    (spec 4.3 wording). Meta description 152 characters with the token resolved (153 as the lint counts it).
  - >-
    Links: /clinic-management-software-india/ and /emr-software-in-kenya/ are still drafts and resolve once
    they publish. The Kenya description uses the verified Penda Health fact (EMR on Easy Clinic since 2017)
    and names no integration, since integration status is unknown. /solutions/hospital-opd/ is linked for
    the maternity nursing home reader because the delivery FAQ sends inpatient care there.
  - >-
    migration/posts-manifest.csv merges /clinic-automation-for-gynaecologists/,
    /clinic-management-software-for-gynaecology/ and /ai-in-gynecology-emr-empowering-womens-health/ into
    this page. No redirectFrom is set here: the manifest waits for marketing to confirm. The spec slug
