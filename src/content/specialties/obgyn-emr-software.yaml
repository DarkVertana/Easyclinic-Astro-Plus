sections:
  - discriminant: painBlocks
    value:
      id: where-an-obgyn-clinic-loses-track
      heading: Where an OB-GYN clinic loses track
      intro: >-
        An antenatal patient comes back every few weeks for nine months,<br class="hidden md:inline">
        and most of what goes missing falls between one visit and the next.
      items:
        - heading: The antenatal card stays at home
          body: >-
            At the 28-week visit the patient arrives without her antenatal card, which holds the date of her
            last period and the dates of her scans. The doctor works out the gestational age again from what
            the patient remembers, and it does not quite match the due date written in the file last month.
          fix: >-
            Gestational age and the due date are tracked on the patient's record, with every antenatal visit
            beside them, so the doctor reads them on screen before the patient sits down.
        - heading: Scan reports pile up in the paper file
          body: >-
            The anomaly scan was done at a diagnostic centre across town, and the printout goes into the
            clinic's paper file behind the dating scan. At the next visit the doctor turns the pages to compare
            the two while the patient waits.
          fix: >-
            The report and the scan images are uploaded to the patient's file on the day she brings them, and
            the fetal growth parameters from each scan are tracked on the pregnancy record, so the doctor reads
            them there instead of in the paper file.
        - heading: The package is paid in parts and tracked in the receipt book
          body: >-
            The clinic sells antenatal care as a package, with an advance at the first visit and the rest in
            instalments. The receipt book shows each payment but not the package it belongs to, and when a
            patient moves to her mother's town at 32 weeks, nobody can say what she has paid for.
          fix: >-
            On Premium, antenatal care is billed as one package treatment, and every advance and part payment
            is recorded against it. The front desk sees the balance on the bill, and a refund goes through only
            with authorisation.
        - heading: The smear result that nobody followed up
          body: >-
            A Pap smear goes to the lab and the result comes back two weeks later. The follow-up visit was
            agreed in the consulting room and written down nowhere else, so the patient hears nothing until she
            calls.
          fix: >-
            Book the follow-up before she leaves, and she gets an automated reminder by SMS and email, or by
            WhatsApp on Premium. On Premium the lab report also comes into her chart.

  - discriminant: featureRows
    value:
      id: built-around-the-pregnancy
      heading: Built around the pregnancy record
      intro: >-
        An antenatal patient is seen many times over one pregnancy, so the record follows the pregnancy and
        each visit is written against it. Lab reports in the chart, package billing and video follow-ups
        come with Premium, Easy Clinic's plan for specialists.
      layout: grid
      items:
        - heading: The pregnancy record, visit by visit
          icon: baby
          body: >-
            Track gestational age and trimester progress through the pregnancy, with fetal growth parameters
            and the due date on the same record. The antenatal visits and the follow-ups between them sit there
            too, so a second obstetrician in the clinic opens the same history as the first.
          bullets:
            - Gestational age and trimester progress
            - Fetal growth parameters and the due date on the record
        - heading: Obstetric and menstrual history on the facesheet
          icon: file-heart
          body: >-
            The intake form records the patient's obstetric and gynaecological history, including her menstrual
            cycles and hormonal treatments, with family and social history beside it. It feeds the facesheet, so
            at each follow-up the doctor reads the history on one screen.
          bullets:
            - Obstetric and gynaecological history at intake
            - Menstrual cycles and hormonal treatments recorded
        - heading: Ultrasound reports in the file, vitals on a chart
          icon: scan-line
          body: >-
            Ultrasound reports and other diagnostic records are stored in the patient's file, uploaded as
            documents or images. Vitals such as blood pressure and weight can be charted visit by visit, so a
            rising trend shows on one screen.
          bullets:
            - Ultrasound reports stored in the patient's file
            - Blood pressure and weight charted visit by visit
        - heading: Lab reports in the chart
          icon: chart-line
          body: >-
            On Premium, lab reports come into the patient's chart, and the values can be charted over time
            beside the vitals. Full lab management, with orders from the chart and sample tracking, comes with
            Enterprise or as a module added to Professional or Premium.
          bullets:
            - On Premium, lab values charted beside the vitals
            - Full lab management with Enterprise or as a module
        - heading: Antenatal care billed as one package
          icon: wallet
          body: >-
            On Premium, antenatal care is billed as one package treatment and the payment is spread over the
            pregnancy, so the front desk sees what is paid and what is due before taking the next instalment.
          bullets:
            - Payment spread over the pregnancy on Premium
            - The desk sees what is paid and due before each instalment
        - heading: Video follow-ups
          icon: video
          body: >-
            For a follow-up that needs no examination, such as going over a report, book a video consultation
            through the appointment screen and collect the fee online at booking. The patient joins from a web
            browser on her phone, and the prescription is sent to her on WhatsApp or by SMS, marked as written
            after a remote consultation.
          bullets:
            - Booked from the appointment screen, fee paid at booking
            - Prescription sent on WhatsApp or by SMS after the call
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) comes with every plan, Professional included. It drafts the consult note in
            the patient's chart, and the doctor corrects it and confirms it.
          bullets:
            - Comes with every plan, Professional included
            - The doctor corrects and confirms the draft note

