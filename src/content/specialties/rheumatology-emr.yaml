sections:
  - discriminant: painBlocks
    value:
      id: where-rheumatology-clinics-lose-track
      heading: Where a rheumatology clinic loses track
      intro: >-
        Arthritis, lupus and the other conditions a rheumatologist treats run for years, with a<br class="hidden md:inline">
        review every few weeks or months, and most of what goes missing falls between those reviews.
      items:
        - heading: The blood results arrive as a stack of printouts
          body: >-
            The patient brings ESR and CRP reports from three different labs, folded into the old
            prescription. The rheumatologist lays them out on the desk to see whether the inflammation is
            settling, and one month is always missing.
          fix: >-
            Lab reports are uploaded to the patient's record, and on Premium they come into the chart, where
            each value can be charted visit by visit. The trend reads as one line instead of a pile of paper.
        - heading: The monitoring blood test nobody chased
          body: >-
            A patient on a long-term medicine needs a blood test before every review. The test is mentioned at
            the end of the consult, written nowhere the desk can see, and the patient arrives for the review
            without it.
          fix: >-
            The investigations and the follow-up date are set in the note before the patient leaves, and an
            automated reminder goes out before the review. SMS and email reminders come with every plan, and
            Premium adds WhatsApp.
        - heading: Five medicines, prescribed by three doctors
          body: >-
            The patient is on a disease-modifying drug from you, a blood pressure tablet from the physician and
            a painkiller bought over the counter. When you add a steroid, nobody has checked the whole list
            together.
          fix: >-
            The drug interaction check runs as the prescription is written and warns of an interaction, and
            the patient's past prescriptions open side by side with today's visit.
        - heading: A three-hour journey for a ten-minute review
          body: >-
            A patient whose joints are stable travels from another district for a review that changes nothing
            on the prescription. In a bad week, the same journey keeps them away altogether.
          fix: >-
            On Premium the review can be a video consultation, booked from the appointment screen with the fee
            paid online. The patient joins from a web browser on a phone or a computer, and the prescription
            goes to them on WhatsApp or by email.

  - discriminant: featureRows
    value:
      id: rheumatology-record
      heading: Built around the long-term rheumatology record
      intro: >-
        Lab reports in the chart, your own clinical forms and video reviews need Easy Clinic's Premium plan,
        the plan most specialists choose. Professional does not include them.
      layout: grid
      items:
        - heading: The history, taken once and kept
          icon: history
          body: >-
            The intake form records chronic illnesses, family and social history and earlier treatments, with
            as much or as little detail as the clinic wants. What it records is shown on the patient's
            facesheet, and an auto-generated summary puts the key data on one screen before each review.
          bullets:
            - Chronic illnesses and earlier treatments on the facesheet
            - A summary of the key data on one screen before each review
        - heading: Lab values as trend charts
          icon: chart-line
          body: >-
            On Premium, lab reports come into the patient's chart and each value can be charted across visits,
            so ESR, CRP or a blood count reads as a line over the years. Full lab management, with orders from
            the chart and sample tracking for an in-house lab, comes with Enterprise or as a module added to
            Professional or Premium.
          bullets:
            - ESR, CRP or a blood count charted over the years
            - Full lab management with Enterprise or as a module
        - heading: Every prescription on one record
          icon: pill
          body: >-
            Each prescription is kept on the patient's record, and past records open side by side with today's
            visit, so the course of each medicine and every change to it can be read in order. The drug
            interaction check warns of an interaction while the prescription is written.
          bullets:
            - The course of each medicine read in order
            - A drug interaction check as the prescription is written
        - heading: X-rays and scan reports on the record
          icon: scan-line
          body: >-
            X-rays, scan reports and photographs are uploaded to the patient's record as images and documents,
            beside the visit they belong to.
          bullets:
            - X-rays, scan reports and photographs uploaded as files
            - Each upload kept beside the visit it belongs to
        - heading: Your own assessment forms
          icon: layout-template
          body: >-
            Premium includes Easy Clinic's specialty templates, and a paper joint assessment or questionnaire
            your clinic already uses can be rebuilt in the form builder and filled in on the record. Your
            prescription and case sheet print in your own layout, with no charge for the customisation.
          bullets:
            - A paper joint assessment rebuilt in the form builder
            - Prescription and case sheet in your layout at no charge
        - heading: Video reviews
          icon: video
          body: >-
            On Premium a review can be a video consultation, booked beside visits in person, with the fee paid
            online at booking. The prescription goes to the patient on WhatsApp or by email, marked as issued
            after a remote consultation.
          bullets:
            - The fee paid online at booking on Premium
            - The prescription sent on WhatsApp or by email
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the note for the doctor to review.
          bullets:
            - Cura AI comes with every plan
            - The doctor reviews every draft note

  - discriminant: featureRows
    value:
      id: follow-up-review
      heading: A rheumatology review, from the desk to the bill
      intro: >-
        The review is the visit a rheumatology clinic repeats most. We have not timed these steps in a
        rheumatology clinic, so the page gives no minutes for them.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: At the desk
          icon: calendar-clock
          body: >-
            The patient checks in, booked or walked in, and gets a token number for the queue. Any lab report
            they bring is uploaded to the record, and a nurse or clinical assistant takes the vitals before the
            consult.
        - heading: In the consulting room
          icon: notebook-pen
          body: >-
            The rheumatologist opens the record with the summary of the last visit, the facesheet and, on
            Premium, the lab trend on the same screen. The note and the prescription are written by point and
            click, with the interaction check running as each medicine is added.
        - heading: The next review
          icon: history
          body: >-
            The blood tests for next time and the follow-up date are set before the patient leaves, and the
            reminder goes out automatically before the review.
        - heading: At the bill
          icon: receipt
          body: >-
            The visit is billed in one click at the desk, and the receipt goes to the patient by email, or on
            WhatsApp on Premium.
          link:
            label: Read how billing works
            href: /features/billing/

