editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-11-05
  onlyUsCouldWrite: >-
    The ESR printouts from three labs and the monitoring test nobody chased are rheumatology problems, and
    every answer is a capability Easy Clinic's published pages and plans.yaml already state, with lab
    charting placed on Premium and a plain answer that no DAS28 form is confirmed.
  readsMachineWritten: >-
    The live rheumatology page could not be read, so nothing here is specific to rheumatology software; the
    page has no named rheumatologist, no named template and no measured number, and a rheumatologist will
    notice that DMARD monitoring schedules and biologic infusions are not mentioned.

