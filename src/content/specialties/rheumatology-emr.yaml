faqHeading: "You Have Questions, We Have Answers"
faq:
  - question: Which Easy Clinic plan does a rheumatology clinic need, and what does it cost?
    answer: >-
      Premium, the plan most specialists choose, because lab reports in the chart, your own forms and video
      reviews start on it: {price:inr.premium.annual} per doctor per month billed annually in India or
      {price:inr.premium.quarterly} billed quarterly, and {price:usd.premium.annual} or
      {price:usd.premium.quarterly} in US dollars. Professional, at {price:inr.professional.annual} or
      {price:usd.professional.annual} billed annually, has the record, the prescription and billing. Both
      include a reception login, with no setup fee and no binding contract.
  - question: Can I see a patient's ESR and CRP as a trend over the years?
    answer: >-
      Yes, on Premium, where lab reports come into the chart and each value can be charted visit by visit.
      On Professional the lab reports are uploaded to the record as files, beside the visit they belong to.
  - question: Does Easy Clinic have disease activity scores such as DAS28?
    answer: >-
      Not as a named, ready-made score on this page: we have not confirmed a built-in DAS28, CDAI or HAQ form.
      On Premium a paper assessment your clinic already uses can be rebuilt in the form builder and filled in
      on the patient's record.
  - question: Will Easy Clinic warn me about a drug interaction?
    answer: >-
      Yes, the drug interaction check runs while the prescription is written and warns of an interaction,
      and the patient's past prescriptions open side by side with today's visit.
  - question: Can I review stable patients by video?
    answer: >-
      Yes, on Premium, which includes video consultations booked through the appointment screen, with the
      fee paid online. The patient joins from a web browser on a computer or a phone, and the prescription
      goes out on WhatsApp or by email, marked as issued after a remote consultation.
  - question: Does Easy Clinic run the clinic pharmacy and the in-house lab?
    answer: >-
      Yes, but not on Premium alone: pharmacy and inventory, and lab management, come with Enterprise or as
      modules added to Professional or Premium. With the pharmacy module, the pharmacist dispenses from the
      doctor's prescription and tracks each batch to its expiry date.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      No, Easy Clinic does not run fully offline today: the cloud version needs an internet connection, so
      the clinic needs a working line while it sees patients. Larger clinics and groups that want their data
      on their own infrastructure can choose a self-hosted deployment instead of Easy Clinic's cloud.

