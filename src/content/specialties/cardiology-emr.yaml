sections:
  - discriminant: painBlocks
    value:
      id: where-a-cardiology-clinic-loses-track
      heading: Where a cardiology clinic loses track
      intro: >-
        Cardiac patients come back for years, and most of what goes missing is the record of the visits in
        between: last year's echo report, or the run of blood pressure readings since the last change of
        medicine.
      items:
        - heading: The echo report is in the patient's bag
          body: >-
            A patient with heart failure comes for a review with a plastic folder of ECGs and echo reports
            from two hospitals. The ejection fraction you want to compare against is on a report from last
            spring, and the first minutes of the consult go on finding it.
          fix: >-
            ECG and echo reports are uploaded to the patient's file as documents or images, so last
            spring's report sits on the same record as today's note, and past visits open side by side
            with the current one.
          href: /features/emr/
          linkLabel: Read how the chart works
        - heading: Six visits of readings, opened one at a time
          body: >-
            To see whether the new antihypertensive is working, you open each visit in turn and read the
            blood pressure across them, then do the same with the LDL on the lipid reports. The trend is
            worked out in your head while the patient waits.
          fix: >-
            Vitals recorded at each visit, blood pressure included, are drawn as charts over time. On
            Premium, lab reports come into the chart, so the lipid and HbA1c values sit beside the vitals
            on one screen.
          href: /features/lab/
          linkLabel: Read how lab results reach the chart
        - heading: The review date is on the prescription and nowhere else
          body: >-
            "Review in three months" is written at the foot of the prescription. The patient feels well and
            forgets the date. The next visit is months later, with swollen ankles.
          fix: >-
            The follow-up is set in the note before the patient leaves, and the patient gets an automated
            reminder: by SMS and email on every plan, and on WhatsApp on Premium.
          href: /features/appointment-scheduling/
          linkLabel: Read how reminders work
        - heading: The treadmill is booked twice at 11am
          body: >-
            Two cardiologists each send a patient for a stress test at the same hour, and the clinic has one
            treadmill. The clash shows up at the door of the TMT room, with both patients waiting.
          fix: >-
            Equipment and assistants are booked inside the appointment slot, and the multi-resource
            calendar shows the desk that the treadmill is already booked at 11am.

  - discriminant: featureRows
    value:
      id: cardiology-chart
      heading: Built around the cardiology chart
      intro: >-
        What a cardiologist reopens at every review, kept on one patient record. Premium, the plan for
        specialists, includes everything below.
      items:
        - heading: ECG and echo reports on the record
          body: >-
            ECGs, echo reports, lab reports and other diagnostic records are stored in the patient's file,
            uploaded as documents or images. Procedures and tests, an echo or a stress test for example, are
            recorded in the patient's record with the treatment notes, and past records open side by side
            with today's visit.
          bullets:
            - Diagnostic reports kept in the patient's file
            - Procedures and tests recorded with the treatment notes
        - heading: Blood pressure and lab values as trend charts
          body: >-
            Vitals and clinical measurements are shown as charts and graphs, so a patient's blood pressure
            reads as one line across visits instead of a list of numbers in separate notes. On Premium, lab
            reports come into the chart, and values such as LDL cholesterol and HbA1c are charted beside
            the vitals. Every past visit is on the same screen.
        - heading: The history and risk factors on the facesheet
          body: >-
            The intake form records chronic illnesses, family history, social history and substance use,
            with as much or as little detail as the clinic wants. What it records is shown on the patient's
            facesheet, and an auto-generated summary puts the key data on one screen before each review.
        - heading: A drug interaction check when you prescribe
          body: >-
            A cardiology patient is often on several long-term medicines, and a new one gets added at almost
            every review. EasyClinic's EMR includes a drug interaction check on the prescription.
        - heading: Follow-ups set in the note, with reminders
          body: >-
            Patients with heart failure or hypertension come back for years, so the follow-up is recorded
            in the note at the end of every consult. The reminder goes to the patient automatically, by SMS
            and email on every plan and by WhatsApp on Premium.
          link:
            label: Read how reminders work
            href: /features/appointment-scheduling/
        - heading: Cura AI drafts the note
          body: >-
            Cura AI (documentation) is included in every plan. It drafts the note for the cardiologist to
            review.
          link:
            label: Read what Cura AI does
            href: /ai/

  - discriminant: dataTable
    value:
      id: cardiology-templates
      heading: Cardiology templates and forms
      intro: >-
        We have cardiology templates for the conditions below and for others, and a CVS examination form.
        The table lists only the ones we name, so it is not a full count. Specialty templates and your own
        clinical forms come with Premium, and customising them carries no charge.
      caption: Named cardiology templates and forms, with the plan each needs
      columns:
        - Template or form
        - Type
        - Plan
      rows:
        - - Heart failure
          - Condition template
          - Premium
        - - Arrhythmias
          - Condition template
          - Premium
        - - Coronary artery disease
          - Condition template
          - Premium
        - - CVS examination
          - Examination form for the cardiovascular system
          - Premium
      note: >-
        If your clinic uses a paper sheet that is not in this list, the form builder on Premium turns it
        into a digital form in your own layout.

  - discriminant: featureRows
    value:
      id: follow-up-visit
      heading: A cardiology review, from the nurse's desk to the bill
      intro: >-
        How a review visit runs on EasyClinic in a polyclinic or a hospital OPD. We have not timed these
        steps in a cardiology clinic, so the page gives no minutes for them.
      items:
        - heading: The nurse records the vitals first
          body: >-
            A nurse or clinical assistant does the intake before the consult, entering the vitals and any
            change in the history by point and click. Each person logs in as themselves, and the role on
            that login decides which screens they can open; the reception login included in the price cannot
            open the EMR or issue a prescription.
        - heading: The consult, by point and click
          body: >-
            The cardiologist opens the record with the vitals already on it. Notes, diagnosis, medications,
            investigations, referrals and follow-ups are picked with auto-complete instead of typed out, and
            on Premium the visit can be written on a cardiology template, heart failure for example.
        - heading: The echo or the treadmill booked in the slot
          body: >-
            If the review needs a test, the equipment and the assistant who runs it are booked inside the
            appointment slot, and the result is recorded on the same patient record.
          link:
            label: Read how booking works
            href: /features/appointment-scheduling/
        - heading: The prescription goes home on paper or on WhatsApp
          body: >-
            The prescription is printed for the patient or, on Premium, sent on WhatsApp. EasyClinic also
            carries patient education material, in videos and brochures, on heart disease and on
            rehabilitation.
        - heading: Packages paid in parts
          plan: premium
          body: >-
            On Premium, a course of care the clinic sells as a package, cardiac rehabilitation sessions for
            example, is billed as one package treatment and paid in parts. Each advance and part payment is
            recorded against it, and a refund or a voided invoice goes through only with authorisation.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Follow-ups by video
          plan: premium
          body: >-
            On Premium, a review can be a video consult, booked through the appointment screen with the fee
            paid online. The cardiologist and the patient join from a web browser on a computer or a phone,
            and the prescription can go to the patient on WhatsApp or by email, with a line saying the
            consult was held remotely.
          link:
            label: Read how video consults work
            href: /features/telehealth/

  - discriminant: proofBlock
    value:
      id: ratings
      heading: How clinics rate EasyClinic
      intro: >-
        We do not yet have a cardiologist's own words to put on this page. These are EasyClinic's public
        ratings, from clinics of every specialty.
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'

  - discriminant: stepList
    value:
      id: training
      heading: How long does it take to learn EasyClinic?
      intro: >-
        About two hours, spread over {fact:trainingDays} days, and training is included in every plan. Each
        session is 20 to 40 minutes, short enough to fit between OPD sessions, so the clinic keeps seeing
        patients while the team learns.
      steps:
        - title: 'Day 1: basic training'
          meta: 40 minutes
          body: >-
            The screens the front desk and the clinical team use every day. Bring your receptionist, whose
            login is part of the plan.
        - title: 'Day 2: EMR scenario training'
          meta: 40 minutes
          body: >-
            You work through the chart and the prescription on the kinds of case your clinic sees.
        - title: 'Day 3: practice exercises'
          meta: 20 minutes
          body: Exercises to practise on, so the first real patient is not your first attempt.
        - title: 'Day 4: road to expertise'
          meta: 20 minutes
          body: The shortcuts that make each note quicker, once the basics have become habit.
      note: >-
        From the demo, a clinic can be live in as little as {fact:goLiveDays} days.

faqHeading: Questions cardiology clinic owners ask
faq:
  - question: Which EasyClinic plan does a cardiology clinic need, and what does it cost?
    answer: >-
      Premium, because the cardiology templates come with it: {price:inr.premium.annual} per doctor per
      month billed annually in India or {price:inr.premium.quarterly} billed quarterly, and
      {price:usd.premium.annual} or {price:usd.premium.quarterly} in US dollars. Professional, at
      {price:inr.professional.annual} or {price:usd.professional.annual}, has the EMR and billing but not the
      specialty templates. Both include a reception login, with no setup fee and no binding contract.
  - question: Can EasyClinic store ECGs and echo reports, and can it connect to the machines?
    answer: >-
      It stores them as files, and a direct machine connection would be custom work. ECG and echo reports,
      like any other diagnostic record, are kept in the patient's file as uploaded documents or images. A
      direct connection to an ECG or echo machine would be custom integration work, which comes with
      Enterprise or is added to Professional and Premium and is scoped per project.
  - question: Can I see a patient's blood pressure and cholesterol trend across visits?
    answer: >-
      Yes, vitals such as blood pressure are shown as charts over time, so the trend reads as one line
      across visits. On Premium, lab reports come into the chart and values such as LDL cholesterol and
      HbA1c are charted beside the vitals. A report from an outside lab can also be uploaded to the
      patient's file.
  - question: How do patients on long-term follow-up get reminded to come back?
    answer: >-
      The cardiologist sets the follow-up in the note, and the patient gets an automated reminder by SMS
      and email on every plan, or by WhatsApp on Premium. Every visit stays on the same record, so at the
      review the history since the first consult is on one screen.
  - question: Can several cardiologists and a nurse work on the same patient's record?
    answer: >-
      Yes, every doctor in the clinic writes on the same patient record, and a nurse or clinical assistant
      can record the intake, vitals included, before the consult. Each person logs in as themselves and
      the role on that login decides which screens they can open; the reception login included in the price
      cannot open the EMR or issue a prescription. Running a second location on the same records needs
      Premium.
  - question: Can I see follow-up patients by video?
    answer: >-
      Yes, on Premium, which includes video consultations: the consult is booked through the appointment
      screen with the fee paid online, and the patient joins from a web browser on a phone or a computer,
      with nothing to install. The prescription can go to the patient on WhatsApp or by email, and it says
      the consult was held remotely.
  - question: Does EasyClinic run the pharmacy at our cardiac centre?
    answer: >-
      Yes, but not on Premium alone: pharmacy and inventory are included in Enterprise, or added to
      Professional and Premium as a module. With the module, the pharmacist dispenses from the doctor's
      prescription and tracks each batch to its expiry date.
  - question: Does EasyClinic work without an internet connection?
    answer: >-
      No, EasyClinic does not run fully offline today: the cloud version needs an internet connection, so
      the clinic needs a working line while it sees patients. A self-hosted option also exists, where the
      system runs on the clinic's own server rather than in EasyClinic's cloud.

