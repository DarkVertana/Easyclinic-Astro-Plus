        Capture a cardiac patient's medical history using a customizable intake form, with the option to include as much or as little detail as needed. Record information on chronic illnesses, family history, social and obstetric-gynecological history, substance use, alternative therapies, COVID history, and immunizations. These details are then displayed in the patient’s facesheet, streamlining future visits and saving valuable time.
