        Use an intuitive point-and-click interface to record cardiology patient data, medical history, vitals, and more. Features include custom examination forms like CVS Examination, auto-complete notes, diagnosis, medications, investigations, referrals, follow-ups, and patient guidelines. Enjoy the flexibility to select specific controls without the need for lengthy screen navigation.

