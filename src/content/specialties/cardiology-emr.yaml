sections:
  - discriminant: painBlocks
    value:
      id: where-a-cardiology-clinic-loses-track
      heading: Where a cardiology clinic loses track
      intro: >-
        Cardiac patients come back for years, and most of what goes missing is the record of the visits in<br class="hidden lg:inline">
        between: last year's echo report, or the run of blood pressure readings since the last change of medicine.
      items:
        - heading: The echo report is in the patient's bag
          body: >-
            A patient with heart failure comes for a review with a plastic folder of ECGs and echo reports
            from two hospitals. The ejection fraction you want to compare against is on a report from last
            spring, and the first minutes of the consult go on finding it.
          fix: >-
            ECG and echo reports are uploaded to the patient's file as documents or images, so last
            spring's report sits on the same record as today's note, and past visits open side by side
            with the current one.
        - heading: Six visits of readings, opened one at a time
          body: >-
            To see whether the new antihypertensive is working, you open each visit in turn and read the
            blood pressure across them, then do the same with the LDL on the lipid reports. The trend is
            worked out in your head while the patient waits.
          fix: >-
            Vitals recorded at each visit, blood pressure included, are drawn as charts over time. On
            Premium, lab reports come into the chart, so the lipid and HbA1c values sit beside the vitals
            on one screen.
        - heading: The review date is on the prescription and nowhere else
          body: >-
            "Review in three months" is written at the foot of the prescription. The patient feels well and
            forgets the date. The next visit is months later, with swollen ankles.
          fix: >-
            The follow-up is set in the note before the patient leaves, and the patient gets an automated
            reminder: by SMS and email on every plan, and on WhatsApp on Premium.
        - heading: The treadmill is booked twice at 11am
          body: >-
            Two cardiologists each send a patient for a stress test at the same hour, and the clinic has one
            treadmill. The clash shows up at the door of the TMT room, with both patients waiting.
          fix: >-
            Equipment and assistants are booked inside the appointment slot, and the multi-resource
            calendar shows the desk that the treadmill is already booked at 11am.

  - discriminant: featureRows
    value:
      id: cardiology-chart
      heading: Built around the cardiology chart
      intro: >-
        What a cardiologist reopens at every review, kept on one patient record. Premium, the plan for
        specialists, includes everything below.
      layout: grid
      items:
        - heading: ECG and echo reports on the record
          icon: file-heart
          body: >-
            ECGs, echo reports, lab reports and other diagnostic records are stored in the patient's file,
            uploaded as documents or images. Procedures and tests, an echo or a stress test for example, are
            recorded in the patient's record with the treatment notes, and past records open side by side
            with today's visit.
          bullets:
            - Diagnostic reports kept in the patient's file
            - Procedures and tests recorded with the treatment notes
        - heading: Blood pressure and lab values as trend charts
          icon: chart-line
          body: >-
            Vitals and clinical measurements are shown as charts and graphs, so a patient's blood pressure
            reads as one line across visits instead of a list of numbers in separate notes. On Premium, lab
            reports come into the chart, and values such as LDL cholesterol and HbA1c are charted beside
            the vitals. Every past visit is on the same screen.
          bullets:
            - Blood pressure read as one line across visits
            - LDL cholesterol and HbA1c charted beside vitals on Premium
        - heading: The history and risk factors on the facesheet
          icon: clipboard-plus
          body: >-
            The intake form records chronic illnesses, family history, social history and substance use,
            with as much or as little detail as the clinic wants. What it records is shown on the patient's
            facesheet, and an auto-generated summary puts the key data on one screen before each review.
          bullets:
            - Family history, social history and substance use recorded
            - An auto-generated summary before each review
        - heading: A drug interaction check when you prescribe
          icon: shield-check
          body: >-
            A cardiology patient is often on several long-term medicines, and a new one gets added at almost
            every review. Easy Clinic's EMR includes a drug interaction check on the prescription.
          bullets:
            - For patients on several long-term medicines
            - A new medicine checked on the prescription
        - heading: Follow-ups set in the note, with reminders
          icon: bell-ring
          body: >-
            Patients with heart failure or hypertension come back for years, so the follow-up is recorded
            in the note at the end of every consult. The reminder goes to the patient automatically, by SMS
            and email on every plan and by WhatsApp on Premium.
          bullets:
            - The follow-up recorded at the end of every consult
            - Reminders by SMS and email, and by WhatsApp on Premium
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) is included in every plan. It drafts the note for the cardiologist to
            review.
          bullets:
            - Cura AI is included in every plan
            - The cardiologist reviews every draft note

