editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The details a cardiologist would recognise, the folder of ECGs from two hospitals and the treadmill
    clash at the TMT room door, sit on capabilities taken only from Easy Clinic's own cardiology page and
    plans.yaml, and the only local fact is the rupee price.
  readsMachineWritten: >-
