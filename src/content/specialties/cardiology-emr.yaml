editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The details a cardiologist would recognise, the folder of ECGs from two hospitals and the treadmill
    clash at the TMT room door, sit on capabilities taken only from EasyClinic's own cardiology page and
    plans.yaml, and the only local fact is the rupee price.
  readsMachineWritten: >-
    The pains are composites rather than a named clinic's day and the page has no cardiologist's words or
    timed visit, so a cardiologist will notice that anticoagulation and device follow-up are missing and
    that follow-up stops at a reminder to the patient.

notes:
  - 'Recruit a named cardiology testimonial (spec 5.15 item 9): a named cardiologist or cardiology clinic owner on EasyClinic, with city, clinic and consent on file, added to src/data/testimonials/ and placed only on this page as a customer proofBlock or a single testimonialRow. The live page carries four testimonials (two psychiatrists, a general physician, an ophthalmologist), none from a cardiologist. Until then the proof block is the Capterra and Google badges, and its intro says no cardiologist quote exists yet. Review counts are null in facts.yaml, so the badges show no count.'
  - 'Grounding: every capability is stated plainly on the live /cardiology-emr/ page (retrieved 2026-09-26): ECG, echo, lab reports and other diagnostic records stored in patient files (FAQ), image and document upload, procedures and tests recorded in patient records (FAQ; the echo and stress test examples are from its own table row), cardiac health trend visualisation and "Vitals & Lab charts", longitudinal visit data on one screen and side-by-side past records, cardiology templates for heart failure, arrhythmias and coronary artery disease, the CVS Examination form, the customizable intake form (chronic illnesses, family history, social history, substance use) shown on the facesheet, auto-generated patient summaries, point-and-click input with auto-complete notes, diagnosis, medications, investigations, referrals and follow-ups, drug interaction check (listed with no detail, so the page claims only that the check exists, not how or when it warns), clinical assistant or nurse intake, role-based access, automated follow up and automated reminders, resource booking (equipment or assistants) inside the appointment slot and a multi-resource calendar, patient education videos and brochures, part and advance payments and payment amortisation for package treatments, refunds and invoice voiding with authorisation, telecardiology from a browser with online fee payment and the remote-consult line on the prescription, multi-doctor and multi-branch use, and cloud access. Plan placement follows plans.yaml (specialty templates, own forms, package treatments, lab reports in the chart, video consults, online payments, WhatsApp and more than one location on Premium; pharmacy and inventory on Enterprise or as a module; integrations on Enterprise or as an add-on). The offline answer and "customisation without charges" come from migration/research/facts.md, worded as on the physiotherapy and EMR pages.'
  - 'Spec 5.15 must-haves left out (company to-do): (1) anticoagulation tracking: the live page never mentions it; confirm whether there is an INR log with target range, dose changes against each INR and the next test date, and on which plan. (2) Device follow-up: not on the live page; confirm whether pacemaker, ICD or CRT device details and check dates can be recorded and recalled. (3) Chronic-care recall as a list: the live page says only "chronic patient follow-up tracking", "Automated follow up" and automated reminders, so the page claims a follow-up set in the note with an automated reminder and nothing more; confirm whether the clinic can pull a list of patients overdue by condition (for example a heart failure register) and on which plan (/features/patient-engagement/ describes recall campaigns by condition from the spec, with no plan). ECG and echo attachments, BP trend charts and the FAQ at 8 are included; lipid and HbA1c charts are written as lab values charted on Premium, as on /features/lab/.'
  - 'Spec 5.15 template items not covered for lack of facts: (4) a timed walkthrough of the most common cardiology visit (the workflow rows say plainly that no step is timed); (5) the full count of cardiology templates (the live page names three conditions "and other conditions" plus the CVS Examination form; the dataTable lists only those four); (6) devices and integrations with status, such as ECG machine connection, echo DICOM viewing, Holter and ambulatory BP import (the page states only that a direct machine connection is custom integration work per plans.yaml, and names no device or protocol); (8) which cardiology note types Cura AI drafts, with an example note. Also confirm whether nurse and clinical assistant logins are paid licences under per-doctor pricing, and which plan carries vitals charts, the intake form, resource booking and the drug interaction check (the rows carry no plan tag, and the featureRows intro says only that Premium includes every row).'
  - 'Dropped from the live page: "Instant Prescription in 30 Seconds" and "three clicks" (unmeasured), "AI-Powered Diagnostic Tools" with differential diagnosis and adverse drug event alerts (CuraPilot claims, not confirmed for this page), both "Easy Clinic vs Other/Generic EMR" comparison tables (unsourced competitor cells), "over 100 graphical dashboards", "invoices ready in less than 10 seconds", "Reduces no-shows" (no measured figure), "Inventory for medicines & supplies Built-in" (plans.yaml: Enterprise or a module), prescriptions "in any language" (only English and Swahili for Kenya are confirmed), AI wait-time management, patient self check-in, unnamed medical calculators, Power BI and data warehouse, and the "14-Day Free Trial, with an extra 30-Day Money Back Guarantee" line (the owner decided there is no free trial). The shared "Where clinics lose time" filler is replaced by four cardiology pains.'
  - 'No heroMedia and no media: screenshots do not exist yet. When the seeded demo tenant exists, the hero is the spec 12 "Cardiology trend chart" (BP and lipids over six visits), with an echo report on the patient record as a second capture. The four pains are illustrative situations, not customers; "two hospitals", "three months" and "11am" are examples.'
  - 'Title 35 characters (spec 4.3 wording). Meta description 149 characters with the token resolved (153 as the lint counts a token, at 7 characters). H1 keeps the spec 4.3 wording "EMR for cardiology clinics" and adds the spec 5.15 item 1 pattern with two named objects rather than three, as the paediatric page does.'
  - 'Related links: /solutions/polyclinic/ and /solutions/hospital-opd/ fit the usual practice size (spec 2.9). /clinic-management-software-india/ and /emr-software-in-kenya/ are still drafts; the links resolve once they publish. The Kenya description avoids KES prices and integration status, which are unknown.'
  - The editorial pass recorded here is an AI review. A human editor still needs to read the page aloud and answer the two spec 6.5 questions; the page has no named person and no measured number, so it meets only two of the four spec 6.5 pass marks (a local fact in the rupee price, and admissions of limits in the untimed workflow, the machine-connection and pharmacy FAQs) until the testimonial arrives.
