editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The eye templates Easy Clinic names, the OCT and fundus reports kept on the record, and the plan split
    an eye clinic meets when it bills cataract packages on Premium and runs the pharmacy on Enterprise or
    as a module all come from Easy Clinic's own pages; the pains are general eye clinic situations, and
