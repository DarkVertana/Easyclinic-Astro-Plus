editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The eye templates EasyClinic names, the OCT and fundus reports kept on the record, and the plan split
    an eye clinic meets when it bills cataract packages on Premium and runs the pharmacy on Enterprise or
    as a module all come from EasyClinic's own pages; the pains are general eye clinic situations, and
    nothing is specific to one country beyond the rupee price.
  readsMachineWritten: >-
    The page names no ophthalmologist and no refraction field, and shows no eye pressure chart, optical
    counter or device connection, so an eye surgeon will find the examination rows general and will notice
    what is missing; the four pains are composites rather than a named clinic's day.

notes:
  - 'Recruit a named ophthalmology testimonial (spec 5.15 item 9): a named ophthalmologist or eye clinic owner on EasyClinic, with city, clinic and consent on file, placed only on this page as a customer proofBlock or a single testimonialRow. siddhartha-ghosh (Senior Ophthalmologist, Global Eye Hospital, consent on file, city null) is assigned to the home page, so it is not used here; if home gives it up, it belongs on this page (his quote praises that every field is searchable and the support). Until then the proof block is the Capterra and Google badges; review counts are null in facts.yaml, so the badges show no count.'
  - 'Grounding (live /ophthalmology-emr/, retrieved 2026-09-26): eyeglass prescriptions generated and managed; detailed vision test and eye examination records (FAQ); imaging reports and diagnostic data for OCT and fundus photography stored in patient records (FAQ); image and document upload; side-by-side past records; visit history on one screen; facesheets; point-and-click chief complaint, history and vitals; clinical assistant or nurse intake; collaborative case notes; charts of vitals, lab reports and clinical parameters; preloaded templates for common eye conditions (e.g. glaucoma, cataracts, macular degeneration); form builder for paper forms; procedure documentation such as cataract surgery (FAQ); long-term monitoring and follow-up tracking for chronic eye conditions (FAQ); automated follow-up and reminders; personalised print formats; part and advance payments, refunds and voiding with authorisation, amortisation for package treatments, discount authorisation; multi-doctor and multi-branch use (FAQ). Plan placement follows plans.yaml (specialty templates, own forms and print layouts, package treatments, WhatsApp and more than one location on Premium; pharmacy and inventory on Enterprise or as a module; integrations on Enterprise or as an add-on).'
  - 'Spec 5.15 must-haves left out, company to confirm: (1) Refraction: the live page states eyeglass prescriptions and vision test records but names no refraction fields (sphere, cylinder, axis, add, visual acuity per eye, near vision) and no auto-refractor or lensmeter import; confirm the fields, whether they print on the spectacle prescription, and the plan. (2) IOP trends: the live page says vitals, lab reports and clinical parameters can be charted, but never names intraocular pressure; confirm whether IOP per eye is a preset parameter charted across visits, with which tonometry method recorded, and on which plan. (3) Optical retail: nothing on the live page covers frames, lenses, lens orders to a lab or an optical counter; confirm whether the pharmacy and inventory module handles optical stock and sales, and on which plan. (4) Imaging: confirm whether any OCT, fundus camera, perimeter or biometer connects directly (DICOM or file-based), with status and date; the page now says only that reports are uploaded to the record (the earlier line calling a direct OCT or fundus camera connection custom integration work was cut in the fact check, since plans.yaml names lab machines, accounting and HIS connections, not imaging devices).'
  - 'Other facts needed for the full spec 5.15 template: which plan carries vision and eye examination records and imaging storage (the live page ties none to a plan, so those rows carry no plan badge); the full list and count of ophthalmology templates (the live page gives three as examples); a timed walkthrough of the commonest eye visit (spec 5.15 item 4); which eye note types Cura AI drafts, with an example (item 8); whether optometrists, refractionists and clinical assistants need a paid licence under per-doctor pricing; surgical consent handling and OT scheduling for cataract lists.'
  - 'Dropped from the live page: both comparison tables ("Easy Clinic vs Other EMR" and "EMR Software Comparison for Ophthalmology Clinics", unsourced competitor cells); "generate and share in 30 seconds" and "invoices ready in less than 10 seconds" (unmeasured); "in any language" (only English and Swahili are confirmed); AI diagnostic support and ADR alerts (CuraPilot claims); drug interaction check (source unnamed, as on /features/emr/); "Reduces no-shows" (noShowReduction is null); "over 100 graphical dashboards"; "Inventory for lab reagents and supplies built-in" (plans.yaml puts inventory on Enterprise or as a module); resource booking within appointments and patient self-service (plan unclear); teleconsultation (Premium, but not eye-specific); data warehouse and Power BI; the four unrelated testimonials; and the "14-Day Free Trial, with an extra 30-Day Money Back Guarantee" and "try Easy Clinic absolutely free" lines (owner decision: no free trial).'
  - 'H1 is the spec 4.3 H1 "EMR for eye clinics" extended in the spec 5.15 item 1 pattern with two named objects (as on the ENT and paediatric pages); the head keyword stays in the title. The opening answer names two needs, not three, to avoid a group of three, and no longer claims what a general EMR lacks. Title 38 characters; meta description within 155 with the token resolved. The four pains are illustrative eye clinic situations, not customers; "three months" and "wrong axis" are examples. The charts bullet names vitals and clinical parameters only, because lab reports in the chart are Premium in plans.yaml and that row carries no plan badge.'
  - 'No heroMedia and no media: screenshots do not exist yet. When the seeded demo tenant exists: the eye examination record with an OCT report attached as hero, the eyeglass prescription print, and a cataract package bill with an advance and a part payment.'
  - '/clinic-management-software-india/ and /emr-software-in-kenya/ are still drafts; the related links resolve once they publish. The "several ophthalmologists" FAQ uses the live FAQ (multi-doctor and multi-branch) with the Premium location rule from plans.yaml.'
