  An eye clinic needs two things on one patient record: each vision test and eye examination, kept visit
  after visit, and the OCT and fundus reports that go with them. EasyClinic keeps both, and its Premium
  plan adds preloaded templates for eye conditions such as glaucoma and cataract, at {price:inr.premium.annual} per doctor per month billed annually in India or
