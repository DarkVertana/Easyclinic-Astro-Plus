  - discriminant: stepList
    value:
      id: training
      heading: How long does it take to learn EasyClinic?
      intro: >-
        About two hours, spread over {fact:trainingDays} days, and training is included in every plan. Each
        session is 20 to 40 minutes, so the clinic keeps seeing patients while the team learns.
      steps:
        - title: 'Day 1: basic training'
          meta: 40 minutes
          body: >-
            The screens the front desk and the doctors use every day: the appointment book and the bill at
            the desk, the chart and the prescription in the consulting room. Bring your receptionist, whose
            login is part of the plan.
        - title: 'Day 2: EMR scenario training'
          meta: 40 minutes
          body: You work through the chart and the prescription on the kinds of case your clinic sees.
        - title: 'Day 3: practice exercises'
          meta: 20 minutes
          body: You repeat what the first two sessions covered, so the first real patient is not your first attempt.
        - title: 'Day 4: road to expertise'
          meta: 20 minutes
          body: The shortcuts that make each note quicker, once the basics have become habit.
      note: >-
        From the demo, a clinic can be live in as little as {fact:goLiveDays} days.

faqHeading: Questions eye clinic owners ask
faq:
  - question: Which EasyClinic plan does an eye clinic need, and what does it cost?
    answer: >-
      Premium, the plan for specialists, because the ophthalmology templates and package billing for
      surgery start on it: {price:inr.premium.annual} per doctor per month billed annually in India or
      {price:inr.premium.quarterly} billed quarterly, and {price:usd.premium.annual} or
      {price:usd.premium.quarterly} in US dollars. The price includes a reception login. There is no setup
      fee and no binding contract.
  - question: Can EasyClinic store OCT reports and fundus photographs?
    answer: >-
      Yes, imaging reports and diagnostic data such as OCT reports and fundus photographs are stored in the
      patient's record. Each report is uploaded to the record as an image or a document, and past records
      open side by side when you compare one visit with another.
  - question: Does EasyClinic record vision tests and write eyeglass prescriptions?
    answer: >-
      Yes, each vision test and eye examination is recorded on the patient's record, and the eyeglass
      prescription is generated in EasyClinic and kept with it. The prescription is printed for the patient
      or, on Premium, sent on WhatsApp.
  - question: Which eye conditions have ready templates?
    answer: >-
      Glaucoma, cataract and macular degeneration are the eye conditions EasyClinic names among its
      preloaded ophthalmology templates, which come with the Premium plan. If your clinic uses its own
      examination sheet, Premium's form builder turns the paper form into a digital one, and customisation
      comes without charges.
  - question: Can we bill cataract surgery as a package paid in instalments?
    answer: >-
      Yes, on Premium: the surgery is billed as one package treatment, and the advance and each part
      payment are recorded against it, so the desk sees the balance before taking the next payment. A
      refund for a surgery cancelled after the advance goes through only with authorisation, and
      Professional does not include package treatments.
  - question: Can EasyClinic run our pharmacy and the stock of eye drops?
    answer: >-
      Yes, with the pharmacy and inventory module, which is included in Enterprise or added to Professional
      and Premium. The pharmacist dispenses from the doctor's prescription and tracks each batch to its
      expiry date.
  - question: Can several ophthalmologists and a second branch share one system?
    answer: >-
      Yes, every ophthalmologist in the clinic works from the same patient record, and each login carries a
      role that decides which screens that person can open. The price is per doctor, and a second location
      needs Premium. The reception login included in the price cannot open the EMR or issue a prescription.
  - question: Does EasyClinic work without an internet connection?
    answer: >-
      No, EasyClinic does not run fully offline today: the cloud version needs an internet connection, so
      the clinic needs a working line while it sees patients. A self-hosted option also exists, where the
      system runs on the clinic's own server rather than in EasyClinic's cloud.

