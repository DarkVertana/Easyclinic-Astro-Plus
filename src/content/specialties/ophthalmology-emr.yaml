sections:
  - discriminant: painBlocks
    value:
      id: where-eye-clinics-lose-track
      heading: Where an eye clinic loses track
      intro: >-
        Many eye patients are seen for years: a glaucoma patient at every review, a cataract patient from<br class="hidden lg:inline">
        the first examination through surgery and back. What goes missing usually falls between those visits.
      items:
        - heading: The scan report in a plastic folder
          body: >-
            A glaucoma patient comes back for review with this month's OCT printout and fundus photographs in
            a plastic folder. Last year's scans are somewhere in the paper file, and the doctor spends the
            first minutes of the consult laying two printouts side by side on the desk.
          fix: >-
            OCT and fundus reports, and the diagnostic data that comes with them, are stored in the patient's
            record as uploaded images or documents. The visit history opens on one screen, and past records
            can be opened side by side.
        - heading: The glaucoma review nobody chased
          body: >-
            A patient on pressure-lowering drops is due back in three months. The date goes in the register,
            the three months pass, and nobody reads that page until the patient turns up a year later.
          fix: >-
            Follow-up tracking for chronic eye conditions sits on the patient's record, and follow-ups are
            automated, so the reminder goes out without anyone opening the register. SMS and email reminders
            come with every plan, and Premium adds WhatsApp.
        - heading: The spectacle prescription the optician misreads
          body: >-
            The eyeglass prescription is written by hand on a slip the patient carries to the optician down
            the road. One figure can be read two ways, and a week later the patient is back with glasses made
            to the wrong axis.
          fix: >-
            The eyeglass prescription is generated in Easy Clinic and printed for the patient, or sent on
            WhatsApp on Premium. It stays on the record, so the next visit starts from what was prescribed
            last time.
        - heading: The cataract package paid in parts
          body: >-
            Cataract surgery is quoted as one package and paid in parts, an advance when the date is booked
            and the balance on the day. The receipts sit in the book, and when the patient asks what is still
            owed, the desk adds them up by hand.
          fix: >-
            On Premium the surgery is billed as one package treatment, with the advance and each part payment
            recorded against it, so the balance shows on the bill. A refund or a voided invoice goes through
            only with authorisation.

  - discriminant: featureRows
    value:
      id: built-around-the-eye-examination
      heading: Built around the eye examination
      intro: >-
        Premium, Easy Clinic's plan for specialists, includes everything below except the pharmacy. Eye
        condition templates and package billing for surgery are not on Professional.
      layout: grid
      items:
        - heading: Vision tests and eye examinations on the record
          icon: eye
          body: >-
            Record each vision test and eye examination in detail, visit after visit, with the chief
            complaint and history entered by point and click. The facesheet pulls the patient's key
            data onto one screen, so a review starts from what was found last time.
          bullets:
            - Chief complaint and history entered by point and click
            - The facesheet, with the patient's key data on one screen
        - heading: OCT and fundus reports beside the visits
          icon: scan-eye
          body: >-
            Imaging reports and diagnostic data, such as OCT reports and fundus photographs, are stored in
            the patient's record as uploaded images or documents. When you compare one visit with another,
            past records open side by side.
          bullets:
            - Images and documents uploaded to the record
            - Past records opened side by side to compare visits
        - heading: Eyeglass prescriptions from the chart
          icon: file-text
          body: >-
            Generate and manage the eyeglass prescription in Easy Clinic, so the last one is on the record when
            the patient comes back. It is printed for the patient or, on Premium, sent on WhatsApp, and
            Premium also lets the clinic print on its own layout.
          bullets:
            - The last prescription on the record at the next visit
            - Printed for the patient or sent on WhatsApp on Premium
        - heading: Templates for common eye conditions
          icon: layout-template
          body: >-
            Premium comes with specialty EMR templates, and Easy Clinic's ophthalmology templates are preloaded
            for common eye conditions such as glaucoma and cataract. If your clinic works from its own paper
            sheet, the form builder turns it into a digital form, and the customisation comes without
            charges.
          bullets:
            - Preloaded templates for glaucoma and cataract on Premium
            - Your paper sheet turned into a digital form at no charge
        - heading: Procedure and surgery notes
          icon: notebook-pen
          body: >-
            Document procedures such as cataract surgery on the patient's record, so the surgery note sits in
            the same history as the examination that led to it and the reviews that follow.
          bullets:
            - Cataract surgery documented on the patient's record
            - The surgery note in the same history as the reviews
        - heading: Surgery billed as a package
          icon: receipt
          body: >-
            On Premium, cataract surgery or another procedure is billed as one package treatment, with the
            payment spread over the course of treatment. Advances and part payments are recorded against the
            package, and refunds and discounts need authorisation.
          bullets:
            - Payment spread over the course of treatment on Premium
            - Refunds and discounts only with authorisation
        - heading: Eye drops dispensed from the prescription
          icon: pill
          body: >-
            Pharmacy and inventory are included in Enterprise, or added to Professional and Premium as a
            module. The pharmacist dispenses from the doctor's prescription and tracks each batch to its
            expiry date.
          bullets:
            - Pharmacy in Enterprise, or a module on Professional and Premium
            - Each batch of eye drops tracked to its expiry date
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the note for the doctor to review.
          bullets:
            - Cura AI comes with every plan
            - The doctor reviews every draft note

  - discriminant: featureRows
    value:
      id: eye-visit-desk-to-pharmacy
      heading: An eye clinic visit, from the desk to the pharmacy counter
      intro: >-
        How a routine eye visit runs on Easy Clinic. We have not timed these steps in an eye clinic, so the
        page gives no minutes for them.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: At the desk
          icon: calendar-clock
          body: >-
            Booked appointments and walk-ins sit on the same calendar, and the appointment screen shows each
            patient's status through the visit, from check-in until they leave. The receptionist works on the
            login included in the price, which cannot open the EMR or issue a prescription.
          link:
            label: Read how booking works
            href: /features/appointment-scheduling/
        - heading: Intake before the doctor
          icon: clipboard-plus
          body: >-
            A clinical assistant or nurse takes the intake and records the vitals by point and click before the
            patient goes in. Case notes are shared, so the assistant and the ophthalmologist add to the same
            record, and vitals and clinical parameters are charted across visits.
        - heading: The next review, tracked and reminded
          icon: bell-ring
          body: >-
            Follow-up tracking for chronic eye conditions such as glaucoma sits on the patient's record, and
            follow-ups are automated, so the reminder goes out without anyone opening the register. SMS and
            email reminders come with every plan, and Premium adds WhatsApp.
        - heading: The bill at the desk
          icon: receipt
          body: >-
            The visit is billed from the appointment screen in one click, and an advance or a part payment is
            recorded against the bill, so the desk sees the balance straight away. A refund or a voided invoice
            goes through only with authorisation.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Refills at the pharmacy counter
          icon: package
          body: >-
            With pharmacy and inventory, which comes with Enterprise or as a module on Professional and
            Premium, a patient collecting a refill of eye drops is served at the counter without joining the
            appointment queue. Over-the-counter products are added at the time of dispensing.
          link:
            label: Read how pharmacy and inventory work
            href: /features/pharmacy-and-inventory/

