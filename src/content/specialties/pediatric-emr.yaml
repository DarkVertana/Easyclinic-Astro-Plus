editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The vaccination card left at home and the vaccine fridge that runs short with babies booked are
    paediatric clinic problems, and each capability answering them is one Easy Clinic's own paediatric page
    states plainly, with a plan named only where plans.yaml names one.
  readsMachineWritten: >-
    A paediatrician will find the growth and vaccine rows general, because the page names no growth
    standard, no national immunisation schedule and no paediatrician, and says nothing about weight-based
    dosing.

notes:
  - 'Grounding: immunisation tracking ("Automated vaccine schedules based on age and local guidelines. Alerts for overdue or upcoming vaccines"), growth charts ("Integration with growth standards to track height, weight, BMI, and head circumference"), developmental milestones (live FAQ), visual charts for vitals and lab reports, auto-generated summaries and facesheets, intake forms capturing family history and immunisations into the face sheet, side-by-side past records, clinical assistant or nurse intake and triage, "Drug interaction check" (listed only, so the page says no more than that the prescription has one), prescriptions shared by print, WhatsApp, SMS or email, video consults with the remote-consultation disclaimer on the prescription, part and advance payments and package treatments, role-based access and "Audit Logs" (listed only; the page does not say what the log records), the form builder for paper forms, and inventory "for vaccines and clinic supplies" (live FAQ) are all stated plainly on the live /pediatric-emr/ page (re-fetched 2026-09-26 in the editorial pass). Plan placement follows plans.yaml: specialty templates, own forms, package treatments, WhatsApp and video on Premium; pharmacy and inventory on Enterprise or as a module, described only in the add-on body wording (batch, expiry, reorder before you run out), not as a reorder-level alert. Cura AI drafting and "optional" follow /ai/ and plans.yaml; reception login and offline answers follow migration/research/facts.md.'
  - 'Recruit a named paediatric testimonial (spec 5.15 item 9): a named paediatrician or paediatric clinic owner on Easy Clinic, with city, clinic and consent on file, added to src/data/testimonials/ and placed only on this page as a customer proofBlock or a single testimonialRow. Until then the proof block is the Capterra and Google badges, and its intro says no paediatrician quote exists yet. Capterra and Google review counts are null in facts.yaml, so the badges show no count.'
  - 'Spec 5.15 must-have "WHO growth charts": the live page says only "growth standards". Company to confirm which standards are built in (WHO 2006 under five, WHO 2007 five to nineteen, IAP 2015, CDC or others), whether centiles and z-scores are plotted, and whether weight and height taken at the nurse intake plot on the growth chart by themselves. The page names no standard and does not link the intake to the chart until then.'
  - 'Spec 5.15 must-have "national immunisation schedules (India UIP, Kenya KEPI, Nigeria NPI)": the live page says "based on age and local guidelines" and names no schedule. Company to confirm which schedules are built in (UIP, IAP, KEPI, NPI or others), whether the clinic can edit a schedule, and whether the vaccine batch number given to a child is recorded on the immunisation record. No schedule is named on the page.'
  - 'Spec 5.15 must-have "weight-based dosing" is left out: the live page lists "Medical calculators" without naming any and says nothing about dosing by weight. Company to confirm whether a weight-based (mg/kg) dose calculator exists in the prescription screen, with maximum-dose checks, and on which plan. Then add a row to the visit block and a FAQ.'
  - 'Spec 5.15 must-have "parent WhatsApp reminders" is covered only as appointment reminders for a booked visit (automated reminders on the live page; WhatsApp on Premium per plans.yaml and /features/whatsapp/). The live "Alerts for overdue or upcoming vaccines" does not say who receives them. Company to confirm whether a vaccine falling due sends a reminder to the parent by itself, without a booked visit, and on which channel and plan. Also confirm whether a child''s record holds the parent or guardian as the contact, and whether siblings are linked as one family.'
  - 'Spec 5.15 must-have "well-baby templates": the live page lists "Pediatric consultation templates" only in its unsourced comparison table and names no template. The page offers the Premium form builder for a clinic''s own paper well-baby form, not ready templates. Company to confirm the paediatric templates by name and count (well-baby or well-child check, newborn visit, developmental screening, adolescent visit) for the spec 5.15 item 5 dataTable.'
  - 'Other spec 5.15 items missing: a timed walkthrough of the most common paediatric visit (item 4); devices such as weighing scales or stadiometers and their integration status (item 6); which paediatric note types Cura AI drafts, with an example (item 8); which plan carries growth charts, the immunisation schedule and milestone tracking (the live page does not tie them to a plan, so those rows carry no plan tag and the cost FAQ ties only templates and WhatsApp to Premium); whether a nurse doing the intake needs a paid licence under per-doctor pricing.'
  - 'Dropped from the live page: both comparison tables ("Other EMR Software", "Generic EMR Software": unsourced competitor cells, and "Inventory for vaccines & medicines Built-in", which conflicts with plans.yaml), "prescriptions in just 30 seconds" and "three clicks" (unmeasured here), prescriptions "in any language" (only English and Swahili are confirmed), AI diagnostic support and ADR alerts (CuraPilot claims), "Reduces no-shows" (noShowReduction is null), "invoices ready in less than 10 seconds", "over 100 graphical dashboards", the data warehouse, Power BI and AI two-way messaging lines, patient self check-in and booking on the phone (plan unclear), the "14-Day Free Trial, 30-Day Money Back Guarantee" and "try Easy Clinic absolutely free" lines (owner decision: no free trial), the "5000+ doctors" stat line, and the four testimonials on the live page, none of them from a paediatrician.'
  - 'Illustrative scenes: the vaccination card, the register weights, the Monday morning calls and the "three babies" booked for one vaccine are composite paediatric clinic situations, not customers. The vaccination-package row and FAQ apply Premium package treatments to vaccines; the live page does not name a vaccination package.'
  - 'Editorial pass, 2026-09-26 (adversarial re-check against the live page): removed the implication that growth charts plot centiles (pain body said "crossed down a centile line"; centiles and z-scores are unconfirmed); removed "lab values" from the growth row, since lab reports in the chart are Premium in plans.yaml and the row carries no plan; cut the drug interaction timing ("warns while the prescription is still being written") and the audit-log detail ("who made each entry"), which the live page does not state; replaced the reorder-level alert with the plans.yaml add-on wording; removed the visit rows for reminders and vaccine stock, which repeated the pain block and FAQ word for word; rewrote the growth and vaccine FAQs as questions a paediatrician asks (head circumference, the forgotten card) and removed three-item lists from the face-sheet row, cost FAQ and closing.'
  - 'Screenshots left out (no heroMedia or media on published pages). When the seeded demo tenant exists: the child''s growth chart with height, weight and head circumference as hero, the vaccine schedule with an overdue alert, and a parent''s WhatsApp reminder for the next vaccine visit.'
  - 'Title 34 characters. Meta description 145 characters with the price token resolved ($99). H1 follows spec 4.3 ("EMR for paediatric clinics") with the spec 5.15 item 1 pattern after the colon, naming only the two objects the live page states. /clinic-management-software-india/ and /emr-software-in-kenya/ are still drafts; the related links resolve once they publish. /solutions/solo-clinic/ is the practice-size link (spec 2.9).'
  - The editorial pass recorded here is an AI review. A human editor still needs to read the page aloud and answer the two spec 6.5 questions; the page has no named person and no measured number, so it meets only two of the four spec 6.5 pass marks (a local fact in the rupee price, and admissions of limits in the vaccine stock, receptionist and offline FAQs) until the testimonial arrives.
