faqHeading: "You Have Questions, We Have Answers"
faq:
  - question: "What is the best EMR software for paediatric clinics?"
    answer: "The best EMR software for paediatric clinics should support growth tracking, vaccination schedules, and long-term monitoring of child health. Easy Clinic is designed to manage the complete workflow of pediatric clinics."
  - question: "Does Easy Clinic support AI EMR for paediatric clinics?"
    answer: "Yes. Easy Clinic includes AI EMR Software that helps doctors write notes faster and reduces manual documentation."
  - question: "Can Easy Clinic track child growth and development?"
    answer: "Yes. Easy Clinic allows clinics to monitor growth parameters and developmental milestones."
  - question: "Does Easy Clinic support vaccination schedule tracking?"
    answer: "Yes. Clinics can manage children’s vaccination records and schedules."
  - question: "Can Easy Clinic store a complete child health history?"
    answer: "Yes. Easy Clinic maintains detailed patient records for long-term pediatric care."
  - question: "Does Easy Clinic support prescriptions and treatment plans?"
    answer: "Yes. Doctors can create and manage prescriptions easily."
  - question: "Does Easy Clinic support billing for pediatric services?"
    answer: "Yes. Billing, invoicing, and payment tracking are included."
  - question: "Can Easy Clinic manage vaccine and medicine inventory?"
    answer: "Yes. Inventory management is included for vaccines and clinic supplies."
  - question: "Can multiple paediatricians use Easy Clinic?"
    answer: "Yes. Easy Clinic supports multi-doctor and multi-branch clinics."
  - question: "Is Easy Clinic cloud-based?"
    answer: "Yes. Easy Clinic is fully cloud-based and accessible from anywhere."
  - question: "Does Easy Clinic provide reports for clinic performance?"
    answer: "Yes. Easy Clinic provides analytics to track patient visits, treatments, and revenue."

