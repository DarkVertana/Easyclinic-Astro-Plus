sections:
  - discriminant: painBlocks
    value:
      id: where-a-paediatric-clinic-loses-track
      heading: Where a paediatric clinic loses track
      intro: >-
        A child comes back to the same clinic for years, for vaccines on a fixed timetable and for a weight
        and a height at almost every visit. Most of what goes wrong happens between those visits.
      items:
        - heading: The vaccination card goes home with the parent
          body: >-
            The only full record of which vaccines a child has had is the card in the parent's bag. On the
            day the card stays at home, the doctor asks the parent to remember whether the second dose was
            given, and the clinic's own copy is a line in last year's register.
          fix: >-
            The child's vaccination record and schedule sit in Easy Clinic, with alerts for vaccines that are
            coming up or overdue, so the next dose is on screen whether or not the card came along.
          href: /features/emr/
          linkLabel: Read how the chart works
        - heading: The weight is in the register and the trend is nowhere
          body: >-
            The nurse weighs the child and writes the number in the register, and the doctor copies it into
            the notes. Whether the child has stopped gaining weight since last winter shows only if someone
            lays last year's weights out by hand, and in a full waiting room nobody does.
          fix: >-
            The child's record keeps a growth chart against growth standards, so the trend is on the screen
            when the doctor opens the chart.
        - heading: The next vaccine visit that nobody reminds the parent about
          body: >-
            The date of the next dose is written on the card, weeks ahead. The receptionist means to call
            the parents the day before, but the list is in a notebook and the calls get made when the desk
            is quiet, which on a Monday morning it never is.
          fix: >-
            Book the next vaccine visit before the family leaves, and the booked visit gets an automated
            reminder. SMS and email reminders come with every plan, and Premium adds WhatsApp, sent from the
            clinic software rather than the receptionist's own phone.
          href: /features/whatsapp/
          linkLabel: Read how WhatsApp reminders work
        - heading: The vaccine fridge runs out on a clinic day
          body: >-
            Stock is counted from the boxes when someone thinks of it. A vial past its expiry date turns up
            at the back of the fridge, and the week's supply of one vaccine runs out with three babies booked
            for it.
          fix: >-
            With the pharmacy and inventory module, vaccine and medicine stock is tracked by batch and expiry
            date, so the clinic reorders before the fridge runs out. The module is included in Enterprise, or
            added to Professional or Premium.
          href: /features/pharmacy-and-inventory/
          linkLabel: Read how stock is tracked

  - discriminant: featureRows
    value:
      id: built-around-the-childs-record
      heading: Built around the child's record
      intro: >-
        A child's chart is read across years of visits, so it keeps the measurements and the vaccines where
        the doctor can see the trend. Specialty templates and your own forms come with Premium, Easy Clinic's
        plan for specialists.
      items:
        - heading: Growth charts against growth standards
          body: >-
            Height, weight, BMI and head circumference are tracked against growth standards, so each new
            measurement is seen against the standard rather than as a number on its own. Developmental
            milestones are monitored on the same record, and vitals show as charts across visits.
          bullets:
            - Height, weight and BMI
            - Head circumference
            - Developmental milestones on the same record
            - Vitals charted across visits
        - heading: Vaccine schedules set by age
          body: >-
            Each child's vaccine schedule is set automatically from their age and local guidelines, and the
            record carries alerts for vaccines that are coming up or overdue. The vaccines already given are
            part of the child's history and show on the face sheet, so the doctor sees what has been given
            before deciding what is due.
          bullets:
            - Schedule from the child's age and local guidelines
            - Alerts for upcoming and overdue vaccines
        - heading: The child's history on one face sheet
          body: >-
            The intake form records the child's family history and past immunisations, and both come
            through to the face sheet. At a follow-up, an auto-generated summary gives the doctor the case
            history at a glance, and earlier visits can be read side by side.
        - heading: Specialty templates and your own forms
          plan: premium
          body: >-
            On Premium the chart comes with specialty EMR templates, and your clinic can have its own clinical
            forms and print layouts. If you run well-baby checks on a paper form today, it can be rebuilt
            in the form builder as a digital form that the doctor fills in on the child's record.
          link:
            label: See what Premium includes
            href: /pricing/
        - heading: Cura AI drafts the note
          body: >-
            Cura AI (documentation) is included in every plan. It drafts the note for the doctor to review,
            and it is optional, so a doctor who would rather write every note writes it in the same chart.
          link:
            label: Read what Cura AI does
            href: /ai/

  - discriminant: featureRows
    value:
      id: the-visit
      heading: A paediatric visit, from the intake to the follow-up
      intro: >-
        What happens around the consult, in the order the day runs. Where a row needs a particular plan, it
        says so.
      items:
        - heading: The nurse takes the intake
          body: >-
            A nurse or clinical assistant does the intake and triage before the child goes in to the doctor,
            logged in as themselves. Logins for your staff come with every plan, and the reception login
            included in the price cannot open the EMR or issue a prescription.
        - heading: The prescription, printed or sent to the parent
          body: >-
            The prescription is written on the child's record, with a drug interaction check, then printed or
            sent to the parent by SMS or email, and on Premium by WhatsApp.
          link:
            label: Read how prescriptions work
            href: /features/emr/
        - heading: Video follow-ups
          plan: premium
          body: >-
            On Premium a follow-up can be a video consult, booked through the appointment screen, with the
            parent joining from a web browser on a phone and nothing to install. The prescription from the
            call goes to the parent with a note that the consultation was held remotely.
        - heading: Vaccination packages, paid in parts
          plan: premium
          body: >-
            If the clinic sells a child's first-year vaccines as one package, Premium bills it as a package
            treatment. An advance or a part payment is recorded against the package, so the desk sees the
            balance at each visit, and receipts can go to the parent on WhatsApp.

  - discriminant: proofBlock
    value:
      id: ratings
      heading: How clinics rate Easy Clinic
      intro: >-
        We do not yet have a paediatrician's own words to put on this page. These are Easy Clinic's public
        ratings, from clinics of every kind.
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'

  - discriminant: stepList
    value:
      id: training
      heading: How long does it take to learn Easy Clinic?
      intro: >-
        About two hours, spread over {fact:trainingDays} days, and training is included in every plan. Each
        session is 20 to 40 minutes, short enough to fit between the morning and evening clinics, so the
        clinic keeps seeing children while the team learns.
      steps:
        - title: 'Day 1: basic training'
          meta: 40 minutes
          body: >-
            The screens the front desk and the consulting room use every day. Bring your receptionist, whose
            login is part of the plan, and the nurse who does the intake.
        - title: 'Day 2: EMR scenario training'
          meta: 40 minutes
          body: >-
            You work through the chart and the prescription on the kinds of case your clinic sees.
        - title: 'Day 3: practice exercises'
          meta: 20 minutes
          body: You work through exercises on your own, then bring back the questions that came up.
        - title: 'Day 4: road to expertise'
          meta: 20 minutes
          body: The shortcuts that make each note quicker, once the basics have become habit.
      note: >-
        From the demo, a clinic can be live in as little as {fact:goLiveDays} days.

faqHeading: Questions paediatric clinic owners ask
faq:
  - question: What does Easy Clinic cost for a paediatric clinic?
    answer: >-
      Premium, the plan with specialty EMR templates and WhatsApp reminders for parents, costs
      {price:inr.premium.annual} per doctor per month billed annually in India, or {price:usd.premium.annual}
      in US dollars. Professional, at {price:inr.professional.annual} or {price:usd.professional.annual}, has
      the EMR and billing, with reminders by SMS and email but not WhatsApp. Both include a reception login.
      Neither has a setup fee or a binding contract.
  - question: Does Easy Clinic chart head circumference as well as height and weight?
    answer: >-
      Yes, height, weight, BMI and head circumference are all tracked against growth standards on the
      child's record and shown as growth charts. Developmental milestones are monitored on the same record.
  - question: Can the doctor see which vaccine is due if the parent forgets the vaccination card?
    answer: >-
      Yes, the child's vaccination record and schedule are kept in Easy Clinic, with the schedule set
      automatically from the child's age and local guidelines and alerts for vaccines that are coming up
      or overdue. Vaccines recorded at intake show on the face sheet.
  - question: Will parents get a reminder before the next vaccine visit?
    answer: >-
      Yes, once the visit is booked: a booked appointment gets an automated reminder, by SMS and email on
      every plan and by WhatsApp on Premium. WhatsApp messages go out from the clinic software, so the
      reminders do not depend on the receptionist's own phone.
  - question: Can we sell a vaccination package that parents pay for in parts?
    answer: >-
      Yes, on Premium, where package treatments are part of the plan: the package is billed once, and each
      advance or part payment is recorded against it, so the desk sees the balance. Professional does not
      include package treatments.
  - question: Can Easy Clinic manage our vaccine stock?
    answer: >-
      Yes, but not on Premium alone: pharmacy and inventory are included in Enterprise, or added to
      Professional and Premium as a module. With the module, vaccine and medicine stock is tracked by batch
      and expiry date, so you reorder before a vaccine runs out.
  - question: Can the receptionist open a child's chart?
    answer: >-
      No, the reception login included in the price is not allowed into the EMR and cannot issue
      prescriptions. Doctors and clinical staff log in as themselves with access set by role, and the system
      keeps audit logs.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      No, Easy Clinic does not run fully offline today: the cloud version needs an internet connection, so the
      clinic needs a working line while it sees patients. A self-hosted option also exists, where the system
      runs on the clinic's own server rather than in Easy Clinic's cloud.

