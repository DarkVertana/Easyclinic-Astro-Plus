sections:
  - discriminant: painBlocks
    value:
      id: where-imaging-centres-lose-track
      heading: Where an imaging centre loses track
      intro: >-
        An imaging centre sees many patients a day, most of them sent by another doctor,<br class="hidden md:inline">
        and the day goes wrong in the gaps between the request, the scanner and the report.
      items:
        - heading: The urgent scan waits behind the routine ones
          body: >-
            A trauma patient arrives with a request for an emergency CT while twelve routine ultrasounds are
            already in the queue. The request is a slip of paper at the desk, and the technician learns it was
            urgent only when the referring doctor phones to ask where the report is.
          fix: >-
            Imaging requests come in through order management, where a critical case is marked and moved up,
            so the desk and the technician see what has to go first.
        - heading: The scanner is booked twice at the same hour
          body: >-
            Two patients are told to come at 10am for the same machine, and the sonographer is expected in two
            rooms. One patient waits an hour, and the other leaves.
          fix: >-
            The equipment and the assistant who runs it are booked inside the appointment slot, so a machine
            that is taken does not show as free.
        - heading: Every radiologist writes the report a different way
          body: >-
            One radiologist types the report from scratch, another pastes from last week's, and the referring
            doctor gets three layouts for the same kind of scan. A finding that one report states in its first
            line, another leaves to its last.
          fix: >-
            Reports are written from structured templates, so each scan type has the same headings and the
            same order whoever reports it. On Premium the printed report follows your centre's own layout.
        - heading: Last year's report is on a CD the patient lost
          body: >-
            The patient comes back for a follow-up scan, and the radiologist wants to compare it with the one
            from last year. The old report and images went home on a disc, and the disc is somewhere at home.
          fix: >-
            Images and reports are stored on the patient's record as uploaded files, and past records open
            side by side with today's visit, so last year's report is on the screen at the comparison.

  - discriminant: featureRows
    value:
      id: radiology-record
      heading: Built around the imaging request and the report
      intro: >-
        Structured report templates and multi-centre scheduling need Easy Clinic's Premium plan, the plan
        most specialists choose. The rest of the page states what the radiology workflow covers and where
        the limits are.
      layout: grid
      items:
        - heading: Imaging requests, by priority
          icon: clipboard-list
          body: >-
            Order management takes in each imaging request and lets the centre prioritise critical cases,
            an emergency CT for a trauma patient for example. The patient is checked in against the request,
            and the scan protocol and the report follow it on the same record.
          bullets:
            - Critical cases marked and moved up the queue
            - Check-in, scan and report on one record
        - heading: Structured report templates
          icon: layout-template
          body: >-
            Reports are written from structured templates, so each kind of scan is reported under the same
            headings in the same order. Premium includes Easy Clinic's specialty templates, and your
            centre's own report format can be rebuilt in the form builder, with the printed report in your
            own layout and no charge for the customisation.
          bullets:
            - Your own report format, rebuilt with the form builder
            - The printed report in your centre's layout
        - heading: Equipment booked inside the slot
          icon: calendar-clock
          body: >-
            Any resource, a scanner or the assistant who runs it, is booked inside the appointment slot, and
            walk-ins and fixed-time appointments sit in the same calendar with token numbers for the queue.
          bullets:
            - Walk-ins and fixed-time appointments in one calendar
            - Token numbers for the queue on the same calendar
        - heading: Images and reports on the patient's record
          icon: scan-eye
          body: >-
            Scan images and reports are stored on the patient's record as uploaded images and documents, and
            past records open side by side with today's visit. Easy Clinic stores the files; this page does
            not promise a DICOM viewer or a link to your PACS, because neither is confirmed for radiology yet.
          bullets:
            - Past records open side by side with today's visit
            - No DICOM viewer or PACS link confirmed for radiology yet
        - heading: Imaging tests in the lab catalogue
          icon: flask-conical
          body: >-
            With lab management, imaging tests sit in the same test catalogue as blood tests, so a doctor in
            your clinic orders an X-ray or a scan from the chart like any other test, and the result comes
            back to the record. Lab management comes with Enterprise, or as a module added to Professional or
            Premium.
          bullets:
            - X-rays and scans ordered from the chart like any test
            - Lab management with Enterprise or as a module
        - heading: More than one centre
          icon: layers
          body: >-
            On Premium, appointments across several imaging centres are managed from one central schedule,
            and each centre's reports and revenue show in the same dashboards.
          bullets:
            - Several centres booked from one central schedule
            - Each centre's reports and revenue in the same dashboards
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the note for the doctor to review.
          bullets:
            - Cura AI comes with every plan
            - The doctor reviews every draft note

  - discriminant: featureRows
    value:
      id: ultrasound-appointment
      heading: An ultrasound appointment, from the request to the bill
      intro: >-
        How a routine scan runs on Easy Clinic. We have not timed these steps in an imaging centre, so the
        page gives no minutes for them.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: The request and the booking
          icon: scan-line
          body: >-
            The request from the referring doctor is taken in at the desk, and the ultrasound room and the
            sonographer are booked in the same slot. An urgent request is marked as critical and goes ahead
            of the routine ones.
        - heading: At check-in
          icon: calendar-clock
          body: >-
            The patient checks in against the booking and gets a token number for the queue. The receptionist
            works on a login that cannot open the medical record.
        - heading: The scan and the report
          icon: file-chart-column
          body: >-
            The radiologist writes the report from the template for that scan, with any earlier report open
            beside it, and the images and the report are stored on the patient's record.
        - heading: The bill and the report going out
          icon: receipt
          body: >-
            The scan is billed at the desk in one click, with taxable and non-taxable items handled
            automatically. The receipt and the report go to the patient by email, or on WhatsApp on Premium.
          link:
            label: Read how billing works
            href: /features/billing/

