editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-11-05
  onlyUsCouldWrite: >-
    The preventive alerts for check-ups, vaccinations and screenings and the family medicine templates come
    from Easy Clinic's own family physician page, and the household question is answered as it stands: each
    person has their own record, and no family link is claimed.
  readsMachineWritten: >-
    The four pains are composites rather than a named practice's day, there is no family physician quoted
    and no visit timed, and a family doctor may notice that the page cannot group a household, which is the
