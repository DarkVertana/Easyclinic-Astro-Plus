sections:
  - discriminant: painBlocks
    value:
      id: where-a-family-practice-loses-track
      heading: Where a family practice loses track
      intro: >-
        A family doctor knows a household by heart, until a locum is on duty, or the son comes in twenty years<br class="hidden lg:inline">
        after his father's heart attack. What goes missing is the family's history, not today's complaint.
      items:
        - heading: The father's heart attack is in the father's file
          body: >-
            A man of forty comes in with a raised blood pressure. You treated his father's heart attack
            years ago and his mother's diabetes still, but none of that is written in his own file, and the
            locum who sees him on Saturday has no way to know.
          fix: >-
            Family history is recorded on each person's intake form, as detailed as you want it, and it
            shows on their own facesheet with their chronic conditions and social history. Anyone in the
            practice who opens his record sees it.
        - heading: Three generations, three kinds of preventive care
          body: >-
            In one family the baby is due a vaccine, the mother a screening test and the grandfather his
            annual check-up. Each depends on someone remembering, and the family usually remembers only the
            one that hurts.
          fix: >-
            The EMR sends alerts when an annual check-up, a vaccination or a screening is due, and each
            person's immunisations are kept in their own history. Appointment reminders go by SMS and email
            on every plan, and by WhatsApp on Premium.
        - heading: The grandmother's tablets come from four doctors
          body: >-
            She sees a cardiologist, an eye surgeon and an orthopaedic surgeon, and you are the one who sees
            all the prescriptions. Adding a painkiller means checking the whole list by memory.
          fix: >-
            Her chronic conditions and the alternative therapies she uses sit on her facesheet, reports from
            her specialists are uploaded to her record, and the EMR's drug interaction check covers the
            prescription you write.
        - heading: Twenty years of cards in a cupboard
          body: >-
            The practice has seen this family since before the children were born. Their history is in
            card files, some in your handwriting and some in your predecessor's, and the old cards do not
            follow anyone into the consulting room.
          fix: >-
            Scanned pages of the old cards are uploaded to each person's record as documents, beside the new
            visits, and from then on every visit by every doctor in the practice is written on the same
            record.

  - discriminant: featureRows
    value:
      id: built-around-the-family-chart
      heading: Built around the family physician's chart
      intro: >-
        The EMR and e-prescriptions come with every plan, starting with Professional. Templates for the
        conditions you see most and lab reports in the chart come with Premium, at
        {price:inr.premium.annual} per doctor per month in India or {price:usd.premium.annual}, billed
        annually.
      layout: grid
      items:
        - heading: One record for each family member
          icon: users
          body: >-
            Each person, from the newborn to the grandparent, has their own record, with every visit, note
            and prescription on it over the years. Every doctor in the practice writes on the same record, so
            the history survives a locum, a new partner or a change of hands.
          bullets:
            - From the newborn to the grandparent, a record each
            - Every doctor in the practice writes on the same record
        - heading: The history, taken once and kept
          icon: clipboard-plus
          body: >-
            The intake form captures what a family doctor needs, and what it records lands on the patient's
            facesheet with an auto-generated summary.
          bullets:
            - Chronic conditions, with family and social history
            - Immunisations and COVID history
        - heading: Preventive care alerts
          icon: bell-ring
          body: >-
            The EMR sends alerts for annual check-ups, vaccinations and screenings, and a follow-up set in
            the consult brings the patient an automated reminder before it is due.
          bullets:
            - Alerts for annual check-ups, vaccinations and screenings
            - An automated reminder before a follow-up is due
        - heading: Vitals and lab values charted over the years
          icon: chart-line
          body: >-
            Vitals, lab reports and clinical parameters are shown as charts, so the slow rise in a patient's
            weight or blood pressure over a decade is one line. On Premium, lab reports come into the chart
            and their values are charted beside the vitals.
          bullets:
            - A slow rise in weight or blood pressure as one line
            - Lab values charted beside the vitals on Premium
        - heading: Templates for family medicine's regular conditions
          icon: layout-template
          body: >-
            On Premium you can have a template for each condition you see most, such as diabetes,
            hypertension or a respiratory infection, and turn your paper forms into digital ones with the
            form builder.
          bullets:
            - A template for each condition you see most on Premium
            - Your paper forms turned into digital ones
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the visit note for you to review, and
            a doctor who prefers to write every note writes it in the same chart.
          bullets:
            - Cura AI comes with every plan
            - You review every draft visit note

  - discriminant: featureRows
    value:
      id: a-family-visit
      heading: When the whole family comes in
      intro: >-
        A family doctor often sees two or three members of one family in a single sitting. Each visit is
        still its own record, and the appointment book and billing come with every plan.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: 'At the desk: one booking for each person'
          icon: calendar-clock
          body: >-
            Booked patients and walk-ins sit on one calendar, so the mother and the child each have their
            own slot or token, and a patient who needs to be seen sooner can be moved up as a priority.
          link:
            label: Read how the appointment book works
            href: /features/appointment-scheduling/
        - heading: 'In the consult: each person''s own facesheet'
          icon: notebook-pen
          body: >-
            You open the child's record, then the mother's, each with its own history, vitals and
            immunisations. Complaints, diagnoses, investigations, referrals and follow-ups are recorded by
            point and click, with auto-complete.
        - heading: Prescriptions the family can read
          icon: pill
          body: >-
            Each prescription is printed or sent by SMS or email and, on Premium, by WhatsApp, and it can
            carry advice for the patient. It can be bilingual, such as English and Swahili for clinics in
            Kenya.
        - heading: 'Back at the desk: the bill'
          icon: receipt
          body: >-
            The receptionist raises each bill in one click from the clinic's service list. Part payments are
            recorded against the bill, and a refund or a discount goes through only with authorisation.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Follow-ups by video
          icon: video
          plan: premium
          body: >-
            On Premium, a follow-up can be a video consult, so an elderly parent need not travel for a
            routine review. The patient joins from a web browser, the fee is paid online, and the
            prescription says the consult was held remotely.
          link:
            label: Read how video consults work
            href: /features/telemedicine/

