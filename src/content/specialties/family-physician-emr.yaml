# /family-physician-emr/ (spec 5.15 SpecialtyPage template; no spec 4.3 keyword row and no spec 5.15 must-have
# row for family medicine). Slug kept from the live site; it redirected to /general-practitioner-emr/ until the
# owner asked for every footer specialty to have its own page (2026-11-05). To stay distinct from
# /general-practitioner-emr/ (the walk-in visit, the token queue, the referral slip and BP charts), this page
# takes the family doctor's angle: several members of one family, and the same patients across decades.
# Grounding: capability statements the live /family-physician-emr/ page makes plainly (retrieved 2026-11-05),
# plans.yaml, and what published pages already state. The live page says nothing about linking family members
# or households, so the page claims no household linkage: each family member has their own record.
