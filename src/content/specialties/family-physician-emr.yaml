faqHeading: "You Have Questions, We Have Answers"
faq:
  - question: Which Easy Clinic plan does a family practice need, and what does it cost?
    answer: >-
      Professional costs {price:inr.professional.annual} per doctor per month billed annually in India or
      {price:inr.professional.quarterly} billed quarterly, and {price:usd.professional.annual} or
      {price:usd.professional.quarterly} in US dollars. It includes the EMR, e-prescriptions, Cura AI,
      billing and the appointment book, with a reception login and no setup fee or binding contract.
      Premium, at {price:inr.premium.annual} or {price:usd.premium.annual} billed annually, adds condition
      templates, lab reports in the chart, WhatsApp messages and video consultations.
  - question: Can I link the members of one family in Easy Clinic?
    answer: >-
      We do not state a household link today: each family member has their own patient record, with their
      own history and visits. The family history recorded on each person's intake form is what carries a
      parent's diabetes or heart disease onto a child's facesheet. Whether family members can be grouped
      has not been confirmed as of November 2026.
  - question: Does Easy Clinic remind patients about check-ups, vaccinations and screenings?
    answer: >-
      Yes, the EMR sends alerts for annual check-ups, vaccinations and screenings, and a follow-up set in
      the consult brings the patient an automated reminder. Reminders go by SMS and email on every plan, and
      by WhatsApp on Premium.
  - question: Can a locum or a new partner see the family's history?
    answer: >-
      Yes, every doctor in the practice writes on the same patient record, and the facesheet and the
      auto-generated summary put each patient's history in front of whoever opens it. Each person logs in as
      themselves, and the role on that login decides which screens they can open.
  - question: I have years of family card files. Can they go into Easy Clinic?
    answer: >-
      Yes, as scans: documents and images can be uploaded to each patient's record, so pages from the old
      card sit beside the new visits. The history you want on the facesheet goes in through the intake
      form, which you can fill in at each person's next visit.
  - question: How is this different from the general practitioner page?
    answer: >-
      Both run on the same EMR. The general practitioner page follows a single walk-in visit from the token
      to the bill; this page is about looking after several members of a family over many years, with each
      person's history and preventive care kept on their own record.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      No, Easy Clinic is cloud software and does not run fully offline today, so plan for a working
      connection in the consulting room. If the line at your clinic drops often, keep a backup connection,
      such as a mobile hotspot.

