      alignTop: true
      body: |-
        ### Instant Prescriptions: Create and Share in 30 Seconds
        Generate detailed prescriptions in just 30 seconds and instantly share them via print, WhatsApp, SMS, or email, available in any language for seamless communication.

        ### Custom-Tailored IVF EMR for Specialists
        Designed to match the unique needs of IVF specialists, with flexible workflows and personalized features to ensure a smooth, efficient experience.

        ### AI-Driven Efficiency
        Simplify your documentation process and save time with an AI-powered assistant that generates prescriptions in just three clicks.

        ### Cycle Management
        Monitor stimulation protocols, track follicular development, and manage key milestones like egg retrieval and embryo transfer.

        ### Hormonal Treatment Tracking
        Record medications like gonadotropins, agonists, or antagonists, with dose adjustments.

        ### Visual Health Insights
        Effortlessly visualize specific vitals, lab reports, and clinical parameters for better patient care.

        ### Streamlined Patient Summaries
        Save time with auto-generated summaries and facesheets, intelligently presenting key patient data.

        ### Simplified Point-and-Click Interface
        Easily record chief complaints, medical history, vitals, and more using a user-friendly interface. Features custom examination forms, auto-complete notes, diagnosis, medications, investigations, referrals, follow-ups, and patient guidelines, all designed for quick access without navigating lengthy screens.

        ### Complete Medical History: Customizable Intake Forms for IVF Patients
        Capture detailed or concise medical histories tailored to your needs, including chronic illnesses, family and social history, obs-gynae details, substance use, alternative therapies, COVID history, and immunizations. All information is seamlessly integrated into the patient’s face sheet for quick reference during follow-ups.
