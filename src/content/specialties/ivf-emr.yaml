sections:
  - discriminant: painBlocks
    value:
      id: where-ivf-clinics-lose-time
      heading: Where an IVF clinic loses track
      intro: >-
        A fertility centre runs on dates, and most of what goes wrong happens between visits,<br class="hidden md:inline">
        when the record of one cycle is split between the nurses' station and the lab.
      items:
        - heading: The stimulation sheet lives on paper
          body: >-
            Through a stimulation cycle the patient comes back every few days for a follicle scan and a dose
            change. The dose sheet sits in a file at the nurses' station and the scan report in the
            sonographer's folder, so on the morning the doctor decides on the trigger, she is reading both
            from a phone photo.
          fix: >-
            The stimulation protocol and each follicle-tracking visit sit on the patient's record, with every
            dose change beside them, through to egg retrieval and embryo transfer. The doctor opens one screen
            before the patient sits down.
        - heading: The embryology lab keeps its own book
          body: >-
            The embryologist writes up the retrieval and what became of each egg in the lab's register.
            Months later the couple come back to plan a frozen embryo transfer, and the consult waits while
            someone walks to the lab to find the right page.
          fix: >-
            Embryo-related data and lab records are stored and managed in Easy Clinic, the same system the
            doctor charts in, so the consult does not wait on the lab's register. Each person logs in as
            themselves, and the role on that login decides which screens they can open.
        - heading: The package is paid in parts and tracked in a spreadsheet
          body: >-
            An IVF cycle is sold as a package and paid in parts, with an advance when stimulation starts and
            the balance before egg retrieval. The accounts desk keeps the balances in a spreadsheet, and when
            a cycle is cancelled after the scans, nobody is sure what was paid or what is owed back.
          fix: >-
            On Premium the cycle is billed as one package treatment, and every part payment and advance is
            recorded against it. The front desk sees the balance on the bill, and a refund goes through only
            with authorisation.

  - discriminant: featureRows
    value:
      id: built-around-the-cycle
      heading: Built around the IVF cycle
      intro: >-
        Package billing and lab reports in the chart come with Premium, Easy Clinic's plan for specialists.
      layout: grid
      items:
        - heading: Cycle tracking, from stimulation to embryo transfer
          icon: activity
          body: >-
            Record the stimulation protocol and track follicular development visit by visit, up to the
            milestones of egg retrieval and embryo transfer on the same record. Medications such as
            gonadotropins and antagonists are recorded with each dose adjustment, and hormone levels are kept
            in the patient record beside them.
          bullets:
            - Stimulation protocol and follicle tracking
            - Egg retrieval and embryo transfer as milestones
        - heading: Embryology and lab records in Easy Clinic
          icon: flask-conical
          body: >-
            Embryo-related data and the lab's records are stored and managed in Easy Clinic, the system the
            doctor writes the chart in, so the embryology work is there when the couple come back for their
            next consult. Ultrasound and other diagnostic reports are uploaded to the patient's record, and
            the facesheet puts the patient's key data on one screen.
          bullets:
            - Embryo-related data and lab records in one system
            - Ultrasound and diagnostic reports uploaded to the record
        - heading: Package billing, paid in parts
          icon: wallet
          body: >-
            On Premium an IVF cycle is billed as one package treatment, and the payment is spread over the
            course of the treatment. Part payments and advances are recorded against the package, and a
            refund or a voided invoice goes through only with authorisation.
          bullets:
            - Part payments and advances recorded against the package
            - Refunds and voided invoices only with authorisation
        - heading: Lab reports in the chart
          icon: chart-line
          body: >-
            On Premium, lab reports come into the patient's chart and the values can be charted visit by
            visit, so the hormone trend is on one screen when the doctor changes a dose. Full lab management,
            with orders from the chart and sample tracking, comes with Enterprise or as a module added to
            Professional or Premium.
          bullets:
            - Hormone values charted visit by visit on Premium
            - Full lab management with Enterprise or as a module
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the note for the doctor to review.
          bullets:
            - Cura AI comes with every plan
            - The doctor reviews every draft note

  - discriminant: featureRows
    value:
      id: between-the-scans
      heading: An IVF cycle, from the booking to the dispensary
      intro: >-
        Through a cycle the patient comes back every few days, so much of the clinic's work is booking the
        next visit and keeping the patient to the dates.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: Scan visits on the same calendar as consultations
          icon: calendar-clock
          body: >-
            Fixed-time appointments and walk-ins sit on one calendar, and several visits can be booked in one
            go. The waiting room view shows the queue and how long each patient has waited.
          link:
            label: Read how booking works
            href: /features/appointment-scheduling/
        - heading: A reminder before the next visit
          icon: bell-ring
          body: >-
            The next visit date goes in the note, and the patient gets an automated reminder for it, by SMS
            or email on every plan and by WhatsApp on Premium. Reminders go out automatically, days or hours
            before the visit, at the times the clinic sets.
          link:
            label: Read how WhatsApp reminders work
            href: /features/whatsapp/
        - heading: Consultations billed at the desk
          icon: receipt
          body: >-
            A consultation or a test that is not part of a package is billed at the desk from the clinic's
            service list, with taxable and non-taxable items kept apart. A discount goes through only with
            authorisation, and the receipt goes to the patient by SMS or email, or on WhatsApp with Premium.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Video reviews
          icon: video
          body: >-
            On Premium a review can be a video consultation booked through the appointment screen, with the
            fee collected online at booking. It suits a review of a report, and the prescription reaches the
            patient by WhatsApp, SMS or email with a note that the consultation was remote.
          link:
            label: Read how teleconsultations work
            href: /features/telemedicine/
        - heading: Medicines dispensed from the prescription
          icon: pill
          body: >-
            With pharmacy and inventory, which comes with Enterprise or as a module on Professional and
            Premium, the pharmacist dispenses from the doctor's prescription. Each batch is tracked to its
            expiry date.
          link:
            label: Read how pharmacy and inventory work
            href: /features/pharmacy-and-inventory/

