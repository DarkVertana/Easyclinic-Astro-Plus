sections:
  - discriminant: painBlocks
    value:
      id: where-ivf-clinics-lose-time
      heading: Where an IVF clinic loses track
      intro: >-
        A fertility centre runs on dates, and most of what goes wrong happens between visits, when the
        record of one cycle is split between the nurses' station and the lab.
      items:
        - heading: The stimulation sheet lives on paper
          body: >-
            Through a stimulation cycle the patient comes back every few days for a follicle scan and a dose
            change. The dose sheet sits in a file at the nurses' station and the scan report in the
            sonographer's folder, so on the morning the doctor decides on the trigger, she is reading both
            from a phone photo.
          fix: >-
            The stimulation protocol and each follicle-tracking visit sit on the patient's record, with every
            dose change beside them, through to egg retrieval and embryo transfer. The doctor opens one screen
            before the patient sits down.
          href: /features/emr/
          linkLabel: Read how the chart works
        - heading: The embryology lab keeps its own book
          body: >-
            The embryologist writes up the retrieval and what became of each egg in the lab's register.
            Months later the couple come back to plan a frozen embryo transfer, and the consult waits while
            someone walks to the lab to find the right page.
          fix: >-
            Embryo-related data and lab records are stored and managed in EasyClinic, the same system the
            doctor charts in, so the consult does not wait on the lab's register. Each person logs in as
            themselves, and the role on that login decides which screens they can open.
        - heading: The package is paid in parts and tracked in a spreadsheet
          body: >-
            An IVF cycle is sold as a package and paid in parts, with an advance when stimulation starts and
            the balance before egg retrieval. The accounts desk keeps the balances in a spreadsheet, and when
            a cycle is cancelled after the scans, nobody is sure what was paid or what is owed back.
          fix: >-
            On Premium the cycle is billed as one package treatment, and every part payment and advance is
            recorded against it. The front desk sees the balance on the bill, and a refund goes through only
            with authorisation.
          href: /pricing/
          linkLabel: See what Premium includes

  - discriminant: featureRows
    value:
      id: built-around-the-cycle
      heading: Built around the IVF cycle
      intro: >-
        Package billing and lab reports in the chart come with Premium, EasyClinic's plan for specialists.
      items:
        - heading: Cycle tracking, from stimulation to embryo transfer
          body: >-
            Record the stimulation protocol and track follicular development visit by visit, up to the
            milestones of egg retrieval and embryo transfer on the same record. Medications such as
            gonadotropins and antagonists are recorded with each dose adjustment, and hormone levels are kept
            in the patient record beside them.
          bullets:
            - Stimulation protocol and follicle tracking
            - Egg retrieval and embryo transfer as milestones
            - Each dose adjustment recorded with the medication
            - Hormone and other lab values charted over time
        - heading: Embryology and lab records in EasyClinic
          body: >-
            Embryo-related data and the lab's records are stored and managed in EasyClinic, the system the
            doctor writes the chart in, so the embryology work is there when the couple come back for their
            next consult. Ultrasound and other diagnostic reports are uploaded to the patient's record, and
            the facesheet puts the patient's key data on one screen.
          bullets:
            - Embryo-related data and lab records in one system
            - Ultrasound and diagnostic reports uploaded to the record
            - Case notes shared across the care team
            - A role on every login that decides who sees what
        - heading: Package billing, paid in parts
          plan: premium
          body: >-
            On Premium an IVF cycle is billed as one package treatment, and the payment is spread over the
            course of the treatment. Part payments and advances are recorded against the package, and a
            refund or a voided invoice goes through only with authorisation.
          bullets:
            - Part payments and advances recorded against the package
            - Refunds and discounts only with authorisation
            - Taxable and non-taxable items kept apart on the bill
            - Receipts and invoices sent to the patient on WhatsApp
        - heading: Lab reports in the chart
          plan: premium
          body: >-
            On Premium, lab reports come into the patient's chart and the values can be charted visit by
            visit, so the hormone trend is on one screen when the doctor changes a dose. Full lab management,
            with orders from the chart and sample tracking, comes with Enterprise or as a module added to
            Professional or Premium.
        - heading: Cura AI drafts the note
          plan: professional
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the note for the doctor to review.
          link:
            label: Read what Cura AI does
            href: /ai/

  - discriminant: testimonialRow
    value:
      id: fertility-clinic-hyderabad
      heading: A fertility clinic in Hyderabad, on EasyClinic since 2012
      intro: >-
        Dr Seetha Lakshmi Kolanakuduru is a doctor at Aditya Women and Infertility Clinic in Hyderabad, an
        obstetrics and fertility clinic that has used EasyClinic since 2012.
      items:
        - seetha-lakshmi-kolanakuduru
      layout: single

  - discriminant: stepList
    value:
      id: learning-path
      heading: '{fact:trainingDays} days of training, about two hours in all'
      intro: >-
        Training is a personalised programme for the doctors and the clinic staff who will use EasyClinic,
        in short sessions spread over {fact:trainingDays} days, so the clinic keeps seeing patients while
        you learn.
      steps:
        - title: Basic training
          meta: Day 1, 40 minutes
          body: >-
            Doctors and the front desk learn the screens they each use every day: the appointment book and
            the bill at the desk, the chart and the prescription in the consulting room.
        - title: EMR scenario training
          meta: Day 2, 40 minutes
          body: >-
            You work through the chart and the prescription on the kinds of cases your clinic sees.
        - title: Practice exercises
          meta: Day 3, 20 minutes
          body: You repeat what the first two sessions covered, so the first real patient is not your first attempt.
        - title: Road to expertise
          meta: Day 4, 20 minutes
          body: The last session moves you from the basics to the shortcuts that make the daily work quicker.
      note: >-
        From the demo, a clinic can be live in as little as {fact:goLiveDays} days. Moving old records across
        from another system adds time to that.

faqHeading: Questions IVF clinic owners ask
faq:
  - question: Which EasyClinic plan does an IVF clinic need, and what does it cost?
    answer: >-
      Premium, the plan for specialists, because package treatments start on it: {price:inr.premium.annual}
      per doctor per month billed annually in India or {price:inr.premium.quarterly} billed quarterly, and
      {price:usd.premium.annual} or {price:usd.premium.quarterly} in US dollars. It also includes the specialty EMR templates and lab
      reports in the chart. The price includes a reception
      login, and there is no setup fee.
  - question: Can EasyClinic track each stage of an IVF cycle?
    answer: >-
      Yes, the cycle sits on the patient's record from the stimulation protocol and follicle tracking
      through to egg retrieval and embryo transfer, with each dose adjustment recorded against the
      medication. Hormone levels are kept in the same record, and on Premium you can turn your own paper
      cycle sheet into a form with the form builder.
  - question: Where do the embryology records go, and who can see them?
    answer: >-
      Embryo-related data and lab records are stored and managed in EasyClinic, the same system as the
      doctor's chart, so nobody has to fetch a register from the lab. Each person logs in as themselves and the role on
      their login decides which screens they can open; the reception login, included in the price, cannot
      open the EMR or issue a prescription.
  - question: How are IVF packages billed when the patient pays in instalments?
    answer: >-
      On Premium the cycle is billed as one package treatment, and each part payment or advance is recorded
      against it, so the front desk sees the balance before taking the next payment. The payment can be
      spread over the course of treatment, and a refund for a cycle cancelled partway goes through only with
      authorisation.
  - question: How do scan and lab reports get into the patient's record?
    answer: >-
      Ultrasound and other diagnostic reports are uploaded to the patient's record as files, and on Premium
      lab reports come into the chart. A direct connection to a lab machine is custom integration work: it is
      included in Enterprise or added to Professional and Premium, and it is scoped per project.
  - question: Does EasyClinic run the clinic pharmacy and the stock of lab supplies?
    answer: >-
      Yes, but not on Premium alone: pharmacy and inventory are included in Enterprise, or added to
      Professional and Premium as a module. With the module, the pharmacist dispenses from the doctor's
      prescription and tracks each batch to its expiry date.

