sections:
  - discriminant: painBlocks
    value:
      id: where-it-slips
      heading: Where a neurology clinic loses track
      intro: >-
        A neurologist often sees the same patient for years, every few months, and<br class="hidden md:inline">
        most of what goes missing is the history between one visit and the next.
      items:
        - heading: The MRI arrives in a carry bag
          body: >-
            A patient with epilepsy comes back after a year with a bag of EEG printouts and MRI reports.
            The first minutes of the consult go on sorting paper, and last year's EEG report is the one
            that stayed at home.
          fix: >-
            EEG, MRI, CT and other diagnostic reports are uploaded to the patient's file once, and past
            records open side by side with today's visit, so next year's consult starts from the file
            rather than from the bag.
        - heading: Years of dose changes, one prescription at a time
          body: >-
            A patient with Parkinson's disease has been seen every three months for five years, and the
            dose has changed many times. The record of those changes lives on old prescriptions, so the
            question of what was tried before, and why it was stopped, gets answered from the patient's
            memory.
          fix: >-
            Medicines and the treatment plan are recorded and tracked on the patient's record, and every
            visit sits on one screen as a longitudinal view, so five years of changes are read in one
            place.
        - heading: The examination is typed from scratch at every visit
          body: >-
            The neurological examination is written freehand, in a slightly different order each time. A
            colleague covering the clinic cannot tell at a glance whether the weakness in the left leg is
            new or was there last spring.
          fix: >-
            On Premium, predefined neurological examination templates, for conditions from migraine to
            neuropathy, give the examination the same structure at every visit. A paper examination form the clinic
            already uses can be rebuilt as a digital one.
        - heading: The follow-up that nobody chases
          body: >-
            A patient on an anti-seizure medicine is due back in three months for a dose review and does not
            come. The date was written on the prescription, and nobody at the clinic has a reason to look at
            that prescription again.
          fix: >-
            The follow-up is set in the note, and the patient gets an automated reminder before the date.
            SMS and email reminders come with every plan, and Premium adds WhatsApp.

  - discriminant: featureRows
    value:
      id: neurology-record
      heading: Built around the neurology record
      intro: >-
        A neurology patient is usually followed for years, so the record is built to be read over time.
        Premium, the plan for specialists, includes everything below, and examination templates and video
        follow-ups are not on Professional.
      layout: grid
      items:
        - heading: Neurological examination templates
          icon: brain
          body: >-
            Premium comes with predefined neurological examination templates for common conditions, among
            them migraine, epilepsy, Parkinson's disease, multiple sclerosis and neuropathy. The table
            further down lists them with the forms and layouts your clinic can add of its own.
          bullets:
            - Predefined examination templates on Premium
            - Migraine, epilepsy, Parkinson's disease and neuropathy
        - heading: Scan and EEG reports in the patient's file
          icon: scan-line
          body: >-
            EEG, MRI, CT and other diagnostic reports are stored in the patient's file, with images and
            documents uploaded to the same record as the visits. Past records open side by side with
            today's, and an auto-generated summary and facesheet set out the case history for review.
          bullets:
            - EEG, MRI and CT reports stored in the patient's file
            - Past records open side by side with today's
        - heading: Years of follow-up on one screen
          icon: history
          body: >-
            Long-term conditions such as epilepsy and Parkinson's disease are tracked across visits, and the
            patient's visits sit on a single screen as a longitudinal view. Medicines and treatment plans
            are recorded and tracked at each visit, and vitals and lab values can be charted over time.
          bullets:
            - Epilepsy and Parkinson's disease tracked across visits
            - Vitals and lab values charted over time
        - heading: History taken before the consult
          icon: clipboard-plus
          body: >-
            The intake form can be set up to take a detailed or a short history, covering chronic
            illnesses, family and social history, substance use, alternative therapies and immunisations,
            and the answers go onto the facesheet. A clinical assistant or nurse can take the intake before
            the neurologist sees the patient, and case notes are shared across the care team.
          bullets:
            - Detailed or short history taken on the intake form
            - A nurse or assistant can take the intake first
        - heading: A prescription the family can read
          icon: pill
          body: >-
            Prescriptions can be issued in more than one language, so the family member who gives the
            medicines can read them. They are printed or sent by SMS, email or, on Premium, WhatsApp. A
            drug interaction check is part of the EMR.
          bullets:
            - Prescriptions issued in more than one language
            - Sent by SMS or email, and on Premium by WhatsApp
        - heading: Video follow-ups
          icon: video
          body: >-
            On Premium, a follow-up can be booked as a video consultation through the appointment screen,
            with the fee collected online. The neurologist and the patient join from a web browser on a
            computer or a phone, with nothing to install, and the prescription that follows says the
            consultation was remote.
          bullets:
            - Booked as a video consultation, fee collected online
            - Joined from a web browser with nothing to install
        - heading: Tests booked with the machine they need
          icon: calendar
          body: >-
            Equipment or an assistant can be booked inside the appointment slot, so a test that needs a
            machine and a technician is booked with the patient's visit. The desk bills the consult and the
            test from the clinic's own service list, with part payments and advances recorded against the
            bill.
          bullets:
            - Equipment or an assistant booked in the appointment slot
            - Consult and test billed from your own service list
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the note for the neurologist to review.
          bullets:
            - Cura AI comes with every plan
            - The neurologist reviews every draft note

  - discriminant: featureRows
    value:
      id: the-review
      heading: A neurology review, from the desk to the bill
      intro: >-
        What happens around the consult, in the order the day runs. Where a row needs a particular plan, it
        says so.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: Booked reviews and walk-ins on one calendar
          icon: calendar-clock
          body: >-
            Fixed-time appointments and walk-ins sit on one calendar, so the desk sees the booked reviews and
            the patients who came in without one on the same list.
          link:
            label: Read how booking works
            href: /features/appointment-scheduling/
        - heading: The desk checks the patient in
          icon: users
          body: >-
            Each person logs in as themselves, and the role on that login decides which screens they can open.
            The reception login included in the price cannot open the EMR or issue a prescription.
        - heading: The next review set in the note, with a reminder
          icon: bell-ring
          body: >-
            The neurologist sets the follow-up in the note, and the patient gets an automated reminder before
            the date. SMS and email reminders come with every plan, and Premium adds WhatsApp.
        - heading: Medicines from the clinic's own pharmacy
          icon: package
          body: >-
            With pharmacy and inventory, which comes with Enterprise or as a module on Professional and
            Premium, the pharmacist dispenses from the doctor's prescription and tracks each batch to its
            expiry date. Premium alone does not include it.
          link:
            label: Read how pharmacy and inventory work
            href: /features/pharmacy-and-inventory/
        - heading: Refunds and receipts at the desk
          icon: wallet
          body: >-
            A refund or a voided invoice goes through only with authorisation. The receipt goes to the
            patient by SMS or email, or on WhatsApp with Premium.
          link:
            label: Read how billing works
            href: /features/billing/

