faqHeading: Questions neurologists ask
faq:
  - question: Which EasyClinic plan does a neurology clinic need, and what does it cost?
    answer: >-
      Premium, because the neurological examination templates are specialty EMR templates and those start
      on Premium: {price:inr.premium.annual} per doctor per month billed annually in India or
      {price:inr.premium.quarterly} billed quarterly, and {price:usd.premium.annual} or
      {price:usd.premium.quarterly} in US dollars. Professional, at {price:inr.professional.annual} or
      {price:usd.professional.annual}, has the EMR and billing without the specialty templates. Both include
      a reception login at no extra cost. Neither has a setup fee or a binding contract.
  - question: Which neurology templates are ready, and can I add my own?
    answer: >-
      Premium comes with predefined examination templates for common neurological conditions, among them
      migraine, epilepsy, Parkinson's disease, multiple sclerosis and neuropathy. For a condition without a
      ready template, Premium's form builder turns a paper examination form your clinic already uses into a
      digital one, and the customisation comes without charges.
  - question: Can I keep EEG, MRI and CT reports on the patient's record?
    answer: >-
      Yes, EEG, MRI, CT and other diagnostic reports are stored in the patient's file, uploaded as images or
      documents beside the visits. Past records open side by side with today's visit.
  - question: Can EasyClinic connect to our EEG machine or the imaging centre's system?
    answer: >-
      Not out of the box: no plan comes with a ready connection to an EEG machine or an imaging system, so
      EEG and scan reports go into the patient's file as uploaded images or documents. Connecting a device
      or another system is custom integration work, included in Enterprise or added to Professional and
      Premium, and scoped per project.
  - question: Can I follow a patient with epilepsy or Parkinson's disease over several years?
    answer: >-
      Yes, the record tracks long-term conditions across visits, with the patient's visits on one screen and
      the medicines and treatment plan recorded at each one. Vitals and lab values can be charted over time,
      and on Premium lab reports come into the chart.
  - question: Can I see follow-up patients by video?
    answer: >-
      Yes, on Premium, which includes video consultations booked through the appointment screen with the
      fee collected online. You and the patient join from a web browser on a computer or a phone with
      nothing to install, and the prescription sent afterwards on WhatsApp or by email says the
      consultation was remote.
  - question: Can a nurse take the history before I see the patient?
    answer: >-
      Yes, a clinical assistant or nurse can do the intake before the consult, and the history taken on the
      intake form goes onto the patient's facesheet. Each person logs in as themselves and the role on the login decides what
      they can open; the reception login included in the price cannot open the EMR or issue a prescription.
  - question: Does EasyClinic work without an internet connection?
    answer: >-
      No, EasyClinic does not run fully offline today: the cloud version needs an internet connection, so
      the clinic needs a working line while it sees patients. A self-hosted option also exists, where the
      system runs on the clinic's own server rather than in EasyClinic's cloud.

