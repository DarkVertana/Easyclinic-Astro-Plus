editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The named condition templates, EEG and MRI reports kept in the patient's file, and the plan split a
    neurologist actually meets (templates and video follow-ups on Premium, a device connection only as scoped integration work)
    come from EasyClinic's own neurology page and plans.yaml; nothing on the page is specific to one country
    beyond the rupee price.
  readsMachineWritten: >-
    The page has no named neurologist, no screenshot and no number measured in a neurology clinic, the four
    pains are composites, and a neurologist will notice that the page names no seizure diary, stroke or
    cognitive scale, nerve conduction report format or template count, because none is confirmed.

notes:
  - 'Grounding: examination templates for common conditions "like" migraine, epilepsy, Parkinson''s disease, multiple sclerosis and neuropathy; storage of EEG, MRI, CT and other diagnostic records in patient files; long-term tracking of epilepsy, stroke recovery and Parkinson''s disease; medication and treatment plan tracking; longitudinal visit data on one screen; side-by-side past records; image and document upload; auto-generated summaries and facesheets; customisable intake forms (history fields as listed); clinical assistant or nurse intake (the page does not say what the intake covers, so vitals are not claimed); collaborative case notes; multilingual prescriptions sent by print, WhatsApp, SMS or email; drug interaction check (listed by name only, so the page says no more than that); vitals and lab charts; video consultations in the browser with online fees and a remote-consult disclaimer on the prescription; resource booking (equipment or assistants) inside the appointment slot; service list billing with part and advance payments; automated follow-up reminders; role-based access. All stated plainly on the live /neurology-emr/ page (retrieved 2026-09-26). Plan placement follows plans.yaml (specialty templates, own forms and print layouts, video, WhatsApp and lab reports on Premium; integrations on Enterprise or as an add-on).'
  - 'Recruit a named neurology testimonial (spec 5.15 item 9): a named neurologist or neurology clinic on EasyClinic, with city, clinic and consent on file, added to src/data/testimonials/ and placed only on this page as a customer proofBlock or a single testimonialRow. Until then the proof block is the Capterra and Google badges, and its intro says no neurologist quote exists yet. Review counts are null in facts.yaml, so the badges show no count. The four testimonials on the live page (two psychiatrists, a general physician, an ophthalmologist) are not neurology quotes and are assigned to other pages.'
  - 'Spec 5.15 has no must-have row for neurology, so the company to-do follows the template items: (3) a screenshot of each chart object; (4) a timed walkthrough of the most common neurology visit; (5) the full list of neurology examination templates, named and counted, with the fields in each (the live page names five as examples, "like migraines, epilepsy...", so the page gives no count); (6) integrations and devices: whether EEG, EMG or nerve conduction machines connect, and whether MRI and CT are stored as file uploads only or can be viewed as DICOM (the page says "uploaded" and "stored in the patient''s file" only); (7) any neurology billing packages (the live page mentions package amortisation only in general terms, so the page has no package row); (8) which neurology note types Cura AI drafts, with one example note; (9) the testimonial above.'
  - 'Company to confirm for neurology: whether a seizure diary or seizure-frequency chart exists (the brief allowed it only if stated; the live page does not state it); headache diaries; standard scales as templates (for example NIHSS for stroke, MMSE or MoCA for cognition, EDSS for multiple sclerosis, UPDRS for Parkinson''s disease); a stroke template (the live page names stroke recovery under long-term tracking but not among the templates); how nerve conduction and EMG results are documented; which languages multilingual prescriptions support.'
  - 'Company to confirm plan placement: the live page lists side-by-side past records, clinical assistant or nurse intake, the longitudinal view and collaborative case notes under "Advanced EMR for specialists", which /pricing/ names as a Premium inclusion, while image and document upload, the drug interaction check, vitals and lab charts and custom examination forms sit in its general EMR section. The page gives these rows no plan badge, and the featureRows intro says only that Premium includes every row. Also confirm whether customising the intake form and sending prescriptions by SMS or email need Premium, and whether an EEG technician or clinical assistant needs a paid licence under per-doctor pricing.'
  - 'Dropped from the live page: both "Easy Clinic vs other EMR" comparison tables (unsourced competitor cells); "prescriptions in 30 seconds" and "three clicks" (unmeasured); AI-powered diagnostic assistance, differential diagnoses and ADR alerts (CuraPilot claims, not on this page); AI wait-time management and AI two-way messaging; "over 100 graphical dashboards", data warehouse, Power BI and Azure Data Factory; "invoices ready in less than 10 seconds"; "Reduces no-shows" (noShowReduction is null); the "14-Day Free Trial, with an extra 30-Day Money Back Guarantee" (owner decision: no free trial); "Inventory for medicines & supplies built-in" and the FAQ "Inventory management is included" (plans.yaml puts pharmacy and inventory in Enterprise or as a module); the FAQ "Can multiple neurologists use Easy Clinic?", whose live answer is a copy of the inventory answer; patient self-service booking and check-in (plan unclear); triage, medical calculators, growth charts and tabular Rx (listed without detail); the generic HR, roster, commission, reports and communication sections.'
  - 'No heroMedia and no media: screenshots do not exist yet. Hero when captured: a follow-up visit for a patient with epilepsy, with the examination template open and the EEG report in the file beside it. The four pains are illustrative neurology clinic situations, not customers; "five years", "three months" and the left-leg weakness are examples.'
  - 'Title 34 characters; meta description 154 characters with the token resolved (₹1,999). The brief''s H1 "EMR for neurology clinics" is used rather than the spec 5.15 item 1 form, as on the IVF and physiotherapy pages. /clinic-management-software-india/ and /emr-software-in-kenya/ are still drafts; the related links resolve once they publish.'
  - The editorial pass recorded here is an AI review. A human editor still needs to read the page aloud and answer the two spec 6.5 questions; the page has no named person and no measured number, so it meets only two of the four spec 6.5 pass marks (a local fact in the rupee price, and admissions of limits in the device-connection and offline FAQs) until the testimonial arrives.
  - 'Fact-check pass 2026-09-26 (live page re-fetched): the "five conditions" count was removed everywhere, because the live page lists the templates as examples ("like migraines, epilepsy..."); the drug interaction row no longer claims a warning while writing; nurse intake no longer claims vitals; the facesheet no longer claims "one screen"; the EEG-connection FAQ now says no plan comes with a ready device connection, so reports are uploaded, and any connection is custom integration work (plans.yaml puts integrations in Enterprise or the scoped add-on); "an MRI on a disc" became MRI reports so nothing implies disc or DICOM import; groups of three were split in the pain, prescription, follow-up and FAQ copy; the meta description now says the price is billed yearly.'
