sections:
  - discriminant: painBlocks
    value:
      id: where-urology-clinics-lose-track
      heading: Where a urology clinic loses track
      intro: >-
        A urology patient often comes back for years, with a stone that recurs or a prostate<br class="hidden md:inline">
        that is watched, and most of what goes missing falls between one visit and the next.
      items:
        - heading: The CT report from the last stone is at home
          body: >-
            The patient is back with pain on the same side as two years ago. The CT report from then is in a
            drawer at home, and the doctor has to decide on today's scan without knowing where the last stone
            sat.
          fix: >-
            Ultrasound and CT reports are uploaded to the patient's record and stay there, and past records
            open side by side with today's visit, so the earlier report is on the screen without the patient
            bringing it.
        - heading: The procedure register sits in the day-care room
          body: >-
            Cystoscopies and lithotripsy sessions are written in a register beside the procedure table. When
            the patient comes back for a stent removal, the outpatient doctor cannot see which stent went in or
            when.
          fix: >-
            Procedures such as cystoscopies, lithotripsy and prostate biopsies are logged on the patient's
            record, so the procedure and every review after it are in one place.
        - heading: The PSA results in a folder of printouts
          body: >-
            A man under watch for his prostate has a PSA test before each review, done at whichever lab was
            nearest. The doctor reads four printouts in different layouts to decide whether the value is rising.
          fix: >-
            Lab reports are stored on the patient's record, and on Premium they come into the chart, where each
            value can be charted visit by visit.
        - heading: The six-month review that never happened
          body: >-
            After a stone is cleared the patient is told to come back in six months for a scan. The date is on
            the discharge paper, and the next time the clinic hears from them is the next episode of pain.
          fix: >-
            The follow-up is set from the chart before the patient leaves, and an automated reminder goes out
            before the date. SMS and email reminders come with every plan, and Premium adds WhatsApp.

  - discriminant: featureRows
    value:
      id: urology-record
      heading: Built around the urology record
      intro: >-
        Urology templates, lab reports in the chart and package billing need Easy Clinic's Premium plan, the
        plan most specialists choose. Professional does not include them.
      layout: grid
      items:
        - heading: Procedure logs
          icon: clipboard-plus
          body: >-
            Procedures are logged on the patient's record, with urological procedures such as cystoscopies,
            lithotripsy and prostate biopsies among them. Easy Clinic runs the outpatient side: the operating
            theatre's own scheduling and records, and the wards, stay on the hospital's system.
          bullets:
            - Cystoscopies, lithotripsy and prostate biopsies logged
            - Theatre scheduling and wards stay on the hospital's system
        - heading: Ultrasound and CT reports on the record
          icon: scan-line
          body: >-
            Imaging records such as ultrasound and CT reports, and lab and diagnostic reports, are stored on the
            patient's record as uploaded images and documents. Past records open side by side with today's
            visit.
          bullets:
            - Lab and diagnostic reports uploaded to the same record
            - Past records open side by side with today's visit
        - heading: Urology templates
          icon: layout-template
          body: >-
            Premium includes Easy Clinic's specialty templates, with urology consultation templates built
            around a urologist's workflow. A paper form your clinic already uses can be rebuilt in the form
            builder, and your prescription and case sheet print in your own layout, with no charge for the
            customisation.
          bullets:
            - Consultation templates built around a urologist's workflow
            - Your paper form rebuilt in the form builder at no charge
        - heading: Lab values as trend charts
          icon: chart-line
          body: >-
            Vitals and clinical parameters are shown as charts and graphs, and on Premium lab reports come into
            the chart, so a value such as PSA or creatinine reads as a line across visits.
          bullets:
            - PSA or creatinine read as a line across visits
            - Lab reports come into the chart on Premium
        - heading: Long-term follow-up
          icon: calendar-clock
          body: >-
            Chronic conditions are followed up visit by visit, the follow-up is set from the chart with an
            automated reminder, and the drug interaction check warns of an interaction as each prescription is
            written.
          bullets:
            - Follow-up set from the chart with an automated reminder
            - A drug interaction check on each prescription
        - heading: Procedure packages, paid in parts
          icon: wallet
          body: >-
            On Premium a procedure or a course of treatment is billed as one package treatment, and the patient
            can pay in parts. Advances and part payments are recorded against the package, and a refund or a
            voided invoice goes through only with authorisation.
          bullets:
            - Advances and part payments recorded against the package
            - Refunds and voided invoices only with authorisation
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the note for the doctor to review.
          bullets:
            - Cura AI comes with every plan
            - The doctor reviews every draft note

  - discriminant: featureRows
    value:
      id: stone-review
      heading: A stone review, from the desk to the bill
      intro: >-
        A patient back with a new scan after a kidney stone is one of the visits a urology clinic repeats most.
        We have not timed these steps in a urology clinic, so the page gives no minutes for them.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: At the desk
          icon: calendar-clock
          body: >-
            The patient checks in, booked or walked in, and gets a token number for the queue. The new
            ultrasound or CT report is uploaded to the record, and a nurse or clinical assistant takes the
            vitals before the consult.
        - heading: In the consulting room
          icon: notebook-pen
          body: >-
            The urologist has the earlier report and the procedure log open beside today's visit, and writes the
            note by point and click, or from a urology template on Premium. The prescription screen warns of a
            drug interaction as it is written.
        - heading: The procedure, if one is needed
          icon: clipboard-list
          body: >-
            If the stone needs lithotripsy, the procedure is logged on the same record, and on Premium it is
            billed as a package with the advance recorded against it.
        - heading: The next review and the bill
          icon: receipt
          body: >-
            The next scan and review are set before the patient leaves, with a reminder before the date. The
            visit is billed in one click, and the receipt goes out by email, or on WhatsApp on Premium.

  - discriminant: splitContent
    value:
      id: specialty-emr
      heading: Electronic Medical Records (EMR) which is flexible
      headingAccent: flexible
      centerHeading: true
      mediaFirst: true
      featureList: true
      narrowMedia: true
      stickyMedia: true
      alignTop: true
      body: |-
        ### 30-Second Prescription
        Generate detailed prescriptions in just 30 seconds and deliver them instantly in any language via print, WhatsApp, SMS, or email.

        ### Specialized Urology EMR
        Custom-designed to align with Urologists workflows, preferences, and expertise, ensuring a personalized and efficient experience.

        ### AI-Driven Prescription Support
        Complete prescriptions in just three clicks with the help of an AI assistant, streamlining your documentation process and saving valuable time.

        ### Health Trend Visualization
        Display specific vitals, lab reports, and clinical parameters as charts and graphs for easy visualization of patient health trends.

        ### Procedure Tracking
        Procedure Logs are essential for tracking and managing urological procedures such as cystoscopies, lithotripsy, and prostate biopsies.

        ### Instant Patient Summaries
        Quickly access auto-generated summaries and facesheets for a complete review of case histories, saving time and presenting important data effectively.

        ### User-Friendly Interface
        Easily record chief complaints, medical history, vitals, and more with a simple point-and-click UI, offering custom forms, auto-complete notes, diagnosis, medications, investigations, and patient guidelines, all with streamlined navigation.

        ### Complete Medical History Recording
        Customize your Urology patient intake form to capture as much or as little detail as needed, including chronic illnesses, family and social history, obstetric-gynecological history, substance use, alternative therapies, COVID history, and immunizations. These details are integrated into the patient’s face sheet, saving valuable time during follow-up visits.
