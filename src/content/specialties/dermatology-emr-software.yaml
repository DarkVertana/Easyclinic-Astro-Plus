editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-09-26
  onlyUsCouldWrite: >-
    The before photo lost in the doctor's camera roll and the laser package paid in parts are skin-clinic
    problems, and every capability is one Easy Clinic's own live skin-clinic and features pages state, with
    a plan named only where plans.yaml names one; nothing is specific to one country beyond the rupee price.
  readsMachineWritten: >-
    The page has no named dermatologist and no number measured in a skin clinic, and it names no
    dermatology template and says nothing about body maps or dermatoscope images, which a dermatologist
    will look for first.

notes:
  - 'Grounding (live pages retrieved 2026-09-26): before-and-after image capture, storage and comparison for tracking treatment progress (all three pages; cosmetology: "as part of each client''s treatment record"); image and document upload; skin type, allergies, past treatments and lifestyle habits in the patient profile, and tracking of past and ongoing procedures such as Botox, fillers, chemical peels and laser treatments (/cosmetology-emr-software/); "Clinics can track cosmetic procedures, laser treatments, and multiple sessions" and multiple follow-ups (/dermatology-emr-software/ FAQ); consent documentation stored in patient records (/aesthetic-emr-software/ and /cosmetology-emr-software/ FAQs); customisable intake forms, facesheets, visit history on a single screen, form builder for paper forms; resource booking (equipment or assistants) inside the appointment slot; fixed-time appointments, walk-ins and teleconsultations; video consults booked through the appointment module with online fee payment, browser-based, prescriptions sent with a remote-consultation disclaimer; part and advance payments, refunds and invoice voiding with authorisation, payment amortisation for package treatments, discount authorisation, taxable and non-taxable items, receipts and invoices on WhatsApp; role, department and level access settings with access rights and audit logs per user (/dermatology-emr-software/ HR, user and access control). Reception login cannot use the EMR or prescribe: migration/research/facts.md. Consumables in a service or package deducted automatically, stand-alone dispensing and refill collection without the appointment queue, and OTC products added at dispensing: live /features/ (re-fetched 2026-09-26). Plan placement follows plans.yaml (Premium: specialty templates, own forms and print layouts, package treatments, video consultations, WhatsApp; Enterprise or a module: pharmacy and inventory). Inventory wording follows the published /features/pharmacy-and-inventory/ page, which the live dermatology and aesthetic FAQs support (creams, skincare products, injectables and supplies).'
  - 'Recruit a named dermatology testimonial (spec 5.15 item 9): a named dermatologist, cosmetologist or aesthetic clinic owner on Easy Clinic, with city, clinic and consent on file, added to src/data/testimonials/ and placed only on this page. No testimonial on file is from a skin clinic; until one exists the proof block is the Capterra and Google badges, and its intro says no dermatologist quote exists yet. Review counts are null in facts.yaml, so the badges show no count.'
  - 'Spec 5.15 must-haves left out or narrowed (company to-do): (1) body-map annotation is not mentioned on any of the three live pages; confirm whether a body diagram exists for marking lesions or treatment areas, and on which plan. (2) Before-and-after image timelines: the live pages say images are stored on the record and compared, but not whether they are shown as a dated timeline or side by side ("Side-by-Side past records" is a tag with no description); the page says store and compare only. (3) Consent forms: only storage in the record is stated; confirm whether consent can be signed on screen, whether per-procedure consent templates exist, and on which plan. (4) Product retail inventory: covered only through the pharmacy and inventory module (Enterprise, or a module on Professional and Premium); confirm how a skincare product sold at the desk is billed and deducted, and the module price. Procedure and laser session tracking and cosmetic package billing (Premium) are included.'
  - 'Other spec 5.15 template items left out for lack of facts: named and countable dermatology, aesthetic and cosmetology templates (the live comparison tables say only "Dermatology consultation templates", "Aesthetic procedure templates" and "Cosmetic procedure templates: Yes", so there is no dataTable); a timed walkthrough of the most common visit; devices and integrations (dermatoscope, clinic camera or photo capture from a phone); which note types Cura AI drafts for a skin visit, with an example; which plan carries image storage, procedure tracking and resource booking (the live pages tie them to no plan, so those rows carry no plan badge and the intro claims nothing about unbadged rows).'
  - 'Dropped from the live pages: both competitor comparison tables (unsourced "Other EMR" cells); "secure, HIPAA-compliant platform" (compliance status unknown); "prescriptions in 30 seconds", "three clicks", "invoices ready in less than 10 seconds" and "over 100 graphical dashboards" (unmeasured here); "Reduces no-shows" (no measured figure); AI diagnostic support and ADR alerts (CuraPilot claims), AI two-way messaging and AI wait-time alerts; patient self check-in and phone intake forms (patient portal and app is Enterprise in plans.yaml; plan unclear); "Multi Session Booking" (tag only, and removed from /features/appointment-scheduling/ in its fact check); inventory "Built-in" (plans.yaml puts it in Enterprise or a module); the "14-Day Free Trial, with an extra 30-Day Money Back Guarantee" and "try Easy Clinic absolutely free" lines (owner decision: no free trial); the four testimonials (a psychiatrist, a general physician and an ophthalmologist, none from a skin clinic); the cosmetology page''s "Problems We Solve" block ("leads to stockouts", "double-bookings") and "secure, cloud-based" answer; the data warehouse, Power BI and HR, roster and incentive sections (not specialty-specific).'
  - 'Hair care and trichology: /trichology-emr/ and /trichology/ resolve on the live site to the blog post /trichology-clinic-management-software/ (4 December 2025), and /trichology-emr-software/ returns 404. The blog was read and nothing is used from it: its AI grouping of scalp images, density and progression scoring, predictive analytics, AI billing checks, template-based trichoscopy reports, ABHA and NDHM wording and the unnamed case-study figures (30 and 40 per cent) have no plain product statement behind them. Hair care appears only as an example image in the photographs row and one FAQ built from the general image, package and form-builder facts. Company to confirm any trichology-specific screens before a hair section is added.'
  - 'Screenshots left out (no heroMedia or media on published pages). When the seeded demo tenant exists: before-and-after photographs on a patient record as hero, a procedure session record, and a laser package bill with part payments.'
  - 'Title 36 characters; meta description 148 characters (no tokens). H1 follows the spec 5.15 item 1 pattern with two items rather than three (spec 6.2, no groups of three); spec 4.3 gives "EMR for dermatology and skin clinics". The four pains and their details (March, six sessions, 11am, Saturday, eight months) are illustrative skin-clinic situations, not customers.'
