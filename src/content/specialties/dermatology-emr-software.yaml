  - The editorial pass recorded here is an AI review. A human editor still needs to read the page aloud and answer the two spec 6.5 questions; with no named person and no measured number, the page meets only two of the four spec 6.5 pass marks (a local fact in the rupee price, and admissions of limits in the inventory and offline FAQs) until the testimonial arrives.
  - 'Fact-check pass 2026-09-26 (live /dermatology-emr-software/, /aesthetic-emr-software/, /cosmetology-emr-software/ and /features/ re-fetched; trichology URLs re-checked): opener no longer claims what a general EMR leaves out (unsourced competitor claim); the resource-booking fix no longer says the calendar shows each resource''s bookings or that the desk sees the clash ("Multi-Resource Calendar" is a tag with no description), only that the laser is booked inside the appointment slot; "customisable intake forms" bullet removed (could be read as the Premium own-forms feature; live says only detailed or concise history); teleconsultations removed from the unbadged booking row (Premium in plans.yaml) and the list of three cut; "pharmacy counter can serve a patient who has not seen the doctor today" narrowed to the live refill-collection wording, and the tax bullet moved to the billing wording only; day 3 training body cut to the session name; the two overlapping package FAQs merged, and a photo-access FAQ added from the live access-control lines and the reception-licence rule (it does not claim anything about image permissions specifically); a short aesthetic and cosmetology prose section added so visitors from the redirected pages find their clinic named, built only from facts already on the page. Hair care stays in one FAQ and one example, as the grounding allows no more. Groups of three removed from the eyebrow, the stock row, the stock FAQ, the related-link description and the video row.'
