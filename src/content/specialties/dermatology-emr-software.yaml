sections:
  - discriminant: painBlocks
    value:
      id: where-a-skin-clinic-loses-track
      heading: Where a skin clinic loses track
      intro: >-
        Skin treatment is slow. A patient comes back over weeks or months, and most of what goes missing
        is something from an earlier visit that the doctor needs today.
      items:
        - heading: The before photo is on the doctor's phone
          body: >-
            The before photos of a pigmentation patient were taken on the doctor's own phone in March. At
            the fourth peel the patient says nothing has changed, and the doctor scrolls through a camera
            roll of family pictures looking for the right face on the right day.
          fix: >-
            Before-and-after images are captured and stored as part of the patient's treatment record, so
            the doctor opens the earlier photographs and compares them on screen while the patient is in
            the chair.
          href: /features/emr/
          linkLabel: Read how the chart works
        - heading: The laser package is paid in parts
          body: >-
            A patient buys six sessions of laser hair reduction, pays an advance at the first sitting and
            the rest over the next two visits. The receipts sit in the book under different dates, and when
            she stops after session four and asks what she is owed, the desk starts adding by hand.
          fix: >-
            On Premium the course is billed as one package treatment, with the payment spread over the
            sessions and every advance or part payment recorded against it. The desk sees the balance on
            the bill, and a refund goes through only with authorisation.
          href: /features/billing/
          linkLabel: Read how billing works
        - heading: One laser, two doctors at 11am
          body: >-
            The clinic has one laser machine and two doctors who use it, and who has it at 11am is kept in
            the receptionist's head. On a Saturday when she is off, the desk books a laser patient for each
            doctor at 11am, and the clash shows up when the second patient is already waiting in a gown.
          fix: >-
            Equipment such as the laser, and the assistant who runs it, are booked inside the appointment
            slot, so the 11am laser booking is written into the first patient's appointment rather than
            kept in the receptionist's head.
          href: /features/appointment-scheduling/
          linkLabel: Read how booking works
        - heading: The signed consent is in a folder at the desk
          body: >-
            Before a chemical peel the patient signs a paper consent form, and it goes into a folder at the
            front desk. Eight months later she comes back unhappy with the result, and nobody can say which
            folder the form went into.
          fix: >-
            Consent documentation is stored in the patient's record in Easy Clinic, so whoever opens the
            record finds it, and a form signed on paper can be scanned and uploaded there as a document.

  - discriminant: featureRows
    value:
      id: the-skin-record
      heading: Built around the dermatology record
      intro: >-
        A skin patient's record has to hold what the doctor saw at each visit as well as what was done.
        Rows marked Premium come with Premium, Easy Clinic's plan for specialists, and are not on
        Professional.
      items:
        - heading: Before-and-after photographs on the treatment record
          body: >-
            Capture and store before-and-after images of each treatment as part of the patient's record,
            whether it is acne scarring or a thinning crown, and compare them at the follow-up to see how
            the patient has responded. Scanned reports and other documents are uploaded to the same record.
          bullets:
            - Before-and-after images stored on the patient's record
            - Documents and scanned reports uploaded beside them
        - heading: Skin type, allergies and past treatments
          body: >-
            The patient's profile holds skin type, allergies, medical history, past treatments and
            lifestyle habits, so the doctor sees an earlier procedure or an allergy before planning the
            next one. The medical history can be taken in detail or briefly, and it appears on the
            patient's facesheet at the follow-up.
          bullets:
            - Past treatments and allergies on the patient's profile
            - The complete visit history on a single screen
        - heading: Procedures and laser sessions, visit by visit
          body: >-
            Track past and ongoing cosmetic procedures, such as Botox, fillers, chemical peels and laser
            treatments, across the several sessions and follow-ups a skin treatment usually takes. Each
            session is written on the same record, so a colleague seeing the patient next knows what has
            been done.
        - heading: Consent kept on the patient's record
          body: >-
            Consent documentation for a procedure is stored in the patient's record. If your consent forms
            are on paper, the signed form can be scanned and uploaded to the record as a document.
        - heading: Specialty templates and your own forms
          plan: premium
          body: >-
            On Premium the chart comes with specialty EMR templates, and your clinic can have its own
            clinical forms and print layouts. The form builder turns a paper form you already use, such as
            a procedure sheet, into a digital form the doctor fills in on the record.
        - heading: Cura AI drafts the note
          body: >-
            Cura AI drafts the visit note for the doctor to check and confirm. The note drafting, listed on
            the plans as Cura AI (documentation), comes with every plan, Professional included.
          link:
            label: Read what Cura AI does
            href: /ai/

  - discriminant: featureRows
    value:
      id: procedures-and-packages
      heading: Procedure days, packages and product stock
      intro: >-
        Much of a skin clinic's day is procedures: sessions booked against a machine, and courses sold as
        packages and paid over weeks.
      tone: wash
      items:
        - heading: The laser booked with the appointment
          body: >-
            Equipment such as a laser, and the assistant who runs it, are booked inside the appointment
            slot, so the procedure and the machine it needs are booked together. Booked appointments and
            walk-ins sit on the same calendar, and reminders go out automatically by SMS and email on every
            plan, with WhatsApp added on Premium.
          link:
            label: Read how booking works
            href: /features/appointment-scheduling/
        - heading: Packages for a course of treatment
          plan: premium
          body: >-
            On Premium a course of laser or peel sessions is billed as one package treatment, and the
            payment is spread over the course. Advances and part payments are recorded against the package,
            and refunds and discounts go through only with authorisation.
          bullets:
            - Part payments and advances recorded against the package
            - Taxable and non-taxable items, with the tax you define applied
            - Refunds and discounts only with authorisation
            - Receipts and invoices sent to the patient on WhatsApp
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Creams and injectables in stock
          body: >-
            With pharmacy and inventory, which comes with Enterprise or as a module on Professional and
            Premium, the clinic keeps its creams, injectables, skincare products and supplies in stock beside
            its medicines. Each batch is tracked to its expiry date, and a consumable that is part of a
            service or a package comes off the stock count with that service.
          bullets:
            - A patient collecting a refill of a cream skips the appointment queue
            - Over-the-counter products added at the time of dispensing
          link:
            label: Read how pharmacy and inventory work
            href: /features/pharmacy-and-inventory/
        - heading: Video follow-ups
          plan: premium
          body: >-
            On Premium a follow-up can be a video consultation booked through the appointment screen, with
            the fee collected online at booking. The doctor and the patient join from a web browser on a
            computer or a phone, and the prescription reaches the patient by message or email with a note
            that the consultation was remote.
          link:
            label: Read how teleconsultations work
            href: /features/telehealth/

  - discriminant: prose
    value:
      id: aesthetic-and-cosmetology-clinics
      heading: Aesthetic and cosmetology clinics
      body: >-
        An aesthetic or cosmetology clinic works on the same record as a dermatology practice. Each Botox,
        filler, peel or laser session is tracked on it beside the before-and-after photographs, and the
        client's profile keeps skin type and allergies next to past treatments and lifestyle habits.


        Consent documentation for a procedure is stored on that record. Injectables and the skincare
        products the clinic uses are kept in stock with the pharmacy and inventory module, and a course sold
        as a package is billed on Premium, with the payment spread over the sessions.

  - discriminant: proofBlock
    value:
      id: ratings
      heading: How clinics rate Easy Clinic
      intro: >-
        We do not yet have a dermatologist's own words to put on this page. These are Easy Clinic's public
        ratings, from clinics of every kind.
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'

  - discriminant: stepList
    value:
      id: training
      heading: How long does it take to learn Easy Clinic?
      intro: >-
        About two hours, spread over {fact:trainingDays} days, and training is included in every plan. Each
        session is 20 to 40 minutes, short enough to fit between the morning consultations and the
        afternoon procedures, so the clinic keeps seeing patients while the team learns.
      steps:
        - title: 'Day 1: basic training'
          meta: 40 minutes
          body: >-
            The screens the front desk and the doctors use every day. Bring your receptionist, whose login
            is part of the plan.
        - title: 'Day 2: EMR scenario training'
          meta: 40 minutes
          body: >-
            You work through the chart on the kinds of case your clinic sees, from a first skin
            consultation to a procedure follow-up.
        - title: 'Day 3: practice exercises'
          meta: 20 minutes
          body: You repeat what the first two sessions covered, so the first real patient is not your first attempt.
        - title: 'Day 4: road to expertise'
          meta: 20 minutes
          body: The shortcuts that make each note quicker, once the basics have become habit.
      note: >-
        From the demo, a clinic can be live in as little as {fact:goLiveDays} days.

faqHeading: Questions dermatology clinic owners ask
faq:
  - question: What does Easy Clinic cost for a dermatology or aesthetic clinic?
    answer: >-
      Premium, the plan with specialty templates and package treatments, costs {price:inr.premium.annual}
      per doctor per month billed annually in India, or {price:usd.premium.annual} in US dollars.
      Professional, at {price:inr.professional.annual} or {price:usd.professional.annual}, has the chart and
      billing but no package treatments and no WhatsApp messages. Both include a reception login, with no
      setup fee and no binding contract, and pharmacy and inventory is an extra module on either.
  - question: Can I keep before-and-after photos on the patient's record?
    answer: >-
      Yes, before-and-after images are captured and stored as part of the patient's treatment record, so
      the doctor can compare them at each follow-up. Scanned documents, such as an earlier prescription or
      a signed consent form, are uploaded to the same record.
  - question: Can Easy Clinic track a laser course that the patient pays for in parts?
    answer: >-
      Yes, laser treatments, chemical peels, Botox and fillers are tracked across the sessions and
      follow-ups a course takes, and on Premium the course is billed as one package with each advance or
      part payment recorded against it. The desk sees the balance on the bill, a refund goes through only
      with authorisation, and Professional does not include package treatments.
  - question: Who at the clinic can see a patient's photographs?
    answer: >-
      The staff you allow to: access in Easy Clinic is set by role and department, and the reception login
      included in the price cannot use the EMR or issue prescriptions. Access rights and audit logs are kept
      for each user.
  - question: Where do signed consent forms go?
    answer: >-
      Consent documentation is stored in the patient's record, so it is found by opening the patient
      rather than by searching a folder at the desk. A form signed on paper can be scanned and uploaded to
      the record as a document.
  - question: Does Easy Clinic manage stock of creams and injectables?
    answer: >-
      Yes, but not on Premium alone: pharmacy and inventory is included in Enterprise, or added to
      Professional and Premium as a module. With it, each batch is tracked to its expiry date, and a
      consumable used in a service or a package comes off the stock count with that service.
  - question: Does Easy Clinic work for a hair and trichology clinic?
    answer: >-
      Yes, with the same tools a skin clinic uses: scalp photographs stored as before-and-after images on
      the patient's record, and a course of hair treatment sessions billed as one package on Premium. If
      your clinic has its own scalp assessment sheet, Premium lets you rebuild it as a digital form with
      the form builder.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      No, Easy Clinic does not run fully offline today: the cloud version needs an internet connection, so
      the clinic needs a working line while it sees patients. A self-hosted option also exists, where the
      system runs on the clinic's own server rather than in Easy Clinic's cloud.

