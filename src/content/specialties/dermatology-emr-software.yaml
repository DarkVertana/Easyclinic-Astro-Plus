  A skin or aesthetic clinic needs before-and-after photos on the patient's record and a course of laser
  or peel sessions billed as one package. Easy Clinic stores the photos and each session on the record, and
  Premium adds packages and specialty templates for {price:inr.premium.annual} per doctor per month in
  India or {price:usd.premium.annual}, billed annually.
