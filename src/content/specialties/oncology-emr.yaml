editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-11-05
  onlyUsCouldWrite: >-
    The plan split an oncology centre actually meets (package treatments and lab reports in the chart on
    Premium, its own lab and pharmacy on Enterprise or as modules) and the regimen and cycle records come
    from Easy Clinic's own oncology page and plans.yaml; the only local fact is the rupee price.
  readsMachineWritten: >-
    The four pains are composites rather than a named clinic's day, and the page has no oncologist's
    words, no screenshot of a cycle record and no timed visit, so an oncologist will notice that there is no
    regimen library, dose calculation, staging form or tumour board described.

