sections:
  - discriminant: painBlocks
    value:
      id: where-an-oncology-clinic-loses-track
      heading: Where an oncology clinic loses track
      intro: >-
        A cancer patient's treatment runs in cycles over months, and the follow-up<br class="hidden md:inline">
        runs for years after. Most of what goes missing sits between the cycles.
      items:
        - heading: Which cycle is this?
          body: >-
            A patient on her fourth cycle arrives with a caregiver and a carry bag of papers. The plan was
            written at the first visit, a dose was changed after the second, and the notes of both are in
            different files.
          fix: >-
            The chemotherapy plan sits on the patient's record, and each cycle is recorded against it with
            the notes of that visit, so the history of the treatment opens on one screen.
        - heading: The count before the cycle is on a lab printout
          body: >-
            Before each cycle the blood count decides whether the patient goes ahead today. The report is
            from a lab near the patient's home, and the last three counts are on three printouts.
          fix: >-
            On Premium, lab reports come into the chart and each value is drawn as a trend, so the
            neutrophils and the haemoglobin read as one line across cycles. An outside lab's report is
            uploaded to the same record.
        - heading: The PET-CT report from another city
          body: >-
            Staging scans and the biopsy report were done at a hospital the family travelled to. Months
            later, at a review, nobody can find the original report.
          fix: >-
            Imaging reports, pathology reports and other diagnostic records are uploaded to the patient's
            file as documents or images, and stay beside the visits for the years of follow-up.
        - heading: The course is paid in parts, and the balance lives in a notebook
          body: >-
            A course of chemotherapy is quoted as one package and paid as the cycles go. The accounts desk
            keeps the balance by hand, and when a cycle is postponed nobody is sure what is owed.
          fix: >-
            On Premium the course is billed as one package treatment, and each advance and part payment is
            recorded against it. A refund or a voided invoice goes through only with authorisation.

  - discriminant: featureRows
    value:
      id: oncology-chart
      heading: Built around the oncology chart
      intro: >-
        What an oncologist reopens at every cycle and every review, kept on one patient record. Premium, the
        plan for specialists, includes everything below.
      layout: grid
      items:
        - heading: The treatment plan and its cycles
          icon: clipboard-list
          body: >-
            The chemotherapy regimen and the treatment plan are recorded on the patient's record, and each
            cycle is recorded against them with that day's notes, medicines and investigations. Past visits
            open side by side with today's.
          bullets:
            - Chemotherapy regimen and treatment plan on the record
            - Each cycle recorded with that day's notes and medicines
        - heading: Blood counts and other labs as trends
          icon: chart-line
          body: >-
            On Premium, lab reports come into the chart with abnormal values flagged, and each value can be
            charted across the results on file, so the count before this cycle sits beside the last ones.
          bullets:
            - Lab reports in the chart with abnormal values flagged
            - This cycle's count charted beside the last ones
        - heading: Scans and pathology reports in the file
          icon: scan-line
          body: >-
            Lab results, imaging reports and other diagnostic records are stored in the patient's file,
            uploaded as documents or images, so a staging scan from another hospital stays with the record.
          bullets:
            - Lab results and imaging reports stored in the file
            - A staging scan from another hospital stays on record
        - heading: The history on the facesheet
          icon: file-heart
          body: >-
            The intake form records chronic conditions, family history, social history, obstetric and
            gynaecological history and substance use. It shows on the facesheet, and an auto-generated
            summary puts the last visit on one screen.
          bullets:
            - Chronic conditions, family and social history at intake
            - An auto-generated summary puts the last visit on one screen
        - heading: Several doctors, one record
          icon: users
          body: >-
            The medical oncologist, the surgeon and the nurses work on the same patient record, with
            collaborative case notes. Each person logs in as themselves, and the role on that login decides
            which screens they can open.
          bullets:
            - Oncologist, surgeon and nurses on the same record
            - A role on each login decides which screens open
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) is included in every plan. It drafts the note for the oncologist to
            review.
          bullets:
            - Cura AI is included in every plan
            - The oncologist reviews every draft note

  - discriminant: featureRows
    value:
      id: cycle-visit
      heading: A chemotherapy cycle, from the count to the bill
      intro: >-
        How a cycle visit runs on Easy Clinic in a clinic or a hospital OPD. We have not timed these steps
        in an oncology clinic, so the page gives no minutes for them.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: The count is on the chart before the patient sits down
          icon: flask-conical
          body: >-
            The blood count done for this cycle is in the chart on Premium, or uploaded from an outside lab.
            If the clinic runs its own lab, the test is ordered from the chart and the sample tracked by
            barcode, which is lab management: Enterprise, or an add-on on Professional and Premium.
          link:
            label: Read how lab management works
            href: /features/lab/
        - heading: The nurse does the intake
          icon: activity
          body: >-
            A nurse or clinical assistant does the intake before the consult. The reception login included
            in the price cannot open the EMR or issue a prescription.
        - heading: The day-care chair is booked in the slot
          icon: calendar-clock
          body: >-
            The chair and the nurse who runs the infusion are booked inside the appointment slot, and the
            multi-resource calendar shows the desk which chairs are free at each hour.
          link:
            label: Read how booking works
            href: /features/appointment-scheduling/
        - heading: The consult and the prescription
          icon: pill
          body: >-
            Notes, diagnosis, medications, investigations, referrals and follow-ups are picked with
            auto-complete, with a drug interaction check on the prescription. It is printed or, on Premium,
            sent on WhatsApp, with patient education material for the family to take home.
        - heading: The cycle goes on the package bill
          icon: receipt
          plan: premium
          body: >-
            On Premium, the cycle is recorded on the package treatment, the payment made today goes against
            it, and the desk sees the balance before taking the next one.
        - heading: Reviews by video
          icon: video
          plan: premium
          body: >-
            On Premium, a follow-up review can be a video consult, booked through the appointment screen with
            the fee paid online, so a family that lives far away does not travel for it. The prescription
            carries a line saying the consult was held remotely.
          link:
            label: Read how video consults work
            href: /features/telemedicine/

