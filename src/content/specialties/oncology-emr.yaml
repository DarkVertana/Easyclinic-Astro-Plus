faqHeading: "You Have Questions, We Have Answers"
faq:
  - question: "What is the best EMR software for oncology clinics?"
    answer: "The best EMR software for oncology clinics should support chemotherapy tracking, diagnostic reports, treatment protocols, and long-term patient care. Easy Clinic is designed to manage the complete workflow of oncology clinics."
  - question: "Does Easy Clinic support AI EMR for oncology clinics?"
    answer: "Yes. Easy Clinic includes AI EMR Software that helps doctors write notes faster and reduces manual documentation."
  - question: "Can Easy Clinic track chemotherapy and treatment protocols?"
    answer: "Yes. Easy Clinic allows clinics to manage chemotherapy cycles and treatment plans."
  - question: "Does Easy Clinic store diagnostic and lab reports?"
    answer: "Yes. Clinics can store lab results, imaging reports, and other diagnostic data in patient records."
  - question: "Can Easy Clinic support long-term cancer patient tracking?"
    answer: "Yes. Easy Clinic supports continuous monitoring and follow-up tracking for cancer patients."
  - question: "Does Easy Clinic support multi-doctor coordination?"
    answer: "Yes. Oncology care often involves multiple specialists, and Easy Clinic supports collaborative workflows."
  - question: "Does Easy Clinic support billing for oncology services?"
    answer: "Yes. Billing, invoicing, and payment tracking are included."
  - question: "Can Easy Clinic manage inventory for oncology medicines?"
    answer: "Yes. Inventory management is included for medicines and clinic supplies."
  - question: "Is Easy Clinic suitable for both small and large oncology clinics?"
    answer: "Yes. Easy Clinic works for standalone clinics as well as multi-speciality centres."
  - question: "Is Easy Clinic cloud-based?"
    answer: "Yes. Easy Clinic is fully cloud-based and accessible from anywhere."
  - question: "Does Easy Clinic provide reports for clinic performance?"
    answer: "Yes. Easy Clinic provides analytics to track patient outcomes, treatments, and revenue."

