faqHeading: "You Have Questions, We Have Answers"
faq:
  - question: Which Easy Clinic plan does a haematology clinic need, and what does it cost?
    answer: >-
      Premium, because lab reports in the chart come with it: {price:inr.premium.annual} per doctor per month
      billed annually in India or {price:inr.premium.quarterly} billed quarterly, and
      {price:usd.premium.annual} or {price:usd.premium.quarterly} in US dollars. Professional, at
      {price:inr.professional.annual} or {price:usd.professional.annual}, has the EMR and billing but not lab
      reports in the chart. Both include a reception login, with no setup fee and no binding contract.
  - question: Can I see a patient's haemoglobin across visits on one chart?
    answer: >-
      Yes, on Premium: lab reports come into the chart, and each value of a blood count can be drawn as a
      trend across the results on file, with abnormal values flagged. A report from an outside lab can be
      uploaded to the patient's file as well.
  - question: We run our own lab. Does Easy Clinic manage it?
    answer: >-
      Yes, with lab management: tests are ordered from the chart, samples are tracked by barcode or QR code,
      and the result comes back into the patient's record. Lab management comes with Enterprise or as an
      add-on on Professional and Premium.
  - question: Can Easy Clinic connect to our haematology analyser?
    answer: >-
      Not out of the box: a connection to a lab analyser is integration work, scoped for your machines as a
      project. It comes with Enterprise or as an add-on on Professional and Premium, and which analysers can
      be connected is worked out in that scoping.
  - question: How do patients on long-term follow-up get reminded to come back?
    answer: >-
      The haematologist sets the follow-up in the note, and the patient gets an automated reminder by SMS
      and email on every plan, or by WhatsApp on Premium. Every visit and every result stays on the same
      record, so the history since the first consult is on one screen.
  - question: Does Easy Clinic run the pharmacy and the stock at our centre?
    answer: >-
      Yes, but not on Premium alone: pharmacy and inventory are included in Enterprise, or added to
      Professional and Premium as a module. With the module, the pharmacist dispenses from the doctor's
      prescription and tracks each batch to its expiry date.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      No, Easy Clinic does not run fully offline today: the cloud version needs an internet connection, so
      the clinic needs a working line while it sees patients. A self-hosted option also exists, where the
      system runs on the clinic's own server rather than in Easy Clinic's cloud.

