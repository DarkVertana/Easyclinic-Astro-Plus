# "haematology". No spec 4.3 keyword row and no spec 5.15 must-have row exist for haematology. The live page
# redirects in a loop (checked 2026-11-05), so grounding is the repo only: plans.yaml, facts.yaml, the
# published /features/lab/, /features/emr/ and /features/telemedicine/ pages, the capabilities every published
# specialty page states, and the CBC screenshot already used on the solution pages. No haematology template
# names, analyser connections, transfusion or chelation modules, or outcomes.
