sections:
  - discriminant: painBlocks
    value:
      id: where-a-haematology-clinic-loses-track
      heading: Where a haematology clinic loses track
      intro: >-
        Haematology patients come back for years, often every few weeks, and almost every visit<br class="hidden md:inline">
        turns on a number. Most of what goes missing is the run of those numbers between visits.
      items:
        - heading: Eight blood counts, on eight sheets of paper
          body: >-
            A patient with thalassaemia brings a file of blood counts from three labs. To see whether the
            haemoglobin has held since the last change, you lay the sheets out on the desk and read the
            values across them while the patient waits.
          fix: >-
            On Premium, lab reports come into the chart and the values are drawn as a trend across visits,
            so the haemoglobin reads as one line. A report from an outside lab is uploaded to the same
            record as a file.
        - heading: The abnormal value is on page two
          body: >-
            The platelet count that needs a call today sits halfway down a printed report, among values
            that are normal. It is found at the follow-up, not on the day the result came back.
          fix: >-
            When the result comes into the patient's record, abnormal values are flagged on the chart the
            doctor already has open, as the lab page describes.
        - heading: The next count is due, and nobody has booked it
          body: >-
            "Repeat CBC in four weeks" is written at the foot of the prescription. The patient feels well,
            forgets the date, and comes back pale two months later.
          fix: >-
            The follow-up is set in the note before the patient leaves, and the patient gets an automated
            reminder: by SMS and email on every plan, and on WhatsApp on Premium.
        - heading: The day-care chair is booked twice
          body: >-
            Two haematologists each send a patient for an infusion at the same hour, and the clinic has one
            day-care chair and one nurse to run it. The clash shows up when both patients arrive.
          fix: >-
            Equipment and assistants are booked inside the appointment slot, and the multi-resource
            calendar shows the desk that the chair is already taken at that hour.

  - discriminant: featureRows
    value:
      id: haematology-chart
      heading: Built around the haematology chart
      intro: >-
        What a haematologist reopens at every review, kept on one patient record. Premium, the plan for
        specialists, includes everything below.
      layout: grid
      items:
        - heading: Blood counts as trend charts
          icon: chart-line
          body: >-
            On Premium, lab reports come into the patient's chart, and each value of a Complete Blood
            Count, haemoglobin, red cell count, MCV and the rest, can be drawn as a chart across the
            results on file. The trend is one look instead of a pile of reports.
          bullets:
            - On Premium, lab reports come into the patient's chart
            - Haemoglobin, red cell count and MCV charted across results
        - heading: Outside lab reports in the same file
          icon: file-text
          body: >-
            Many patients have their counts done at a lab near home. Those reports, and bone marrow,
            imaging and other diagnostic reports, are uploaded to the patient's record as documents or
            images, so they sit beside the visits and the results from your own lab.
          bullets:
            - Counts from a lab near home uploaded to the record
            - Bone marrow and imaging reports beside your own results
        - heading: The history on the facesheet
          icon: file-heart
          body: >-
            The intake form records chronic illnesses, family history, social history and substance use,
            with as much detail as the clinic wants. What it records shows on the patient's facesheet, with
            the allergies and past procedures, and an auto-generated summary of the last visit puts the key
            data on one screen before each review.
          bullets:
            - Allergies and past procedures shown on the facesheet
            - A last visit summary on one screen before each review
        - heading: A drug interaction check when you prescribe
          icon: pill
          body: >-
            A haematology patient is often on several long-term medicines, and the dose changes at many
            reviews. Easy Clinic's EMR includes a drug interaction check on the prescription.
          bullets:
            - A drug interaction check on the prescription
            - Several long-term medicines, with doses changed at reviews
        - heading: Your own forms for the sheets you keep on paper
          icon: layout-template
          body: >-
            If the clinic keeps a paper sheet for a long-running course, a transfusion record for example,
            the form builder on Premium turns it into a digital form in your own layout, and the
            customisation carries no charge.
          bullets:
            - A paper transfusion record turned into a digital form
            - Form builder on Premium, with no charge to customise
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) is included in every plan. It drafts the note for the haematologist to
            review.
          bullets:
            - Cura AI is included in every plan
            - The haematologist reviews every draft note

  - discriminant: featureRows
    value:
      id: review-visit
      heading: A haematology review, from the sample to the bill
      intro: >-
        How a review visit runs on Easy Clinic in a clinic or a hospital OPD. We have not timed these steps
        in a haematology clinic, so the page gives no minutes for them.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: The sample, in your own lab or an outside one
          icon: flask-conical
          body: >-
            If the clinic runs its own lab, the test is ordered from the chart and the sample is tracked by
            barcode or QR code to the result. That is lab management, which comes with Enterprise or as an
            add-on on Professional and Premium. A count from an outside lab is uploaded to the record.
          link:
            label: Read how lab management works
            href: /features/lab/
        - heading: The nurse records the vitals first
          icon: activity
          body: >-
            A nurse or clinical assistant does the intake before the consult. Each person logs in as
            themselves, and the role on that login decides which screens they can open; the reception
            login included in the price cannot open the EMR or issue a prescription.
        - heading: The consult, by point and click
          icon: notebook-pen
          body: >-
            The haematologist opens the record with the latest count already charted. Notes, diagnosis,
            medications, investigations, referrals and follow-ups are picked with auto-complete instead of
            typed out, and the follow-up date is set before the patient leaves.
        - heading: The prescription goes home on paper or on WhatsApp
          icon: pill
          body: >-
            The prescription is printed for the patient or, on Premium, sent on WhatsApp, and on Premium
            the lab report can go to the patient's phone the same way.
        - heading: A course of treatment billed as a package
          icon: receipt
          plan: premium
          body: >-
            On Premium, a course of care the clinic sells as a package is billed as one package treatment
            and paid in parts. Each advance and part payment is recorded against it, and a refund or a
            voided invoice goes through only with authorisation.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Reviews by video
          icon: video
          plan: premium
          body: >-
            On Premium, a review where the patient has had the count done near home can be a video consult,
            booked through the appointment screen with the fee paid online. The prescription carries a line
            saying the consult was held remotely.
          link:
            label: Read how video consults work
            href: /features/telemedicine/

