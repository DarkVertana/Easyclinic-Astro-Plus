editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-11-05
  onlyUsCouldWrite: >-
    A haematologist customer since 2008, the CBC trend from Easy Clinic's own screens, and
    the plan split a haematology centre actually meets (lab reports in the chart on Premium, its own lab and
    pharmacy on Enterprise or as modules) come from Easy Clinic's data, not from a generic EMR page.
  readsMachineWritten: >-
    The four pains are composites rather than a named clinic's day, the page names no haematology template
    because the live page could not be read, and a haematologist will notice that transfusion records,
    chelation and anticoagulation tracking are not described as built-in screens.

