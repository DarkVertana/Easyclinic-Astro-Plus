sections:
  - discriminant: painBlocks
    value:
      id: where-a-hair-clinic-loses-track
      heading: Where a hair clinic loses track
      intro: >-
        Hair treatment is judged over months, not visits, and most of what goes<br class="hidden md:inline">
        missing is the earlier picture the doctor needs to say whether today is better.
      items:
        - heading: Six months of scalp photos on four phones
          body: >-
            A patient with thinning at the crown is photographed at every review, on whichever phone is at hand.
            At the six-month review he says nothing has changed, and the doctor cannot find the first photograph
            to show him that it has.
          fix: >-
            Before-and-after images of the hair and scalp are stored on the patient's record and compared at the
            review, so the first photograph opens beside today's while he is in the chair.
        - heading: The scalp findings are written differently each time
          body: >-
            One visit says "diffuse thinning, mild scaling", the next says "hair fall better, some dandruff",
            in two doctors' handwriting. Nobody can tell from the file whether the scalp is improving.
          fix: >-
            Scalp issues such as dandruff, hair fall and psoriasis are recorded as symptoms on the record, and
            on Premium the chart has trichology consultation templates, or your own scalp assessment sheet
            rebuilt as a digital form, so each review is recorded the same way.
        - heading: The blood reports arrive on WhatsApp
          body: >-
            Hair fall often sends the doctor to the blood reports, and the patient sends photographs of his
            thyroid and iron results on WhatsApp. At the next review the doctor scrolls a chat to compare them
            with last year's.
          fix: >-
            Reports and documents are uploaded to the patient's record, and on Premium lab reports come into the
            chart with the values charted visit by visit, so this year's result sits beside last year's on one
            screen.
        - heading: Which session of the course is today
          body: >-
            A patient is booked for a course of scalp procedure sessions a month apart. On the fourth visit the
            desk is not sure whether it is session three or four, and the doctor is not sure what was done at
            the last one.
          fix: >-
            Each treatment session is tracked on the patient's record, so the doctor sees what was done at the
            last sitting. On Premium the course is billed as one package, with each advance or part payment
            recorded against it.

  - discriminant: featureRows
    value:
      id: the-hair-record
      heading: Built around the hair and scalp record
      intro: >-
        Trichology templates and blood reports in the chart come with Premium, Easy Clinic's plan for
        specialists, and are not on Professional. Product and medicine stock comes with Enterprise or as a
        module.
      layout: grid
      items:
        - heading: Scalp photographs compared over months
          icon: scan-eye
          body: >-
            Store before-and-after images of the hair and scalp on the patient's record and compare them to
            monitor progress, from the first consultation to the latest review. Scanned reports and other
            documents are uploaded to the same record.
          bullets:
            - Before-and-after images on the patient's record
            - Documents and reports uploaded beside them
        - heading: Scalp findings and symptoms
          icon: clipboard-list
          body: >-
            Record scalp issues such as dandruff, hair fall and psoriasis, and the scalp assessment at each
            visit. The intake form takes the medical history in detail or briefly, and it feeds the facesheet,
            so a thyroid condition or a recent illness is in view at the follow-up.
          bullets:
            - Scalp issues such as dandruff, hair fall and psoriasis
            - A thyroid condition in view at the follow-up
        - heading: Trichology templates and your own scalp sheet
          icon: layout-template
          body: >-
            On Premium the chart comes with trichology consultation templates, and the form builder turns a
            paper scalp assessment sheet you already use into a digital form, with your own print layout.
          bullets:
            - Trichology consultation templates on Premium
            - Your paper scalp sheet turned into a digital form
        - heading: Blood reports in the chart
          icon: chart-line
          body: >-
            On Premium, lab reports come into the patient's chart and the values can be charted visit by visit.
            Full lab management, with orders from the chart and sample tracking, comes with Enterprise or as a
            module.
          bullets:
            - Lab values charted visit by visit on Premium
            - Full lab management with Enterprise or as a module
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the consultation note for the doctor to
            review.
          bullets:
            - Cura AI comes with every plan
            - The doctor reviews every draft note

  - discriminant: featureRows
    value:
      id: sessions-and-follow-ups
      heading: Sessions, follow-ups and the products patients buy
      intro: >-
        A hair patient comes back for months, for reviews, for procedure sessions and for the products the
        doctor recommends.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: Sessions booked with what they need
          icon: calendar-clock
          body: >-
            The sessions of a course can be booked together, and the equipment or the assistant a procedure
            needs is booked inside the appointment slot. The follow-up set in the note sends the patient an
            automated reminder by SMS and email on every plan, and by WhatsApp on Premium.
          link:
            label: Read how booking works
            href: /features/appointment-scheduling/
        - heading: Courses billed as packages
          icon: receipt
          plan: premium
          body: >-
            On Premium a course of hair treatment sessions is billed as one package treatment, with the payment
            spread over the course. Advances and part payments are recorded against the package, and refunds go
            through only with authorisation.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Video reviews
          icon: video
          plan: premium
          body: >-
            On Premium a review can be a video consultation booked through the appointment screen, with the fee
            collected online at booking, and the prescription reaches the patient by WhatsApp, SMS or email with
            a note that the consultation was remote.
          link:
            label: Read how teleconsultations work
            href: /features/telemedicine/
        - heading: Hair products and medicines in stock
          icon: package
          plan: enterprise
          body: >-
            With pharmacy and inventory, which comes with Enterprise or as a module on Professional and
            Premium, the clinic keeps its hair products, medicines and supplies in stock, and each batch is
            tracked to its expiry date.
          link:
            label: Read how pharmacy and inventory work
            href: /features/pharmacy-and-inventory/

