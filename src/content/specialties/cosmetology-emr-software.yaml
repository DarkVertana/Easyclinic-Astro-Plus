        Collect detailed or concise medical histories customized to your needs, covering chronic illnesses, family and social history, obs-gynae details, substance use, alternative therapies, COVID history, and immunizations. All data integrates seamlessly into the patient’s face sheet for quick and easy follow-up reference.
