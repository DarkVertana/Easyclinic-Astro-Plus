sections:
  - discriminant: painBlocks
    value:
      id: where-a-cosmetology-clinic-loses-track
      heading: Where a cosmetology clinic loses track
      intro: >-
        A cosmetology clinic sees many clients for short services, with a doctor, therapists and a<br class="hidden lg:inline">
        busy desk, and what goes missing is usually something one of them knew and the others did not.
      items:
        - heading: The new therapist does not know about the last peel
          body: >-
            Last summer a client's skin reacted badly to a glycolic peel, and the doctor who saw her noted it in
            a paper file. This month she books a facial with a therapist who joined in the spring, and nothing at
            the station tells her what happened.
          fix: >-
            The client's profile holds skin type, allergies, medical history, past treatments and lifestyle
            habits, and every treatment she has had is tracked on the same record, so the reaction is on the
            screen the staff you allow to see it open before the next service.
        - heading: Three people quote three prices
          body: >-
            The price of a hydrafacial is on a laminated card at the desk, a different one on the clinic's
            Instagram, and the therapist gives a regular client a friendly discount nobody approved. At the end of
            the month the owner cannot tell what each service actually sold for.
          fix: >-
            Every service is billed from the clinic's own service list, with a price list per level where the
            clinic needs one, and a discount goes through only with authorisation. Prices can be changed without
            reissuing the bills already made.
        - heading: The sunscreen sold at the desk is not in the count
          body: >-
            The desk sells sunscreens, serums and the creams the doctor recommends, and the sales go into a
            notebook beside the till. The shelf runs out of the best seller on a Saturday, and the notebook says
            there should be twelve.
          fix: >-
            With the pharmacy and inventory module, products are added to the bill at the desk and come off the
            stock count, with each batch tracked to its expiry date and a low-stock flag on the stock list. The
            module comes with Enterprise, or is added to Professional or Premium.
        - heading: The client forgets her appointment
          body: >-
            Clients book a session two weeks ahead and forget, and the receptionist spends the morning phoning
            the day's list to confirm while the walk-ins wait.
          fix: >-
            Automated reminders go to the client by SMS and email on every plan, and by WhatsApp on Premium,
            where receipts and invoices can also be sent on WhatsApp after the visit.

  - discriminant: featureRows
    value:
      id: the-client-record
      heading: Built around the cosmetology client
      intro: >-
        Your own consultation and service forms come with Premium, Easy Clinic's plan for
        specialists, and are not on Professional. Product stock comes with Enterprise or as a
        module.
      layout: grid
      items:
        - heading: A profile that travels with the client
          icon: user-round
          body: >-
            Keep each client's skin type, allergies, medical history, past treatments and lifestyle habits on
            her profile, and track past and ongoing procedures, such as chemical peels, laser treatments, Botox
            and fillers, on the same record. Every visit, treatment and follow-up is recorded in one continuous
            client history.
          bullets:
            - Skin type, allergies and lifestyle habits on the profile
            - Every visit and treatment in one history
        - heading: Before-and-after photographs
          icon: scan-eye
          body: >-
            Capture and store before-and-after images as part of each client's treatment record, and compare
            them at the follow-up. Consent documentation for a procedure is stored in the same record.
          bullets:
            - Before-and-after images on each treatment record
            - Procedure consent stored on the same record
        - heading: Your own consultation and service forms
          icon: layout-template
          body: >-
            On Premium the chart comes with specialty templates, and the form builder turns a paper skin
            analysis or consultation sheet you already use into a digital form, with your own print layout.
          bullets:
            - Specialty templates on the chart with Premium
            - Your skin analysis sheet turned into a digital form
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the consultation note for the doctor to
            review.
          bullets:
            - Cura AI comes with every plan
            - The doctor reviews every draft note

  - discriminant: featureRows
    value:
      id: the-desk
      heading: The desk, the service menu and the shelf
      intro: >-
        Most of a cosmetology clinic's takings go through the front desk, as services, packages and products.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: One service list, one set of prices
          icon: receipt
          body: >-
            Bill every service from the clinic's own service list, with a multi-level price list where prices
            differ, and taxable and non-taxable items handled by the tax you define. Part payments, advance
            payments and refunds are handled at the desk, with refunds and discounts only with authorisation.
          bullets:
            - Prices adjusted without reissuing earlier bills
            - Discounts only with authorisation
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Packages of sessions
          icon: clipboard-list
          plan: premium
          body: >-
            On Premium a course of sessions is billed as one package treatment, with the payment spread over the
            course and each advance recorded against it.
        - heading: Products on the shelf, in stock
          icon: package
          plan: enterprise
          body: >-
            With pharmacy and inventory, which comes with Enterprise or as a module on Professional and Premium,
            the clinic keeps its creams, skincare products and supplies in stock. Over-the-counter products are
            added to the bill when they are sold, each batch is tracked to its expiry date, and a consumable used
            in a service comes off the count with that service.
          link:
            label: Read how pharmacy and inventory work
            href: /features/pharmacy-and-inventory/
        - heading: Reports on what the clinic sells
          icon: chart-column
          body: >-
            Reports and dashboards on every plan show the clinic's client visits, treatments and revenue, and
            they export to Excel or PDF. Each report is visible only to the users allowed to see it.
          link:
            label: Read how reports work
            href: /features/reports-and-dashboards/

