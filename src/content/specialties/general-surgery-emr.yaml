sections:
  - discriminant: painBlocks
    value:
      id: where-surgery-clinics-lose-track
      heading: Where a surgery clinic loses track
      intro: >-
        A surgical patient is seen before the operation, on the day and for weeks after it,<br class="hidden md:inline">
        and most of what goes missing falls between the outpatient clinic and the theatre.
      items:
        - heading: The pre-operative reports arrive in a plastic folder
          body: >-
            Before a gallbladder operation the patient is sent for blood tests, an ECG and a scan. The reports
            come back on paper from three places, and on the morning of surgery someone is looking for the
            fitness letter.
          fix: >-
            The investigations are ordered from the chart, and the reports are uploaded to the patient's record
            beside the pre-operative assessment, so the work-up is on one screen before the patient is listed.
        - heading: The discharge advice is a photocopied sheet
          body: >-
            The patient goes home with a printed sheet about wound care and is told to come back for the
            dressing. At night they call the surgeon's personal number to ask whether the swelling is normal.
          fix: >-
            Post-operative care instructions are written on the record, and the prescription with its
            guidelines goes to the patient by email, or on WhatsApp on Premium, so the advice is on the phone
            they call from.
        - heading: The stitch removal nobody booked
          body: >-
            The patient is told to come back in ten days, a date written only on the discharge sheet. The desk
            has no list of who is due, and the patient arrives on day fifteen or not at all.
          fix: >-
            The follow-up is set from the chart before the patient leaves, and an automated reminder goes out
            before the date. SMS and email reminders come with every plan, and Premium adds WhatsApp.
        - heading: The hernia package is tracked in a register
          body: >-
            A hernia repair is quoted as one package. The patient pays an advance when the date is fixed and the
            balance after the operation, and when the surgery is postponed nobody is sure what was paid.
          fix: >-
            On Premium the surgery is billed as one package treatment, with each advance and part payment
            recorded against it, and a refund goes through only with authorisation.

  - discriminant: featureRows
    value:
      id: surgical-record
      heading: Built around the surgical record
      intro: >-
        Surgical templates and package billing come with Premium, the plan most specialists choose. Easy
        Clinic runs the surgeon's outpatient side: the operating theatre's scheduling and records, and the
        wards, stay on the hospital's system.
      layout: grid
      items:
        - heading: Procedure documentation
          icon: clipboard-list
          body: >-
            Procedure documentation covers the pre-operative assessment, the consent form and the
            post-operative care instructions, and anaesthesia and procedure notes are recorded on the same
            patient record. The operation and every review after it are in one place.
          bullets:
            - Pre-operative assessment and consent form on the record
            - Anaesthesia notes and post-operative care instructions
        - heading: Surgical templates and your own forms
          icon: layout-template
          body: >-
            Premium includes Easy Clinic's specialty templates, and a paper pre-operative checklist or
            consultation sheet your clinic already uses can be rebuilt in the form builder. Your prescription
            and case sheet print in your own layout, with no charge for the customisation.
          bullets:
            - Easy Clinic's specialty templates included on Premium
            - Your paper pre-operative checklist rebuilt as a form
        - heading: Reports and images on the record
          icon: file-text
          body: >-
            Lab reports, ECGs, scan reports and wound photographs are uploaded to the patient's record as images
            and documents, and past records open side by side with today's visit.
          bullets:
            - Lab reports, ECGs, scans and wound photographs uploaded
            - Past records open side by side with today's visit
        - heading: Post-operative follow-up
          icon: calendar-clock
          body: >-
            The follow-up is set from the chart and tracked through recovery, with an automated reminder before
            each review. Referrals to another doctor are written from the chart and stay on the record.
          bullets:
            - Follow-up set from the chart and tracked through recovery
            - Referrals to another doctor stay on the record
        - heading: Surgery packages, paid in parts
          icon: wallet
          body: >-
            On Premium an operation is billed as one package treatment, and the payment can be spread over the
            course of treatment. Advances and part payments are recorded against the package, and a refund or a
            voided invoice goes through only with authorisation.
          bullets:
            - Advances and part payments recorded against the package
            - Refunds and voided invoices only with authorisation
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) comes with every plan. It drafts the note for the doctor to review.
          bullets:
            - Cura AI comes with every plan
            - The doctor reviews every draft note

  - discriminant: featureRows
    value:
      id: post-operative-review
      heading: A post-operative review, from the desk to the bill
      intro: >-
        The review after surgery is the visit a surgery clinic repeats most. We have not timed these steps in
        a surgery clinic, so the page gives no minutes for them.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: At the desk
          icon: calendar-clock
          body: >-
            The patient checks in, booked or walked in, and gets a token number for the queue. If the review
            needs a dressing room or an assistant, they are booked inside the appointment slot.
        - heading: In the consulting room
          icon: notebook-pen
          body: >-
            The surgeon opens the record with the procedure note and the pre-operative work-up already on it,
            writes the review by point and click, and uploads a photograph of the wound if one is needed. The
            prescription screen warns of a drug interaction as it is written.
        - heading: The next review
          icon: history
          body: >-
            The next follow-up date is set before the patient leaves, and the reminder goes to the patient
            automatically before it.
        - heading: At the bill
          icon: receipt
          body: >-
            The review is billed in one click, or recorded against the surgery package on Premium. Either way
            the balance shows straight away, and the receipt goes out by email, or on WhatsApp on Premium.

