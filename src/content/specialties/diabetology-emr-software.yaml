      narrowMedia: true
      stickyMedia: true
      alignTop: true
      body: |-
        ### Instant Prescription in 30 Seconds
        Effortlessly create detailed prescriptions within 30 seconds, harnessing the expertise of diabetes specialists, and deliver them instantly in any language via print, WhatsApp, SMS, or email.

        ### Diabetology-Specific EMR
        A fully tailored EMR designed to align with the unique needs of diabetes care, workflows, and preferences. Effortlessly create custom diabetes examination forms and capture details with a few simple clicks.

        ### AI-Powered Support
        Use an AI assistant to complete prescriptions in just three clicks, streamlining documentation and saving valuable time for diabetes care providers.

        ### Health Trend Visualisation
        Present vitals, lab results, and clinical parameters as intuitive charts and graphs for a clear and easy understanding of diabetic patients' health trends like foot examination, eye examination, etc.

        ### Effortless Blood Glucose Monitoring with Easy Clinic
        Track and manage blood glucose levels seamlessly with Easy Clinic's intuitive software. Enable real-time logging, trend analysis, and personalized insights to optimize diabetes care. Stay informed and in control with every reading.

        ### Diabetic Health Check Up Packages
        Manage your diabetes with ease through our tailored Amortization Plans and Multi-Visit Schedules. Spread your treatment costs over manageable installments while ensuring timely, complete care with pre-scheduled visits.

        ### Empower Patients with Easy Clinic’s Education Tools
        Enhance patient understanding with Easy Clinic’s interactive education modules. Provide tailored resources, lifestyle tips, and condition-specific guidance to support informed decision-making and better health outcomes.

        ### Streamlined Patient Summaries
        Gain quick access to auto-generated patient summaries and facesheets, enabling efficient case history reviews, saving time, and presenting critical data intelligently.

        ### Intuitive Point-and-Click Input
        Features a user-friendly point-and-click interface tailored for diabetes care providers to efficiently record chief complaints, medical history, vitals, and more. Includes custom examination forms, auto-complete notes, diagnosis, medications, investigations, referrals, follow-ups, and patient guidelines. Provides the flexibility to access specific controls without the need to navigate complex or lengthy screens.

        ### Complete Medical History Record
        Capture the full medical history of a diabetic patient using a customizable intake form, with the flexibility to include as much or as little detail as needed. Record information on chronic illnesses, family history, social and obstetric-gynecological history, substance use, alternative therapies, COVID history, and immunizations. These details are then incorporated into the patient's facesheet, streamlining future visits and saving valuable time.
