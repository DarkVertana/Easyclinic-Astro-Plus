sections:
  - discriminant: painBlocks
    value:
      id: where-a-diabetes-clinic-loses-track
      heading: Where a diabetes clinic loses track
      intro: >-
        A patient with diabetes is seen every few months for the rest of their life, and what goes missing is rarely today's<br class="hidden min-[90rem]:inline">
        reading. It is the run of readings, examinations and dose changes since the last time anyone looked at all of them together.
      items:
        - heading: The sugar diary and three lab reports, read one at a time
          body: >-
            A patient on insulin brings a notebook of fasting readings and HbA1c reports from two labs. To
            decide whether to raise the dose, you turn pages and hold six months of numbers in your head
            while the patient waits.
          fix: >-
            Blood glucose readings recorded at each visit are kept in the patient's case history and drawn
            as charts over time. On Premium, lab reports come into the chart, so HbA1c and other lab values
            are charted beside the vitals on one screen.
        - heading: Last year's foot examination is a tick on an old note
          body: >-
            The monofilament test was done last spring and the eye check the year before, each written as
            a line in that visit's note. Whether sensation in the left foot has changed since then is
            anyone's guess.
          fix: >-
            Foot examination and eye examination findings are recorded at each visit and shown as trends,
            and on Premium the clinic's own diabetes examination form is built with a few clicks, so every
            doctor records the same fields.
        - heading: The insulin plan lives on the last prescription
          body: >-
            The basal dose was changed twice since the patient's first visit, and the diet advice was given
            out loud. When the patient sees a colleague at the next review, the reasons for each change are
            not on the screen.
          fix: >-
            Medication and insulin plans are recorded and tracked on the patient's record, with every
            change kept against the visit it was made in, and the diet plan and lifestyle advice are
            written into the same record.
        - heading: The quarterly review the patient forgot
          body: >-
            "Review in three months, with fasting and HbA1c" is written at the foot of the prescription.
            The patient feels well, forgets the date and comes back eight months later.
          fix: >-
            The follow-up is set in the note before the patient leaves, and the patient gets an automated
            reminder: by SMS and email on every plan, and on WhatsApp on Premium.

  - discriminant: featureRows
    value:
      id: diabetes-chart
      heading: Built around the diabetes chart
      intro: >-
        What a diabetologist reopens at every review, kept on one patient record. Premium, the plan for
        specialists, includes everything below.
      layout: grid
      items:
        - heading: Sugar readings and lab values as trend charts
          icon: chart-line
          body: >-
            Vitals, lab results and clinical parameters are shown as charts and graphs, so a patient's
            blood glucose reads as one line across visits instead of a list of numbers in separate notes.
            On Premium, lab reports come into the chart and values such as HbA1c are charted beside the
            vitals. A report from an outside lab can be uploaded to the patient's file.
          bullets:
            - Blood glucose read as one line across visits
            - HbA1c charted beside the vitals on Premium
        - heading: Foot and eye examinations as trends
          icon: eye
          body: >-
            Diabetes care has its own examinations, and Easy Clinic keeps them as a trend. Foot examination
            and eye examination findings are charted across visits, so a change since last year is visible
            at the review.
          bullets:
            - Foot examination trends
            - Eye examination trends
        - heading: Your own diabetes examination form
          icon: notebook-pen
          body: >-
            On Premium the clinic builds its own diabetes examination form with a few clicks, or turns its
            paper sheet into a digital form with the form builder. Customising forms carries no charge.
          bullets:
            - Your paper sheet turned into a digital form on Premium
            - No charge for customising forms
        - heading: Insulin, medication and diet plans on the record
          icon: pill
          body: >-
            Medication and insulin plans are recorded and tracked over time, so each change in treatment
            sits against the visit it was made in. Diet plans and lifestyle recommendations are documented
            in the same record, and the prescription carries a drug interaction check.
          bullets:
            - Insulin and medication plans tracked over time
            - Diet plans and lifestyle advice on the same record
        - heading: The history and complications on the facesheet
          icon: clipboard-plus
          body: >-
            The intake form records chronic illnesses, family history, social history and substance use,
            with as much detail as the clinic wants. What it records is shown on the patient's facesheet,
            and an auto-generated summary puts the key data on one screen before each review.
          bullets:
            - Family history, social history and substance use recorded
            - An auto-generated summary before each review
        - heading: Cura AI drafts the note
          icon: sparkles
          body: >-
            Cura AI (documentation) is included in every plan. It drafts the note for the diabetologist to
            review.
          bullets:
            - Cura AI is included in every plan
            - The diabetologist reviews every draft note

  - discriminant: featureRows
    value:
      id: review-visit
      heading: A diabetes review, from the nurse's desk to the bill
      intro: >-
        How a review visit runs on Easy Clinic. We have not timed these steps in a diabetes clinic, so the
        page gives no minutes for them.
      tone: plain
      layout: list
      linkArrow: false
      items:
        - heading: The nurse records the readings first
          icon: activity
          body: >-
            A nurse or clinical assistant does the intake before the consult, entering the vitals and the
            sugar readings by point and click. Each person logs in as themselves, and the role on that login
            decides which screens they can open; the reception login included in the price cannot open the
            EMR or issue a prescription.
        - heading: The consult, by point and click
          icon: notebook-pen
          body: >-
            The diabetologist opens the record with the readings already charted. Complaints, diagnosis,
            medications, investigations, referrals and follow-ups are picked with auto-complete, and on
            Premium the foot and eye findings go on the clinic's own examination form.
        - heading: The prescription and the advice go home
          icon: pill
          body: >-
            The prescription is printed for the patient or sent by WhatsApp on Premium, and it can carry
            patient guidelines such as the diet advice. Easy Clinic also carries patient education material
            with lifestyle tips and condition-specific guidance.
        - heading: Check-up packages paid in parts
          icon: receipt
          plan: premium
          body: >-
            On Premium, a diabetes check-up package with its visits scheduled in advance is billed as one
            package treatment and paid in parts. Each advance and part payment is recorded against it, and a
            refund or a voided invoice goes through only with authorisation.
          link:
            label: Read how billing works
            href: /features/billing/
        - heading: Reviews by video
          icon: video
          plan: premium
          body: >-
            On Premium, a review can be a video consult, booked through the appointment screen with the fee
            paid online. The patient joins from a web browser on a phone or a computer, and the
            prescription says the consult was held remotely.
          link:
            label: Read how video consults work
            href: /features/telemedicine/

