editorialPass:
  by: 'Claude (AI review; human read-aloud pass pending)'
  on: 2026-11-05
  onlyUsCouldWrite: >-
    The foot and eye examination trends, insulin and diet plans on the record and check-up packages with
    pre-scheduled visits come from Easy Clinic's own diabetology page, and the plan split a diabetes clinic
    meets is stated as plans.yaml has it: lab charts, forms and packages on Premium, the pharmacy on
    Enterprise or as a module.
