sections:
  # Block 2: local proof strip. The template also puts the bare contact card in the hero; this section renders the
  # rest (cities) from src/data/countries/qa.yaml.
  - discriminant: contactCard
    value:
      id: qatar-team
      heading: Easy Clinic in Qatar, and how to reach the team
      intro: >-
        Write to hello@easyclinic.io or call the Easy Clinic team to book a demo, or with a question before you book
        one. As healthcare networks expand across Doha and other municipalities, Easy Clinic supports multi-branch
        growth without complexity, with onboarding, training and support from manual systems to digital.
      tone: plain
      country: qa
      showClients: false

  # Block 3 (Kenya: regulators). The live page names no Qatari rule or status, so this slot carries its comparison.
  - discriminant: dataTable
    value:
      id: emr-vs-ehr
      eyebrow: AI EMR and clinic software
      heading: What is AI EMR software, and how is it different from EHR software?
      intro: >-
        AI EMR software in Qatar goes beyond traditional EHR software and standalone clinic management software.
        While conventional EHR software focuses on storing patient records digitally, **AI EMR software integrates
        clinical workflows, billing, analytics and communication tools into one system.**
      tone: wash
      caption: EHR software vs clinic management software vs AI EMR software in Qatar
      columns: [Feature, Traditional EHR software, Basic clinic management software, AI EMR software (Easy Clinic)]
      rows:
        - [Patient records, Digital storage only, Limited integration, '**Fully integrated AI EMR system**']
        - [Automation, Minimal, Partial, '**Advanced AI automation**']
        - [Billing and payments, Manual or semi-digital, Moderate, '**Fully automated and accurate**']
        - [Inventory management, Not included, Basic tracking, '**Real-time monitoring with alerts**']
        - [Multi-location support, Difficult, Partial, '**Fully centralised control**']
        - [Analytics, Basic report, Limited insights, '**Advanced dashboards and insights**']
        - [Communication, Not integrated, Limited, '**SMS, WhatsApp, email and teleconsultation**']
        - [Scalability, Low, Moderate, '**High for clinics and hospitals**']

  # Block 4: billing and records, as a card grid (no prices: no riyal price list exists).
  - discriminant: moduleGrid
    value:
      id: billing-and-records
      eyebrow: Records and billing
      heading: Records, billing, insurance and stock at a clinic in Qatar
      intro: >-
        Every plan is priced per doctor per month; see the [pricing page](/pricing/) for current plans. These are the
        parts of Easy Clinic a clinic in Qatar uses every day.
      tone: plain
      columns: 2
      items:
        - title: Digital patient records with AI EMR software
          icon: file-text
          outcome: >-
            Store complete patient histories, including consultation notes, lab reports and prescriptions, and open
            accurate data instantly for continuity of care.
          href: /features/emr/
        - title: Billing and insurance processing
          icon: receipt
          outcome: >-
            Generate invoices instantly and track payments clearly, so billing and insurance processing stop being
            complex and error-prone.
          href: /features/billing/
        - title: Inventory and pharmacy control
          icon: pill
          outcome: Track medicines and supplies in real time with low stock alerts and expiry monitoring.
          href: /features/pharmacy-and-inventory/
        - title: Data-driven insights
          icon: chart-column
          outcome: Built-in analytics show patient volumes, revenue trends and staff productivity for informed decisions.
          href: /features/reports-and-dashboards/

  # Block 5: daily care and connectivity, with the honest limit in the aside.
  - discriminant: prose
    value:
      id: teleconsultation-and-branches
      heading: Teleconsultation, reminders and multi-branch clinics
      tone: wash
      body: |
        **Teleconsultation.** Teleconsultation enables remote care for patients across Qatar, with digital follow-ups after the visit.

        **Reminders.** Appointment scheduling is automated, with reminders over SMS and WhatsApp that minimise no-shows, because patients expect digital communication, reminders and teleconsultation.

        **Multi-branch groups.** Clinics with branches in Doha, Al Khor and Lusail manage all operations from one central dashboard, so opening a new branch does not mean a new system.

        **Patient histories.** Doctors access patient histories instantly through AI EMR software during consultations.
      aside: >-
        **Where it stops.** Easy Clinic runs in the browser over the internet and does not run fully offline today.
        If your clinic loses its connection for long periods, tell us before you buy.
      width: measure

  # Block 6: the clinic types.
  - discriminant: clinicTypes
    value:
      id: clinic-types
      heading: Speciality clinics to medical centres in Qatar
      intro: Easy Clinic adapts to how you work. Pick the one closest to yours; each card links to the page written for that kind of clinic.
      tone: plain
      items:
        - persona: solo
          title: Solo practice
          body: Suitable for physicians and specialists who operate their own clinic with or without an assistant and receptionist.
          href: /solutions/solo-clinic/
        - persona: polyclinic
          title: Specialist polyclinic
          body: Suitable for OPD practices or polyclinics with multiple doctors and specialists, with optional offerings such as pharmacy and lab.
          href: /solutions/polyclinic/
        - persona: chain
          title: Clinic chains
          body: >-
            Suitable for clinic chains across Doha and other municipalities that need centralised management and
            custom business processes.
          href: /solutions/clinic-chain/
        - persona: ngo
          title: NGO clinic
          body: Suitable for non-profit and mission-driven healthcare organisations that operate fixed or mobile clinics.
          href: /features/

  # Proof: rating badges (no Qatari testimonial is on record, so this takes the Kenya testimonial slot).
  - discriminant: proofBlock
    value:
      id: ratings
      eyebrow: Reviews
      heading: Clinics trust us. The industry awards us.
      tone: wash
      variant: badges
      badges:
