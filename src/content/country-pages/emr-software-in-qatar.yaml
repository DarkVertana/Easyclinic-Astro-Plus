notes:
  - 'Structure follows /emr-software-in-kenya/ as the Malaysia to Nigeria pages do. The rules slot carries the live page''s comparison table because the live page names no Qatari regulator or payer (only "highly regulated with strict healthcare data compliance standards"), and no qa-* regulator files exist. Rating badges take the testimonial slot (every testimonial on the live page is placed elsewhere, spec 2.4).'
  - 'Unconfirmed claims removed (owner decision 2026-10-14): "secure data management aligned with healthcare regulations", "enterprise-grade EMR systems with high compliance", "One EMR software that matches Qatar''s healthcare standards". "Support ABDM readiness" was copied from the India page and is cut. Added from the repo: "does not run fully offline today" (migration/research/facts.md).'
  - 'Edits the publish rules required: banned words removed ("seamless", "streamline", "comprehensive", "end-to-end", "robust", "world-class", "modern clinics", "for modern healthcare"); "EasyClinic" written as "Easy Clinic"; "proven results" cut (claims rule); FAQ questions end with a question mark.'
  - 'FAQ: 9 of the live page''s 13 plus an offline answer; left out the ones that repeat (does it provide AI EMR, can clinic software replace AI EMR, small clinics, patient experience).'
  - 'Contact: no Qatar contact or office is on record (src/data/countries/qa.yaml); demo CTAs go to the countries page form.'
