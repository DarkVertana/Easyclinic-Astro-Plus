        HMO claims come with the Enterprise plan, or with the claims add-on on Professional and Premium.
        Each HMO is set up once with its plans and tariff, and its claims carry the capitation or
        fee-for-service detail that HMO pays on. HMOs whose claim formats are built today: [list of
        Nigerian HMOs whose claim packs EasyClinic produces, as of date].

  # Block 4, continued: the HMO claim journey (spec 5.13 Nigeria "HMO claim packs and encounter forms").
  - discriminant: stepList
    value:
      id: hmo-visit
      heading: An HMO patient's visit, from the front desk to the paid claim
      intro: >-
        This is the claims module, which comes with Enterprise and can be added to Professional or
        Premium. The steps are the same for every HMO, and the forms each HMO wants at the end differ.
      steps:
        - title: Registration
          meta: Front desk
          body: >-
            The receptionist links the patient to their HMO and plan, so every bill from the visit follows
            that HMO's tariff instead of what the receptionist remembers. [Whether EasyClinic checks an
            enrollee's eligibility with the HMO online, as of date].
        - title: Authorisation
          meta: Before the service
          body: >-
            Where the HMO has to approve a service first, the authorisation code it gives is recorded
            against the visit before the bill is built, so a missing code is caught at the desk instead of
            on the returned claim.
        - title: The bill
          meta: At the counter
          body: >-
            The bill is built from what was ordered in the consult, at that HMO's own tariff, and the
            patient's share is split from the HMO's and paid at the desk in naira.
        - title: The claim
          meta: Billing desk
          body: >-
            The claim is built from the visit and the bill, with the capitation or fee-for-service detail
            that HMO pays on, and the billing desk submits it one at a time or in a batch. Claim packs and
            encounter forms in each HMO's own format: [HMO claim pack status as of date].
        - title: Reconciliation
          meta: When the HMO pays
          body: >-
            When the HMO pays, the payment is settled against its claims, and the claims it has not paid
            stay open, so the billing desk sees which HMO still owes for which visits.
      note: >-
        A finished claim reaches the HMO by [how a claim reaches each HMO: portal upload, email, print or a
        direct connection, as of date]. The same steps for every payer are on the
        [insurance claims page](/features/insurance-claims/).

  # Block 5: connectivity and language. The live site says it does not run fully offline today.
  - discriminant: prose
    value:
      id: power-internet-whatsapp
      heading: Power cuts, slow internet, phones and WhatsApp
      body: |
        **Power and internet.** EasyClinic runs in the browser over the internet, and it does not run fully offline today. When the power cuts before the generator comes on, or the line drops in the middle of a consult, [what is saved and what is lost when the power or the internet drops mid-consult]. Put the reception computer and the router on an inverter or a UPS, and keep a mobile data hotspot as a second line. A hospital that cannot depend on one connection can ask about the self-hosted option, where EasyClinic runs on the hospital's own server: [self-hosted option for Nigerian clinics: which plans, what it costs and what still needs the internet].

        **Slow connections.** [How EasyClinic behaves on a slow mobile data connection, and how much data a day of clinic use takes].

        **Phone and tablet.** On the Enterprise plan, patients get their own app and portal. For the doctor away from the desk: [doctor app: which phone platforms, and which screens work on a phone].

        **WhatsApp.** On Premium and Enterprise, appointment reminders and messages reach the patient on WhatsApp, sent from the clinic software instead of the receptionist's own phone. On Professional, reminders go by SMS and email. [WhatsApp sender for Nigerian clinics: the clinic's own number or EasyClinic's, and who pays the message charges].

        **Prescription language.** Prescriptions print in English. [Whether prescriptions can also print in Hausa, Yoruba, Igbo or Pidgin].
      aside: >-
        **Where it stops.** EasyClinic does not run fully offline today. A clinic that loses its line for
        hours at a time needs a second connection, or a paper register at the front desk for those hours.
      width: measure

  # Block 6: the four clinic types. No Nigerian client is on file, so every example is a placeholder.
  - discriminant: clinicTypes
    value:
      id: clinic-types
      heading: Solo clinics to hospital OPDs in Nigeria
      intro: Pick the one closest to yours. Each card links to the page written for that kind of clinic.
      items:
        - persona: solo
          title: Solo doctor clinics
          body: >-
            One doctor and a receptionist, with no IT staff to call when the printer stops talking to the
            system. The thirty-second prescription comes from saved shortcuts and the bill comes from the
            visit, so the evening is not spent matching bank transfer alerts to patient names.
          example: '[Nigerian solo doctor clinic on EasyClinic: doctor, specialty and city, with consent to be named]'
          href: /solutions/solo-clinic/
        - persona: polyclinic
          title: Polyclinics and specialist centres
          body: >-
            One record for every specialist the patient sees, with shared rooms and slots. Roles decide who
            sees what: the reception login books and bills, but it cannot open the EMR or write a
            prescription.
          example: '[Nigerian polyclinic or specialist centre on EasyClinic: name and city, with consent to be named]'
          href: /solutions/polyclinic/
        - persona: chain
          title: Clinic groups with branches
          body: >-
            Central price lists, standard SOPs, stock moved between branches and a morning view of each
            branch's KPIs. Clinical SOP tracking shows adherence branch by branch, so drift turns up as a
            number on the owner's dashboard.
          example: '[Nigerian clinic group on EasyClinic: name, cities and number of branches, with consent to be named]'
          href: /solutions/clinic-chain/
        - persona: hospital-opd
          title: Hospital OPDs
          body: >-
            Token queues and doctor schedules at the front desk, pharmacy and lab turnaround behind it, HMO
            claims from the same bill and a daily view of throughput. EasyClinic runs the outpatient side
            and is not a full hospital information system, so wards and theatres stay on a separate system.
          example: '[Nigerian hospital OPD on EasyClinic: name and city, with consent to be named]'
          href: /solutions/hospital-opd/

  # Admissions of limits (spec 6.1, 6.5). Every item is a confirmed limit or a placeholder.
  - discriminant: scopeBox
    value:
      id: where-it-stops
      heading: Where EasyClinic stops in a Nigerian clinic today
      variant: limits
      items:
        - '**It does not run fully offline.** It needs an internet connection, so the power and the line at reception matter as much as the software.'
        - '**It does not run inpatient wards.** Admissions, bed management, theatres and the ICU need their own system, and EasyClinic runs the OPD beside it.'
        - '**It does not make your clinic NDPA compliant on its own.** Registering with the NDPC and naming a Data Protection Officer, where the Act asks for them, stay with the clinic whatever software it uses.'
