faqHeading: Questions Nigerian clinic owners ask
faq:
  - question: Can EasyClinic prepare HMO claims for my clinic?
    answer: >-
      Yes, on the Enterprise plan or with the claims add-on on Professional and Premium: each HMO is set
      up once with its plans and tariff, and the claim is built from the visit and the bill with the
      capitation or fee-for-service detail that HMO pays on. Claim packs in each HMO's own format are
      [HMO claim pack status as of date], the same as the HMO row in the table on this page, and the HMOs
      set up today are [list of Nigerian HMOs whose claim packs EasyClinic produces]. When an HMO pays,
      the payment is settled against its claims, and the unpaid ones stay open.
  - question: Is EasyClinic compliant with the NDPA?
    answer: >-
      EasyClinic's standing under the Nigeria Data Protection Act, 2023 is [NDPA status as of date], the
      same as the NDPA row in the table on this page, and no software makes a clinic compliant on its
      own. Your clinic is the data controller and EasyClinic processes patient data on its behalf, so
      registering with the NDPC and naming a Data Protection Officer stay with you: the NDPC's
      registration notice counts a health-sector organisation that keeps patient files, or any
      organisation handling the personal data of more than 200 people in six months, as a data
      controller of major importance, and section 32 of the Act asks such a controller for a Data
      Protection Officer, on the staff or engaged by contract. Patient data for Nigerian clinics is
      hosted in [hosting region and provider for Nigerian clinics].
      The records belong to your clinic, and if you leave, [what data a clinic gets back on leaving, in
      what format, and how long EasyClinic keeps a copy].
  - question: What happens when the power or the internet goes?
    answer: >-
      EasyClinic does not run fully offline today, because it runs in the browser over the internet.
      [What still works without internet, and what is saved when the power or the line drops
      mid-consult]. Keep the reception computer and the router on an inverter or a UPS with a mobile
      data hotspot as a second line, and a hospital that loses its connection for hours at a time can ask
      about the self-hosted option: [self-hosted option for Nigerian clinics: which plans, what it costs
      and what still needs the internet].
  - question: Can EasyClinic send appointment reminders on WhatsApp?
    answer: >-
      Yes, on Premium and Enterprise the appointment reminder and other messages reach the patient on
      WhatsApp, sent from the clinic software; on Professional, reminders go by SMS and email. [WhatsApp
      sender for Nigerian clinics: the clinic's own number or EasyClinic's, and who pays the message
      charges].
  - question: Can one system run my branches in Lagos and Abuja?
    answer: >-
      Yes, Premium and Enterprise both cover more than one location, and Professional covers one. On
      Enterprise the owner has central control of every branch, with stock moved between branches and
      clinical SOPs tracked across them. [What a second branch adds to the monthly bill in Nigeria].
  - question: How much does EasyClinic cost in Nigeria?
    answer: >-
      Professional costs {price:ngn.professional.annual} and Premium {price:ngn.premium.annual} per
      doctor per month when paid annually, or {price:ngn.professional.quarterly} and
      {price:ngn.premium.quarterly} when paid quarterly. Enterprise, for hospital OPDs and clinic groups,
      is priced on quote. A reception login is included and there is no setup fee. [Whether VAT is
      included in naira prices or added], and the [Nigeria pricing page](/pricing/nigeria/) lists every
      add-on.
  - question: Does EasyClinic help with NHIA accreditation?
    answer: >-
      What EasyClinic provides toward NHIA accreditation is [NHIA accreditation documentation status as
      of date], the same as the NHIA row in the table on this page, and the accreditation itself is the
      facility's own application whatever software it runs. The NHIA replaced the NHIS in May 2022 and
      accredits the facilities that treat patients under its schemes. [Which NHIA accreditation documents
      EasyClinic produces from the patient record, as of date].
  - question: Can patients pay through Paystack or Flutterwave?
    answer: >-
      Paystack payments through EasyClinic are [Paystack status as of date], and Flutterwave payments are
      [Flutterwave status as of date]. A card or bank transfer payment at the desk is recorded against the
      patient's bill in naira, so the bill shows what is paid and what is still owed, and online payments
      start on the Premium plan.
  - question: How is EasyClinic different from AjirMed?
    answer: >-
      [The main difference between EasyClinic and AjirMed for a private Nigerian clinic, with a source and
      a date for each point]. The [Nigeria comparison page](/best-clinic-management-software-nigeria/)
      puts the options for a private clinic in Nigeria side by side, EasyClinic included, with a source
      and a date for every cell.
  - question: Will someone train my staff on site in Nigeria?
    answer: >-
      [Whether EasyClinic trains Nigerian clinics on site, remotely or both, and what an on-site visit
      costs]. Training runs over {fact:trainingDays} days and takes about two hours in total: 40 minutes
      on the first day, 40 on the second, then 20 and 20. Unlimited support and training come with every
      plan, and a clinic can be live in as little as {fact:goLiveDays} days from the demo.

