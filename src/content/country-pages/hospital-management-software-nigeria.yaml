  - 'Secondary keyword "NDPA compliant" is kept from the 4.2 row as metadata only. No copy says EasyClinic is NDPA compliant; the scope box and the NDPA FAQ say the opposite of an assumption. Do not add the phrase until ng-ndpa is Live with a date.'
  - 'Opener: two sentences (spec 2.2). Sentence one carries the head keyword, the NGN price token and the HMO capitation and fee-for-service detail from the live page; sentence two is the offline behaviour spec 5.13 asks for, with the power-cut behaviour as a placeholder. HMO claims come with Enterprise or the claims add-on, which the money block and the FAQ say; "plans from" keeps the price from reading as the claims price.'
  - 'Compliance panel: heroStrip.regulators shows the NHIA, HMO claims and NDPA chips (linking to their /trust/ rows), and the regulatorTable renders all three ng-* rows with the clinic-must-do column. Both render placeholders until each state is set. The table intro links /privacy/nigeria/ and /trust/. On a page meant to publish before those states exist, remove heroStrip.regulators and the regulatorTable (page-writing rules).'
  - 'Block 5 heading "Power cuts, slow internet, phones and WhatsApp" names four topics (spec 5.13 Nigeria: offline and low-bandwidth mode, WhatsApp Business flows, power-outage behaviour, plus mobile) to follow the no-groups-of-three rule. The inverter, UPS and hotspot advice is general practice, not a product claim.'
  - 'FAQ follows the ten spec 5.13 Nigeria topics in order of what a prospect asks first: HMO claims, NDPA, unreliable internet, WhatsApp, branches, NGN cost, NHIA, Paystack, AjirMed comparison, training on site. The NDPA answer also carries hosting and data on leaving (spec 2.5 uncomfortable questions). No comparison page for Nigeria exists in the spec site tree, so the AjirMed answer points to the listicle.'
