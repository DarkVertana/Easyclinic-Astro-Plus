  # Block 3: regulatory deep-dive. Status and dates render from src/data/regulators/ng-*.yaml (all null today).
  - discriminant: regulatorTable
    value:
      id: compliance-in-nigeria
      heading: What Nigeria's health insurance and data protection rules ask of your clinic
      intro: |
        **NHIA.** The National Health Insurance Authority replaced the NHIS when the NHIA Act was signed on 19 May 2022. It accredits the health care facilities that treat patients under its schemes, and accreditation is the facility's own application, whatever software it runs.

        **HMOs.** A private clinic in Nigeria that treats insured patients is paid by their HMOs, and each HMO has its own claim forms. What the clinic is paid for a service depends on the HMO and the enrollee's plan, and HMOs pay in two ways: capitation, a fixed sum each month for every enrollee registered with the clinic, or fee-for-service, a claim for each visit or service. The NHIA accredits HMOs too, and lists them on [its HMO page](https://www.nhia.gov.ng/hmo/).

        **NDPA.** The Nigeria Data Protection Act, 2023 treats health status as sensitive personal data, and the Nigeria Data Protection Commission (NDPC) enforces it. The Act sets rules on consent, breach notification, sending patient data outside Nigeria and registration with the Commission. The NDPC's registration notice of December 2024 counts an organisation in the health sector that keeps a filing system of personal data, on paper or on a computer, as a data controller of major importance, and the same goes for any organisation that handles the personal data of more than 200 people in six months. A data controller of major importance registers with the NDPC and, under section 32 of the Act, names a Data Protection Officer, who can be on the staff or engaged by contract.

        Each row below gives EasyClinic's status (Live, In certification, Planned or Not applicable) and the date it was last checked. If anything else on this page seems to claim more than the table, go by the table. How EasyClinic itself handles personal data in Nigeria is on the [Nigeria privacy page](/privacy/nigeria/), and the same table for every country is on the [trust page](/trust/). Opening a new clinic first? The [guide to starting a clinic in Nigeria](/clinic-in-nigeria/) covers the licences and the costs before the first patient.
      countries: [ng]
      showClinicMustDo: true
      trustLink: true

