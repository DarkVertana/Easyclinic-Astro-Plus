  - 'Secondary keyword "SHA compliant clinic software" is kept from the 4.2 row as metadata only. No copy on the page says Easy Clinic is SHA compliant; do not add that phrase until ke-sha is Live with a date.'
  - 'Opener: two sentences (spec 2.2). The SHA status from the 6.3 after-version is folded into sentence one as a placeholder, as a contrast clause, so the payment list stays at two items (M-Pesa and SLADE); rewrite that clause when ke-sha has a state and date. Sentence two carries the KES price token and the Penda Health study (spec 5.13). eTIMS from the 6.3 after-version is left out of the opener because its status is unknown. The 6.3 wording "run on it for nine years" is written as "since 2017" (the preprint date), and "the AI copilot" as "an AI tool inside the record" so it is not read as CuraPilot.'
  - 'The Kenya contact is not cleared to publish (countries/ke.yaml contact.publishName is null), so no contact name appears anywhere in this file, notes included. The hero ContactCard falls back to "Easy Clinic Kenya team" and "Or call us directly". {contact:ke.email} renders a personal address that carries the contact''s first name; decide whether a role address replaces it. Restore the spec 5.13 block 2 "Or call [first name] directly" pattern once publishName is true.'
