notes:
  - 'Title claim: "SHA Ready" comes from the spec 4.2 row. Before publishing it must match the SHA status in src/data/regulators/ke-sha.yaml. If SHA e-claims are not Live with a date, retitle, e.g. "Clinic Management Software in Kenya: Easy Clinic".'
