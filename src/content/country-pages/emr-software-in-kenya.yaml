sections:
  # Block 2: local proof strip. The template also puts the bare contact card in the hero; this section
  # renders the rest (office, cities, named clients) from src/data/countries/ke.yaml.
  - discriminant: contactCard
    value:
      id: kenya-team
      heading: Easy Clinic in Nairobi, and how to reach the Kenya team
      intro: >-
        Call the Kenya team on {contact:ke.phone} or write to {contact:ke.email} to book a demo, or with
        a question before you book one. After the demo, training is {fact:trainingDays} short sessions,
        about two hours in total, for you and your staff, and a clinic can be live in as little as
        {fact:goLiveDays} days.
      country: ke
      showClients: true

  # Block 3: regulatory deep-dive. Status and dates render from src/data/regulators/ke-*.yaml (all null today).
  - discriminant: regulatorTable
    value:
      id: compliance-in-kenya
      heading: Kenyan regulators and what each one asks of your clinic
      intro: |
        **SHA and SHIF.** SHA, the Social Health Authority, took over from NHIF on 1 October 2024 and runs the Social Health Insurance Fund (SHIF). For the clinic, an SHA claim means checking the patient's eligibility at registration and sending the claim electronically from the invoice, and only a contracted SHA facility with a valid facility code can claim.

        **eTIMS.** KRA's electronic tax invoice system receives each invoice the clinic issues, and the receipt the patient takes home carries the eTIMS reference. The clinic registers for eTIMS with KRA itself, whatever software it uses.

        **Digital Health Act, 2023.** The Act sets how health data is stored and shared, and requires digital health systems to be registered with the Digital Health Agency it created.

        **Data Protection Act, 2019.** Health data is sensitive personal data under the Act, with its own rules on patient consent and on moving data outside Kenya, and your clinic registers with the Office of the Data Protection Commissioner as a data controller.

        The table also carries the MOH 705 report for DHIS2 and the documents a KMPDC inspection asks for. Registering with the council before you open is covered in the [KMPDC registration guide](/how-do-i-get-approval-from-the-kmpdc-in-kenya/). Each row gives Easy Clinic's status (Live, In certification, Planned or Not applicable) and the date it was last checked. If anything else on this page seems to claim more than the table, go by the table. The same table for every country is on the [trust page](/trust/).
      countries: [ke]
      showClinicMustDo: true
      trustLink: true

  # Block 4: money. Prices from src/data/prices/kes.yaml (null today); M-Pesa, insurers and tax invoicing from countries/ke.yaml.
  - discriminant: countryMoney
    value:
      id: prices-in-shillings
      heading: Prices in shillings, and how Kenyan patients pay
      intro: >-
        Every price is per doctor per month, and the price includes a reception login. There is no setup
        fee and no contract. At a Kenyan clinic much of the money arrives by M-Pesa or from an insurer, and
        Easy Clinic records both on the same bill, so the balance shows what the patient still owes.
      country: ke
      currency: kes
      payersNote: >-
        Claims to Jubilee, AAR, CIC, Britam and Resolution go through SLADE, from the same bill the front
        desk raised. Insurance claims come with the Enterprise plan, or with the claims add-on on
        Professional and Premium. SHA e-claims: [SHA e-claims status as of date]. SMART, the member card
        check some insurers use at the desk: [SMART status as of date].

  # Block 5: connectivity and language. The live site says it does not run fully offline today.
  - discriminant: prose
    value:
      id: offline-mobile-swahili
      heading: Offline, mobile, WhatsApp and Swahili
      body: |
        **Internet.** Easy Clinic runs in the browser over the internet, and it does not run fully offline today. If the line drops in the middle of a consult, [what is saved and what is lost when the connection drops mid-consult]. Keep a mobile data hotspot beside the reception computer as a second line. A county clinic that loses its connection for hours at a time can ask about the self-hosted option, where Easy Clinic runs on the clinic's own server: [self-hosted option for Kenyan clinics: plans and cost, and what still needs the internet].

        **Phone and tablet.** On the Enterprise plan, patients get their own app and portal. For the doctor and the staff away from the desk: [doctor app: which phone platforms, and which screens work on a phone].

        **Swahili.** Prescriptions print in English and Swahili, so the patient reads the dosage and the advice in the language they use at home. The whole bilingual prescription takes a doctor under 30 seconds to write. [How the Swahili text is produced: saved templates or translation].

        **WhatsApp.** On Premium and Enterprise, the appointment reminder and the follow-up message reach the patient on WhatsApp, sent from the clinic software instead of the receptionist's own phone. On Professional, reminders go by SMS and email.
      aside: >-
        **Where it stops.** Easy Clinic does not run fully offline today. If your clinic loses its line for
        hours at a time, tell us before you buy, and we will show you what the screen does when the
        connection goes.
      width: measure

  # Block 6: the four clinic types. Examples from src/data only; the rest are placeholders.
  - discriminant: clinicTypes
    value:
      id: clinic-types
      heading: Solo clinics to hospital OPDs in Kenya
      intro: Pick the one closest to yours. Each card links to the page written for that kind of clinic.
      items:
        - persona: solo
          title: Solo doctor clinics
          body: >-
            One doctor and a receptionist, with no IT staff to call when the printer stops talking to the
            system. The prescription comes from saved shortcuts in about thirty seconds, and the
            receptionist enters the M-Pesa payment on the patient's bill at the desk, so the evening is not
            spent matching M-Pesa messages to names.
          example: Dr J. J. Thakkar runs his urology clinic, the Laser Stone and Endoscopy Centre in Nairobi, on Easy Clinic.
          href: /solutions/solo-clinic/
        - persona: polyclinic
          title: Polyclinics and specialist centres
          body: >-
            One record for every specialist the patient sees, with shared rooms and slots. Roles decide who
            sees what: the reception login books and bills, but it cannot open the EMR or write a
            prescription.
          example: '[Kenyan polyclinic or specialist centre on Easy Clinic: name and town]'
          href: /solutions/polyclinic/
        - persona: chain
          title: Clinic chains
          body: >-
            Central price lists, standard SOPs, stock moved between branches and a morning view of each
            branch's KPIs. Branch drift shows up in the numbers before it shows up in patient complaints.
          example: Penda Health has run its clinics in Nairobi on Easy Clinic since 2017, and 15 of them took part in the 2025 study below.
          href: /solutions/clinic-chain/
        - persona: hospital-opd
          title: Hospital OPDs and nursing homes
          body: >-
            Token queues and doctor schedules at the front desk, pharmacy and lab turnaround behind it,
            insurer claims from the same bill and a daily view of throughput. Easy Clinic runs the outpatient
            side and is not a full hospital information system.
          example: '[Kenyan hospital OPD or nursing home on Easy Clinic: name and town]'
          href: /solutions/hospital-opd/

  # Block 7: local testimonial (assigned to this page only).
  - discriminant: testimonialRow
    value:
      id: nairobi-clinic
      heading: A Nairobi urologist on the support after go-live
      items: [jj-thakkar]
      layout: single
      usePullQuote: true

  # Proof: the Penda Health study, from study.yaml. Preprint, AI Consult; never "peer reviewed" or CuraPilot.
  - discriminant: proofBlock
    value:
      id: penda-health-study
      eyebrow: The Penda Health study
      heading: What the Penda Health study measured in Nairobi
      variant: study
      figures: [visits, diagnostic-errors]
      body: >-
        In a 2025 preprint written with OpenAI, Penda Health studied {fig:visits} patient visits at 15 of
        its clinics in Nairobi, all of them run on Easy Clinic, the record Penda has used since 2017. The
        tool studied was AI Consult, a safety net inside that record that flagged possible documentation
        and clinical errors while the clinician worked. Independent physicians rated the visits, and
        clinicians with AI Consult made fewer errors, including 10% fewer investigation errors. The study
        measured clinical errors, not the front desk or the claims.

faqHeading: Questions Kenyan clinic owners ask
faq:
  - question: Can Easy Clinic send SHA claims today?
    answer: >-
      SHA e-claims from Easy Clinic are [SHA e-claims status as of date], and the SHA row in the table on
      this page carries the same status and date. If that row does not show Live with a date, plan your
      clinic's SHA claims outside Easy Clinic. Whatever software you use, only a contracted SHA facility
      with a valid facility code can claim.
  - question: How are M-Pesa payments matched to patient bills?
    answer: >-
      The M-Pesa payment is recorded against the patient's bill at the desk, so the bill shows what is
      paid and what is still owed. [Whether Easy Clinic receives M-Pesa through Daraja, a Till or a
      Paybill number, and whether it matches payments to bills automatically, as of date]. At day end the
      cash close shows M-Pesa as its own total beside cash, with any variance on a separate line.
  - question: What is the difference between KenyaEMR and Easy Clinic?
    answer: >-
      [The main difference between KenyaEMR and Easy Clinic for a private clinic, from the comparison page
      verdict]. The [Easy Clinic vs KenyaEMR](/easyclinic-vs-kenyaemr/) page compares the two on
      published price, AI documentation, billing and multi-branch support, with a source and a date for
      every cell, and says what moving your records across involves.
  - question: Does Easy Clinic send invoices to KRA through eTIMS?
    answer: >-
      eTIMS e-invoicing from Easy Clinic is [eTIMS status as of date], the same as the eTIMS row in the
      table on this page. With eTIMS, each invoice goes to KRA and the patient's receipt carries the eTIMS
      reference. The clinic registers for eTIMS with KRA itself, whatever software it uses, and if that
      row does not show Live with a date, plan to issue your eTIMS invoices outside Easy Clinic.
  - question: What happens when the internet goes down?
    answer: >-
      Easy Clinic does not run fully offline today, because the cloud version needs an internet
      connection. [What still works without internet, and what is saved when the connection drops
      mid-consult]. Keep a mobile data hotspot as a second line, and a clinic that loses its connection
      for hours at a time can ask about the self-hosted option, where Easy Clinic runs on the clinic's own
      server: [self-hosted option for Kenyan clinics: plans and cost, and what still needs the internet].
  - question: How long does it take to move from another system?
    answer: >-
      A clinic can be live in as little as {fact:goLiveDays} days from the demo, and moving records
      across from another system takes [data migration time for a Kenyan clinic, and which systems
      Easy Clinic imports from]. Training runs over {fact:trainingDays} days and takes about two hours in total: 40 minutes on
      the first day, 40 on the second, then 20 and 20. A clinic group with several branches takes [go-live
      time for a multi-branch group in Kenya].
  - question: How much does Easy Clinic cost in Kenya?
    answer: >-
      Professional costs {price:kes.professional.annual} and Premium {price:kes.premium.annual} per
      doctor per month when paid annually, or {price:kes.professional.quarterly} and
      {price:kes.premium.quarterly} when paid quarterly. Enterprise, for clinic chains and hospital OPDs,
      is priced on quote. A reception login is included and there is no setup fee, and the [Kenya pricing
      page](/pricing/kenya/) lists every add-on.
  - question: Which insurers can I send claims to?
    answer: >-
      Claims to Jubilee, AAR, CIC, Britam and Resolution go through SLADE, an e-claims platform,
      from the same bill your front desk raised. Insurance claims come with the Enterprise plan,
      or with the claims add-on on Professional and Premium. SHA claims are a separate route, with their
      own row in the table on this page.
  - question: Does Easy Clinic produce the MOH 705 report?
    answer: >-
      The monthly MOH 705 outpatient summary comes from the visits already recorded in Easy Clinic, ready
      for DHIS2, so nobody tallies the paper register at month end. [Whether Easy Clinic submits the
      figures to DHIS2 directly or the clinic uploads them, as of date].
  - question: Where is patient data stored, and what does the Data Protection Act ask of my clinic?
    answer: >-
      Patient data for Kenyan clinics is hosted in [hosting region and provider for Kenyan clinics]. Under
      the Data Protection Act, 2019, health data is sensitive personal data, and your clinic registers
      with the Office of the Data Protection Commissioner as a data controller. If you leave Easy Clinic,
      [what data a clinic gets back on leaving and in what format, and how long Easy Clinic keeps a copy].

