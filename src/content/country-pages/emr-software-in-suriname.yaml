sections:
  # Definition and comparison: the compare table.
  - discriminant: dataTable
    value:
      id: emr-vs-ehr
      eyebrow: AI EMR and clinic software
      heading: What is AI EMR software, and how is it different from EHR software?
      intro: >-
        An EMR (electronic medical record) is the digital record a clinic keeps for each patient. An EHR
        (electronic health record) is built to share that record across hospitals and providers. AI EMR
        software goes one step further. It runs the clinic day as well: appointments, billing, pharmacy,
        reports and patient messages, with AI that helps the doctor during the visit.
      tone: plain
      wideIntro: true
      variant: compare
      caption: Paper or basic records vs basic clinic software vs AI EMR software in Suriname
      columns: [Feature, Paper or basic records, Basic clinic software, AI EMR software (Easy Clinic)]
      rows:
        - [Patient records, Files and folders, Records only, '**Full history, every visit by every doctor, and documents kept for life**']
        - [Prescriptions, Handwritten, Typed from scratch, '**Under 30 seconds with Ready Rx and shortcut keys, sent on WhatsApp**']
        - [Billing and payments, Manual, Basic invoices, '**One invoice for consultation, tests and medicines, with part payments and refunds**']
        - [Inventory management, Stock registers, Basic tracking, '**Batches and expiry dates, with stock that drops only when the pharmacist dispenses**']
        - [Multi-location support, Separate files per branch, Limited, '**One login with a location dropdown and shared stock**']
        - [Analytics, Counted by hand, A few reports, '**Clinical and financial dashboards and about 25 standard reports**']
        - [Communication, Phone calls, SMS, '**WhatsApp, SMS, email and video consultations**']
        - [Clinical AI, None, None, '**Cura AI, a paid add-on that flags and suggests while the doctor decides**']
        - [Scalability, One room, Small clinics, '**A solo clinic to a 250-clinic chain**']

