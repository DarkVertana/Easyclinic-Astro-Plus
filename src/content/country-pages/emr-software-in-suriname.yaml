faqHeading: Questions clinic owners in Suriname ask
faqHelp: Message our India WhatsApp line on +91 91477 70277, or ask the team that sets up and supports your clinic.
faq:
  - question: Is Easy Clinic suitable for clinics in Paramaribo and across Suriname?
    answer: >-
      Yes. Easy Clinic runs clinics, polyclinics, diagnostic centres and hospital OPDs in Paramaribo, Lelydorp,
      Nieuw Nickerie, Moengo and regional towns. One login covers every specialty, and each role works from its
      own queue. It runs in any browser on a laptop or tablet, so there is nothing to install at the clinic.
  - question: Can Easy Clinic manage clinics in multiple locations?
    answer: >-
      Yes. Each branch sits in a location dropdown under the same login, with shared patient records and one
      shared stock. A patient seen in Paramaribo can be seen in Nieuw Nickerie with the full history on screen.
      Enterprise adds central control of every location and a Power BI data warehouse for clinic groups.
  - question: How much does Easy Clinic cost in Suriname?
    answer: >-
      Easy Clinic is priced per doctor. Professional is $79 and Premium $99 per doctor per month, billed
      annually, and Enterprise is on a quote. Every plan includes a login for your receptionist at no extra
      cost, and there is no setup fee for clinics up to 5 users. Ask the team for a quote for your clinic.
  - question: Is patient data secure on Easy Clinic?
    answer: >-
      Yes. Easy Clinic lists compliance with HIPAA and GDPR. Records are protected with role-based access,
      audit logs and encryption in transit and at rest, and each person sees only what their role needs. Your
      patient data belongs to your clinic. We never sell it, and you can export it at any time.
  - question: Does Easy Clinic support telemedicine in Suriname?
    answer: >-
      Yes. Premium and Enterprise include built-in video consultations, booked from the same calendar as
      in-person visits. Clinics can follow up with patients in remote areas, and every video visit stays on
      the same patient record. Prescriptions from a video visit go to the patient on WhatsApp.
  - question: Can Easy Clinic send WhatsApp and SMS reminders?
    answer: >-
      Yes. Appointment and follow-up reminders go out on WhatsApp, SMS or email, the day before and again on
      the day of the visit, never at night. Medicine instructions can print in the language the patient reads,
      such as Dutch, and prescriptions, invoices and lab reports can go on WhatsApp too.
  - question: Does Easy Clinic support inventory and pharmacy management?
    answer: >-
      Yes. The pharmacy queue shows each prescription before the patient arrives. Batches that expire first
      show on top, the pharmacist can adjust quantity before dispensing, and stock drops only when medicine is
      dispensed. Purchase orders, goods receipt, transfers and stock take are built in, and one stock list can
      serve every branch.
  - question: Is Cura AI included in every plan?
    answer: >-
      Cura AI is a paid add-on that works with any plan. It runs in the background at registration, triage
      and the consultation. It flags what does not add up, such as a missed allergy, and suggests diagnosis
      and treatment. The clinic sets the triggers and alert style, and the doctor always decides.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      Easy Clinic is cloud-based software, so it needs an internet connection to run, and it does not work
      fully offline today. For uninterrupted service, most clinics keep a mobile data hotspot as a backup
      line, so registration, prescriptions and billing carry on if the main connection drops.
  - question: How do clinics in Suriname move from paper to Easy Clinic?
    answer: >-
      Book a 20-minute demo built around your own clinic day. Most clinics go live within 2 to 4 weeks. Easy
      Clinic builds your prescription format from your own sample, imports your old records and trains each
      role, and your dedicated account manager stays with you after go-live.

