notes:
  - 'Title claim: "ABDM Ready" comes from the spec 4.2 row. Before publishing it must match the ABDM M1 status in src/data/regulators/in-abdm-m1.yaml. If M1 is not Live with a date, retitle, e.g. "Clinic Management Software in India: Easy Clinic".'
  - 'H1 follows the 4.2 row. Spec 5.13 block 1 asks for the regulator in the H1; add ABDM to the H1 only once M1 is Live.'
  - 'Meta description rewritten from the 4.2 row ("ABDM-ready EMR, GST billing, UPI and WhatsApp") so it states no ABDM, GST or UPI status in text, and leads with the head keyword. It is 119 characters with tokens expanded and 154 as written; the linter measures the written form, so keep both under 155. Restore the row wording once in-abdm-m1, in-gst and UPI are Live.'
  - 'Secondary keyword "ABDM compliant EMR" left off on purpose: 4.5 rule 6 gives it to /trust/. This page mentions it once, in passing, in the compliance block and the /trust/ related link.'
  - 'The featureRows block (GST, UPI, Tally, NMC) sits after the money block because three of its four rows are about money; the numbered spec blocks keep their order.'
  - 'Author: spec 2.7 wants a named India country lead or the product lead. No India lead is on file (src/data/authors).'
  - 'Contact: countries/in.yaml has no named person, role or hours, so the hero and block 2 cards show placeholders. Spec 5.13 will not publish without block 2 filled; a named India contact with a direct number is the Walter pattern the spec asks for.'
  - 'Clinic-type examples use real data only: Asha Homeopathy (Manish Bhatia testimonial data), Aditya Women and Infertility Clinic (Seetha Lakshmi testimonial data), Institute of Hematology and Transfusion Medicine (Prantar Chakrabarti testimonial data). Confirm each clinic agrees to be named. The chain example is missing.'
  - 'Testimonial: seetha-lakshmi-kolanakuduru has role "[Role to confirm]" and consentOnFile null.'
  - 'Prices: INR Professional quarterly conflicts (1,899 live, 1,875 staging) and is null, so the FAQ shows a placeholder. GST inclusion is unconfirmed (prices/inr.yaml note).'
  - 'Offline: "It does not run fully offline today" and "a self-hosted option exists" are from the live Kenya listicle. Confirm both hold for India and say what is saved locally when the line drops. Private cloud hosting (Enterprise, plans.yaml) is still hosted and still needs the internet, so the page no longer offers it as the answer to an unreliable line.'
  - 'GST, UPI, Tally and NMC rows and FAQs: HSN and SAC codes, UPI, Tally export and NMC checks are written as "feature: [status as of date]" because in-gst, the UPI payment row and Tally have no state in src/data. The live India page calls GST "being expanded".'
  - 'Comparison FAQs and the Practo related link describe only the columns spec 5.16 gives the comparison table (published price, AI documentation, WhatsApp, billing and GST, multi-branch, patient discovery). The table has no ABDM column; add one to the comparison pages before saying it does.'
  - 'Go-live: {fact:goLiveDays} (3 days) conflicts with "2 to 4 week setup" on the live Kenya listicle (facts.yaml note). The training breakdown (40, 40, 20, 20 minutes) is from the live /pricing/ FAQ.'
  - 'Spec 5.13 also lists NABH documentation support and NMC telemedicine; both render as rows of the regulator table from src/data/regulators (in-nabh, in-nmc-telemedicine).'
  - 'Block 5 heading is "Offline, mobile, WhatsApp and prescription languages" (the four topics of spec 5.13 block 5) rather than the three-item brief wording, to follow the no-groups-of-three rule.'
