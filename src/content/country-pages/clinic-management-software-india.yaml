sections:
  # Block 2: local proof strip. The template also puts the bare contact card in the hero.
  - discriminant: contactCard
    value:
      id: india-team
      heading: Who you will talk to in India
      intro: >-
        The India team works from the Kolkata office. Call or WhatsApp the number below to book a demo,
        or to ask a question before you book one. Training is {fact:trainingDays} short sessions, about
        two hours in total, for you and your staff.
      country: in
      showClients: true

  # Block 3: regulatory deep-dive. Status and dates render from src/data/regulators/in-*.yaml.
  - discriminant: regulatorTable
    value:
      id: compliance-in-india
      heading: ABDM milestones and Indian regulations, row by row
      intro: |
        ABDM, the Ayushman Bharat Digital Mission, comes in three milestones, and a software vendor can have finished one without the next. **M1** is the ABHA number: creating or verifying the patient's health ID at the front desk and saving it on their record. **M2** links each visit's prescription and reports to that ABHA, so the patient sees them in their health records app. **M3** is the exchange: with the patient's consent, their records from other ABDM-linked facilities come into your chart.

        Each row below gives its status (Live, In certification, Planned or Not applicable) and the date it was last checked. If anything else on this page seems to claim more than the table, go by the table. Some of the work stays with the clinic whatever software it uses: the clinic registers on the Health Facility Registry and every doctor on the Healthcare Professionals Registry, and [what help Easy Clinic gives Indian clinics with HFR and HPR registration]. Under the DPDP Act 2023 your clinic is the data fiduciary and Easy Clinic processes patient data on its behalf, so the privacy notice and the grievance contact are yours to publish.

        What ABDM compliant EMR software means in practice, and the same table for every country, is on the [trust page](/trust/).
      countries: [in]
      showClinicMustDo: true
      trustLink: true

  # Block 4: money. Prices from src/data/prices/inr.yaml; payment rails and tax invoicing from countries/in.yaml.
  - discriminant: countryMoney
    value:
      id: prices-in-rupees
      heading: Prices in rupees, and how Indian patients pay
      intro: >-
        Every price is per doctor per month, and the price includes a reception login. There is no setup
        fee and no contract. [What happens on cancelling: notice period and refunds].
      country: in
      currency: inr
      payersNote: >-
        TPA claims come with the Enterprise plan, or with the claims add-on on Professional and Premium:
        payer price lists, a coverage check at registration, the claim pack built from the bill, and
        reconciliation when the TPA pays. TPAs integrated today: [list of TPAs integrated]. Credit billing
        for corporate and PSU panels: [corporate and PSU credit billing supported, as of date].

  - discriminant: featureRows
    value:
      id: what-indian-clinics-use
      heading: What Indian clinics use most
      intro: Each row says what the feature does and where it stands today, with the date it was last checked.
      items:
        - heading: GST invoices built from the visit
          body: >-
            The bill is made from what happened in the consult, so the tests ordered and the medicines
            dispensed arrive on the invoice without anyone retyping them. GST invoicing, with the HSN or SAC
            code and the GST amount on each taxable line such as pharmacy sales: [GST invoicing status as of
            date].
          link:
            label: Read how clinic billing works
            href: /features/billing/
        - heading: Payments at the desk and the day-end close
          body: >-
            Cards and cash are recorded against the bill at the front desk. UPI and online payment through
            Razorpay or PayU: [UPI, Razorpay and PayU status as of date]. Online payments are part of the
            Premium plan. At day end the cash counter closes with each payment mode as its own total and any
            variance on a separate line, so a gap is found on Tuesday evening rather than at month end.
          media:
            kind: screenshot
            needed: 'Day-end cash close: cash, card and UPI totals with a variance line (spec 12)'
            alt: The Easy Clinic day-end cash close, with cash, card and UPI totals and a variance line
            caption: Each payment mode and the variance, shown before the cash counter shuts for the day.
            frame: browser
        - heading: Tally export for your CA
          body: >-
            If your CA keeps the books in Tally, what you need to know is whether the month's receipts and
            GST totals reach Tally without someone typing them in again. Tally export: [Tally export status,
            format and which entries it carries, as of date].
          link:
            label: See every integration and its status
            href: /integrations/
        - heading: E-prescriptions and the NMC guidelines
          body: >-
            The prescription prints with [fields on an Easy Clinic e-prescription, such as registration
            number and signature], and goes to the patient on paper, or on WhatsApp on the Premium plan.
            For video consults, the NMC Telemedicine Practice Guidelines set which medicines can be
            prescribed at a first consult and which only at a follow-up; [what Easy Clinic checks against
            the NMC medicine lists, as of date]. Following those lists stays the doctor's responsibility.
          media:
            kind: screenshot
            needed: 'Thirty-second prescription: the Rx screen mid-entry with a drug interaction warning, Hindi print option visible (spec 12)'
            alt: The Easy Clinic prescription screen mid-entry, with a drug interaction warning and a print language option
            caption: A prescription mid-entry, with a drug interaction flagged before it prints.
            frame: browser
          link:
            label: Read how e-prescriptions work
            href: /features/emr/

  # Block 5: connectivity and language. The live site says it does not run fully offline today.
  - discriminant: prose
    value:
      id: offline-mobile-languages
      heading: Offline, mobile, WhatsApp and prescription languages
      body: |
        **Internet.** Easy Clinic runs in the browser over the internet, and it does not run fully offline today. If the line drops in the middle of a consult, [what is saved and what is lost when the connection drops mid-consult]. Keep a mobile hotspot beside the reception computer. A hospital OPD that cannot depend on one line can ask about running Easy Clinic on its own server: [self-hosted option for Indian clinics: which plans, what it costs and what still needs the internet].

        **Phone and tablet.** The doctor can write a prescription on a phone or a tablet, away from the desk; [doctor app: Android, iOS or mobile browser only]. On the Enterprise plan patients get their own app and portal for booking and reports.

        **Prescription languages.** Prescriptions print in English and in [prescription languages besides English], so the patient reads the dosage and the advice in the language they read at home. [How the regional-language text is produced: saved templates or translation].

        **WhatsApp first.** On Premium and Enterprise, the appointment reminder and the prescription go to the patient on WhatsApp, and the patient can reply to confirm the visit. On Professional, reminders go by SMS and email. [WhatsApp sender for Indian clinics: the clinic's own number or Easy Clinic's, and who pays the message charges].
      aside: >-
        **Where it stops.** Easy Clinic does not run fully offline today. [Which tasks still work without
        internet, if any]. If your clinic loses its line for hours at a time, tell us before you buy, and we
        will show you what the screen does when the connection goes.
      width: measure

  # Block 6: the four clinic types, each with an Indian example from src/data or a placeholder.
  - discriminant: clinicTypes
    value:
      id: clinic-types
      heading: Solo clinics to hospital OPDs, with an Indian example of each
      intro: Pick the one closest to yours. Each card links to the page written for that kind of clinic.
      items:
        - persona: solo
          title: Solo doctor clinics
          body: >-
            One doctor and a receptionist, with no IT staff to call when something breaks. The thirty-second
            prescription comes from saved shortcuts and the bill comes from the visit, so the evening is no
            longer spent finishing notes.
          example: Dr Manish Bhatia runs Asha Homeopathy Medical Center in Jaipur and has used Easy Clinic for more than 10 years.
          href: /solutions/solo-clinic/
        - persona: polyclinic
          title: Polyclinics and specialist centres
          body: >-
            One record for every specialist the patient sees, with shared rooms and slots. Roles decide who
            sees what: the reception login books and bills, but it cannot open the EMR or write a
            prescription.
          example: Aditya Women and Infertility Clinic, an obstetrics and fertility centre in Hyderabad, has run on Easy Clinic since 2012.
          href: /solutions/polyclinic/
        - persona: chain
          title: Clinic chains
          body: >-
            Central price lists, standard SOPs, stock moved between branches and a morning view of each
            branch's KPIs. Branch drift shows up in the numbers before it shows up in patient complaints.
          example: '[Indian clinic chain on Easy Clinic: name, city and number of branches]'
          href: /solutions/clinic-chain/
        - persona: hospital-opd
          title: Hospital OPDs and nursing homes
          body: >-
            Token queues and doctor schedules at the front desk, pharmacy and lab turnaround behind it, TPA
            claims from the same bill and a daily view of throughput. Easy Clinic runs the outpatient side
            and is not a full hospital information system.
          example: Dr Prantar Chakrabarti at the Institute of Hematology and Transfusion Medicine has used Easy Clinic since 2008.
          href: /solutions/hospital-opd/

  # Block 7: local testimonial (assigned to this page only).
  - discriminant: testimonialRow
    value:
      id: hyderabad-clinic
      heading: A hospital director on Easy Clinic
      items: [tarun-mishra]
      layout: single
      usePullQuote: true

faqHeading: Questions Indian clinic owners ask
faq:
  - question: Which ABDM milestones does Easy Clinic support today?
    answer: >-
      M1, creating and verifying the patient's ABHA number, is [ABDM M1 status as of date]; M2, linking
      health records to the ABHA, is [ABDM M2 status as of date]; and M3, health information exchange, is
      [ABDM M3 status as of date]. The compliance table on this page carries the same status and date for
      each milestone. Until a milestone shows Live with a date, plan your clinic as if it is not available.
  - question: How much does Easy Clinic cost in India?
    answer: >-
      Professional costs {price:inr.professional.annual} and Premium {price:inr.premium.annual} per doctor
      per month when paid annually, or {price:inr.professional.quarterly} and
      {price:inr.premium.quarterly} when paid quarterly. Enterprise, for chains and hospital OPDs, is priced
      on quote. A reception login is included and there is no setup fee. The [India pricing page](/pricing/india/)
      lists every add-on.
  - question: Is GST included in the price, and do patient bills show GST?
    answer: >-
      [Whether INR plan prices include 18% GST or it is added] on Easy Clinic's invoice to your clinic. On
      the bills you give patients, GST invoicing with the HSN or SAC code and the GST amount on taxable
      lines such as pharmacy sales is [GST invoicing status as of date], the same as the GST row in the
      compliance table.
  - question: Does Easy Clinic work offline when the internet goes down?
    answer: >-
      No, Easy Clinic does not run fully offline today. [What still works without internet, and what is
      saved when the connection drops mid-consult]. We suggest a mobile hotspot as a backup line, and a
      clinic that loses its line for hours at a time can ask about running Easy Clinic on its own server:
      [self-hosted option for Indian clinics: which plans, what it costs and what still needs the
      internet].
  - question: How is Easy Clinic different from Practo Ray?
    answer: >-
      [The main difference between Easy Clinic and Practo Ray, from the comparison page verdict]. The
      [Easy Clinic vs Practo Ray](/easyclinic-vs-practo/) page puts published price, WhatsApp, billing and
      GST, and multi-branch support side by side, with a source and a date for every cell, and says what
      moving your records across involves.
  - question: How does Easy Clinic compare with HealthPlix?
    answer: >-
      [The main difference between Easy Clinic and HealthPlix, from the comparison page verdict]. The
      [Easy Clinic vs HealthPlix](/easyclinic-vs-healthplix/) page compares the two on published price, AI
      documentation, billing and GST, and patient discovery, with a source and a date for every cell.
  - question: Can prescriptions print in Hindi or other Indian languages?
    answer: >-
      Easy Clinic prints prescriptions in English and in [prescription languages besides English]. If your
      patients read a language that is not on that list, ask before you sign up, because adding one takes
      [time to add a prescription language].
  - question: Is patient data stored in India?
    answer: >-
      Patient data for Indian clinics is hosted in [hosting region and provider for Indian clinics]. Under
      the DPDP Act 2023 your clinic is the data fiduciary and Easy Clinic processes the data on its behalf.
      If you leave, [what data you get back on leaving, in what format, and how long Easy Clinic keeps a
      copy].
  - question: Are Easy Clinic e-prescriptions valid under NMC rules?
    answer: >-
      [Whether an Easy Clinic e-prescription carries everything the NMC guidelines ask for, as of date],
      and every prescription prints [fields on an Easy Clinic e-prescription, such as registration number
      and signature]. For teleconsults, the NMC Telemedicine Practice Guidelines limit which medicines you can
      prescribe at a first consult, and following those lists stays the doctor's responsibility; [what
      Easy Clinic checks against the NMC medicine lists].
  - question: How long does it take to go live?
    answer: >-
      At the fastest, a clinic is live {fact:goLiveDays} days after the demo. Training runs over
      {fact:trainingDays} days and takes about two hours in total: 40 minutes on the first day, 40 on the
      second, then 20 and 20. Moving records from another system adds [data migration time for an Indian
      clinic], and a chain takes [go-live time for a multi-branch chain].

