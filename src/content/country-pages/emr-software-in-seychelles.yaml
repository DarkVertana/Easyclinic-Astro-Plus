faqHeading: Questions clinic owners in Seychelles ask
faq:
  - question: 'Is Easy Clinic suitable for clinics in Victoria and Mahé?'
    answer: 'Yes. Easy Clinic works for clinics in Victoria, Mahé, Praslin and La Digue as well as healthcare facilities across Seychelles.'
  - question: 'Can Easy Clinic manage clinics across multiple islands?'
    answer: 'Yes. Clinics operating across different islands can manage operations through one central EMR software dashboard.'
  - question: Is patient data secure on Easy Clinic EMR systems?
    answer: >-
      Yes. Easy Clinic uses secure cloud infrastructure and role-based access to protect patient data. We do not
      misuse, sell or pry on your data, and all records belong only to you.
  - question: Does Easy Clinic support telemedicine in Seychelles?
    answer: Yes. Clinics can offer teleconsultations and remote follow-ups for patients who cannot reach the clinic.
  - question: Can Easy Clinic integrate SMS and WhatsApp communication?
    answer: Yes. Clinics can send appointment reminders and patient updates through integrated messaging tools.
  - question: Does Easy Clinic support inventory and pharmacy management?
    answer: Yes. Clinics can manage medicine stock and receive alerts for low stock and expiries, reducing wastage.
  - question: What is the difference between AI EMR software and EHR software?
    answer: >-
      AI EMR software includes automation, analytics and intelligent workflows, while EHR software mainly focuses
      on storing patient records.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      No. Easy Clinic runs in the browser over the internet and does not run fully offline today, so each clinic
      needs a working connection.
  - question: Can clinics in Seychelles transition easily from paper systems to AI EMR software?
    answer: >-
      Yes. Easy Clinic provides onboarding, training and ongoing support to ensure a smooth transition from manual
      systems to digital healthcare platforms.

