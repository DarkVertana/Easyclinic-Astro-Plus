  # 7. Why clinics adopt, with when to switch and the signs in the aside.
  - discriminant: prose
    value:
      id: why-adopt
      eyebrow: Why now
      heading: Why clinics in Fiji are adopting AI EMR software and EHR software
      tone: plain
      body: |
        Fiji's healthcare system serves both urban centres and remote islands, requiring efficient and connected solutions for coordinated care delivery.

        - Paper-based systems are difficult to manage across multiple islands
        - Traditional EHR software lacks automation and remote accessibility
        - Manual billing and reporting processes create inefficiencies
        - Clinics require scalable clinic management software to support expansion
        - Patients expect faster service and digital communication
        - Role-based access control keeps patient data secure

        Centralised patient records stay accessible across islands and facilities, with built-in SMS, WhatsApp and teleconsultation.
      aside: |
        **When should clinics in Fiji switch to AI EMR software?**

        In a geographically distributed healthcare system like Fiji, early adoption of AI EMR software means better coordination, efficiency and patient outcomes.

        **Signs your clinic needs AI EMR software or EHR software**

        - Patient records are still managed using paper files or spreadsheets
        - Appointment scheduling leads to delays or coordination issues
        - Billing errors or payment tracking issues are frequent
        - Inventory management lacks real-time visibility
        - You manage multiple clinics or health centres across islands
        - You want to offer telemedicine and digital patient engagement
      width: wide

  # 8. Problems solved: four problem panels.
  - discriminant: painBlocks
    value:
      id: problems-we-solve
      eyebrow: Problems we solve
      heading: The problems Easy Clinic solves for clinics in Fiji
      tone: wash
      items:
        - heading: Clinic operations
          body: |
            - Inefficient appointment scheduling across doctors, specialties and rooms
            - Long patient wait times and overcrowded reception areas
            - Lack of coordination between front desk, nursing and doctors
            - Difficulty enforcing clinical protocols and SOPs across teams
        - heading: Finance and inventory
          body: |
            - Missed billing for services, consumables or lab work due to manual processes
            - Pricing inconsistencies across clinics or patient types
            - Stockouts, expiries or pilferage due to poor inventory tracking
            - Delayed or inaccurate reconciliation of payments and claims
        - heading: Patient management and EMR
          body: |
            - Scattered or incomplete patient records across visits and branches
            - Doctors waste time rewriting notes or navigating poorly designed EMRs
            - Missed follow-ups and poor chronic care tracking
            - Poor patient engagement, resulting in low retention and fewer repeat visits
        - heading: Centralised control
          body: |
            - No real-time visibility into performance across multiple locations
            - Inconsistent workflows and patient experience between branches
            - Fragmented data across systems with no unified reporting
            - Inability to enforce centralised approvals, pricing or access control

  # 9. Data ownership: the promise, as an exclusion list.
  - discriminant: scopeBox
    value:
      id: your-data
      eyebrow: Your data
      heading: Your data is secure and belongs only to you
      intro: >-
        Ministry of Health reporting and patient confidentiality standards apply across the islands. Easy
        Clinic gives island healthcare centralised EMR systems, with remote care and continuity across
