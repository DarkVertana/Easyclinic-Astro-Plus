  # Why clinics adopt, with when to switch and the signs in the aside.
  - discriminant: prose
    value:
      id: why-adopt
      eyebrow: Why now
      heading: Why clinics in Fiji are adopting AI EMR software
      tone: wash
      body: |
        Fiji's healthcare system serves both urban centres and remote islands, requiring efficient and connected solutions for coordinated care delivery.

        - Paper-based systems are difficult to manage across multiple islands
        - Records kept on paper or in separate systems cannot follow the patient between sites
        - Manual billing and reporting processes create inefficiencies
        - Clinics require scalable clinic management software to support expansion
        - Patients expect faster service and digital communication
        - Role-based access control keeps patient data secure

        Centralised patient records stay accessible across islands and facilities, with built-in SMS, WhatsApp and teleconsultation.
      aside: |
        **When should clinics in Fiji switch to AI EMR software?**

        In a healthcare system spread across islands, moving early to EMR software means better coordination between sites, less paperwork and faster service for patients.

        **Signs your clinic needs EMR software**

        - Patient records are still managed using paper files or spreadsheets
        - Appointment scheduling leads to delays or coordination issues
        - Billing errors or payment tracking issues are frequent
        - Inventory management lacks real-time visibility
        - You manage multiple clinics or health centres across islands
        - You want to offer telemedicine and digital patient engagement
      width: wide
      checklist: true
      media:
        kind: screenshot
        src: ../../assets/images/solutions/8_Appointment.png
        alt: Easy Clinic appointment calendar for two doctors, with day visits, a booking card, a token list and a reminder
        frame: none

