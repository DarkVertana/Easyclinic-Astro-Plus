sections:
  # 1. Definition and comparison: a responsive table (cards on phones).
  - discriminant: dataTable
    value:
      id: what-is-ai-emr
      eyebrow: AI EMR and clinic software
      heading: What is AI EMR software and clinic management software in Fiji?
      intro: |
        AI EMR software in Fiji changes how clinics, hospitals and health centres manage patient care, workflows and communication across island-based healthcare systems. It goes beyond traditional EHR software and standalone clinic management software by combining automation, intelligence and real-time data access into one unified platform.

        While conventional EHR software focuses on storing patient records digitally, **AI EMR software in Fiji integrates clinical workflows, billing systems, analytics and communication tools into a single intelligent system.**
      tone: plain
      caption: EHR software vs clinic management software vs AI EMR software in Fiji
      columns: [Feature, Traditional EHR software, Basic clinic management software, AI EMR software (Easy Clinic)]
      rows:
        - [Patient records, Digital storage only, Limited integration, '**Fully integrated AI EMR system**']
        - [Automation, Minimal, Partial, '**Advanced AI automation**']
        - [Billing and payments, Manual or semi-digital, Moderate, '**Fully automated and accurate**']
        - [Inventory management, Not included, Basic tracking, '**Real-time monitoring with alerts**']
        - [Multi-location support, Difficult, Partial, '**Fully centralised control**']
        - [Analytics, Basic report, Limited insights, '**Advanced dashboards and insights**']
        - [Communication, Not integrated, Limited, '**SMS, WhatsApp, email and teleconsultation**']
        - [Scalability, Low, Moderate, '**High for clinics and hospitals**']

  # 2. Key benefits: an icon card grid.
  - discriminant: moduleGrid
    value:
      id: benefits
      eyebrow: Benefits
      heading: Key benefits of using EMR software in Fiji
      tone: wash
      columns: 3
      items:
        - title: Digital patient records with AI EMR software
          icon: file-text
          outcome: >-
            Store complete patient histories digitally, including consultations, prescriptions, lab reports and
            follow-ups. Doctors open patient information instantly, improving consultation accuracy and speed.
        - title: Smart appointment scheduling for clinics in Fiji
          icon: calendar-clock
          outcome: >-
            Automated booking and digital reminders help clinics in Suva, Nadi and Lautoka manage patient
            visits efficiently, reducing waiting times and improving clinic productivity.
        - title: Simplified billing and revenue management
          icon: receipt
          outcome: >-
            Generate invoices instantly and track payments clearly, so clinics keep accurate financial records
            and better revenue visibility.
        - title: Inventory and pharmacy control
          icon: pill
          outcome: >-
            Track medicines and medical supplies in real time with low stock alerts and expiry monitoring, for
            reliable inventory management.
        - title: Data-driven insights through analytics
          icon: chart-column
          outcome: >-
            Built-in analytics show patient visits, clinic performance and revenue trends, so clinics make
            informed decisions.

