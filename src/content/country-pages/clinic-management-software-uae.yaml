  whatsapp: Hi, I was reading the Easy Clinic page on clinic management software in the UAE and would like a demo for my clinic.

sections:
  # Block 2: local proof strip. The template puts the bare contact card in the hero; this section renders
  # the office, cities and named clients from src/data/countries/ae.yaml (office and clients unknown).
  - discriminant: contactCard
    value:
      id: uae-contact
      heading: How to reach Easy Clinic from the UAE
      intro: >-
        Call {contact:ae.phone} or write to {contact:ae.email} to book a demo, or with a question before
        you book one. [Who gives demos to UAE clinics: a team in the UAE, a partner or the Kolkata team,
        and their hours in UAE time]. After the demo, training is {fact:trainingDays} short sessions, about
        two hours in total, for you and your staff, and a clinic can be live in as little as
        {fact:goLiveDays} days.
      country: ae
      showClients: true

  # Block 3: regulatory deep-dive, one row per authority. Status and dates render from
  # src/data/regulators/ae-*.yaml (all null today). The ae-* files carry no clinicMustDo text, so the
  # clinic's own duties are written per emirate in the intro and that column is switched off.
  - discriminant: regulatorTable
    value:
      id: compliance-by-emirate
      heading: NABIDH, Malaffi and Riayati, emirate by emirate
      intro: |
        Which rules your clinic follows depends on the emirate that licenses it. The clinic applies for its own licences whatever software it uses; what the software has to do is send each visit to the right exchange and each claim to the right platform.

        **Dubai: DHA and NABIDH.** The Dubai Health Authority licenses most clinics in Dubai and each doctor who works in them; clinics in Dubai Healthcare City have their own regulator. The DHA activates a facility licence only with evidence of an EMR that meets the NABIDH standards and a tested connection to NABIDH, Dubai's health information exchange. Insurance claims and prior approvals in Dubai go to insurers electronically through eClaimLink.

        **Abu Dhabi: DoH and Malaffi.** The Department of Health licenses clinics across the emirate of Abu Dhabi, Al Ain included, and every facility it licenses must connect to Malaffi, the emirate's health information exchange, apart from a few categories the DoH exempts. ADHICS, the DoH's healthcare information and cyber security standard, is mandatory for public and private facilities and is a condition of a new or renewed licence, so it covers the clinic's own practices as well as its software.

        **Sharjah and the other Northern Emirates: Riayati.** The Sharjah Health Authority licenses health facilities in Sharjah, and the Ministry of Health and Prevention (MOHAP) licenses them in Ajman, Umm Al Quwain, Ras Al Khaimah and Fujairah. Riayati, MOHAP's national unified medical record, is the shared patient record for facilities in the Northern Emirates. [Whether private clinics in Sharjah and the other Northern Emirates must connect to Riayati, and from when].

        **A group with branches in more than one emirate.** Each branch holds the licence of its own emirate, so a group with a branch in Dubai and one in Abu Dhabi answers to the DHA for one and the DoH for the other, and each branch connects to its own exchange. Easy Clinic runs every branch from one account with central reports. [Whether one Easy Clinic account connects a Dubai branch to NABIDH and an Abu Dhabi branch to Malaffi at the same time, as of date].

        Each row below gives Easy Clinic's status (Live, In certification, Planned or Not applicable) and the date it was last checked. If anything else on this page seems to claim more than the table, go by the table.
      countries: [ae]
      showClinicMustDo: false
      trustLink: true

  # Block 4: money. Prices from src/data/prices/aed.yaml (null today); payments, insurers and tax
  # invoicing from countries/ae.yaml (empty or null today), which the block renders as placeholders.
  - discriminant: countryMoney
    value:
      id: prices-in-dirhams
      heading: Prices in dirhams, and how UAE patients pay
      intro: >-
        Every price is per doctor per month, and the price includes a reception login. There is no setup
        fee and no contract. Health insurance has been compulsory for residents of Dubai and Abu Dhabi for
        years, and since January 2025 employers in the other emirates must insure private-sector staff and
        domestic workers as well, so much of a private clinic's income arrives as an insurance claim, with
        the patient's share taken at the desk. Treatment from a licensed clinic, preventive care included,
        is zero-rated for VAT, while elective cosmetic treatment carries the standard 5%, so a clinic's
        invoice has to put the right rate on each line.
      country: ae
      currency: aed
      payersNote: >-
        Insurance claims come with the Enterprise plan, or with the claims add-on on Professional and
        Premium: payer price lists, a coverage check at registration, the claim built from the bill, and
        reconciliation when the insurer pays. Whether Easy Clinic sends Dubai claims and prior approvals
        through eClaimLink is in the eClaimLink row of the table above. In Abu Dhabi, claims go through the
        DoH's Shafafiya platform, and Easy Clinic's Shafafiya connection is [Shafafiya status as of date].
        UAE insurers and TPAs Easy Clinic clinics bill today: [UAE insurers and TPAs Easy Clinic works with].

  # Block 5: language and connectivity. Arabic support is unknown; ae.yaml languages lists the
  # country's languages, not what the product prints.
  - discriminant: prose
    value:
      id: arabic-whatsapp-mobile
      heading: Arabic, WhatsApp, mobile and the internet
      body: |
        **Arabic.** The patients at a UAE clinic do not all read the same language first, and the prescription and the reminder have to reach each of them in one they read. [Which patient documents Easy Clinic produces in Arabic: prescription, invoice, reminder or patient app, as of date]. [Whether Arabic prints right to left, and whether the staff screens run in Arabic].

        **WhatsApp.** On Premium and Enterprise, the appointment reminder and the follow-up message reach the patient on WhatsApp, sent from the clinic software instead of the receptionist's own phone. On Professional, reminders go by SMS and email. [WhatsApp sender for UAE clinics: the clinic's own number or Easy Clinic's, and who pays the message charges].

        **Phone and tablet.** On the Enterprise plan, patients get their own app and portal. For the doctor away from the desk: [doctor app: which phone platforms, and which screens work on a phone].

        **Internet.** Easy Clinic runs in the browser over the internet, and it does not run fully offline today. If the line drops in the middle of a consult, [what is saved and what is lost when the connection drops mid-consult]. A group that wants patient data on its own servers can ask about the self-hosted option, where Easy Clinic runs on the clinic's own server: [self-hosted option for UAE clinics: plans and cost, and who runs the backups].
      aside: >-
        **Where it stops.** Easy Clinic runs the outpatient side of a clinic or hospital and is not a full
        hospital information system for the wards. It does not run fully offline today, so a clinic whose
        line drops often needs a second connection, such as a mobile data router, to keep the desk
        working.
      width: measure

  # Block 6: the four clinic types. No UAE client is on file, so every example is a placeholder.
  - discriminant: clinicTypes
    value:
      id: clinic-types
      heading: Solo clinics to hospital OPDs in the UAE
      intro: Pick the one closest to yours. Each card links to the page written for that kind of clinic.
      items:
        - persona: solo
          title: Solo doctor clinics
          body: >-
            One doctor and a receptionist, with no IT staff to call when the printer stops talking to the
            system. The thirty-second prescription comes from saved shortcuts, and the bill comes from the
            same visit.
          example: '[UAE solo clinic on Easy Clinic: name and emirate]'
          href: /solutions/solo-clinic/
        - persona: polyclinic
          title: Polyclinics and specialist centres
          body: >-
            One record for every specialist the patient sees, with shared rooms and slots. Roles decide who
            sees what: the reception login books and bills, but it cannot open the EMR or write a
            prescription. With the claims add-on, the front desk checks the patient's insurance cover at
            registration, before the consult.
          example: '[UAE polyclinic or specialist centre on Easy Clinic: name and emirate]'
          href: /solutions/polyclinic/
        - persona: chain
          title: Clinic groups across emirates
          body: >-
            One account for branches in more than one emirate, with central price lists, standard SOPs,
            stock moved between branches and a morning view of each branch's KPIs, so branch drift shows in
            the numbers. Each branch still answers to its own emirate's regulator.
          example: '[UAE clinic group on Easy Clinic: name, emirates and number of branches]'
          href: /solutions/clinic-chain/
        - persona: hospital-opd
          title: Hospital OPDs and medical centres
          body: >-
            Token queues and doctor schedules at the front desk, pharmacy and lab turnaround behind it,
            insurer claims from the same bill and a daily view of throughput. Easy Clinic runs the outpatient
            side and is not a full hospital information system.
          example: '[UAE hospital OPD or medical centre on Easy Clinic: name and emirate]'
          href: /solutions/hospital-opd/

  # Block 7: proof. Every testimonial in src/data/testimonials is placed on another page and none is from
  # the UAE, so this is the ratings badge block with a visible request for a UAE quote.
  - discriminant: proofBlock
    value:
      id: ratings
      heading: How clinics rate Easy Clinic
      intro: >-
        No clinic in the UAE is quoted on this page yet: [UAE testimonial: doctor or owner, clinic and
        emirate, with a quote and consent on file]. These are Easy Clinic's public ratings, from clinics of
        every kind, and they are not ratings from the UAE alone.
      variant: badges
      badges:
        - label: Capterra
          rating: '{fact:capterraRating}'
          href: https://www.capterra.com/p/10026882/Easy-Clinic/reviews/
        - label: Google
          rating: '{fact:googleRating}'

  # Section 11 "Country pages": the Heidi-style compliance panel, with one chip per ae-* regulator file,
  # linking /privacy/uae/ (in the intro) and /trust/ (the strip link).
  - discriminant: regulatorStrip
    value:
      id: compliance-in-the-uae
      heading: Compliance in the UAE
      intro: |
        Each chip gives Easy Clinic's status with a UAE regulator or law and the date it was last checked; the table higher up this page says what each one asks of your clinic.

        **Your patient data.** The records belong to your clinic, and Easy Clinic does not sell or misuse them. The ICT Health Law, Federal Law No. 2 of 2019, keeps health data inside the UAE unless an exemption applies, and Easy Clinic keeps UAE patient data in [hosting region and provider for UAE clinics]. The [privacy page for UAE clinics](/privacy/uae/) sets out what the PDPL and the ICT Health Law ask of your clinic.
      regulators: [ae-nabidh, ae-malaffi, ae-riayati, ae-adhics, ae-eclaims, ae-pdpl]
      link: /trust/

faqHeading: Questions UAE clinic owners ask
faq:
  - question: Is Easy Clinic approved for NABIDH in Dubai?
    answer: >-
      Easy Clinic's NABIDH connection is [NABIDH status as of date]. Whatever software a Dubai clinic
      uses, the DHA activates its facility licence only with evidence of an EMR that meets the NABIDH
      standards and a tested NABIDH connection. If the status is not Live with a date, ask how your
      visits would reach NABIDH before you sign.
  - question: Does Easy Clinic connect to Malaffi in Abu Dhabi?
    answer: >-
      Easy Clinic's Malaffi connection is [Malaffi status as of date]. Every facility the Department of
      Health licenses in Abu Dhabi must connect to Malaffi, apart from a few categories the DoH exempts.
      ADHICS, the DoH's healthcare information and cyber security standard, is a condition of the
      clinic's own licence and covers the systems that hold its patient data, and Easy Clinic's ADHICS
      status is [ADHICS status as of date].
  - question: What about Riayati in Sharjah and the Northern Emirates?
    answer: >-
      Easy Clinic's Riayati connection is [Riayati status as of date]. Riayati is MOHAP's national
      unified medical record and the shared patient record for facilities in the Northern Emirates,
      where the Sharjah Health Authority licenses clinics in Sharjah and MOHAP licenses them in Ajman,
      Umm Al Quwain, Ras Al Khaimah and Fujairah. [Whether private clinics in Sharjah and the other
      Northern Emirates must connect to Riayati, and from when].
  - question: Can Easy Clinic send claims and prior approvals through eClaimLink?
    answer: >-
      eClaimLink submission from Easy Clinic is [eClaimLink status as of date]. In Dubai, claims and
      prior approvals go to insurers electronically through eClaimLink, and in Easy Clinic, claims come
      with the Enterprise plan or with the claims add-on on Professional and Premium. If the status is
      not Live with a date, plan your Dubai claims outside Easy Clinic.
  - question: Is patient data kept inside the UAE?
    answer: >-
      Patient data for UAE clinics is hosted in [hosting region and provider for UAE clinics]. The ICT
      Health Law, Federal Law No. 2 of 2019, keeps health data inside the UAE unless an exemption
      applies, so get the hosting region in writing before you sign. On the Enterprise plan a group can ask for private
      cloud hosting. The records belong to your clinic, and if you leave Easy Clinic, [what data a clinic
      gets back on leaving and in what format, and how long Easy Clinic keeps a copy].
  - question: Can prescriptions and reminders go to patients in Arabic?
    answer: >-
      [Whether Easy Clinic prints prescriptions and sends reminders in Arabic, as of date], and the staff
      screens run in [staff screen languages for UAE clinics]. The patients at a UAE clinic do not all read
      the same language first, so check the language of the printed prescription as well as the language
      of the screen.
  - question: What does my DHA licence need from the clinic software?
    answer: >-
      To activate a facility licence, the DHA asks for evidence of an EMR that meets the NABIDH minimum
      data set and connectivity standards, and for a copy of the approval email for a tested NABIDH
      connection. Those two items depend on your software, and Easy Clinic's NABIDH status is [NABIDH
      status as of date]. The facility licence and each doctor's licence are applications the clinic
      makes itself, whatever software it uses. [Documents Easy Clinic provides for a DHA licence or
      inspection, such as the NABIDH connectivity approval].
  - question: What does Easy Clinic cost in dirhams?
    answer: >-
      Professional costs {price:aed.professional.annual} per doctor per month on the annual plan, with a
      reception login included and no setup fee. Enterprise, for clinic groups and hospital OPDs, is
      priced on a quote, and the [UAE pricing page](/pricing/uae/) has Premium, quarterly billing, the
      add-ons and how VAT applies to the subscription.
  - question: Is Easy Clinic right for a small Dubai clinic as well as a large group?
    answer: >-
      Both run on the same software on different plans: a one-doctor clinic starts on Professional at
      {price:aed.professional.annual} per doctor per month, and a group needs Premium for a second
      location or Enterprise for central control across branches. What changes for a group is the
      regulator, because each branch answers to its own emirate, so a Dubai branch connects to NABIDH and
      an Abu Dhabi branch to Malaffi. [Whether one Easy Clinic account connects a Dubai branch to NABIDH
      and an Abu Dhabi branch to Malaffi at the same time, as of date].
  - question: How long does it take to go live?
    answer: >-
      At the fastest, a clinic is live {fact:goLiveDays} days after the demo. Training runs over
      {fact:trainingDays} days and takes about two hours in total: 40 minutes on the first day, 40 on the
      second, then 20 and 20. Moving records from another system adds [data migration time for a UAE
      clinic, and which systems Easy Clinic imports from], and connecting a new clinic to its emirate's
      exchange adds [time to connect a new UAE clinic to NABIDH, Malaffi or Riayati].

