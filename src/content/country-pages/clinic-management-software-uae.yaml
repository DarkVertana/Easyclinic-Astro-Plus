  Easy Clinic is clinic management software for clinics in Dubai, Abu Dhabi and the Northern Emirates,
  and this page states its connection to the patient record exchange each emirate uses (NABIDH,
  Malaffi or Riayati) with the date each was checked. It costs {price:aed.professional.annual} per
  doctor per month on the annual Professional plan, and [named UAE client or launch partner, and its
