  - 'OWNER: PRODUCT (integrations and features). [Shafafiya status as of date] (Abu Dhabi claims, payersNote; no regulator file exists for Shafafiya, the DoH''s e-claims platform at https://www.doh.gov.ae/en/shafafiya, so consider adding regulators/ae-shafafiya.yaml); [UAE insurers and TPAs Easy Clinic works with] (countries/ae.yaml insurers is empty); UAE payment methods at the desk and online (countries/ae.yaml payments is empty, rendered by countryMoney); VAT tax invoices with the clinic''s TRN (countries/ae.yaml taxInvoicing is null, rendered by countryMoney); [Whether one Easy Clinic account connects a Dubai branch to NABIDH and an Abu Dhabi branch to Malaffi at the same time, as of date] (table intro, FAQ 9); Arabic, in three brackets (block 5 twice, FAQ 6): which patient documents are produced in Arabic, right-to-left printing and staff screen languages (countries/ae.yaml languages lists the country''s languages and says nothing about the product); [WhatsApp sender for UAE clinics: the clinic''s own number or Easy Clinic''s, and who pays the message charges]; [doctor app: which phone platforms, and which screens work on a phone]; [what is saved and what is lost when the connection drops mid-consult]; [self-hosted option for UAE clinics: plans and cost, and who runs the backups]; [data migration time for a UAE clinic, and which systems Easy Clinic imports from]; [time to connect a new UAE clinic to NABIDH, Malaffi or Riayati] (FAQ 10); [Documents Easy Clinic provides for a DHA licence or inspection, such as the NABIDH connectivity approval] (FAQ 7).'
  - 'OWNER: PRODUCT AND HOSTING (data). [hosting region and provider for UAE clinics] (compliance panel, FAQ 5; the same bracket as /trust/) and [what data a clinic gets back on leaving and in what format, and how long Easy Clinic keeps a copy] (FAQ 5; the same bracket as the Kenya page). The ICT Health Law in-country rule makes the hosting answer the one a UAE buyer checks first; if UAE data is hosted outside the UAE, say so and name the exemption relied on (Ministerial Resolution No. 51 of 2021 lists them), or cut the offer to UAE clinics.'
  - 'OWNER: LEGAL OR A UAE ADVISER (to check before publishing). The regulator statements describe the rules only, never Easy Clinic''s status. Checked against the regulators'' own sites on 2026-09-26: the DHA activates a facility licence only with "evidence of the installation of Electronic Medical Record (EMR) system that complies with the NABIDH Minimum Data Set, connectivity requirements, and other NABIDH standards" and a "Copy of approval email for tested connectivity with NABIDH" (DHA Manual for Licensing Health Facility v1.1, 20/11/2024, clauses 7.2.4 and 7.2.6.10, https://www.dha.gov.ae/uploads/122024/Manual%20for%20Licesning%20Health%20Facility-202420241233143.pdf; table intro, FAQ 1 and 7); "all licensed DOH healthcare facilities, except for those exempt, connect to Malaffi" (https://www.malaffi.ae/providers/facilities-required-to-connect/); ADHICS is "mandatory for all healthcare facilities in the public and private sector" and "mandatory for licensing healthcare practitioners and facilities (New or Renew)" (https://www.doh.gov.ae/en/news/department-of-health-launches-abu-dhabi-healthcare-information-and-cyber-security); the Sharjah Health Authority grants the initial approval and permanent licence for healthcare facilities in Sharjah (https://sha.shj.ae/services-en.html), so the earlier line that MOHAP licenses Sharjah clinics was corrected; Shafafiya is the DoH''s claims platform (https://www.doh.gov.ae/en/shafafiya); healthcare services from a licensed provider, preventive treatment included, are zero-rated and elective cosmetic treatment is excluded (Cabinet Decision No. 52 of 2017, Article 41, https://tax.gov.ae/-/media/Files/FTA/links/Legislation/VAT/03-Cabinet-Decision-52-of-2017.pdf); Article 13 of Federal Law No. 2 of 2019 keeps health data in the UAE unless the health authority or the Minister approves otherwise. Still from secondary sources only: that MOHAP licenses facilities in Ajman, Umm Al Quwain, Ras Al Khaimah and Fujairah; that Dubai Healthcare City has its own regulator (DHCR); that since 1 January 2025 private-sector employers and sponsors of domestic workers in the Northern Emirates must buy basic health insurance (MOHRE scheme, reported by Gulf News; mohre.gov.ae refused the connection); that eClaimLink carries prior authorisations as well as claims. [Whether private clinics in Sharjah and the other Northern Emirates must connect to Riayati, and from when] (table intro, FAQ 3): third-party guides say MOHAP checks it at licence renewal, but no MOHAP or SHA circular was found. /privacy/uae/ does not exist yet; the compliance panel and related links point to it (spec 5.19 legal review). The PDPL (Federal Decree-Law No. 45 of 2021) excludes health data that has its own legislation, so that page should explain which law governs which data.'
  - 'OWNER: MARKETING (metadata). Title rewritten from the spec 4.2 row ("NABIDH and DHA Ready Clinic Software in UAE"), which states a status; restore it only once ae-nabidh is Live with a date. The SERP note says every competitor puts NABIDH in the title, so this matters for ranking. H1 follows the 4.2 row; spec 5.13 block 1 asks for the regulator in the H1, so add NABIDH only once ae-nabidh is Live. Meta description follows the 4.2 row with the AED price token added and "stated per emirate" shortened; it is 134 characters by the linter count (tokens as 7) and about 136 with a price such as AED 1,299 and states no status. Secondary keywords "NABIDH compliant", "Malaffi integrated" and "DHA approved" are kept from the 4.2 row as metadata only (the templates do not render secondaryKeywords); no copy says any of them. The exchange list of three (NABIDH, Malaffi and Riayati) is factual, as each is the health information exchange of one licensing area, and follows the 4.2 row.'
  - 'OWNER: EDITORIAL. Author is Subhashish Saha (Head of customer success) until a named UAE country lead exists (spec 2.7). The editorial pass is an AI review; a human editor, ideally someone who has sold to UAE clinics, still reads the page aloud (spec 6.5). The page has no measured number from the UAE; the numbers it carries are the site-wide go-live and training facts. Demo length is 20 minutes, matching /uaedemo/ and /pricing/uae/ in the rebuild; https://www.easyclinic.io/uaedemo/ returned 404 on 2026-09-26. Structure: hero chips (NABIDH, Malaffi, Riayati; heroStrip.ratings off because the proof block shows the ratings), then spec 5.13 blocks 2 to 7, then the section 11 compliance panel before the FAQ. The panel and the table show the same six chips; once statuses are filled, drop one if the page reads as repetitive. Cannibalisation (spec 4.5 rule 4): this page owns the regulator explainer; /uaedemo/ also carries a regulatorTable and NABIDH, eClaimLink and hosting FAQs in near-identical wording, so trim those on the demo page to one line each with a link here.'
  - 'PUBLIC FACTS USED, from https://www.easyclinic.io/emr-software-in-uae/ (read 2026-09-26): branches in more than one emirate run from one account with central reporting ("Clinics with branches in Dubai, Abu Dhabi, Sharjah, and other Emirates can manage all operations through one central EMR software dashboard"), in the table intro and the clinic-group card; "30-Second Prescriptions", in the solo card; the patient data belongs to the clinic and is not sold or misused ("we DO NOT misuse, sell or pry on your patient, clinical, financial or administrative data. All the data and records belong ONLY to you."), in the compliance panel and FAQ 5; hello@easyclinic.io ("Contact support at hello@easyclinic.io"), added to countries/ae.yaml contact.email. From src/data and the page-writing rules: plan inclusions and conditions (plans.yaml), {fact:goLiveDays}, {fact:trainingDays} and the 40, 40, 20, 20 minute training split (live /pricing/ FAQ), "does not run fully offline today" and the self-hosted option (live Kenya listicle), "not a full hospital information system" (/solutions/hospital-opd/). Not used: "Best EMR Software in UAE 2026", "reduces no-shows" (unmeasured), "Clinics Trust Us. The Industry Awards Us." (no award named), the Dubai Marina and Abu Dhabi hospital group lines (illustrative, not clients), the teleconsultation "across all emirates" line (DHA and DoH telehealth rules are not covered), and the free-trial and compliance lines noted above.'
