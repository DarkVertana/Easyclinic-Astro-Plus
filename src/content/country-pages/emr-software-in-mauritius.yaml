faqHeading: Questions Mauritian clinic owners ask
faq:
  - question: Is Easy Clinic suitable for clinics in Port Louis and across Mauritius?
    answer: >-
      Yes. Easy Clinic works for clinics, polyclinics and hospitals in Port Louis, Curepipe, Quatre Bornes,
      Beau Bassin-Rose Hill, Vacoas-Phoenix, Mahébourg and across the island.
  - question: Does Easy Clinic support insurance and payor claims in Mauritius?
    answer: Yes, Easy Clinic includes insurance and payor claims management as part of its clinic management features.
  - question: Can patients book teleconsultations through Easy Clinic?
    answer: >-
      Yes, Easy Clinic supports teleconsultation alongside in-person appointment scheduling, connecting patients
      across the island and outer regions.
  - question: Is Easy Clinic suitable for a single-doctor clinic in Mauritius?
    answer: Yes, Easy Clinic works for solo practitioners as well as large multi-location hospital groups.
  - question: Does Easy Clinic handle pharmacy, billing and patient reminders?
    answer: >-
      Yes. It tracks inventory with low-stock alerts, automates billing, and sends reminders over WhatsApp, SMS
      and email.
  - question: Can Easy Clinic generate reports on clinic performance?
    answer: >-
      Yes, Easy Clinic provides reports on patient visits, revenue and clinic performance, so owners see clinic
      performance without building reports by hand.
  - question: Is patient data secure on Easy Clinic?
    answer: >-
      Yes, Easy Clinic is a secure, cloud-based platform designed to protect sensitive patient health
      information. We do not misuse, sell or pry on your data, and all records belong only to you.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      No. Easy Clinic runs in the browser over the internet and does not run fully offline today, so each clinic
      needs a working connection.
  - question: How much does Easy Clinic cost for a clinic in Mauritius?
    answer: >-
      Every plan is priced per doctor per month, and the pricing page lists current plans. Book a demo for a
      quote based on your clinic size and the modules you need.

