notes:
  - 'Structure follows /emr-software-in-kenya/ as /emr-software-in-malaysia/ and /emr-software-in-maldives/ do: hero with contact card, local proof strip (contactCard, cities only), rules (dataTable; no mu-* regulator files exist), money (moduleGrid of billing and claims; no MUR price list), connectivity prose with a "where it stops" aside, clinic types, rating badges in the testimonial slot (no Mauritian testimonial on record; every testimonial on the live page is placed elsewhere, spec 2.4), the study, FAQ, related links, closing.'
  - 'Owner decision 2026-10-14: unconfirmed claims are removed. Cut: "DPA 2017 compliance built in", "encryption and access controls aligned with the DPA 2017" and the compliance FAQ answer "Yes"; English and French care and the bilingual FAQ; MUR billing, MCB Juice and "plans are priced in Mauritian rupees"; "the same AI EMR engine runs for clinics in Mauritius today" (no Mauritian client is on record). The Act is described as a rule for the clinic, with no Easy Clinic status claimed.'
  - 'Added from the repo, not the live page: "does not run fully offline today" (migration/research/facts.md), in the aside and an FAQ.'
  - 'Edits the publish rules required: banned words removed ("seamless", "modern clinics", "robust"); "EasyClinic" written as "Easy Clinic"; "proven results" cut (claims rule); headings in sentence case.'
  - 'FAQ: 9 of the live page''s 13 plus the offline answer, leaving out compliance, bilingual, Vacoas-Phoenix and Mahébourg (folded into the first answer) and the separate pharmacy and reminders questions (the combined one is kept).'
  - 'Home page: the home related links already hold nine (the schema maximum), so Mauritius stays in the RelatedLinks OTHER_MARKETS pills, which now link to this page instead of the countries hub.'
  - 'Contact: no Mauritius contact or office is on record (src/data/countries/mu.yaml); the card names the Easy Clinic support team and its main line. There is no Mauritius demo page; demo CTAs go to the countries page demo form.'
