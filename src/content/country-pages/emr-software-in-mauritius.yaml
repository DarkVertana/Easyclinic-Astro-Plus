faqHeading: Questions Mauritian clinic owners ask
faqHelp: Message our India WhatsApp line on +91 91477 70277, or ask the team that sets up and supports your clinic.
faq:
  - question: Is Easy Clinic suitable for clinics in Port Louis and across Mauritius?
    answer: >-
      Yes. Easy Clinic runs solo clinics, polyclinics and clinic chains in Port Louis, Curepipe, Quatre Bornes, Beau Bassin-Rose Hill, Vacoas-Phoenix, Mahébourg and across the island. One login covers every specialty, and each role works from its own queue. It runs in any browser on a laptop or tablet.
  - question: How much does Easy Clinic cost for a clinic in Mauritius?
    answer: >-
      Easy Clinic is priced per doctor. Professional is $79 and Premium $99 per doctor per month, billed annually, and Enterprise is on a quote. Every plan includes a login for your receptionist at no extra cost, and there is no setup fee for clinics up to 5 users. Ask us for rupee pricing.
  - question: Does Easy Clinic support insurance and payor claims in Mauritius?
    answer: >-
      Yes. The patient's insurer is linked at registration, cover is checked during the visit, and the claim is built from the bill with the documents attached. Claims are tracked from submitted to settled. Insurance claims come with Enterprise, or as an add-on on Professional and Premium.
  - question: Can Easy Clinic serve medical tourism patients?
    answer: >-
      Yes. Every visit note, prescription, lab report and invoice sits on one patient record, so a visiting patient leaves with clear documents. Prescriptions and reports can go to the patient on WhatsApp or email, and follow-ups after they fly home can run as video consultations on Premium and Enterprise.
  - question: Can patients book teleconsultations through Easy Clinic?
    answer: >-
      Yes. Premium and Enterprise include built-in video consultations, booked from the same calendar as in-person visits. Patients across the island can see their doctor without travelling, and every video visit stays on the same patient record. Prescriptions from a video visit go to the patient on WhatsApp.
  - question: Does Easy Clinic handle pharmacy, billing and patient reminders?
    answer: >-
      Yes. The pharmacy sees each prescription before the patient arrives, and stock drops only on dispense. One invoice covers the consultation, tests and medicines. Reminders go out on WhatsApp, SMS or email the day before and on the day of the visit, never at night.
  - question: Is Cura AI included in every plan?
    answer: >-
      Cura AI is a paid add-on that works with any plan. It runs in the background at registration, triage and the consultation. It flags what does not add up, such as a missed allergy, and suggests diagnosis and treatment. The clinic sets the triggers and alert style, and the doctor always decides.
  - question: Is patient data secure on Easy Clinic?
    answer: >-
      Yes. Records are protected with role-based access, audit logs and encryption in transit and at rest, and Easy Clinic lists compliance with HIPAA and GDPR. Your patient data belongs to your clinic and is never sold. These controls support your duties under the Data Protection Act 2017.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      Easy Clinic is cloud-based software, so it needs an internet connection to run, and it does not work fully offline today. For uninterrupted service, most clinics keep a mobile data hotspot as a backup line, so registration, prescriptions and billing carry on if the main connection drops.
  - question: How can clinics in Mauritius get started?
    answer: >-
      Book a 20-minute demo built around your own clinic day. Most clinics go live within 2 to 4 weeks. Easy Clinic builds your prescription format from your own sample, imports your old records and trains each role, and your dedicated account manager stays with you after go-live.

