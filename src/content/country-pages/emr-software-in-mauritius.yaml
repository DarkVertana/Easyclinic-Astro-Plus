sections:
  # Block 2: local proof strip. The template also puts the bare contact card in the hero; this section renders
  # the rest (cities) from src/data/countries/mu.yaml.
  - discriminant: contactCard
    value:
      id: mauritius-team
      heading: Easy Clinic in Mauritius, and how to reach the team
      intro: >-
        Write to hello@easyclinic.io or call the Easy Clinic team to book a demo, or with a question before you
        book one. Whether you run a solo clinic in Port Louis or a multi-location group across the island, Easy
        Clinic scales with you.
      tone: plain
      country: mu
      showClients: false

  # Block 3: rules. A plain table of what each one asks of the clinic; no Easy Clinic status is claimed because
  # none is on record (no mu-* files in src/data/regulators/).
  - discriminant: dataTable
    value:
      id: rules-in-mauritius
      eyebrow: Rules in Mauritius
      heading: Mauritian rules and what each one asks of your clinic
      intro: >-
        Mauritius has growing demand for healthcare, driven by local patients and a strong medical tourism
        sector. Clinics are moving off paper to stay competitive and to meet the rules on patient data.
      tone: wash
      columns: [Rule, What it asks of your clinic]
      rows:
        - ['**Data Protection Act 2017**', 'Rules on how the clinic holds and protects patient data.']
        - ['**Ministry of Health and Wellness guidance**', 'Data protection and structured reporting standards for the clinic.']
      note: >-
        Easy Clinic's own compliance status for each rule is not stated on this page. Ask the team before you
        buy, and plan your clinic's Data Protection Act duties whatever software you use.

  # Block 4: billing and claims, as a card grid (no prices: no Mauritian rupee price list exists).
  - discriminant: moduleGrid
    value:
      id: billing-and-claims
      eyebrow: Billing and claims
      heading: Billing, insurance claims and records at a Mauritian clinic
      intro: >-
        Every plan is priced per doctor per month; see the [pricing page](/pricing/) for current plans. These are
        the parts of Easy Clinic a Mauritian clinic uses every day.
      tone: plain
      columns: 2
      items:
        - title: Insurance and payor claims
          icon: shield-check
          outcome: >-
            Insurance and payor claims management is part of Easy Clinic's clinic management features, so billing
            and claims no longer take too long to reconcile.
          href: /features/insurance-claims/
        - title: Digital patient records with AI EMR software
          icon: file-text
          outcome: >-
            Capture records, prescriptions, vitals and lab results in one place, and open any patient file
            instantly during a consultation.
          href: /features/emr/
        - title: Inventory and pharmacy
          icon: pill
          outcome: Track medicines and supplies in real time, with low-stock alerts and expiry monitoring.
          href: /features/pharmacy-and-inventory/
        - title: Reports without manual work
          icon: chart-column
          outcome: >-
            Dashboards show patient trends, clinic performance and revenue at a glance, so nobody builds reports by
            hand.
          href: /features/reports-and-dashboards/

  # Block 5: medical tourism, communication and connectivity, with the honest limit in the aside.
  - discriminant: prose
    value:
      id: tourism-and-teleconsultation
      heading: Medical tourism patients, teleconsultation and reminders
      tone: wash
      body: |
        **Medical tourism.** Medical tourism patients expect digital records and fast reports, and the visit note, prescription and invoice come from the same record.

        **Teleconsultation.** Teleconsultation connects patients across the island and outer regions, alongside in-person appointment scheduling.

        **Reminders.** Patients today expect fast prescriptions, WhatsApp reminders and instant access to their treatment history. Appointment and follow-up reminders go out automatically via WhatsApp, SMS and email.

        **AI on top.** The AI EMR engine drafts notes, sends reminders and writes visit summaries automatically, so automation covers staff shortages and less time goes on admin.
      aside: >-
        **Where it stops.** Easy Clinic runs in the browser over the internet and does not run fully offline today.
        If your clinic loses its connection for long periods, tell us before you buy.
      width: measure

  # Block 6: the clinic types.
  - discriminant: clinicTypes
    value:
      id: clinic-types
      heading: Solo clinics to clinic chains in Mauritius
      intro: Easy Clinic adapts to how you work. Pick the one closest to yours; each card links to the page written for that kind of clinic.
      tone: plain
      items:
        - persona: solo
          title: Solo practice
          body: For physicians running their own clinic, with or without a receptionist. Simple EMR, scheduling and billing in one place.
          href: /solutions/solo-clinic/
        - persona: polyclinic
          title: Specialist polyclinic
          body: For OPD practices and polyclinics with several doctors. Add pharmacy and lab modules as you grow.
          href: /solutions/polyclinic/
        - persona: chain
          title: Clinic chains
          body: >-
            For clinic groups across Port Louis, Curepipe, Quatre Bornes, Beau Bassin-Rose Hill and beyond that need
            central management and custom workflows, with centralised visibility into every patient, prescription
            and treatment plan.
          href: /solutions/clinic-chain/
        - persona: ngo
          title: NGO clinic
          body: For non-profit and mission-driven clinics, fixed or mobile, that need affordable digital records.
          href: /features/

  # Proof: rating badges (no Mauritian testimonial is on record, so this takes the Kenya testimonial slot).
  - discriminant: proofBlock
    value:
      id: ratings
      eyebrow: Reviews
      heading: Clinics trust us. The industry awards us.
      tone: wash
      variant: badges
      badges:
        - { label: Capterra, rating: '{fact:capterraRating}', href: 'https://www.capterra.com/p/10026882/Easy-Clinic/reviews/' }
        - { label: Google, rating: '{fact:googleRating}' }

  # Proof: the Penda Health study, from study.yaml.
  - discriminant: proofBlock
    value:
      id: ai-clinical-pilot
      eyebrow: AI clinical pilot
      heading: We built the platform behind the world's largest AI clinical pilot
      tone: plain
      variant: study
      figures: [visits, diagnostic-errors]
      body: >-
        Join the clinics and hospitals that trust Easy Clinic to run daily care. From prompt engineering to
        frontline care, Easy Clinic powered the AI Copilot used with OpenAI across {fig:visits} patient visits at
        Penda Health's clinics in Nairobi.
      link:
        label: Read the article by OpenAI
        href: https://openai.com/index/ai-clinical-copilot-penda-health/

faqHeading: Questions Mauritian clinic owners ask
faq:
  - question: Is Easy Clinic suitable for clinics in Port Louis and across Mauritius?
    answer: >-
      Yes. Easy Clinic works for clinics, polyclinics and hospitals in Port Louis, Curepipe, Quatre Bornes,
      Beau Bassin-Rose Hill, Vacoas-Phoenix, Mahébourg and across the island.
  - question: Does Easy Clinic support insurance and payor claims in Mauritius?
    answer: Yes, Easy Clinic includes insurance and payor claims management as part of its clinic management features.
  - question: Can patients book teleconsultations through Easy Clinic?
    answer: >-
      Yes, Easy Clinic supports teleconsultation alongside in-person appointment scheduling, connecting patients
      across the island and outer regions.
  - question: Is Easy Clinic suitable for a single-doctor clinic in Mauritius?
    answer: Yes, Easy Clinic works for solo practitioners as well as large multi-location hospital groups.
  - question: Does Easy Clinic handle pharmacy, billing and patient reminders?
    answer: >-
      Yes. It tracks inventory with low-stock alerts, automates billing, and sends reminders over WhatsApp, SMS
      and email.
  - question: Can Easy Clinic generate reports on clinic performance?
    answer: >-
      Yes, Easy Clinic provides reports on patient visits, revenue and clinic performance, so owners see clinic
      performance without building reports by hand.
  - question: Is patient data secure on Easy Clinic?
    answer: >-
      Yes, Easy Clinic is a secure, cloud-based platform designed to protect sensitive patient health
      information. We do not misuse, sell or pry on your data, and all records belong only to you.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      No. Easy Clinic runs in the browser over the internet and does not run fully offline today, so each clinic
      needs a working connection.
  - question: How much does Easy Clinic cost for a clinic in Mauritius?
    answer: >-
      Every plan is priced per doctor per month, and the pricing page lists current plans. Book a demo for a
      quote based on your clinic size and the modules you need.

