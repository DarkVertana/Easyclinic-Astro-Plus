  - 'Edits the publish rules required: banned words removed ("seamless", "streamline", "comprehensive", "end-to-end", "robust", "revolutionise", "world-class", "modern clinics"); "EasyClinic" written as "Easy Clinic"; "proven results" cut (claims rule); FAQ questions end with a question mark. Added from the repo: "does not run fully offline today" (migration/research/facts.md). Cut: "DHA and DOH compliance", "compliance-ready EMR systems" and "data management aligned with compliance standards" (no ae-* regulator file has a state; the DHA and DOH are named only as regulators); "premium healthcare standards". The fuller draft /clinic-management-software-uae/ stays a draft; links to it now point here.'
  - 'FAQ: 8 of the live page''s questions plus an offline answer; left out the ones that repeat another answer.'
  - 'Contact: no UAE contact or office is on record (src/data/countries/ae.yaml now names the support team); demo CTAs go to the countries page form.'
