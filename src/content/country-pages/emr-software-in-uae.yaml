faqHeading: Questions clinic owners in the UAE ask
faqHelp: Message our India WhatsApp line on +91 91477 70277, or ask the team that sets up and supports your clinic.
faq:
  - question: 'Is Easy Clinic suitable for clinics in Dubai, Abu Dhabi and Sharjah?'
    answer: >-
      Yes. Easy Clinic runs single clinics, polyclinics, hospital OPDs and clinic chains across the emirates.
      One login covers every specialty, and each role works from its own queue. It runs in any browser on a
      laptop or tablet, so there is no server to buy and nothing to install at the clinic.
  - question: Can Easy Clinic manage branches in different emirates?
    answer: >-
      Yes. Each branch sits in a location dropdown under the same login, with shared patient records and one
      shared stock. A patient seen in Dubai can be seen in Sharjah with the full history on screen. Enterprise
      adds central control of every location and a Power BI data warehouse for clinic chains.
  - question: How much does Easy Clinic cost in the UAE?
    answer: >-
      Easy Clinic is priced per doctor. Professional is $79 and Premium $99 per doctor per month, billed
      annually, and Enterprise is on a quote. Every plan includes a login for your receptionist at no extra
      cost, and there is no setup fee for clinics up to 5 users. Ask us for dirham pricing.
  - question: How does Easy Clinic protect patient data?
    answer: >-
      Easy Clinic lists compliance with HIPAA and GDPR. Records are protected with role-based access, audit
      logs and encryption in transit and at rest, and each person sees only what their role needs. Your
      patient data belongs to your clinic. We never sell it, and you can export it to Excel or PDF at any
      time.
  - question: Can Easy Clinic send WhatsApp reminders and prescriptions?
    answer: >-
      Yes. Prescriptions, invoices, lab reports and appointment reminders go out on WhatsApp on every plan,
      with a monthly allowance by plan. SMS and email work too. Reminders go the day before and on the day of
      the visit, never at night, and Premium adds video consultations for follow-ups.
  - question: Does Easy Clinic support inventory and pharmacy management?
    answer: >-
      Yes. The pharmacy queue shows each prescription before the patient arrives. Batches that expire first
      show on top, the pharmacist can adjust quantity before dispensing, and stock drops only when medicine is
      dispensed. Purchase orders, goods receipt, transfers and stock take are built in, and one stock list can
      serve every branch.
  - question: What is the difference between EMR and EHR software?
    answer: >-
      An EMR is the digital record one clinic keeps for its patients. An EHR is designed to share records
      across hospitals and providers. Easy Clinic is EMR and clinic management software. It holds the full
      record and also runs appointments, billing, pharmacy, lab, reports and patient messages from one login.
  - question: Is Cura AI included in every plan?
    answer: >-
      Cura AI is a paid add-on that works with any plan. It runs in the background at registration, triage
      and the consultation. It flags what does not add up, such as a missed allergy, and suggests diagnosis
      and treatment. The clinic sets the triggers and alert style, and the doctor always decides.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      No. Easy Clinic is cloud software that runs in the browser, so it needs a connection, and it does not
      run fully offline today. Most clinics keep a mobile data hotspot beside the reception computer as a
      backup line, so registration, prescriptions and billing carry on if the main line drops.
  - question: How do clinics move from paper to Easy Clinic?
    answer: >-
      Most clinics go live within 2 to 4 weeks. Easy Clinic builds your prescription format from your own
      sample, imports records from your old system, and trains reception, doctors, lab and pharmacy on their
      own part of the day. Your dedicated account manager stays with you after go-live.

