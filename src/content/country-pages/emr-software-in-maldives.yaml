notes:
  - 'Structure follows /emr-software-in-kenya/ as /emr-software-in-malaysia/ does: hero with contact card, local proof strip (contactCard, cities only), rules (dataTable; no mv-* regulator files exist), money (moduleGrid of records and billing; no rufiyaa price list), connectivity prose with a "where it stops" aside, clinic types, proof, the study, FAQ, related links, closing. The testimonial slot holds rating badges because no Maldivian testimonial is on record and every testimonial on the live page is placed elsewhere (spec 2.4).'
  - 'Owner decision 2026-10-14: unconfirmed claims are removed. Cut: "works online or offline" (H1), offline mode, "even with no signal", "syncs the moment the connection returns" (migration/research/facts.md: Easy Clinic does not run fully offline today; the offline FAQ now answers No); "can be set up for Aasandha workflows" and automated Aasandha claims; English and Dhivehi; rufiyaa pricing. Aasandha and Ministry of Health reporting are described as what they ask of the clinic, with no Easy Clinic status claimed.'
  - 'Copy errors on the live page corrected: "Local Payments and MUR Billing ... Maldivian rupees ... MCB Juice" (Mauritian currency and wallet; cut), "clinic groups across Port Louis, Curepipe" (Mauritius; now Male, Hulhumale, Addu City and the atolls), and "Care That Reaches the Outer Atolls" whose body repeated the AI documentation card (now the teleconsultation line).'
  - 'FAQ: the live page has five questions; country pages carry 8 to 10. Kept: Male and other islands, get started (without rufiyaa). Rewritten honestly: offline (now No). Cut: Aasandha, Dhivehi. Added from the live page''s own lines: connecting islands (its positioning line), atoll teleconsultation, pharmacy across sites, AI notes, reminders, data privacy (its security line and data promise; "consent handling and audit trails" left out as unconfirmed).'
  - 'Edits the publish rules required: banned words removed ("seamless", "streamline", "comprehensive", "end-to-end", "robust"); "EasyClinic" written as "Easy Clinic"; "proven results" cut (claims rule).'
  - 'Contact: no Maldives contact or office is on record (src/data/countries/mv.yaml); the card names the Easy Clinic support team and its main line. There is no Maldives demo page; demo CTAs go to the countries page demo form.'
