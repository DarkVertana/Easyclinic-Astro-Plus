faqHeading: Questions Maldivian clinic owners ask
faqHelp: Message our India WhatsApp line on +91 91477 70277, or ask the team that sets up and supports your clinic.
faq:
  - question: Is Easy Clinic suitable for clinics in Male and other islands in the Maldives?
    answer: >-
      Yes. Easy Clinic runs clinics, resort health centres and island facilities in Male, Hulhumale, Addu City and across the atolls. One login covers every specialty, and each role works from its own queue. It runs in any browser on a laptop or tablet, so there is nothing to install at each site.
  - question: Can Easy Clinic connect clinics on different islands?
    answer: >-
      Yes. Each site sits in a location dropdown under the same login, with shared patient records and one shared stock. A patient seen in Male can be seen on another island with the full history on screen. Enterprise adds central control of every location and a Power BI data warehouse for clinic groups.
  - question: How much does Easy Clinic cost in the Maldives?
    answer: >-
      Easy Clinic is priced per doctor. Professional is $79 and Premium $99 per doctor per month, billed annually, and Enterprise is on a quote. Every plan includes a login for your receptionist at no extra cost, and there is no setup fee for clinics up to 5 users. Ask us for rufiyaa pricing.
  - question: How does Easy Clinic handle Aasandha billing?
    answer: >-
      Easy Clinic keeps billing clean and traceable for every claim. The patient's scheme is linked at registration, and each claim is built from the visit and the bill with the documents attached. Insurance claims come with Enterprise, or as an add-on. Ask the team about the current Aasandha connection during your demo.
  - question: Can patients on outer atolls see a doctor in Male?
    answer: >-
      Yes. Premium and Enterprise include built-in video consultations, booked from the same calendar as in-person visits. Patients on outer atolls can see a doctor in Male, and every video visit stays on the same patient record. Prescriptions from a video visit go to the patient on WhatsApp.
  - question: Does Easy Clinic track pharmacy stock across island sites?
    answer: >-
      Yes. Each site's pharmacy sees the prescription before the patient arrives. Batches that expire first show on top, and stock drops only when medicine is dispensed. Reorder alerts warn you before a site runs out, and transfers move stock between islands with a full record.
  - question: Does Easy Clinic help doctors with notes and prescriptions?
    answer: >-
      Yes. Ready Rx, shortcut keys and investigation profiles help the doctor finish a prescription in under 30 seconds, printed or sent on WhatsApp. Cura AI, a paid add-on, flags what does not add up and suggests diagnosis and treatment. The doctor always makes the final decision.
  - question: Does Easy Clinic work for island clinics with weak internet?
    answer: >-
      Easy Clinic is cloud-based software, so each site needs an internet connection, and it does not run fully offline today. Island clinics usually keep a mobile data hotspot as a backup line, so registration, prescriptions and billing carry on if the main connection drops.
  - question: Is patient data private on Easy Clinic?
    answer: >-
      Yes. Role-based access keeps records private across every island site, with audit logs and encryption in transit and at rest. Easy Clinic lists compliance with HIPAA and GDPR. We never sell your data, and all records belong only to your clinic.
  - question: How can clinics in the Maldives get started?
    answer: >-
      Book a 20-minute demo built around your own clinic day. Most clinics go live within 2 to 4 weeks. Easy Clinic builds your prescription format from your own sample, imports your old records and trains each role, and your dedicated account manager stays with you after go-live.

