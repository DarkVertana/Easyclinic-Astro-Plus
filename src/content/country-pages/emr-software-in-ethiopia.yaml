notes:
  - 'Source: the live https://www.easyclinic.io/emr-software-in-ethiopia/ (fetched 2026-10-14). Sections and wording are the live page''s, in a new order, one block type per section.'
  - 'Owner decision 2026-10-14: unconfirmed claims are removed, not copied. Cut: "Works offline" (H1), offline and mobile mode, sync when back online, offline-first design (migration/research/facts.md: Easy Clinic does not run fully offline today); Telebirr, CBE Birr and ETB billing; the Amharic and English interface and bilingual prescriptions; compliance with the Personal Data Protection Proclamation 2024 (the law itself is described, no compliance is claimed); "low-bandwidth performance". The FAQs on those topics are left out, which also brings the FAQ to the 8 to 10 that country pages carry (the live page has 15).'
  - 'Edits the publish rules required: banned words removed ("seamless", "streamline", "comprehensive", "end-to-end", "robust"); "EasyClinic" written as "Easy Clinic"; em dashes in headings replaced; headings in sentence case; "proven results" cut (claims rule); "Learn More" buttons given descriptive labels; the teleconsultation and reports FAQ answers extended with the live page''s own lines so each is a full sentence of at least 12 words.'
  - '"For clinic groups across Port Louis, Curepipe and beyond" on the live Ethiopia page was copied from the Mauritius page; it reads "across Addis Ababa and beyond".'
  - 'Testimonials: of the six on the live page, Dr V Ramanathan and Dr S. B. Bhattacharyya are placed only on the home page (which may share), so they appear here. Dr J. J. Thakkar, Dr Prantar Chakrabarti, Dr Seetha Lakshmi Kolanakuduru and Dr T. L. Prabhu are already placed on other pages (spec 2.4).'
  - 'Contact: no Ethiopia contact or office is on record (src/data/countries/et.yaml), so the hero card names the Easy Clinic support team and its main line. There is no Ethiopia demo page; demo CTAs go to the countries page demo form.'
  - 'Not carried over: the feature chip list and the specialty list (both on the home page and in the footer) and the contact form.'
