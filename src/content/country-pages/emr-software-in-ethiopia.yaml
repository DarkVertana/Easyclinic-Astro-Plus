faqHeading: You have questions, we have answers
faq:
  - question: Is Easy Clinic suitable for clinics in Addis Ababa and across Ethiopia?
    answer: >-
      Yes. Easy Clinic works for clinics, health centres and hospitals in Addis Ababa, Dire Dawa, Bahir Dar,
      Hawassa and rural regions.
  - question: Is Easy Clinic suitable for clinics in Mekelle and Adama?
    answer: >-
      Yes, Easy Clinic works for clinics, health centres and hospitals across Ethiopian cities including
      Mekelle, Adama, Gondar and Jimma, as well as Addis Ababa.
  - question: Is Easy Clinic suitable for a single-doctor clinic in Ethiopia?
    answer: Yes, Easy Clinic works for solo practitioners as well as large multi-location hospital groups.
  - question: Does Easy Clinic support pharmacy and inventory management?
    answer: Yes, Easy Clinic includes pharmacy and inventory tracking as part of its clinic management features.
  - question: Can patients book teleconsultations through Easy Clinic?
    answer: >-
      Yes, Easy Clinic supports teleconsultation alongside in-person appointment scheduling, so it reaches
      patients in regions far from the nearest clinic.
  - question: Does Easy Clinic send automated patient reminders?
    answer: Yes, appointment and follow-up reminders are sent automatically via WhatsApp, SMS and email.
  - question: Can Easy Clinic generate reports on clinic performance?
    answer: >-
      Yes, Easy Clinic provides reports on patient visits, revenue and clinic performance, so owners see
      revenue, patient footfall and clinical trends.
  - question: Is patient data secure on Easy Clinic?
    answer: >-
      Yes, Easy Clinic is a secure, cloud-based platform designed to protect sensitive patient health
      information.
  - question: Can Easy Clinic generate prescriptions quickly?
    answer: Yes, Easy Clinic generates and shares prescriptions in under 30 seconds via print, WhatsApp, SMS or email.

