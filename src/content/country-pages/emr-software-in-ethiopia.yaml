faqHeading: You have questions, we have answers
faqHelp: Message our India WhatsApp line on +91 91477 70277, or ask the team that sets up and supports your clinic.
faq:
  - question: Is Easy Clinic suitable for clinics in Addis Ababa and across Ethiopia?
    answer: >-
      Yes. Easy Clinic runs solo clinics, polyclinics, health centres and clinic chains in Addis Ababa, Dire
      Dawa, Bahir Dar, Hawassa, Mekelle, Adama and beyond. One login covers every specialty, and each role
      works from its own queue. It runs in any browser on a laptop or tablet, so there is nothing to install
      at the clinic.
  - question: How much does Easy Clinic cost in Ethiopia?
    answer: >-
      Easy Clinic is priced per doctor. Professional is $79 and Premium $99 per doctor per month, billed
      annually, and Enterprise is on a quote. Every plan includes a login for your receptionist at no extra
      cost, and there is no setup fee for clinics up to 5 users. Ask us for birr pricing.
  - question: Is patient data secure on Easy Clinic?
    answer: >-
      Yes. Easy Clinic lists compliance with HIPAA and GDPR. Records are protected with role-based access,
      audit logs and encryption in transit and at rest, and each person sees only what their role needs. Your
      patient data belongs to your clinic. We never sell it, and you can export it at any time.
  - question: Does Easy Clinic support pharmacy and inventory management?
    answer: >-
      Yes. The pharmacy queue shows each prescription before the patient arrives. Batches that expire first
      show on top, the pharmacist can adjust quantity before dispensing, and stock drops only when medicine is
      dispensed. Purchase orders, goods receipt, transfers and stock take are built in, and one stock list can
      serve every site.
  - question: Can patients book teleconsultations through Easy Clinic?
    answer: >-
      Yes. Premium and Enterprise include built-in video consultations, booked from the same calendar as
      in-person visits. That helps clinics reach patients in regions far from the nearest clinic, and
      follow-ups stay on the same patient record. Prescriptions from a video visit go to the patient on
      WhatsApp.
  - question: Does Easy Clinic send automated patient reminders?
    answer: >-
      Yes. Appointment and follow-up reminders go out on WhatsApp, SMS or email, the day before and again on
      the day of the visit, never at night. Prescriptions, invoices and lab reports can go on WhatsApp too,
      with a monthly message allowance by plan.
  - question: Can Easy Clinic generate reports on clinic performance?
    answer: >-
      Yes. Owners see revenue, patient footfall, top diagnoses, busiest days and revenue by user on clinical
      and financial dashboards. About 25 standard reports cover clinical, admin and inventory work, and every
      report exports to Excel or PDF. Clinic chains can add a Power BI data warehouse.
  - question: Can Easy Clinic generate prescriptions quickly?
    answer: >-
      Yes. With Ready Rx, shortcut keys and investigation profiles, a doctor finishes a prescription in under
      30 seconds. It prints on your own letterhead or goes to the patient on WhatsApp or email. Medicine
      instructions and advice can print in the language the patient reads.
  - question: Is Cura AI included in every plan?
    answer: >-
      Cura AI is a paid add-on that works with any plan. It runs in the background at registration, triage
      and the consultation. It flags what does not add up, such as a missed allergy, and suggests diagnosis
      and treatment. The clinic sets the triggers and alert style, and the doctor always decides.
  - question: Does Easy Clinic work with a weak internet connection?
    answer: >-
      Easy Clinic is cloud software that runs in the browser, so it needs a connection, and it does not run
      fully offline today. Most clinics keep a mobile data hotspot beside the reception computer as a backup
      line, so registration, prescriptions and billing carry on if the main line drops.

