  # Definition and comparison: a responsive table (cards on phones).
  - discriminant: dataTable
    value:
      id: what-is-ai-emr
      eyebrow: AI EMR and clinic software
      heading: What is AI EMR software and clinic management software in Ethiopia?
      intro: >-
        EMR (electronic medical record) software is the digital record a clinic keeps for each patient. Clinic
        management software runs the day around it: appointments, billing, pharmacy, lab and reports. Easy
        Clinic does both in one system, and Cura AI, an optional add-on, helps the doctor during the visit.
      tone: plain
      wideIntro: true
      variant: compare
      caption: Paper or basic records vs basic clinic software vs AI EMR software in Ethiopia
      columns: [Features, Paper or basic records, Basic clinic software, AI EMR software (Easy Clinic)]
      rows:
        - [Patient records, Files and registers, Records only, '**Full history, every visit by every doctor, and documents kept for life**']
        - [Prescriptions, Handwritten, Typed from scratch, '**Under 30 seconds with Ready Rx and shortcut keys, printed or sent on WhatsApp**']
        - [Billing and payments, Manual receipts, Basic invoices, '**One invoice for consultation, tests and medicines, with part payments and refunds**']
        - [Inventory management, Stock registers, Basic tracking, '**Batches and expiry dates, with stock that drops only when medicine is dispensed**']
        - [Multi-location support, Separate files per site, Limited, '**One login with a location dropdown and shared stock**']
        - [Analytics, Counted by hand, A few reports, '**Clinical and financial dashboards and about 25 standard reports**']
        - [Communication, Phone calls, SMS, '**WhatsApp, SMS, email and video consultations**']
        - [Clinical AI, None, None, '**Cura AI, a paid add-on that flags and suggests while the doctor decides**']
        - [Scalability, One room, Small clinics, '**A solo clinic to a 250-clinic chain**']

