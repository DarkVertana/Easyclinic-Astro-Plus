notes:
  - 'Structure follows /emr-software-in-kenya/: hero with contact card, local proof strip (contactCard), rules (Kenya: regulatorTable), money (Kenya: countryMoney), connectivity prose with a "where it stops" aside, clinic types, a single local testimonial, the study, FAQ, related links, closing. Two substitutions: rules are a dataTable because no my-* regulator files exist (a regulatorTable would render unknown statuses, which fail a published build), and money is a moduleGrid of billing and claims because no MYR price list exists and the USD price is not confirmed for Malaysia.'
  - 'Owner decision 2026-10-14 (as for Ethiopia and Ghana): unconfirmed claims are removed. Cut: PDPA compliance ("ensures PDPA compliance", "aligned with the PDPA", the PDPA FAQ answer "Yes"); Malay, English, Mandarin and Tamil support and the multilingual FAQ; MYR billing, FPX and DuitNow; "plans are priced in Malaysian ringgit". The PDPA and its amendments are described as rules for the clinic, with no Easy Clinic status claimed.'
  - 'Added from the repo, not the live page: "does not run fully offline today" (migration/research/facts.md), in the Kenya-style "Where it stops" aside; Qualitas Health as the named client (testimonials/hisham-ismail.yaml).'
  - 'Edits the publish rules required: banned words removed ("seamless", "streamline", "comprehensive", "end-to-end", "robust", "modern clinics"); "EasyClinic" written as "Easy Clinic"; "proven results" cut (claims rule); headings in sentence case. "Key Benefits of Using EMR Software in Mauritius" and "clinic groups across Port Louis, Curepipe" on the live Malaysia page were copied from the Mauritius page and are corrected to Malaysia.'
  - 'Testimonial: Hisham Ismail (Qualitas Health, Malaysia) moved here from /emr-software-in-fiji/, because spec 2.4 places each testimonial on the page it praises. The other six on the live page are placed elsewhere or are not Malaysian.'
  - 'FAQ: 10 of the live page''s 14, leaving out PDPA, multilingual, Petaling Jaya and Ipoh (covered by the first answer) and prescriptions (in the prose).'
  - 'Contact: no Malaysia contact or office is on record (src/data/countries/my.yaml); the card names the Easy Clinic support team and its main line. There is no Malaysia demo page; demo CTAs go to the countries page demo form.'
