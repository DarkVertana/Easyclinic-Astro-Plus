      heading: Teleconsultation, reminders and AI documentation
      body: |
        **Teleconsultation.** Teleconsultation extends care to patients beyond the clinic walls, alongside in-person appointment scheduling.

        **Reminders.** Patients today expect fast prescriptions, WhatsApp reminders and instant access to their treatment history. Appointment and follow-up reminders are sent automatically via WhatsApp, SMS and email, and prescriptions are shared in seconds via print, WhatsApp, SMS or email.

        **AI documentation.** AI assists clinical documentation and prescriptions, cutting the time doctors spend on admin instead of caring for patients, with automatic notes, reminders and visit summaries.

