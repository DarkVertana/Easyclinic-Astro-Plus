faqHeading: Questions Malaysian clinic owners ask
faq:
  - question: Is Easy Clinic suitable for clinics in Kuala Lumpur and across Malaysia?
    answer: >-
      Yes. Easy Clinic works for clinics, GP practices, polyclinics and hospitals in Kuala Lumpur, Petaling
      Jaya, Johor Bahru, Penang, Ipoh, Kota Kinabalu, Kuching and across Malaysia.
  - question: Does Easy Clinic work for multi-location clinic chains in Malaysia?
    answer: >-
      Yes. The clinic management software centralises records, billing and reporting across every branch,
      giving owners one real-time view of all locations.
  - question: Does Easy Clinic support insurance and payor claims in Malaysia?
    answer: Yes, Easy Clinic includes insurance and payor claims management as part of its clinic management features.
  - question: Can patients book teleconsultations through Easy Clinic?
    answer: >-
      Yes, Easy Clinic supports teleconsultation alongside in-person appointment scheduling, extending care to
      patients beyond the clinic walls.
  - question: Is Easy Clinic suitable for a single-doctor clinic in Malaysia?
    answer: Yes, Easy Clinic works for solo practitioners as well as large multi-location hospital groups.
  - question: Does Easy Clinic support pharmacy and inventory management?
    answer: Yes, Easy Clinic includes pharmacy, inventory and logistics tracking as part of its clinic management features.
  - question: Does Easy Clinic send automated patient reminders?
    answer: Yes, appointment and follow-up reminders are sent automatically via WhatsApp, SMS and email.
  - question: Can Easy Clinic generate reports on clinic performance?
    answer: >-
      Yes, Easy Clinic provides reports on patient visits, revenue and clinic performance, with dashboards
