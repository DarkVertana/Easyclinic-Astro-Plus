notes:
  - 'Source: the live https://www.easyclinic.io/emr-software-in-ghana/ (fetched 2026-10-14). Sections and wording are the live page''s, in a new order, one block type per section.'
  - 'Owner decision 2026-10-14 (as for Ethiopia): unconfirmed claims are removed. Cut: "NHIS compatible workflows" (the live page''s own FAQ says NHIS claim integration is planned); "Easy Clinic supports integrations including ... Mobile Money" (its own FAQ says Mobile Money is planned); the "best EMR software should support NHIS, Mobile Money" answer. NHIS, the Data Protection Act and Mobile Money are stated as planned, which is what the live page says.'
  - 'Edits the publish rules required: banned words removed ("seamless", "streamline", "comprehensive", "end-to-end", "robust", "modern clinics"); "EasyClinic" written as "Easy Clinic"; em dashes replaced; headings in sentence case; "proven results" cut (claims rule); "Learn More" buttons given descriptive labels; the "confirmed during a demo" and "in progress" sentences cut from the FAQ and compliance copy (non-answer rule). "Ghan" typo and "18 other markets" (the site states 18 countries in total) corrected.'
  - '"Teleconsultation enables remote care across islands" and "records accessible across facilities and islands" were copied from an island-country page; the step reads "for patients who cannot reach the clinic" and the island bullet list is not carried over.'
  - 'FAQ: country pages carry 8 to 10 questions; the live page has 20 across its two FAQ lists. Kept the ten that answer without repeating another.'
  - 'Testimonials: all six on the live page are already placed on other pages (spec 2.4; Hisham Ismail is on /emr-software-in-fiji/), so the page carries the study and the rating badges as its proof instead.'
