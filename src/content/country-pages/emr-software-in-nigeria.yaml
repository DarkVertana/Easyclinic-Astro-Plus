faqHeading: Questions Nigerian clinic owners ask
faq:
  - question: Is Easy Clinic suitable for clinics in Lagos, Abuja and across Nigeria?
    answer: >-
      Yes. Easy Clinic works for clinics, hospitals and multi-branch groups in Lagos, Abuja, Ibadan, Port Harcourt
      and across Nigeria.
  - question: Does Easy Clinic handle HMO claims?
    answer: >-
      Yes. Easy Clinic prepares HMO claims with capitation and fee-for-service detail from the visit, cutting the
      manual work. HMO claims come with the Enterprise plan, or with the claims add-on on Professional and Premium.
  - question: Is Easy Clinic compliant with the Nigeria Data Protection Act 2023?
    answer: >-
      Easy Clinic's NDPA status is not stated on this page, so ask the team before you buy. Under the Act, health
      data is sensitive personal data, and your clinic's duties to the Nigeria Data Protection Commission apply
      whatever software you use.
  - question: Can a multi-branch group run every branch on one system?
    answer: >-
      Yes. One dashboard shows revenue, HMO receivables and patient flow across every branch, and records, pharmacy
      and billing sit in one system instead of separate tools.
  - question: Can patients book teleconsultations through Easy Clinic?
    answer: >-
      Yes. Teleconsultation extends care beyond the clinic walls, alongside in-person appointment scheduling at each
      branch.
  - question: Does Easy Clinic track pharmacy stock across branches?
    answer: Yes. Pharmacy stock is tracked across branches, with automatic reorder alerts before a branch runs out.
  - question: Does Easy Clinic help doctors with notes and prescriptions?
    answer: >-
      Yes. AI drafts the notes and prescriptions, so staff type less, and the AI EMR engine writes reminders and
      visit summaries automatically.
  - question: Does Easy Clinic work without an internet connection?
    answer: >-
      No. Easy Clinic runs in the browser over the internet and does not run fully offline today, so keep a second
      line at the reception desk.
  - question: How can clinics in Nigeria get started?
    answer: Book a free demo to see it in daily use, with guided onboarding from paper to digital.

