notes:
  - 'Structure follows /emr-software-in-kenya/ as the Malaysia, Maldives and Mauritius pages do: hero with contact card, local proof strip (contactCard, cities only), rules (dataTable; ng-* regulator files have no state or date), money (moduleGrid of claims and billing; prices/ngn.yaml is not filled in), connectivity prose with a "where it stops" aside, clinic types, rating badges in the testimonial slot (no Nigerian testimonial on record; every testimonial on the live page is placed elsewhere, spec 2.4), the study, FAQ, related links, closing.'
  - 'Kept, because the repo confirms it: HMO claims (plans.yaml: "Insurance, TPA and HMO claims" on Enterprise, and the claims add-on on Professional and Premium), with the capitation or fee-for-service detail the draft /hospital-management-software-nigeria/ also states.'
  - 'Owner decision 2026-10-14: unconfirmed claims are removed. Cut: "keeps HMO claims clean" and "reconciles what each HMO actually pays" as product promises; "audit-ready records under the NDPA 2023", NDPA alignment and the NDPA FAQ answer "Yes" (ng-ndpa has no state; the FAQ now says the status is not stated); naira billing, online payment gateways and "plans are priced in naira" (Paystack and Flutterwave have no state in countries/ng.yaml).'
  - 'Added from the repo, not the live page: "does not run fully offline today" (migration/research/facts.md), in the aside and an FAQ; the NHIA row (regulators/ng-nhia.yaml).'
  - 'Copy errors on the live page corrected: "clinic groups across Port Louis, Curepipe" (Mauritius; now Lagos, Abuja, Ibadan and Port Harcourt). Banned words removed ("seamless", "streamline", "comprehensive", "end-to-end", "robust"); "EasyClinic" written as "Easy Clinic"; "proven results" cut (claims rule).'
  - 'FAQ: the live page has five questions; country pages carry 8 to 10. Kept: cities, HMO claims (trimmed), get started (without naira). Rewritten honestly: NDPA. Added from the live page''s own lines: multi-branch, teleconsultation, pharmacy across branches, AI notes, and an offline answer.'
  - 'Contact: no Nigeria contact is on record; src/data/countries/ng.yaml now names the Easy Clinic support team and its main line. /nigeriademo/ and /pricing/nigeria/ are drafts, so the demo CTAs go to the countries page form and pricing to /pricing/.'
