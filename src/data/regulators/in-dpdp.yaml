whatItDoes: Sets notice, consent, breach-reporting and grievance duties for clinics that hold patient data. The
  clinic is the data fiduciary; EasyClinic processes data on its behalf.
clinicMustDo: Publish a privacy notice, name a grievance contact and keep consent records.
